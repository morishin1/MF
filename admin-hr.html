<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>入退社 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916b">
  <link rel="stylesheet" href="css/layout.css?v=20260916b">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* ── 一覧 ──
       出すのは5つだけ。氏名・日付・状態・進捗・次の担当。
       「何が終わっていないか」が一目で分かることを優先する */
    .hr-tabs { display:flex; gap:6px; margin:0 0 16px; flex-wrap:wrap; }
    .hr-tabs button { border:1px solid var(--border); border-radius:999px; background:#fff;
                      padding:7px 18px; font-size:13px; font-weight:600; color:var(--muted);
                      cursor:pointer; font-family:inherit; }
    .hr-tabs button.on { border-color:var(--primary); background:var(--primary); color:#fff; }
    .hr-tabs button .n { font-weight:700; margin-left:5px; }

    .hr-table { width:100%; border-collapse:collapse; font-size:13px; }
    .hr-table th { text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
                   padding:0 10px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .hr-table td { padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .hr-table tr.click { cursor:pointer; }
    .hr-table tr.click:hover td { background:var(--soft); }
    .hr-table .nm { font-weight:700; color:var(--primary-dark); }
    .hr-table .sub { display:block; font-size:11.5px; color:var(--muted); font-weight:400; }

    /* 急ぎかどうかは色で出す。数字だけでは伝わらない */
    .hr-due { font-weight:700; white-space:nowrap; }
    .hr-due.soon { color:#9c4221; }
    .hr-due.late { color:#c53030; }
    .hr-due.warn { color:var(--muted); }

    .hr-ph { display:inline-block; border-radius:999px; padding:2px 10px; font-size:11.5px;
             font-weight:600; background:#edf2f7; color:var(--muted); white-space:nowrap; }
    .hr-ph.day1, .hr-ph.lastday { background:#fde8e8; color:#c53030; }
    .hr-ph.prep { background:#fff3e0; color:#9c4221; }
    .hr-ph.done { background:#e8f5ec; color:#256b36; }

    .hr-prog { display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .hr-prog .bar { flex:0 0 56px; height:6px; border-radius:999px; background:#edf2f7; overflow:hidden; }
    .hr-prog .bar span { display:block; height:100%; background:var(--primary); }
    .hr-prog .n { font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); }

    .hr-next { font-size:12.5px; }
    .hr-next .who { color:var(--muted); font-size:11.5px; }
    .hr-next.none { color:#256b36; font-weight:600; }

    /* ── 詳細 ──
       上に「いま何をすればよいか」。その下に担当別のチェックリスト。
       長い説明は置かない */
    .hr-head { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;
               padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .hr-head .who { flex:1; min-width:200px; }
    .hr-head .who .nm { font-size:19px; font-weight:700; color:var(--primary-dark); }
    .hr-head .who .meta { font-size:13px; color:var(--muted); margin-top:3px; }
    .hr-head .ops { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }

    .hr-now { border:1px solid var(--primary); border-radius:10px; background:#f5f9ff;
              padding:13px 16px; margin-bottom:18px; }
    .hr-now .k { font-size:11.5px; color:var(--muted); font-weight:600; }
    .hr-now .t { font-size:15px; font-weight:700; color:var(--primary-dark); margin-top:3px; }
    .hr-now .w { font-size:12.5px; color:var(--muted); margin-top:3px; }
    .hr-now.done { border-color:#b7e0c4; background:#f7fbf8; }
    .hr-now.done .t { color:#256b36; }

    .hr-grp { margin-bottom:18px; }
    .hr-grp > .h { display:flex; align-items:baseline; gap:9px; margin:0 0 8px; }
    .hr-grp > .h b { font-size:13.5px; color:var(--primary-dark); }
    .hr-grp > .h .n { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .hr-grp > .h .who { font-size:11.5px; color:var(--muted); margin-left:auto; }

    .hr-row { display:flex; align-items:center; gap:10px; padding:9px 12px;
              border:1px solid var(--border); border-radius:9px; margin-bottom:6px; }
    .hr-row input[type="checkbox"] { width:auto; margin:0; flex:0 0 auto; cursor:pointer; }
    .hr-row .t { flex:1; min-width:0; font-size:13.5px; font-weight:600; }
    .hr-row .ph { font-size:11px; color:var(--muted); border:1px solid var(--border);
                  border-radius:4px; padding:1px 6px; white-space:nowrap; }
    .hr-row a.go { font-size:12px; color:var(--primary); text-decoration:underline; white-space:nowrap; }
    .hr-row.done { background:#f7fbf8; border-color:#b7e0c4; }
    .hr-row.done .t { font-weight:500; color:var(--muted); text-decoration:line-through; }
    .hr-row .at { font-size:11px; color:var(--muted); white-space:nowrap; }

    .hr-empty { color:var(--muted); font-size:13px; padding:20px 0; }

    /* 上の5つの数。ここだけ見れば「誰か止まっているか」が分かる */
    .hr-kpi { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
    .hr-kpi .box { flex:1 1 120px; border:1px solid var(--border); border-radius:10px;
                   padding:10px 13px; }
    .hr-kpi .box .k { font-size:11.5px; color:var(--muted); }
    .hr-kpi .box .v { font-size:20px; font-weight:700; color:var(--primary-dark);
                      font-variant-numeric:tabular-nums; }
    .hr-kpi .box.warn .v { color:#a05a00; }
    .hr-kpi .box.ok .v { color:#256b36; }

    /* 段階。①〜⑤ の番号と名前 */
    .hr-st { display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
             font-size:12.5px; font-weight:600; }
    .hr-st .n { display:inline-flex; width:20px; height:20px; border-radius:50%;
                align-items:center; justify-content:center; font-size:11px;
                background:var(--primary); color:#fff; }
    .hr-st.complete .n { background:#256b36; }
    .hr-st .sub { display:block; font-size:11px; color:var(--muted); font-weight:400; }
    .hr-stuck { font-size:12px; color:#9c4221; }
    .hr-stuck.none { color:#256b36; }

    /* オリエンテーション・保存期限。一覧の下に、畳まずに並べる */
    .hr-sec { margin-top:18px; }
    .hr-or { border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:8px; }
    .hr-or .t { font-size:13.5px; font-weight:700; color:var(--primary-dark); }
    .hr-or .s { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.7; }
    .hr-or.off { opacity:.55; }
    .hr-or .act { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; align-items:center; }
    .hr-form { display:grid; grid-template-columns:auto 1fr; gap:9px 14px; align-items:center;
               font-size:13px; margin-top:10px; }
    .hr-form label { color:var(--muted); font-size:12px; white-space:nowrap; }
    .hr-form input, .hr-form select, .hr-form textarea { margin:0; font-size:13px; }
    .hr-ret { width:100%; border-collapse:collapse; font-size:13px; }
    .hr-ret th { text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
                 padding:0 9px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .hr-ret td { padding:9px; border-bottom:1px solid var(--border); }
    .hr-ret td.late { color:#c53030; font-weight:700; }
    .hr-ret input[type="number"] { width:80px; margin:0; font-size:13px; }

    /* 書類の保管先。毎回触るものではないので畳んでおく */
    .hr-drive { margin-top:6px; border-top:1px solid var(--border); padding-top:12px; }
    .hr-drive summary { cursor:pointer; font-size:12.5px; color:var(--muted); }
    .hr-drive .in { margin-top:10px; display:flex; flex-direction:column; gap:8px;
                    align-items:flex-start; }
    .hr-drive .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; width:100%; }
    .hr-drive .row input { flex:1; min-width:200px; max-width:340px; font-size:13px;
                           padding:6px 9px; border:1px solid var(--border); border-radius:7px;
                           font-family:inherit; }
    .hr-drive .note { font-size:11.5px; color:var(--muted); }

    @media (max-width:760px) {
      .hr-table thead { display:none; }
      .hr-table tr { display:block; border-bottom:1px solid var(--border); padding:10px 0; }
      .hr-table td { display:block; border:0; padding:2px 0; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">入退社</h1>

  <div id="hr-msg" class="err-text"></div>

  <!-- 一覧 -->
  <div class="card" id="hr-list-card">
    <div class="hr-kpi" id="hr-kpi"></div>
    <div class="hr-tabs" id="hr-tabs"></div>
    <div class="table-scroll">
      <table class="hr-table">
        <thead><tr>
          <th>氏名</th><th>入社／退社日</th><th>状態</th><th>進捗</th>
          <th>次の担当</th><th>止まっているもの</th><th></th>
        </tr></thead>
        <tbody id="hr-rows"><tr><td colspan="7">読み込み中…</td></tr></tbody>
      </table>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-secondary btn-sm" onclick="openNew()">
        <span class="material-symbols-outlined icon-inline">person_add</span>入退社を登録する
      </button>
    </div>
    <div id="hr-new"></div>
  </div>

  <!-- 1人ぶん -->
  <div id="hr-detail"></div>

  <!-- オリエンテーション（本人が入社前に読むもの） -->
  <div class="card hr-sec" id="orientation">
    <h2><span class="material-symbols-outlined">school</span>オリエンテーション
      <span id="or-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      入社予定の方が、入社までに目を通すものです。動画・PDF・リンク・本文を登録できます。
      必須にしたものは、全部の確認が済むまで入社手続きが完了しません。
    </p>
    <div id="or-list"><div class="muted" style="font-size:13px;">読み込み中…</div></div>
    <div id="or-form"></div>
    <div style="margin-top:12px;">
      <button class="btn btn-secondary btn-sm" onclick="openOrForm()">
        <span class="material-symbols-outlined icon-inline">add</span>教材を追加する
      </button>
    </div>
    <div id="or-msg" class="err-text" style="margin-top:8px;"></div>
  </div>

  <!-- 保存期限と削除 -->
  <div class="card hr-sec" id="retention">
    <h2><span class="material-symbols-outlined">auto_delete</span>個人情報の保存期限
      <span id="ret-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      種別ごとに「いつから何か月保存するか」を決めます。期限が来たものはここに出ます。
      自動削除を付けた種別だけ、週1回の点検で自動的に消えます。消した記録は残ります。
    </p>
    <div id="ret-rules"></div>
    <h3 style="font-size:13.5px;margin:20px 0 8px;color:var(--primary-dark);">期限が来ているもの</h3>
    <div id="ret-due"></div>
    <details style="margin-top:16px;">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--muted);">削除の記録</summary>
      <div id="ret-log" style="margin-top:10px;"></div>
    </details>
    <div id="ret-msg" class="err-text" style="margin-top:8px;"></div>
  </div>
</div>

<script src="js/api-client.js?v=20260916b"></script>
<script src="js/layout.js?v=20260916b"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let data = null;
  let tabNow = "onboarding";
  let openId = null;

  KPLayout.init({ active: "hr", roles: ["admin", "owner"] }).then((ctx) => {
    if (!ctx) return;
    // 通知から直接この人を開く（api/hr が出すリンク）
    const q = new URLSearchParams(location.search);
    openId = q.get("id");
    load();
    loadOrientation();
    loadRetention();
    if (location.hash) {
      const box = el(location.hash.slice(1));
      if (box) setTimeout(() => box.scrollIntoView({ behavior: "smooth" }), 300);
    }
  });

  async function load() {
    try {
      data = await API.hrList();
      render();
      if (openId) await showDetail(openId);
    } catch (e) {
      // 表がまだ無いのは、壊れているのではなく「まだ作っていない」。
      // 赤くして「読み込めませんでした」と書くと、直せる人が直しにいかない。
      // この画面を見ているのは管理者なので、やることをそのまま出す
      const setup = e.code === "not_ready";
      el("hr-rows").innerHTML = `<tr><td colspan="6">
        <div class="banner ${setup ? "info" : "err"}">
          <span class="material-symbols-outlined">${setup ? "build" : "error"}</span>
          <div>${setup ? "<b>この機能は、まだ使える状態になっていません。</b><br>" : ""}${
            esc(e.hint || e.message || "読み込めませんでした")}</div>
        </div></td></tr>`;
    }
  }

  function render() {
    renderKpi(data.kpi);
    const counts = {
      onboarding: (data.onboarding || []).length,
      offboarding: (data.offboarding || []).length,
      done: (data.done || []).length,
    };
    el("hr-tabs").innerHTML = (data.tabs || []).map((t) => `
      <button class="${t.key === tabNow ? "on" : ""}" onclick="tab('${t.key}')">
        ${esc(t.label)}<span class="n">${counts[t.key] || 0}</span>
      </button>`).join("");
    renderRows(data[tabNow] || []);
  }

  function tab(key) {
    tabNow = key;
    render();
  }

  /**
   * 上の5つの数。
   * 「全員止まっていない」なら数字を眺めるだけで済む。
   * 誰か止まっていれば、その数が色付きになる
   */
  function renderKpi(k) {
    if (!k) { el("hr-kpi").innerHTML = ""; return; }
    const box = (label, n, cls) => `
      <div class="box ${n ? cls : ""}"><div class="k">${esc(label)}</div><div class="v">${n}名</div></div>`;
    el("hr-kpi").innerHTML =
      box("入社予定", k.planned, "") + box("社労士確認待ち", k.advisor, "warn")
      + box("本人対応待ち", k.employee, "warn") + box("社内準備未完了", k.prep, "warn")
      + box("手続き完了", k.complete, "ok");
  }

  function renderRows(rows) {
    if (!rows.length) {
      el("hr-rows").innerHTML = `<tr><td colspan="7" class="hr-empty">
        ${tabNow === "done" ? "完了したものはまだありません。"
          : "いま進んでいるものはありません。"}</td></tr>`;
      return;
    }
    el("hr-rows").innerHTML = rows.map((r) => {
      const pct = r.progress.total ? Math.round(r.progress.done / r.progress.total * 100) : 0;
      // 入社は5段階、退社はこれまでどおり phase
      const onb = r.kind === "onboarding" && r.stage;
      const stateCell = onb
        ? `<span class="hr-st ${esc(r.stage)}"><span class="n">${r.stageN}</span>${esc(r.stageLabel)}</span>`
        : `<span class="hr-ph ${esc(r.phase)}">${esc(r.phaseLabel)}</span>`;
      const barPct = onb ? r.pct : pct;
      const nextCell = onb
        ? (r.stage === "complete"
            ? `<span class="hr-next none">すべて完了</span>`
            : `<span class="hr-next"><b>${esc(r.nextActorLabel)}</b>${
                r.next && r.nextActors?.includes("admin")
                  ? `<span class="who">：${esc(r.next.title)}${r.next.who ? `（${esc(r.next.who)}）` : ""}</span>` : ""}</span>`)
        : (r.next
            ? `<span class="hr-next">${esc(r.next.role)}：${esc(r.next.title)}
                ${r.next.who ? `<span class="who">（${esc(r.next.who)}）</span>` : ""}</span>`
            : `<span class="hr-next none">すべて完了</span>`);
      const stuckCell = onb
        ? (r.stuck ? `<span class="hr-stuck">${esc(r.stuck)}</span>` : `<span class="hr-stuck none">なし</span>`)
        : "";
      return `
      <tr class="click" onclick="showDetail('${esc(r.id)}')">
        <td><span class="nm">${esc(r.name)}</span>
          <span class="sub">${esc([r.department, r.employmentType].filter(Boolean).join("・"))}</span></td>
        <td><span class="hr-due ${esc(r.urgency)}">${esc(r.due)}</span>${
          onb && r.daysLeft != null && r.stage !== "complete"
            ? `<span class="sub">${r.daysLeft >= 0 ? `あと ${r.daysLeft} 日` : `${-r.daysLeft} 日経過`}</span>` : ""}</td>
        <td>${stateCell}</td>
        <td><span class="hr-prog">
          <span class="bar"><span style="width:${barPct}%"></span></span>
          <span class="n">${onb ? `${barPct}%` : `${r.progress.done}/${r.progress.total}`}</span></span></td>
        <td>${nextCell}</td>
        <td>${stuckCell}</td>
        <td><span class="material-symbols-outlined"
              style="font-size:18px;color:var(--muted);">chevron_right</span></td>
      </tr>`;
    }).join("");
  }

  // ---- 登録 --------------------------------------------------------------------
  function openNew() {
    el("hr-new").innerHTML = `
      <div class="banner" style="display:block;background:var(--soft);margin:14px 0 0;">
        <b>入退社を登録する</b>
        <p class="muted" style="font-size:12.5px;margin:6px 0 10px;">
          登録すると、担当ごとのチェックリストが作られ、担当者にお知らせと「やること」が届きます。
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
          <div style="min-width:200px;">
            <label style="font-size:12px;">対象の方</label>
            <select id="n-emp" style="margin:0;">
              ${(data.people || []).map((p) =>
                `<option value="${esc(p.id)}">${esc(p.name)}${
                  p.department ? `（${esc(p.department)}）` : ""}</option>`).join("")}
            </select>
          </div>
          <div>
            <label style="font-size:12px;">種別</label>
            <select id="n-kind" style="margin:0;width:auto;">
              <option value="onboarding">入社</option>
              <option value="offboarding">退社</option>
            </select>
          </div>
          <div>
            <label style="font-size:12px;">入社日／退社日</label>
            <input id="n-date" type="date" style="margin:0;width:auto;">
          </div>
          <button class="btn btn-primary btn-sm" onclick="doNew(this)">登録して知らせる</button>
          <button class="btn btn-secondary btn-sm" onclick="closeNew()">やめる</button>
        </div>
      </div>`;
  }
  function closeNew() { el("hr-new").innerHTML = ""; }

  async function doNew(btn) {
    const employeeId = el("n-emp").value;
    const kind = el("n-kind").value;
    const targetOn = el("n-date").value || null;
    if (!employeeId) return;
    await run(btn, "登録中…", async () => {
      const r = await API.hrStart({ employeeId, kind, targetOn });
      closeNew();
      tabNow = kind;
      await load();
      if (r.id) await showDetail(r.id);
      say(r.told
        ? `登録しました。担当 ${r.told}名 にお知らせしました。`
        : "登録しました。担当が決まっていないため、お知らせは送っていません。");
    });
  }

  // ---- 1人ぶん ------------------------------------------------------------------
  // 番号は持たない。進み具合だけ（lib/mynumber.js と同じ並び）
  const MN_STATES = [["not_submitted", "未提出"], ["requested", "提出依頼済み"],
                     ["submitted_to_advisor", "社労士提出済み"], ["confirmed", "確認完了"]];
  async function setMynumber(id, sel) {
    try { await API.hrUpdate({ id, mynumber: sel.value }); say("マイナンバーの進み具合を変えました"); }
    catch (e) { say(e.hint || e.message || "変えられませんでした", true); }
  }

  async function showDetail(id) {
    openId = id;
    let d;
    try {
      d = await API.hrOne(id);
    } catch (e) {
      say(e.hint || e.message || "開けませんでした", true);
      return;
    }
    const p = d.procedure;
    const pct = p.progress.total ? Math.round(p.progress.done / p.progress.total * 100) : 0;
    const next = p.groups.flatMap((g) => g.items).find((i) => !i.done);

    el("hr-detail").innerHTML = `
      <div class="card">
        <div class="hr-head">
          <div class="who">
            <div class="nm">${esc(p.name)}</div>
            <div class="meta">
              ${esc(onDay(p))}
              ・<span class="hr-ph ${esc(p.phase)}">${esc(p.phaseLabel)}</span>
              ・${p.progress.done}/${p.progress.total} 完了
              ${p.days != null
                ? `<span class="hr-due ${esc(p.urgency)}"
                     style="margin-left:8px;">${esc(p.due)}</span>` : ""}
            </div>
            ${p.kind === "onboarding" ? `
            <div class="meta" style="margin-top:6px;">
              マイナンバー：
              <select style="width:auto;margin:0;font-size:12.5px;" onchange="setMynumber('${esc(p.id)}', this)">
                ${MN_STATES.map(([k, l]) => `<option value="${k}" ${k === p.mynumber ? "selected" : ""}>${l}</option>`).join("")}
              </select>
              <span class="muted" style="font-size:11.5px;">番号は持ちません。社労士側で収集・管理します</span>
            </div>` : ""}
          </div>
          <div class="ops">
            <button class="btn btn-secondary btn-sm" onclick="editDate('${esc(p.id)}','${esc(p.targetOn || "")}')">
              日付を変える</button>
            <button class="btn btn-secondary btn-sm" onclick="remind('${esc(p.id)}', this)">
              もう一度知らせる</button>
            ${p.kind === "onboarding" ? `
            <button class="btn btn-secondary btn-sm" onclick="payroll('${esc(p.employeeId)}', this)">
              MF給与の取込CSV</button>` : ""}
            <button class="btn btn-secondary btn-sm" onclick="closeDetail()">閉じる</button>
          </div>
        </div>

        <div class="hr-now ${next ? "" : "done"}">
          <div class="k">次にやること</div>
          ${next
            ? `<div class="t">${esc(next.ownerLabel)}：${esc(next.title)}</div>
               <div class="w">${next.assignee ? esc(next.assignee.name) : "担当が決まっていません"}
                 ${next.href ? `　<a href="${esc(next.href)}">この画面で行う</a>` : ""}</div>`
            : `<div class="t">すべて終わりました</div>`}
        </div>

        <div id="hr-date"></div>

        ${p.groups.map((g) => `
          <div class="hr-grp">
            <div class="h">
              <b>${esc(g.label)}</b>
              <span class="n">${g.done}/${g.total}</span>
              ${g.items[0]?.assignee ? `<span class="who">${esc(g.items[0].assignee.name)}</span>` : ""}
            </div>
            ${g.items.map((i) => `
              <label class="hr-row ${i.done ? "done" : ""}">
                <input type="checkbox" ${i.done ? "checked" : ""}
                       onchange="toggle('${esc(p.id)}','${esc(i.id)}', this)">
                <span class="t">${esc(i.title)}</span>
                ${i.phase === "day1" ? '<span class="ph">初日</span>'
                  : i.phase === "lastday" ? '<span class="ph">退社日</span>' : ""}
                ${i.href ? `<a class="go" href="${esc(i.href)}"
                   onclick="event.stopPropagation()">開く</a>` : ""}
                ${i.done && i.completedAt
                  ? `<span class="at">${esc(fmt(i.completedAt))}</span>` : ""}
              </label>`).join("")}
          </div>`).join("")}

        <!-- 書類の保管先。
             毎回触るものではないので畳んでおく。
             ここを消すと、個人フォルダを作る場所も、社労士に渡す場所も
             どこにも無くなる -->
        <details class="hr-drive">
          <summary>書類の保管先（Googleドライブ）</summary>
          <div class="in">
            ${p.drive?.link
              ? `<a class="btn btn-secondary btn-sm" href="${esc(p.drive.link)}"
                   target="_blank" rel="noopener">フォルダを開く</a>`
              : `<button class="btn btn-secondary btn-sm"
                   onclick="makeFolder('${esc(p.id)}', this)">個人フォルダ一式を作る</button>`}
            <div class="row">
              <input type="text" id="dv-url" placeholder="ドライブのフォルダURLを貼る"
                     style="margin:0;">
              <button class="btn btn-secondary btn-sm" onclick="setFolder('${esc(p.id)}', this)">
                貼る</button>
            </div>
            <div class="row">
              <input type="email" id="dv-sr" placeholder="社労士のメールアドレス"
                     value="${esc(p.drive?.advisor || "")}" style="margin:0;">
              <button class="btn btn-secondary btn-sm" onclick="shareSr('${esc(p.id)}', this)">
                社会保険のフォルダだけ共有</button>
            </div>
            ${p.drive?.advisorAt
              ? `<div class="note">${esc(fmt(p.drive.advisorAt))} に
                   ${esc(p.drive.advisor)} へ共有済み</div>` : ""}
          </div>
        </details>
      </div>`;
    // 上のバーは画面に固定されている。そのぶん引いてから寄せないと、
    // 押した直後に、いちばん見たい氏名と期日がバーの裏に隠れる
    const top = el("hr-detail").getBoundingClientRect().top + window.scrollY;
    const bar = document.querySelector(".topbar")?.offsetHeight || 0;
    window.scrollTo({ top: Math.max(0, top - bar - 12), behavior: "smooth" });
  }

  function closeDetail() {
    el("hr-detail").innerHTML = "";
    openId = null;
    history.replaceState(null, "", location.pathname);
  }

  async function toggle(id, itemId, box) {
    const done = box.checked;
    box.closest(".hr-row").classList.toggle("done", done);
    try {
      await API.hrCheck({ id, itemId, done });
      await load();
      await showDetail(id);
    } catch (e) {
      box.checked = !done;
      say(e.hint || e.message || "変更できませんでした", true);
    }
  }

  function editDate(id, cur) {
    el("hr-date").innerHTML = `
      <div class="banner" style="display:block;background:var(--soft);margin:0 0 16px;">
        <b>入社日／退社日を変える</b>
        <p class="muted" style="font-size:12.5px;margin:6px 0 10px;">
          変えると、担当者にもう一度お知らせが届きます。期限も合わせて動かします。
        </p>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="date" id="d-date" value="${esc(cur)}" style="margin:0;width:auto;">
          <button class="btn btn-primary btn-sm" onclick="doDate('${esc(id)}', this)">変更する</button>
          <button class="btn btn-secondary btn-sm" onclick="el('hr-date').innerHTML=''">やめる</button>
        </div>
      </div>`;
  }

  async function doDate(id, btn) {
    const targetOn = el("d-date").value || null;
    await run(btn, "変更中…", async () => {
      const r = await API.hrUpdate({ id, targetOn });
      await load();
      await showDetail(id);
      say(`日付を変えました。担当 ${r.told || 0}名 に知らせ直しました。`);
    });
  }

  // ---- 書類の保管先 --------------------------------------------------------------
  //
  // 入退社の本筋ではない。毎回触るものでもない。
  // それでも、ここを消すと個人フォルダを作る場所がどこにも無くなるので、
  // 畳んだ中に残してある。中身は前からある api/onboarding を呼ぶだけ
  async function makeFolder(id, btn) {
    await run(btn, "作成中…", async () => {
      await API.updateProcedure({ id, createFolder: true });
      await showDetail(id);
      say("個人フォルダを作りました。");
    });
  }

  async function setFolder(id, btn) {
    const driveUrl = el("dv-url").value.trim();
    if (!driveUrl) return;
    await run(btn, "保存中…", async () => {
      await API.updateProcedure({ id, driveUrl });
      await showDetail(id);
      say("保管先を設定しました。");
    });
  }

  async function shareSr(id, btn) {
    const email = el("dv-sr").value.trim();
    if (!email) return;
    if (!confirm(`${email} に、社会保険・労務のフォルダだけを共有します。\n`
      + "ほかの書類（労働条件・契約、マイナンバー確認書類）は渡りません。\n\nよろしいですか？")) return;
    await run(btn, "共有中…", async () => {
      await API.updateProcedure({ id, shareAdvisor: email });
      await showDetail(id);
      say("社労士に共有しました。");
    });
  }

  async function remind(id, btn) {
    await run(btn, "送信中…", async () => {
      const r = await API.hrUpdate({ id, remind: true });
      say(r.told ? `担当 ${r.told}名 に知らせました。` : "知らせる相手がいませんでした。");
    });
  }

  // ---- 小物 ---------------------------------------------------------------------
  const fmt = (at) => (at ? new Date(at).toLocaleDateString("ja-JP",
    { month: "numeric", day: "numeric" }) : "");

  /**
   * 「10月1日 入社」。
   *
   * 一覧は「入社まで3日」で急ぎかどうかが分かればよいが、
   * 詳細を開いた人は、その日が何日なのかを知りたい。どちらも出す
   */
  function onDay(p) {
    const what = p.kind === "offboarding" ? "退社" : "入社";
    if (!p.targetOn) return `${what}日 未定`;
    const d = new Date(`${p.targetOn}T00:00:00Z`);
    return `${d.toLocaleDateString("ja-JP",
      { month: "long", day: "numeric", timeZone: "UTC" })} ${what}`;
  }

  // ---- MF給与の取込CSV ----------------------------------------------------------
  //
  // 本人が入れた内容から作る。電話・緊急連絡先・扶養家族の氏名・自己紹介は入れない。
  // マイナンバーはそもそも持っていない。出したことは記録に残る
  async function payroll(employeeId, btn) {
    try {
      const { blob, filename } = await run(btn, "作成中…", () => API.payrollCsv([employeeId]));
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      say("CSVを作りました。MF給与の「従業員の取込」から読み込んでください");
    } catch (e) { say(e.hint || e.detail || e.message || "作れませんでした", true); }
  }

  // ---- オリエンテーション -------------------------------------------------------
  let orItems = [];
  let orKinds = [];

  async function loadOrientation() {
    try {
      const r = await API.orientation();
      orItems = r.items || [];
      orKinds = r.kinds || [];
    } catch (e) {
      el("or-list").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">info</span>
           <div>${esc(e.hint || e.detail || e.message)}</div></div>`;
      return;
    }
    renderOrientation();
  }

  function renderOrientation() {
    const on = orItems.filter((i) => i.active !== false);
    el("or-tag").textContent = `${on.length} 件`;
    el("or-tag").className = `kp-chip ${on.length ? "event" : "draft"}`;
    if (!orItems.length) {
      el("or-list").innerHTML = `<div class="muted" style="font-size:13px;">
        まだ登録されていません。会社説明・就業ルール・勤怠の付け方・情報セキュリティなどを入れてください。</div>`;
      return;
    }
    el("or-list").innerHTML = orItems.map((i) => `
      <div class="hr-or ${i.active === false ? "off" : ""}">
        <div class="t">${esc(i.title)}
          <span class="muted" style="font-weight:400;font-size:11.5px;">　${esc(i.kindLabel)}</span>
          ${i.required ? "" : '<span class="muted" style="font-weight:400;font-size:11.5px;">（任意）</span>'}
          ${i.active === false ? '<span class="kp-chip archived" style="margin-left:6px;">停止中</span>' : ""}
        </div>
        ${i.description ? `<div class="s">${esc(i.description)}</div>` : ""}
        <div class="s">${i.url ? esc(i.url) : "本文を登録しています"}　
          確認済み ${i.confirmedCount ?? 0} 名</div>
        <div class="act">
          <button class="btn btn-secondary btn-sm" onclick="openOrForm('${esc(i.id)}')">直す</button>
          ${i.active === false
            ? `<button class="btn btn-secondary btn-sm" onclick="setOrActive('${esc(i.id)}', true, this)">また使う</button>`
            : `<button class="btn btn-secondary btn-sm" onclick="setOrActive('${esc(i.id)}', false, this)">止める</button>`}
        </div>
      </div>`).join("");
  }

  function openOrForm(id) {
    const i = id ? orItems.find((x) => x.id === id) : null;
    el("or-form").innerHTML = `
      <div class="banner" style="display:block;background:var(--soft);margin:14px 0 0;">
        <b>${i ? "教材を直す" : "教材を追加する"}</b>
        <div class="hr-form">
          <label for="or-title">題名</label>
          <input id="or-title" type="text" value="${esc(i?.title || "")}" placeholder="会社説明（動画）">
          <label for="or-kind">種類</label>
          <select id="or-kind" onchange="onOrKind()">
            ${orKinds.map((k) => `<option value="${esc(k.key)}" ${k.key === (i?.kind || "link") ? "selected" : ""}>${esc(k.label)}</option>`).join("")}
          </select>
          <label for="or-url">URL</label>
          <input id="or-url" type="url" value="${esc(i?.url || "")}" placeholder="https://…">
          <label for="or-body">本文</label>
          <textarea id="or-body" rows="5" placeholder="社内ルールなどを直接書く場合">${esc(i?.body || "")}</textarea>
          <label for="or-desc">説明</label>
          <input id="or-desc" type="text" value="${esc(i?.description || "")}" placeholder="入社前に一度ご覧ください">
          <label for="or-req">必須</label>
          <select id="or-req">
            <option value="1" ${i?.required !== false ? "selected" : ""}>必須（確認するまで完了にしない）</option>
            <option value="0" ${i?.required === false ? "selected" : ""}>任意</option>
          </select>
          <label for="or-sort">並び順</label>
          <input id="or-sort" type="number" value="${i?.sortOrder ?? 100}">
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveOr('${esc(i?.id || "")}', this)">保存する</button>
          <button class="btn btn-secondary btn-sm" onclick="closeOrForm()">やめる</button>
        </div>
      </div>`;
    onOrKind();
    el("or-title").focus();
  }

  function closeOrForm() { el("or-form").innerHTML = ""; }

  function onOrKind() {
    const kind = el("or-kind")?.value;
    if (!kind) return;
    // 本文を書くときは URL を、リンク・動画・PDF のときは本文を、触れないようにする
    el("or-url").disabled = kind === "text";
    el("or-body").disabled = kind !== "text";
  }

  async function saveOr(id, btn) {
    el("or-msg").textContent = "";
    const body = {
      title: el("or-title").value, kind: el("or-kind").value,
      url: el("or-kind").value === "text" ? "" : el("or-url").value,
      body: el("or-kind").value === "text" ? el("or-body").value : "",
      description: el("or-desc").value,
      required: el("or-req").value === "1",
      sortOrder: Number(el("or-sort").value) || 100,
    };
    if (id) body.id = id;
    try {
      await run(btn, "保存中…", () => API.orientationSave(body));
      closeOrForm();
      await loadOrientation();
      say("保存しました");
    } catch (e) { el("or-msg").textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  async function setOrActive(id, active, btn) {
    try {
      await run(btn, "…", () => API.orientationSave({ id, active }));
      await loadOrientation();
    } catch (e) { el("or-msg").textContent = e.hint || e.detail || e.message || "変えられませんでした"; }
  }

  // ---- 保存期限と削除 -----------------------------------------------------------
  let ret = null;

  async function loadRetention() {
    try { ret = await API.retention(); }
    catch (e) {
      el("ret-rules").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">info</span>
           <div>${esc(e.hint || e.detail || e.message)}</div></div>`;
      return;
    }
    renderRetention();
  }

  function renderRetention() {
    // 決まりが返ってこない（表がまだ・返事が別物）。黙って落ちない
    if (!Array.isArray(ret?.rules)) {
      el("ret-rules").innerHTML = `<div class="banner warn">
        <span class="material-symbols-outlined">info</span>
        <div>保存期限の設定をまだ読み込めていません。db/071_onboarding_stage2.sql を流してください。</div></div>`;
      return;
    }
    el("ret-tag").textContent = ret.expired ? `期限切れ ${ret.expired} 件` : "期限切れなし";
    el("ret-tag").className = `kp-chip ${ret.expired ? "important" : "event"}`;

    el("ret-rules").innerHTML = `
      <div class="table-scroll"><table class="hr-ret">
        <thead><tr><th>種別</th><th>起点</th><th>保存する月数</th><th>自動削除</th><th></th></tr></thead>
        <tbody>${ret.rules.map((r) => `
          <tr>
            <td><b>${esc(r.label)}</b></td>
            <td class="muted">${esc(r.baseLabel)}から</td>
            <td><input type="number" id="rt-${esc(r.key)}" value="${r.months}" min="1" max="240">
              <span class="muted" style="font-size:11.5px;">か月（既定 ${r.defaultMonths}）</span></td>
            <td><label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;">
              <input type="checkbox" id="ra-${esc(r.key)}" ${r.autoDelete ? "checked" : ""} style="width:auto;margin:0;">
              期限が来たら自動で消す</label></td>
            <td><button class="btn btn-secondary btn-sm" onclick="saveRule('${esc(r.key)}', this)">保存</button></td>
          </tr>`).join("")}
        </tbody></table></div>`;

    const due = ret.schedule || [];
    el("ret-due").innerHTML = !due.length
      ? `<div class="muted" style="font-size:13px;">保存期限を迎えるものはまだありません。</div>`
      : `<div class="table-scroll"><table class="hr-ret">
          <thead><tr><th>氏名</th><th>種別</th><th>期限</th><th>件数</th><th></th></tr></thead>
          <tbody>${due.map((d) => `
            <tr>
              <td>${esc(d.name)}</td><td>${esc(d.label)}</td>
              <td class="${d.expired ? "late" : ""}">${esc(d.dueOn)}
                <span class="muted" style="font-size:11.5px;">${d.expired ? `（${-d.daysLeft} 日経過）` : `あと ${d.daysLeft} 日`}</span></td>
              <td>${d.count}</td>
              <td>${d.expired
                ? `<button class="btn btn-secondary btn-sm"
                     onclick="doDelete('${esc(d.employeeId)}','${esc(d.kind)}','${esc(d.name)}','${esc(d.label)}','${esc(d.dueOn)}', this)">
                     消す</button>`
                : ""}</td>
            </tr>`).join("")}
          </tbody></table></div>`;

    el("ret-log").innerHTML = !(ret.log || []).length
      ? `<div class="muted" style="font-size:12.5px;">まだありません。</div>`
      : `<div class="table-scroll"><table class="hr-ret">
          <thead><tr><th>日時</th><th>氏名</th><th>種別</th><th>対象</th><th>実行</th></tr></thead>
          <tbody>${ret.log.map((l) => `
            <tr><td>${esc(fmt(l.at))}</td><td>${esc(l.name || "—")}</td>
              <td>${esc(l.kindLabel)}</td><td>${esc(l.label || l.target)}</td>
              <td>${esc(l.by)}${l.reason === "expired" ? "（期限）" : ""}</td></tr>`).join("")}
          </tbody></table></div>`;
  }

  async function saveRule(kind, btn) {
    el("ret-msg").textContent = "";
    try {
      await run(btn, "…", () => API.retentionRule({
        kind, months: Number(el(`rt-${kind}`).value),
        autoDelete: el(`ra-${kind}`).checked,
      }));
      await loadRetention();
      say("保存期限を変えました");
    } catch (e) { el("ret-msg").textContent = e.hint || e.detail || e.message || "変えられませんでした"; }
  }

  async function doDelete(employeeId, kind, name, label, dueOn, btn) {
    if (!confirm(`${name} さんの「${label}」を消します。\nこの操作は取り消せません。よろしいですか。`)) return;
    el("ret-msg").textContent = "";
    try {
      const r = await run(btn, "削除中…", () => API.retentionDelete(employeeId, kind, dueOn));
      await loadRetention();
      say(`${r.deleted} 件を削除しました（記録に残しました）`);
      if (r.errors?.length) el("ret-msg").textContent = r.errors.join(" / ");
    } catch (e) { el("ret-msg").textContent = e.hint || e.detail || e.message || "消せませんでした"; }
  }

  function say(msg, bad) {
    el("hr-msg").textContent = msg || "";
    el("hr-msg").style.color = bad ? "#c53030" : "var(--muted)";
  }

  async function run(btn, label, fn) {
    say("");
    try {
      await KPLayout.busy(btn, label, fn);
    } catch (e) {
      say(e.hint || e.message || "うまくいきませんでした", true);
    }
  }
</script>
</body>
</html>
