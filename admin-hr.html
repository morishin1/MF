<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>入社・退職手続き - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911t">
  <link rel="stylesheet" href="css/layout.css?v=20260911t">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">入社・退職手続き</h1>
  <p class="kp-greet-sub">対象者を登録すると、雇用区分に合わせたチェックリストが自動で用意されます。</p>

  <div id="drive-check"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">person_add</span>手続きを始める</h2>

    <div class="inline-controls" style="margin-bottom:12px;">
      <div style="min-width:220px;flex:1;">
        <label>対象者</label>
        <select id="p-employee"></select>
      </div>
      <div>
        <label>種別</label>
        <select id="p-kind">
          <option value="onboarding">入社</option>
          <option value="offboarding">退職</option>
        </select>
      </div>
      <div>
        <label>入社日／退職日</label>
        <input id="p-target" type="date">
      </div>
      <div>
        <button class="btn btn-primary" onclick="createProcedure(this)">
          <span class="material-symbols-outlined icon-inline">playlist_add</span>作成
        </button>
      </div>
    </div>
    <div id="p-msg" class="err-text"></div>

    <details style="margin-top:6px;">
      <summary class="muted" style="cursor:pointer;font-size:13px;">名簿にいない人を追加する（内定者など）</summary>
      <div class="inline-controls" style="margin-top:12px;">
        <div><label>氏名</label><input id="e-name" type="text" placeholder="山田 太郎"></div>
        <div><label>メール（任意）</label><input id="e-email" type="email" placeholder="taro@8grp.co.jp"></div>
        <div><label>部署</label><input id="e-dept" type="text" placeholder="管理部"></div>
        <div>
          <label>雇用区分</label>
          <select id="e-type">
            <option>正社員</option><option>契約社員</option><option>パート</option>
            <option>アルバイト</option><option>業務委託</option><option>役員</option><option>その他</option>
          </select>
        </div>
        <div><label>入社日</label><input id="e-joined" type="date"></div>
        <div>
          <button class="btn btn-secondary" onclick="addEmployee(this)">
            <span class="material-symbols-outlined icon-inline">badge</span>名簿に追加
          </button>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0;">
        アカウントとの紐づけは、その人が初めてログインしたあとに管理設定から行います。
      </p>
      <div id="e-msg" class="err-text"></div>
    </details>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">checklist</span>進行中の手続き</h2>
    <div id="upload-msg" class="muted" style="font-size:12.5px;margin-bottom:8px;"></div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<!-- 項目にファイルを付けるための口。行ごとに置くと数十個できるので、1つを使い回す -->
<input id="pick" type="file" multiple style="display:none"
       accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.xls,.xlsx"
       onchange="onPicked(this)">

<script src="js/api-client.js?v=20260911t"></script>
<script src="js/layout.js?v=20260911t"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const OWNER_LABEL = { employee: "本人", hr: "会社", labor_advisor: "社労士" };
  const CATEGORY_ICON = { document: "description", task: "task_alt", account: "key", equipment: "devices" };
  const ITEM_STATUS = { todo: "未着手", submitted: "提出済み", done: "完了", na: "対象外" };

  let employees = [];
  let procedures = [];

  KPLayout.init({ active: "hr", roles: ["admin", "owner"] })
    .then((ctx) => { if (!ctx) return; load(); checkDrive(); });

  async function load() {
    await Promise.all([loadEmployees(), loadProcedures()]);
  }

  // Google ドライブ（人事）の設定。
  // フォルダIDを入れただけでは動かない。そのフォルダをサービスアカウントに
  // 「編集者」で共有する必要がある。どこで止まっているかを、ここに出す。
  // 全部そろっているときは何も出さない（毎回読ませるものではない）
  async function checkDrive() {
    let r;
    try { r = await API.hrDriveCheck(); } catch { return; }
    const box = el("drive-check");
    const ng = (r.steps || []).filter((s) => !s.ok);
    if (!ng.length) { box.innerHTML = ""; return; }

    box.innerHTML = `
      <div class="banner warn" style="margin-bottom:16px;">
        <span class="material-symbols-outlined">settings_alert</span>
        <div>
          <b>Googleドライブ（人事）の自動作成は、まだ使えません。</b>
          各手続きの「フォルダのURLを貼る」で、ご自分で作ったフォルダを指定すれば、
          この設定が無くても本人に渡せます。自動で作りたい場合は、以下を直してください。
          <ul style="margin:8px 0 0;padding-left:18px;line-height:1.9;">
            ${ng.map((s) => `<li><b>${esc(s.label)}</b>：${esc(s.detail)}</li>`).join("")}
          </ul>
          ${r.serviceAccount ? `
            <div style="margin-top:8px;font-size:12px;">
              共有する相手（サービスアカウント）：<code>${esc(r.serviceAccount)}</code>
              ${r.folderUrl ? `　<a href="${esc(r.folderUrl)}" target="_blank" rel="noopener">フォルダを開く</a>` : ""}
            </div>` : ""}
        </div>
      </div>`;
  }

  async function loadEmployees() {
    try {
      const res = await API.listEmployees();
      employees = res.employees || [];
      el("p-employee").innerHTML = employees.length
        ? employees.map((e) =>
            `<option value="${esc(e.id)}">${esc(e.display_name)}${e.department ? `（${esc(e.department)}）` : ""}</option>`
          ).join("")
        : `<option value="">（名簿に誰もいません）</option>`;
    } catch (e) {
      el("p-employee").innerHTML = `<option value="">取得失敗</option>`;
      el("p-msg").textContent = e.detail || e.message;
    }
  }

  async function addEmployee(btn) {
    const msg = el("e-msg");
    msg.textContent = "";
    const display_name = el("e-name").value.trim();
    if (!display_name) { msg.textContent = "氏名を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "追加中…", () => API.createEmployee({
        display_name,
        email: el("e-email").value.trim() || null,
        department: el("e-dept").value.trim() || null,
        employment_type: el("e-type").value,
        joined_on: el("e-joined").value || null,
        status: "invited",
        // ログインアカウントの発行はメンバー画面で行う。
        // ここで作ると、1回しか出せない初回パスワードを出す場所が無い
        createAccount: false,
      }));
      for (const id of ["e-name", "e-email", "e-dept", "e-joined"]) el(id).value = "";
      await loadEmployees();
      msg.textContent = "";
    } catch (e) {
      msg.textContent = e.detail || e.message || "追加に失敗しました";
    }
  }

  async function createProcedure(btn) {
    const msg = el("p-msg");
    msg.textContent = "";
    const employeeId = el("p-employee").value;
    if (!employeeId) { msg.textContent = "対象者を選んでください"; return; }
    try {
      await KPLayout.busy(btn, "作成中…", () => API.createProcedure({
        employeeId,
        kind: el("p-kind").value,
        targetOn: el("p-target").value || null,
      }));
      el("p-target").value = "";
      await loadProcedures();
    } catch (e) {
      msg.textContent = e.error === "procedure_exists"
        ? "この方の同じ種別の手続きはすでにあります"
        : (e.detail || e.message || "作成に失敗しました");
    }
  }

  async function loadProcedures() {
    try {
      const res = await API.listProcedures();
      procedures = res.procedures || [];
      render();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function render() {
    const active = procedures.filter((p) => p.status !== "cancelled");
    if (!active.length) {
      el("list").innerHTML = `<div class="empty">進行中の手続きはありません。</div>`;
      return;
    }
    el("list").innerHTML = active.map(procCard).join("");
  }

  // 社労士連絡用のテキストと Slack投稿文。
  // 本人が入社フォームで1回入れたものから組み立てる。人事に打ち直させない。
  // 送信はしない。何を渡すかを見てから、人がコピーして送る
  async function showBrief(employeeId, btn) {
    if (!employeeId) return;
    const box = [...document.querySelectorAll("[id^='brief-']")]
      .find((d) => d.dataset.emp === employeeId);
    if (!box) return;
    if (box.innerHTML) { box.innerHTML = ""; return; }

    let r;
    try {
      r = await KPLayout.busy(btn, "作成中…", () => API.onboardBrief(employeeId));
    } catch (e) {
      alert(e.hint || e.detail || e.message || "作れませんでした");
      return;
    }

    box.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;">
        ${r.advisor.missing.length ? `
          <div class="banner warn" style="margin-bottom:12px;">
            <span class="material-symbols-outlined">info</span>
            <div>本人の入力がまだ足りません：${r.advisor.missing.map(esc).join("・")}<br>
              このまま送ると、その項目は「（未入力）」のまま渡ります。</div>
          </div>` : ""}

        <div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--primary);">社労士への連絡</div>
        <textarea rows="18" readonly style="margin:6px 0 4px;font-size:12.5px;
                  font-family:ui-monospace,SFMono-Regular,monospace;">${esc(r.advisor.text)}</textarea>
        <button class="btn btn-secondary btn-sm" onclick="copyNear(this)">
          <span class="material-symbols-outlined icon-inline">content_copy</span>コピー
        </button>

        <div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--primary);margin-top:18px;">
          Slackへの投稿</div>
        <textarea rows="9" readonly style="margin:6px 0 4px;font-size:12.5px;">${esc(r.slack)}</textarea>
        <button class="btn btn-secondary btn-sm" onclick="copyNear(this)">
          <span class="material-symbols-outlined icon-inline">content_copy</span>コピー
        </button>

        <p class="muted" style="font-size:11.5px;margin:14px 0 0;line-height:1.8;">
          給与額とマイナンバーは、この文面に含めていません。
          マイナンバーは番号法の対象なので、社労士の指定する方法で別に送ってください。
        </p>
      </div>`;
  }

  // 直前の textarea をコピーする
  function copyNear(btn) {
    const ta = btn.previousElementSibling;
    if (!ta) return;
    navigator.clipboard.writeText(ta.value).then(() => {
      const before = btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-outlined icon-inline">check</span>コピーしました';
      setTimeout(() => { btn.innerHTML = before; }, 1800);
    }).catch(() => {
      ta.select();
      alert("コピーできませんでした。選択されているので、手でコピーしてください。");
    });
  }

  const FOLDER_NAME = {
    "01": "01_採用・履歴書", "02": "02_労働条件・契約", "03": "03_入社提出書類",
    "04": "04_社会保険・労務", "05": "05_その他",
  };

  // 社労士に 04 だけを共有する。メールアドレスを聞いて渡す
  async function shareAdvisor(procId, btn) {
    const email = prompt("社労士のメールアドレス（Google アカウント）を入れてください。\n共有されるのは 04_社会保険・労務 だけです。");
    if (!email) return;
    try {
      await KPLayout.busy(btn, "共有中…", () => API.updateProcedure({ id: procId, shareAdvisor: email }));
      await load();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "共有できませんでした");
    }
  }

  // 本人に、自分のフォルダを渡す。
  // 会社のメールアドレスなら、本人が入社手続きの画面を開いた時点で自動で渡っている。
  // ここを使うのは、入社前で会社アカウントがまだ無い人に、
  // 個人のアドレスで渡すとき。相手を見て決めるので確認を挟む
  async function shareEmployee(procId, email, btn) {
    const to = prompt(
      "本人のメールアドレス（Google アカウント）を入れてください。\n"
      + "渡すのは 01・03・04・05 と機微情報だけです。02_労働条件・契約 は渡しません。",
      email || "");
    if (!to) return;
    try {
      await KPLayout.busy(btn, "共有中…", () => API.updateProcedure({ id: procId, shareEmployee: to }));
      await load();
      alert(`${to} に渡しました。本人の画面から、書類ごとにフォルダを開けるようになります。`);
    } catch (e) {
      alert(e.hint || e.detail || e.message || "共有できませんでした");
    }
  }

  // 管理者がドライブで作ったフォルダのURLを貼る。
  //
  // ドライブでフォルダを作って、本人に共有して、URLをここに貼る。
  // これだけで本人の画面に「フォルダを開く」が出る。
  // サービスアカウントの設定も、共有の自動化も要らない。
  // 誰に見せるかは、ドライブの共有画面で管理者が決める
  async function pasteFolder(procId, current, btn) {
    const url = prompt(
      "Google ドライブのフォルダのURLを貼ってください。\n"
      + "（ドライブでそのフォルダを開いて、アドレス欄をコピー）\n\n"
      + "先に、そのフォルダを本人に「編集者」で共有しておいてください。\n"
      + "空にすると、リンクを外します。",
      current || "");
    if (url === null) return;
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateProcedure({ id: procId, driveUrl: url.trim() }));
      await load();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "保存できませんでした");
    }
  }

  // マイナンバー確認書類だけを入れる場所。任意。
  // 貼らなければ、その書類はドライブに置かせず、mf からのアップロードだけになる
  async function pasteSensitiveFolder(procId, current, btn) {
    const url = prompt(
      "マイナンバー確認書類を入れるフォルダのURLを貼ってください。\n\n"
      + "他の書類とは別のフォルダにして、見られる人を絞ってください。\n"
      + "貼らない場合、この書類はドライブではなく mf に出してもらいます（人事だけが見られます）。\n"
      + "空にすると、リンクを外します。",
      current || "");
    if (url === null) return;
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateProcedure({ id: procId, driveSensitiveUrl: url.trim() }));
      await load();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "保存できませんでした");
    }
  }

  function procCard(p) {
    const name = p.employee?.display_name || "（対象者不明）";
    const kind = p.kind === "onboarding" ? "入社" : "退職";
    const pct = p.progress.total ? Math.round((p.progress.done / p.progress.total) * 100) : 0;
    const dateLabel = p.target_on
      ? new Date(p.target_on).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })
      : "日付未定";
    const overdue = p.target_on && p.status !== "done" && new Date(p.target_on) < new Date();

    return `
      <div class="kp-notice" style="margin-bottom:14px;">
        <div class="head">
          <span class="kp-chip ${p.kind === "onboarding" ? "event" : "archived"}">${kind}</span>
          ${p.status === "done" ? '<span class="kp-chip">完了</span>' : ""}
          ${overdue ? '<span class="kp-chip important">日付超過</span>' : ""}
          <span class="meta">${esc(dateLabel)}　${p.progress.done} / ${p.progress.total} 完了（${pct}%）</span>
        </div>
        <div class="title">${esc(name)}
          ${p.employee?.employment_type ? `<span class="muted" style="font-weight:400;font-size:13px;">　${esc(p.employee.employment_type)}</span>` : ""}
        </div>
        <div class="kp-progress"><span style="width:${pct}%"></span></div>
        <div class="table-scroll" style="margin-top:12px;">
          <table class="kp-items">
            <thead><tr>
              <th>項目</th><th>担当</th><th>状態</th><th>社労士</th><th></th>
            </tr></thead>
            <tbody>${(p.items || []).map((i) => itemRow(p, i)).join("")}</tbody>
          </table>
        </div>
        ${profileBlock(p)}
        <div id="brief-${esc(p.id)}" data-emp="${esc(p.employee?.id || "")}"></div>
        ${p.drive_folders ? `
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px;">
            ${Object.entries(FOLDER_NAME).map(([k, n]) => p.drive_folders[k]
              ? `<a class="kp-chip" href="https://drive.google.com/drive/folders/${esc(p.drive_folders[k])}"
                    target="_blank" rel="noopener" style="text-decoration:none;">${esc(n)}</a>` : "").join("")}
            ${p.drive_sensitive_folder_id
              ? `<a class="kp-chip important" href="https://drive.google.com/drive/folders/${esc(p.drive_sensitive_folder_id)}"
                    target="_blank" rel="noopener" style="text-decoration:none;">機微情報（別置き）</a>` : ""}
          </div>
          <div class="muted" style="font-size:11.5px;margin-bottom:3px;">
            ${(p.drive_folders._sharedWith || []).length
              ? `本人に共有済み：${esc((p.drive_folders._sharedWith || []).join("、"))}`
              : "本人にはまだ渡していません（会社のアドレスなら、本人が画面を開いた時点で自動で渡ります）"}
          </div>
          <div class="muted" style="font-size:11.5px;margin-bottom:8px;">
            ${p.advisor_shared_to
              ? `04_社会保険・労務 を ${esc(p.advisor_shared_to)} に共有済み（${esc(new Date(p.advisor_shared_at).toLocaleDateString("ja-JP"))}）`
              : "社労士には、04_社会保険・労務 だけを共有できます。機微情報は共有されません"}
          </div>` : ""}

        ${!p.drive_folders ? `
          <div class="kp-drive" style="margin:10px 0 4px;">
            <div class="muted" style="font-size:11.5px;line-height:1.9;">
              <b>提出用フォルダ</b>：
              ${p.drive_link
                ? `<a href="${esc(p.drive_link)}" target="_blank" rel="noopener">${esc(p.drive_link)}</a>
                   <br>このリンクが本人の画面に出ます。本人に「編集者」で共有しておいてください。`
                : "まだ貼られていません。ドライブでフォルダを作り、本人に共有して、URLを貼ってください。"}
              <br>
              <b>マイナンバー用</b>：
              ${p.drive_sensitive_folder_id
                ? `<a href="https://drive.google.com/drive/folders/${esc(p.drive_sensitive_folder_id)}"
                      target="_blank" rel="noopener">別フォルダを設定済み</a>`
                : "未設定（マイナンバー確認書類は mf に出してもらいます。人事だけが見られます）"}
            </div>
          </div>` : ""}

        <div class="foot">
          ${p.drive_folders
            ? `<a class="btn btn-secondary btn-sm" href="${esc(p.drive_link)}" target="_blank" rel="noopener">
                 <span class="material-symbols-outlined icon-inline">folder_open</span>個人フォルダ
               </a>
               <button class="btn btn-secondary btn-sm" onclick="shareAdvisor('${esc(p.id)}', this)">
                 <span class="material-symbols-outlined icon-inline">share</span>社労士に04を共有
               </button>
               ${p.kind === "onboarding" ? `
                 <button class="btn btn-secondary btn-sm"
                         onclick="shareEmployee('${esc(p.id)}', '${esc(p.employee?.email || "")}', this)">
                   <span class="material-symbols-outlined icon-inline">person_add</span>本人にフォルダを渡す
                 </button>` : ""}`
            : `<button class="btn ${p.drive_link ? "btn-secondary" : "btn-primary"} btn-sm"
                       onclick="pasteFolder('${esc(p.id)}', '${esc(p.drive_link || "")}', this)">
                 <span class="material-symbols-outlined icon-inline">link</span>
                 ${p.drive_link ? "フォルダのURLを変える" : "フォルダのURLを貼る"}
               </button>
               ${p.drive_link ? `
                 <button class="btn btn-secondary btn-sm"
                         onclick="pasteSensitiveFolder('${esc(p.id)}', '${esc(p.drive_sensitive_folder_id ? "https://drive.google.com/drive/folders/" + p.drive_sensitive_folder_id : "")}', this)">
                   <span class="material-symbols-outlined icon-inline">lock</span>マイナンバー用のURL
                 </button>` : ""}
               <button class="btn btn-secondary btn-sm" onclick="makeFolder('${esc(p.id)}', this)">
                 <span class="material-symbols-outlined icon-inline">create_new_folder</span>自動で作る
               </button>`}
          ${p.kind === "onboarding" ? `
            <button class="btn btn-secondary btn-sm" onclick="showBrief('${esc(p.employee?.id || "")}', this)">
              <span class="material-symbols-outlined icon-inline">forward_to_inbox</span>社労士連絡・Slack文
            </button>` : ""}
          ${p.status === "done"
            ? `<button class="btn btn-secondary btn-sm" onclick="setProcStatus('${esc(p.id)}','in_progress',this)">進行中に戻す</button>`
            : `<button class="btn btn-primary btn-sm" onclick="setProcStatus('${esc(p.id)}','done',this)">
                 <span class="material-symbols-outlined icon-inline">done_all</span>手続きを完了にする
               </button>`}
          <button class="btn btn-danger btn-sm" onclick="removeProc('${esc(p.id)}')">
            <span class="material-symbols-outlined icon-inline">delete</span>削除
          </button>
        </div>
      </div>`;
  }

  function itemRow(p, i) {
    const cls = i.status === "done" || i.status === "na" ? "done" : (i.status === "submitted" ? "submitted" : "");
    return `
      <tr class="${cls}">
        <td>
          <span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;color:var(--muted);">
            ${CATEGORY_ICON[i.category] || "circle"}</span>
          ${esc(i.title)}${i.required ? "" : ' <span class="muted" style="font-size:11px;">任意</span>'}
          ${i.submitted_at ? `<span class="muted" style="font-size:11px;margin-left:6px;">
              ${esc(new Date(i.submitted_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))} 提出</span>` : ""}
          ${(i.files || []).length === 0 && (i.status === "submitted" || i.status === "done")
            ? `<br><span class="muted" style="font-size:11px;">
                 書類は付いていません（紙で受け取ったか、状態だけ変えたものです）。
                 右の <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">upload_file</span> から付けられます</span>`
            : ""}
          ${(i.files || []).map((f) =>
            `<br><a href="#" style="font-size:11.5px;" onclick="openFile('${esc(f.id)}');return false;">
               <span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px;">attach_file</span>${esc(f.drive_name || f.filename)}</a>
             ${f.drive_folder_key ? `<span class="muted" style="font-size:10.5px;margin-left:4px;">${
               f.drive_folder_key === "sensitive" ? "機微情報" : esc(FOLDER_NAME[f.drive_folder_key] || f.drive_folder_key)}</span>` : ""}
             ${f.drive_link ? `<a href="${esc(f.drive_link)}" target="_blank" rel="noopener" style="font-size:10.5px;margin-left:4px;">Drive</a>` : ""}`).join("")}
        </td>
        <td>${esc(OWNER_LABEL[i.owner] || i.owner)}</td>
        <td>
          <select onchange="setItemStatus('${esc(i.id)}', this.value)">
            ${Object.entries(ITEM_STATUS).map(([k, v]) =>
              `<option value="${k}"${i.status === k ? " selected" : ""}>${v}</option>`).join("")}
          </select>
        </td>
        <td style="text-align:center;">
          <input type="checkbox" style="width:auto;" ${i.share_with_advisor ? "checked" : ""}
                 onchange="setItemShare('${esc(i.id)}', this.checked)">
        </td>
        <td style="text-align:right;white-space:nowrap;">
          <button class="icon-btn" title="ファイルを付ける" onclick="attach('${esc(i.id)}')">
            <span class="material-symbols-outlined" style="font-size:18px;">upload_file</span>
          </button>
          <button class="icon-btn" title="項目を削除" onclick="removeItem('${esc(i.id)}')">
            <span class="material-symbols-outlined" style="font-size:18px;">close</span>
          </button>
        </td>
      </tr>`;
  }

  // ---- 本人が出した届出 -------------------------------------------------------
  //
  // 住所・生年月日・連絡先・口座・扶養家族。
  // 社会保険と雇用保険の資格取得届、給与の登録、年末調整の全部がここを見る。
  // 出してもらったのに管理画面から読めないと、結局本人に聞き直すことになる。
  //
  // 既定では畳んでおく。開いた人だけが見る。
  // 社労士（advisor.html）には返らない（gw_onboard_profiles の RLS）
  const YESNO = (v) => (v === true ? "はい" : v === false ? "いいえ" : "—");
  const val = (v) => (v === null || v === undefined || v === "" ? "—" : String(v));

  function profileBlock(p) {
    if (p.kind !== "onboarding") return "";
    const f = p.profile;
    if (!f) {
      return `<p class="muted" style="font-size:12px;margin:10px 0 0;">
                本人の届出はまだ出ていません。</p>`;
    }

    const row = (k, v) => `<tr><th style="text-align:left;white-space:nowrap;padding:3px 14px 3px 0;
                                font-weight:500;color:var(--muted);">${k}</th>
                             <td style="padding:3px 0;">${esc(val(v))}</td></tr>`;
    const table = (rows) => `<table style="font-size:12.5px;border-collapse:collapse;">${rows}</table>`;

    const yen = (n) => (n === null || n === undefined || n === "" ? "—"
      : `${Number(n).toLocaleString("ja-JP")}円`);

    return `
      <details style="margin:12px 0 4px;">
        <summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--primary-dark);">
          本人が出した届出${f.status === "submitted" ? "" : "（記入中）"}
        </summary>
        <div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:10px;">
          <div>
            <div style="font-size:12px;font-weight:600;margin-bottom:4px;">本人</div>
            ${table(
              row("氏名（カナ）", f.name_kana)
              + row("生年月日", f.birth_date ? `${f.birth_date}（${age(f.birth_date)}歳）` : null)
              + row("郵便番号", f.postal_code)
              + row("住所", f.address)
              + row("電話", f.phone))}
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;margin-bottom:4px;">緊急連絡先</div>
            ${table(row("お名前", f.emg_name) + row("続柄", f.emg_relation) + row("電話", f.emg_phone))}
            <div style="font-size:12px;font-weight:600;margin:10px 0 4px;">通勤</div>
            ${table(row("出発地", f.commute_from) + row("経路", f.commute_route)
                  + row("1か月の定期代", yen(f.commute_cost)))}
          </div>
          <div>
            <div style="font-size:12px;font-weight:600;margin-bottom:4px;">給与の振込先</div>
            ${table(row("銀行・支店", [f.bank_name, f.bank_branch].filter(Boolean).join(" ") || null)
                  + row("種別・番号", [f.bank_type, f.bank_number].filter(Boolean).join(" ") || null)
                  + row("名義", f.bank_holder))}
            <div style="font-size:12px;font-weight:600;margin:10px 0 4px;">保険</div>
            ${table(row("基礎年金番号", f.pension_number)
                  + row("雇用保険番号", f.employment_ins_number))}
          </div>
        </div>
        ${dependentsBlock(f)}
        ${f.greeting ? `
          <div style="margin-top:12px;">
            <div style="font-size:12px;font-weight:600;margin-bottom:4px;">本人からの一言</div>
            <div style="font-size:12.5px;white-space:pre-wrap;">${esc(f.greeting)}</div>
          </div>` : ""}
      </details>`;
  }

  // 生年月日から今日時点の年齢。社会保険の年齢要件（40歳・65歳・75歳）の目安に使う
  function age(birth) {
    const b = new Date(birth + "T00:00:00");
    if (Number.isNaN(b.getTime())) return "—";
    const t = new Date();
    let a = t.getFullYear() - b.getFullYear();
    const m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
    return a;
  }

  function dependentsBlock(f) {
    const deps = Array.isArray(f.dependents) ? f.dependents : [];
    if (!f.has_dependents && !deps.length) {
      return `<div style="margin-top:12px;font-size:12.5px;">扶養する家族：<b>なし</b></div>`;
    }
    return `
      <div style="margin-top:14px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px;">
          扶養する家族　${deps.length}人</div>
        ${deps.length ? `
          <div class="table-scroll">
            <table class="kp-items" style="font-size:12.5px;">
              <thead><tr>
                <th>氏名</th><th>続柄</th><th>生年月日</th><th>年齢</th>
                <th>同居</th><th>収入見込</th><th>備考</th>
              </tr></thead>
              <tbody>${deps.map((d) => `
                <tr>
                  <td>${esc(val(d.name))}${d.kana ? `<br><span class="muted" style="font-size:11px;">${esc(d.kana)}</span>` : ""}</td>
                  <td>${esc(val(d.relation))}</td>
                  <td>${esc(val(d.birth_date))}</td>
                  <td>${d.birth_date ? esc(String(age(d.birth_date))) : "—"}</td>
                  <td>${esc(YESNO(d.live_together))}</td>
                  <td>${d.income === null || d.income === undefined || d.income === ""
                        ? "—" : esc(Number(d.income).toLocaleString("ja-JP") + "円")}</td>
                  <td>${esc(val(d.note))}</td>
                </tr>`).join("")}</tbody>
            </table>
          </div>` : `<div class="muted" style="font-size:12px;">扶養ありと答えていますが、まだ1人も入っていません。</div>`}
        ${f.dependents_note ? `<div class="muted" style="font-size:12px;margin-top:6px;">補足：${esc(f.dependents_note)}</div>` : ""}
        <p class="muted" style="font-size:11.5px;margin:8px 0 0;">
          マイナンバーはこの画面では扱いません。番号が要るときは、
          扶養控除等申告書とマイナンバー確認書類（機微情報フォルダ）を見てください。
        </p>
      </div>`;
  }

  // ---- 項目にファイルを付ける -------------------------------------------------
  //
  // 「提出済みなのに中身が見えない」の受け皿。
  // 紙で受け取った書類や、メールで送られてきたものを、ここから付けられる。
  // 付けたものは Drive の決まったフォルダにも入る（書類ごとに置き場所が決まっている）。
  // 雇用契約書は 02_労働条件・契約 に入り、本人と会社だけが見られる
  let pendingItem = null;

  function attach(itemId) {
    pendingItem = itemId;
    el("pick").value = "";        // 同じファイルをもう一度選べるように
    el("pick").click();
  }

  async function onPicked(input) {
    const files = [...(input.files || [])];
    const itemId = pendingItem;
    pendingItem = null;
    if (!itemId || !files.length) return;

    const box = el("upload-msg");
    const fail = [];
    for (let n = 0; n < files.length; n++) {
      box.textContent = `${n + 1} / ${files.length} 件目を送っています…`;
      try { await API.uploadProcedureFile(itemId, files[n]); }
      catch (e) { fail.push(`${files[n].name}：${e.hint || e.detail || e.message}`); }
    }
    box.textContent = fail.length ? `送れなかったもの　${fail.join("　")}` : "";
    await loadProcedures();
  }

  async function openFile(fileId) {
    try {
      const { url } = await API.procedureFileUrl(fileId);
      window.open(url, "_blank", "noopener");
    } catch (e) { alert(e.detail || e.message || "開けませんでした"); }
  }

  async function setItemStatus(id, status) {
    try { await API.updateProcedureItem({ id, status }); await loadProcedures(); }
    catch (e) { alert(e.detail || e.message || "更新に失敗しました"); await loadProcedures(); }
  }

  async function setItemShare(id, shareWithAdvisor) {
    try { await API.updateProcedureItem({ id, shareWithAdvisor }); }
    catch (e) { alert(e.detail || e.message || "更新に失敗しました"); await loadProcedures(); }
  }

  async function removeItem(id) {
    if (!confirm("この項目を削除します。よろしいですか？")) return;
    try { await API.deleteProcedureItem(id); await loadProcedures(); }
    catch (e) { alert(e.detail || e.message || "削除に失敗しました"); }
  }

  // Drive に個人フォルダを用意する。GDRIVE_HR_FOLDER_ID が未設定なら理由を出す
  async function makeFolder(id, btn) {
    try {
      await KPLayout.busy(btn, "作成中…", () => API.updateProcedure({ id, createFolder: true }));
      await loadProcedures();
    } catch (e) { alert(e.hint || e.detail || e.message || "フォルダを作れませんでした"); }
  }

  async function setProcStatus(id, status, btn) {
    try {
      await KPLayout.busy(btn, "更新中…", () => API.updateProcedure({ id, status }));
      await loadProcedures();
    } catch (e) { alert(e.detail || e.message || "更新に失敗しました"); }
  }

  async function removeProc(id) {
    const p = procedures.find((x) => x.id === id);
    if (!confirm(`${p?.employee?.display_name || ""} さんの手続きを削除します。項目もすべて消えます。よろしいですか？`)) return;
    try { await API.deleteProcedure(id); await loadProcedures(); }
    catch (e) { alert(e.detail || e.message || "削除に失敗しました"); }
  }
</script>

</body>
</html>
