<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>月初作業管理 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916m">
  <link rel="stylesheet" href="css/layout.css?v=20260916m">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    .ms-sum { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .ms-sum .box { flex:1 1 130px; border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
    .ms-sum .box .k { font-size:11.5px; color:var(--muted); }
    .ms-sum .box .v { font-size:20px; font-weight:700; color:var(--primary-dark); }
    .ms-sum .box.bad .v { color:#c53030; }

    .ms-table { width:100%; border-collapse:collapse; font-size:13px; }
    .ms-table th, .ms-table td { padding:9px 10px; border-bottom:1px solid var(--border); text-align:left; }
    .ms-table th { font-size:11.5px; color:var(--muted); font-weight:700; background:var(--soft); }
    .ms-table .nm { font-weight:700; color:var(--primary-dark); }
    .ms-table .dp { font-size:11px; color:var(--muted); display:block; }
    .ms-table tr.click { cursor:pointer; }
    .ms-table tr.click:hover { background:var(--soft); }

    .ms-mk { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; }
    .ms-mk .material-symbols-outlined { font-size:16px; }
    .ms-mk.ok { color:#2f855a; }
    .ms-mk.no { color:var(--muted); }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">月初作業管理</h1>
  <p class="kp-greet-sub">PP/BPの勤務表・請求書の提出状況をまとめます。詳細な精算チェックは今後追加します。</p>

  <div class="card">
    <div class="inline-controls" style="align-items:center;">
      <div>
        <label>対象年月</label>
        <input id="ms-month" type="month" onchange="load()">
      </div>
      <div class="tabs" style="margin:0;">
        <button id="tab-bp" class="tab active" onclick="setKind('bp', this)">BP</button>
        <button id="tab-pp" class="tab" onclick="setKind('pp', this)">PP</button>
      </div>
    </div>

    <div class="ms-sum" id="ms-sum"></div>

    <div class="table-scroll">
      <table class="ms-table">
        <thead>
          <tr><th>氏名</th><th>所属/上位</th><th>勤務表</th><th>請求書</th><th>提出窓口</th></tr>
        </thead>
        <tbody id="ms-rows"><tr><td colspan="5" class="empty">読み込み中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="ms-detail"></div>
</div>

<script src="js/api-client.js?v=20260916m"></script>
<script src="js/layout.js?v=20260916m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  let rows = [];
  let kind = "bp";
  let openId = null;

  KPLayout.init({ active: "monthstart", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) start(); });

  function start() {
    el("ms-month").value = new Date().toISOString().slice(0, 7);
    load();
  }

  function setKind(k, btn) {
    kind = k;
    for (const b of document.querySelectorAll(".tabs > .tab")) b.classList.toggle("active", b === btn);
    render();
  }

  async function load() {
    const month = el("ms-month").value;
    if (!month) return;
    el("ms-rows").innerHTML = `<tr><td colspan="5" class="empty">読み込み中…</td></tr>`;
    el("ms-detail").innerHTML = "";
    openId = null;
    try {
      const res = await API.listBillingSubmissions(month);
      if (res.notReady) {
        el("ms-rows").innerHTML = `<tr><td colspan="5"><div class="banner warn">
          <span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div></td></tr>`;
        return;
      }
      rows = res.rows || [];
      render();
    } catch (e) {
      el("ms-rows").innerHTML = `<tr><td colspan="5"><div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
    }
  }

  function render() {
    const list = rows.filter((r) => r.engagementKind === kind);

    const timesheetDone = list.filter((r) => r.timesheetReceived).length;
    el("ms-sum").innerHTML = `
      <div class="box"><div class="k">対象人数</div><div class="v">${list.length}</div></div>
      <div class="box${list.length - timesheetDone ? " bad" : ""}"><div class="k">勤務表 未提出</div>
        <div class="v">${list.length - timesheetDone}</div></div>
      <div class="box"><div class="k">勤務表 提出済み</div><div class="v">${timesheetDone}</div></div>`;

    if (!list.length) {
      el("ms-rows").innerHTML = `<tr><td colspan="5" class="empty">対象がありません。</td></tr>`;
      return;
    }
    el("ms-rows").innerHTML = list.map((r) => `
      <tr class="click" onclick="openDetail('${esc(r.employeeId)}','${esc(r.siteContractId)}')">
        <td><span class="nm">${esc(r.employeeName)}</span>${r.department ? `<span class="dp">${esc(r.department)}</span>` : ""}</td>
        <td>${esc(r.siteCompany)}${r.primeCompany ? `<span class="dp">${esc(r.primeCompany)}</span>` : ""}</td>
        <td>${mark(r.timesheetReceived)}</td>
        <td>${mark(r.invoiceReceived)}</td>
        <td>${esc(linkLabel(r.linkStatus))}</td>
      </tr>`).join("");
  }

  function mark(on) {
    return on
      ? `<span class="ms-mk ok"><span class="material-symbols-outlined">check_circle</span>提出済み</span>`
      : `<span class="ms-mk no"><span class="material-symbols-outlined">radio_button_unchecked</span>未提出</span>`;
  }
  function linkLabel(s) {
    return { none: "未発行", active: "発行済み", expired: "期限切れ", revoked: "無効" }[s] || s;
  }

  async function openDetail(employeeId, siteContractId) {
    openId = employeeId;
    const box = el("ms-detail");
    box.innerHTML = `<div class="card" style="margin-top:12px;"><div class="empty">読み込み中…</div></div>`;
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    // 一覧の1回ぶんの取得結果から作る（この人・この契約の行）
    const r = rows.find((x) => x.employeeId === employeeId && x.siteContractId === siteContractId);
    if (!r) { box.innerHTML = ""; return; }
    renderDetail(r);
  }

  function renderDetail(r, freshLink) {
    const linkUrl = freshLink
      ? `${location.origin}/billing-submit.html?token=${encodeURIComponent(freshLink.token)}` : null;

    el("ms-detail").innerHTML = `
      <div class="card" style="margin-top:12px;border:1px solid var(--primary);">
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div style="flex:1;">
            <div style="font-size:16px;font-weight:700;color:var(--primary-dark);">${esc(r.employeeName)}</div>
            <div class="muted" style="font-size:12.5px;margin-top:2px;">
              ${esc(r.siteCompany)}${r.primeCompany ? `　${esc(r.primeCompany)}` : ""}
            </div>
          </div>
          <span class="kp-chip">${esc(linkLabel(r.linkStatus))}</span>
          <button class="btn btn-secondary btn-sm" onclick="closeDetail()">閉じる</button>
        </div>

        ${linkUrl ? `
          <div class="banner ok" style="margin-top:14px;">
            <span class="material-symbols-outlined">key</span>
            <div>
              <b>提出用URLができました。相手に渡すのはいまだけです（このあとは取り出せません）。</b>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
                <input type="text" readonly value="${esc(linkUrl)}" style="flex:1;min-width:220px;margin:0;font-size:12px;"
                       onclick="this.select()">
                <button class="btn btn-secondary btn-sm" onclick="copyText('${esc(linkUrl)}', this)">URLをコピー</button>
              </div>
            </div>
          </div>` : ""}

        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="issueLink('${esc(r.employeeId)}', this)">
            <span class="material-symbols-outlined icon-inline">autorenew</span>
            ${r.linkStatus === "none" ? "窓口を発行" : "窓口を再発行"}
          </button>
          ${r.linkStatus === "active" ? `
            <button class="btn btn-secondary btn-sm" onclick="revokeLink('${esc(r.employeeId)}', this)">
              <span class="material-symbols-outlined icon-inline">block</span>無効化する
            </button>` : ""}
        </div>

        <div style="margin-top:18px;">
          <b style="font-size:13px;">届いたファイル</b>
          <div style="margin-top:8px;">
            ${r.submissions.length ? r.submissions.map((s) => `
              <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
                <span class="kp-chip" style="flex:0 0 auto;">${s.kind === "timesheet" ? "勤務表" : "請求書"}</span>
                <span style="flex:1;">${esc(s.fileName)}</span>
                <span class="muted">${esc(fmtDate(s.submittedAt))}</span>
                <button class="btn btn-secondary btn-sm" onclick="viewFile('${esc(s.id)}', this)">見る</button>
              </div>`).join("")
              : `<p class="muted" style="font-size:12.5px;">まだ届いていません。</p>`}
          </div>
        </div>
      </div>`;
  }

  function closeDetail() { el("ms-detail").innerHTML = ""; openId = null; }

  function fmtDate(s) {
    return s ? new Date(s).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  }

  async function issueLink(employeeId, btn) {
    try {
      const r = await KPLayout.busy(btn, "…", () => API.issueSubmissionLink(employeeId));
      await load();
      const row = rows.find((x) => x.employeeId === employeeId);
      if (row) renderDetail(row, r);
    } catch (e) { alert(e.hint || e.detail || e.message || "発行できませんでした"); }
  }

  async function revokeLink(employeeId, btn) {
    if (!confirm("この人の提出用URLを無効化します。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "…", () => API.revokeSubmissionLink(employeeId));
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "無効化できませんでした"); }
  }

  async function viewFile(id, btn) {
    try {
      const r = await KPLayout.busy(btn, "…", () => API.submissionFileUrl(id));
      window.open(r.url, "_blank", "noopener");
    } catch (e) { alert(e.hint || e.detail || e.message || "開けませんでした"); }
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const orig = btn.textContent;
      btn.textContent = "コピーしました";
      setTimeout(() => { btn.textContent = orig; }, 1800);
    } catch (e) { alert("コピーできませんでした。手で選んでコピーしてください。"); }
  }
</script>

</body>
</html>
