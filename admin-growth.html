<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3か月育成計画 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910q">
  <link rel="stylesheet" href="css/layout.css?v=20260910q">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    .gp-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
              padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .gp-row:last-child { border-bottom:none; }
    .gp-name { font-weight:700; color:var(--primary-dark); }
    .gp-month { border:1px solid var(--border); border-radius:10px;
                padding:14px 16px; margin-bottom:12px; }
    .gp-month.now { border-color:#c3d6ef; background:#fbfcfe; }
    .gp-mhead { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:10px; }
    .gp-no { font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--primary); }
    .gp-kpi { display:grid; grid-template-columns:1fr 92px 84px 70px 84px 34px;
              gap:6px; align-items:center; margin-bottom:6px; }
    .gp-kpi input, .gp-kpi select { margin:0; padding:5px 7px; font-size:12.5px; }
    .gp-kpi .hd { font-size:11px; font-weight:700; color:var(--muted); }
    @media (max-width:760px) {
      .gp-kpi { grid-template-columns:1fr 1fr; }
      .gp-kpi .hd { display:none; }
    }
    .gp-prog { display:flex; align-items:center; gap:8px; font-size:12px; margin:3px 0; }
    .gp-prog .b { flex:1; height:6px; border-radius:3px; background:var(--border); overflow:hidden; }
    .gp-prog .b span { display:block; height:100%; background:var(--primary); }
    .gp-prog .b.hit span { background:#2f855a; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">3か月育成計画</h1>
  <p class="kp-greet-sub">
    労働条件通知書を起点に、3か月の行き先 → 月間KGI/KPI → 今日のKPI までをつなぎます。
    <b>AIが作るのは案までです。確定は本人と話してから押してください。</b>
  </p>

  <div id="notice"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">list</span>計画</h2>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>

  <div id="new-card" class="card hidden">
    <h2><span class="material-symbols-outlined">person_add</span>計画がまだない人</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      期間は、確定済みの労働条件通知書の育成期間から引きます。
      通知書が無ければ入社日から3か月にします。
    </p>
    <div id="new-list"></div>
  </div>

  <div id="detail-card" class="card hidden">
    <h2><span class="material-symbols-outlined">flag</span><span id="d-name">　</span>
      <span id="d-tag" class="kp-chip" style="margin-left:8px;"></span>
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="closeDetail()">閉じる</button>
    </h2>
    <div id="detail"></div>
  </div>
</div>

<script src="js/api-client.js?v=20260910q"></script>
<script src="js/layout.js?v=20260910q"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  let list = null;      // 一覧
  let detail = null;    // 開いている1人ぶん

  KPLayout.init({ active: "growth", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      list = await API.growthPlans();
    } catch (e) {
      el("notice").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>${esc(e.hint || e.detail || e.message)}</div></div>`;
      return;
    }
    el("notice").innerHTML = "";
    renderList();
    renderNew();
  }

  const STATUS = {
    draft: ["相談中", "draft"], active: ["実施中", "event"],
    done: ["終了", ""], cancelled: ["取消", ""],
  };

  function renderList() {
    const rows = list.plans || [];
    if (!rows.length) {
      el("list").innerHTML = `<div class="empty">まだ計画がありません。下の「計画がまだない人」から作れます。</div>`;
      return;
    }
    el("list").innerHTML = rows.map((p) => {
      const [label, cls] = STATUS[p.status] || [p.status, ""];
      return `
        <div class="gp-row">
          <span class="gp-name">${esc(p.name || "—")}</span>
          <span class="kp-chip ${cls}">${esc(label)}</span>
          <span class="muted">${esc(p.startDate)} 〜 ${esc(p.endDate)}</span>
          ${p.status === "active" && !p.days.over
            ? `<span class="muted">残り ${p.days.left} 日</span>` : ""}
          <span style="flex:1;min-width:160px;font-size:12.5px;">
            ${esc(p.threeMonthKgi || "（3か月KGI未設定）")}
          </span>
          <button class="btn btn-secondary btn-sm" onclick="open_('${esc(p.employeeId)}')">開く</button>
        </div>`;
    }).join("");
  }

  function renderNew() {
    const rows = list.candidates || [];
    if (!rows.length) { el("new-card").classList.add("hidden"); return; }
    el("new-card").classList.remove("hidden");
    el("new-list").innerHTML = rows.map((e) => `
      <div class="gp-row">
        <span class="gp-name">${esc(e.name)}</span>
        <span class="muted">${e.joinedOn ? `入社 ${esc(e.joinedOn)}` : "入社日 未登録"}</span>
        <button class="btn btn-primary btn-sm" style="margin-left:auto;"
                onclick="createPlan('${esc(e.id)}', this)">計画を作る</button>
      </div>`).join("");
  }

  async function createPlan(employeeId, btn) {
    try {
      await KPLayout.busy(btn, "作成中…", () => API.growthAct("create", { employeeId }));
      await load();
      await open_(employeeId);
    } catch (e) { alert(e.hint || e.detail || e.message || "作成できませんでした"); }
  }

  // --- 1人ぶん ---------------------------------------------------------------
  async function open_(employeeId) {
    try {
      detail = await API.growthPlans(employeeId);
    } catch (e) { alert(e.hint || e.detail || e.message); return; }
    if (!detail.plan) { alert("計画がありません。"); return; }

    const p = list.plans.find((x) => x.employeeId === employeeId);
    el("d-name").textContent = p?.name || "";
    const [label, cls] = STATUS[detail.plan.status] || [];
    el("d-tag").textContent = label || "";
    el("d-tag").className = `kp-chip ${cls || ""}`;
    el("detail-card").classList.remove("hidden");
    renderDetail();
    el("detail-card").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function closeDetail() { el("detail-card").classList.add("hidden"); detail = null; }

  function renderDetail() {
    const p = detail.plan;
    const draft = p.status === "draft";

    el("detail").innerHTML = `
      <div class="muted" style="font-size:12.5px;margin-bottom:12px;">
        ${esc(p.startDate)} 〜 ${esc(p.endDate)}
        ${p.days.over ? "（期間終了）" : p.days.started ? `・残り ${p.days.left} 日` : "（開始前）"}
      </div>

      ${draft ? `
        <div class="banner warn" style="margin-bottom:14px;">
          <span class="material-symbols-outlined">edit_note</span>
          <div>相談中です。<b>確定するまで、本人の画面にKPIは出ません。</b>
            本人と話して内容を決めてから「確定する」を押してください。</div>
        </div>` : ""}

      <div style="margin-bottom:8px;">
        <label>3か月KGI</label>
        <textarea id="d-kgi" rows="2"
                  placeholder="「○○ができるようになる」の形で書きます">${esc(p.threeMonthKgi || "")}</textarea>
      </div>
      <div style="margin-bottom:14px;">
        <label>メモ（確認したいこと）</label>
        <textarea id="d-note" rows="2">${esc(p.note || "")}</textarea>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
        <button class="btn btn-secondary btn-sm" onclick="saveKgi(this)">
          <span class="material-symbols-outlined icon-inline">save</span>KGIを保存
        </button>
        ${draft && detail.aiConfigured ? `
          <button class="btn btn-secondary btn-sm" onclick="runDraft(this)">
            <span class="material-symbols-outlined icon-inline">auto_awesome</span>AIに案を作らせる
          </button>` : ""}
        ${draft ? `
          <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="approve(this)">
            <span class="material-symbols-outlined icon-inline">check</span>確定する
          </button>` : ""}
      </div>

      ${(detail.months || []).map(monthBlock).join("")}`;
  }

  function monthBlock(m) {
    const now = m.month === new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 7) + "-01";
    const stage = (detail.stages || []).find((s) => s.monthNo === m.monthNo);

    return `
      <div class="gp-month${now ? " now" : ""}">
        <div class="gp-mhead">
          <span class="gp-no">MONTH ${m.monthNo}</span>
          <b style="font-size:13.5px;">${esc(String(m.month).slice(0, 7).replace("-", "/"))}</b>
          ${now ? '<span class="kp-chip event">今月</span>' : ""}
          ${m.progress != null ? `<span class="kp-chip">KGI進捗 ${m.progress}%</span>` : ""}
          <span class="muted" style="font-size:11.5px;">${esc(stage?.title || "")}</span>
          <span style="margin-left:auto;display:flex;gap:6px;">
            ${detail.aiConfigured ? `
              <button class="btn btn-secondary btn-sm"
                      onclick="runNext('${esc(m.id)}', this)">AIに案を作らせる</button>` : ""}
            <button class="btn btn-primary btn-sm"
                    onclick="saveMonth('${esc(m.id)}', this)">この月を保存</button>
          </span>
        </div>

        <div style="margin-bottom:10px;">
          <label>今月のKGI</label>
          <textarea id="m-kgi-${esc(m.id)}" rows="2">${esc(m.kgi || "")}</textarea>
        </div>

        <div class="gp-kpi">
          <span class="hd">KPI</span><span class="hd">種類</span><span class="hd">目標</span>
          <span class="hd">単位</span><span class="hd">重み</span><span class="hd"></span>
        </div>
        <div id="m-kpis-${esc(m.id)}">
          ${(m.kpis.length ? m.kpis : [null]).map((k, i) => kpiRow(m.id, k, i)).join("")}
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;"
                onclick="addKpi('${esc(m.id)}')">
          <span class="material-symbols-outlined icon-inline">add</span>KPIを足す
        </button>

        ${m.kpis.some((k) => k.actual != null) ? `
          <div style="margin-top:14px;">
            <div class="muted" style="font-size:11.5px;font-weight:700;margin-bottom:4px;">いまの実績</div>
            ${m.kpis.filter((k) => k.rate != null).map((k) => `
              <div class="gp-prog">
                <span style="width:104px;">${esc(k.name)}</span>
                <span class="b${k.hit ? " hit" : ""}"><span style="width:${Math.min(100, k.rate)}%"></span></span>
                <span class="muted" style="width:96px;text-align:right;">
                  ${k.actual ?? "—"} / ${k.target ?? "—"}${esc(k.unit || "")}（${k.rate}%）
                </span>
              </div>`).join("")}
          </div>` : ""}
      </div>`;
  }

  function kpiRow(monthId, k, i) {
    const kinds = detail.kinds || [];
    return `
      <div class="gp-kpi" data-row="${monthId}">
        <input type="text" placeholder="KPIの名前" value="${esc(k?.name || "")}" data-f="name">
        <select data-f="kind">
          ${kinds.map((x) =>
            `<option value="${esc(x.key)}"${(k?.kind || "number") === x.key ? " selected" : ""}>${esc(x.label)}</option>`).join("")}
        </select>
        <input type="number" step="0.5" placeholder="目標" value="${k?.target ?? ""}" data-f="target">
        <input type="text" placeholder="件" value="${esc(k?.unit || "")}" data-f="unit">
        <input type="number" step="0.5" min="0.5" value="${k?.weight ?? 1}" data-f="weight" title="重み">
        <button class="btn btn-secondary btn-sm" onclick="this.parentElement.remove()" title="消す">×</button>
      </div>`;
  }

  function addKpi(monthId) {
    el(`m-kpis-${monthId}`).insertAdjacentHTML("beforeend", kpiRow(monthId, null, 0));
  }

  function readKpis(monthId) {
    return [...el(`m-kpis-${monthId}`).querySelectorAll(".gp-kpi")].map((row) => {
      const g = (f) => row.querySelector(`[data-f="${f}"]`)?.value ?? "";
      return {
        name: g("name"), kind: g("kind"), target: g("target"),
        unit: g("unit"), weight: g("weight"),
      };
    }).filter((k) => k.name.trim());
  }

  async function saveKgi(btn) {
    try {
      await KPLayout.busy(btn, "保存中…", () => API.growthAct("saveKgi", {
        planId: detail.plan.id, kgi: el("d-kgi").value, note: el("d-note").value,
      }));
      await reopen();
    } catch (e) { alert(e.hint || e.detail || e.message || "保存できませんでした"); }
  }

  async function saveMonth(monthId, btn) {
    try {
      await KPLayout.busy(btn, "保存中…", () => API.growthAct("saveMonth", {
        monthId, kgi: el(`m-kgi-${monthId}`).value, kpis: readKpis(monthId),
      }));
      await reopen();
    } catch (e) { alert(e.hint || e.detail || e.message || "保存できませんでした"); }
  }

  async function runDraft(btn) {
    if (!confirm("AIに3か月ぶんの案を作らせます。\n" +
                 "すでに書いてあるKGI・KPIは上書きしません。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "作成中…（20秒ほど）", () =>
        API.growthAct("draft", { planId: detail.plan.id }));
      await reopen();
    } catch (e) { alert(e.hint || e.detail || e.message || "作成できませんでした"); }
  }

  // 翌月の案。保存はせず、画面の入力欄に入れるだけ。
  // 見てから直して「この月を保存」を押してもらう
  async function runNext(monthId, btn) {
    try {
      const r = await KPLayout.busy(btn, "作成中…", () =>
        API.growthAct("nextMonth", { monthId }));
      const d = r.draft;
      el(`m-kgi-${monthId}`).value = d.kgi || "";
      el(`m-kpis-${monthId}`).innerHTML = d.kpis.map((k, i) => kpiRow(monthId, {
        name: k.name, kind: k.kind, target: k.target_value, unit: k.unit, weight: 1,
      }, i)).join("");
      alert("案を入れました。まだ保存していません。\n" +
            "内容を確認・修正してから「この月を保存」を押してください。" +
            (d.note ? `\n\nAIのメモ：${d.note}` : ""));
    } catch (e) { alert(e.hint || e.detail || e.message || "作成できませんでした"); }
  }

  async function approve(btn) {
    if (!confirm("この計画を確定します。\n" +
                 "確定すると、本人のホーム画面に今月のKPIが出るようになります。\n" +
                 "本人と内容を共有していますか？")) return;
    try {
      await KPLayout.busy(btn, "確定中…", () => API.growthAct("approve", { planId: detail.plan.id }));
      await load();
      await reopen();
    } catch (e) { alert(e.hint || e.detail || e.message || "確定できませんでした"); }
  }

  async function reopen() {
    const id = detail?.plan?.employeeId;
    await load();
    if (id) await open_(id);
  }
</script>

</body>
</html>
