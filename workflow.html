<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>申請・承認 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910z">
  <link rel="stylesheet" href="css/layout.css?v=20260910z">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">申請・承認</h1>
  <p class="kp-greet-sub">経費の精算、休暇、稟議の申請はこちらから。</p>

  <div class="card">
    <div class="kp-menu">
      <a href="expenses.html">
        <span class="ico"><span class="material-symbols-outlined">receipt</span></span>
        <span><b>経費精算</b><small>立て替えた交通費・会議費などを申請する</small></span>
        <span class="go material-symbols-outlined">chevron_right</span>
      </a>
      <a href="requests.html">
        <span class="ico"><span class="material-symbols-outlined">beach_access</span></span>
        <span><b>休暇の申請</b><small>有給・半休・特別休暇。残日数もここで確認できます</small></span>
        <span class="go material-symbols-outlined">chevron_right</span>
      </a>
      <a href="requests.html">
        <span class="ico"><span class="material-symbols-outlined">approval</span></span>
        <span><b>稟議</b><small>購入や契約の決裁を仰ぐ。管理部のあと代表が承認します</small></span>
        <span class="go material-symbols-outlined">chevron_right</span>
      </a>
    </div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">pending_actions</span>いま進んでいる申請</h2>
    <div id="open"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260910z"></script>
<script src="js/layout.js?v=20260910z"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const STATUS_LABEL = {
    pending: "承認待ち（管理部）", pending_owner: "承認待ち（代表）", approved: "承認済み",
  };
  const yen = (n) => `${Number(n || 0).toLocaleString("ja-JP")} 円`;
  const fmtDay = (d) => new Date(`${d}T00:00:00+09:00`)
    .toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo", month: "long", day: "numeric" });

  KPLayout.init({ active: "menu", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) load(ctx); });

  async function load(ctx) {
    if (!ctx.me?.gw?.employee) {
      el("open").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていないため、申請できません。管理者に登録を依頼してください。</div></div>`;
      return;
    }
    // 経費と休暇・稟議は別の仕組みなので、2本まとめて取って1つの一覧にする
    const [exp, req] = await Promise.all([
      API.listExpenses("mine").then((r) => r.reports || [], () => []),
      API.listRequests("mine").then((r) => r.requests || [], () => []),
    ]);

    const rows = [
      ...exp.filter((r) => r.status === "pending" || r.status === "pending_owner")
        .map((r) => ({
          at: r.created_at, href: "expenses.html", icon: "receipt",
          kind: "経費精算", status: r.status, title: r.title, meta: yen(r.total_amount),
        })),
      ...req.filter((r) => r.status === "pending" || r.status === "pending_owner")
        .map((r) => ({
          at: r.created_at, href: "requests.html",
          icon: r.kind === "leave" ? "beach_access" : "approval",
          kind: r.kind === "leave" ? "休暇" : "稟議",
          status: r.status, title: r.title,
          meta: r.kind === "leave"
            ? `${fmtDay(r.starts_on)}${r.starts_on === r.ends_on ? "" : `〜${fmtDay(r.ends_on)}`}　${r.days}日`
            : (r.amount ? yen(r.amount) : ""),
        })),
    ].sort((a, b) => String(b.at).localeCompare(String(a.at)));

    el("open").innerHTML = rows.length
      ? rows.map((r) => `
          <div class="kp-todo">
            <span class="material-symbols-outlined" style="font-size:20px;color:var(--primary);">${esc(r.icon)}</span>
            <span class="t">
              <b>${esc(r.title)}</b>
              <small>${esc(r.kind)}${r.meta ? `／${esc(r.meta)}` : ""}</small>
              <small>${esc(STATUS_LABEL[r.status] || r.status)}</small>
            </span>
            <a class="btn btn-secondary btn-sm" href="${esc(r.href)}">開く</a>
          </div>`).join("")
      : `<div class="empty">承認を待っている申請はありません。</div>`;
  }
</script>

</body>
</html>
