<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>休暇・稟議の承認 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910e">
  <link rel="stylesheet" href="css/layout.css?v=20260910e">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">休暇・稟議の承認</h1>
  <p class="kp-greet-sub">
    休暇は管理部の承認で確定し、社内カレンダーに入ります。稟議は管理部のあと代表の承認に進みます。
  </p>

  <div class="card">
    <h2><span class="material-symbols-outlined">pending_actions</span>承認待ち<span id="pending-badge"></span></h2>
    <div id="pending"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">list</span>これまでの申請</h2>
    <div class="tabs">
      <button class="tab active" onclick="setFilter('leave', this)">休暇</button>
      <button class="tab" onclick="setFilter('ringi', this)">稟議</button>
    </div>
    <div id="all"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">event_available</span>有給の付与日数</h2>
    <div class="inline-controls" style="margin-bottom:12px;">
      <div style="max-width:170px;">
        <label>年度（4月〜3月）</label>
        <select id="g-year" onchange="loadGrants()"></select>
      </div>
    </div>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      付与のきまり（勤続年数に応じた日数、繰越の上限）は<b>自動計算していません</b>。
      労務側で決めた日数をここに入れてください。この数字がメンバーの残日数の元になります。
    </p>
    <div class="table-scroll">
      <table class="kp-items">
        <thead><tr>
          <th>氏名</th><th style="width:110px;">付与</th><th style="width:110px;">繰越</th>
          <th style="width:80px;">取得</th><th style="width:80px;">申請中</th>
          <th style="width:80px;">残り</th><th style="width:70px;"></th>
        </tr></thead>
        <tbody id="g-rows"><tr><td colspan="7" class="muted">読み込み中…</td></tr></tbody>
      </table>
    </div>
    <div id="g-msg" class="err-text"></div>
  </div>
</div>

<script src="js/api-client.js?v=20260910e"></script>
<script src="js/layout.js?v=20260910e"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const LEAVE_LABEL = {
    paid: "有給（全日）", am: "午前半休", pm: "午後半休", special: "特別休暇", absence: "欠勤",
  };
  const STATUS_LABEL = {
    pending: "承認待ち（管理部）", pending_owner: "承認待ち（代表）",
    approved: "承認済み", rejected: "却下", cancelled: "取消",
  };
  const STATUS_CHIP = {
    pending: "pending", pending_owner: "important", approved: "approved",
    rejected: "rejected", cancelled: "archived",
  };

  let requests = [];
  let isOwner = false;
  let filter = "leave";

  KPLayout.init({ active: "requests", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) start(); });

  async function start() {
    const y = fiscalYear();
    el("g-year").innerHTML = [y + 1, y, y - 1, y - 2]
      .map((n) => `<option value="${n}"${n === y ? " selected" : ""}>${n}年度</option>`).join("");
    await Promise.all([load(), loadGrants()]);
  }

  // 会計期間に合わせて4月始まり
  function fiscalYear(d = new Date()) {
    return d.getMonth() + 1 >= 4 ? d.getFullYear() : d.getFullYear() - 1;
  }

  const fmtDay = (d) => new Date(`${d}T00:00:00+09:00`)
    .toLocaleDateString("ja-JP", { timeZone: "Asia/Tokyo", month: "long", day: "numeric" });
  const yen = (n) => `${Number(n || 0).toLocaleString("ja-JP")} 円`;

  // ---- 申請 -----------------------------------------------------------------
  async function load() {
    try {
      const res = await API.listRequests("all");
      requests = res.requests || [];
      isOwner = !!res.isOwner;
      render();
    } catch (e) {
      el("pending").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function render() {
    const pending = requests.filter((r) => r.status === "pending" || r.status === "pending_owner");
    el("pending-badge").innerHTML = pending.length
      ? `<span class="kp-chip important" style="margin-left:8px;">${pending.length}</span>` : "";
    el("pending").innerHTML = pending.length
      ? pending.map((r) => card(r, true)).join("")
      : `<div class="empty">承認待ちの申請はありません。</div>`;

    const rest = requests.filter((r) => r.kind === filter && r.status !== "pending" && r.status !== "pending_owner");
    el("all").innerHTML = rest.length
      ? rest.map((r) => card(r, false)).join("")
      : `<div class="empty">該当する申請はありません。</div>`;
  }

  function setFilter(f, btn) {
    filter = f;
    for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b === btn);
    render();
  }

  function card(r, showDecide) {
    // 稟議の2段目は owner 権限を持つ人しか押せない。押せない人には理由を出す
    const needsOwner = r.status === "pending_owner";
    const canPress = !needsOwner || isOwner;

    const head = r.kind === "leave"
      ? `${esc(r.starts_on === r.ends_on ? fmtDay(r.starts_on) : `${fmtDay(r.starts_on)}〜${fmtDay(r.ends_on)}`)}　${r.days}日`
      : (r.amount ? esc(yen(r.amount)) : "金額なし");

    return `
      <div class="kp-notice${showDecide ? " unread" : ""}">
        <div class="head">
          <span class="kp-chip ${esc(STATUS_CHIP[r.status] || "")}">${esc(STATUS_LABEL[r.status] || r.status)}</span>
          <span class="kp-chip ${r.kind === "leave" ? "event" : "system"}">${r.kind === "leave" ? "休暇" : "稟議"}</span>
          ${r.kind === "leave" ? `<span class="kp-chip">${esc(LEAVE_LABEL[r.leave_type] || "")}</span>` : ""}
          ${r.gcal_error ? '<span class="kp-chip important" title="カレンダー未反映">カレンダー×</span>' : ""}
          <span class="meta">${head}</span>
        </div>
        <div class="title">${esc(r.title)}</div>
        <div class="body">申請者：${esc(r.applicant?.display_name || "不明")}${
          r.applicant?.department ? `（${esc(r.applicant.department)}）` : ""}　${
          esc(new Date(r.created_at).toLocaleDateString("ja-JP"))} 申請</div>
        ${r.body ? `<div class="body">${esc(r.body)}</div>` : ""}
        ${r.decision_note ? `<div class="body muted">ひとこと：${esc(r.decision_note)}</div>` : ""}
        <div class="foot">
          ${showDecide ? (canPress ? `
            <input type="text" id="note-${esc(r.id)}" placeholder="ひとこと（任意・申請者に届きます）"
                   style="max-width:260px;margin:0;">
            <button class="btn btn-primary btn-sm" onclick="decide('${esc(r.id)}','approve',this)">
              <span class="material-symbols-outlined icon-inline">check</span>${needsOwner ? "代表として承認" : "承認"}
            </button>
            <button class="btn btn-danger btn-sm" onclick="decide('${esc(r.id)}','reject',this)">
              <span class="material-symbols-outlined icon-inline">close</span>却下
            </button>`
            : `<span class="muted" style="font-size:12.5px;">代表（経営者権限）の承認待ちです</span>`) : ""}
          ${!showDecide && r.status === "approved" && r.kind === "leave" ? `
            <button class="btn btn-secondary btn-sm" onclick="decide('${esc(r.id)}','cancel',this)">
              <span class="material-symbols-outlined icon-inline">undo</span>取り消す
            </button>` : ""}
        </div>
      </div>`;
  }

  async function decide(id, action, btn) {
    const note = el(`note-${id}`)?.value.trim() || null;
    const label = { approve: "承認中…", reject: "却下中…", cancel: "取消中…" }[action];
    if (action !== "approve" && !confirm(action === "reject"
      ? "この申請を却下します。よろしいですか？"
      : "承認済みの申請を取り消します。カレンダーの予定も消えます。よろしいですか？")) return;
    try {
      const res = await KPLayout.busy(btn, label, () => API.decideRequest(id, action, note));
      if (res.calendar?.error) {
        alert("申請は処理しましたが、カレンダーへの反映に失敗しました。\n" + res.calendar.error);
      }
      await Promise.all([load(), loadGrants()]);
    } catch (e) {
      alert(e.hint || e.detail || e.message || "処理できませんでした");
    }
  }

  // ---- 有給の付与日数 -------------------------------------------------------
  async function loadGrants() {
    const year = el("g-year").value;
    try {
      const res = await API.leaveGrants(year);
      renderGrants(res.rows || [], res.year);
    } catch (e) {
      el("g-rows").innerHTML =
        `<tr><td colspan="7" class="muted">取得に失敗しました：${esc(e.detail || e.message)}</td></tr>`;
    }
  }

  function renderGrants(rows, year) {
    if (!rows.length) {
      el("g-rows").innerHTML = `<tr><td colspan="7" class="muted">在籍中のメンバーがいません。</td></tr>`;
      return;
    }
    el("g-rows").innerHTML = rows.map((r) => `
      <tr>
        <td><b>${esc(r.employee.display_name)}</b>
          ${r.employee.department ? `<small class="muted">　${esc(r.employee.department)}</small>` : ""}</td>
        <td><input type="number" min="0" step="0.5" value="${r.granted - r.carriedShown || ""}"
                   id="gr-${esc(r.employee.id)}" style="margin:0;max-width:80px;font-size:12.5px;"></td>
        <td><input type="number" min="0" step="0.5" value=""
                   id="ca-${esc(r.employee.id)}" style="margin:0;max-width:80px;font-size:12.5px;"></td>
        <td>${r.taken}</td>
        <td>${r.pending}</td>
        <td><b style="color:${r.remaining <= 3 ? "#b3261e" : "var(--primary-dark)"};">${r.remaining}</b></td>
        <td><button class="btn btn-secondary btn-sm"
                    onclick="saveGrant('${esc(r.employee.id)}', ${year}, this)">保存</button></td>
      </tr>`).join("");

    // 付与と繰越は合計しか返していないので、入力欄には現在値を素直に入れ直す
    for (const r of rows) {
      const g = el(`gr-${r.employee.id}`);
      const c = el(`ca-${r.employee.id}`);
      if (g) g.value = r.hasGrant ? r.granted : "";
      if (c) c.value = "";
      if (g) g.title = "付与＋繰越の合計。内訳を分けたい場合は繰越欄に入れてください";
    }
  }

  async function saveGrant(employeeId, year, btn) {
    const msg = el("g-msg");
    msg.style.color = ""; msg.textContent = "";
    try {
      await KPLayout.busy(btn, "保存中…", () => API.saveLeaveGrant({
        employeeId, year,
        grantedDays: el(`gr-${employeeId}`).value || 0,
        carriedDays: el(`ca-${employeeId}`).value || 0,
      }));
      msg.style.color = "var(--primary-dark)";
      msg.textContent = "保存しました。";
      await loadGrants();
    } catch (e) {
      msg.textContent = e.hint || e.detail || e.message || "保存できませんでした";
    }
  }
</script>

</body>
</html>
