<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 書類の署名付きURLを、外部へ渡さない -->
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <title>退職後のお手続き - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css?v=20261006kei2">
  <style>
    /* 退職者ポータル。社内のナビは出さない。採用HR・Sales・Office と同じ部品（白カード・#e2e2dc・#1b2440）だけで組む */
    body { font-family:'Zen Kaku Gothic New', sans-serif; background:#f6f6f2; color:#1b2440; margin:0; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    .rt-bar { background:#fff; border-bottom:1px solid #e2e2dc; padding:0 16px; display:flex; align-items:center; gap:12px; height:56px; }
    .rt-logo { font-weight:700; font-size:14px; white-space:nowrap; }
    .rt-logo span { color:#6b7080; font-weight:500; }
    .rt-bar .sp { flex:1; }
    .rt-out { border:1px solid #e2e2dc; background:#fff; color:#1b2440; border-radius:7px; padding:7px 12px; font-size:12.5px;
              font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .rt-out .material-symbols-outlined { font-size:18px; }
    .rt-wrap { max-width:640px; margin:0 auto; padding:24px 16px 60px; }
    .rt-hi { font-size:12.5px; color:#6b7080; margin:0 0 2px; }
    h1.rt-h { font-size:22px; font-weight:700; margin:0 0 6px; }
    .rt-meta { font-size:13.5px; color:#4a5068; margin:0 0 18px; }
    .rt-meta b { color:#1b2440; }
    h2.rt-sub { font-size:13px; font-weight:700; color:#4a5068; margin:0 0 8px; }
    .rt-row { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; margin-bottom:8px;
              display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .rt-ic { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 28px;
             background:#ecece6; color:#6b7080; }
    .rt-ic .material-symbols-outlined { font-size:18px; }
    .rt-row.issued .rt-ic { background:#e3f4e7; color:#1f6f3a; }
    .rt-body { flex:1 1 180px; min-width:0; }
    .rt-name { font-size:14.5px; font-weight:700; }
    .rt-st { font-size:12.5px; color:#6b7080; margin-top:2px; }
    .rt-row.issued .rt-st { color:#1f6f3a; }
    .rt-btns { display:flex; gap:8px; flex-wrap:wrap; }
    .rt-btn { border:1px solid #e2e2dc; background:#fff; color:#1b2440; border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:700;
              font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .rt-btn.pri { background:#1b2440; border-color:#1b2440; color:#fff; }
    .rt-btn[disabled] { opacity:.5; cursor:default; }
    .rt-btn .material-symbols-outlined { font-size:18px; }
    .rt-note { font-size:12px; color:#6b7080; line-height:1.8; margin:16px 0 0; }
    .rt-err { background:#fff5f4; border:1px solid #e2e2dc; border-left:3px solid #b3261e; border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.8; }
    @media (max-width:480px) { .rt-btns { width:100%; } .rt-btn { flex:1 1 0; justify-content:center; } }
  </style>
</head>
<body>
  <div class="rt-bar">
    <div class="rt-logo">EIGHT <span>/ 退職後のお手続き</span></div>
    <div class="sp"></div>
    <button class="rt-out" id="rt-logout" type="button"><span class="material-symbols-outlined">logout</span>ログアウト</button>
  </div>
  <main class="rt-wrap" id="rt-main" aria-live="polite">
    <p class="rt-note">読み込み中…</p>
  </main>

  <script src="/js/api-client.js?v=20261006kei2"></script>
  <script>
    (function () {
      const el = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const ymdJa = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : ""; };
      const ymdSlash = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[1]}/${m[2]}/${m[3]}` : ""; };

      el("rt-logout").addEventListener("click", async () => {
        try { await API.logout(); } catch (e) { /* ログアウトできなくても、ログイン画面へ */ }
        location.replace("/index.html");
      });

      const fail = (msg) => { el("rt-main").innerHTML = `<div class="rt-err" id="rt-error">${esc(msg)}</div>`; };

      function rowHtml(d) {
        let st = "準備中", cls = "", ic = "schedule", btns = "";
        if (d.state === "issued") {
          cls = "issued"; ic = "check";
          st = `発行済み${d.issuedOn ? "　" + ymdSlash(d.issuedOn) : ""}`;
          btns = `<div class="rt-btns">
            <button class="rt-btn" type="button" data-act="view" data-id="${esc(d.id)}"><span class="material-symbols-outlined">visibility</span>PDFを見る</button>
            <button class="rt-btn pri" type="button" data-act="download" data-id="${esc(d.id)}"><span class="material-symbols-outlined">download</span>ダウンロード</button>
          </div>`;
        } else if (d.state === "processing") {
          st = "手続き中" + (d.expectedOn ? `　発行予定：${ymdSlash(d.expectedOn)}` : "");
        } else if (d.expectedOn) {
          st = `準備中　発行予定：${ymdSlash(d.expectedOn)}`;
        }
        return `<div class="rt-row ${cls}" data-kind="${esc(d.kind)}" data-state="${esc(d.state)}">
          <span class="rt-ic"><span class="material-symbols-outlined">${ic}</span></span>
          <div class="rt-body"><div class="rt-name">${esc(d.label)}</div><div class="rt-st">${esc(st)}</div></div>
          ${btns}
        </div>`;
      }

      async function openFile(id, download, btn) {
        // ポップアップを止められないよう、先に開いてから行き先を入れる
        const w = download ? null : window.open("", "_blank");
        if (w) w.opener = null;
        btn.disabled = true;
        try {
          const r = await API.api(`/api/retiree/file?id=${encodeURIComponent(id)}${download ? "&download=1" : ""}`);
          if (download) location.href = r.url; else if (w) w.location.href = r.url;
        } catch (e) {
          if (w) w.close();
          fail(e.hint || e.message || "書類を開けませんでした");
        } finally { btn.disabled = false; }
      }

      async function main() {
        if (!API.isLoggedIn()) { location.replace("/index.html"); return; }
        let me;
        try { me = await API.me(); } catch (e) { fail(e.hint || e.message || "読み込めませんでした"); return; }
        // 退職者ではない人は、ふだんの画面へ
        if (!me?.gw?.left) { location.replace("/home.html"); return; }
        let r;
        try { r = await API.api("/api/retiree"); } catch (e) { fail(e.hint || e.message || "読み込めませんでした"); return; }
        el("rt-main").innerHTML = `
          <p class="rt-hi">退職後のお手続き</p>
          <h1 class="rt-h" id="rt-name">${esc(r.name || "")} 様</h1>
          <p class="rt-meta">${r.leftOn ? `退職日：<b>${esc(ymdJa(r.leftOn))}</b>` : ""}</p>
          <h2 class="rt-sub">必要な書類</h2>
          <div id="rt-docs">${(r.docs || []).map(rowHtml).join("")}</div>
          <p class="rt-note">ご不明な点は、会社の担当者までご連絡ください。</p>`;
        el("rt-docs").addEventListener("click", (ev) => {
          const b = ev.target.closest("button[data-act]");
          if (b) openFile(b.dataset.id, b.dataset.act === "download", b);
        });
      }
      main();
    })();
  </script>
</body>
</html>
