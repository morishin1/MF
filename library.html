<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>社内文書 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911t">
  <link rel="stylesheet" href="css/layout.css?v=20260911t">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 文書はカードで並べる。
       一覧の行だと、題名の文字列だけが縦に積み上がって、
       どれが規程でどれが様式なのか、開くまで分からない。
       種類のアイコンを大きく出すと、探す前に見分けがつく */
    .doc-grid { display:grid; gap:12px;
      grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); }
    .doc {
      display:flex; flex-direction:column; gap:8px; padding:16px 14px;
      border:1px solid var(--line, #e4e8ee); border-radius:12px;
      background:#fff; text-decoration:none; color:inherit;
      transition:border-color .12s, box-shadow .12s, transform .12s;
    }
    .doc:hover { border-color:var(--primary); box-shadow:0 3px 12px rgba(0,0,0,.07); transform:translateY(-1px); }
    .doc .ic {
      width:44px; height:44px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      background:#f2f5f9; color:#5b6673;
    }
    .doc .ic .material-symbols-outlined { font-size:26px; }
    .doc.pdf   .ic { background:#fdecea; color:#c5372c; }
    .doc.word  .ic { background:#e8f0fb; color:#2a5db0; }
    .doc.excel .ic { background:#e7f4ec; color:#1e7d43; }
    .doc.image .ic { background:#f3edfb; color:#6b3fa0; }
    .doc.link  .ic { background:#eef2f6; color:#48607a; }
    .doc .ttl { font-weight:600; font-size:13.5px; line-height:1.55; }
    .doc .mt  { font-size:11.5px; color:var(--muted, #77828f); line-height:1.7; }
    .doc .kind { font-size:10.5px; font-weight:700; letter-spacing:.04em; color:#8b95a1; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">社内文書</h1>
  <p class="kp-greet-sub">就業規則・賃金規定・マニュアル・申請様式をここにまとめています。</p>

  <div id="info-tabs"></div>

  <!-- 規程は「探す」ものではなく「そこにある」もの。上に固定で出す -->
  <div id="rule-card" class="card hidden" style="border-left:4px solid var(--primary);">
    <h2><span class="material-symbols-outlined">gavel</span>就業規則・賃金規定</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      正社員と契約社員で別の規程です。ご自分の雇用区分のものをお読みください。
      分からないときは管理担当者にお尋ねください。
    </p>
    <div id="rules"></div>
  </div>

  <div class="card">
    <div class="inline-controls" style="margin-bottom:6px;">
      <div style="min-width:200px;flex:1;">
        <label>探す</label>
        <input id="q" type="search" placeholder="タイトル・説明で絞り込む" oninput="render()">
      </div>
    </div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260911t"></script>
<script src="js/layout.js?v=20260911t"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const CATEGORY_LABEL = { rule: "社内規定", manual: "マニュアル", form: "様式・テンプレート", other: "その他" };
  const CATEGORY_ORDER = ["rule", "manual", "form", "other"];

  let documents = [];

  document.getElementById("info-tabs").innerHTML = KPLayout.infoTabs("library");
  KPLayout.init({ active: "library", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const res = await API.listLibrary();
      documents = res.documents || [];
      render();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  // 就業規則と賃金規定だけは、検索の外に固定で出す。
  //
  // この4つは「探す」ものではなく、入社したら一度は読む・困ったら開くもの。
  // 他の文書に混ざって下のほうに並ぶと、あるのに読まれない。
  // 題名で拾っているのは、規程かどうかを人が種類で付け間違えても
  // ここに出したいため（付け間違いは必ず起きる）
  const RULE_RE = /(就業規則|賃金規定|賃金規程|給与規定|給与規程)/;

  function renderRules() {
    const rules = documents.filter((d) => RULE_RE.test(d.title || ""));
    el("rule-card").classList.toggle("hidden", !rules.length);
    if (!rules.length) return;

    // 契約社員向けを後ろに。多くの人は正社員なので、先に見えるほうを合わせる
    const sorted = [...rules].sort((a, b) =>
      Number(/契約社員|パート|アルバイト/.test(a.title)) - Number(/契約社員|パート|アルバイト/.test(b.title))
      || (a.title || "").localeCompare(b.title || "", "ja"));

    el("rules").innerHTML = `<div class="doc-grid">${sorted.map(card).join("")}</div>`;
  }

  function render() {
    renderRules();
    const q = el("q").value.trim().toLowerCase();
    const shown = documents.filter((d) =>
      !q || `${d.title} ${d.description || ""}`.toLowerCase().includes(q));

    if (!shown.length) {
      el("list").innerHTML = `<div class="empty">${
        documents.length ? "見つかりませんでした。" : "まだ文書が登録されていません。"}</div>`;
      return;
    }
    if (!q && el("rule-card").classList.contains("hidden") === false) {
      // 規程は上に固定で出しているので、下の一覧では繰り返さない
      const ids = new Set(documents.filter((d) => RULE_RE.test(d.title || "")).map((d) => d.id));
      for (let i = shown.length - 1; i >= 0; i--) if (ids.has(shown[i].id)) shown.splice(i, 1);
    }

    // 種類ごとにまとめる。数が増えても探しやすいように
    el("list").innerHTML = CATEGORY_ORDER.map((c) => {
      const rows = shown.filter((d) => d.category === c);
      if (!rows.length) return "";
      return `
        <p class="muted" style="font-size:12.5px;font-weight:700;margin:18px 0 8px;">
          ${esc(CATEGORY_LABEL[c])}
        </p>
        <div class="doc-grid">${rows.map(card).join("")}</div>`;
    }).join("");
  }

  // ---- カード -----------------------------------------------------------------
  //
  // 何のファイルかは、種類（社内規定/マニュアル/様式）ではなく
  // 中身の形式で決める。PDF は PDF のアイコン。
  // 「開く前に、開いたら何が出るか分かる」ようにするため
  function fileKind(d) {
    if (d.link_url) return { cls: "link", icon: "link", label: "リンク" };
    const name = `${d.file_name || ""} ${d.mime_type || ""}`.toLowerCase();
    if (/pdf/.test(name)) return { cls: "pdf", icon: "picture_as_pdf", label: "PDF" };
    if (/(\.docx?|msword|wordprocessingml)/.test(name)) return { cls: "word", icon: "description", label: "WORD" };
    if (/(\.xlsx?|\.csv|ms-excel|spreadsheetml)/.test(name)) return { cls: "excel", icon: "table", label: "EXCEL" };
    if (/(\.png|\.jpe?g|\.webp|\.heic|image\/)/.test(name)) return { cls: "image", icon: "image", label: "画像" };
    return { cls: "", icon: "draft", label: "ファイル" };
  }

  const sizeOf = (n) => (!n ? "" : n >= 1024 * 1024
    ? `${(n / 1024 / 1024).toFixed(1)} MB`
    : `${Math.max(1, Math.round(n / 1024))} KB`);

  function card(d) {
    const k = fileKind(d);
    // 外部リンクはそのまま開く。中に置いたファイルは表示用のページで開く。
    // 署名URLを直接踏ませないのは、URLが10分で切れるため。
    // 期限切れのURLをブックマークされると、次に開いたときに何も出ない
    const href = d.link_url ? esc(d.link_url) : `doc.html?id=${encodeURIComponent(d.id)}`;
    const meta = [d.description, sizeOf(d.size_bytes)].filter(Boolean).join("　");
    return `
      <a class="doc ${k.cls}" href="${href}" target="_blank" rel="noopener">
        <span class="ic"><span class="material-symbols-outlined">${k.icon}</span></span>
        <span class="kind">${esc(k.label)}</span>
        <span class="ttl">${esc(d.title)}</span>
        ${meta ? `<span class="mt">${esc(meta)}</span>` : ""}
      </a>`;
  }
</script>

</body>
</html>
