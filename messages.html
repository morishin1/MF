<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>Q&A - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261030officeactions1">
  <link rel="stylesheet" href="css/layout.css?v=20261030officeactions1">
  <link rel="stylesheet" href="css/member-design.css">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <link rel="stylesheet" href="css/questions.css">
</head>
<body class="gw-member-ui">
<div class="wrap">
  <h1 class="kp-greet">Q&A</h1>
  <p class="kp-greet-sub">社内ルールや手続きを調べることができます。見つからないときは、担当者に質問してください。</p>
  <section class="card">
    <form id="qa-search" class="qa-search">
      <label for="qa-query">知りたいことを検索</label>
      <div class="qa-tools"><input id="qa-query" type="search" maxlength="200" placeholder="例：有給、経費、契約書"><button class="btn btn-primary" type="submit"><span class="material-symbols-outlined">search</span>検索する</button></div>
      <div class="qa-tools"><label for="qa-category">カテゴリ</label><select id="qa-category"><option value="">すべて</option></select><button id="qa-ask" class="btn btn-secondary" type="button"><span class="material-symbols-outlined">contact_support</span>担当者に質問する</button><a id="qa-manage" href="admin-ai.html" hidden>Q&Aを管理する</a></div>
    </form>
    <p id="qa-message" role="status" aria-live="polite"></p>
    <div id="qa-results">読み込み中…</div>
  </section>
  <section class="card"><h2><span class="material-symbols-outlined">forum</span>自分の質問・回答</h2><p class="qa-muted">質問は、本人と問い合わせ対応の権限を持つ担当者が確認できます。</p><div id="qa-inquiries">読み込み中…</div></section>
  <details class="card" id="qa-legacy"><summary>過去のAI相談を見る</summary><p class="qa-muted">以前の相談を履歴として残しています。現在の社内ルールは、上のQ&Aで確認してください。</p><div id="qa-legacy-list"></div></details>
</div>
<dialog id="qa-dialog" class="qa-dialog" aria-labelledby="qa-dialog-title"><header><h2 id="qa-dialog-title"></h2><button id="qa-close" class="btn btn-secondary" type="button">閉じる</button></header><div id="qa-dialog-body"></div><p id="qa-dialog-error" role="alert"></p></dialog>
<script src="js/api-client.js?v=20261030officeactions1"></script>
<script src="js/device.js?v=20261030officeactions1"></script>
<script src="js/layout.js?v=20261114qa1"></script>
<script src="js/questions-ui.js"></script>
</body>
</html>
