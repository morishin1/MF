<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>メッセージ - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260912d">
  <link rel="stylesheet" href="css/layout.css?v=20260912d">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 相手を選ぶところ。指でも押せる大きさにする */
    .ms-people { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;
                 max-height:230px; overflow-y:auto; padding:2px; }
    .ms-person { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
                 padding:9px 13px; border:1px solid var(--border); border-radius:999px;
                 background:#fff; font-size:13px; line-height:1.3; }
    .ms-person:hover { border-color:var(--primary); }
    .ms-person.on { border-color:var(--primary); background:var(--soft); font-weight:600; }
    .ms-person input { width:auto; margin:0; flex:0 0 auto; }
    .ms-person small { color:var(--muted); font-size:11.5px; }
    .ms-picked { flex-basis:100%; display:flex; align-items:center; gap:10px;
                 font-size:12.5px; color:var(--muted); padding-top:4px; }
  </style>
</head>
<body>

<div class="wrap">
  <!-- 一覧 -->
  <div id="view-list">
    <h1 class="kp-greet">メッセージ</h1>
    <p class="kp-greet-sub">社内の1対1・グループのやりとりです。</p>

    <div class="card">
      <h2><span class="material-symbols-outlined">edit_square</span>新しいやりとりを始める</h2>
      <!-- 相手はチェックで選ぶ。
           前は複数選択のリストで、2人以上を選ぶのに Shift を押す必要があった。
           押さずに2人目を押すと1人目が外れるので、選べていないことにも気づけない -->
      <label>相手（2人以上を選ぶとグループになります）</label>
      <input id="new-search" type="text" placeholder="名前や部署で絞り込む"
             oninput="renderPeople()" style="max-width:280px;">
      <div id="new-members" class="ms-people"></div>
      <div class="inline-controls" style="margin-top:12px;">
        <div style="min-width:160px;">
          <label>グループ名（任意）</label>
          <input id="new-title" type="text" placeholder="経理チーム">
        </div>
        <div>
          <button class="btn btn-primary" onclick="startThread(this)">
            <span class="material-symbols-outlined icon-inline">forum</span>開始
          </button>
        </div>
      </div>
      <div id="new-msg" class="err-text"></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">chat</span>やりとり</h2>
      <div id="threads"><div class="empty">読み込み中…</div></div>
    </div>
  </div>

  <!-- スレッド -->
  <div id="view-thread" class="hidden">
    <div class="kp-thread-head">
      <button class="icon-btn" onclick="backToList()" title="一覧へ戻る">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div style="flex:1;min-width:0;">
        <h1 class="kp-greet" id="th-title" style="margin:0;">　</h1>
        <p class="kp-greet-sub" id="th-sub" style="margin:2px 0 0;"></p>
      </div>
      <button class="btn btn-secondary btn-sm hidden" id="th-members-btn" onclick="toggleMembers()">
        <span class="material-symbols-outlined icon-inline">group</span>参加者
      </button>
    </div>

    <!-- 参加者。グループのときだけ開ける -->
    <div id="th-members" class="card hidden">
      <h2><span class="material-symbols-outlined">group</span>参加者
        <span id="mb-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
      <div id="mb-list"></div>
      <div id="mb-add" class="hidden" style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px;">
        <label>追加する人</label>
        <input id="mb-search" type="text" placeholder="名前や部署で絞り込む"
               oninput="renderAddPeople()" style="max-width:280px;">
        <div id="mb-people" class="ms-people"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          <button class="btn btn-primary btn-sm" onclick="addMembers(this)">
            <span class="material-symbols-outlined icon-inline">person_add</span>追加する
          </button>
          <button class="btn btn-secondary btn-sm" onclick="renameGroup()">
            <span class="material-symbols-outlined icon-inline">edit</span>グループ名を変える
          </button>
        </div>
      </div>
      <div style="margin-top:14px;">
        <button class="btn btn-secondary btn-sm" onclick="leaveGroup(this)">
          <span class="material-symbols-outlined icon-inline">logout</span>このグループを抜ける
        </button>
      </div>
      <div id="mb-msg" class="err-text"></div>
    </div>

    <div class="card">
      <!-- さかのぼって読む。1度に50件 -->
      <div id="th-more" class="hidden" style="text-align:center;padding:6px 0 10px;">
        <button class="btn btn-secondary btn-sm" onclick="loadOlder(this)">
          <span class="material-symbols-outlined icon-inline">expand_less</span>もっと前を読む
        </button>
      </div>
      <div id="th-messages" class="kp-chat"><div class="empty">読み込み中…</div></div>
      <div id="th-attach" class="kp-attach hidden"></div>
      <div class="kp-compose">
        <button class="icon-btn" type="button" id="th-attach-btn" title="ファイルを添付（ここに落としてもOK）"
                style="flex:0 0 auto;" onclick="pickAttachment()">
          <span class="material-symbols-outlined">attach_file</span>
        </button>
        <textarea id="th-input" rows="2" placeholder="メッセージを入力（Ctrl+Enter で送信）"></textarea>
        <button class="btn btn-primary" id="th-send" onclick="send()">
          <span class="material-symbols-outlined icon-inline">send</span>送信
        </button>
      </div>
      <div id="th-msg" class="err-text"></div>
    </div>
  </div>
</div>

<script src="js/api-client.js?v=20260912d"></script>
<script src="js/layout.js?v=20260912d"></script>
<script src="js/dropzone.js?v=20260912d"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  let me = null;
  let threads = [];
  let current = null;      // 開いているスレッドID
  let pending = null;      // 送信待ちの添付 { fileId, name }
  let thread = null;       // 開いているスレッドの中身（参加者・権限）
  let loaded = [];         // 画面に出している本文。さかのぼると前に足す
  let oldest = null;       // いま一番古い1件の時刻。これを before に渡す
  let hasMore = false;     // さかのぼれるか
  let unreadFrom = null;   // ここから未読、の線を引く位置
  const addPicked = new Set();   // 参加者に足す人

  KPLayout.init({ active: "messages", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    if (!ctx.me?.gw?.employee) {
      el("view-list").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていないため、メッセージを使えません。管理者に登録を依頼してください。</div></div>`;
      return;
    }
    me = ctx.me.gw.employee;
    await Promise.all([loadPeople(), loadThreads()]);

    // URL に ?t=... があればそのスレッドを開く（一覧から戻れるように履歴も使う）
    const t = new URLSearchParams(location.search).get("t");
    if (t) openThread(t, { push: false });

    el("th-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
    });
    window.addEventListener("popstate", () => {
      const id = new URLSearchParams(location.search).get("t");
      if (id) openThread(id, { push: false });
      else backToList({ push: false });
    });
  }

  // 選んだ相手。絞り込みで一覧から消えても、選んだことは覚えておく。
  // 消えた瞬間に外れると、探しながら選ぶことができない
  let people = [];
  const picked = new Set();

  async function loadPeople() {
    try {
      const res = await API.listEmployees();
      people = (res.employees || []).filter((e) => e.id !== me.id && e.status !== "left");
      renderPeople();
    } catch (e) {
      el("new-msg").textContent = e.detail || e.message;
    }
  }

  function renderPeople() {
    if (!people.length) {
      el("new-members").innerHTML = `<div class="empty">ほかに登録された社員がいません。</div>`;
      return;
    }
    const q = (el("new-search")?.value || "").trim().toLowerCase();
    const hit = people.filter((e) => !q
      || `${e.display_name} ${e.department || ""}`.toLowerCase().includes(q));

    el("new-members").innerHTML = (hit.length
      ? hit.map((e) => `
          <label class="ms-person${picked.has(e.id) ? " on" : ""}">
            <input type="checkbox" value="${esc(e.id)}" ${picked.has(e.id) ? "checked" : ""}
                   onchange="togglePerson(this)">
            <span>${esc(e.display_name)}</span>
            ${e.department ? `<small>${esc(e.department)}</small>` : ""}
          </label>`).join("")
      : `<div class="empty">見つかりません。</div>`)
      + (picked.size
        ? `<div class="ms-picked">${picked.size}名を選んでいます
             <button type="button" class="btn btn-secondary btn-sm" onclick="clearPeople()">全部外す</button>
           </div>`
        : "");
  }

  function togglePerson(box) {
    if (box.checked) picked.add(box.value); else picked.delete(box.value);
    renderPeople();
  }

  function clearPeople() {
    picked.clear();
    renderPeople();
  }

  async function loadThreads() {
    try {
      const res = await API.listThreads();
      threads = res.threads || [];
      renderThreads();
    } catch (e) {
      el("threads").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function renderThreads() {
    if (!threads.length) {
      el("threads").innerHTML = `<div class="empty">まだやりとりはありません。上から相手を選んで始めてください。</div>`;
      return;
    }
    el("threads").innerHTML = threads.map((t) => {
      const last = t.lastMessage;
      const when = last
        ? new Date(last.created_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
        : "";
      const preview = last ? last.body.replace(/\s+/g, " ").slice(0, 60) : "（まだメッセージがありません）";
      return `
        <div class="kp-todo" style="cursor:pointer;" onclick="openThread('${esc(t.id)}')">
          <span class="material-symbols-outlined" style="font-size:22px;color:var(--muted);">
            ${t.kind === "group" ? "groups" : "person"}</span>
          <span class="t">
            <b>${esc(t.displayName)}</b>
            ${t.unread ? `<span class="kp-chip important" style="margin-left:6px;">${t.unread}</span>` : ""}
            <small>${esc(preview)}</small>
          </span>
          <span class="muted" style="font-size:11.5px;white-space:nowrap;">${esc(when)}</span>
        </div>`;
    }).join("");
  }

  async function startThread(btn) {
    const msg = el("new-msg");
    msg.textContent = "";
    const ids = [...picked];
    if (!ids.length) { msg.textContent = "相手を選んでください"; return; }
    const kind = ids.length > 1 ? "group" : "dm";
    try {
      const res = await KPLayout.busy(btn, "開始中…",
        () => API.createThread(kind, ids, el("new-title").value.trim() || null));
      el("new-title").value = "";
      clearPeople();
      await loadThreads();
      openThread(res.threadId);
    } catch (e) {
      msg.textContent = e.detail || e.message || "開始できませんでした";
    }
  }

  async function openThread(id, { push = true } = {}) {
    if (current !== id) clearAttachment();
    current = id;
    el("view-list").classList.add("hidden");
    el("view-thread").classList.remove("hidden");
    el("th-messages").innerHTML = `<div class="empty">読み込み中…</div>`;
    wireAttach();     // やり取りの上にファイルを落とせるようにしておく
    if (push) history.pushState({}, "", `?t=${encodeURIComponent(id)}`);

    el("th-members").classList.add("hidden");
    try {
      const res = await API.getThread(id);
      thread = res.thread;
      loaded = res.messages || [];
      oldest = res.oldest;
      hasMore = !!res.hasMore;

      // 「ここから未読」の線。既読にする前の時刻で決める。
      // 開いた瞬間に既読にしてしまうと、どこから未読だったか分からなくなる
      const since = res.lastReadAt;
      const first = loaded.find((m) => m.sender_id !== me.id && since && m.created_at > since);
      unreadFrom = first ? first.id : null;

      el("th-title").textContent = thread.displayName;
      el("th-sub").textContent = thread.kind === "group"
        ? thread.members.map((m) => m.display_name).join("、")
        : "";
      el("th-members-btn").classList.toggle("hidden", thread.kind !== "group");
      el("th-more").classList.toggle("hidden", !hasMore);

      renderMessages();
      await API.markThreadRead(id).catch(() => {});
      loadThreads();   // 一覧の未読バッジを消す
    } catch (e) {
      el("th-messages").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>読み込めませんでした：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function backToList({ push = true } = {}) {
    current = null;
    el("view-thread").classList.add("hidden");
    el("view-list").classList.remove("hidden");
    if (push) history.pushState({}, "", location.pathname);
  }

  function renderMessages({ keepScroll = false } = {}) {
    const box = el("th-messages");
    if (!loaded.length) {
      box.innerHTML = `<div class="empty">まだメッセージがありません。</div>`;
      return;
    }
    // さかのぼったときは、いま読んでいた位置を動かさない。
    // 上に足したぶんだけ下へずらす（勝手に一番下へ飛ばない）
    const before = box.scrollHeight;

    const nameOf = new Map((thread?.members || []).map((m) => [m.id, m.display_name]));
    let lastDay = "";
    const html = [];
    for (const m of loaded) {
      if (m.id === unreadFrom) {
        html.push(`<div class="kp-chat-unread"><span>ここから未読</span></div>`);
      }
      const d = new Date(m.created_at);
      const day = d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" });
      if (day !== lastDay) {
        html.push(`<div class="kp-chat-day">${esc(day)}</div>`);
        lastDay = day;
      }
      const mine = m.sender_id === me.id;
      const time = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      html.push(`
        <div class="kp-bubble-row${mine ? " mine" : ""}">
          <div class="kp-bubble">
            ${mine ? "" : `<div class="who">${esc(nameOf.get(m.sender_id) || "")}</div>`}
            ${m.body ? `<div class="body">${esc(m.body)}</div>` : ""}
            ${(m.files || []).map((f) => `
              <a class="kp-file" href="#" onclick="openAttachment('${esc(f.id)}');return false;">
                <span class="material-symbols-outlined">${f.mime_type?.startsWith("image/") ? "image" : "description"}</span>
                ${esc(f.filename)}
              </a>`).join("")}
            <div class="time">${esc(time)}${readMark(m, mine)}</div>
          </div>
        </div>`);
    }
    box.innerHTML = html.join("");
    if (keepScroll) box.scrollTop = box.scrollHeight - before;
    else box.scrollTop = box.scrollHeight;
  }

  /**
   * 既読の印。
   *
   * 業務連絡なので「送った」だけでは足りない。「届いたか」が要る。
   * 出すのは自分が書いたものだけ。
   * 人のメッセージに「あなたは読みました」と出しても意味がない。
   */
  function readMark(m, mine) {
    if (!mine) return "";
    const r = m.readBy;
    if (!r || !r.total) return "";
    if (!r.count) return ` <span class="rd">未読</span>`;
    // 1対1は「既読」だけでよい。何人が読んだかは、相手が1人なら自明
    if (r.total === 1) return ` <span class="rd on">既読</span>`;
    return ` <span class="rd on">既読 ${r.count}/${r.total}</span>`;
  }

  // さかのぼって読む。1度に50件、上に足していく
  async function loadOlder(btn) {
    if (!hasMore || !oldest) return;
    try {
      const res = await KPLayout.busy(btn, "読み込み中…", () => API.getThread(current, oldest));
      const older = res.messages || [];
      loaded = [...older, ...loaded];
      oldest = res.oldest || oldest;
      hasMore = !!res.hasMore;
      el("th-more").classList.toggle("hidden", !hasMore);
      renderMessages({ keepScroll: true });
    } catch (e) {
      el("th-msg").textContent = e.hint || e.detail || e.message || "読み込めませんでした";
    }
  }

  // ---- 参加者 -----------------------------------------------------------------
  function toggleMembers() {
    const box = el("th-members");
    const show = box.classList.contains("hidden");
    box.classList.toggle("hidden", !show);
    if (show) renderMembers();
  }

  function renderMembers() {
    const list = thread?.members || [];
    el("mb-tag").textContent = `${list.length}名`;
    el("mb-msg").textContent = "";

    el("mb-list").innerHTML = list.map((m) => `
      <div class="kp-todo">
        <span class="material-symbols-outlined" style="font-size:20px;color:var(--muted);">person</span>
        <span class="t"><b>${esc(m.display_name)}</b>
          ${m.role === "owner" ? '<span class="kp-chip" style="margin-left:6px;">持ち主</span>' : ""}
          ${m.department ? `<small>${esc(m.department)}</small>` : ""}
        </span>
        ${thread.canManage && m.id !== me.id ? `
          <button class="btn btn-secondary btn-sm" onclick="handOver('${esc(m.id)}', this)"
                  title="このグループの持ち主を渡す">持ち主にする</button>
          <button class="btn btn-secondary btn-sm" onclick="removeMember('${esc(m.id)}', this)">外す</button>` : ""}
      </div>`).join("");

    el("mb-add").classList.toggle("hidden", !thread.canManage);
    if (thread.canManage) { addPicked.clear(); renderAddPeople(); }
  }

  // 追加する人の一覧。すでに入っている人は出さない
  function renderAddPeople() {
    const inside = new Set((thread?.members || []).map((m) => m.id));
    const q = (el("mb-search")?.value || "").trim().toLowerCase();
    const hit = people.filter((e) => !inside.has(e.id)
      && (!q || `${e.display_name} ${e.department || ""}`.toLowerCase().includes(q)));

    el("mb-people").innerHTML = hit.length
      ? hit.map((e) => `
          <label class="ms-person${addPicked.has(e.id) ? " on" : ""}">
            <input type="checkbox" value="${esc(e.id)}" ${addPicked.has(e.id) ? "checked" : ""}
                   onchange="toggleAddPerson(this)">
            <span>${esc(e.display_name)}</span>
            ${e.department ? `<small>${esc(e.department)}</small>` : ""}
          </label>`).join("")
      : `<div class="empty">追加できる人がいません。</div>`;
  }

  function toggleAddPerson(box) {
    if (box.checked) addPicked.add(box.value); else addPicked.delete(box.value);
    renderAddPeople();
  }

  const mbErr = (e) => { el("mb-msg").textContent = e.hint || e.detail || e.message || "変更できませんでした"; };

  async function addMembers(btn) {
    el("mb-msg").textContent = "";
    if (!addPicked.size) { el("mb-msg").textContent = "追加する人を選んでください"; return; }
    try {
      await KPLayout.busy(btn, "追加中…",
        () => API.threadMembers({ threadId: current, action: "add", employeeIds: [...addPicked] }));
      await openThread(current, { push: false });
      toggleMembers();
    } catch (e) { mbErr(e); }
  }

  async function removeMember(employeeId, btn) {
    const who = (thread?.members || []).find((m) => m.id === employeeId);
    if (!confirm(`${who?.display_name || "この人"}をこのグループから外します。\n`
      + `外すと、これまでのやりとりも見られなくなります。よろしいですか？`)) return;
    try {
      await KPLayout.busy(btn, "…",
        () => API.threadMembers({ threadId: current, action: "remove", employeeId }));
      await openThread(current, { push: false });
      toggleMembers();
    } catch (e) { mbErr(e); }
  }

  async function handOver(employeeId, btn) {
    const who = (thread?.members || []).find((m) => m.id === employeeId);
    if (!confirm(`${who?.display_name || "この人"}をこのグループの持ち主にします。\n`
      + `あなたは参加者に戻り、人の出し入れができなくなります。よろしいですか？`)) return;
    try {
      await KPLayout.busy(btn, "…",
        () => API.threadMembers({ threadId: current, action: "owner", employeeId }));
      await openThread(current, { push: false });
      toggleMembers();
    } catch (e) { mbErr(e); }
  }

  async function renameGroup() {
    const title = prompt("グループ名", thread?.title || "");
    if (title === null || !title.trim()) return;
    try {
      await API.threadMembers({ threadId: current, action: "rename", title: title.trim() });
      await openThread(current, { push: false });
      toggleMembers();
    } catch (e) { mbErr(e); }
  }

  async function leaveGroup(btn) {
    if (!confirm("このグループを抜けます。\n"
      + "抜けると、これまでのやりとりも見られなくなります。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "…", () => API.threadMembers({ threadId: current, action: "leave" }));
      backToList();
      await loadThreads();
    } catch (e) { mbErr(e); }
  }

  // 選んだ時点で預けておき、送信時に本文と結び付ける。
  // 先に預けることで、大きめのファイルでも送信のときに待たされない。
  // 添付は1件ずつ。クリップを押す・やり取りの上にファイルを落とす、どちらでも同じ
  let dropper = null;
  function wireAttach() {
    if (dropper) return;
    dropper = KPDrop.attach(el("th-messages"), (files) => attachFile(files[0]), {
      multiple: false,
      clickToPick: false,        // 押したときは本文を読むためのもの。勝手に開かない
      accept: ".pdf,.jpg,.jpeg,.png,.heic,.webp,.gif,.csv,.txt,.xlsx,.xls,.docx",
    });
  }
  function pickAttachment() { wireAttach(); dropper?.pick(); }

  async function attachFile(file) {
    if (!file || !current) return;

    el("th-attach").classList.remove("hidden");
    el("th-attach").innerHTML = `<span class="muted">${esc(file.name)} を準備中…</span>`;
    try {
      const fileId = await API.uploadMessageFile(current, file);
      pending = { fileId, name: file.name };
      renderAttachment();
    } catch (e) {
      pending = null;
      el("th-attach").classList.add("hidden");
      alert(e.detail || e.message || "添付できませんでした");
    }
  }

  function renderAttachment() {
    const box = el("th-attach");
    if (!pending) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    box.classList.remove("hidden");
    box.innerHTML = `
      <span class="material-symbols-outlined" style="font-size:18px;">attach_file</span>
      <span>${esc(pending.name)}</span>
      <button class="icon-btn" title="取り消す" onclick="clearAttachment()">
        <span class="material-symbols-outlined" style="font-size:18px;">close</span>
      </button>`;
  }

  function clearAttachment() { pending = null; renderAttachment(); }

  async function openAttachment(fileId) {
    try {
      const { url } = await API.messageFileUrl(fileId);
      window.open(url, "_blank", "noopener");
    } catch (e) { alert(e.detail || e.message || "開けませんでした"); }
  }

  async function send() {
    const input = el("th-input");
    const text = input.value.trim();
    if ((!text && !pending) || !current) return;
    el("th-msg").textContent = "";
    input.disabled = true;
    try {
      await KPLayout.busy(el("th-send"), "送信中…", async () => {
        await API.sendMessage(current, text, pending?.fileId || null);
        input.value = "";
        clearAttachment();
        // 送ったあとは最新の50件を取り直す。
        // さかのぼって読んでいた場合、その位置には戻さない（送った直後は下を見る）
        const res = await API.getThread(current);
        thread = res.thread;
        loaded = res.messages || [];
        oldest = res.oldest;
        hasMore = !!res.hasMore;
        unreadFrom = null;      // 自分が書いた時点で、そこまでは全部読んでいる
        el("th-more").classList.toggle("hidden", !hasMore);
        renderMessages();
      });
      loadThreads();
    } catch (e) {
      el("th-msg").textContent = e.detail || e.message || "送信できませんでした";
    } finally {
      input.disabled = false;
      input.focus();
    }
  }
</script>

</body>
</html>
