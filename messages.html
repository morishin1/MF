<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>社内AI - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261006kei3">
  <link rel="stylesheet" href="css/layout.css?v=20261006kei3">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    .ai-ask { border:1px solid var(--primary); }
    .ai-ask textarea { width:100%; min-height:64px; resize:vertical; font-family:inherit;
      font-size:14px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; }
    .ai-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .ai-chip { border:1px solid var(--border); background:#fff; border-radius:999px;
      padding:7px 13px; font-size:12.5px; cursor:pointer; line-height:1.3; }
    .ai-chip:hover { border-color:var(--primary); }
    .ai-chip.on { border-color:var(--primary); background:var(--soft); font-weight:600; color:var(--primary-dark); }
    .ai-faq { display:flex; flex-direction:column; gap:2px; }
    .ai-faq button { text-align:left; border:none; background:none; padding:9px 4px;
      font-size:13.5px; color:var(--text); cursor:pointer; border-bottom:1px dashed var(--border); }
    .ai-faq button:hover { color:var(--primary); }
    .ai-src { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .ai-src a, .ai-src span { font-size:11.5px; padding:4px 9px; border-radius:999px;
      background:var(--soft); color:var(--primary-dark); text-decoration:none; display:inline-flex; align-items:center; gap:3px; }
    .ai-fb { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
    .ai-fb button { border:1px solid var(--border); background:#fff; border-radius:999px;
      padding:4px 11px; font-size:11.5px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .ai-fb button.on { border-color:var(--primary); background:var(--soft); color:var(--primary-dark); font-weight:600; }
    .ai-fb .material-symbols-outlined { font-size:15px; }
    .ai-bubble-system { max-width:92%; margin:0 auto 14px; padding:12px 14px; border-radius:10px;
      background:var(--soft); font-size:12.5px; color:var(--muted); white-space:pre-wrap; }
    .ai-status { font-size:11px; padding:3px 9px; border-radius:999px; background:var(--soft); color:var(--primary-dark); }
    .ai-direct { margin-top:14px; text-align:center; }
    .ai-direct button { background:none; border:none; color:var(--muted); font-size:12px;
      text-decoration:underline; cursor:pointer; }
  </style>
</head>
<body>

<div class="wrap">
  <!-- 一覧 -->
  <div id="view-list">
    <h1 class="kp-greet">社内AI</h1>
    <p class="kp-greet-sub">総務・人事・経理・ITなど、社内業務について何でも相談できます。</p>

    <div class="card ai-ask">
      <h2><span class="material-symbols-outlined">smart_toy</span>何でも聞いてください</h2>
      <textarea id="ask-input" placeholder="例：有給はどう申請する？　請求書はどこに提出する？　PCを紛失したときはどうする？"></textarea>
      <div class="ai-chips" id="ask-chips"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <button class="btn btn-primary" id="ask-send" onclick="ask()">
          <span class="material-symbols-outlined icon-inline">send</span>送信
        </button>
      </div>
      <div id="ask-msg" class="err-text"></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">quiz</span>よくある質問</h2>
      <div class="ai-faq" id="faq"></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">forum</span>これまでの相談</h2>
      <div id="threads"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">support_agent</span>管理部への問い合わせ</h2>
      <div id="inquiries"><div class="empty">読み込み中…</div></div>
      <div class="ai-direct">
        <button type="button" onclick="toggleDirect()">AIを使わずに直接問い合わせる</button>
      </div>
      <div id="direct-form" class="hidden" style="margin-top:12px;">
        <textarea id="direct-input" placeholder="相談内容を書いてください" style="width:100%;min-height:60px;
          font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;">
          <button class="btn btn-secondary btn-sm" onclick="sendDirect(this)">送信する</button>
        </div>
        <div id="direct-msg" class="err-text"></div>
      </div>
    </div>
  </div>

  <!-- AIとの相談 -->
  <div id="view-thread" class="hidden">
    <div class="kp-thread-head">
      <button class="icon-btn" onclick="backToList()" title="一覧へ戻る">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div style="flex:1;min-width:0;">
        <h1 class="kp-greet" id="th-title" style="margin:0;">　</h1>
        <p class="kp-greet-sub" id="th-sub" style="margin:2px 0 0;"></p>
      </div>
    </div>

    <div class="card">
      <div id="th-messages" class="kp-chat"><div class="empty">読み込み中…</div></div>
      <div class="kp-compose">
        <textarea id="th-input" rows="2" placeholder="続けて質問する（Ctrl+Enter で送信）"></textarea>
        <button class="btn btn-primary" id="th-send" onclick="ask()">
          <span class="material-symbols-outlined icon-inline">send</span>送信
        </button>
      </div>
      <div id="th-msg" class="err-text"></div>
    </div>
  </div>

  <!-- 管理部への問い合わせ -->
  <div id="view-inquiry" class="hidden">
    <div class="kp-thread-head">
      <button class="icon-btn" onclick="backToList()" title="一覧へ戻る">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <div style="flex:1;min-width:0;">
        <h1 class="kp-greet" id="iq-title" style="margin:0;">　</h1>
        <p class="kp-greet-sub" id="iq-sub" style="margin:2px 0 0;"></p>
      </div>
      <span class="ai-status" id="iq-status"></span>
    </div>

    <div class="card">
      <div id="iq-messages" class="kp-chat"><div class="empty">読み込み中…</div></div>
      <div class="kp-compose">
        <textarea id="iq-input" rows="2" placeholder="担当者への返信（Ctrl+Enter で送信）"></textarea>
        <button class="btn btn-primary" id="iq-send" onclick="replyInquiry()">
          <span class="material-symbols-outlined icon-inline">send</span>送信
        </button>
      </div>
      <div id="iq-msg" class="err-text"></div>
    </div>
  </div>
</div>

<script src="js/api-client.js?v=20261006kei3"></script>
<script src="js/device.js?v=20261006kei3"></script>
<script src="js/layout.js?v=20261006kei3"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const CATEGORIES = [
    { code: "general_affairs", label: "総務" },
    { code: "hr", label: "人事・労務" },
    { code: "accounting", label: "経理" },
    { code: "it", label: "IT" },
    { code: "sales", label: "営業" },
    { code: "rules", label: "社内ルール" },
  ];
  const categoryLabel = (code) => CATEGORIES.find((c) => c.code === code)?.label || "その他";

  const FAQ = [
    "有給休暇の申請方法",
    "経費精算の締切",
    "請求書の提出先",
    "PCを紛失した場合",
    "入社書類について",
    "グループウェアの使い方",
  ];

  const STATUS_LABEL = {
    new: "受付済み", in_progress: "対応中", waiting_user: "返信待ち",
    resolved: "解決済み", closed: "完了",
  };

  let me = null;
  let current = null;       // 開いているAI相談のID
  let currentInquiry = null; // 開いている問い合わせのID
  let pickedCategory = null;
  let threads = [];
  let inquiries = [];

  KPLayout.init({ active: "messages", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    if (!ctx.me?.gw?.employee) {
      el("view-list").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていないため、社内AIを使えません。管理者に登録を依頼してください。</div></div>`;
      return;
    }
    me = ctx.me.gw.employee;
    renderChips();
    renderFaq();
    await Promise.all([loadThreads(), loadInquiries()]);

    el("ask-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
    });
    el("th-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
    });
    el("iq-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) replyInquiry();
    });
  }

  function renderChips() {
    el("ask-chips").innerHTML = CATEGORIES.map((c) => `
      <button type="button" class="ai-chip${pickedCategory === c.code ? " on" : ""}"
              onclick="pickCategory('${c.code}')">${esc(c.label)}</button>`).join("");
  }
  function pickCategory(code) {
    pickedCategory = pickedCategory === code ? null : code;
    renderChips();
  }

  function renderFaq() {
    el("faq").innerHTML = FAQ.map((q) => `<button type="button" onclick="askFaq('${esc(q)}')">${esc(q)}</button>`).join("");
  }
  function askFaq(q) {
    el("ask-input").value = q;
    ask();
  }

  // ---- 一覧: 相談履歴 -----------------------------------------------------------
  async function loadThreads() {
    try {
      const res = await API.listAiThreads();
      threads = res.threads || [];
      renderThreads();
    } catch (e) {
      el("threads").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }
  function renderThreads() {
    if (!threads.length) {
      el("threads").innerHTML = `<div class="empty">まだ相談はありません。上から聞いてみてください。</div>`;
      return;
    }
    el("threads").innerHTML = threads.map((t) => {
      const last = t.lastMessage;
      const when = new Date(t.updated_at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const preview = last ? last.content.replace(/\s+/g, " ").slice(0, 60) : "";
      return `
        <div class="kp-todo" style="cursor:pointer;" onclick="openThread('${esc(t.id)}')">
          <span class="material-symbols-outlined" style="font-size:22px;color:var(--muted);">smart_toy</span>
          <span class="t">
            <b>${esc(t.title || "（無題の相談）")}</b>
            ${t.category ? `<span class="kp-chip" style="margin-left:6px;">${esc(categoryLabel(t.category))}</span>` : ""}
            <small>${esc(preview)}</small>
          </span>
          <span class="muted" style="font-size:11.5px;white-space:nowrap;">${esc(when)}</span>
        </div>`;
    }).join("");
  }

  // ---- 一覧: 問い合わせ -----------------------------------------------------------
  async function loadInquiries() {
    try {
      const res = await API.listAiInquiries();
      inquiries = res.inquiries || [];
      renderInquiries();
    } catch (e) {
      el("inquiries").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }
  function renderInquiries() {
    if (!inquiries.length) {
      el("inquiries").innerHTML = `<div class="empty">まだ問い合わせはありません。</div>`;
      return;
    }
    el("inquiries").innerHTML = inquiries.map((i) => `
      <div class="kp-todo" style="cursor:pointer;" onclick="openInquiry('${esc(i.id)}')">
        <span class="material-symbols-outlined" style="font-size:22px;color:var(--muted);">support_agent</span>
        <span class="t"><b>${esc(i.subject)}</b><small>${esc(STATUS_LABEL[i.status] || i.status)}</small></span>
      </div>`).join("");
  }

  function toggleDirect() {
    el("direct-form").classList.toggle("hidden");
  }
  async function sendDirect(btn) {
    const note = el("direct-input").value.trim();
    const msg = el("direct-msg");
    msg.textContent = "";
    if (!note) { msg.textContent = "相談内容を書いてください"; return; }
    try {
      await KPLayout.busy(btn, "送信中…", () => API.createAiInquiry(null, note));
      el("direct-input").value = "";
      el("direct-form").classList.add("hidden");
      await loadInquiries();
      alert("問い合わせを送りました。管理部からの返信をお待ちください。");
    } catch (e) {
      msg.textContent = e.detail || e.message || "送信できませんでした";
    }
  }

  // ---- AIへの質問 -----------------------------------------------------------
  async function ask() {
    const inThread = current !== null;
    const input = inThread ? el("th-input") : el("ask-input");
    const question = input.value.trim();
    if (!question) return;
    const msg = inThread ? el("th-msg") : el("ask-msg");
    const btn = inThread ? el("th-send") : el("ask-send");
    msg.textContent = "";
    input.disabled = true;
    try {
      const res = await KPLayout.busy(btn, "考え中…", () => API.askAssistant(question, current, pickedCategory));
      input.value = "";
      if (!inThread) {
        el("view-list").classList.add("hidden");
        el("view-thread").classList.remove("hidden");
        el("th-messages").innerHTML = "";
      }
      current = res.threadId;
      el("th-title").textContent = res.title || "AIへの相談";
      el("th-sub").textContent = `カテゴリ：${categoryLabel(res.category)}`;
      appendMessage(res.userMessage);
      appendMessage(res.assistantMessage, { latest: true });
      await loadThreads();
    } catch (e) {
      msg.textContent = e.detail || e.message || "送信できませんでした";
    } finally {
      input.disabled = false;
      input.focus();
    }
  }

  function appendMessage(m, { latest = false } = {}) {
    const box = el("th-messages");
    if (box.querySelector(".empty")) box.innerHTML = "";
    const mine = m.role === "user";
    const row = document.createElement("div");
    row.className = `kp-bubble-row${mine ? " mine" : ""}`;
    row.dataset.messageId = m.id;
    const sources = m.sources || [];
    row.innerHTML = `
      <div class="kp-bubble">
        <div class="body" style="white-space:pre-wrap;">${esc(m.content)}</div>
        ${sources.length ? `<div class="ai-src">${sources.map((s) => s.link_url
          ? `<a href="${esc(s.link_url)}" target="_blank" rel="noopener">
               <span class="material-symbols-outlined" style="font-size:13px;">description</span>${esc(s.link_label || s.title)}</a>`
          : `<span><span class="material-symbols-outlined" style="font-size:13px;">description</span>${esc(s.title)}</span>`).join("")}</div>` : ""}
        ${!mine ? feedbackHtml(m) : ""}
      </div>`;
    box.appendChild(row);
    if (!mine && latest) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary btn-sm";
      btn.style.marginTop = "6px";
      btn.innerHTML = `<span class="material-symbols-outlined icon-inline">support_agent</span>担当者に相談する`;
      btn.onclick = () => escalate(btn);
      row.querySelector(".kp-bubble").appendChild(btn);
    }
    box.scrollTop = box.scrollHeight;
  }

  function feedbackHtml(m) {
    const rating = m.myRating || null;
    return `<div class="ai-fb" data-message="${esc(m.id)}">
      <button type="button" class="${rating === "up" ? "on" : ""}" onclick="rate('${esc(m.id)}','up',this)">
        <span class="material-symbols-outlined">thumb_up</span>役に立った</button>
      <button type="button" class="${rating === "down" ? "on" : ""}" onclick="rate('${esc(m.id)}','down',this)">
        <span class="material-symbols-outlined">thumb_down</span>違っている</button>
    </div>`;
  }

  async function rate(messageId, rating, btn) {
    try {
      await API.rateAiMessage(messageId, rating);
      const box = btn.closest(".ai-fb");
      box.querySelectorAll("button").forEach((b) => b.classList.remove("on"));
      btn.classList.add("on");
    } catch (e) {
      alert(e.detail || e.message || "評価できませんでした");
    }
  }

  async function escalate(btn) {
    try {
      const res = await KPLayout.busy(btn, "送っています…", () => API.createAiInquiry(current, null, null));
      await loadInquiries();
      openInquiry(res.inquiry.id);
    } catch (e) {
      alert(e.detail || e.message || "送れませんでした");
    }
  }

  async function openThread(id) {
    current = id;
    el("view-list").classList.add("hidden");
    el("view-thread").classList.remove("hidden");
    el("th-messages").innerHTML = `<div class="empty">読み込み中…</div>`;
    try {
      const res = await API.getAiThread(id);
      el("th-title").textContent = res.thread.title || "AIへの相談";
      el("th-sub").textContent = `カテゴリ：${categoryLabel(res.thread.category)}`;
      el("th-messages").innerHTML = "";
      const msgs = res.messages || [];
      msgs.forEach((m, i) => appendMessage(m, { latest: i === msgs.length - 1 && m.role === "assistant" }));
    } catch (e) {
      el("th-messages").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>読み込めませんでした：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  // ---- 問い合わせ -----------------------------------------------------------
  async function openInquiry(id) {
    current = null;
    currentInquiry = id;
    el("view-list").classList.add("hidden");
    el("view-thread").classList.add("hidden");
    el("view-inquiry").classList.remove("hidden");
    el("iq-messages").innerHTML = `<div class="empty">読み込み中…</div>`;
    try {
      const res = await API.getAiInquiry(id);
      el("iq-title").textContent = res.inquiry.subject;
      el("iq-sub").textContent = "管理者・経営者・人事/事務が確認して返信します。";
      el("iq-status").textContent = STATUS_LABEL[res.inquiry.status] || res.inquiry.status;
      const box = el("iq-messages");
      box.innerHTML = (res.messages || []).map((m) => {
        if (m.sender_type === "system") {
          return `<div class="ai-bubble-system">${esc(m.content)}</div>`;
        }
        const mine = m.sender_type === "employee" && (!m.sender_employee_id || m.sender_employee_id === me.id);
        return `<div class="kp-bubble-row${mine ? " mine" : ""}">
          <div class="kp-bubble">
            <div class="who">${m.sender_type === "admin" ? "管理部" : "あなた"}</div>
            <div class="body" style="white-space:pre-wrap;">${esc(m.content)}</div>
          </div></div>`;
      }).join("") || `<div class="empty">まだやりとりがありません。</div>`;
      box.scrollTop = box.scrollHeight;
    } catch (e) {
      el("iq-messages").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>読み込めませんでした：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  async function replyInquiry() {
    const input = el("iq-input");
    const content = input.value.trim();
    if (!content || !currentInquiry) return;
    const msg = el("iq-msg");
    msg.textContent = "";
    try {
      await KPLayout.busy(el("iq-send"), "送信中…", () => API.replyAiInquiry(currentInquiry, content));
      input.value = "";
      await openInquiry(currentInquiry);
      await loadInquiries();
    } catch (e) {
      msg.textContent = e.detail || e.message || "送信できませんでした";
    }
  }

  function backToList() {
    current = null;
    currentInquiry = null;
    el("view-thread").classList.add("hidden");
    el("view-inquiry").classList.add("hidden");
    el("view-list").classList.remove("hidden");
    loadThreads();
    loadInquiries();
  }
</script>

</body>
</html>
