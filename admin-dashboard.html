<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>ダッシュボード - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916m">
  <link rel="stylesheet" href="css/layout.css?v=20260916m">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* ダッシュボード＝今日やることだけ。探すのは一覧（admin-tasks.html）、
       処理するのは右ドロワー（KPTaskDrawer）。ここでは数と3件だけ見せる */
    .dt-table { width:100%; border-collapse:collapse; font-size:13px; }
    .dt-table th { text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
                   padding:0 10px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .dt-table td { padding:10px; border-bottom:1px solid var(--border); vertical-align:top; }
    .dt-table tr:last-child td { border-bottom:none; }
    .dt-table tr.unassigned .who { color:var(--muted); font-style:italic; }
    .dt-who { font-weight:700; color:var(--primary-dark); white-space:nowrap; }

    .dt-today { display:flex; flex-direction:column; gap:4px; min-width:180px; }
    .dt-today a { font-size:12.5px; color:inherit; text-decoration:none; display:flex;
                  align-items:center; gap:5px; cursor:pointer; }
    .dt-today a:hover { color:var(--primary); text-decoration:underline; }
    .dt-today a.done { color:var(--muted); text-decoration:line-through; }
    .dt-today .none { font-size:12px; color:var(--muted); }
    .dt-today .material-symbols-outlined { font-size:15px; flex:0 0 auto; }

    .dt-num { font-variant-numeric:tabular-nums; font-size:15px; font-weight:700;
              color:var(--primary-dark); text-align:right; }
    .dt-num.zero { color:var(--muted); font-weight:500; }
    .dt-num.warn { color:#c53030; }
    .dt-cell-link { text-decoration:none; color:inherit; display:block; }
    .dt-cell-link:hover .dt-num { text-decoration:underline; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 id="greet" class="kp-greet">ダッシュボード</h1>
  <p id="greet-sub" class="kp-greet-sub">読み込み中…</p>

  <div id="notice"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">checklist</span>今日のチーム状況</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 14px;">
      詳しくは、タスクを押すと開きます。一覧で探したいときは
      <a href="admin-tasks.html">タスク一覧</a>へ。
    </p>
    <div class="table-scroll">
      <table class="dt-table">
        <thead>
          <tr>
            <th>担当者</th><th>今日の3つ</th><th>完了数</th><th>期限超過</th><th>契約更新待ち</th>
          </tr>
        </thead>
        <tbody id="dt-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/api-client.js?v=20260916m"></script>
<script src="js/device.js?v=20260916m"></script>
<script src="js/layout.js?v=20260916m"></script>
<script src="js/task-drawer.js?v=20260916m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  KPLayout.init({ active: "dashboard", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    const name = ctx.me?.gw?.employee?.display_name || ctx.me?.email || "";
    el("greet-sub").textContent =
      `${name}　／　${new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })}`;
    await load();
  }

  async function load() {
    let data;
    try {
      data = await API.dashboardTeam();
    } catch (e) {
      el("notice").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>${esc(e.hint || e.detail || e.message || "取得できませんでした")}</div></div>`;
      return;
    }
    if (data.notReady) {
      el("notice").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">info</span>
           <div>${esc(data.message)}</div></div>`;
      el("dt-body").innerHTML = "";
      return;
    }
    el("notice").innerHTML = "";
    render(data);
  }

  function render(data) {
    const rows = [];
    if (data.unassigned) rows.push({ employeeId: null, name: "（未担当）", ...data.unassigned });
    rows.push(...data.team);

    if (!rows.length) {
      el("dt-body").innerHTML = `<tr><td colspan="5" class="empty">今日は、期限超過も契約更新待ちもありません。</td></tr>`;
      return;
    }

    el("dt-body").innerHTML = rows.map((r) => `
      <tr class="${r.employeeId ? "" : "unassigned"}">
        <td><span class="who dt-who">${esc(r.name)}</span></td>
        <td>${todayCell(r.today, data.focusReady)}</td>
        <td class="${numClass(r.doneToday)}">${r.doneToday}</td>
        <td>${countCell(r.overdue, true)}</td>
        <td>${countCell(r.renewalPending, true)}</td>
      </tr>`).join("");
  }

  function todayCell(today, focusReady) {
    if (!focusReady) return `<span class="dt-today"><span class="none">（未設定）</span></span>`;
    if (!today.length) return `<span class="dt-today"><span class="none">今日の3つは未設定</span></span>`;
    return `<span class="dt-today">${today.map((t) => `
      <a class="${t.done ? "done" : ""}" onclick="openTask('${esc(t.id)}');return false;" href="#">
        <span class="material-symbols-outlined">${t.done ? "check_circle" : "radio_button_unchecked"}</span>
        ${esc(t.title)}
      </a>`).join("")}</span>`;
  }

  const numClass = (n) => `dt-num${n ? "" : " zero"}`;
  const countCell = (n, linkOut) => {
    const cls = numClass(n) + (n ? " warn" : "");
    return linkOut && n
      ? `<a class="dt-cell-link" href="admin-tasks.html"><span class="${cls}">${n}</span></a>`
      : `<span class="${cls}">${n}</span>`;
  };

  function openTask(id) {
    KPTaskDrawer.open(id, { onChange: () => load() });
  }
</script>

</body>
</html>
