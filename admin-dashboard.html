<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>ダッシュボード - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916h">
  <link rel="stylesheet" href="css/layout.css?v=20260916h">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 入社手続きの5つの数 */
    .hr-kpi { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 6px; }
    .hr-kpi-box { flex:1 1 110px; border:1px solid var(--border); border-radius:9px;
                  padding:8px 11px; text-decoration:none; color:inherit; }
    .hr-kpi-box .k { display:block; font-size:11px; color:var(--muted); }
    .hr-kpi-box .v { font-size:19px; font-weight:700; color:var(--primary-dark);
                     font-variant-numeric:tabular-nums; }
    .hr-kpi-box .v small { font-size:11px; font-weight:500; margin-left:2px; }
    .hr-kpi-box.warn .v { color:#a05a00; }
    .hr-kpi-box.ok .v { color:#256b36; }

    /* 今日対応する入退社。1件1ブロック。押すとその人の画面へ */
    .hr-soon-row { display:block; border:1px solid var(--border); border-radius:10px;
                   padding:11px 14px; margin-bottom:8px; text-decoration:none; color:inherit; }
    .hr-soon-row:hover { border-color:var(--primary); background:var(--soft); }
    .hr-soon-row .hd { display:flex; align-items:baseline; gap:10px; margin-bottom:5px; }
    .hr-soon-row .hd b { font-size:14px; color:var(--primary-dark); }
    .hr-soon-row .due { font-size:12.5px; font-weight:700; color:var(--muted); }
    .hr-soon-row .due.soon { color:#9c4221; }
    .hr-soon-row .due.late { color:#c53030; }
    .hr-soon-row .n { margin-left:auto; font-size:12px; color:var(--muted);
                      font-variant-numeric:tabular-nums; }
    .hr-soon-row .ln { font-size:12.5px; line-height:1.9; color:var(--text); }
    .hr-soon-row .ln.ok { color:var(--muted); }
    .hr-soon-row .mk { margin-right:6px; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 id="greet" class="kp-greet">ダッシュボード</h1>
  <p id="greet-sub" class="kp-greet-sub">読み込み中…</p>

  <div class="inline-controls" style="margin-bottom:16px;">
    <div style="max-width:280px;">
      <label>取引先</label>
      <select id="client-select" onchange="reload()"></select>
    </div>
  </div>

  <!-- 今日対応する入退社。
       入社日・退社日が近いものだけ、残っている作業と一緒に出す。
       ここに出ていれば、入退社の画面を開きに行く必要がない。
       対象が無ければ、まるごと出さない -->
  <div id="hr-soon"></div>

  <!-- 端末まわりで、管理者が動かないと減らないもの。
       件数が0のときは、まるごと出さない（毎日目に入る場所に0を置かない） -->
  <div id="dev-todo" class="hidden"></div>

  <div id="tiles" class="kp-tiles"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">bolt</span>よく使う操作</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="btn btn-primary" href="admin-notices.html">
        <span class="material-symbols-outlined icon-inline">campaign</span>お知らせを配信
      </a>
      <a class="btn btn-secondary" href="admin-bookings.html">
        <span class="material-symbols-outlined icon-inline">calendar_month</span>スペース予約を承認
      </a>
      <a class="btn btn-secondary" href="admin-hr.html">
        <span class="material-symbols-outlined icon-inline">swap_horiz</span>入退社
      </a>
      <a class="btn btn-secondary" href="admin-members.html">
        <span class="material-symbols-outlined icon-inline">group</span>メンバー・権限
      </a>
      <a class="btn btn-secondary" href="help.html">
        <span class="material-symbols-outlined icon-inline">help</span>使い方ガイド
      </a>
    </div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">receipt_long</span>会計
      <span class="kp-chip" style="margin-left:6px;">別システム</span></h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px;">
      証憑の確認・仕訳の承認・試算表の取得です。社内の連絡や手続きとは別の仕組みで動いています。
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="btn btn-primary" href="admin.html">
        <span class="material-symbols-outlined icon-inline">fact_check</span>会計書類・仕訳を確認
      </a>
      <a class="btn btn-secondary" href="app.html">
        <span class="material-symbols-outlined icon-inline">upload_file</span>書類をアップロード
      </a>
    </div>
  </div>

</div>

<script src="js/api-client.js?v=20260916h"></script>
<script src="js/device.js?v=20260916h"></script>
<script src="js/layout.js?v=20260916h"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const thisMonth = () => new Date().toISOString().slice(0, 7);
  let clients = [];

  KPLayout.init({ active: "dashboard", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    const name = ctx.me?.gw?.employee?.display_name || ctx.me?.email || "";
    el("greet-sub").textContent =
      `${name}　／　${new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })}`;

    // 端末の「やること」は、取引先の選択に関係なく出す。
    // 会計の集計に失敗しても、ここだけは出したい
    loadDeviceTodo();
    loadHrSoon();

    try {
      clients = await API.listClients();
      el("client-select").innerHTML = clients.length
        ? clients.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}${c.accounting_software !== "mf" ? "（MF連携なし）" : ""}</option>`).join("")
        : `<option value="">（取引先がありません）</option>`;
    } catch (e) {
      el("client-select").innerHTML = `<option value="">取得失敗</option>`;
    }
    reload();
  }

  /**
   * 今日対応する入退社。
   *
   * ■ なぜホームに出すのか
   *
   *   入退社の画面を開かないと、何が残っているのか分からなかった。
   *   開かない日が続くと、入社日の前日に「PCが無い」が起きる。
   *
   *   ここに「山田さん 入社まで3日 / PC準備・メール発行が未完了」と
   *   出ていれば、画面を見に行く必要がない。
   *
   * ■ 全部は出さない
   *
   *   残っているものを3件だけ。全部出すと、ホームが
   *   チェックリストになって、他のものが押し出される
   */
  async function loadHrSoon() {
    let rows = [], kpi = null;
    try {
      const r = await API.hrSoon();
      rows = r?.soon || [];
      kpi = r?.kpi || null;
    } catch (e) { return; }        // まだ 066 を流していない等。黙って出さない
    if (!rows.length && !(kpi && kpi.planned)) return;

    // 入社手続きの5つの数。「誰か止まっているか」がここで分かる。
    // 一覧を開くのは、色が付いたときだけでよい
    const box = (label, n, cls) => `
      <a class="hr-kpi-box ${n ? cls : ""}" href="admin-hr.html">
        <span class="k">${label}</span><span class="v">${n}<small>名</small></span></a>`;
    const kpiHtml = kpi && kpi.planned ? `
      <div class="hr-kpi">
        ${box("入社予定", kpi.planned, "")}${box("社労士確認待ち", kpi.advisor, "warn")}
        ${box("本人対応待ち", kpi.employee, "warn")}${box("社内準備未完了", kpi.prep, "warn")}
        ${box("手続き完了", kpi.complete, "ok")}
      </div>` : "";

    el("hr-soon").innerHTML = `
      <div class="card" style="margin-bottom:16px;">
        <h2><span class="material-symbols-outlined">swap_horiz</span>入社手続き</h2>
        ${kpiHtml}
        ${rows.length ? `<h3 style="font-size:13px;margin:14px 0 8px;">今日対応する入退社</h3>` : ""}
        ${rows.map((r) => `
          <a class="hr-soon-row" href="admin-hr.html?id=${esc(r.id)}">
            <div class="hd">
              <b>${esc(r.name)}</b>
              <span class="due ${esc(r.urgency)}">${esc(r.due)}</span>
              <span class="n">${r.progress.done}/${r.progress.total}</span>
            </div>
            ${r.open.map((o) => `
              <div class="ln"><span class="mk">${
                r.urgency === "late" || r.urgency === "soon" ? "🔴" : "🟠"
              }</span>${esc(o.role)}：${esc(o.title)}　未完了</div>`).join("")}
            ${r.recentDone
              ? `<div class="ln ok"><span class="mk">✅</span>${esc(r.recentDone)}　完了</div>`
              : ""}
          </a>`).join("")}
      </div>`;
  }

  /**
   * 端末管理で、管理者が動かないと減らないもの。
   *
   *   ・未確認のアラート … △ が出たまま、誰も確認していない
   *   ・本人の確認待ち   … 押すまで利用時間を1分も数えない
   *
   * どちらも週1回まわしてゼロにする、という運用にしてある。
   * 0のときは何も出さない。0が並ぶ画面は、そのうち読まれなくなる
   */
  async function loadDeviceTodo() {
    let d = null;
    try {
      d = (await API.badges())?.devices;
    } catch (e) { return; }
    if (!d || (!d.alerts && !d.waiting)) return;

    const box = (href, n, k, s, cls) => `
      <a class="kp-tile${cls ? " " + cls : ""}" href="${href}" style="min-width:190px;">
        <div class="k"><span class="material-symbols-outlined" style="font-size:15px;">computer</span>${k}</div>
        <div class="v">${n}<small>件</small></div>
        <div class="s">${s}</div>
      </a>`;

    const parts = [];
    if (d.alerts) {
      parts.push(box("admin-devices.html#alerts", d.alerts, "未確認のアラート",
        "内容を見て「確認した」を押す", "bad"));
    }
    if (d.waiting) {
      parts.push(box("admin-devices.html?f=waiting", d.waiting, "本人の確認待ち",
        "押すまで利用時間を数えません", "warn"));
    }

    el("dev-todo").innerHTML = `
      <div class="card" style="margin-bottom:16px;">
        <h2><span class="material-symbols-outlined">computer</span>端末管理でやること</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
          週に1回まわして、どちらも0にします。
        </p>
        <div class="kp-tiles" style="margin:0;">${parts.join("")}</div>
      </div>`;
    el("dev-todo").classList.remove("hidden");
  }

  async function reload() {
    const clientId = el("client-select").value;
    if (!clientId) {
      el("tiles").innerHTML =
        `<div class="banner warn" style="grid-column:1/-1;">
           <span class="material-symbols-outlined">info</span>
           <div>取引先が登録されていません。会計書類画面の「＋ 取引先を追加」から登録してください。</div>
         </div>`;
      return;
    }
    el("tiles").innerHTML = `<div class="empty" style="grid-column:1/-1;">集計中…</div>`;

    const month = thisMonth();
    const [docs, drafts, drive] = await Promise.all([
      API.listDocuments(clientId, {}).catch(() => null),
      API.listJournals(clientId, "draft").catch(() => null),
      API.driveStatus(clientId).catch(() => null),
    ]);

    const tile = (href, icon, k, v, unit, s, cls) => `
      <a class="kp-tile${cls ? " " + cls : ""}" href="${href}">
        <div class="k"><span class="material-symbols-outlined" style="font-size:15px;">${icon}</span>${k}</div>
        <div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div>
        <div class="s">${s}</div>
      </a>`;

    const out = [];

    if (docs) {
      const inMonth = docs.filter((d) => d.period === month).length;
      const errored = docs.filter((d) => d.status === "error").length;
      out.push(tile("admin.html", "calendar_month", "今月の書類", inMonth, "件", `${month} 分`));
      out.push(tile("admin.html", "inventory_2", "書類の合計", docs.length, "件", "全期間"));
      if (errored) out.push(tile("admin.html", "error", "処理エラー", errored, "件", "再処理が必要です", "alert"));
    }

    if (drafts) {
      out.push(drafts.length
        ? tile("admin.html", "fact_check", "要確認の仕訳", drafts.length, "件", "高額・新規のため確認待ち", "alert")
        : tile("admin.html", "check_circle", "要確認の仕訳", "0", "件", "すべて自動処理されています"));
    }

    if (drive && drive.configured) {
      out.push(drive.pending
        ? tile("admin.html", "cloud_upload", "Drive未保存", drive.pending, "件", "同期が必要です", "alert")
        : tile("admin.html", "cloud_done", "Drive保存", "完了", "", `${drive.total || 0}件すべて保存済み`));
    } else if (drive) {
      out.push(`<div class="kp-tile"><div class="k">
        <span class="material-symbols-outlined" style="font-size:15px;">cloud_off</span>Google Drive</div>
        <div class="v" style="font-size:16px;">未設定</div>
        <div class="s">環境変数の設定が必要です</div></div>`);
    }

    el("tiles").innerHTML = out.length
      ? out.join("")
      : `<div class="banner warn" style="grid-column:1/-1;">
           <span class="material-symbols-outlined">info</span><div>集計データを取得できませんでした。</div></div>`;
  }
</script>

</body>
</html>
