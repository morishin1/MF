<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やること - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910w">
  <link rel="stylesheet" href="css/layout.css?v=20260910w">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">やること</h1>
  <p id="sub" class="kp-greet-sub">いま対応が必要なものです。</p>

  <!-- 入社手続き。終われば自動で消える（api/tasks が返さなくなる） -->
  <div id="ob-card" class="card hidden" style="border-left:4px solid var(--primary);">
    <h2><span class="material-symbols-outlined">badge</span>入社の手続き
      <span id="ob-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px;">
      入社フォーム1つで終わります。会社が把握している内容は入力済みです。
    </p>
    <div id="ob-list"></div>
    <a class="btn btn-primary btn-sm" href="onboarding.html" style="margin-top:12px;">
      <span class="material-symbols-outlined icon-inline">arrow_forward</span>入社フォームを開く
    </a>
  </div>

  <!-- 日報で自分が決めた次の一手 -->
  <div id="act-card" class="card hidden">
    <h2><span class="material-symbols-outlined">flag</span>次にやると決めたこと</h2>
    <div id="act-list"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">checklist</span>頼まれている業務</h2>
    <div class="tabs">
      <button class="tab active" data-filter="open" onclick="setFilter('open', this)">未完了</button>
      <button class="tab" data-filter="done" onclick="setFilter('done', this)">完了</button>
    </div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260910w"></script>
<script src="js/layout.js?v=20260910w"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const today = () => new Date().toISOString().slice(0, 10);

  let tasks = [];
  let extras = { actions: [], onboarding: [] };
  let filter = "open";

  KPLayout.init({ active: "tasks", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) load(ctx); });

  async function load(ctx) {
    if (!ctx.me?.gw?.employee) {
      el("list").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていないため、タスクを表示できません。管理者に登録を依頼してください。</div></div>`;
      return;
    }
    try {
      const res = await API.listTasks("mine");
      tasks = res.tasks || [];
      extras = res.extras || { actions: [], onboarding: [] };
      render();
      renderExtras();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function setFilter(f, btn) {
    filter = f;
    for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b === btn);
    render();
  }

  const isOverdue = (t) =>
    t.due_on && t.status !== "done" && t.status !== "cancelled" && t.due_on < today();

  function render() {
    const shown = tasks.filter((t) =>
      filter === "open" ? (t.status === "todo" || t.status === "doing") : t.status === "done");

    const open = tasks.filter((t) => t.status === "todo" || t.status === "doing").length;
    const late = tasks.filter(isOverdue).length;
    // 入社手続きと「次にやると決めたこと」も、残っている件数に数える。
    // 別枠に出しているだけで、本人にとっては同じ「いまやること」なので
    const all = open + extras.onboarding.filter((i) => i.status === "todo").length
              + extras.actions.length;
    el("sub").textContent = late
      ? `いま対応が必要なもの ${all} 件（うち期限超過 ${late} 件）`
      : `いま対応が必要なもの ${all} 件`;

    if (!shown.length) {
      el("list").innerHTML = `<div class="empty">${filter === "open" ? "やることはありません。おつかれさまです。" : "完了したタスクはありません。"}</div>`;
      return;
    }

    el("list").innerHTML = shown.map((t) => {
      const over = isOverdue(t);
      const done = t.status === "done";
      const due = t.due_on
        ? new Date(t.due_on).toLocaleDateString("ja-JP", { month: "long", day: "numeric" })
        : null;
      return `
        <div class="kp-todo${done ? " done" : ""}">
          <span class="material-symbols-outlined" style="font-size:20px;color:${done ? "var(--primary)" : "#c3cad3"};">
            ${done ? "check_circle" : "radio_button_unchecked"}</span>
          <span class="t">
            ${t.priority === "high" ? '<span class="kp-chip important">高</span> ' : ""}${esc(t.title)}
            ${t.body ? `<small>${esc(t.body)}</small>` : ""}
            ${due ? `<small${over ? ' style="color:#b3261e;font-weight:600;"' : ""}>期限 ${esc(due)}${over ? "（超過）" : ""}</small>` : ""}
            ${t.category ? `<small>${esc(t.category)}</small>` : ""}
          </span>
          ${done
            ? `<button class="btn btn-secondary btn-sm" onclick="setStatus('${esc(t.id)}','todo')">戻す</button>`
            : `<button class="btn btn-primary btn-sm" onclick="setStatus('${esc(t.id)}','done')">完了</button>`}
        </div>`;
    }).join("");
  }

  // 入社手続きと、日報で決めた次の一手。
  // どちらも終われば API が返さなくなるので、この画面から自然に消える
  function renderExtras() {
    const ob = extras.onboarding || [];
    el("ob-card").classList.toggle("hidden", !ob.length);
    if (ob.length) {
      const left = ob.filter((i) => i.status === "todo").length;
      el("ob-tag").textContent = left ? `あと ${left} 件` : "確認待ち";
      el("ob-tag").className = `kp-chip ${left ? "draft" : "event"}`;
      el("ob-list").innerHTML = ob.map((i) => `
        <div class="kp-todo${i.status === "submitted" ? " done" : ""}">
          <span class="material-symbols-outlined"
                style="font-size:20px;color:${i.status === "submitted" ? "var(--primary)" : "#c3cad3"};">
            ${i.status === "submitted" ? "check_circle" : "radio_button_unchecked"}</span>
          <span class="t">${esc(i.title)}
            ${i.required ? "" : '<small>任意</small>'}
            ${i.status === "submitted" ? "<small>提出しました。確認をお待ちください</small>" : ""}
          </span>
        </div>`).join("");
    }

    const acts = extras.actions || [];
    el("act-card").classList.toggle("hidden", !acts.length);
    if (acts.length) {
      el("act-list").innerHTML = acts.map((a) => `
        <div class="kp-todo">
          <span class="material-symbols-outlined" style="font-size:20px;color:#c3cad3;">
            radio_button_unchecked</span>
          <span class="t">${esc(a.title)}
            ${a.detail ? `<small>${esc(a.detail)}</small>` : ""}
            ${a.dueOn ? `<small>期限 ${esc(a.dueOn)}</small>` : ""}
          </span>
        </div>`).join("") + `
        <p class="muted" style="font-size:11.5px;margin:10px 0 0;">
          日報を出すときに「やった」を選ぶと閉じます。
        </p>`;
    }
  }

  async function setStatus(id, status) {
    const t = tasks.find((x) => x.id === id);
    if (t) t.status = status;          // 先に反映して、押した手応えを返す
    render();
    try { await API.updateTask({ id, status }); }
    catch (e) {
      alert(e.detail || e.message || "更新できませんでした");
      const res = await API.listTasks("mine").catch(() => null);
      if (res) { tasks = res.tasks || []; render(); }
    }
  }
</script>

</body>
</html>
