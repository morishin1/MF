<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>企業 - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260927-sales4">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }

    .co-filters { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:10px; }
    .co-filters input, .co-filters select { margin:0; font-size:13px; padding:8px 10px; }
    .co-count { font-size:12px; color:#6b7080; margin:0 0 8px; }
    .co-actions { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
    .co-actions .right { margin-left:auto; }
    /* 並べ替えできる見出し。並べ替え中の列は矢印・色・太さで分かるように */
    .sl-table th.sort { cursor:pointer; user-select:none; white-space:nowrap; }
    .sl-table th.sort:hover { color:#1b2440; }
    .sl-table th.sort .material-symbols-outlined { font-size:15px; vertical-align:-3px; opacity:.35; }
    .sl-table th.sort.on { color:#2f6fd6; font-weight:700; }
    .sl-table th.sort.on .material-symbols-outlined { opacity:1; }
    /* ページを切り替えた瞬間に反応を出す（取り直している間は薄く） */
    #rows.loading { opacity:.45; transition:opacity .08s; pointer-events:none; }
    .co-loading { display:inline-flex; align-items:center; gap:4px; color:#2f6fd6; margin-left:8px; }
    .co-pager { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; margin:14px 0 4px; font-size:13px; }
    .co-pager button { min-width:34px; padding:6px 10px; border:1px solid #d6d6cf; border-radius:6px; background:#fff;
      color:#1b2440; cursor:pointer; font:inherit; }
    .co-pager button.on { background:#1b2440; color:#fff; border-color:#1b2440; font-weight:700; }
    .co-pager button:disabled { opacity:.45; cursor:default; }
    .co-pager .gap { color:#9a9ca8; padding:0 2px; }
    .co-range { text-align:center; font-size:12.5px; color:#6b7080; }

    /* フォームアタック画面（左：企業情報・履歴 ／ 右：営業文） */
    .atk { position:fixed; inset:0; background:#f6f6f2; z-index:42; overflow-y:auto; }
    .atk-head { background:#fff; border-bottom:1px solid #e2e2dc; padding:12px 20px; position:sticky; top:0; z-index:1;
      display:flex; align-items:center; gap:12px; }
    .atk-head h2 { font-size:16px; font-weight:700; color:#1b2440; margin:0; flex:1; }
    .atk-body { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:18px; padding:18px 20px 40px;
      max-width:1200px; margin:0 auto; }
    .atk-col { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:16px 18px; min-width:0; }
    .atk-col h3 { font-size:13px; color:#1b2440; margin:0 0 10px; }
    .atk-links { display:flex; flex-direction:column; gap:8px; margin:0 0 14px; }
    .atk-step { font-size:11.5px; color:#6b7080; margin:0 0 4px; }
    .atk-url { font-size:12px; background:#f6f6f2; border-radius:6px; padding:8px 10px; word-break:break-all; color:#1b2440; }
    .atk-body textarea#at-body { min-height:300px; font-size:13.5px; }
    .atk-done { margin-top:16px; padding-top:14px; border-top:1px solid #e2e2dc; }
    @media (max-width: 860px) { .atk-body { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="sl-title">企業</h1>
  <p class="sl-sub">営業先の企業を一覧で見て、詳細は右ドロワーで開きます。</p>

  <div class="co-actions">
    <button class="btn btn-primary btn-sm" onclick="openAdd()">
      <span class="material-symbols-outlined icon-inline">add_business</span>企業を追加</button>
    <button class="btn btn-secondary btn-sm" onclick="openBulkUrls()">
      <span class="material-symbols-outlined icon-inline">playlist_add</span>URLをまとめて追加</button>
    <button class="btn btn-secondary btn-sm" onclick="openImport()">
      <span class="material-symbols-outlined icon-inline">upload</span>スプレッドシートから取り込む</button>
    <button class="btn btn-secondary btn-sm right" id="btn-download" onclick="openDownload()">
      <span class="material-symbols-outlined icon-inline">download</span>ダウンロード</button>
  </div>

  <!-- 検索・絞り込み・並べ替え・ページはすべてサーバー側（db/097）。変えたら1ページ目へ戻す -->
  <div class="co-filters">
    <input type="text" id="f-q" placeholder="企業名・URLで探す" oninput="onSearchInput()">
    <select id="f-visibility" onchange="onFilter()" aria-label="表示状態">
      <option value="shown">表示中</option>
      <option value="hidden">非表示</option>
      <option value="all">すべて</option>
    </select>
    <select id="f-industry" onchange="onFilter()" aria-label="業種"></select>
    <select id="f-region" onchange="onFilter()" aria-label="地域"></select>
    <select id="f-service" onchange="onFilter()" aria-label="商材"></select>
    <select id="f-status" onchange="onFilter()" aria-label="状態"></select>
    <select id="f-owner" onchange="onFilter()" aria-label="担当"></select>
    <select id="f-channel" onchange="onFilter()" aria-label="連絡手段"></select>
    <select id="f-attacked" onchange="onFilter()" aria-label="アタック">
      <option value="">アタック：すべて</option>
      <option value="yes">アタック済</option>
      <option value="no">未アタック</option>
    </select>
    <select id="f-clicked" onchange="onFilter()" aria-label="クリック">
      <option value="">クリック：すべて</option>
      <option value="yes">クリックあり</option>
      <option value="no">クリックなし</option>
    </select>
  </div>
  <div class="co-count" id="count"></div>

  <div style="overflow-x:auto;">
    <table class="sl-table">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"><tr><td colspan="11" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
  <div class="co-pager" id="pager"></div>
  <div class="co-range" id="range"></div>
</div>

<div id="modal-root"></div>
<div id="bulk-root"></div>
<div id="action-root"></div>
<div id="attack-root"></div>

<script src="../js/api-client.js?v=20260929pg1"></script>
<script src="../js/layout.js?v=20260928h"></script>
<script src="../js/sales-layout.js?v=20260928h"></script>
<script>
  const el = (id) => document.getElementById(id);
  // 企業詳細の取得は、あとから開いたものだけを画面に出す。
  // 取得中にドロワーを閉じた・別の企業を開いたときは、古い応答を捨てる
  // （捨てないと、消えた #detail-box に書こうとして落ちる／別の企業の詳細に上書きする）
  let detailSeq = 0;
  let detailOpenId = null;
  const detailIsCurrent = (seq, id) => seq === detailSeq && detailOpenId === id && Boolean(el("detail-box"));
  const esc = SalesLayout.esc;
  const { fmt, fmtDay, ago, statusPill } = SalesLayout;

  const STATUSES = [
    ["untouched", "未アタック"], ["attacked", "アタック済"], ["clicked", "クリックあり"], ["replied", "返信あり"],
    ["meeting", "商談"], ["proposal", "提案"], ["won", "成約"],
    ["reattack_wait", "再アタック待ち"], ["lost", "失注"], ["excluded", "対象外"],
  ];
  const INDUSTRIES = ["製造", "不動産", "士業", "医療", "小売", "その他"];
  const SERVICES = ["AI / DX", "システム開発", "PCレンタル", "ホームページ改善", "地方創生", "ENGER", "その他"];

  let companies = [];
  let members = [];
  let myEmployeeId = null;
  let myName = "";
  let canForce = false;
  // 複数選択（チェックボックス）。shown＝いま一覧に出ている企業（全選択はここだけが対象）
  const selected = new Set();
  let shown = [];

  // ---- 一覧の状態（URL に持つ） ----------------------------------------------------
  //
  // 検索・絞り込み・並べ替え・ページはすべてサーバー側（/api/sales/companies?page=…。db/097）。
  // ブラウザは「いまのページの100社」しか持たない。状態は URL に書いて、
  // 企業詳細を開いて閉じても・ブラウザで戻っても、同じページ・条件に戻れるようにする。
  const LIST_KEYS = ["page", "q", "status", "owner", "service", "industry", "region", "channel", "visibility",
    "attacked", "clicked", "sort", "order"];
  const FILTER_IDS = { q: "f-q", status: "f-status", owner: "f-owner", service: "f-service", industry: "f-industry",
    region: "f-region", channel: "f-channel", visibility: "f-visibility", attacked: "f-attacked", clicked: "f-clicked" };
  const CONTACT_CHANNELS = [["email", "メール"], ["line", "LINE"], ["instagram", "Instagram"], ["x", "X"],
    ["facebook", "Facebook"], ["linkedin", "LinkedIn"], ["phone", "電話"], ["other", "その他"]];
  // 見出し（並べ替えのキーは api 側 lib/sales.js LIST_SORTS と同じ）
  const COLUMNS = [
    ["企業", "name"], ["業種", "industry"], ["地域", "region"], ["商材", "service"], ["状態", "status"],
    ["最終アタック", "last_sent"], ["連絡手段", "channel"], ["クリック", "clicks"], ["NEXT", "next"], ["担当", "owner"],
  ];
  const COLS = COLUMNS.length + 1;
  const SORT_HINT = {
    owner: "担当者名で並べ替え（未定は最後）",
    next: "NEXTの急ぐ順で並べ替え（未対応クリックの「要フォロー」が先頭 → 期限の近い順 → 期限なし → アタック待ち）",
  };
  let state = readState();
  let pageInfo = { page: 1, total: 0, totalPages: 1, limit: 100 };
  let facets = null;
  let listSeq = 0;

  function readState(search = location.search) {
    const q = new URLSearchParams(search);
    const st = {};
    for (const k of LIST_KEYS) st[k] = q.get(k) || "";
    st.page = Math.max(1, Number(st.page) || 1);
    st.visibility = st.visibility || "shown";
    st.order = st.order === "desc" ? "desc" : "asc";
    if (!st.sort) st.order = "";
    return st;
  }
  // 一覧の状態だけの URL（extra に id・attack などを足せる）
  function listUrl(extra = {}) {
    const q = new URLSearchParams();
    for (const k of LIST_KEYS) {
      const v = state[k];
      if (!v || (k === "page" && v === 1) || (k === "visibility" && v === "shown")) continue;
      q.set(k, v);
    }
    for (const [k, v] of Object.entries(extra)) if (v) q.set(k, v);
    const s = q.toString();
    return `/sales/companies.html${s ? `?${s}` : ""}`;
  }
  function apiParams(extra = {}) {
    const p = {};
    for (const k of LIST_KEYS) if (state[k]) p[k] = state[k];
    return { ...p, ...extra };
  }
  function syncControls() {
    for (const [k, id] of Object.entries(FILTER_IDS)) {
      const node = el(id);
      if (node && node.value !== state[k] && document.activeElement !== node) node.value = state[k];
    }
  }

  SalesLayout.init({ active: "companies" }).then((ctx) => {
    if (!ctx) return;
    canForce = ctx.canForce;
    myName = ctx.me?.gw?.employee?.display_name || "";
    start();
  });

  async function start() {
    renderHead();
    renderFilters();
    syncControls();
    await load({ facets: true });
    const q = new URLSearchParams(location.search);
    if (q.get("new")) openAdd();
    else if (q.get("attack")) openAttack(q.get("attack"));
    else if (q.get("id")) openDetail(q.get("id")).then((shown) => { if (shown && q.get("meeting")) openMeeting(); });
  }

  // ブラウザの戻る・進む：URL の状態に合わせて一覧を取り直す。企業詳細は URL に無ければ閉じる
  window.addEventListener("popstate", () => {
    state = readState();
    syncControls();
    renderHead();
    const q = new URLSearchParams(location.search);
    if (!q.get("id") && !q.get("attack")) {
      detailSeq++; detailOpenId = null;
      el("modal-root").innerHTML = ""; el("action-root").innerHTML = ""; el("attack-root").innerHTML = "";
    }
    load();
  });

  // 条件を変えたら1ページ目へ戻して、履歴に積む（ブラウザの戻るで前の条件に戻れる）
  function go(patch) {
    state = { ...state, ...patch };
    history.pushState({}, "", listUrl());
    renderHead();
    load();
  }
  function onFilter() {
    const patch = { page: 1 };
    for (const [k, id] of Object.entries(FILTER_IDS)) if (k !== "q") patch[k] = el(id).value;
    go(patch);
  }
  let searchTimer = null;
  function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const v = el("f-q").value.trim();
      if (v === state.q) return;
      // 1文字ずつ履歴に積まない（検索中は置き換え）
      state = { ...state, q: v, page: 1 };
      history.replaceState({}, "", listUrl());
      load();
    }, 300);
  }
  function goPage(p) {
    if (p < 1 || p > pageInfo.totalPages || p === state.page) return;
    go({ page: p });
  }
  // 並べ替え：未指定 → 昇順 → 降順 → 未指定
  function toggleSort(key) {
    if (state.sort !== key) go({ sort: key, order: "asc", page: 1 });
    else if (state.order === "asc") go({ order: "desc", page: 1 });
    else go({ sort: "", order: "", page: 1 });
  }

  function renderHead() {
    el("head").innerHTML = `<th class="sl-check"><input type="checkbox" id="sel-all" aria-label="このページの企業をすべて選択"
        onclick="toggleAll(this.checked)"></th>` + COLUMNS.map(([label, key]) => {
      const on = state.sort === key;
      const icon = on ? (state.order === "asc" ? "arrow_upward" : "arrow_downward") : "unfold_more";
      const aria = on ? (state.order === "asc" ? "ascending" : "descending") : "none";
      return `<th class="sort${on ? " on" : ""}" data-sort="${esc(key)}" aria-sort="${aria}" onclick="toggleSort('${esc(key)}')"
        title="${esc(SORT_HINT[key] || `${label}で並べ替え`)}">${esc(label)}<span class="material-symbols-outlined" aria-hidden="true">${icon}</span></th>`;
    }).join("");
  }

  // 取り直す。押した瞬間に一覧を薄くして「読み込み中」を出す（押しても無反応に見えないように）。
  // 前の取得が遅れて返ってきても、新しいほうだけを画面に出す
  async function load({ facets: withFacets = false } = {}) {
    const seq = ++listSeq;
    el("rows").classList.add("loading");
    el("count").innerHTML = `${esc(el("count").dataset.text || "")}<span class="co-loading" id="loading">
      <span class="material-symbols-outlined" style="font-size:15px;">progress_activity</span>読み込み中…</span>`;
    el("pager").querySelectorAll("button").forEach((b) => { b.disabled = true; });
    try {
      const res = await API.listSalesCompanyPage(apiParams({ facets: withFacets || !facets ? 1 : undefined }));
      if (seq !== listSeq) return;
      el("rows").classList.remove("loading");
      if (res.notReady) {
        el("count").textContent = "";
        el("rows").innerHTML = `<tr><td colspan="${COLS}"><div class="banner warn">
          <span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div></td></tr>`;
        el("pager").innerHTML = ""; el("range").textContent = "";
        return;
      }
      companies = res.companies || [];
      members = res.members || members;
      myEmployeeId = res.me || null;
      if (res.facets) facets = res.facets;
      pageInfo = { page: res.page, total: res.total, totalPages: res.totalPages, limit: res.limit };
      // 範囲外のページを頼んだときは、サーバーが最後のページを返す。URL もそれに合わせる
      if (res.page !== state.page) { state.page = res.page; history.replaceState({}, "", listUrl(currentExtra())); }
      renderFilters();
      render();
    } catch (e) {
      if (seq !== listSeq) return;
      el("rows").classList.remove("loading");
      el("count").textContent = "";
      el("rows").innerHTML = `<tr><td colspan="${COLS}"><div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>企業一覧を取得できませんでした：${esc(errText(e, ""))}
          <button class="btn btn-secondary btn-sm" style="margin-left:8px;" onclick="load()">再読み込み</button></div></div></td></tr>`;
      // ページャー・絞り込みは使えるまま（別の条件で取り直せる）
      renderPager();
    }
  }
  // いま URL に付いている企業詳細・アタックの指定（一覧の状態を書き換えるときに消さない）
  function currentExtra() {
    const q = new URLSearchParams(location.search);
    return { id: q.get("id"), attack: q.get("attack") };
  }

  // 絞り込みの候補。業種・地域・商材はサーバーの集計（件数つき）から作る（全社を画面に送らない）
  function renderFilters() {
    const opts = (id, first, values, key) => {
      const cur = state[key] || "";
      const list = values.some(([v]) => v === cur) || !cur ? values : [...values, [cur, cur]];
      el(id).innerHTML = `<option value="">${esc(first)}</option>`
        + list.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`).join("");
    };
    const fac = (k) => (facets?.[k] || []).map((x) => [x.value, `${x.value}（${x.n}）`]);
    opts("f-industry", "業種：すべて", fac("industry"), "industry");
    opts("f-region", "地域：すべて", fac("region"), "region");
    opts("f-service", "商材：すべて", fac("service"), "service");
    opts("f-status", "状態：すべて", [...STATUSES, ["ng", "営業禁止"]], "status");
    opts("f-owner", "担当：すべて", [["me", "自分"], ["none", "未定"], ...members.map((m) => [m.id, m.display_name])], "owner");
    opts("f-channel", "連絡手段：すべて", [...CONTACT_CHANNELS, ["none", "未設定"]], "channel");
  }

  function renderPager() {
    const { page, totalPages, total, limit } = pageInfo;
    const from = total ? (page - 1) * limit + 1 : 0;
    const to = Math.min(total, page * limit);
    const nf = (n) => Number(n).toLocaleString("ja-JP");
    el("range").textContent = total ? `${nf(from)}–${nf(to)} / ${nf(total)}件` : "";
    if (totalPages <= 1) { el("pager").innerHTML = ""; return; }
    // 1 … 3 4 5 … 13 の形（最初・最後・いまの前後だけ）
    const nums = [...new Set([1, page - 1, page, page + 1, totalPages])].filter((n) => n >= 1 && n <= totalPages).sort((a, b) => a - b);
    let html = `<button onclick="goPage(${page - 1})" ${page <= 1 ? "disabled" : ""} aria-label="前のページ">← 前へ</button>`;
    let prev = 0;
    for (const n of nums) {
      if (n - prev > 1) html += `<span class="gap">…</span>`;
      html += `<button class="${n === page ? "on" : ""}" onclick="goPage(${n})" ${n === page ? 'aria-current="page"' : ""}>${n}</button>`;
      prev = n;
    }
    html += `<button onclick="goPage(${page + 1})" ${page >= totalPages ? "disabled" : ""} aria-label="次のページ">次へ →</button>`;
    el("pager").innerHTML = html;
  }

  function render() {
    shown = companies.map((c) => c.id);
    // このページに無い企業は選択から外す（一括操作・CSV が、画面に出ていない企業に及ばないように）
    const vis = new Set(shown);
    for (const id of [...selected]) if (!vis.has(id)) selected.delete(id);
    const nf = (n) => Number(n).toLocaleString("ja-JP");
    const text = `${nf(pageInfo.total)}社`;
    el("count").dataset.text = text;
    el("count").textContent = text;
    renderPager();
    if (!companies.length) {
      const filtered = LIST_KEYS.some((k) => !["page", "sort", "order", "visibility"].includes(k) && state[k]);
      el("rows").innerHTML = `<tr><td colspan="${COLS}" class="empty">${filtered ? "対象がありません。"
        : state.visibility === "hidden" ? "非表示の企業はありません。"
        : "まだ企業がありません。「企業を追加」か「リストを取り込む」から始めてください。"}</td></tr>`;
      renderSelection();
      return;
    }
    el("rows").innerHTML = companies.map((c) => `
      <tr class="click${selected.has(c.id) ? " sel" : ""}" data-id="${esc(c.id)}" onclick="openDetail('${esc(c.id)}')">
        <td class="sl-check" onclick="event.stopPropagation()"><input type="checkbox" aria-label="${esc(c.name)}を選択"
          ${selected.has(c.id) ? "checked" : ""} onclick="event.stopPropagation();toggleOne('${esc(c.id)}', this.checked)"></td>
        <td><span class="sl-nm">${esc(c.name)}</span><span class="sl-sub2">${esc(c.domain || "")}</span></td>
        <td>${esc(c.industry || "—")}</td>
        <td>${esc(c.region || "—")}</td>
        <td>${esc(c.service || "—")}</td>
        <td>${c.hidden ? statusPill("lost", `非表示：${c.hiddenLabel || ""}`)
          : c.ngReason ? statusPill("excluded", `NG：${c.ngLabel}`) : statusPill(c.status, c.statusLabel)}</td>

  function closeModal() {
    // 取得中の企業詳細があれば、その結果はもう画面に書かない（閉じたあとに戻ってきた応答を捨てる）
    detailSeq++;

    el("modal-root").innerHTML = "";
    el("action-root").innerHTML = "";

    history.replaceState({}, "", listUrl());

  // 企業詳細から行う操作・一括操作は、中央モーダル（1つだけ）で開く。
  // 背景を押しても閉じるのはモーダルだけ。背後の企業詳細ドロワーは残す（/hr と同じ操作感）
  function openActionModal(html) {
    closeBulkMenu();
    el("action-root").innerHTML = `<div class="sl-modal-bg" onclick="closeAction()"></div>
      <div class="sl-modal" role="dialog" aria-modal="true">${html}</div>`;
  }
  function closeAction() { el("action-root").innerHTML = ""; }
  function errText(e, fallback) { return e.hint || e.detail || e.message || fallback; }

  // ---- 複数選択・一括操作 ------------------------------------------------------------
  //
  // チェックボックス＝選ぶだけ（詳細は開かない）。行＝企業詳細（右ドロワー）。
  // 1社以上選ぶと画面下中央にバーを出し、操作はすべて中央モーダルで行う。
  // 更新はサーバの一括API（/api/sales/companies/bulk）で1回にまとめる。
  const NG_REASONS = [
    ["no_sales", "営業禁止"], ["unsubscribed", "配信停止希望"], ["no_form_sales", "問い合わせフォーム営業禁止"],
    ["partner", "取引先"], ["customer", "既存顧客"], ["competitor", "競合"], ["other", "その他"],
  ];
  // 非表示の理由（lib/sales.js HIDE_REASONS と同じ）
  const HIDE_REASONS = [
    ["link_broken", "リンク切れ"], ["no_info", "会社情報なし"], ["closed", "閉業"],
    ["not_target", "営業対象外"], ["duplicate", "重複"], ["other", "その他"],
  ];
  const hideForm = (name) => `
    <label>理由</label>
    <div>${HIDE_REASONS.map(([k, l]) => `
      <label class="sl-chip"><input type="radio" name="${name}" value="${esc(k)}">${esc(l)}</label>`).join("")}</div>
    <label style="margin-top:10px;">メモ（任意）</label>
    <textarea id="${name}-note" rows="2"></textarea>`;

  function toggleOne(id, on) {
    if (on) selected.add(id); else selected.delete(id);
    renderSelection();
  }
  function toggleAll(on) {
    for (const id of shown) { if (on) selected.add(id); else selected.delete(id); }
    renderSelection();
  }
  function clearSelection() {
    selected.clear();
    renderSelection();
  }

  // 行の見た目・全選択・バーだけを更新する（一覧を描き直さない）
  function renderSelection() {
    document.querySelectorAll("#rows tr[data-id]").forEach((tr) => {
      const on = selected.has(tr.dataset.id);
      tr.classList.toggle("sel", on);
      const cb = tr.querySelector("td.sl-check input");
      if (cb) cb.checked = on;
    });
    const all = el("sel-all");
    const n = shown.filter((id) => selected.has(id)).length;
    all.checked = Boolean(shown.length) && n === shown.length;
    all.indeterminate = n > 0 && n < shown.length;
    renderBulkBar();
  }

  function renderBulkBar() {
    const n = selected.size;
    if (!n) { el("bulk-root").innerHTML = ""; return; }
    el("bulk-root").innerHTML = `
      <div class="sl-bulkbar" role="toolbar" aria-label="選択した企業の操作">
        <span class="cnt"><span class="material-symbols-outlined" style="font-size:18px;">check_box</span><span id="bulk-count">${n}社選択中</span></span>
        <button class="btn btn-secondary btn-sm" onclick="openBulk('status')">ステータス変更</button>
        <button class="btn btn-secondary btn-sm" onclick="openBulk('owner')">担当変更</button>
        <button class="btn btn-secondary btn-sm" id="bulk-csv" onclick="downloadCsv('selected', this)">
          <span class="material-symbols-outlined icon-inline">download</span>CSV</button>
        <span class="more">
          <button class="btn btn-secondary btn-sm" id="bulk-more" aria-haspopup="menu" onclick="toggleBulkMenu(event)">その他 ▼</button>
          <div class="sl-bulkmenu" id="bulk-menu" role="menu" hidden>
            <button role="menuitem" onclick="openBulk('service')">提案サービス変更</button>
            <button role="menuitem" onclick="openBulk('campaign')">キャンペーン変更</button>
            <button role="menuitem" onclick="openBulk('hide')">非表示にする</button>
            <button role="menuitem" onclick="openBulk('unhide')">再表示する</button>

        <button class="btn btn-secondary btn-sm" onclick="clearSelection()">選択解除</button>

  // ---- CSV ダウンロード（サーバーで作る） ----------------------------------------------
  //
  // 「いまの検索・絞り込み結果すべて」か「チェックした企業だけ」。どちらもサーバーで条件を実行し直して作る
  // （画面に出ている100件からは作らない）。UTF-8 BOM つきなので Excel でそのまま開ける
  function openDownload() {
    const n = selected.size;
    const total = pageInfo.total;
    openActionModal(`
      <h2>CSVでダウンロード</h2>
      <label>ダウンロードする企業</label>
      <div>
        <label class="sl-chip" style="display:flex;"><input type="radio" name="dl-target" value="selected" ${n ? "checked" : "disabled"}>
          選択中 ${n}社${n ? "" : "（一覧でチェックすると選べます）"}</label>
        <label class="sl-chip" style="display:flex;"><input type="radio" name="dl-target" value="filtered" ${n ? "" : "checked"}>
          いまの検索・絞り込み結果すべて（${Number(total).toLocaleString("ja-JP")}社）</label>
      </div>
      <p class="sl-muted" style="margin:8px 0 0;">並び順は一覧と同じです。Excel でそのまま開けます（UTF-8 BOM つき）。</p>
      <div id="dl-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="sl-modal-foot">
        <button class="btn btn-primary" id="dl-go" onclick="downloadCsv(document.querySelector('input[name=dl-target]:checked')?.value, this)">
          <span class="material-symbols-outlined icon-inline">download</span>ダウンロード</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }

  async function downloadCsv(target, btn) {
    closeBulkMenu();
    const ids = target === "selected" ? [...selected] : null;
    if (target === "selected" && !ids.length) return;
    try {
      const { blob, filename } = await KPLayout.busy(btn, "作成中…",
        () => API.exportSalesCompanies(apiParams({ page: undefined }), ids));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      if (el("dl-go")) closeAction();
    } catch (e) {
      const msg = el("dl-msg");
      if (msg) msg.textContent = errText(e, "ダウンロードできませんでした");
      else alert(errText(e, "ダウンロードできませんでした"));
    }
  }

  function toggleBulkMenu(ev) {
    ev.stopPropagation();
    const m = el("bulk-menu");
    if (m) m.hidden = !m.hidden;
  }
  function closeBulkMenu() { const m = el("bulk-menu"); if (m) m.hidden = true; }
  document.addEventListener("click", (e) => { if (!e.target.closest?.(".sl-bulkbar .more")) closeBulkMenu(); });

  const bulkFoot = (label, onclick, danger) => `
    <div id="bk-msg" class="err-text" style="margin:10px 0 0;"></div>
    <div class="sl-modal-foot">
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="bk-go" onclick="${onclick}">${esc(label)}</button>
      <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
    </div>`;

  async function openBulk(kind) {
    closeBulkMenu();
    const n = selected.size;
    if (!n) return;
    if (kind === "status") {
      openActionModal(`
        <h2>${n}社のステータスを変更します</h2>
        <label>変更後のステータス</label>
        <select id="bk-status">${STATUSES.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
        <p class="sl-muted" style="margin:8px 0 0;">すでに同じステータスの企業はそのままです。変更は各社の営業履歴に残ります。</p>
        ${bulkFoot(`${n}社を変更する`, "submitBulk(this, 'change_status', { status: el('bk-status').value })")}`);
    } else if (kind === "owner") {
      openActionModal(`
        <h2>${n}社の担当を変更します</h2>
        <label>担当者</label>
        <select id="bk-owner"><option value="">（未定）</option>${members.map((m) =>
          `<option value="${esc(m.id)}" ${m.id === myEmployeeId ? "selected" : ""}>${esc(m.display_name)}</option>`).join("")}</select>
        ${bulkFoot(`${n}社を変更する`, "submitBulk(this, 'change_owner', { ownerId: el('bk-owner').value || null })")}`);
    } else if (kind === "service") {
      openActionModal(`
        <h2>${n}社の提案サービスを変更します</h2>
        <label>提案サービス</label>
        <input id="bk-service" type="text" list="dl-bk-service" placeholder="空欄にすると未設定になります">
        <datalist id="dl-bk-service">${SERVICES.map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
        ${bulkFoot(`${n}社を変更する`, "submitBulk(this, 'change_service', { service: el('bk-service').value.trim() || null })")}`);
    } else if (kind === "campaign") {
      openActionModal(`
        <h2>${n}社のキャンペーンを変更します</h2>
        <label>キャンペーン</label>
        <select id="bk-campaign" disabled><option value="">読み込み中…</option></select>
        ${bulkFoot(`${n}社を変更する`, "submitBulk(this, 'change_campaign', { campaignId: el('bk-campaign').value || null })")}`);
      // 候補が出るまでは押せない（読み込み中に押すと「なし」で上書きしてしまう）
      el("bk-go").disabled = true;
      try {
        const r = await API.listSalesCampaigns();
        const sel = el("bk-campaign");
        if (!sel) return;
        sel.innerHTML = `<option value="">（なし）</option>` + (r.campaigns || []).filter((c) => !c.archived)
          .map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
        sel.disabled = false;
        el("bk-go").disabled = false;
      } catch (e) { const m = el("bk-msg"); if (m) m.textContent = errText(e, "キャンペーンを取得できませんでした"); }
    } else if (kind === "ng") {
      openActionModal(`
        <h2>${n}社を営業禁止にします</h2>
        <p class="sl-sub" style="margin:0 0 12px;">営業禁止の企業には、誰もフォームアタックできなくなります。すでに営業禁止の企業はそのままです。</p>
        <label>理由</label>
        <div>${NG_REASONS.map(([k, l]) => `
          <label class="sl-chip"><input type="radio" name="bk-ng" value="${esc(k)}">${esc(l)}</label>`).join("")}</div>
        <label style="margin-top:10px;">補足（任意）</label>
        <textarea id="bk-ng-note" rows="2"></textarea>
        ${bulkFoot(`${n}社を営業禁止にする`, "submitBulkNg(this)")}`);
    } else if (kind === "hide") {
      openActionModal(`
        <h2>${n}社を非表示にします</h2>
        <p class="sl-sub" style="margin:0 0 12px;">削除ではありません。データは残り、通常の一覧・ダッシュボード・アタック対象から外れます。
          「表示状態：非表示」でいつでも確認・再表示できます。すでに非表示の企業はそのままです。</p>
        ${hideForm("bk-hide")}
        ${bulkFoot(`${n}社を非表示にする`, "submitBulkHide(this)")}`);
    } else if (kind === "unhide") {
      openActionModal(`
        <h2>${n}社を再表示します</h2>
        <p class="sl-sub" style="margin:0 0 12px;">通常の一覧・アタック対象に戻します。非表示でない企業はそのままです。</p>
        ${bulkFoot(`${n}社を再表示する`, "submitBulk(this, 'unhide', {})")}`);
    } else if (kind === "delete") {
      openBulkDelete();
    }
  }

  function submitBulkNg(btn) {
    const picked = document.querySelector('input[name="bk-ng"]:checked');
    if (!picked) { el("bk-msg").textContent = "理由を選んでください"; return; }
    return submitBulk(btn, "set_ng", { ngReason: picked.value, ngNote: el("bk-ng-note").value.trim() || null });
  }

  function hidePicked(name, msgId) {
    const picked = document.querySelector(`input[name="${name}"]:checked`);
    const note = el(`${name}-note`).value.trim();
    const msg = el(msgId);
    if (!picked) { msg.textContent = "理由を選んでください"; return null; }
    return { reason: picked.value, note: note || null };
  }
  function submitBulkHide(btn) {
    const v = hidePicked("bk-hide", "bk-msg");
    if (v) return submitBulk(btn, "hide", v);
  }

  // 削除は危険操作。まずサーバで「消せる企業／消せない企業（理由つき）」を確かめてから、消せる企業だけを消す
  async function openBulkDelete() {
    const ids = [...selected];
    openActionModal(`
      <h2>選択した${ids.length}社を削除します</h2>
      <p class="sl-sub" style="margin:0 0 10px;">営業履歴・クリック履歴・面談情報への影響を確認しています…</p>
      <div id="bk-del"><div class="empty" style="padding:16px;">確認中…</div></div>`);
    let r;
    try {
      r = await API.bulkSalesCompanies({ ids, action: "delete", dryRun: true });
    } catch (e) {
      const box = el("bk-del");
      if (box) box.innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(errText(e, "確認できませんでした"))}</div></div>`;
      return;
    }
    const box = el("bk-del");
    if (!box) return;
    const ok = r.deletable || [];
    const ng = r.blocked || [];
    const list = (arr, fn) => `<ul style="margin:6px 0 0;padding-left:18px;font-size:12.5px;max-height:160px;overflow-y:auto;">${arr.map(fn).join("")}</ul>`;
    box.previousElementSibling.textContent = "削除すると元に戻せません。履歴のある企業は削除できません。";
    box.innerHTML = `
      ${ng.length ? `<div class="banner warn" style="margin:0 0 10px;"><span class="material-symbols-outlined">block</span>
        <div><b>削除できない企業：${ng.length}社</b>（履歴を残すため）。「対象外」「失注」などのステータス変更や、営業禁止を使ってください。
        ${list(ng, (c) => `<li>${esc(c.name)}：${esc(c.reasons.join("・"))}</li>`)}</div></div>` : ""}
      ${ok.length ? `<div><b style="font-size:13px;">削除する企業：${ok.length}社</b>
        ${list(ok, (c) => `<li>${esc(c.name)}</li>`)}</div>` : `<p class="sl-muted" style="margin:0;">削除できる企業はありません。</p>`}
      ${ok.length ? bulkFoot(`${ok.length}社を削除する`, `submitBulkDelete(this, ${esc(JSON.stringify(ok.map((c) => c.id)))})`, true)
        : `<div class="sl-modal-foot"><button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`}`;
  }

  function submitBulkDelete(btn, ids) {
    return submitBulk(btn, "delete", {}, ids);
  }

  // 一括更新 → モーダルを閉じる → 一覧を取り直す → 選択を解除（バーも消える）
  async function submitBulk(btn, action, extra, onlyIds) {
    const msg = el("bk-msg"); if (msg) msg.textContent = "";
    const ids = onlyIds || [...selected];
    let r;
    try {
      r = await KPLayout.busy(btn, "処理中…", () => API.bulkSalesCompanies({ ids, action, ...extra }));
    } catch (e) {
      if (msg) msg.textContent = errText(e, "できませんでした");
      return;
    }
    closeAction();
    clearSelection();
    // 開いている企業詳細が対象なら、そちらも最新にする（一覧も一緒に取り直す）。削除したなら閉じる
    if (detailOpenId && ids.includes(detailOpenId) && action !== "delete") reloadDetail();
    else {
      if (detailOpenId && ids.includes(detailOpenId)) closeModal();
      await load();
    }
    const miss = (r.failed || 0) + (r.notFound || 0);
    if (miss) alert(`${miss}社は処理できませんでした（見つからない・権限がないなど）。`);
  }

  // ---- 企業を追加（URL中心のクイック登録） ------------------------------------------

  // 担当は登録した人（サーバで自動）。詳細は「詳細情報を入力」を開いたときだけ。
  const SERVICE_KEY = "sales_last_service";
  const hostOf = (u) => { try { return new URL(/^https?:\/\//i.test(u) ? u : `https://${u}`).hostname.replace(/^www\./, ""); } catch { return ""; } };
  let lookSeq = 0;
  let lookDup = null;

  function openAdd(prefillUrl) {

        <label style="margin-top:10px;">企業名 <span style="color:#b3261e;">*</span></label>

        </details>

            <span class="material-symbols-outlined icon-inline">send</span>追加してアタックへ</button>
          <button class="btn btn-secondary" onclick="submitAdd(this, false)">追加だけする</button>

        </div>
      </div>`;
    setTimeout(() => { el("q-url")?.focus(); if (prefillUrl) lookupUrl(); }, 0);

  /** URL から候補を拾って、空いている欄にだけ入れる（人が打ったものは上書きしない） */
  async function lookupUrl() {
    const url = el("q-url")?.value.trim();
    const info = el("q-look");
    lookDup = null;
    el("q-go").disabled = false;
    if (!url) { info.textContent = ""; return; }
    const seq = ++lookSeq;
    info.innerHTML = `<span class="material-symbols-outlined icon-inline kp-spin">progress_activity</span>サイトを確認しています…`;
    let r;
    try { r = await API.lookupSalesUrl(url); }
    catch (e) { if (seq === lookSeq) info.textContent = errText(e, "URLを確認できませんでした"); return; }
    if (seq !== lookSeq) return;

    if (r.duplicate) {
      lookDup = r.duplicate;
      el("q-go").disabled = true;
      info.innerHTML = `<span class="sl-hot">登録済みです：${esc(r.duplicate.name)}</span>　
        <a href="#" onclick="openDetail('${esc(r.duplicate.id)}');return false;">その企業を開く</a>`;
      return;
    }
    const nameEl = el("q-name");
    if (r.name && (!nameEl.value.trim() || nameEl.value === autoName)) { nameEl.value = r.name; autoName = r.name; }
    if (!nameEl.value.trim()) nameEl.placeholder = r.domain || "企業名";
    const fill = (id, v) => { if (v && el(id) && !el(id).value.trim()) el(id).value = v; };
    fill("q-form", r.formUrl); fill("q-phone", r.phone); fill("q-address", r.address);
    const got = [r.name && "企業名", r.formUrl && "フォームURL", r.phone && "電話番号", r.address && "所在地"].filter(Boolean);
    info.textContent = r.ok
      ? (got.length ? `取得できました：${got.join("・")}` : "サイトから情報を取れませんでした。企業名を入れれば登録できます")
      : "サイトを開けませんでした。企業名を入れれば、URLだけで登録できます";
  }

  async function submitAdd(btn, goAttack) {
    const msg = el("q-msg"); msg.textContent = "";
    if (lookDup) { msg.textContent = `登録済みです（${lookDup.name}）`; return; }
    const siteUrl = el("q-url").value.trim();
    if (!siteUrl) { msg.textContent = "企業サイトのURLを入れてください"; return; }
    // 企業名が取れず、入力も無ければドメイン名で登録する（あとで直せる。登録は止めない）
    const name = el("q-name").value.trim() || hostOf(siteUrl);
    if (!name) { msg.textContent = "URLが正しくありません"; return; }
    const v = (id) => el(id).value.trim() || null;
    const body = {
      name, siteUrl, service: el("q-service").value || null,
      formUrl: v("q-form"), industry: v("q-industry"), region: v("q-region"), address: v("q-address"),
      phone: v("q-phone"), size: v("q-size"), note: v("q-note"),
    };
    try { localStorage.setItem(SERVICE_KEY, body.service || ""); } catch { /* 無くてよい */ }
    try {
      const r = await KPLayout.busy(btn, "追加中…", () => API.createSalesCompany(body));
      await load();
      if (goAttack) { closeModal(); openAttack(r.company.id); } else openDetail(r.company.id);
    } catch (e) {
      if (e.body?.company?.id || e.company?.id) {
        const dup = e.body?.company || e.company;
        msg.innerHTML = `${esc(errText(e, ""))}　<a href="#" onclick="openDetail('${esc(dup.id)}');return false;">その企業を開く</a>`;
      } else msg.textContent = errText(e, "追加できませんでした");
    }
  }

  // ---- URLをまとめて追加（要件 §6） ------------------------------------------------
  // URL → ドメインにそろえる → 重複を除く → 企業名・フォームURLを取る → 登録。
  // 取りにいくのはブラウザから3件ずつ（サーバの1回の実行時間を超えないように）。
  const BULK_MAX = 100;
  function openBulkUrls() {
    closeModal();
    el("modal-root").innerHTML = `
      <div class="sl-drawer-bg" onclick="closeModal()"></div>
      <div class="sl-drawer" style="width:560px;">
        <h2>URLをまとめて追加</h2>
        <p class="sl-sub" style="margin:0 0 10px;">企業サイトのURLを1行に1つずつ貼り付けてください。企業名と問い合わせフォームは自動で探します。</p>
        <textarea id="bu-text" rows="10" placeholder="https://aaa.co.jp&#10;https://bbb.jp&#10;ccc.com"></textarea>
        <label style="margin-top:10px;">提案サービス（全件に同じものを入れます）</label>
        <select id="bu-service">${SERVICES.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
        <p class="sl-muted" style="margin:6px 0 0;">同じドメインの企業・登録済みの企業は追加しません。一度に${BULK_MAX}件まで。担当はあなたになります。</p>
        <div id="bu-msg" class="err-text" style="margin:10px 0;"></div>
        <div id="bu-progress"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" id="bu-go" onclick="submitBulkUrls(this)">追加する</button>
          <button class="btn btn-secondary" onclick="closeModal()">閉じる</button>
        </div>
      </div>`;
  }

  /** 貼り付けから URL を拾い、ドメインで重複を除く */
  function parseUrlList(text) {
    const seen = new Set(companies.map((c) => c.domain).filter(Boolean));
    const out = [];
    for (const raw of String(text || "").split(/[\s,、]+/)) {
      const t = raw.trim().replace(/[)）」』>]+$/, "");
      if (!t || !/\./.test(t)) continue;
      const host = hostOf(t);
      if (!host || !/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(host)) continue;
      const url = /^https?:\/\//i.test(t) ? t : `https://${t}`;
      out.push({ url, host, known: seen.has(host) });
      seen.add(host);
    }
    return out;
  }

  async function submitBulkUrls(btn) {
    const msg = el("bu-msg"); msg.textContent = "";
    const all = parseUrlList(el("bu-text").value);
    const rows = all.filter((r) => !r.known);
    const skipped = all.length - rows.length;
    if (!all.length) { msg.textContent = "URLが見つかりません"; return; }
    if (rows.length > BULK_MAX) { msg.textContent = `一度に追加できるのは${BULK_MAX}件までです（いま ${rows.length}件）`; return; }
    if (!rows.length) { msg.textContent = `すべて登録済みです（${skipped}件）`; return; }
    const service = el("bu-service").value || null;
    btn.disabled = true;

    const prog = el("bu-progress");
    const draw = () => {
      prog.innerHTML = `<div class="sl-muted" style="margin:6px 0;">${rows.filter((r) => r.state).length} / ${rows.length} 件確認</div>
        <div style="max-height:240px;overflow:auto;font-size:12px;">${rows.map((r) => `
          <div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #efefeb;">
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.host)}</span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.name || "")}</span>
            <span class="${r.state === "dup" ? "sl-muted" : ""}">${esc({ ok: "OK", noinfo: "名前はドメイン", dup: "登録済み" }[r.state] || "…")}</span>
          </div>`).join("")}</div>`;
    };
    draw();

    let i = 0;
    const worker = async () => {
      while (i < rows.length) {
        const r = rows[i++];
        try {
          const x = await API.lookupSalesUrl(r.url);
          if (x.duplicate) { r.state = "dup"; r.name = x.duplicate.name; }
          else {
            r.name = x.name || r.host; r.formUrl = x.formUrl; r.phone = x.phone; r.address = x.address;
            r.url = x.url || r.url; r.state = x.name ? "ok" : "noinfo";
          }
        } catch { r.name = r.host; r.state = "noinfo"; }
        draw();
      }
    };
    await Promise.all([worker(), worker(), worker()]);

    const add = rows.filter((r) => r.state !== "dup").map((r) => ({
      name: r.name, siteUrl: r.url, formUrl: r.formUrl || null, phone: r.phone || null, address: r.address || null, service,
    }));
    if (!add.length) { msg.textContent = "追加する企業はありませんでした（すべて登録済み）"; btn.disabled = false; return; }
    try {
      const res = await KPLayout.busy(btn, "追加中…", () => API.importSalesCompanies(add));
      await load();
      const dup = rows.filter((r) => r.state === "dup").length + skipped + (res.skipped || 0);
      const noinfo = rows.filter((r) => r.state === "noinfo").length;
      prog.insertAdjacentHTML("afterbegin", `<div class="banner info" style="margin:0 0 8px;"><span class="material-symbols-outlined">check_circle</span>
        <div>${res.created}社を追加しました${dup ? `（登録済み ${dup}件は追加していません）` : ""}${noinfo ? `。${noinfo}社は企業名が取れなかったのでドメイン名で登録しました` : ""}</div></div>`);
      btn.textContent = "追加しました";
    } catch (e) { msg.textContent = errText(e, "追加できませんでした"); btn.disabled = false; }
  }

  // ---- リストを取り込む（貼り付け） ---------------------------------------------
  // Excel・スプレッドシートからそのまま貼れるように、タブ区切りとカンマ区切りの両方を読む
  const IMPORT_COLS = [
    ["name", "企業名"], ["siteUrl", "URL"], ["formUrl", "フォームURL"], ["industry", "業種"],
    ["region", "地域"], ["service", "商材"], ["phone", "電話番号"],

  function openImport() {
    closeModal();
    el("modal-root").innerHTML = `

        <p class="sl-sub" style="margin:0 0 10px;">スプレッドシートから行をコピーして貼り付けてください。1行1社、列の順番は次のとおりです（1行目が見出しなら飛ばします）。</p>
        <div class="atk-url" style="margin-bottom:10px;">${IMPORT_COLS.map(([, l]) => esc(l)).join("　｜　")}</div>
        <textarea id="im-text" rows="12" placeholder="株式会社サンプル	https://sample.co.jp	https://sample.co.jp/contact	製造	東京都	AI / DX"></textarea>
        <p class="sl-muted" style="margin:6px 0 0;">同じサイト（ドメイン）の企業は登録済みとして飛ばします。一度に500社まで。</p>
        <div id="im-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitImport(this)">取り込む</button>
          <button class="btn btn-secondary" onclick="closeModal()">閉じる</button>
        </div>
      </div>`;
  }

  function parseRows(text) {
    const lines = String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const out = [];
    for (const line of lines) {
      const cells = (line.includes("\t") ? line.split("\t") : line.split(",")).map((s) => s.trim().replace(/^"|"$/g, ""));
      if (!out.length && /企業名|会社名|name/i.test(cells[0] || "")) continue;
      const row = {};
      IMPORT_COLS.forEach(([k], i) => { if (cells[i]) row[k] = cells[i]; });
      if (row.name) out.push(row);
    }
    return out;
  }

  async function submitImport(btn) {
    const msg = el("im-msg"); msg.textContent = "";
    const rows = parseRows(el("im-text").value);
    if (!rows.length) { msg.textContent = "取り込める行がありません（1列目に企業名が必要です）"; return; }
    try {
      const r = await KPLayout.busy(btn, "取り込み中…", () => API.importSalesCompanies(rows));

      await load();
      alert(`${r.created}社を追加しました${r.skipped ? `（登録済み ${r.skipped}社は飛ばしました）` : ""}`);

              <span class="sl-muted">担当 ${esc(m.ownerName || "未定")}</span>
              ${m.meetingUrl ? `<a href="${esc(m.meetingUrl)}" target="_blank" rel="noopener noreferrer">面談URL</a>` : ""}
            </div>`).join("")}</div>` : ""}

        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">営業履歴</h4>
        ${timelineHtml(detail.timeline)}

        ${(detail.approaches || []).length ? `
          <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">送った営業文</h4>
          ${detail.approaches.map((a) => `
            <details class="card" style="margin-bottom:8px;">
              <summary style="cursor:pointer;font-size:12.5px;color:#1b2440;">
                ${esc(fmt(a.sentAt || a.preparedAt))}　${esc(a.channelLabel || "")}${a.sendFrom ? `（${esc(a.sendFrom)}）` : ""}　${esc(a.employeeName || "")}　${esc(a.service || "")}
                ${a.clickCount ? `<span class="sl-hot">　クリック${a.clickCount}回</span>` : ""}${a.forced ? `<span class="sl-muted">　（警告を押し切り）</span>` : ""}</summary>
              <div style="font-size:12.5px;white-space:pre-wrap;margin-top:8px;">${esc(a.body || "")}</div>
            </details>`).join("")}` : ""}
      </div>`;
  }

  // 現在の連絡状況（最初の送信・返信元・いまの連絡手段・最終連絡・担当）
  function contactStatusHtml(s, c) {
    if (!s) return "";
    const row = (dt, dd) => `<div><dt>${esc(dt)}</dt><dd>${dd}</dd></div>`;
    const or = (v) => (v ? esc(v) : `<span class="sl-muted">—</span>`);
    return `<div class="card" id="contact-status" style="margin:0 20px 12px;padding:12px 14px;">
      <div style="font-size:12px;font-weight:700;color:#1b2440;margin-bottom:6px;">現在の連絡状況</div>
      <dl class="sl-grid2" style="margin:0;">
        ${row("最初の送信", or(s.firstChannelLabel))}
        ${row("返信", or(s.replyChannelLabel))}
        ${row("現在の連絡手段", s.currentChannelLabel ? `${esc(s.currentChannelLabel)}${s.currentValue ? `<span class="sl-sub2">${esc(s.currentValue)}</span>` : ""}` : or(null))}
        ${row("最終連絡", or(s.lastContactAt ? fmt(s.lastContactAt) : null))}
        ${row("担当", or(c.ownerName || "未定"))}
      </dl></div>`;
  }

  // 連絡先（登録されているものだけ）
  const CONTACT_LABEL = { email: "メール", line: "LINE", instagram: "Instagram", x: "X", facebook: "Facebook",
    linkedin: "LinkedIn", phone: "電話", other: "その他連絡先" };
  function contactRows(c) {
    return Object.entries(c.contacts || {}).filter(([k, v]) => v && CONTACT_LABEL[k])
      .map(([k, v]) => `<div><dt>${esc(CONTACT_LABEL[k])}</dt><dd>${esc(v)}</dd></div>`).join("");
  }

  function timelineHtml(list) {
    if (!(list || []).length) return `<p class="sl-muted">まだ記録がありません。</p>`;
    return `<div class="sl-tl">${list.map((t) => `
      <div class="row${t.kind === "click" ? " click" : ""}${t.planned ? " planned" : ""}">
        <div class="d">${esc(t.planned ? fmtDay(String(t.at).slice(0, 10)) : fmt(t.at))}</div>
        <div class="l">${esc(t.label)}</div>
        ${t.detail ? `<div class="x">${esc(t.detail)}</div>` : ""}
      </div>`).join("")}</div>`;
  }

  // ---- 営業面談（Phase 2） ------------------------------------------------------------
  //
  // 面談の種類は、まず「初回商談 30分」だけ。
  // 「面談を設定」→ TimeRex の日程調整URLを発行 → 相手に送る → 日程確定 → 面談予定。
  // 日程確定は TimeRex Webhook の実装後は自動。それまでは「日程が決まった」で手入力する。
  const LEAD_STATUSES = ["replied", "meeting", "proposal"];
  function isLeadCompany(c) {
    if (c.ngReason || ["lost", "excluded", "won"].includes(c.status)) return false;
    return c.clickCount > 0 || LEAD_STATUSES.includes(c.status);
  }
  function activeMeetingOf(list) {
    return (list || []).find((m) => m.status === "scheduling" || m.status === "scheduled") || null;
  }

  function meetingMail(url) {
    const c = detail.company;
    return `件名：お打ち合わせ日程のご相談

${c.name}
ご担当者様

株式会社エイトの${myName}です。
このたびはご関心をお寄せいただき、ありがとうございます。

一度30分ほど、オンラインでお話しできればと思っております。
下記URLより、ご都合のよい日時をお選びください。

${url}

どうぞよろしくお願いいたします。`;
  }

  function openMeeting() {
    const c = detail.company;
    const m = activeMeetingOf(detail.meetings);
    const ownerId = m?.ownerId || c.ownerId || myEmployeeId || "";
    const ownerOpts = (detail.members || []).map((x) =>
      `<option value="${esc(x.id)}" ${x.id === ownerId ? "selected" : ""}>${esc(x.display_name)}</option>`).join("");
    const manual = (mid) => `
      <details style="margin-top:14px;" ${m?.status === "scheduled" || !detail.timerexConfigured ? "open" : ""}>
        <summary style="cursor:pointer;font-size:13px;color:#4a5068;">${m?.status === "scheduled" ? "日程を変更する" : "日程が決まった（手入力）"}</summary>
        <label style="margin-top:10px;">面談の日時</label><input id="mt-when" type="datetime-local">
        <label style="margin-top:10px;">面談URL（Google Meet など）</label>
        <input id="mt-url" type="text" placeholder="https://meet.google.com/..." value="${esc(m?.meetingUrl || "")}">
        <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="scheduleMeeting(this, '${esc(mid)}')">日程を確定</button>
      </details>`;

    let body;
    if (detail.meetingsReady === false) {
      body = `<div class="banner warn"><span class="material-symbols-outlined">build</span>
        <div>面談の表がまだ作られていません。管理者に db/090_sales_meetings.sql の実行を依頼してください。</div></div>`;
    } else if (!m) {
      body = `
        ${!detail.timerexConfigured ? `<div class="banner warn"><span class="material-symbols-outlined">build</span>
          <div>TimeRexの営業用URLが未設定です（環境変数 TIMEREX_SALES_MEETING_URL）。面談を作ったあと、日程を手入力してください。</div></div>` : ""}
        <button class="btn btn-primary" onclick="issueMeeting(this)">
          <span class="material-symbols-outlined icon-inline">link</span>${detail.timerexConfigured ? "日程調整URLを発行" : "面談を作成"}</button>`;
    } else if (m.status === "scheduled") {
      body = `
        <div class="banner info" style="margin:0 0 10px;"><span class="material-symbols-outlined">event_available</span>
          <div>面談予定：${esc(fmt(m.scheduledAt))}（${esc(m.kindLabel)} ${m.durationMin}分・担当 ${esc(m.ownerName || "未定")}）</div></div>
        ${m.meetingUrl ? `<a class="btn btn-primary" href="${esc(m.meetingUrl)}" target="_blank" rel="noopener noreferrer">
          <span class="material-symbols-outlined icon-inline">videocam</span>面談に参加</a>` : ""}
        ${manual(m.id)}
        <button class="btn btn-secondary btn-sm" style="margin-top:14px;" onclick="cancelMeeting(this, '${esc(m.id)}')">面談を取りやめ</button>`;
    } else {
      body = `
        ${m.schedulingUrl ? `
          <label>TimeRex 日程調整URL</label>
          <input id="mt-sched" type="text" readonly value="${esc(m.schedulingUrl)}" onclick="this.select()">
          <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('mt-sched', this)">URLをコピー</button>
          <label style="margin-top:12px;">メール・フォーム返信の文面</label>
          <textarea id="mt-mail" rows="9" readonly>${esc(meetingMail(m.schedulingUrl))}</textarea>
          <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('mt-mail', this)">文面をコピー</button>
          <div style="margin-top:14px;">${m.schedulingSentAt
            ? `<span class="sl-muted">送付済み（${esc(fmt(m.schedulingSentAt))}）。相手の予約を待っています。</span>`
            : `<button class="btn btn-primary" onclick="markMeetingSent(this, '${esc(m.id)}')">送付済みにする</button>`}</div>`
          : `<div class="banner warn"><span class="material-symbols-outlined">build</span>
              <div>TimeRexの営業用URLが未設定です（TIMEREX_SALES_MEETING_URL）。日程が決まったら手入力してください。</div></div>`}
        ${manual(m.id)}
        <button class="btn btn-secondary btn-sm" style="margin-top:14px;" onclick="cancelMeeting(this, '${esc(m.id)}')">面談を取りやめ</button>`;
    }

    openActionModal(`
        <h2 style="margin-bottom:4px;">営業面談を設定</h2>
        <p class="sl-sub" style="margin:0 0 14px;">${esc(c.name)}</p>
        <dl class="sl-grid2" style="margin-bottom:10px;">
          <div><dt>面談種別</dt><dd>初回商談（30分）</dd></div>
          <div><dt>状態</dt><dd>${esc(m ? m.statusLabel : "未設定")}</dd></div>
        </dl>
        <label>担当</label>
        <select id="mt-owner" ${m ? "disabled" : ""}><option value="">（未定）</option>${ownerOpts}</select>
        <div style="margin-top:14px;">${body}</div>
        <div id="mt-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }

  async function refreshMeeting() {
    const id = detail.company.id;
    const seq = detailSeq;
    const d = await API.getSalesCompany(id);
    load();
    // 取得中に詳細を閉じた・別の企業に切り替えたなら、画面には書かない
    if (!detailIsCurrent(seq, id)) return;
    detail = d;
    renderDetail();
    openMeeting();
  }

  async function issueMeeting(btn) {
    const msg = el("mt-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "発行中…", () => API.issueSalesMeeting({
        companyId: detail.company.id, ownerId: el("mt-owner").value || undefined,
      }));
      await refreshMeeting();
    } catch (e) { msg.textContent = errText(e, "面談を設定できませんでした"); }
  }

  async function markMeetingSent(btn, id) {
    const msg = el("mt-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "記録中…", () => API.salesMeetingAct({ id, action: "sent" }));
      await refreshMeeting();
    } catch (e) { msg.textContent = errText(e, "記録できませんでした"); }
  }

  async function scheduleMeeting(btn, id) {
    const msg = el("mt-msg"); msg.textContent = "";
    const when = el("mt-when").value;
    if (!when) { msg.textContent = "面談の日時を入れてください"; return; }
    try {
      await KPLayout.busy(btn, "確定中…", () => API.salesMeetingAct({
        id, action: "schedule", scheduledAt: new Date(when).toISOString(), meetingUrl: el("mt-url").value.trim() || null,
      }));
      await refreshMeeting();
    } catch (e) { msg.textContent = errText(e, "確定できませんでした"); }
  }

  async function cancelMeeting(btn, id) {
    if (!confirm("この面談を取りやめにします。よろしいですか？")) return;
    const msg = el("mt-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "保存中…", () => API.salesMeetingAct({ id, action: "cancel" }));
      await refreshMeeting();
    } catch (e) { msg.textContent = errText(e, "できませんでした"); }
  }

  // 保存・更新のあと：企業詳細を取り直し、開いたままのドロワーへ反映する（開き直さない）。
  // 一覧は裏で取り直す
  async function reloadDetail() {
    const id = detail.company.id;
    const seq = detailSeq;
    load();
    try {
      const d = await API.getSalesCompany(id);
      if (!detailIsCurrent(seq, id)) return;
      detail = d;
      renderDetail();
    } catch (e) {
      if (detailIsCurrent(seq, id)) alert(errText(e, "最新の状態を取得できませんでした"));
    }
  }

  async function markFollowed(btn) {
    try {
      await KPLayout.busy(btn, "保存中…", () => API.markSalesFollowed(detail.company.id));
      await reloadDetail();
    } catch (e) { alert(errText(e, "できませんでした")); }
  }

  // ---- 履歴を記録（フォロー・電話・返信あり・商談…）＋NEXT ---------------------------
  function openEvent(kind) {
    const c = detail.company;
    const kinds = detail.eventKinds || [];
    openActionModal(`
        <h2>履歴を記録</h2>
        <label>何をしたか</label>
        <div>${kinds.map((k) => `
          <label class="sl-chip"><input type="radio" name="ev-kind" value="${esc(k.key)}" ${k.key === kind ? "checked" : ""}>${esc(k.label)}</label>`).join("")}</div>
        <label style="margin-top:10px;">内容（任意）</label>
        <textarea id="ev-detail" rows="3" placeholder="担当の山田様と電話。来週資料送付"></textarea>
        <label style="margin-top:10px;">日時</label>
        <input id="ev-at" type="datetime-local">
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 6px;">NEXT（次にやること）</h4>
        <input id="ev-next" type="text" list="dl-next" placeholder="空欄なら反応に合わせて自動で決まります">
        <datalist id="dl-next">${["フォロー", "再アタック", "担当者確認", "電話", "メール", "商談準備", "資料送付"].map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
        <input id="ev-next-on" type="date" style="margin-top:6px;">
        <p class="sl-muted" style="margin:6px 0 0;">いまのNEXT：${esc(c.next)}${c.nextDue ? `（${esc(fmtDay(c.nextDue))}）` : ""}<br>
          空欄のとき：返信あり → 返信対応（当日）／商談 → 商談準備（当日）／フォロー・電話・メール → 反応確認（3営業日後）。
          「返信あり」「商談」はステータスも進みます。</p>
        <div id="ev-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitEvent(this)">記録する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }

  async function submitEvent(btn) {
    const msg = el("ev-msg"); msg.textContent = "";
    const picked = document.querySelector('input[name="ev-kind"]:checked');
    if (!picked) { msg.textContent = "何をしたかを選んでください"; return; }
    const at = el("ev-at").value;
    try {
      await KPLayout.busy(btn, "記録中…", () => API.addSalesEvent({
        id: detail.company.id, kind: picked.value, detail: el("ev-detail").value.trim() || undefined,
        occurredAt: at ? new Date(at).toISOString() : undefined,
        nextAction: el("ev-next").value.trim() || null, nextActionOn: el("ev-next-on").value || null,
      }));
      closeAction();
      await reloadDetail();
    } catch (e) { msg.textContent = errText(e, "記録できませんでした"); }
  }

  // ---- 返信・やり取りを記録（返信元・いまの連絡手段・連絡先・メモ・NEXT） ------------------
  //
  // 返信元（どこから返事が来たか）と、いまの連絡手段（どこでやり取りしているか）は別に持つ。
  // 連絡手段を変えただけでは営業ステータスは動かない。「先方から返信」のときだけ「返信あり」まで進む。
  const CONTACT_PLACEHOLDER = { email: "tanaka@example.co.jp", line: "LINE名", instagram: "@account", x: "@account",
    facebook: "ページ名・URL", linkedin: "氏名・URL", phone: "03-1234-5678", other: "その他の連絡先" };
  function openContact() {
    const c = detail.company;
    const early = ["untouched", "attacked", "clicked", "reattack_wait"].includes(c.status);
    const replyChannels = detail.replyChannels || [];
    const contactChannels = detail.contactChannels || [];
    openActionModal(`
        <h2>返信・やり取りを記録</h2>
        <label>種類</label>
        <div>
          <label class="sl-chip"><input type="radio" name="ct-kind" value="reply" ${early ? "checked" : ""} onchange="toggleContactKind()">先方から返信があった</label>
          <label class="sl-chip"><input type="radio" name="ct-kind" value="contact" ${early ? "" : "checked"} onchange="toggleContactKind()">こちらから連絡・やり取り</label>
        </div>
        <div id="ct-reply-box" ${early ? "" : "hidden"}>
          <label style="margin-top:10px;">返信元（どこから返事があったか）</label>
          <div>${replyChannels.map((r) => `
            <label class="sl-chip"><input type="radio" name="ct-reply" value="${esc(r.key)}" onchange="suggestContactChannel(this.value)">${esc(r.label)}</label>`).join("")}</div>
        </div>
        <label style="margin-top:10px;">現在の連絡手段</label>
        <select id="ct-channel" onchange="focusContactValue()"><option value="">（${c.contactChannelLabel ? `変更しない：${esc(c.contactChannelLabel)}` : "未設定のまま"}）</option>
          ${contactChannels.map((x) => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("")}</select>
        <p class="sl-muted" style="margin:4px 0 0;">連絡手段を変えても、営業ステータスは変わりません。</p>
        <details style="margin-top:10px;" ${Object.keys(c.contacts || {}).length ? "" : "open"}>
          <summary style="cursor:pointer;font-size:12.5px;color:#1b2440;">連絡先（任意）</summary>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">${contactChannels.map((x) => `
            <div><label>${esc(x.key === "other" ? "その他連絡先" : x.label)}</label>
              <input id="ct-c-${esc(x.key)}" type="text" value="${esc((c.contacts || {})[x.key] || "")}" placeholder="${esc(CONTACT_PLACEHOLDER[x.key] || "")}"></div>`).join("")}</div>
        </details>
        <label style="margin-top:10px;">メモ（任意）</label>
        <textarea id="ct-note" rows="3" placeholder="担当の田中様よりInstagramで返信。詳細資料はメールで送付。"></textarea>
        <label style="margin-top:10px;">日時</label>
        <input id="ct-at" type="datetime-local">
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 6px;">NEXT（次にやること）</h4>
        <input id="ct-next" type="text" list="dl-ct-next" placeholder="空欄のとき：返信なら「返信対応」（当日）。やり取りならいまのNEXTのまま">
        <datalist id="dl-ct-next">${["資料送付", "日程調整", "返信対応", "電話", "フォロー", "商談準備"].map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
        <input id="ct-next-on" type="date" style="margin-top:6px;">
        <p class="sl-muted" style="margin:6px 0 0;">いまのNEXT：${esc(c.next)}${c.nextDue ? `（${esc(fmtDay(c.nextDue))}）` : ""}</p>
        <div id="ct-msg" class="err-text" style="margin:10px 0;"></div>
        <div class="sl-modal-foot">
          <button class="btn btn-primary" onclick="submitContact(this)">記録する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }
  function toggleContactKind() {
    const reply = document.querySelector('input[name="ct-kind"]:checked')?.value === "reply";
    el("ct-reply-box").hidden = !reply;
  }
  // 返信が来たチャネルで、そのままやり取りすることが多い。連絡手段が未選択なら同じものを入れておく
  function suggestContactChannel(v) {
    const sel = el("ct-channel");
    if (sel && !sel.value && [...sel.options].some((o) => o.value === v)) sel.value = v;
  }
  function focusContactValue() {
    const v = el("ct-channel").value;
    const box = v && el(`ct-c-${v}`);
    if (box && !box.value) { box.closest("details").open = true; box.focus(); }
  }
  async function submitContact(btn) {
    const msg = el("ct-msg"); msg.textContent = "";
    const c = detail.company;
    const reply = document.querySelector('input[name="ct-kind"]:checked')?.value === "reply";
    const replyChannel = document.querySelector('input[name="ct-reply"]:checked')?.value || null;
    if (reply && !replyChannel) { msg.textContent = "どこから返信があったかを選んでください"; return; }
    // 連絡先は、変わった項目だけを送る（空欄にした項目は消す）
    const contacts = {};
    for (const x of detail.contactChannels || []) {
      const v = el(`ct-c-${x.key}`).value.trim();
      if (v !== ((c.contacts || {})[x.key] || "")) contacts[x.key] = v || null;
    }
    const at = el("ct-at").value;
    try {
      await KPLayout.busy(btn, "記録中…", () => API.addSalesContact({
        id: c.id, replied: reply, replyChannel: reply ? replyChannel : undefined,
        contactChannel: el("ct-channel").value || undefined,
        contacts: Object.keys(contacts).length ? contacts : undefined,
        note: el("ct-note").value.trim() || undefined,
        occurredAt: at ? new Date(at).toISOString() : undefined,
        nextAction: el("ct-next").value.trim() || null, nextActionOn: el("ct-next-on").value || null,
      }));
      closeAction();
      await reloadDetail();
    } catch (e) { msg.textContent = errText(e, "記録できませんでした"); }
  }

  // ---- 非表示（1社） -------------------------------------------------------------
  function openHideOne() {
    openActionModal(`
      <h2>この企業を非表示にします</h2>
      <p class="sl-sub" style="margin:0 0 12px;">削除ではありません。データは残り、通常の一覧・アタック対象から外れます。いつでも再表示できます。</p>
      ${hideForm("dt-hide")}

  // ---- フォームアタック ------------------------------------------------------------
  //
  // 1. 開いた時点で専用URL（/r/xxxx）を発行する（営業文に入れる必要があるので、送る前に）
  // 2. テンプレートを選ぶ → 企業名・送信者・専用URLを差し込んだ営業文ができる
  // 3. 企業サイト・フォームを開き、営業文をコピーして貼る。人が確認して送る
  // 4. GWに戻って「送信完了」（送信チャネル必須・送信元は任意）。ここではじめて履歴として残る
  //    送れなかったときは「送信できなかった」（理由必須）。別チャネルで送り直せる
  //
  // 同じチャネルで直近30日以内のアタック・営業禁止・非表示は、サーバが止める（ここでは理由を見せるだけ）。
  // 別のチャネルで直近30日以内に送っているときも、いったん止めて「3日前にInstagramから送信済みです」を見せる。
  // 「別チャネルで送る」を選んだときだけ進める（同じ会社へ気づかずに多重送信しないため）
  const DEFAULT_TEMPLATE = {
    id: "", name: "標準（テンプレート未登録）", service: "", subject: "",
    body: `{{company}}\nご担当者様\n\n突然のご連絡失礼いたします。\n\n株式会社エイトの{{sender}}と申します。\n\n貴社Webサイトを拝見し、\n{{service}}についてご支援できる可能性があると考え、\nご連絡いたしました。\n\n詳細はこちら\n{{url}}\n\nよろしくお願いいたします。`,
    destinationUrl: "",
  };
  let atk = null;   // { company, detail, templates, campaigns, approach, url, force, channel, ackRecent, recentOther }
  // 送信チャネル（lib/sales.js SEND_CHANNELS と同じ。企業詳細の応答に無いときの予備）
  const SEND_CHANNELS = [
    ["form", "お問い合わせフォーム"], ["email", "メール"], ["line", "LINE"], ["instagram", "Instagram"], ["x", "X"],
    ["facebook", "Facebook"], ["linkedin", "LinkedIn"], ["sns_other", "その他SNS"], ["other", "その他"],
  ].map(([key, label]) => ({ key, label }));
  const sendChannels = () => (atk?.detail?.sendChannels?.length ? atk.detail.sendChannels : SEND_CHANNELS);
  const channelName = (k) => sendChannels().find((c) => c.key === k)?.label || k;
  // 送信元（@eight_xxx・sales@… など）は、チャネルごとに前回の値を覚えておく（この端末だけ）
  const fromKey = (ch) => `sales.sendFrom.${ch}`;
  function lastFrom(ch) { try { return localStorage.getItem(fromKey(ch)) || ""; } catch { return ""; } }
  function rememberFrom(ch, v) { try { if (v) localStorage.setItem(fromKey(ch), v); } catch { /* 保存できなくても送信には影響しない */ } }

  async function openAttack(id, force) {
    el("attack-root").innerHTML = `<div class="atk"><div class="empty" style="padding:60px;">準備中…</div></div>`;
    history.replaceState({}, "", listUrl({ attack: id }));
    try {
      const [d, t] = await Promise.all([
        detail?.company?.id === id ? Promise.resolve(detail) : API.getSalesCompany(id),
        API.listSalesTemplates().catch(() => ({ templates: [] })),
      ]);
      detail = d;
      const templates = (t.templates || []).filter((x) => !x.archived);
      atk = { company: d.company, detail: d, templates: templates.length ? templates : [DEFAULT_TEMPLATE],
        campaigns: d.campaigns || [], approach: null, url: "", force: Boolean(force), channel: "form",
        ackRecent: false, recentOther: null };
      // 企業の商材と同じサービスのテンプレートを先に選ぶ
      atk.template = atk.templates.find((x) => x.service && x.service === d.company.service) || atk.templates[0];

      if (d.company.ngReason) return renderAttackBlocked(`この企業は営業禁止です（${d.company.ngLabel}）。アタックできません。`);
      if (d.company.hidden) return renderAttackBlocked(`この企業は非表示です（${d.company.hiddenLabel || "理由未設定"}）。再表示してからアタックしてください。`);
      await prepareAttack();
    } catch (e) {
      renderAttackBlocked(errText(e, "開けませんでした"));
    }
  }

  async function prepareAttack() {
    try {
      const r = await API.prepareSalesAttack({
        companyId: atk.company.id, templateId: atk.template.id || undefined,
        campaignId: atk.company.campaignId || undefined,
        destinationUrl: atk.template.destinationUrl || undefined, force: atk.force || undefined,
        channel: atk.channel, acknowledgeRecent: atk.ackRecent || undefined,
      });
      atk.approach = r.approach;
      atk.url = r.trackingUrl;
      renderAttack();
    } catch (e) {
      const body = e.body || e;
      if (body.error === "recent_attack" || body.error === "force_forbidden") return renderAttackRecent(body.recent, body.canForce ?? canForce);
      if (body.error === "recent_other_channel") return renderAttackOther(body.recent);
      renderAttackBlocked(errText(e, "専用URLを発行できませんでした"));
    }
  }

  function closeAttack() {
    el("attack-root").innerHTML = "";
    const id = atk?.company?.id;
    atk = null;
    if (id) openDetail(id); else history.replaceState({}, "", listUrl());
  }

  function attackHead(title) {
    return `<div class="atk-head">
      <h2>${esc(title)}</h2>

    </div>`;
  }

  function renderAttackBlocked(text) {
    el("attack-root").innerHTML = `<div class="atk">${attackHead(`フォームアタック：${atk?.company?.name || ""}`)}

        <div class="sl-warn"><span class="material-symbols-outlined">block</span><div>${esc(text)}</div></div>
      </div></div>`;
  }

  function renderAttackRecent(r, allowForce) {
    atk.recentOther = r || null;
    el("attack-root").innerHTML = `<div class="atk">${attackHead(`フォームアタック：${atk.company.name}`)}
      <div style="max-width:640px;margin:30px auto;padding:0 20px;">
        <div class="sl-warn sl-caution" style="display:block;">

          <div>前回：${esc(r?.sentAt ? new Date(r.sentAt).toLocaleDateString("ja-JP") : "")}</div>

        <p class="sl-muted">同じ会社に同じチャネルで短期間に何度も営業しないため、このチャネルではアタックできません。</p>

        ${allowForce ? `<button class="btn btn-secondary" onclick="forceAttack()">それでもアタックする（管理者）</button>`
          : `<p class="sl-muted">どうしても必要な場合は、管理者に依頼してください。</p>`}
      </div></div>`;
  }

  // 直近の接触（どのチャネルで・いつ・誰が）を見たうえで、別のチャネルで送る
  const recentText = (r) => `${esc(ago(r.sentAt))}に${esc(r.channelLabel || "")}から送信済みです`;
  const recentMeta = (r) => `（${esc(r.sentAt ? new Date(r.sentAt).toLocaleDateString("ja-JP") : "")}・担当 ${esc(r.employeeName || "不明")}${r.service ? `・${esc(r.service)}` : ""}）`;
  function otherChannelPicker(r) {
    const opts = sendChannels().filter((c) => c.key !== r.channel);
    const pick = opts.some((c) => c.key === atk.channel) ? atk.channel : opts[0]?.key;
    return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px;">
      <select id="at-other-channel" aria-label="別のチャネル">${opts.map((c) =>
        `<option value="${esc(c.key)}" ${c.key === pick ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select>
      <button class="btn btn-primary" onclick="switchChannel(el('at-other-channel').value)">別チャネルで送る</button>
    </div>`;
  }
  function renderAttackOther(r) {
    atk.recentOther = r;
    el("attack-root").innerHTML = `<div class="atk">${attackHead(`フォームアタック：${atk.company.name}`)}
      <div style="max-width:640px;margin:30px auto;padding:0 20px;">
        <div class="sl-warn sl-caution" style="display:block;" id="at-recent-other">
          <div style="font-weight:700;margin-bottom:6px;">⚠️ ${recentText(r)}</div>
          <div class="sl-muted">${recentMeta(r)}</div>
        </div>
        <p class="sl-muted">この会社には直近${esc(r.days || 30)}日以内に別のチャネルで送っています。
          反応が無いので別のチャネルに切り替える場合は、チャネルを選んで「別チャネルで送る」を押してください。
          ${esc(r.channelLabel || "")}では直近${esc(r.days || 30)}日以内は送れません。</p>
        ${otherChannelPicker(r)}
      </div></div>`;
  }
  function switchChannel(ch) {
    atk.channel = ch;
    atk.ackRecent = true;   // 直近の接触を見て、別チャネルを選んだ
    prepareAttack();
  }

  function forceAttack() {
    if (!confirm("直近にアタック済みの企業です。それでもアタックしますか？")) return;
    atk.force = true;
    prepareAttack();
  }

  function composeBody() {
    const c = atk.company;
    const vars = { company: c.name, sender: myName, url: atk.url, service: atk.template.service || c.service || "" };
    return String(atk.template.body || "").replace(/\{\{\s*(company|sender|url|service)\s*\}\}/g, (_, k) => vars[k] ?? "");
  }

  function renderAttack() {
    const c = atk.company;
    const d = atk.detail;
    const body = composeBody();
    const link = (u, label) => u
      ? `<a class="btn btn-secondary btn-sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">
           <span class="material-symbols-outlined icon-inline">open_in_new</span>${esc(label)}</a>`
      : `<span class="sl-muted">${esc(label)}：未登録</span>`;
    el("attack-root").innerHTML = `<div class="atk">${attackHead(`フォームアタック：${c.name}`)}
      <div class="atk-body">
        <div class="atk-col">
          <h3>企業情報</h3>
          ${atk.force ? `<div class="sl-warn sl-caution"><span class="material-symbols-outlined">warning</span><div>直近のアタックを押し切って送ります（管理者）。</div></div>` : ""}
          ${atk.ackRecent && atk.recentOther ? `<div class="sl-warn sl-caution" id="at-recent-banner"><span class="material-symbols-outlined">warning</span>
            <div>${recentText(atk.recentOther)}。別チャネル（${esc(channelName(atk.channel))}）で送ります。</div></div>` : ""}
          <dl class="sl-grid2" style="margin-bottom:10px;">
            <div><dt>企業名</dt><dd>${esc(c.name)}</dd></div>
            <div><dt>業種</dt><dd>${esc(c.industry || "—")}</dd></div>
            <div><dt>商材</dt><dd>${esc(c.service || "—")}</dd></div>
            <div><dt>担当</dt><dd>${esc(c.ownerName || "未定")}</dd></div>
          </dl>
          <div class="atk-links">
            <div class="atk-step">① 企業サイトを確認</div>${link(c.siteUrl, "企業サイトを開く")}
            <div class="atk-step">② 問い合わせフォームを開く</div>${link(c.formUrl, "問い合わせフォームを開く")}
          </div>
          <h3>過去の営業履歴</h3>
          ${timelineHtml((d.timeline || []).filter((t) => !t.planned))}
        </div>

        <div class="atk-col">
          <h3>営業文</h3>
          <label>送信チャネル</label>
          <select id="at-channel" onchange="changeChannel()" style="margin-bottom:8px;">${sendChannels().map((x) =>
            `<option value="${esc(x.key)}" ${x.key === atk.channel ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div><label>テンプレート</label>
              <select id="at-template" onchange="changeTemplate()">${atk.templates.map((t) =>
                `<option value="${esc(t.id)}" ${t.id === atk.template.id ? "selected" : ""}>${esc(t.name)}${t.service ? `（${esc(t.service)}）` : ""}</option>`).join("")}</select></div>
            <div><label>キャンペーン</label>
              <select id="at-campaign"><option value="">（なし）</option>${atk.campaigns.map((m) =>
                `<option value="${esc(m.id)}" ${m.id === c.campaignId ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></div>
          </div>
          <label style="margin-top:10px;">提案サービス</label>
          <input id="at-service" type="text" list="dl-at-service" value="${esc(atk.template.service || c.service || "")}">
          <datalist id="dl-at-service">${SERVICES.map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
          ${atk.template.subject ? `<label style="margin-top:10px;">件名</label>
            <input id="at-subject" type="text" value="${esc(atk.template.subject)}">

            <a href="/sales/templates.html" class="sl-muted" target="_blank" rel="noopener">テンプレートを編集</a>

  // チャネルを変える。書きかけの本文・件名・サービスは残す（専用URLは同じものを使い続ける）
  async function changeChannel() {
    const keep = { body: el("at-body").value, subject: el("at-subject")?.value, service: el("at-service").value };
    atk.channel = el("at-channel").value;
    await prepareAttack();
    if (el("at-body")) el("at-body").value = keep.body;
    if (keep.subject !== undefined && el("at-subject")) el("at-subject").value = keep.subject;
    if (el("at-service")) el("at-service").value = keep.service;
  }

  async function changeTemplate() {
    const id = el("at-template").value;
    atk.template = atk.templates.find((t) => t.id === id) || atk.templates[0];
    // リンク先はテンプレートごとに違うので、専用URLの行き先も直す（URLそのものは変わらない）
    await prepareAttack();
  }

  async function copyText(id, btn) {
    const node = el(id);
    const val = node.value;
    try { await navigator.clipboard.writeText(val); } catch { /* 下で選択状態にする */ }
    node.select();
    if (btn) {
      const before = btn.innerHTML;
      btn.innerHTML = `<span class="material-symbols-outlined icon-inline">check</span>コピーしました`;
      setTimeout(() => { btn.innerHTML = before; }, 1600);
    }
  }

  // 送信完了：送信チャネル（必須）と送信元（任意）を中央モーダルで選んでから記録する
  function openSent() {
    const msg = el("at-msg"); msg.textContent = "";
    if (!el("at-body").value.trim()) { msg.textContent = "営業文が空です"; return; }
    openActionModal(`
      <h2>送信完了として記録します</h2>
      <p class="sl-sub" style="margin:0 0 12px;">実際に送ったチャネルを選んでください。営業履歴に「〇〇から送信」として残ります。</p>
      <label>送信チャネル</label>
      <div>${sendChannels().map((x) => `
        <label class="sl-chip"><input type="radio" name="sd-channel" value="${esc(x.key)}" ${x.key === atk.channel ? "checked" : ""}
          onchange="el('sd-from').value = lastFrom(this.value)">${esc(x.label)}</label>`).join("")}</div>
      <label style="margin-top:10px;">送信元（任意）</label>
      <input id="sd-from" type="text" value="${esc(lastFrom(atk.channel))}" placeholder="@eight_xxx／sales@8grp.co.jp／Eight公式 など">
      <div id="sd-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="sl-modal-foot">
        <button class="btn btn-primary" onclick="submitSent(this)">記録する</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }

  async function submitSent(btn) {
    const msg = el("sd-msg"); msg.textContent = "";
    const channel = document.querySelector('input[name="sd-channel"]:checked')?.value;
    if (!channel) { msg.textContent = "送信チャネルを選んでください"; return; }
    const sendFrom = el("sd-from").value.trim();
    try {
      await KPLayout.busy(btn, "記録中…", () => API.markSalesAttackSent({
        id: atk.approach.id, channel, sendFrom: sendFrom || undefined,
        body: el("at-body").value.trim(), subject: el("at-subject")?.value.trim() || undefined,
        service: el("at-service").value.trim() || null,
        templateId: atk.template.id || null, campaignId: el("at-campaign").value || null,
        force: atk.force || undefined, acknowledgeRecent: atk.ackRecent || undefined,
      }));
      rememberFrom(channel, sendFrom);
      closeAction();
      closeAttack();
      load();
    } catch (e) { msg.textContent = errText(e, "記録できませんでした"); }
  }

  // 送信できなかった：理由は必須（「その他」はメモも必須）。別チャネルで再アタックできる状態で残す
  function openFailed() {
    const reasons = atk.detail?.sendFailReasons || [];
    openActionModal(`
      <h2>送信できなかったとして記録します</h2>
      <p class="sl-sub" style="margin:0 0 12px;">送れなかったことも営業結果として履歴に残ります。ステータスは変わらず、NEXT は「別チャネルで再アタックを検討」になります。</p>
      <label>理由</label>
      <div>${reasons.map((r) => `
        <label class="sl-chip"><input type="radio" name="fl-reason" value="${esc(r.key)}">${esc(r.label)}</label>`).join("")}</div>
      <label style="margin-top:10px;">メモ（「その他」のときは必須）</label>
      <textarea id="fl-note" rows="2"></textarea>
      <div id="fl-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="sl-modal-foot">
        <button class="btn btn-primary" onclick="submitFailed(this)">記録する</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }

  async function submitFailed(btn) {
    const msg = el("fl-msg"); msg.textContent = "";
    const reason = document.querySelector('input[name="fl-reason"]:checked')?.value;
    const note = el("fl-note").value.trim();
    if (!reason) { msg.textContent = "理由を選んでください"; return; }
    if (reason === "other" && !note) { msg.textContent = "「その他」のときはメモに内容を書いてください"; return; }
    try {
      await KPLayout.busy(btn, "記録中…", () => API.markSalesAttackFailed({
        id: atk.approach.id, reason, note: note || undefined, channel: atk.channel,
      }));
      closeAction();
      closeAttack();
      load();
    } catch (e) { msg.textContent = errText(e, "記録できませんでした"); }
  }

  async function discardAttack(btn) {
    if (!confirm("今回は送らずに閉じます。発行した専用URLは使えなくなります。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "取り消し中…", () => API.discardSalesAttack(atk.approach.id));
    } catch (e) { /* 送信済み・クリック済みなら残す。閉じるだけ */ }
    closeAttack();
  }
</script>

</body>
</html>
