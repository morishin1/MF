<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{font-family:'Zen Kaku Gothic New',sans-serif;color:#3E4C5E;background:#F6F3EC}
*{box-sizing:border-box}body{margin:0}
header{padding:16px max(20px,calc((100vw - 1050px)/2));background:#303C49;color:#fff;display:flex;align-items:center;justify-content:space-between}
header a{color:white;font-size:12px}.wrap{max-width:1080px;padding:22px 16px 50px;margin:auto}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #E0D9CC;padding:12px;border-radius:10px}

button.primary{background:#C0521F;border-color:#C0521F;color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
#rows{display:grid;gap:12px;margin-top:16px}

<header><b>ENGER <small>for business / SALES</small></b><a href="/sales/">Salesダッシュボードへ戻る</a></header>
<main class="wrap"><h1>企業から届いた案件・所属人材</h1>
<p>企業の登録情報はここで確認できます。確認・承認だけでは公開されません。正式にマッチングへ移す際はENGER DXで条件・本人同意を再確認してください。</p>

<p id="status" class="notice" role="status" aria-live="polite"></p><div id="rows"></div>
