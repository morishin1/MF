<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ENGER・Sales 提案確認</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=Material+Symbols+Rounded&amp;display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/contract-requests.css">
  <link rel="stylesheet" href="../css/sales-design.css?v=20261119design2">
  <link rel="stylesheet" href="../css/enger-proposal-coordination.css?v=20261122comparison">
  <style>
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    .edr-title { margin:0 0 4px; font-size:24px }
    .edr-section { border:1px solid #e2e2dc; background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; min-width:0 }
    .edr-section h2 { margin:0; font-size:18px }
    .edr-section h3 { margin:12px 0 6px; font-size:14px }
    .edr-section .cr-heading { margin-bottom:8px }
    .edr-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    .edr-actions :is(button,a),.edr-dialog button { min-height:44px; max-width:100%; white-space:normal }
    .edr-note { margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere }
    .edr-agenda { display:grid; gap:8px; padding:0; margin:8px 0 12px; list-style:none }
    .edr-agenda li,.edr-case { border:1px solid #e2e2dc; border-radius:9px; padding:10px 12px; overflow-wrap:anywhere }
    .edr-agenda li { background:#fffaf0; border-color:#eadab1 }
    .edr-case h3 { margin:0; font-size:14px }
    .edr-case .cr-note,.edr-agenda .cr-note { margin:3px 0 5px }
    .edr-state { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 }
    .edr-form { border-top:1px solid #e2e2dc; padding-top:10px; display:grid; gap:10px }
    .edr-record { margin:10px 0; border-top:1px solid #e2e2dc; padding-top:8px }
    .edr-record dt { font-size:12px; font-weight:700; color:#4a5068 }
    .edr-record dd { margin:4px 0 8px }
    .edr-dialog { width:min(540px,calc(100vw - 20px)) }
    .edr-dialog .edr-form { border:0; padding:0 }
    .edr-form :is(textarea,select) { min-height:44px; font-size:16px }
    [hidden] { display:none !important }
    @media(max-width:480px) { .edr-title { font-size:20px } .edr-section { padding:12px } }
  </style>
</head>
<body class="sales-page">
<main class="wrap">
  <div class="cr-heading">
    <div><h1 class="edr-title">ENGER・Sales 日次打ち合わせ</h1></div>
    <p class="edr-actions" id="edr-board-nav"><a href="https://dx.enger.jp/workboard">ENGER案件進行</a><a id="edr-sales-home" href="/sales/proposals.html" hidden>Salesの提案管理</a></p>
  </div>
  <p class="cr-message" id="edr-status" role="status" aria-live="polite">読み込み中…</p>
  <section id="edr-proposal-coordination" class="edr-section epc-panel" aria-label="提案の認識合わせ" hidden></section>
  <div id="edr-board" hidden>
    <div class="cr-toolbar">
      <label for="edr-day">確認日</label><input type="date" id="edr-day">
      <button class="btn btn-secondary btn-sm" type="button" id="edr-refresh">最新表示</button>
    </div>
    <section class="edr-section" id="edr-meeting-section" aria-labelledby="edr-meeting-title">
      <div class="cr-heading">
        <h2 id="edr-meeting-title">今日の打ち合わせ</h2>
        <a href="#edr-sales-list" class="cr-link" id="edr-sales-jump">Salesの事前確認へ</a>
      </div>
      <div id="edr-meeting"></div>
      <p class="cr-message" id="edr-meeting-status" role="status"></p>
    </section>
    <section class="edr-section" id="edr-sales-list" aria-labelledby="edr-list-title">
      <div class="cr-heading">
        <div><h2 id="edr-list-title" tabindex="-1">Salesの事前確認</h2><p id="edr-summary" class="cr-note" aria-live="polite"></p></div>
        <a href="#edr-meeting-section" class="cr-link">打ち合わせへ戻る</a>
      </div>
      <div class="cr-toolbar">
        <label for="edr-filter">表示</label><select id="edr-filter">
          <option value="open">未確認・議題に追加済み</option>
          <option value="discuss">議題に追加済み</option>
          <option value="all">すべて</option>
        </select>
      </div>
      <p class="cr-message" id="edr-list-status" role="status"></p>
      <div class="cr-list" id="edr-list"></div>
    </section>
  </div>
</main>
<dialog class="cr-dialog edr-dialog" id="edr-dialog" aria-labelledby="edr-dialog-title">
  <div class="cr-dialog-head">
    <div><h2 id="edr-dialog-title">議題に追加</h2><p id="edr-selected"></p></div>
    <button type="button" class="btn btn-secondary btn-sm" id="edr-close">閉じる</button>
  </div>
  <div class="cr-dialog-body">
    <p class="cr-note" id="edr-selected-responses"></p>
    <p class="cr-message" id="edr-dialog-status" role="status"></p>
    <form id="edr-check" class="edr-form">
      <label for="edr-reason" class="cr-field">相談する理由<select id="edr-reason" name="reason" required autofocus></select></label>
      <label for="edr-fact" class="cr-field">確認した事実<textarea id="edr-fact" name="fact" maxlength="500" rows="3" placeholder="例：先方の予算と候補者の希望単価に差がある" required></textarea></label>
      <div class="edr-actions"><button type="submit" class="btn btn-primary" id="edr-add-agenda">議題に追加</button></div>
    </form>
  </div>
</dialog>
<script src="../js/api-client.js?v=20261114portal2"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/sales-layout.js?v=20261118attack1"></script>
<script src="../js/enger-proposal-coordination.js?v=20261122comparison"></script>
<script src="/js/enger-sales-daily-review.js?v=20261122proposalui"></script>
</body>
</html>
