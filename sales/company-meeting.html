<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>ENGER商談へ - EIGHT SALES</title>
<link rel="stylesheet" href="../css/app.css?v=20261114portal2">
<link rel="stylesheet" href="../css/sales-design.css?v=20261119design3">
</head><body class="sales-page"><main class="wrap sl-wrap"><h1>商談はENGERへ移動しました</h1>
<p>企業と保存済みの商談を照合します。</p><a id="meeting-entry-link" href="/sales/company-segments.html">企業DBを開く</a>
</main>
<script src="../js/api-client.js?v=20261114portal2"></script>
<script>
(() => {
  const source=new URLSearchParams(location.search),target=new URLSearchParams();
  const uuid=/^[a-f\d]{8}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{12}$/i;
  if(!uuid.test(source.get('companyId')||''))return;
  target.set('companyId',source.get('companyId'));
  if(uuid.test(source.get('sessionId')||''))target.set('sessionId',source.get('sessionId'));
  const url='/sales/enger-meeting.html?'+target;
  document.getElementById('meeting-entry-link').href=url;
  location.replace(url);
})();
</script></body></html>
