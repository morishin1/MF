<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>提案管理 - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260927-sales4">
  <link rel="stylesheet" href="../css/action-feedback.css?v=20261024nav1">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }

    /* いちばん上：今日やること（押すとその絞り込み） */
    .pp-sum { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .pp-sum button { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:12px 14px; text-align:left;
      cursor:pointer; font-family:inherit; }
    .pp-sum button.hot { background:#fdecea; border-color:#c0392b; border-width:2px; }
    .pp-sum button.warn { background:#fff4d6; border-color:#e0a100; }
    .pp-sum .lb { font-size:12px; color:#6b7080; font-weight:700; display:flex; align-items:center; gap:5px; }
    .pp-sum button.hot .lb { color:#b3261e; }
    .pp-sum .lb .material-symbols-outlined { font-size:16px; }
    .pp-sum .v { font-size:26px; font-weight:900; color:#1b2440; margin-top:2px; font-variant-numeric:tabular-nums; }
    .pp-sum .v small { font-size:13px; font-weight:700; margin-left:2px; }

    .pp-filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .pp-filters button { border:1px solid #e2e2dc; background:#fff; border-radius:999px; padding:6px 12px; font-size:12px;
      font-weight:500; color:#4a5068; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .pp-filters button.on { background:#1b2440; border-color:#1b2440; color:#fff; font-weight:700; }
    .pp-filters button .c { font-weight:700; margin-left:4px; font-variant-numeric:tabular-nums; }
    .pp-filters button.alert:not(.on) { border-color:#c0392b; color:#b3261e; }

    .pp-table td.due, .pp-table td.nw { white-space:nowrap; }
    .pp-table th { white-space:nowrap; font-size:12px; }
    .pp-table th button { border:0; background:transparent; color:inherit; cursor:pointer; font:inherit; font-weight:700; padding:0; }
    .pp-table th button:hover { text-decoration:underline; }
    .pp-owner-cell { min-width:100px; font-size:12px; }
    .pp-owner-cell strong { display:block; color:#1b2440; font-size:12.5px; }
    .pp-owner-cell small { display:block; color:#6b7080; font-size:10.5px; }
    .pp-owner-cell .pending { color:#96680c; }
    .pp-supporters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:11px; }
    .pp-supporters > div { background:#f9faf8; border:1px solid #e7e7e2; border-radius:8px; padding:9px; min-width:0; }
    .pp-supporters b { display:block; font-size:11.5px; color:#1b2440; margin-bottom:5px; }
    .pp-supporters small { display:block; font-size:11px; color:#5f6575; overflow-wrap:anywhere; }
    .pp-supporters button { margin-top:7px; font:inherit; font-size:11px; border:1px solid #cdd4da; background:#fff; padding:5px 8px; border-radius:7px; cursor:pointer; }
    .pp-supporter-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; max-height:230px; overflow-y:auto; }
    .pp-supporter-options label { display:flex; align-items:center; gap:8px; font-size:12px; padding:7px; border:1px solid #eee; border-radius:7px; }
    .pp-supporter-options label input { width:auto; margin:0; }
    @media (max-width:650px) { .pp-supporters,.pp-supporter-options { grid-template-columns:1fr; } }
    .pp-col-row { display:flex; gap:8px; align-items:center; border-bottom:1px solid #ededeb; padding:7px 0; }
    .pp-col-row label { flex:1; display:flex; align-items:center; gap:7px; font-size:12px; margin:0; }
    .pp-col-row button { border:1px solid #ddd; border-radius:6px; background:#fff; padding:3px 8px; cursor:pointer; }
    .pp-col-row button:disabled { opacity:.3; cursor:default; }

    .pp-table .pp-check-col { width:36px; text-align:center; padding:6px; }
    .pp-owner-cell { min-width:145px; display:flex;flex-direction:column;gap:3px; }
    .pp-owner-cell small {font-size:10px;color:#6b7080;}
    .pp-role-select { width:100%;min-width:125px;max-width:195px;padding:5px 24px 5px 7px;min-height:32px;
      border:1px solid #cfd7e1;border-radius:7px;background:#fff;color:#1b2440;font:700 12px 'Zen Kaku Gothic New',sans-serif;
      cursor:pointer; }
    .pp-role-select:focus-visible {outline:2px solid #356ac1;outline-offset:1px;}
    .pp-role-select:disabled {background:#f1f1ef;opacity:.6;cursor:not-allowed;}
    .pp-chain-line .pp-role-select {flex:1;max-width:none;min-width:0;}
    .pp-card .pp-chain-line {margin-top:4px;}
    .pp-table input[type=checkbox],.pp-card input[type=checkbox] { width:17px; height:17px; accent-color:#1b2440; cursor:pointer; }
    .pp-chain-line { display:flex; align-items:center; gap:5px; line-height:1.5; white-space:nowrap; font-size:12px; }
    .pp-chain-line em { font-size:10px; font-style:normal; color:#6b7080; background:#f0f1f4; border-radius:4px; padding:1px 4px; flex:0 0 66px; }
    .pp-chain-line strong { font-weight:700; color:#1b2440; }
    .pp-chain-line .pending { color:#b26c00; }
    .pp-chain-line.active em { background:#eff5d1; color:#566400; }
    .pp-row-readonly { opacity:.9; }
    .pp-view-badge { display:inline-block; margin-top:3px; color:#778090; font-size:10px; }
    .pp-bulk { display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;padding:8px 10px;background:#f6f7f5;border:1px solid #e2e2dc;border-radius:9px; }
    .pp-bulk button { font:inherit;cursor:pointer; }
    .pp-bulk button:disabled { opacity:.4;cursor:default; }
    .pp-bulk-note { margin-left:auto;color:#6b7080;font-size:11px; }
    .pp-bulk .pp-danger { color:#a52626;border-color:#dcb0b0; }
    .pp-list-meta { font-size:11px; color:#6b7080; margin:0 0 8px; }
    .pp-readonly-note { padding:12px;margin:12px 20px;background:#f6f7f5;border-radius:9px;font-size:12px;color:#4a5068; }
    .pp-no-actions { display:none !important; }

    a.btn { text-decoration:none; }
    .pp-table tr.overdue td:first-child { box-shadow:inset 3px 0 0 #c0392b; }
    .pp-over { color:#b3261e; font-weight:700; }
    .pp-small { font-size:11.5px; color:#6b7080; display:block; margin-top:2px; }
    .pp-tag { display:inline-block; border-radius:6px; padding:2px 7px; font-size:11px; font-weight:700; background:#e7eaf3; color:#1b2440; }
    .pp-tag.enger { background:#e6f050; color:#1b2440; }
    .pp-tag.warn { background:#fbf1d6; color:#7d5a00; }
    .pp-tag.err { background:#fdecea; color:#b3261e; }

    .pp-cards { display:none; gap:8px; }
    .pp-card { background:#fff; border:1px solid #e2e2dc; border-left:3px solid #e6f050; border-radius:9px; padding:12px 14px; cursor:pointer; }
    .pp-card.overdue { border-left-color:#c0392b; }
    .pp-card b { color:#1b2440; font-size:14.5px; }
    .pp-card .l { font-size:12px; color:#4a5068; margin-top:4px; }

    .pp-sec { margin-top:28px; }
    .pp-sec summary { cursor:pointer; font-size:15px; font-weight:700; color:#1b2440; margin-bottom:10px; }
    .pp-kpi { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:12px; }
    .pp-kpi > div { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:10px 12px; }
    .pp-kpi .lb { font-size:11px; color:#6b7080; font-weight:700; }
    .pp-kpi .v { font-size:20px; font-weight:900; color:#1b2440; font-variant-numeric:tabular-nums; }
    .pp-kpi .s { font-size:11px; color:#9aa0b4; }

    /* 詳細 */
    .pp-box { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; margin:0 20px 14px; }
    .pp-box h4 { font-size:13px; color:#1b2440; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
    .pp-check { list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:12.5px; }
    .pp-check li { display:flex; gap:8px; align-items:center; color:#4a5068; }
    .pp-check li .material-symbols-outlined { font-size:18px; color:#c8ccd8; }
    .pp-check li.ok .material-symbols-outlined { color:#2f6f3a; }
    .pp-check li.now { color:#1b2440; font-weight:700; }
    .pp-check li.now .material-symbols-outlined { color:#e0a100; }
    .pp-task { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid #efefeb; font-size:12.5px; }
    .pp-task:last-child { border-bottom:none; }
    .pp-task .t { flex:1; min-width:0; }
    .pp-task .t b { color:#1b2440; }
    .pp-task .ops { display:flex; gap:4px; flex-wrap:wrap; }
    .pp-task.done { color:#9aa0b4; }
    .pp-task.done b { color:#6b7080; text-decoration:line-through; }
    .pp-task.overdue b { color:#b3261e; }
    .pp-linkbtn { border:none; background:none; color:#3f4bab; font-size:12px; cursor:pointer; padding:2px 4px; font-family:inherit; }
    .pp-contact { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .pp-opt { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
    .pp-opt label { display:flex; gap:8px; align-items:center; border:1px solid #e2e2dc; border-radius:8px; padding:9px 10px; margin:0;
      font-size:13px; color:#1b2440; font-weight:500; cursor:pointer; }
    .pp-opt label input { width:auto; margin:0; }
    .pp-opt label:has(input:checked) { border-color:#1b2440; background:#f3f5fb; font-weight:700; }
    .pp-msg { color:#b3261e; font-size:12.5px; margin-top:8px; min-height:1em; }
    .pp-tpl { white-space:pre-wrap; font-size:12.5px; background:#f6f6f2; border-radius:8px; padding:10px 12px; max-height:220px; overflow:auto; }


    .pp-flow-box { border-color:#cfd6df; }
    .pp-flow-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
    .pp-flow-step { border:1px solid #e4e8ec; background:#f6f7f9; padding:8px 7px; border-radius:8px; min-width:0; }
    .pp-flow-step b { display:block; font-size:12px; color:#535b6a; }
    .pp-flow-step small { display:block; font-size:11px; color:#6b7080; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pp-flow-step.active { background:#f2f8d7; border-color:#b9d36a; }
    .pp-flow-step.done { background:#edf5ee; border-color:#b4d1b9; }
    .pp-flow-action { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
    .pp-flow-hint { font-size:11.5px; color:#5f6575; }
    .pp-flow-blocked { border:1px solid #bdc3ca !important; background:#f3f4f5 !important; color:#465167 !important; cursor:pointer; }
    .pp-flow-blocked:focus-visible { outline:3px solid #91a9cd; outline-offset:2px; }
    .pp-more-actions summary { cursor:pointer; font-size:12px; font-weight:700; color:#4a5068; }
    .pp-more-actions[open] { padding-top:7px; width:100%; }
    @media (max-width: 1000px) {
      .pp-sum, .pp-kpi { grid-template-columns:repeat(3,minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .pp-sum, .pp-kpi { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .pp-tablewrap { display:none; }
      .pp-cards { display:grid; }
      .pp-opt { grid-template-columns:1fr; }
      .pp-box { margin:0 12px 12px; }
    }

    /* ページ全体を縦長にしない。一覧は内部スクロール、KPIと設定はタブに分離。 */
    [hidden] { display:none !important; }
    .pp-view-tabs { display:flex;gap:6px;border-bottom:1px solid #dfe3e7;margin:8px 0 14px;overflow-x:auto; }
    .pp-view-tabs button { border:0;border-bottom:3px solid transparent;background:transparent;color:#5b6473;padding:10px 18px;cursor:pointer;font:700 13px 'Zen Kaku Gothic New',sans-serif;white-space:nowrap; }
    .pp-view-tabs button.on { border-bottom-color:#1b2440;color:#1b2440; }
    .pp-view-tabs button:focus-visible { outline:2px solid #3964bb;outline-offset:-3px; }
    .pp-tab-badge { display:inline-block;background:#fdecea;color:#a62c22;padding:1px 6px;border-radius:10px;margin-left:4px; }
    .pp-view-tabs + section { scroll-margin-top:64px; }
    .pp-more-filters { margin:-2px 0 10px; }
    .pp-more-filters > summary { font-size:12px;font-weight:700;color:#4d5b6c;cursor:pointer;padding:5px 0; }
    .pp-more-filters .pp-filters { padding:9px 0 3px; }
    .pp-extra-current { color:#a52626; }
    .pp-main-tools { margin-bottom:8px; }
    .pp-sum { grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:9px; }
    .pp-sum button { padding:8px 10px;min-width:0; }
    .pp-sum .lb { font-size:11px; }
    .pp-sum .v { font-size:20px; }
    .pp-bulk { margin:7px 0; }
    .pp-bulk-note { display:none; }
    .pp-list-meta { margin:4px 0 8px; }
    .pp-tablewrap { max-height:min(62vh,680px);overflow:auto !important;background:#fff;border:1px solid #e3e6e9;border-radius:9px; }
    .pp-table thead th { position:sticky;top:0;z-index:2;background:#f6f7f8;box-shadow:0 1px 0 #dfe3e7; }
    .pp-table tbody tr:hover { background:#f8faf2; }
    .pp-pagination { display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:10px 0 18px;font-size:12px;color:#586172; }
    .pp-pagination #pp-page-info { margin-right:auto;font-weight:700; }
    .pp-pagination select,.pp-pagination button { font:inherit;border:1px solid #d2d9df;border-radius:7px;background:#fff;padding:6px 9px;color:#273047; }
    .pp-pagination button { cursor:pointer;min-width:60px; }
    .pp-pagination button:disabled { cursor:default;opacity:.4; }
    #pp-view-kpi .pp-sec,#pp-view-admin .pp-sec { margin-top:8px; }
    @media(max-width:1000px) { .pp-sum {display:flex;overflow-x:auto;padding-bottom:5px;scroll-snap-type:x proximity;} .pp-sum button {flex:0 0 125px;scroll-snap-align:start;} }
    @media(max-width:760px) { .pp-view-tabs button { padding:10px 12px; }
      .pp-cards { max-height:min(62vh,600px);overflow-y:auto;overscroll-behavior:contain; }
      .pp-main-tools { display:flex;flex-wrap:wrap;gap:7px; }
      .pp-main-tools #f-q { flex:1 1 100%;min-width:0; }
      .pp-main-tools select { flex:1 1 40%;min-width:0; }
      .pp-pagination {gap:6px;justify-content:space-between;}
      .pp-pagination #pp-page-info {flex:1 1 100%;}
      .pp-pagination label {font-size:11px;}
      .pp-quick-filters {flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px; }
      .pp-quick-filters button {flex:none;}
    }

    .pp-wide-page .wrap { max-width:none; width:100%; box-sizing:border-box; padding:18px clamp(14px,2vw,36px) 95px; }
    .pp-tablewrap { max-height:min(70vh,780px); overflow-x:auto; }
    .pp-table { width:100%; min-width:1380px; table-layout:auto; }
    .pp-table td:has(.pp-company-name) { min-width:205px; max-width:270px; }
    .pp-company-name { display:block; min-width:185px; max-width:255px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; word-break:keep-all; }
    .pp-table .pp-owner-cell { min-width:110px; max-width:170px; }
    .pp-table .pp-owner-cell strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pp-table td { vertical-align:top; line-height:1.55; }
    .pp-bulk { position:fixed; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); transform:translateX(-50%);
      z-index:36; width:max-content; max-width:calc(100vw - 28px); box-sizing:border-box; padding:11px 16px;
      margin:0; background:#fff; border:1px solid #b9c6da; box-shadow:0 12px 38px rgba(27,36,64,.22);
      border-radius:14px; justify-content:center; gap:10px; }
    .pp-bulk[hidden] { display:none !important; }
    .pp-bulk-note { display:none; }
    body.pp-detail-open { overflow:hidden; }
    #pp-drawer .pp-detail-backdrop { position:fixed; inset:0; background:rgba(20,26,44,.5); z-index:40; }
    #pp-drawer .pp-detail-dialog { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:min(1160px,calc(100vw - 44px)); max-height:min(91dvh,950px); overflow:auto; z-index:41;
      background:#f8f9fa; border-radius:16px; box-shadow:0 20px 70px rgba(20,26,44,.28);
      overscroll-behavior:contain; }
    #pp-drawer .pp-detail-header { position:sticky; top:0; z-index:3; padding:16px 22px 14px;
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      background:#fff; border-bottom:1px solid #e1e5ea; }
    #pp-drawer .pp-detail-header > div { min-width:0; }
    #pp-drawer .pp-detail-dialog .pp-box { margin:12px 20px; }
    #pp-drawer .pp-detail-dialog .pp-flow-steps { gap:10px; }
    #pp-drawer .pp-role-editor { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px; margin-top:14px; }
    .pp-role-field { background:#fff; border:1px solid #e0e5ec; border-radius:9px; padding:11px;
      display:flex; flex-direction:column; gap:6px; margin:0; min-width:0; }
    .pp-role-field > span { font-size:12px; font-weight:700; color:#4a5068; }
    .pp-role-field > strong { font-size:14px; color:#1b2440; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pp-role-field small { font-size:10.5px; color:#6b7080; }
    .pp-role-field .pp-role-select { width:100%; max-width:none; min-width:0; }
    @media(max-width:760px) {
      #pp-drawer .pp-detail-dialog { width:calc(100vw - 18px); max-height:95dvh; border-radius:13px; }
      #pp-drawer .pp-detail-header { padding:12px; }
      #pp-drawer .pp-detail-dialog .pp-box { margin:10px 12px; }
      #pp-drawer .pp-role-editor { grid-template-columns:1fr; }
      .pp-bulk { width:calc(100vw - 20px); flex-wrap:wrap; padding:9px; gap:6px; }
      .pp-bulk .btn { flex:1 1 auto; }
    }

    /* 中央モーダル内部は概要・対応・履歴を2列に整理する */
    #pp-detail { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px 16px; padding-bottom:18px; }
    #pp-detail > .pp-detail-header, #pp-detail > .pp-flow-box,
    #pp-detail > .pp-readonly-note, #pp-detail > .pp-info-box, #pp-detail > .pp-history-box { grid-column:1/-1; }
    #pp-detail > .pp-box { margin:0 20px; min-width:0; }
    #pp-detail > .sl-next { margin:0 0 0 20px !important; min-width:0; }
    #pp-detail > .pp-contact-box { margin-left:0; }
    #pp-detail > .pp-checklist-box { margin-right:0; }
    #pp-detail > .pp-task-box { margin-left:0; }
    #pp-detail > .pp-info-box { margin:0 20px; }
    #pp-detail > .pp-history-box { padding:4px 22px 22px; }
    #pp-detail > .pp-readonly-note { margin:8px 20px 0; }
    #pp-detail > .pp-flow-box { margin-top:6px; }
    @media (max-width:900px) {
      #pp-detail { grid-template-columns:1fr; gap:10px; }
      #pp-detail > .pp-box, #pp-detail > .sl-next { margin:0 12px !important; }
      #pp-detail > .pp-history-box { padding:4px 12px 18px; }
    }

    .pp-table .pp-cell-clamp { display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden; max-width:380px; overflow-wrap:anywhere; line-height:1.6; }
    .pp-table td:has(.pp-cell-clamp) { max-width:380px; min-width:150px; }
  </style>
</head>
<body class="pp-wide-page">

<div class="wrap">
  <h1 class="sl-title">提案管理</h1>
  <p class="sl-sub">管理者は全件操作できます。企業を押すと詳細モーダルでCS・クロージング担当を変更できます。ENGERの提案担当は固定表示です。</p>

  <div id="notice"></div>
  <div class="pp-sum" id="sum"></div>
  <nav class="pp-view-tabs" role="tablist" aria-label="表示内容">
    <button type="button" role="tab" id="pp-tab-list" aria-controls="pp-view-list" aria-selected="true" class="on" onclick="ppSwitchView('list')">提案一覧</button>
    <button type="button" role="tab" id="pp-tab-kpi" aria-controls="pp-view-kpi" aria-selected="false" onclick="ppSwitchView('kpi')">分析・KPI</button>
    <button type="button" role="tab" id="pp-tab-admin" aria-controls="pp-view-admin" aria-selected="false" onclick="ppSwitchView('admin')" hidden>連携・設定 <span id="pp-sync-count" class="pp-tab-badge" hidden></span></button>
  </nav>
  <section id="pp-view-list" role="tabpanel" aria-labelledby="pp-tab-list">
  <div class="sl-toolbar pp-main-tools">
    <select id="f-owner" onchange="ppSet('owner', this.value)"></select>
    <select id="f-service" onchange="ppSet('service', this.value)"><option value="">サービス：すべて</option></select>
    <input type="text" id="f-q" placeholder="企業名・提案で探す" oninput="ppSearch(this.value)">
    <select id="f-blast" onchange="ppSet('blast', this.value)" aria-label="ブラスト配信状況">
      <option value="">ブラスト：すべて</option>
      <option value="not_sent">未配信・未記録</option>
      <option value="sent">配信済み</option>
      <option value="meeting">ブラスト経由の面談化</option>
    </select>
    <select id="f-sort" onchange="ppSet('sort', this.value)">
      <option value="due">期限超過・期限が近い順</option>
      <option value="elapsed">提案からの経過が長い順</option>
      <option value="sent">提案日時：新しい順</option>
      <option value="sent_asc">提案日時：古い順</option>
      <option value="proposal_owner">提案担当：名前順</option>
      <option value="cs_owner">CS担当：名前順</option>
      <option value="closing_owner">クロージング担当：名前順</option>
      <option value="company">企業名：名前順</option>
    </select>
    <button type="button" class="btn btn-secondary btn-sm" onclick="SalesProposalColumns.open()"><span class="material-symbols-outlined icon-inline">view_column</span>列の並び・表示</button>
    <button class="btn btn-secondary btn-sm" onclick="ppBlastOpen()" id="pp-blast-top" style="margin-left:auto;">
      <span class="material-symbols-outlined icon-inline">campaign</span>ブラスト配信・記録</button>
    <button class="btn btn-secondary btn-sm" onclick="ppOpenNew()">
      <span class="material-symbols-outlined icon-inline">add</span>提案を手で追加</button>
  </div>
  <div class="pp-filters pp-quick-filters" id="filters" aria-label="よく使う条件"></div>
  <details class="pp-more-filters" id="pp-more-filters">
    <summary>その他の条件 <span id="pp-extra-filter" class="pp-extra-current"></span></summary>
    <div class="pp-filters" id="filters-extra" aria-label="その他の条件"></div>
  </details>
  <div class="pp-list-meta" id="pp-list-meta"></div>

  <div class="pp-tablewrap" style="overflow-x:auto;">
    <table class="sl-table pp-table">
      <thead><tr id="pp-column-head"></tr></thead>
      <tbody id="rows"><tr><td colspan="12" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
  <div class="pp-cards" id="cards"></div>
  <div class="pp-pagination" aria-label="提案のページ切替">
    <span id="pp-page-info" aria-live="polite"></span>
    <label for="pp-page-size">表示件数</label>
    <select id="pp-page-size" onchange="ppSetPageSize(this.value)" aria-label="1ページの件数"><option value="20">20件</option><option value="50">50件</option></select>
    <button type="button" id="pp-page-prev" onclick="ppChangePage(-1)" aria-label="前のページ">前へ</button>
    <span id="pp-page-label"></span>
    <button type="button" id="pp-page-next" onclick="ppChangePage(1)" aria-label="次のページ">次へ</button>
  </div>
  </section>
  <section id="pp-view-kpi" role="tabpanel" aria-labelledby="pp-tab-kpi" hidden><div class="pp-sec" id="kpi-sec"></div></section>
  <section id="pp-view-admin" role="tabpanel" aria-labelledby="pp-tab-admin" hidden><div class="pp-sec" id="admin-sec"></div></section>
</div>

<div class="pp-bulk" id="pp-bulk" role="toolbar" aria-label="選択した提案の一括操作" hidden>
    <strong id="pp-selected" style="font-size:12px;">0件選択</strong>
    <button class="btn btn-secondary btn-sm" id="pp-bulk-blast" type="button" onclick="ppBlastOpen()" disabled>ブラスト配信を記録</button>
    <button class="btn btn-secondary btn-sm" id="pp-bulk-edit" type="button" onclick="ppBulkEdit()" disabled>編集</button>
    <button class="btn btn-secondary btn-sm pp-danger" id="pp-bulk-archive" type="button" onclick="ppBulkArchive()" disabled>削除</button>
    <button class="btn btn-secondary btn-sm" id="pp-bulk-restore" type="button" onclick="ppBulkRestore()" disabled>復元</button>
    <button class="btn btn-secondary btn-sm" type="button" onclick="ppSelectAll(false)">解除</button>
    <span class="pp-bulk-note">管理者は全件選択・削除できます。削除は履歴を残すアーカイブです。</span>
  </div>
<div id="pp-drawer"></div>
<div id="pp-action"></div>

<script src="../js/api-client.js?v=20261024nav1"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/sales-layout.js?v=20261019prop1"></script>
<script src="../js/sales-proposal-nav.js?v=20261026nav1"></script>
<script src="../js/action-feedback.js?v=20261024nav1"></script>
<script src="../js/sales-proposal-feedback.js?v=20261024nav1"></script>
<script src="../js/sales-proposal-columns.js?v=20261021col1"></script>
<script>
  // 画面の値（選択肢・ラベル）はサーバ（lib/sales-proposals.js）が返す。ここに同じ一覧を書かない
  const $ = (id) => document.getElementById(id);
  const esc = SalesLayout.esc;
  const { fmt, statusPill } = SalesLayout;
  const STATE = { filter: "all", owner: "", service: "", q: "", sort: "sent", blast:"" };
  let data = null;      // 一覧の応答
  let detail = null;    // 詳細の応答
  let openId = null;
  let seq = 0;
  let ppPage = 1;
  let ppPageSize = 20;
  let ppActiveView = "list";
  const selected = new Set();
  SalesProposalColumns.init({
    changed: () => { if (data) { renderRows(ppVisibleRows()); ppBulkState(); } },
    sort: (key) => { const next = key === "sent" && STATE.sort === "sent" ? "sent_asc" : key; ppSet("sort",next); $("f-sort").value=next; },
    open: (html) => modal(html),
    close: () => ppCloseAction(),
  });

  const STATUS_PILL = {
    proposal_wait: "untouched", call_wait: "clicked", mail_wait: "clicked", reply_wait: "attacked", meeting_adjust: "meeting", meeting_done: "meeting",
    considering: "attacked", reproposal: "reattack_wait", won: "won", lost: "lost", stopped: "excluded", closed_no_reply: "lost",
  };
  const pill = (status, label) => statusPill(STATUS_PILL[status] || "untouched", label);
  const errText = (e, f) => e.hint || e.detail || e.message || f || "失敗しました";
  // 操作できない理由は押した場所ですぐに表示し、具体的な入力欄に戻れるようにする。
  function ppShowIssue(issue) {
    if (!issue) return false;
    const field = issue.field && ($(issue.field) || document.querySelector(`input[name="${issue.field}"]`));
    if ($("m-msg")) $("m-msg").textContent = issue.message;
    const opts = { title: issue.title, message: issue.message };
    if (field) {
      opts.actionLabel = "入力箇所を確認";
      opts.onAction = () => { field.scrollIntoView({behavior:"smooth",block:"center"}); field.focus({preventScroll:true}); };
    }
    KPActionFeedback.show(opts);
    return true;
  }
  function ppShowServerError(e) {
    const message = SalesProposalFeedback.formatError(e);
    if ($("m-msg")) $("m-msg").textContent = message;
    const opts = { title: "操作を完了できませんでした", message };
    const id = detail?.proposal?.id;
    if (e?.code === "not_connected" && detail?.canHandoff) {
      opts.actionLabel = "電話の結果を記録";
      opts.onAction = () => { ppCloseAction(); ppCall(); };
    } else if (e?.code === "not_sent_or_closed" && id && !detail?.proposal?.closed) {
      opts.actionLabel = "提案送信を記録";
      opts.onAction = () => { ppCloseAction(); ppSent(); };
    } else if (e?.code === "owner_changed" && id) {
      opts.actionLabel = "案件を再読み込み";
      opts.onAction = () => ppOpen(id);
    } else if ($("m-ok") && !["forbidden", "readonly"].includes(e?.code)) {
      opts.actionLabel = "入力箇所を確認";
      opts.onAction = () => $("m-ok")?.closest(".sl-modal")?.querySelector("input:not([type=hidden]), textarea, select")?.focus();
    }
    KPActionFeedback.show(opts);
  }
  function ppFlowBlocked(key) {
    const list = {
      sent: ["提案送信が必要です", "先に企業へ提案を送信してください。送信済みの場合は送信記録を登録します。", "提案送信を記録", () => ppSent()],
      cs_team: ["CS担当が未設定です", "管理者が「フォローの設定」でCS担当を登録してください。", detail?.manager ? "フォロー設定を確認" : null, () => { ppSwitchView("admin"); $("admin-sec")?.scrollIntoView({behavior:"smooth",block:"start"}); }],
      closing_team: ["クロージング担当が未設定です", "管理者が「フォローの設定」でクロージング担当を登録してください。", detail?.manager ? "フォロー設定を確認" : null, () => { ppSwitchView("admin"); $("admin-sec")?.scrollIntoView({behavior:"smooth",block:"start"}); }],
      owner: ["担当者の確認が必要です", "現在の担当者または管理者に、この案件の操作を依頼してください。", null, null],
    };
    const entry = list[key];
    if (!entry) return;
    KPActionFeedback.show({title:entry[0],message:entry[1],
      ...(entry[2] ? {actionLabel:entry[2],onAction:entry[3]} : {})});
  }
  const localInput = (iso) => {
    const d = iso ? new Date(iso) : new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const dueText = (iso, overdue) => iso ? `<span class="${overdue ? "pp-over" : ""}">${esc(fmt(iso))}${overdue ? "（超過）" : ""}</span>` : "—";

  // URL に絞り込みを持つ（戻る・共有で同じ一覧になる）
  function readUrl() {
    const sp = new URLSearchParams(location.search);
    for (const k of ["filter", "owner", "service", "q", "sort","blast"]) if (sp.get(k)) STATE[k] = sp.get(k);
    return sp.get("id");
  }
  function writeUrl() {
    const sp = new URLSearchParams();
    for (const [k, v] of Object.entries(STATE)) if (v && !(k === "filter" && v === "all") && !(k === "sort" && v === "sent")) sp.set(k, v);
    if (openId) sp.set("id", openId);
    history.replaceState({}, "", `${location.pathname}${sp.toString() ? `?${sp}` : ""}`);
  }

  const startId = readUrl();
  SalesLayout.init({ active: "proposals" }).then(async (ctx) => {
    if (!ctx) return;
    // メール文の名乗り（ログイン中の社員名）
    window.__me = { name: ctx.me?.gw?.employee?.display_name || "" };
    $("f-q").value = STATE.q;
    $("f-sort").value = STATE.sort;
    $("f-blast").value=["","not_sent","sent","meeting"].includes(STATE.blast)?STATE.blast:"";
    await load();
    if (startId) ppOpen(startId);
  });

  async function load() {
    const my = ++seq;
    const qs = new URLSearchParams({ filter: STATE.filter, sort: STATE.sort });
    if (STATE.owner) qs.set("owner", STATE.owner);
    if (STATE.service) qs.set("service", STATE.service);
    if (STATE.q) qs.set("q", STATE.q);
    try {
      const d = await API.api(`/api/sales/proposals?${qs}`);
      if (my !== seq) return;
      data = d;
      render();
    } catch (e) {
      if (my !== seq) return;
      const notReady = e.code === "not_ready";
      $("rows").innerHTML = `<tr><td colspan="12" class="empty">表示できません</td></tr>`;
      $("notice").innerHTML = `<div class="banner ${notReady ? "warn" : "err"}"><span class="material-symbols-outlined">${notReady ? "build" : "error"}</span>
        <div>${esc(errText(e, "取得に失敗しました"))}</div></div>`;
    }
  }

  function ppSet(k, v) { STATE[k] = v; ppPage = 1; selected.clear(); if (k === "filter") ppSwitchView("list"); writeUrl(); load(); }
  let qTimer = null;
  function ppSearch(v) { clearTimeout(qTimer); qTimer = setTimeout(() => ppSet("q", v.trim()), 300); }

  function render() {
    const d = data;
    $("notice").innerHTML = d.notice ? `<div class="banner warn"><span class="material-symbols-outlined">info</span><div>${esc(d.notice)}</div></div>` : "";
    // 今日やること
    const t = d.today || {};
    const cards = [
      { lb: "提案準備", icon: "edit_note", v: t.prepare, f: "proposal_wait" },
      { lb: "今日の電話", icon: "call", v: t.call, f: "today" },
      { lb: "今日のメール", icon: "mail", v: t.mail, f: "mail_wait" },
      { lb: "回答確認", icon: "mark_email_unread", v: t.reply_check, f: "reply_wait" },
      { lb: "面談調整", icon: "event", v: t.meeting, f: "meeting" },
      { lb: "期限超過", icon: "alarm", v: t.overdue, f: "overdue", hot: true },
    ];
    if (d.manager) cards.push({ lb: "担当未割当", icon: "person_off", v: d.counts?.unassigned ?? 0, f: "unassigned", warn: true });
    else cards.push({ lb: "電話未実施", icon: "phone_missed", v: d.counts?.no_call ?? 0, f: "no_call", warn: true });
    $("sum").innerHTML = cards.map((c) => `
      <button onclick="ppSet('filter','${c.f}')" class="${c.hot && c.v ? "hot" : c.warn && c.v ? "warn" : ""}">
        <div class="lb"><span class="material-symbols-outlined">${c.icon}</span>${esc(c.lb)}</div>
        <div class="v">${c.v || 0}<small>件</small></div></button>`).join("");

    // 絞り込み
    // よく使う条件を優先し、残りは必要なときだけ開く。
    const quickKeys = new Set(["all","open","today","overdue","proposal_wait","no_call","meeting","unassigned"]);
    const visibleFilters = d.labels.filters.filter((f) => d.manager || !f.managerOnly);
    const filterButton = (f) => `<button type="button" class="${STATE.filter === f.key ? "on" : ""} ${f.key === "overdue" && d.counts?.overdue ? "alert" : ""}"
      onclick="ppSet('filter','${f.key}')">${esc(f.label)}<span class="c">${d.counts?.[f.key] ?? 0}</span></button>`;
    $("filters").innerHTML = visibleFilters.filter((f) => quickKeys.has(f.key)).map(filterButton).join("");
    $("filters-extra").innerHTML = visibleFilters.filter((f) => !quickKeys.has(f.key)).map(filterButton).join("");
    const extra = visibleFilters.find((f) => f.key === STATE.filter && !quickKeys.has(f.key));
    $("pp-extra-filter").textContent = extra ? "・" + extra.label : "";
    if (extra) $("pp-more-filters").open = true;

    // 担当（管理側だけ）・サービス
    const owner = $("f-owner");
    {
      owner.style.display = "";
      owner.innerHTML = `<option value="">担当：全員</option><option value="me">自分の担当</option><option value="none">担当未割当</option>`
        + (d.members || []).map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
      owner.value = STATE.owner;
    }
    const svc = $("f-service");
    svc.innerHTML = `<option value="">サービス：すべて</option>` + (d.services || []).map((s) => `<option>${esc(s)}</option>`).join("");
    svc.value = STATE.service;

    const allVisible = ppVisibleRows();
    $("f-blast").value=STATE.blast;
    for (const id of [...selected]) if (!allVisible.some((p) => p.id === id && (p.canEdit || p.canRestore))) selected.delete(id);
    $("pp-list-meta").textContent = "検索結果：" + allVisible.length + "件" + (d.truncated ? "（最新2,000件まで）" : "") + " ・ " + (d.manager ? "管理者：全件操作可能" : "他人の案件は閲覧のみ・担当変更は可能");
    $("pp-tab-admin").hidden = !d.manager;
    $("pp-sync-count").hidden = !d.syncIssues;
    $("pp-sync-count").textContent = d.syncIssues ? String(d.syncIssues) : "";
    if (!d.manager && ppActiveView === "admin") ppSwitchView("list");
    renderRows(allVisible);
    ppBulkState();
    renderKpi(d);
    renderAdmin(d);
  }

  // 一覧・分析・連携を切り替え、長い縦スクロールをなくす。
  function ppSwitchView(view) {
    if (!["list","kpi","admin"].includes(view) || (view === "admin" && !data?.manager)) view = "list";
    ppActiveView = view;
    for (const key of ["list","kpi","admin"]) {
      $("pp-view-" + key).hidden = key !== view;
      $("pp-tab-" + key).classList.toggle("on", key === view);
      $("pp-tab-" + key).setAttribute("aria-selected", String(key === view));
      $("pp-tab-" + key).tabIndex = key === view ? 0 : -1;
    }
    if (view !== "list") window.scrollTo({ top:0, behavior:"smooth" });
  }
  function ppVisibleRows(){
    const all=data?.proposals||[];
    if(!STATE.blast)return all;
    return all.filter(r=>STATE.blast==="not_sent"?
      (r.blast?.sent===0):STATE.blast==="sent"?
      (r.blast?.sent>0):STATE.blast==="meeting"?(r.blast?.meetings>0):true);
  }
  function ppPageRows() {
    return ppVisibleRows().slice((ppPage - 1) * ppPageSize, ppPage * ppPageSize);
  }
  function ppSetPageSize(value) {
    ppPageSize = value === "50" ? 50 : 20;
    ppPage = 1;
    if (data) { renderRows(ppVisibleRows()); ppBulkState(); }
  }
  function ppChangePage(delta) {
    const pages = Math.max(1, Math.ceil(ppVisibleRows().length / ppPageSize));
    ppPage = Math.max(1, Math.min(pages, ppPage + delta));
    if (data) { renderRows(data.proposals || []); ppBulkState(); }
    const container = $("pp-view-list");
    if (container) container.scrollIntoView({ behavior:"smooth",block:"start" });
    const table = document.querySelector(".pp-tablewrap");
    if (table) table.scrollTop = 0;
    if ($("cards")) $("cards").scrollTop = 0;
  }

  // 提案待ち（まだ企業へ提案していない）は、電話の「未実施」を赤にしない（30分の期限は提案を送ってから）
  const callCell = (r) => r.call ? `${esc(r.call.label)}<span class="pp-small">${esc(fmt(r.call.lastAt))}${r.call.count > 1 ? `・${r.call.count}回` : ""}</span>`
    : r.closed ? "—" : r.waiting ? `<span class="sl-muted">提案前</span>` : `<span class="pp-over">未実施</span>`;
  // 提案日時。提案待ちはマッチング確定の日時と「未提案」
  const sentCell = (r) => r.sentAt ? esc(fmt(r.sentAt))
    : `<span class="sl-muted">確定 ${esc(fmt(r.matchedAt))}</span><span class="pp-small">未提案</span>`;
  const mailCell = (r) => r.mail ? `送信${r.mail.selfReported ? "（自己申告）" : ""}<span class="pp-small">${esc(fmt(r.mail.lastAt))}</span>` : "—";
  const syncCell = (r) => r.sourceSystem === "enger"
    ? `<span class="pp-tag enger">dx.enger</span>${r.companyId ? "" : `<span class="pp-small">企業未紐付け</span>`}`
    : `<span class="pp-tag">手入力</span>`;

  // ENGERの提案担当は元システムの担当を固定表示。CS・クロージングは詳細内で変更。
  const ppOwnerName = (r,role) => role === "proposal"
    ? (r.sourceSystem === "enger" ? (r.matchingOwnerName || "未割当") : (r.proposalOwnerName || r.matchingOwnerName || "未割当"))
    : role === "cs" ? (r.csOwnerName || "未割当") : (r.closingOwnerName || "未割当");
  // ENGER元の担当名は参照情報として残し、内部の提案担当IDだけを更新する。
  const ppOwnerId = (r, role) => role === "proposal"
    ? (r.proposalOwnerId || ((r.handoffStage || "proposal") === "proposal" ? r.salesOwnerId : null))
    : role === "cs" ? r.csOwnerId : r.closingOwnerId;

  function ppOwnerSelect(r, role) {
    if (!["cs","closing"].includes(role)) return "";
    const names = {proposal:"提案担当",cs:"CS担当",closing:"クロージング担当"};
    const current = ppOwnerId(r,role) || "";
    const members = detail?.members || data?.members || [];
    const label = role === "proposal" ? (r.proposalOwnerName || r.matchingOwnerName || "未割当")
      : role === "cs" ? (r.csOwnerName || "未割当") : (r.closingOwnerName || "未割当");
    // 退職/権限解除などで現在値が候補にない場合も、表示を消さない。
    const former = current && !members.some((m) => m.id === current)
      ? '<option value="' + esc(current) + '">' + esc(label) + '（現在）</option>' : "";
    return '<select class="pp-role-select" data-current="' + esc(current) + '" aria-label="' +
      esc(r.companyName) + 'の' + names[role] + '" ' +
      (r.archived ? 'disabled title="復元してから変更してください"' : '') +
      ' onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" ' +
      ' onchange="ppInlineOwner(this,\'' + esc(r.id) + '\',\'' + role + '\')">' +
      '<option value="">未割当</option>' + former +
      members.map((m) => '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>').join("") +
      '</select>';
  }
  async function ppInlineOwner(select, id, role) {
    if (!["cs","closing"].includes(role) || detail?.proposal?.id !== id) return;
    const next = select.value || null;
    const expected = select.dataset.current || null;
    if (next === expected) return;
    select.disabled = true;
    try {
      await API.api("/api/sales/proposals/owners", {
        method:"POST", body:{ id, role, ownerId:next, expectedOwnerId:expected }
      });
      const hadDetail = detail?.proposal?.id === id;
      const scroll = document.querySelector(".pp-detail-dialog")?.scrollTop || 0;
      await load();
      if (hadDetail && openId === id) {
        detail = await API.api("/api/sales/proposals/detail?id=" + encodeURIComponent(id));
        renderDetail();
        const dialog = document.querySelector(".pp-detail-dialog");
        if (dialog) dialog.scrollTop = scroll;
      }
      KPActionFeedback.show({ title:"担当者を更新しました",
        message:"変更履歴を記録しました。正式な工程の引継ぎは別途行ってください。" });
    } catch (e) {
      select.value = expected || "";
      ppShowServerError(e);
      if (e.code === "owner_changed") await load();
    } finally { select.disabled = false; }
  }
  function ppChain(r) {
    const stage = r.handoffStage === "closing" ? 2 : r.handoffStage === "cs" && r.csOwnerId ? 1 : 0;
    return [["proposal","提案担当"],["cs","CS担当"],["closing","クロージング担当"]].map(([role,name],i) =>
      '<div class="pp-chain-line ' + (stage===i ? "active" : "") + '"><em>' + name + '</em>' +
      '<strong>' + esc(ppOwnerName(r,role)) + '</strong></div>').join("");
  }
  const ppCheckInput = (r) => {
    const enabled = r.canEdit || r.canRestore;
    return '<input type="checkbox" data-pid="' + esc(r.id) + '" aria-label="' + esc(r.companyName) +
      'を選択" ' + (enabled ? '' : 'disabled title="選択して操作できるのは担当本人か管理者だけです"') +
      (selected.has(r.id) ? " checked" : "") + ' onclick="event.stopPropagation()" onchange="ppSelectOne(this.dataset.pid,this.checked)">';
  };

  function ppOwnerCell(r, role) {
    const extras = r.supporters?.[role] || [];
    return '<div class="pp-owner-cell"><strong>' + esc(ppOwnerName(r,role)) + '</strong>' +
      (extras.length ? '<small title="' + esc(extras.map(x=>x.name).join("・")) +
        '">補助＋' + extras.length + '</small>' : '') + '</div>';
  }
  function ppColumnCell(key,r) {
    switch(key) {
    case "date": return sentCell(r);
    case "company": return '<span class="sl-nm pp-company-name" title="'+esc(r.companyName)+'">'+esc(r.companyName)+'</span>'+
      (r.contactStop?'<span class="pp-tag err">連絡停止</span>':'');
    case "proposal": case "cs": case "closing": return ppOwnerCell(r,key);
    case "service": return esc(r.service || "—");
    case "title": return '<span class="pp-cell-clamp" title="'+esc(r.title)+'">'+esc(r.title)+'</span>'+(r.sourceCode?'<span class="pp-small">'+esc(r.sourceCode)+'</span>':'');
    case "status": return pill(r.status,r.statusLabel)+(r.archived?'<span class="pp-small">アーカイブ済み</span>':'');
    case "next": return r.next?'<span class="pp-cell-clamp" title="'+esc(r.next.title)+'">'+esc(r.next.title)+'</span><span class="pp-small">'+dueText(r.next.dueAt,r.next.overdue)+'</span>':"—";
    case "elapsed": return esc(String(r.elapsedDays))+"日";
    case "phone": return callCell(r);
    case "mail": return mailCell(r);
    case "sync": return syncCell(r);
    case "blast": return !r.blast
      ? '<span class="pp-tag warn">要設定</span>'
      : r.blast.meetings>0
        ? '<span class="pp-tag enger">面談化 '+r.blast.meetings+'件</span><span class="pp-small">配信'+r.blast.sent+'回</span>'
        : r.blast.sent>0
          ? '<span class="pp-tag">配信済み '+r.blast.sent+'回</span><span class="pp-small">面談化は未確認</span>'
          : '<span class="sl-muted">未記録</span>';
    default: return "—";
    }
  }

  function renderRows(rows) {
    const pages = Math.max(1, Math.ceil(rows.length / ppPageSize));
    ppPage = Math.max(1, Math.min(ppPage, pages));
    const start = (ppPage - 1) * ppPageSize;
    const shown = rows.slice(start, start + ppPageSize);
    $("pp-page-info").textContent = rows.length ? `${start + 1}～${start + shown.length}件 / 全${rows.length}件` : "0件";
    $("pp-page-label").textContent = `${ppPage} / ${pages}ページ`;
    $("pp-page-prev").disabled = ppPage <= 1;
    $("pp-page-next").disabled = ppPage >= pages;
    $("pp-page-size").value = String(ppPageSize);
    if (!rows.length) {
      $("pp-column-head").innerHTML = SalesProposalColumns.head(STATE.sort);
      $("rows").innerHTML = '<tr><td colspan="14" class="empty">この条件の提案はありません</td></tr>';
      $("cards").innerHTML = '<div class="sl-empty">この条件の提案はありません</div>';
      return;
    }
    $("pp-column-head").innerHTML = SalesProposalColumns.head(STATE.sort);
    $("rows").innerHTML = shown.map((r) => `
      <tr class="click${r.overdue ? " overdue" : ""}${!r.canEdit ? " pp-row-readonly" : ""}" onclick="ppOpen('${esc(r.id)}')">
        <td class="pp-check-col">${ppCheckInput(r)}</td>
        ${SalesProposalColumns.cellHtml(r,ppColumnCell)}
      </tr>`).join("");
    $("cards").innerHTML = shown.map((r) => `
      <div class="pp-card${r.overdue ? " overdue" : ""}" onclick="ppOpen('${esc(r.id)}')">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
          <div style="display:flex;gap:8px;align-items:center;">${ppCheckInput(r)}<b>${esc(r.companyName)}</b></div>
          ${pill(r.status, r.statusLabel)}
        </div>
        <div class="l">${esc(r.title)}${r.service ? "・"+esc(r.service) : ""}</div>
        <div class="l">${ppChain(r)}</div>
        <div class="l"><b style="font-size:12.5px;">次：${esc(r.next?.title || "—")}</b>
          ${r.next ? dueText(r.next.dueAt,r.next.overdue) : ""}</div>
        <div class="l">ブラスト：${!r.blast?"DB未設定":r.blast.meetings?"面談化 "+r.blast.meetings+"件":r.blast.sent?"配信済み "+r.blast.sent+"回":"未記録"}</div>
        <div class="l">電話：${r.call ? esc(r.call.label) : r.closed ? "—" : r.waiting ? "提案前" : "未実施"}
          ・経過 ${r.elapsedDays}日 ${!r.canEdit ? "・対応記録は閲覧のみ" : ""}</div>
      </div>`).join("");
  }

  function ppBulkState() {
    const rows = data?.proposals || [];
    const sel = rows.filter((r) => selected.has(r.id));
    $("pp-selected").textContent = sel.length + "件選択";
    $("pp-bulk").hidden = sel.length === 0;
    const editable = sel.length && sel.every((r) => r.canEdit);
    const restorable = sel.length && sel.every((r) => r.canRestore);
    $("pp-bulk-edit").disabled = !editable;
    $("pp-bulk-blast").disabled=!editable||!data?.blastReady;
    $("pp-bulk-archive").disabled = !editable;
    $("pp-bulk-restore").disabled = !restorable;
    const able = ppPageRows().filter((r) => r.canEdit || r.canRestore);
    const all = $("pp-all");
    if (all) {
      all.checked = able.length > 0 && able.every((r) => selected.has(r.id));
      all.indeterminate = able.length > 0 && !all.checked && able.some((r) => selected.has(r.id));
    }
  }
  function ppSelectOne(id, checked) {
    if (!(data?.proposals || []).some((r) => r.id === id && (r.canEdit || r.canRestore))) return;
    if (checked && selected.size < 50) selected.add(id);
    else if (!checked) selected.delete(id);
    else { alert("一度に選択できるのは最大50件です"); }
    for (const checkbox of document.querySelectorAll('input[data-pid]')) {
      checkbox.checked = selected.has(checkbox.dataset.pid);
    }
    ppBulkState();
  }
  function ppSelectAll(checked) {
    const able = ppPageRows().filter((r) => r.canEdit || r.canRestore);
    if (checked) { for (const r of able) { if (selected.size >= 50) break; selected.add(r.id); } }
    else { for (const r of able) selected.delete(r.id); }
    for (const checkbox of document.querySelectorAll('input[data-pid]')) checkbox.checked = selected.has(checkbox.dataset.pid);
    ppBulkState();
  }
  function ppBulkEdit() {
    const rows = (data?.proposals || []).filter((r) => selected.has(r.id));
    if (!rows.length || rows.some((r) => !r.canEdit)) return;
    const oneManual = rows.length === 1 && rows[0].sourceSystem === "manual";
    modal('<h2>選択した提案を編集（' + rows.length + '件）</h2>' +
      '<p class="sl-muted">全件に共通の「種別」を変更できます。ENGER連携元の提案名は変更できません。</p>' +
      '<label>種別（変更しない場合は空欄）</label><input id="m-bservice" maxlength="100" placeholder="例：ENGER・システム開発・AI/DX">' +
      (oneManual ? '<label>提案名（1件のみ、変更しない場合は空欄）</label><input id="m-btitle" maxlength="200" value="' +
        esc(rows[0].title) + '">' : '') + foot("ppSaveBulkEdit()", "変更を保存"));

  async function ppSaveBulkEdit() {
    const service = $("m-bservice").value.trim(), title = $("m-btitle")?.value.trim() || null;
    if (!service && !title) { $("m-msg").textContent = "変更内容を入力してください"; return; }

  function ppBulkArchive() {
    const rows = (data?.proposals || []).filter((r) => selected.has(r.id));

    modal('<h2>一覧から削除（アーカイブ）</h2><p>選択した' + rows.length +

  function ppBulkRestore() {
    const rows = (data?.proposals || []).filter((r) => selected.has(r.id));
    if (!rows.length || rows.some((r) => !r.canRestore)) return;
    modal('<h2>アーカイブから復元（' + rows.length + '件）</h2>' +
      '<p>一覧へ戻します。必要な電話・フォローのタスクは手動で再登録してください。</p>' +

  async function ppCommitBulk(action, fields={}) {
    const ids = [...selected];
    if (!ids.length || ids.length > 50) return;
    try {
      const result = await KPLayout.busy($("m-ok"), "処理中…",
        () => API.api("/api/sales/proposals/bulk", { method:"POST", body:{ action, ids, ...fields } }));
      ppCloseAction();
      selected.clear();
      await load();
      if (detail?.proposal && ids.includes(detail.proposal.id)) ppClose();
      alert(result.count + "件の" + ({edit:"編集",archive:"アーカイブ",restore:"復元"}[action]||"更新") + "が完了しました");
    } catch (e) { $("m-msg").textContent = errText(e); }
  }

      ["提案後の電話実施率", v(k.callRate), `${k.called}/${k.callBase}件・目標100%`],

  // チェックリスト：電話 → 不通ならメール → 回答確認 → 再フォロー → 結果確定
  function checklist(p, tasks, acts) {
    const has = (k, fn = () => true) => acts.some((a) => a.kind === k && fn(a));
    const noAnswer = has("call", (a) => ["no_answer", "absent"].includes(a.result));
    const replied = has("reply") || has("call", (a) => a.result === "connected");
    const open = (kind) => tasks.some((t) => t.status === "open" && t.kind === kind);
    const items = [
      { lb: "企業へ提案（提案準備）", ok: Boolean(p.sentAt), now: p.waiting },
      { lb: "電話（結果を記録）", ok: has("call"), now: open("call") && !has("call") },
      { lb: "不通のときは確認メール", ok: has("mail") || (has("call") && !noAnswer), now: open("mail"), skip: has("call") && !noAnswer },
      { lb: "回答の確認", ok: replied || has("check"), now: open("reply_check") },
      { lb: "再フォロー（未回答のとき）", ok: replied || tasks.some((t) => t.source_event === "auto:refollow" && t.status === "done"), now: open("refollow"), skip: replied },
      { lb: "結果の確定（成約・見送り・クローズ）", ok: p.closed, now: open("manager_review") || p.status === "meeting_done" },
    ];
    return `<ul class="pp-check">${items.map((i) => `<li class="${i.ok ? "ok" : i.now ? "now" : ""}">
      <span class="material-symbols-outlined">${i.ok ? "check_circle" : i.now ? "pending" : "radio_button_unchecked"}</span>
      ${esc(i.lb)}${i.skip && i.ok ? `<span class="sl-muted">（不要）</span>` : ""}</li>`).join("")}</ul>`;
  }


  function ppStageIndex(p) {
    return p.handoffStage === "closing" ? 2 : p.handoffStage === "cs" && p.csOwnerId ? 1 : 0;
  }
  // 今できる一つのアクションだけを案内する。
  function ppFlowAction(p, d) {
    if (!d.canEdit) return '<span class="pp-flow-hint">この提案は閲覧のみです。引継ぎは現在の担当者が操作します。</span>';
    if (p.closed) return '<span class="pp-flow-hint">対応終了</span>';
    const stage = ppStageIndex(p);
    let label = "", action = "", enabled = true, hint = "", blocked = "";
    if (stage === 0) {
      label = "CSへ引継ぐ"; action = "ppHandoff('cs')";
      if (!p.sentAt) { enabled = false; blocked = "sent"; hint = "先に企業へ提案してください"; }
      else if (!(d.handoffTargets?.cs || []).length) { enabled = false; blocked = "cs_team"; hint = "管理者がCS担当を設定してください"; }
    } else if (stage === 1 && !d.csContacted) {
      label = "電話結果を記録"; action = "ppCall()";
      hint = "通話または返信の記録後にCS判断へ";
    } else if (stage === 1 && !["advance","needs_detail"].includes(d.csDecision)) {
      label = "CS判断を記録"; action = "ppCsDecision()";
      hint = "進行判断後にクロージングへ";
    } else if (stage === 1) {
      label = "クロージングへ引継ぐ"; action = "ppHandoff('closing')";
      if (!(d.handoffTargets?.closing || []).length) { enabled = false; blocked = "closing_team"; hint = "管理者がクロージング担当を設定してください"; }
    } else { label = "面談を記録"; action = "ppMeeting()"; }
    if (!d.canHandoff && stage !== 2 && !(stage === 1 && !d.csContacted)) {
      enabled = false; blocked = "owner"; hint = "現在の担当者または管理者が操作できます";
    }
    return '<button type="button" class="btn btn-primary btn-sm' + (enabled ? "" : " pp-flow-blocked") + '" onclick="' +
      (enabled ? action : "ppFlowBlocked('" + blocked + "')") +
      '" title="' + esc(enabled ? label : "押すと進めない理由を確認できます") + '">' + esc(label) + '</button>' +
      (hint ? '<span class="pp-flow-hint">' + esc(hint) + '</span>' : "");
  }

  function renderDetail() {
    const box = $("pp-detail");
    if (!box || !detail) return;
    const p = detail.proposal;
    const tasks = detail.tasks || [];
    const acts = detail.activities || [];
    const openTasks = tasks.filter((t) => t.status === "open");
    const doneTasks = tasks.filter((t) => t.status !== "open");
    const phone = p.contactPhone || detail.company?.phone || null;
    const review = openTasks.some((t) => t.kind === "manager_review");

    // 提案待ち：まだ企業へ提案していない。電話・メールの記録は出さない（30分の電話は提案を送ってから）
    const waitingCta = `<button class="btn btn-primary sl-cta-main" onclick="ppSent()"><span class="material-symbols-outlined icon-inline">send</span>企業へ提案した（記録）</button>
         <div class="sl-cta-sub">
           <button class="btn btn-secondary btn-sm" onclick="ppResult()">結果・状態</button>
           ${p.sourceUrl ? `<a class="btn btn-secondary btn-sm" href="${esc(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">dx.enger で提案内容を開く</a>` : ""}
         </div>
         <div class="sl-muted" style="font-size:11.5px;width:100%;">dx.enger から企業へ提案メールを送ると、自動で「電話待ち」に進み、送った時刻から${esc(String(detail.settings?.firstCallMinutes ?? 30))}分以内の電話のタスクができます。dx.enger 以外（自分のメール・電話）で提案したときは「企業へ提案した」を押してください。</div>`;
    const cta = !detail.canEdit
      ? '<div class="pp-readonly-note">電話・メール・正式引継ぎなどの記録は現在の担当者が登録します。CS担当・クロージング担当はこの詳細から変更できます。</div>'
      : p.closed
      ? (detail.manager ? `<button class="btn btn-primary btn-sm" onclick="ppDecision()">再開する（管理者の判断）</button>` : `<div class="meta">この提案は終わっています</div>`)
      : p.waiting ? waitingCta
      : `<button class="btn btn-primary sl-cta-main" onclick="ppCall()"><span class="material-symbols-outlined icon-inline">call</span>電話の結果を記録</button>
         <details class="pp-more-actions"><summary>その他の操作</summary><div class="sl-cta-sub">
           <button class="btn btn-secondary btn-sm" onclick="ppMail()">確認メールを送った</button>
           <button class="btn btn-secondary btn-sm" onclick="ppReply()">企業から返信あり</button>
           <button class="btn btn-secondary btn-sm" onclick="ppCheck()">返信なし（回答確認）</button>
           <button class="btn btn-secondary btn-sm" onclick="ppMeeting()">面談</button>
           <button class="btn btn-secondary btn-sm" onclick="ppResult()">結果・状態</button>
           ${detail.manager && review ? `<button class="btn btn-secondary btn-sm" onclick="ppDecision()">管理者の判断</button>` : ""}
         </div></details>`;

    box.innerHTML = `
      <div class="pp-detail-header">
        <div style="min-width:0;">
          <div style="font-size:18px;font-weight:700;color:#1b2440;">${esc(p.companyName)}</div>
          <div style="font-size:13px;color:#1b2440;margin-top:4px;">${esc(p.title)}</div>
          <div style="font-size:12px;color:#6b7080;margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            ${pill(p.status, p.statusLabel)}${p.closeReasonLabel ? `<span>${esc(p.closeReasonLabel)}</span>` : ""}
            <span>${esc(p.service || "")}</span>${p.sentAt
              ? `<span>提案 ${esc(fmt(p.sentAt))}（${p.elapsedDays}日経過）</span>${p.matchedAt ? `<span>確定 ${esc(fmt(p.matchedAt))}</span>` : ""}`
              : `<span>マッチング確定 ${esc(fmt(p.matchedAt))}（企業へはまだ提案していません）</span>`}
            ${p.sourceSystem === "enger" ? `<span class="pp-tag enger">dx.enger</span>` : `<span class="pp-tag">手入力</span>`}
            ${p.contactStop ? `<span class="pp-tag err">連絡停止の希望</span>` : ""}
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="ppClose()">閉じる</button>
      </div>

      ${!detail.canEdit ? '<div class="pp-readonly-note">対応記録は閲覧のみです。CS・クロージング担当は変更できます。</div>' : ""}
      <div class="pp-box pp-flow-box">
        <h4><span class="material-symbols-outlined">hub</span>引継ぎ｜提案 → CS → クロージング</h4>
        <div class="pp-flow-steps">
          ${[["① 提案",p.matchingOwnerName || "未設定"],["② CS",p.csOwnerName || "未割当"],["③ クロージング",p.closingOwnerName || "未割当"]].map(([label,name],i) =>
            `<div class="pp-flow-step ${i < ppStageIndex(p) ? "done" : i === ppStageIndex(p) ? "active" : ""}"><b>${esc(label)}</b><small>${esc(name)}</small></div>`).join("")}
        </div>
        <div class="pp-flow-action">${ppFlowAction(p, detail)}</div>
        <div class="pp-role-editor" aria-label="担当者の設定">
          <div class="pp-role-field"><span>提案担当（ENGER連携・固定）</span>
            <strong>${esc(ppOwnerName(p,"proposal"))}</strong><small>提案元の担当者は変更できません</small></div>
          <label class="pp-role-field"><span>CS担当</span>${ppOwnerSelect(p,"cs")}</label>
          <label class="pp-role-field"><span>クロージング担当</span>${ppOwnerSelect(p,"closing")}</label>
        </div>
        <p class="pp-flow-hint">担当変更は自動保存されます。正式な引継ぎは上のボタンから記録してください。</p>
        <div class="pp-supporters" aria-label="各役割の共同担当者">
          ${[["proposal","① 提案担当"],["cs","② CS担当"],["closing","③ クロージング担当"]].map(([stage,label])=>`
            <div><b>${esc(label)}の共同担当</b>
              <small>${(detail.supporters?.[stage]||[]).length?
                (detail.supporters[stage]||[]).map(x=>esc(x.name)).join("・"):"未設定"}</small>
              ${detail.canEdit?`<button type="button" onclick="ppEditSupporters(\'${stage}\')">＋ 担当を追加・変更</button>`:""}
            </div>`).join("")}
        </div>
        ${(detail.handoffs || []).length ? `<details style="margin-top:10px;"><summary style="cursor:pointer;">バトンタッチ履歴（${detail.handoffs.length}件）</summary>
           ${detail.handoffs.map(h => `<div style="border-top:1px solid #e5e7eb;padding:9px 0;font-size:12px;">
             <b>${esc(h.fromName)} → ${esc(h.toName)}</b>　${esc(fmt(h.at))}
             <div>判断：${esc(h.decision)}／理由：${esc(h.reason)}</div>
             <div>次の対応：${esc(h.nextAction)}${h.nextAt ? '・期限：'+esc(fmt(h.nextAt)) : ""}</div>
             <div class="sl-muted">Slack共有：${h.slackSent ? "済み" : "未確認"}
               ${detail.canEdit && detail.manager && !h.slackSent ? `<button class="pp-linkbtn" onclick="ppReshareHandoff('${esc(h.id)}')">再共有</button>` : ""}</div>
           </div>`).join("")}</details>` : '<p class="sl-muted">引継ぎ履歴はまだありません。</p>'}
      </div>


      <div class="sl-next" style="margin:14px 20px 12px;">
        <div class="lb"><span class="material-symbols-outlined">bolt</span>次の行動</div>
        <h3>${esc(p.next ? p.next.title : p.closed ? "—" : "タスクはありません")}</h3>
        <div class="meta">${p.next ? `期限：${dueText(p.next.dueAt, p.next.overdue)}　担当：${esc(p.next.assigneeName || "未定")}` : ""}
          ${p.meetingAt ? `　面談：${esc(fmt(p.meetingAt))}` : ""}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">${cta}</div>
      </div>

      <div class="pp-box pp-contact-box">
        <h4><span class="material-symbols-outlined">contact_phone</span>先方の窓口</h4>
        <div style="font-size:13px;color:#1b2440;">${esc(p.contactName || "担当者名 未登録")}</div>
        <div class="pp-contact">
          ${phone ? `<a class="btn btn-primary btn-sm" href="tel:${esc(phone.replace(/[^0-9+]/g, ""))}"><span class="material-symbols-outlined icon-inline">call</span>${esc(phone)}</a>` : `<span class="sl-muted">電話番号 未登録</span>`}
          ${p.contactEmail ? `<span class="sl-muted">${esc(p.contactEmail)}</span>` : `<span class="sl-muted">メール 未登録</span>`}
          ${detail.canEdit ? `<button class="pp-linkbtn" onclick="ppContact()">窓口を直す</button>` : ""}
        </div>
      </div>

      <div class="pp-box pp-checklist-box">
        <h4><span class="material-symbols-outlined">checklist</span>チェックリスト</h4>
        ${checklist(p, tasks, acts)}
      </div>

      <div class="pp-box pp-task-box">
        <h4 style="justify-content:space-between;"><span style="display:flex;gap:6px;align-items:center;"><span class="material-symbols-outlined">task_alt</span>タスク</span>
          ${p.closed || !detail.canEdit ? "" : `<button class="pp-linkbtn" onclick="ppTaskAdd()">＋ タスクを足す</button>`}</h4>
        ${openTasks.length ? openTasks.map((t) => taskRow(t)).join("") : `<div class="sl-empty">開いているタスクはありません</div>`}
        ${doneTasks.length ? `<details style="margin-top:8px;"><summary class="sl-muted" style="cursor:pointer;">完了・取り消し（${doneTasks.length}件）</summary>
          ${doneTasks.map((t) => taskRow(t)).join("")}</details>` : ""}
      </div>

      <div class="pp-box pp-info-box">
        <h4><span class="material-symbols-outlined">info</span>提案の情報</h4>
        <dl class="sl-grid2">
          <div><dt>マッチング担当</dt><dd>${esc(p.matchingOwnerName || "—")}</dd></div>
          <div><dt>営業担当</dt><dd>${esc(p.salesOwnerName || "未割当")}
            ${detail.canAssign ? ` <button class="pp-linkbtn" onclick="ppAssign()">初回担当を設定</button>` : ""}</dd></div>
          <div><dt>案件</dt><dd>${esc(p.jobTitle || "—")}</dd></div>
          <div><dt>人材</dt><dd>${esc(p.talentInitials || "—")}</dd></div>
          <div><dt>dx.enger</dt><dd>${p.sourceUrl ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">提案を開く${p.sourceCode ? `（${esc(p.sourceCode)}）` : ""}</a>` : "—"}
            ${p.sourceStage ? `<span class="pp-small">ステージ：${esc(p.sourceStage)}</span>` : ""}</dd></div>
          <div><dt>企業（/sales）</dt><dd>${detail.company
            ? `<a href="/sales/companies.html?id=${esc(detail.company.id)}">${esc(detail.company.name)}</a><span class="pp-small">${esc(detail.company.statusLabel)}${detail.company.ng ? "・営業禁止" : ""}</span>
               ${detail.canEdit ? `<button class="pp-linkbtn" onclick="ppLink()">付け替え</button>` : ""}`
            : `<span class="pp-tag warn">未紐付け</span> ${detail.canEdit ? `<button class="pp-linkbtn" onclick="ppLink()">紐付ける</button>` : ""}` }</dd></div>
        </dl>
        <div class="sl-muted" style="font-size:11.5px;">企業と紐付けると、この提案の電話・メール・返信・面談が企業の営業履歴にも残ります（社名だけで自動では紐付けません）</div>
      </div>

      <div class="pp-history-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;">
          <h4 style="font-size:13px;color:#1b2440;margin:0;">行動の履歴</h4>
          ${detail.canEdit ? `<button class="pp-linkbtn" onclick="ppMemo()">メモを残す</button>` : ""}
        </div>
        ${acts.length ? `<div class="sl-tl">${acts.map((a) => `
          <div class="row"><div class="d">${esc(fmt(a.occurredAt))}${a.employeeName ? `　${esc(a.employeeName)}` : ""}</div>
            <div class="l">${esc(a.label)}${a.kind === "cs_decision" ? `：${esc(({advance:"進める",needs_detail:"詳細確認",hold:"保留",decline:"見送り"})[a.result] || a.result || "判断")}` : ""}</div>
            ${a.kind === "cs_decision" && a.detail?.nextAction ? `<div class="x">次の対応：${esc(a.detail.nextAction)}</div>` : ""}
            ${a.nextAt ? `<div class="x">日時：${esc(fmt(a.nextAt))}</div>` : ""}
            ${a.note ? `<div class="x" style="white-space:pre-wrap;">${esc(a.note)}</div>` : ""}</div>`).join("")}</div>`
          : `<div class="sl-empty">まだ記録がありません</div>`}
      </div>`;
  }

  function taskRow(t) {
    const cls = t.status !== "open" ? "done" : t.overdue ? "overdue" : "";
    const ops = t.status === "open" && detail.canEdit ? `<div class="ops">
      <button class="pp-linkbtn" onclick="ppTaskDue('${esc(t.id)}')">期限変更</button>
      ${t.kind === "manual" ? `<button class="pp-linkbtn" onclick="ppTaskDone('${esc(t.id)}')">完了</button>` : ""}
      ${!t.auto || detail.manager ? `<button class="pp-linkbtn" onclick="ppTaskCancel('${esc(t.id)}')">取り消し</button>` : ""}</div>` : "";
    return `<div class="pp-task ${cls}"><div class="t"><b>${esc(t.title)}</b>
      <span class="pp-small">${esc(t.kindLabel)}・期限 ${esc(fmt(t.dueAt))}${t.overdue ? "（超過）" : ""}・${esc(t.assigneeName || "担当未定")}
        ${t.status === "done" ? `・完了 ${esc(fmt(t.doneAt))}${t.late ? "（期限後）" : ""}` : ""}${t.status === "canceled" ? `・取り消し（${esc(t.cancelReason || "")}）` : ""}</span></div>${ops}</div>`;
  }

  function ppEditSupporters(stage) {
    if (!detail?.canEdit || !["proposal","cs","closing"].includes(stage)) return;
    const label = {proposal:"提案",cs:"CS",closing:"クロージング"}[stage];
    const chosen = new Set((detail.supporters?.[stage]||[]).map((x)=>x.id));
    const options=(detail.members||[]).map(m=>'<label><input type="checkbox" data-supporter="' +
      esc(m.id) + '"' + (chosen.has(m.id)?' checked':'') + '>'+esc(m.name)+'</label>').join('');
    modal('<h2>'+label+'の共同担当を設定</h2>'+
      '<p class="sl-muted" style="font-size:12px;">主担当は変更せず、対応を支援するメンバーを最大10名まで登録できます。追加・変更は履歴に残ります。</p>'+
      '<div class="pp-supporter-options">'+(options||'<div class="sl-empty">選べるSalesメンバーがいません</div>')+'</div>'+
      '<div class="pp-msg" id="m-msg"></div>'+
      '<div class="sl-modal-foot"><button class="btn btn-primary" id="m-ok" onclick="ppSaveSupporters(\''+
      stage+'\')">保存する</button><button class="btn btn-secondary" onclick="ppCloseAction()">やめる</button></div>');
  }
  async function ppSaveSupporters(stage) {
    if (!detail?.canEdit || !["proposal","cs","closing"].includes(stage)) return;
    const members=[...document.querySelectorAll("input[data-supporter]:checked")].map((x)=>x.dataset.supporter);
    if (members.length>10) { $("m-msg").textContent="共同担当は各段階10名までです"; return; }
    try {
      await KPLayout.busy($("m-ok"),"保存中…",()=>API.api("/api/sales/proposals/supporters",{
        method:"POST",body:{id:detail.proposal.id,stage,members}
      }));
      ppCloseAction();
      const result=await API.api("/api/sales/proposals/detail?id="+encodeURIComponent(detail.proposal.id));
      detail=result; renderDetail(); load();
    } catch(e) { if ($("m-msg")) $("m-msg").textContent=errText(e); else alert(errText(e)); }
  }

  // ---- 操作（中央モーダル） ----------------------------------------------------
  function modal(html) {
    $("pp-action").innerHTML = `<div class="sl-modal-bg" onclick="ppCloseAction()"></div><div class="sl-modal" role="dialog" aria-modal="true">${html}</div>`;
  }
  function ppCloseAction() { $("pp-action").innerHTML = ""; }
  const radios = (name, list, checked) => `<div class="pp-opt">${list.map((o) => `
    <label><input type="radio" name="${name}" value="${esc(o.key)}" ${o.key === checked ? "checked" : ""} onchange="ppToggle()">${esc(o.label)}</label>`).join("")}</div>`;
  const picked = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || null;
  const foot = (fn, label = "記録する") => `<div class="pp-msg" id="m-msg"></div>
    <div class="sl-modal-foot"><button class="btn btn-primary" id="m-ok" onclick="${fn}">${esc(label)}</button>
    <button class="btn btn-secondary" onclick="ppCloseAction()">やめる</button></div>`;
  const whenField = (label = "実施日時") => `<label>${esc(label)}</label><input type="datetime-local" id="m-at" value="${localInput()}">`;
  const noteField = (label = "メモ（任意）") => `<label style="margin-top:10px;">${esc(label)}</label><textarea id="m-note" rows="2"></textarea>`;
  let toggle = () => {};
  function ppToggle() { toggle(); }

  function flash(text) {
    const box = $("pp-detail");
    if (!box) return;
    const div = document.createElement("div");
    div.className = "banner ok";
    div.style.margin = "12px 20px 0";
    div.innerHTML = `<span class="material-symbols-outlined">check_circle</span><div>${esc(text)}</div>`;
    box.insertBefore(div, box.firstChild);
    setTimeout(() => div.remove(), 6000);
  }
  async function send(body, okText = "保存しました") {
    const btn = $("m-ok");
    const callNeedsAt = body.action === "call" && (detail?.labels?.callResults || [])
      .find((x) => x.key === body.result)?.needsAt;
    if (ppShowIssue(SalesProposalFeedback.validate(body.action, body, {
      callNeedsAt, currentOwner: detail?.proposal?.salesOwnerId || null
    }))) return;
    try {
      const r = await KPLayout.busy(btn, "保存中…", () => API.api("/api/sales/proposals/detail", { method: "POST", body: { id: detail.proposal.id, ...body } }));
      detail = r;
      ppCloseAction();
      renderDetail();
      load();
      // 何が記録され、次に何ができたかを、その場で知らせる（押しても何も起きないように見せない）
      if (r.recorded) flash(`記録しました：${r.recorded.label}${r.recorded.createdTasks.length ? `　→ 次のタスク：${r.recorded.createdTasks.join("・")}` : ""}`);
      else if (okText) flash(okText);
    } catch (e) {
      ppShowServerError(e);
    }
  }

  // 企業へ提案した（dx.enger 以外で送ったとき）。電話待ちへ進み、送った時刻から30分以内の電話のタスク
  function ppSent() {

  // ---- 提案担当→CS→クロージング：バトンタッチ -----------------------------
  function ppHandoff(stage) {
    const targets = (detail.handoffTargets || {})[stage] || [];
    const cs = stage === "cs";
    if (!targets.length) {
      ppFlowBlocked(stage === "cs" ? "cs_team" : "closing_team");
      return;
    }
    const decisions = cs
      ? [{ key: "advance", label: "提案送信済み・CS対応を開始" }, { key: "other", label: "その他" }]
      : [{ key: "advance", label: "進行・詳細商談へ" }, { key: "needs_detail", label: "条件調整・詳細確認が必要" }];
    modal('<h2>' + (cs ? "CSへ正式に引き継ぐ" : "クロージングへ引き継ぐ") + '</h2>' +
      '<p class="sl-muted" style="font-size:12px;">いつ・誰から誰へ・何の理由で渡したかを記録し、Slackでチームに共有します。</p>' +
      '<label>引継ぎ先（必須）</label><select id="m-howner">' +
      targets.map((t) => '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>').join("") + '</select>' +
      '<label>判断（必須）</label>' + radios("m-hdecision", decisions, decisions[0].key) +
      '<label>引継ぎ理由（必須）</label><textarea id="m-hreason" rows="2" maxlength="500" placeholder="例：面談希望あり・開始時期と単価の詳細確認が必要"></textarea>' +
      '<label>次の担当がすること（必須）</label><textarea id="m-hnext" rows="2" maxlength="500" placeholder="例：先方に連絡して詳細ヒアリングの日程を決める"></textarea>' +
      '<label>次の対応期限（任意）</label><input type="datetime-local" id="m-hdue">' +
      foot("ppCommitHandoff('" + stage + "')", "引継ぎを確定しSlackで共有"));
  }
  async function ppCommitHandoff(stage) {
    const reason = $("m-hreason").value.trim(), nextAction = $("m-hnext").value.trim();
    const blocked = SalesProposalFeedback.validate("transfer", {
      ownerId:$("m-howner").value, decision:picked("m-hdecision"), reason, nextAction, nextAt:$("m-hdue").value
    });
    if (ppShowIssue(blocked)) return;
    const oldId = detail.proposal.id;
    const body = { id: oldId, action: "transfer", toStage: stage,
      ownerId: $("m-howner").value, decision: picked("m-hdecision"),
      reason, nextAction, nextAt: $("m-hdue").value || null };
    try {
      const res = await KPLayout.busy($("m-ok"), "処理中…",
        () => API.api("/api/sales/proposals/handoff", { method: "POST", body }));
      ppCloseAction();
      ppClose(); // 引継ぎ後も詳細は閲覧できるが、操作権限は次の担当者に移る
      await load();
      alert(res.slack?.sent ? "引継ぎを記録し、Slackにも共有しました" : "引継ぎを記録しました（Slackの共有は未確認です）");
    } catch (e) { ppShowServerError(e); }
  }
  function ppCsDecision() {
    modal('<h2>CS：連絡後の進行判断</h2>' +
      '<p class="sl-muted" style="font-size:12px;">通話成功または返信の記録が必要です。CSで判断できる範囲の一次確認を行い、詳細はクロージングに渡します。</p>' +

        { key:"advance", label:"進める（クロージングへ）" },

      '<label>次の対応（必須）</label><textarea id="m-cnext" rows="2" maxlength="500"></textarea>' +
      foot("ppCommitCsDecision()", "CS判断を記録・Slack共有"));

  async function ppCommitCsDecision() {
    const reason = $("m-creason").value.trim(), nextAction = $("m-cnext").value.trim();
    const blocked = SalesProposalFeedback.validate("cs_decision", {
      decision:picked("m-cdecision"), reason, nextAction
    });
    if (ppShowIssue(blocked)) return;
    const id = detail.proposal.id;
    try {
      const res = await KPLayout.busy($("m-ok"), "処理中…",
        () => API.api("/api/sales/proposals/handoff", { method:"POST",
          body:{ id, action:"cs_decision", decision:picked("m-cdecision"), reason, nextAction } }));
      ppCloseAction();
      await ppOpen(id); load();
      alert(res.slack?.sent ? "CSの判断を記録してSlackに共有しました" : "CSの判断を記録しました（Slackの共有は未確認です）");
    } catch (e) { ppShowServerError(e); }
  }

  }

      <label style="margin-top:10px;">先方の担当者・電話・メール（任意）</label>
      <div class="inline-controls"><div><input type="text" id="n-cname" placeholder="担当者名"></div>
        <div><input type="tel" id="n-cphone" placeholder="電話"></div><div><input type="email" id="n-cmail" placeholder="メール"></div></div>
      ${foot("ppSendNew()", "追加する")}`);
  }
  async function ppSendNew() {
    const body = {
      companyName: $("n-company").value, title: $("n-title").value, service: $("n-service").value || null, sentAt: $("n-sent").value,
      contactName: $("n-cname").value, contactPhone: $("n-cphone").value, contactEmail: $("n-cmail").value,
    };
    if (ppShowIssue(SalesProposalFeedback.validate("new", body))) return;
    try {
      const r = await KPLayout.busy($("m-ok"), "追加中…", () => API.api("/api/sales/proposals", { method: "POST", body }));
      ppCloseAction();
      await load();
      ppOpen(r.proposal.id);
    } catch (e) { ppShowServerError(e); }
  }

</script>

</body>
</html>
