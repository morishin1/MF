<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>反応 - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260916m">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="sl-title">反応</h1>
  <p class="sl-sub">営業リンクをクリックした企業です。未対応・直近・複数回クリックの順に並べています。</p>

  <div class="sl-toolbar">
    <div class="sl-tabs-pill" id="tabs"></div>
  </div>

  <div style="overflow-x:auto;">
    <table class="sl-table">
      <thead><tr><th>企業</th><th>提案内容</th><th>送信日時</th><th>初回クリック</th><th>最終クリック</th>
        <th>回数</th><th>担当</th><th>NEXT</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="../js/api-client.js?v=20260916m"></script>
<script src="../js/layout.js?v=20260916m"></script>
<script src="../js/sales-layout.js?v=20260916m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = SalesLayout.esc;
  const { fmt, fmtDay, ago, statusPill } = SalesLayout;

  let companies = [];
  let tab = "all";
  const TABS = [["all", "すべて"], ["todo", "未フォロー"], ["done", "フォロー済"]];

  SalesLayout.init({ active: "clicks" }).then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const res = await API.listSalesCompanies();
      if (res.notReady) {
        el("rows").innerHTML = `<tr><td colspan="8"><div class="banner warn"><span class="material-symbols-outlined">build</span>
          <div>${esc(res.message)}</div></div></td></tr>`;
        return;
      }
      companies = (res.companies || []).filter((c) => c.clickCount > 0);
      render();
    } catch (e) {
      el("rows").innerHTML = `<tr><td colspan="8"><div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
    }
  }

  function setTab(k) { tab = k; render(); }

  // 優先順位（要件 §13）：未フォローを先に。その中で直近クリック → 複数回クリック
  function sorted(list) {
    return [...list].sort((x, y) =>
      (y.unhandledClick ? 1 : 0) - (x.unhandledClick ? 1 : 0)
      || String(y.lastClickAt || "").slice(0, 10).localeCompare(String(x.lastClickAt || "").slice(0, 10))
      || (y.clickCount || 0) - (x.clickCount || 0)
      || String(y.lastClickAt || "").localeCompare(String(x.lastClickAt || "")));
  }

  function render() {
    el("tabs").innerHTML = TABS.map(([k, l]) => {
      const n = companies.filter((c) => k === "all" || (k === "todo") === c.unhandledClick).length;
      return `<button class="${tab === k ? "on" : ""}" onclick="setTab('${k}')">${esc(l)} ${n}</button>`;
    }).join("");
    const list = sorted(companies.filter((c) => tab === "all" || (tab === "todo") === c.unhandledClick));
    if (!list.length) {
      el("rows").innerHTML = `<tr><td colspan="8" class="empty">${companies.length ? "対象がありません。" : "まだクリックされた企業はありません。"}</td></tr>`;
      return;
    }
    el("rows").innerHTML = list.map((c) => `
      <tr class="click" onclick="location.href='/sales/companies.html?id=${esc(c.id)}'">
        <td><span class="sl-nm">${esc(c.name)}</span>
          <span class="sl-sub2">${c.unhandledClick ? `<span class="sl-hot">未フォロー</span>` : "フォロー済"}　${statusPill(c.status, c.statusLabel)}</span></td>
        <td>${esc(c.lastService || c.service || "—")}</td>
        <td style="white-space:nowrap;">${esc(fmt(c.lastSentAt) || "—")}</td>
        <td style="white-space:nowrap;">${esc(fmt(c.firstClickAt))}</td>
        <td style="white-space:nowrap;">${esc(fmt(c.lastClickAt))}<span class="sl-sub2">${esc(ago(c.lastClickAt))}</span></td>
        <td><span class="${c.clickCount >= 2 ? "sl-hot" : ""}">${c.clickCount}回</span></td>
        <td>${esc(c.ownerName || "未定")}</td>
        <td>${esc(c.next)}${c.nextDue ? `<span class="sl-sub2">${esc(fmtDay(c.nextDue))}</span>` : ""}</td>
      </tr>`).join("");
  }
</script>

</body>
</html>
