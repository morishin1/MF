<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>アタック管理 - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261114portal2">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    .at-links { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; margin-bottom:18px; }
    .at-stage { display:flex; gap:6px; overflow-x:auto; padding:3px; margin:0 0 14px; }
    .at-stage button { flex:1 0 auto; padding:8px 12px; border:1px solid #dddeda; border-radius:8px;
      color:#1b2440; background:#fff; font:inherit; cursor:pointer; white-space:nowrap; }
    .at-stage button[aria-pressed="true"] { background:#1b2440; color:#fff; border-color:#1b2440; font-weight:700; }
    .at-stage .at-badge { margin-left:6px; font-size:12px; }
    .at-filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%, 150px),1fr)); gap:8px; margin-bottom:10px; }
    .at-filters input, .at-filters select { min-width:0; width:100%; margin:0; font-size:13px; }
    .at-row { display:flex; align-items:center; gap:14px; justify-content:space-between; padding:12px 14px;
      background:#fff; border:1px solid #e2e2dc; border-radius:10px; }
    .at-info { min-width:0; }
    .at-name { background:transparent; border:0; padding:0; color:#1b2440; font:inherit; font-weight:700;
      text-align:left; cursor:pointer; overflow-wrap:anywhere; }
    .at-name:hover { text-decoration:underline; }
    .at-meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:13px; color:#4a5068; }
    .at-actions { display:flex; flex-wrap:wrap; gap:6px; flex-shrink:0; }
    .at-note { color:#804d14; }
    .at-file { margin:16px 0; }
    .at-file summary { cursor:pointer; font-weight:700; color:#1b2440; }
    .at-file th, .at-file td { white-space:normal; }
    .at-summary { display:flex; gap:8px; align-items:center; justify-content:space-between; margin:8px 0; }
    .at-summary #qa-start[hidden] { display:none; }
    .at-summary select { width:auto; max-width:65%; margin:0; }
    #queue { display:grid; gap:7px; }
    #queue.loading { opacity:.45; pointer-events:none; }
    .at-pager { display:flex; gap:12px; align-items:center; justify-content:center; margin:14px 0; }
    .sl-detail.at-detail { inset:50% auto auto 50%; transform:translate(-50%,-50%);
      width:720px; max-width:calc(100vw - 24px); max-height:88vh; max-height:88dvh;
      border-radius:14px; overflow-wrap:anywhere; }
    #quick-attack { box-sizing:border-box; width:min(640px, calc(100% - 24px)); max-height:90dvh;
      padding:0; overflow:hidden; color:#1b2440; border:1px solid #e2e2dc; border-radius:14px;
      box-shadow:0 16px 55px rgba(27,36,64,.24); }
    #quick-attack::backdrop { background:rgba(27,36,64,.52); }
    #quick-attack [hidden] { display:none !important; }
    .qa-shell { max-height:inherit; display:flex; flex-direction:column; }
    .qa-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      padding:16px 20px 12px; border-bottom:1px solid #e2e2dc; }
    .qa-header h2 { font-size:19px; margin:0; overflow-wrap:anywhere; }
    #qa-meter { font-size:12px; color:#4a5068; margin:4px 0 0; }
    #qa-content { overflow:auto; min-height:0; padding:14px 20px 0; overflow-wrap:anywhere; }
    #qa-status { margin:0; padding:10px 20px; color:#4a5068; font-size:13px; }
    #qa-status:empty { display:none; }
    .qa-subject { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
    .qa-subject p { margin:3px 0 0; }
    .qa-preview { white-space:pre-wrap; background:#f6f6f2; padding:12px; border-radius:8px; margin-bottom:10px;
      display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden; line-height:1.55; }
    .qa-settings, .qa-editor, .qa-failure { margin:10px 0; }
    .qa-settings summary, .qa-editor summary { color:#4a5068; cursor:pointer; }
    .qa-settings label, .qa-editor label, .qa-failure label { display:block; font-size:13px; margin-top:8px; }
    .qa-editor textarea { resize:vertical; }
    .qa-note { color:#804d14; }
    .qa-controls { position:sticky; bottom:0; z-index:1; background:#fff; border-top:1px solid #e2e2dc;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 0; margin:12px 0 0; }
    @media (max-width:680px) {
      .at-row { align-items:stretch; flex-direction:column; gap:8px; }
      .at-filters { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
<link rel="stylesheet" href="../css/sales-design.css?v=20261119design3">
</head>
<body class="sales-page">
<div class="wrap">
  <h1 class="sl-title">アタック管理</h1>
  <div class="at-links">
    <a href="/sales/templates.html">営業文テンプレート</a>
    <a href="/sales/campaigns.html">キャンペーン</a>
  </div>
  <div class="at-stage" id="stages" role="group" aria-label="進捗"></div>
  <div class="at-filters">
    <input type="search" id="f-q" placeholder="企業名・URLで探す" aria-label="企業名・URLで探す">
    <select id="f-owner" aria-label="担当">
      <option value="mine">自分の担当＋担当なし</option>
      <option value="">担当：全員</option>
    </select>
    <select id="f-region" aria-label="地域"><option value="">地域：すべて</option></select>
    <select id="f-industry" aria-label="業種"><option value="">業種：すべて</option></select>
    <select id="f-service" aria-label="提案サービス"><option value="">提案サービス：すべて</option></select>
    <select id="f-campaign" aria-label="キャンペーン"><option value="">キャンペーン：すべて</option></select>
    <select id="f-next" aria-label="次の対応"><option value="">次の対応：すべて</option></select>
  </div>
  <div class="at-summary">
    <button type="button" class="btn btn-primary btn-sm" id="qa-start" hidden>連続アタックを始める</button>
    <span class="sl-muted" id="count" role="status"></span>
    <select id="f-sort" aria-label="並び順">
      <option value="">進捗ごとの優先順</option>
      <option value="next:asc">次の対応の期限順</option>
      <option value="name:asc">企業名順</option>
      <option value="created:desc">登録の新しい順</option>
      <option value="last_sent:desc">最終送信の新しい順</option>
    </select>
  </div>
  <div id="queue" aria-busy="true"><div class="sl-empty">読み込み中…</div></div>
  <nav id="pager" class="at-pager" aria-label="ページ"></nav>
  <details class="at-file card" id="attack-stats" hidden>
    <summary>担当者別の実績（全期間）</summary>
    <p class="sl-muted">送信は記録した担当、商談獲得は日程が確定した商談の担当で集計します。</p>
    <div id="attack-stats-body" aria-live="polite"></div>
  </details>
</div>
<dialog id="quick-attack" aria-labelledby="qa-title">
  <div class="qa-shell">
    <div class="qa-header">
      <div><h2 id="qa-title">フォームアタック</h2><p id="qa-meter" aria-live="polite"></p></div>
      <button type="button" class="btn btn-secondary btn-sm" data-qa="close">閉じる</button>
    </div>
    <div id="qa-content"></div>
    <p id="qa-status" role="status"></p>
  </div>
</dialog>
<div id="modal-root"></div>
<div id="action-root"></div>
<script src="../js/api-client.js?v=20261114portal2"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/sales-layout.js?v=20261118attack1"></script>
<script src="../js/sales-detail.js?v=20261118attack2"></script>
<script src="../js/sales-quick-attack.js?v=20261118quick1"></script>
<script src="../js/sales-attack-board.js?v=20261119entry1"></script>
</body>
</html>
