<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow"><title>企業一覧｜現在・過去・未来 - EIGHT SALES</title>
 <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
 <link rel="stylesheet" href="../css/app.css?v=20260927-sales4">
 <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="../css/sales-company-segments.css?v=20261105oneclick">
</head>
<body>
<main class="lc-wrap">
 <div class="lc-title"><div><h1 class="sl-title">企業一覧</h1><p class="sl-sub">現在を進める。過去を掘り起こす。未来を開拓する。</p></div><a href="/sales/companies.html" class="lc-back">従来の営業リスト</a></div>
 <div class="lc-preview"><strong>確認用プレビュー</strong><span>企業・履歴は実データ。電話・メール・フォームは端末のアプリや外部サイトを開きます。履歴の追加は確認用です。</span></div>
 <nav class="lc-tabs" aria-label="企業の営業区分">
  <button type="button" data-segment="current" aria-pressed="true"><span>現在</span><small>フォロー・進行中</small><b id="lc-current">—</b></button>
  <button type="button" data-segment="past" aria-pressed="false"><span>過去</span><small>掘り起こし候補</small><b id="lc-past">—</b></button>
  <button type="button" data-segment="future" aria-pressed="false"><span>未来</span><small>新規開拓候補</small><b id="lc-future">—</b></button>
  <button type="button" data-segment="pending" aria-pressed="false"><span>要確認</span><small>分類・履歴の確認</small><b id="lc-pending">—</b></button>
  <button type="button" data-segment="all" aria-pressed="false"><span>全企業</span><small>企業ID単位</small><b id="lc-all">—</b></button>
 </nav>
 <p class="lc-explain" id="lc-explain">企業・提案・連絡先を照合しています…</p>
 <div class="lc-tools">
  <label class="lc-search"><span class="material-symbols-outlined" aria-hidden="true">search</span><input id="lc-search" type="search" aria-label="企業名・企業IDで検索" placeholder="企業名・企業IDで検索"></label>
  <select id="lc-contact" aria-label="連絡先の登録状況"><option value="">連絡先：すべて</option><option value="yes">連絡先あり</option><option value="no">連絡先の調査が必要</option><option value="unknown">企業IDの照合が必要</option></select>
  <select id="lc-quick" aria-label="対応の絞り込み"><option value="">対応：すべて</option><option value="today">本日対応（保存済み予定）</option><option value="overdue">期限超過（保存済み予定）</option><option value="unassigned">担当未設定</option><option value="blocked">連絡停止・注意</option></select>
  <select id="lc-sort" aria-label="並べ替え"><option value="action">連絡先あり・期限順</option><option value="name">企業名順</option><option value="last">最終接点が新しい順</option></select>
  <button type="button" id="lc-refresh">再取得</button>
 </div>
 <div class="lc-status"><span id="lc-status" role="status" aria-live="polite">読み込み中…</span><span id="lc-observed"></span></div>
 <div class="lc-table-wrap"><table class="lc-table"><thead><tr>
  <th><input type="checkbox" id="lc-select-all" aria-label="表示中の行を選択"></th><th>企業・連絡先</th><th>状態・分類の根拠</th><th>最終接点</th><th>次にすること</th><th>担当・期限</th>
 </tr></thead><tbody id="lc-rows"><tr><td colspan="6">企業を取得しています…</td></tr></tbody></table></div>
 <div class="lc-pager"><button type="button" id="lc-prev" disabled>前へ</button><span id="lc-page">—</span><button type="button" id="lc-next" disabled>次へ</button></div>
 <p class="lc-footnote">過去・未来は旧管理区分に基づく候補を含み、要確認と重複します。社名一致だけで企業を統合しません。連絡先の登録は到達性・連絡許可の確認とは別です。</p>
 <section id="lc-bulk" class="lc-bulk" hidden aria-label="選択企業の下書きを更新"><strong id="lc-selected"></strong><label>担当<input id="lc-bulk-owner" maxlength="80" placeholder="変更しない"></label><label>次回予定<input id="lc-bulk-date" type="date"></label><label>次の対応<input id="lc-bulk-action" maxlength="200" placeholder="変更しない"></label><button type="button" id="lc-bulk-save">下書きに反映</button><button type="button" id="lc-clear">選択解除</button></section>
</main>
<dialog id="lc-dialog" aria-labelledby="lc-detail-title"><div class="lc-dialog-head"><div><small>企業情報・営業アクション・履歴 ｜ 確認用プレビュー</small><h2 id="lc-detail-title"></h2></div><button type="button" id="lc-close">閉じる</button></div><div id="lc-detail"></div></dialog>
<script src="../js/api-client.js?v=20261030officeactions1"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/sales-layout.js?v=20261104sameui"></script>
<script type="module" src="../js/sales-company-segments.js?v=20261105oneclick"></script>
</body></html>
