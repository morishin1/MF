<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>ダッシュボード - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260927-sales4">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }

    /* いちばん上の件数。押すとその段へ飛ぶ */
    .db-sum { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:22px; }
    .db-sum a { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:12px 14px; text-decoration:none; }
    .db-sum a.hot { background:#fff4d6; border-color:#e0a100; border-width:2px; }
    .db-sum .lb { font-size:12px; color:#6b7080; font-weight:700; display:flex; align-items:center; gap:5px; }
    .db-sum a.hot .lb { color:#7d5a00; }
    .db-sum .lb .material-symbols-outlined { font-size:16px; }
    .db-sum .v { font-size:26px; font-weight:900; color:#1b2440; margin-top:2px; font-variant-numeric:tabular-nums; }
    .db-sum .v small { font-size:13px; font-weight:700; margin-left:2px; }

    .db-sec { margin-bottom:26px; }
    .db-sec-h { display:flex; align-items:baseline; gap:10px; margin:0 0 10px; }
    .db-sec-h .t { font-size:15px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:6px; }
    .db-sec-h .n { font-size:12px; color:#6b7080; }
    .db-sec-h a { margin-left:auto; font-size:12px; color:#4a5068; text-decoration:none; white-space:nowrap; }

    /* ① クリックあり・未対応 は、ほかより目立たせる */
    .db-click { background:#fff4d6; border:2px solid #e0a100; border-radius:12px; padding:14px 16px 16px; }
    .db-click .db-sec-h .t { color:#7d5a00; font-size:16px; }
    .db-click .sl-row { border-left-color:#e0a100; }
    .db-click .sl-row b { font-size:15px; }
    .db-more { font-size:12px; color:#6b7080; text-align:center; padding:4px 0 0; }
    .db-business { margin:0 0 26px; padding:18px; border:1px solid #dfe3ec; border-radius:14px; background:#f8f9fc; }
    .db-business-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
    .db-business-head h2 { margin:0; color:#1b2440; font-size:19px; }
    .db-business-head p { margin:3px 0 0; color:#6b7080; font-size:12px; }
    .db-business-head .db-csv { margin-left:auto; flex:0 0 auto; border:1px solid #cfd4df; background:#fff; color:#33405b; }
    .db-business-head .db-csv:disabled { opacity:.55; cursor:not-allowed; }
    .db-periods { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
    .db-periods button { min-height:36px; padding:6px 12px; border:1px solid #d9deea; border-radius:8px; color:#333d58; background:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
    .db-periods button[aria-pressed="true"] { border-color:#324772; background:#324772; color:#fff; }
    .db-range { display:flex; align-items:flex-end; flex-wrap:wrap; gap:10px; margin:0 0 12px; padding:12px; border:1px solid #e1e4ec; border-radius:9px; background:#fff; }
    .db-range[hidden] { display:none; }
    .db-range label { display:grid; gap:4px; color:#5e6577; font-size:12px; font-weight:700; }
    .db-range input { min-height:38px; padding:6px 9px; border:1px solid #cfd4df; border-radius:7px; font:inherit; font-size:14px; }
    .db-period-caption { margin:0 0 10px; color:#414a61; font-size:13px; font-weight:700; }
    .db-report-note { margin:8px 0 12px; padding:9px 11px; border-radius:8px; background:#fff7df; color:#6c5507; font-size:12px; }
    .db-report-note[hidden], .db-report-error[hidden] { display:none; }
    .db-report-error { margin:8px 0 12px; padding:10px 12px; border-radius:8px; background:#fff0f0; color:#8d2929; font-size:13px; }
    .db-kpis { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:9px; margin-bottom:17px; }
    .db-kpi { min-width:0; padding:12px; border:1px solid #e0e3eb; border-radius:10px; background:#fff; }
    .db-kpi .k { color:#626a7c; font-size:12px; font-weight:700; }
    .db-kpi .v { margin-top:2px; color:#1b2440; font-size:25px; font-weight:900; font-variant-numeric:tabular-nums; }
    .db-kpi .v small { margin-left:2px; font-size:13px; }
    .db-kpi .compare { min-height:18px; margin-top:3px; color:#747b8a; font-size:11px; }
    .db-kpi.target { border-color:#aab6d2; background:#f0f3fa; }
    .db-kpi.target .v { color:#334a78; }
    .db-report-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .db-report-card { min-width:0; padding:13px; border:1px solid #e0e3eb; border-radius:10px; background:#fff; }
    .db-report-card h3 { margin:0 0 9px; color:#29334d; font-size:14px; }
    .db-report-card h3 small { display:block; margin-top:2px; color:#7a8090; font-size:11px; font-weight:400; }
    .db-report-card ul { margin:0; padding-left:19px; color:#3c455b; font-size:12px; line-height:1.7; }
    .db-report-card li + li { margin-top:3px; }
    .db-report-card .empty { color:#777e8c; font-size:12px; }
    .db-report-card.full { grid-column:1/-1; }
    .db-report-table-wrap { overflow-x:auto; }
    .db-report-table { width:100%; border-collapse:collapse; font-size:12px; }
    .db-report-table th, .db-report-table td { padding:7px 8px; border-bottom:1px solid #edf0f4; text-align:left; white-space:nowrap; }
    .db-report-table th { color:#656c7b; font-size:11px; }
    .db-report-table td.num, .db-report-table th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .db-blast-tag { display:inline-block; margin-left:5px; padding:1px 6px; border-radius:999px; background:#fff0dc; color:#945510; font-size:10px; font-weight:700; }
    @media (max-width: 900px) { .db-kpis { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width: 760px) {
      .db-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .db-report-grid { grid-template-columns:1fr; }
      .db-report-card.full { grid-column:auto; }
      .db-business { padding:13px; }
      .db-business-head { flex-wrap:wrap; }
      .db-business-head .db-csv { margin-left:0; }
    }
    @media (max-width: 760px) { .db-sum { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="sl-title">ダッシュボード</h1>
  <p class="sl-sub">今日、どこを追って、どこに営業すればよいかが分かります。上から順に片付けてください。</p>

  <section class="db-business" aria-labelledby="db-business-title">
    <div class="db-business-head">
      <div>
        <h2 id="db-business-title">営業・マッチング全体KPI</h2>
        <p>Sales・ENGERの記録を集約し、実績の比較と次の行動を確認します。</p>
      </div>
      <button id="db-business-csv" class="btn btn-sm db-csv" type="button" disabled>CSV出力</button>
    </div>
    <nav id="db-periods" class="db-periods" aria-label="集計期間">
      <button type="button" data-period="today" aria-pressed="false">今日</button>
      <button type="button" data-period="yesterday" aria-pressed="false">昨日</button>
      <button type="button" data-period="this_week" aria-pressed="false">今週</button>
      <button type="button" data-period="last_week" aria-pressed="false">先週</button>
      <button type="button" data-period="this_month" aria-pressed="false">今月</button>
      <button type="button" data-period="last_month" aria-pressed="false">先月</button>
      <button type="button" data-period="last_30" aria-pressed="false">直近30日</button>
      <button type="button" data-period="custom" aria-pressed="false">期間指定</button>
    </nav>
    <form id="db-period-range" class="db-range" hidden>
      <label>開始日<input id="db-period-from" type="date" aria-label="集計期間の開始日"></label>
      <label>終了日<input id="db-period-to" type="date" aria-label="集計期間の終了日"></label>
      <button class="btn btn-primary btn-sm" type="submit">この期間で表示</button>
    </form>
    <p id="db-period-caption" class="db-period-caption" aria-live="polite">集計期間を読み込み中…</p>
    <div id="db-report-error" class="db-report-error" role="alert" hidden></div>
    <div id="db-report-note" class="db-report-note" hidden></div>
    <div id="db-business-content" aria-live="polite"><div class="sl-empty">集計中…</div></div>
  </section>

  <div class="db-sum" id="sum"></div>

  <div class="db-sec db-click" id="sec-click">
    <div class="db-sec-h"><span class="t">🔥 ① リード・未対応</span><span class="n" id="n-click"></span>
      <a href="/sales/leads.html">リード一覧</a></div>
    <div class="sl-rows" id="list-click"></div>
  </div>

  <div class="db-sec" id="sec-replied">
    <div class="db-sec-h"><span class="t">② 返信あり</span><span class="n" id="n-replied"></span></div>
    <div class="sl-rows" id="list-replied"></div>
  </div>

  <div class="db-sec" id="sec-follow">
    <div class="db-sec-h"><span class="t">③ 今日フォロー</span><span class="n" id="n-follow"></span></div>
    <div class="sl-rows" id="list-follow"></div>
  </div>

  <div class="db-sec" id="sec-attack">
    <div class="db-sec-h"><span class="t">④ 今日アタック</span><span class="n" id="n-attack"></span>
      <a href="/sales/attack.html">アタック画面へ</a></div>
    <div class="sl-rows" id="list-attack"></div>
  </div>

  <div class="db-sec" id="sec-history">
    <div class="db-sec-h"><span class="t">⑤ 最近の営業履歴</span>
      <a href="/sales/attack.html">送った履歴をすべて見る</a></div>
    <div style="overflow-x:auto;">
      <table class="sl-table">
        <thead><tr><th>送信日時</th><th>企業</th><th>提案サービス</th><th>担当</th><th>クリック</th></tr></thead>
        <tbody id="history"><tr><td colspan="5" class="empty">読み込み中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api-client.js?v=20261029pro2"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/sales-layout.js?v=20261019prop1"></script>
<script src="../js/sales-dashboard-report.js?v=20261029period1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = SalesLayout.esc;
  const { fmt, fmtDay, ago } = SalesLayout;

  let sections = {};
  let approaches = [];

  // 表示速度：
  //   ・企業の全件ではなく、4段の件数と上位だけを受け取る（GET /api/sales/companies?view=dashboard）。
  //     振り分けの決まりはサーバ（lib/sales-dashboard.js）に移した。決まりそのものは変えていない
  //   ・最近の営業履歴は、出す15件だけ取る
  //   ・枠（権限の確認）を待たずに取りにいき始める。2回目からは前回の内容をすぐ出し、裏で最新にする
  const KEY = "sales:dashboard";
  const fetchDashboard = () => Promise.all([
    API.salesDashboard(),
    API.listSalesApproaches(14, 15).catch(() => ({ approaches: [] })),
  ]).then(([dash, ap]) => ({ dash, ap }));
  API.warm(KEY, fetchDashboard, SalesLayout.allows);

  SalesLayout.init({ active: "dashboard" }).then((ctx) => { if (ctx) { load(); SalesDashboardReport.load(); } });

  async function load() {
    try {
      await API.swr(KEY, fetchDashboard, ({ dash, ap }) => {
        if (dash.notReady) {
          el("sum").innerHTML = `<div class="banner warn" style="grid-column:1/-1;"><span class="material-symbols-outlined">build</span>
            <div>${esc(dash.message)}</div></div>`;
          return;
        }
        sections = dash.sections || {};
        approaches = ap.approaches || [];
        render();
      });
    } catch (e) {
      el("sum").innerHTML = `<div class="banner err" style="grid-column:1/-1;"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  const go = (c) => `/sales/companies.html?id=${encodeURIComponent(c.id)}`;

  // 段の見た目と行き先。どの企業がどの段に入るかは、サーバ（lib/sales-dashboard.js）が決める
  const SECTIONS = [
    { key: "click", label: "リード・未対応", icon: "ads_click", hot: true, cta: "フォローする", href: go },
    { key: "replied", label: "返信あり", icon: "mark_email_read", cta: "返信対応", href: go },
    { key: "follow", label: "今日フォロー", icon: "call", cta: "対応する", href: go },
    { key: "attack", label: "今日アタック", icon: "send", cta: "フォームアタック",
      href: (c) => `/sales/companies.html?attack=${encodeURIComponent(c.id)}` },
  ];

  function render() {
    // 描き直すときは、変わったところだけ変える（API.morph。点滅させない）
    API.morph(el("sum"), SECTIONS.map((s) => {
      const n = sections[s.key]?.total || 0;
      return `<a href="#sec-${s.key}" class="${s.hot && n ? "hot" : ""}">
        <div class="lb"><span class="material-symbols-outlined">${s.icon}</span>${esc(s.label)}</div>
        <div class="v">${n}<small>社</small></div></a>`;
    }).join(""));

    for (const s of SECTIONS) renderSection(s, sections[s.key] || { total: 0, rows: [] });
    renderHistory();
  }

  function renderSection(s, { total, rows }) {
    el(`n-${s.key}`).textContent = `${total}社`;
    if (!total) {
      API.morph(el(`list-${s.key}`), `<div class="sl-empty">${esc(s.label)}の企業はありません</div>`);
      return;
    }
    API.morph(el(`list-${s.key}`), rows.map((c) => `
      <div class="sl-row${c.unhandledClick ? " hot" : ""}${c.overdue ? " overdue" : ""}">
        <div class="info"><b>${esc(c.name)}</b>
          <div class="now">${s.key === "click"
            ? `最終クリック ${esc(fmt(c.lastClickAt))}（${esc(ago(c.lastClickAt))}・${c.clickCount}回）／ 送信 ${esc(fmt(c.lastSentAt) || "—")}${c.lastService ? ` ／ ${esc(c.lastService)}` : ""}`
            : `現在：${esc(c.statusLabel)}${c.service ? ` ／ ${esc(c.service)}` : ""}${c.lastSentAt ? ` ／ 最終アタック ${esc(fmt(c.lastSentAt))}` : ""}`}</div>
          <div class="n">NEXT：${esc(c.next)}${c.nextDue ? `（${esc(fmtDay(c.nextDue))}${c.overdue ? "・期限超過" : ""}）` : ""}　担当：${esc(c.ownerName || "未定")}</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="location.href='${esc(s.href(c))}'">${esc(s.cta)}</button>
      </div>`).join("")
      + (total > rows.length ? `<div class="db-more">ほか${total - rows.length}社</div>` : ""));
  }

  function renderHistory() {
    if (!approaches.length) {
      API.morph(el("history"), `<tr><td colspan="5" class="empty">直近14日の送信はありません。</td></tr>`);
      return;
    }
    API.morph(el("history"), approaches.slice(0, 15).map((a) => `
      <tr class="click" onclick="location.href='/sales/companies.html?id=${esc(a.companyId)}'">
        <td style="white-space:nowrap;">${esc(fmt(a.sentAt))}</td>
        <td><span class="sl-nm">${esc(a.companyName || "—")}</span></td>
        <td>${esc(a.service || "—")}</td>
        <td>${esc(a.employeeName || "—")}</td>
        <td>${a.clickCount ? `<span class="sl-hot">${a.clickCount}回</span>` : "—"}</td>
      </tr>`).join(""));
  }
</script>

</body>
</html>
