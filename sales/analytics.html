<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>分析 - EIGHT SALES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260927-sales4">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    /* 表は受注額の3列を足して8列になったので、1段に1つ（横幅いっぱい）にする。数字は折り返さない */
    .an-grid { display:grid; grid-template-columns:1fr; gap:22px; }
    .an-grid .sl-table td.num, .an-grid .sl-table th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .an-grid .sl-table td:first-child { min-width:9em; }
    .an-grid .sl-table td.key, .an-grid .sl-table th.key { background:#f8f9fc; font-weight:700; }
    .an-links { display:flex; gap:14px; font-size:12px; margin:-8px 0 18px; }
    .an-links a { color:#4a5068; }

    /* 上部ファネル：アイコン＋四角いマスの6枚（アタック・クリック・返信・商談・成約・受注額）。
       数字を主役にし、率は「分子 / 分母」つきで下に小さく。押すと対象の企業・案件を右に出す */
    .an2-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; margin:0 0 14px; }
    .an2-card { background:#fff; border:1px solid #ececE6; border-radius:12px; padding:18px 10px 14px;
      display:flex; flex-direction:column; align-items:center; text-align:center; box-sizing:border-box;
      justify-content:flex-start; min-height:112px; cursor:pointer; font-family:inherit; color:inherit; }
    .an2-card:hover { border-color:#c7cadb; box-shadow:0 4px 14px rgba(27,36,64,.08); }
    .an2-card .ic { width:26px; height:26px; border-radius:7px; background:#f3f3ef;
      display:flex; align-items:center; justify-content:center; margin-bottom:9px; }
    .an2-card .ic .material-symbols-outlined { font-size:15px; color:#9aa0b4; }
    .an2-card .v { font-size:27px; font-weight:900; color:#1b2440; font-variant-numeric:tabular-nums; line-height:1.1; white-space:nowrap; }
    .an2-card .v small { font-size:13px; font-weight:700; color:#6b7080; margin-left:1px; }
    .an2-card .l { font-size:11.5px; font-weight:700; color:#4a5068; margin-top:4px; }
    .an2-card .r { font-size:10.5px; color:#6b7080; margin-top:5px; font-variant-numeric:tabular-nums; }
    .an2-card .r.weak { color:#9aa0b4; }
    .an2-card.money .v { font-size:22px; }
    .an2-ref { display:inline-block; background:#fbf1d6; color:#7d5a00; border-radius:999px; padding:0 6px; font-size:9.5px; font-weight:700; margin-left:3px; }

    /* 見込額・パイプライン（いまの時点）を1行で */
    .an-money { display:flex; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid #ececE6; border-radius:12px;
      padding:12px 16px; margin:0 0 26px; font-size:12.5px; color:#4a5068; align-items:center; }
    .an-money .it { display:flex; align-items:baseline; gap:6px; padding-right:14px; border-right:1px solid #efefeb; }
    .an-money .it:last-of-type { border-right:none; }
    .an-money b { font-size:17px; color:#1b2440; font-variant-numeric:tabular-nums; }
    .an-money .n { font-size:11px; color:#9aa0b4; }
    .an-money .note { margin-left:auto; font-size:11px; color:#9aa0b4; }

    @media (max-width: 900px) { .an2-grid { grid-template-columns:repeat(3, 1fr); } }
    @media (max-width: 560px) {
      .an2-grid { grid-template-columns:repeat(2, 1fr); gap:10px; }
      .an2-card { min-height:104px; padding:16px 8px 12px; }
      .an-money .it { border-right:none; padding-right:0; width:100%; }
      .an-money .note { margin-left:0; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="sl-title">分析</h1>
  <p class="sl-sub">アタックから成約・受注までの流れと、どの文章・サービス・業種・担当が受注につながっているかです。</p>
  <div class="an-links">
    <a href="/sales/templates.html">テンプレート比較</a>
    <a href="/sales/campaigns.html">キャンペーン比較</a>
  </div>

  <div class="sl-toolbar"><div class="sl-tabs-pill" id="period"></div></div>

  <div id="kpi"><div class="sl-empty">読み込み中…</div></div>

  <div class="an-grid">
    <div><div class="sl-sec-h">送信チャネル別</div><div id="by-channel"></div></div>
    <div><div class="sl-sec-h">営業文別</div><div id="by-template"></div></div>
    <div><div class="sl-sec-h">サービス別</div><div id="by-service"></div></div>
    <div><div class="sl-sec-h">業種別</div><div id="by-industry"></div></div>
    <div><div class="sl-sec-h">担当者別</div><div id="by-employee"></div></div>
  </div>
</div>

<div id="drawer-root"></div>

<script src="../js/api-client.js?v=20261006ml1"></script>
<script src="../js/layout.js?v=20261006ml1"></script>
<script src="../js/sales-layout.js?v=20261006ml1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = SalesLayout.esc;
  const { fmt, fmtDay, statusPill } = SalesLayout;

  const PERIODS = [[30, "30日"], [90, "90日"], [365, "1年"]];
  const MIN_SAMPLE = 10;   // これ未満の分母は「参考値」
  const DEAL_OPEN = ["meeting", "proposal", "negotiation"];
  let days = 90;
  let approaches = [];
  let deals = [];
  let dealsReady = true;
  let dealsMsg = "";
  let dealsTruncated = false;   // 案件が5,000件を超え、一部を読めていない（API の truncated）
  let since = "";               // 期間の始まり（日本時間の YYYY-MM-DD）。API の since を使う
  let cohort = null;

  SalesLayout.init({ active: "analytics" }).then((ctx) => { if (ctx) load(); });

  async function load() {
    el("period").innerHTML = PERIODS.map(([d, l]) =>
      `<button class="${d === days ? "on" : ""}" onclick="setPeriod(${d})">${esc(l)}</button>`).join("");
    try {
      const [res, dl] = await Promise.all([
        API.listSalesApproaches(days),
        // 案件（db/116）がまだ無くても、活動の分析は出す
        API.listSalesDeals().catch((e) => ({ failed: true, notReady: e.code === "not_ready", error: e })),
      ]);
      if (res.notReady) {
        el("kpi").innerHTML = `<div class="banner warn"><span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div>`;
        return;
      }
      approaches = res.approaches || [];
      since = res.since || periodStartJst(days);
      dealsReady = !dl.failed;
      dealsTruncated = dealsReady && dl.truncated === true;
      dealsMsg = dl.failed ? (dl.notReady
        ? "案件（金額・段階）の表がまだありません。管理者に db/116_sales_deals.sql の実行を依頼すると、受注額・見込額が出ます。"
        : `案件を取得できませんでした：${dl.error?.hint || dl.error?.message || ""}（活動の数字は出ています）`) : "";
      deals = dealsReady ? dl.deals || [] : [];
      render();
    } catch (e) {
      el("kpi").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  function setPeriod(d) { days = d; load(); }

  // 「直近 days 日」の始まり（日本時間。今日を1日目に数える）。lib/sales.js periodStartJst と同じ。
  // API が since を返さない古い版のときだけ使う
  function periodStartJst(n) {
    const d = new Date(`${new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10)}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() - (Math.max(1, Math.floor(n)) - 1));
    return d.toISOString().slice(0, 10);
  }

  const yen = (n) => `¥${Math.round(n || 0).toLocaleString("ja-JP")}`;
  const man = (n) => {                      // 表で使う短い金額（「120万円」「3.4万円」「8,000円」）
    n = Math.round(n || 0);
    if (n < 10000) return `${n.toLocaleString("ja-JP")}円`;
    const m = n / 10000;
    return m >= 100 ? `${Math.round(m).toLocaleString("ja-JP")}万円` : `${Math.round(m * 10) / 10}万円`;
  };
  const pct = (n, d) => (d ? `${Math.round((n / d) * 1000) / 10}%` : "—");
  const expectedOf = (d) => (DEAL_OPEN.includes(d.stage) && d.amount != null ? d.expected || 0 : 0);

  // 会社がどこまで進んだか。今のステータスだけでなく、案件の有無も見る
  // （失注した会社も、商談まで進んだなら商談に数える。後ろまで進んだ会社は前の段階も通ったものとする）
  const RANK = { attacked: 1, clicked: 2, replied: 3, meeting: 4, proposal: 5, won: 6 };
  function levelOf(c) {
    let lv = RANK[c.status] || 0;
    if (c.clicked) lv = Math.max(lv, 2);
    if (c.deals.length) lv = Math.max(lv, 4);
    if (c.deals.some((d) => d.stage === "won")) lv = Math.max(lv, 6);
    return lv;
  }

  /** 期間内にアタックした会社（会社単位）と、その会社の案件 */
  function companiesOf(list) {
    const dealsBy = new Map();
    for (const d of deals) {
      if (!dealsBy.has(d.companyId)) dealsBy.set(d.companyId, []);
      dealsBy.get(d.companyId).push(d);
    }
    const cos = new Map();
    for (const a of list) {
      const c = cos.get(a.companyId) || { id: a.companyId, name: a.companyName, status: a.companyStatus, clicked: false,
        first: a, deals: dealsBy.get(a.companyId) || [] };
      if (a.clickCount > 0) c.clicked = true;
      if (a.sentAt < c.first.sentAt) c.first = a;
      cos.set(a.companyId, c);
    }
    return [...cos.values()].map((c) => ({ ...c, level: levelOf(c) }));
  }

  /**
   * 表の1行ぶん（要因分析）。案件は、もとのアタック（approachId）がこの行のアタックに入っているものだけ。
   * ＝「この期間に送ったアタックから、あとでいくら受注したか」（attribution）。上部の受注額（成約日で数える）とは別
   */
  function stats(list) {
    const cos = companiesOf(list);
    const ids = new Set(list.map((a) => a.id));
    const ds = deals.filter((d) => d.approachId && ids.has(d.approachId));
    const revenue = ds.filter((d) => d.stage === "won").reduce((s, d) => s + (d.amount || 0), 0);
    const forecast = ds.reduce((s, d) => s + expectedOf(d), 0);
    return {
      attacks: list.length,
      companies: cos.length,
      clickedAttacks: list.filter((a) => a.clickCount > 0).length,
      replied: cos.filter((c) => c.level >= 3).length,
      meeting: cos.filter((c) => c.level >= 4).length,
      revenue, forecast,
      fpa: list.length ? forecast / list.length : 0,
    };
  }

  function render() {
    renderKpi();
    // 送信チャネル別（フォーム・メール・Instagram・X …）。返信率・商談化率は会社単位で数える
    table("by-channel", (a) => a.channelLabel || "お問い合わせフォーム");
    table("by-template", (a) => a.templateName || "（テンプレートなし）");
    table("by-service", (a) => a.service || "（未設定）");
    table("by-industry", (a) => a.industry || "（未設定）");
    table("by-employee", (a) => a.employeeName || "（不明）", true);
  }

  // ---- 上部：6枚のファネル ＋ 見込額・パイプライン -------------------------------------------
  //
  // ■ 受注額（6枚目）＝ 選んだ期間に成約日（won_on）がある成約案件の金額の合計。
  //   会計上の売上ではなく、案件の成約金額。「その期間にアタックした会社があとでいくら成約したか」は
  //   下の表（要因分析）で見る。上部のKPIには混ぜない
  function renderKpi() {
    const cos = companiesOf(approaches);
    const reach = (lv) => cos.filter((c) => c.level >= lv);
    const clicked = reach(2), replied = reach(3), meeting = reach(4), won = reach(6);
    const cohortDeals = cos.flatMap((c) => c.deals);
    // 期間の始まり（日本時間の日付。アタックの期間と同じ日）。won_on はこの日以降のもの
    const wonDeals = deals.filter((d) => d.stage === "won" && d.wonOn && d.wonOn >= since)
      .sort((a, b) => String(b.wonOn).localeCompare(String(a.wonOn)));
    const orders = wonDeals.reduce((s, d) => s + (d.amount || 0), 0);
    cohort = { cos, clicked, replied, meeting, won, cohortDeals, wonDeals };

    const rate = (n, d) => (d ? `<div class="r ${d < MIN_SAMPLE ? "weak" : ""}">${esc(pct(n, d))}（${n} / ${d}）${d < MIN_SAMPLE
      ? `<span class="an2-ref" title="母数が10件未満のため、傾向判断にはまだ十分ではありません">参考値</span>` : ""}</div>` : "");
    const card = (key, icon, label, value, unit, extra = "", cls = "") => `
      <button class="an2-card ${cls}" onclick="openTile('${key}')" aria-label="${esc(label)}の内訳を見る">
        <div class="ic"><span class="material-symbols-outlined">${icon}</span></div>
        <div class="v">${value}${unit ? `<small>${esc(unit)}</small>` : ""}</div>
        <div class="l">${esc(label)}</div>${extra}
      </button>`;

    // いまの時点の見込額・パイプライン
    const openDeals = deals.filter((d) => DEAL_OPEN.includes(d.stage));
    const forecast = openDeals.reduce((s, d) => s + expectedOf(d), 0);
    const pipeline = openDeals.reduce((s, d) => s + (d.amount || 0), 0);
    const noAmount = openDeals.filter((d) => d.amount == null).length;

    // 案件が5,000件を超えると、APIは新しい順に5,000件までしか返さない。黙って小さい数字を出さない
    const truncBanner = dealsTruncated ? `<div class="banner warn" id="deals-truncated" style="margin:0 0 14px;">
        <span class="material-symbols-outlined">warning</span>
        <div>案件が5,000件を超えているため、新しい順に5,000件だけで集計しています（5,000件超で集計が一部省略されています）。
        受注額・見込額・パイプライン・表の金額は、実際より小さく出ている可能性があります。</div></div>` : "";

    el("kpi").innerHTML = `${truncBanner}<div class="an2-grid" id="funnel">
        ${card("attack", "send", "アタック", cos.length, "社")}
        ${card("click", "ads_click", "クリック", clicked.length, "社", rate(clicked.length, cos.length))}
        ${card("reply", "mail", "返信", replied.length, "社", rate(replied.length, clicked.length))}
        ${card("meeting", "handshake", "商談", meeting.length, "社",
          (rate(meeting.length, replied.length) || "") + (cohortDeals.length ? `<div class="r">${cohortDeals.length}案件</div>` : ""))}
        ${card("won", "paid", "成約", won.length, "社", rate(won.length, meeting.length))}
        ${card("revenue", "payments", "受注額", dealsReady ? esc(yen(orders)) : "—", "",
          `<div class="r">${dealsReady ? `成約日が期間内の ${wonDeals.length}案件` : "案件を取得できません"}</div>`, "money")}
      </div>
      ${dealsReady ? `<div class="an-money">
        <span class="it">見込額 <b>${esc(yen(forecast))}</b><span class="n">進行中 ${openDeals.length}案件</span></span>
        <span class="it">パイプライン <b>${esc(yen(pipeline))}</b><span class="n">確率を掛ける前</span></span>
        <span class="note">受注額＝成約日が期間内の成約案件の金額（会計上の売上ではありません）／見込額＝進行中の案件の 金額×成約確率（商談20%・提案50%・最終調整80%。個別の設定を優先）${noAmount ? `／金額未定 ${noAmount}件は0円で数えています` : ""}</span>
      </div>` : `<div class="banner warn" style="margin:0 0 26px;"><span class="material-symbols-outlined">build</span>
        <div>${esc(dealsMsg)}</div></div>`}
      <p class="sl-muted" style="margin:-14px 0 22px;">期間：${esc(since)} 〜 今日（日本時間）。アタック〜成約：直近${days}日に送ったアタック ${approaches.length}件（${cos.length}社）が対象。社数は会社単位、率は1つ前のマスに対する割合です。受注額：直近${days}日に成約した案件です。</p>`;
  }

  // ---- マスを押したときの内訳（右ドロワー） ---------------------------------------------------
  const DEAL_PILL = { meeting: "attacked", proposal: "proposal", negotiation: "clicked", won: "won", lost: "lost" };
  function openTile(key) {
    if (!cohort) return;
    const coRows = (list, note) => `<p class="sl-muted" style="margin:-8px 0 12px;">${esc(note)}</p>` + (list.length
      ? `<table class="sl-table"><thead><tr><th>企業</th><th>最初の送信</th><th>営業文・チャネル</th><th>いま</th></tr></thead><tbody>${list
          .sort((a, b) => String(b.first.sentAt).localeCompare(String(a.first.sentAt))).slice(0, 200).map((c) => `
          <tr class="click" onclick="location.href='/sales/companies.html?id=${encodeURIComponent(c.id)}'">
            <td><span class="sl-nm">${esc(c.name || "（名称なし）")}</span></td>
            <td>${esc(fmt(c.first.sentAt))}</td>
            <td>${esc(c.first.templateName || "—")}<span class="sl-sub2">${esc(c.first.channelLabel || "")}・${esc(c.first.employeeName || "")}</span></td>
            <td>${c.status ? statusPill(c.status, "") : ""}${c.deals.length ? `<span class="sl-sub2">案件 ${c.deals.length}件</span>` : ""}</td>
          </tr>`).join("")}</tbody></table>${list.length > 200 ? `<p class="sl-muted">ほか ${list.length - 200}社</p>` : ""}`
      : `<div class="sl-empty">対象の企業はありません</div>`);
    const dealRows = (list, note) => `<p class="sl-muted" style="margin:-8px 0 12px;">${esc(note)}</p>` + (list.length
      ? `<table class="sl-table"><thead><tr><th>企業・案件</th><th>段階</th><th class="num">金額</th><th>日付</th></tr></thead><tbody>${list.map((d) => `
          <tr class="click" onclick="location.href='/sales/companies.html?id=${encodeURIComponent(d.companyId)}'">
            <td><span class="sl-nm">${esc(d.companyName || cohort.cos.find((c) => c.id === d.companyId)?.name || "")}</span><span class="sl-sub2">${esc(d.title)}</span></td>
            <td>${statusPill(DEAL_PILL[d.stage] || "attacked", d.stageLabel)}</td>
            <td class="num">${d.amount == null ? "未定" : esc(yen(d.amount))}</td>
            <td>${esc(fmtDay(d.wonOn || d.lostOn || String(d.createdAt).slice(0, 10)))}</td></tr>`).join("")}</tbody></table>`
      : `<div class="sl-empty">${dealsReady ? "対象の案件はありません" : "案件の表がまだありません（db/116）"}</div>`);
    const T = {
      attack: ["アタックした企業", () => coRows(cohort.cos, `直近${days}日にアタックした会社です（1社に複数回送っても1社）`)],
      click: ["クリックした企業", () => coRows(cohort.clicked, "専用URLをクリックした会社（返信・商談まで進んだ会社を含む）")],
      reply: ["返信があった企業", () => coRows(cohort.replied, "返信があった会社（商談まで進んだ会社を含む）")],
      meeting: ["商談した企業", () => coRows(cohort.meeting, "商談まで進んだ会社（案件がある会社を含む。失注した会社も数えます）")],
      won: ["成約した企業", () => coRows(cohort.won, "成約した会社")],
      revenue: ["受注額の内訳", () => dealRows(cohort.wonDeals, `成約日が直近${days}日以内の成約案件です（いつアタックした会社かは問いません）`)],
    };
    const [title, body] = T[key] || [];
    if (!title) return;
    el("drawer-root").innerHTML = `<div class="sl-drawer-bg" onclick="closeDrawer()"></div>
      <div class="sl-drawer" role="dialog" aria-label="${esc(title)}" style="width:620px;">
        <h2>${esc(title)}</h2>${body()}
        <div style="margin-top:14px;"><button class="btn btn-secondary btn-sm" onclick="closeDrawer()">閉じる</button></div></div>`;
  }
  function closeDrawer() { el("drawer-root").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  // ---- 軸別の表（これまでの列に 受注額・見込額・1アタック見込額 を足す） ------------------
  //   要因分析なので、受注額は「この期間に送ったアタックから生まれた案件」（もとのアタック）で数える
  function table(id, keyOf, byPerson) {
    const groups = new Map();
    for (const a of approaches) {
      const k = keyOf(a);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(a);
    }
    if (!groups.size) { el(id).innerHTML = `<div class="sl-empty">まだデータがありません</div>`; return; }
    const rows = [...groups.entries()].map(([k, list]) => ({ k, s: stats(list) }))
      .sort((x, y) => y.s.attacks - x.s.attacks);
    const money = (v) => (dealsReady ? esc(man(v)) : "—");
    el(id).innerHTML = `<div style="overflow-x:auto;"><table class="sl-table">
      <thead><tr><th>${byPerson ? "担当" : "項目"}</th><th class="num">アタック数</th><th class="num">クリック率</th>
        <th class="num">返信率</th><th class="num">商談化率</th><th class="num" title="この期間のアタックから生まれ、成約した案件の金額">受注額</th><th class="num">見込額</th>
        <th class="num key" title="見込額 ÷ アタック数">1アタック見込額</th></tr></thead>
      <tbody>${rows.map(({ k, s }) => `<tr>
        <td>${esc(k)}</td><td class="num">${s.attacks}</td>
        <td class="num">${esc(pct(s.clickedAttacks, s.attacks))}</td>
        <td class="num">${esc(pct(s.replied, s.companies))}</td>
        <td class="num">${esc(pct(s.meeting, s.companies))}</td>
        <td class="num">${money(s.revenue)}</td>
        <td class="num">${money(s.forecast)}</td>
        <td class="num key">${money(s.fpa)}</td></tr>`).join("")}</tbody></table></div>`;
  }
</script>

</body>
</html>
