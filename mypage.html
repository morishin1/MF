<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910w">
  <link rel="stylesheet" href="css/layout.css?v=20260910w">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">マイページ</h1>
  <p class="kp-greet-sub">
    自分のことは、ここにまとまっています。労働条件・提出した情報・3か月の目標・評価の記録。
  </p>

  <div class="card">
    <h2><span class="material-symbols-outlined">badge</span>登録情報</h2>
    <div id="profile"><div class="empty">読み込み中…</div></div>
    <p class="muted" style="font-size:12.5px;margin:14px 0 0;">
      氏名・所属・雇用区分の変更は管理部が行います。誤りがあれば連絡してください。
    </p>
  </div>

  <!-- 労働条件。入社時に登録されたもの。本人が読めるようにしておく -->
  <div id="cond-card" class="card hidden">
    <h2><span class="material-symbols-outlined">description</span>労働条件</h2>
    <div id="cond"></div>
    <p class="muted" style="font-size:12.5px;margin:14px 0 0;">
      内容の変更は会社と本人の合意で行います。違いがあれば管理担当者にお知らせください。
    </p>
  </div>

  <!-- 入社時に自分が出した情報と、確認したこと -->
  <div id="ob-card" class="card hidden">
    <h2><span class="material-symbols-outlined">how_to_reg</span>入社時に提出した情報
      <span id="ob-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
    <div id="ob"></div>
  </div>

  <!-- 3か月の目標と、月ごとのKGI/KPI -->
  <div id="goal-card" class="card hidden">
    <h2><span class="material-symbols-outlined">flag</span>3か月の目標</h2>
    <div id="goal"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">key</span>パスワードの変更</h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px;">
      会社から渡された初回パスワードのままの場合は、ここで自分だけが知っているものに変えてください。
    </p>

    <div style="max-width:360px;">
      <div style="margin-bottom:12px;">
        <label>新しいパスワード（8文字以上）</label>
        <input id="pw1" type="password" autocomplete="new-password" placeholder="••••••••">
      </div>
      <div style="margin-bottom:16px;">
        <label>確認のためもう一度</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••">
      </div>
      <button id="save" class="btn btn-primary" onclick="save()">
        <span class="material-symbols-outlined icon-inline">save</span>変更する
      </button>
      <div id="msg" class="err-text"></div>
    </div>
  </div>
</div>

<script src="js/api-client.js?v=20260910w"></script>
<script src="js/layout.js?v=20260910w"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const ROLE_JA = { owner: "経営者", hr: "人事", manager: "責任者", labor_advisor: "社労士" };
  const STATUS_JA = { invited: "入社準備", active: "メンバー", leaving: "退職手続き中", left: "退職" };

  KPLayout.init({ active: "mypage", roles: ["member", "admin", "owner", "sr"] })
    .then((ctx) => { if (ctx) { render(ctx); loadMine(); } });

  function render(ctx) {
    const e = ctx.me?.gw?.employee;
    const rows = [
      ["メールアドレス", ctx.me?.email || "—"],
      ["氏名", e?.display_name || "（社員名簿に未登録）"],
      ["部署", e?.department || "—"],
      ["役職", e?.position || "—"],
      ["雇用区分", e?.employment_type || "—"],
      ["入社日", e?.joined_on ? new Date(e.joined_on).toLocaleDateString("ja-JP") : "—"],
      ["在籍状態", e ? (STATUS_JA[e.status] || e.status) : "—"],
      ["社内権限", (ctx.me?.gw?.roles || []).map((r) => ROLE_JA[r] || r).join("、") || "（なし）"],
    ];
    el("profile").innerHTML = `
      <div class="table-scroll">
        <table class="kp-items">
          <tbody>${rows.map(([k, v]) => `
            <tr><td style="width:130px;color:var(--muted);">${esc(k)}</td><td>${esc(v)}</td></tr>
          `).join("")}</tbody>
        </table>
      </div>`;
  }

  // 入社手続きが終わったあとも、出した内容と確認したことはここで読める。
  // 「やること」からは消えるので、あとから見返す場所が必要になる
  async function loadMine() {
    const [ob, plan] = await Promise.all([
      API.myOnboarding().catch(() => null),
      API.myGrowthPlan().catch(() => null),
    ]);

    if (ob) {
      renderConditions(ob.known || {});
      renderOnboard(ob);
    }
    if (plan) renderGoal(plan);
  }

  function renderConditions(k) {
    const rows = [
      ["入社日", k.joinedOn],
      ["雇用区分", k.employmentType],
      ["契約", k.contract],
      ["試用期間", k.probation],
      ["週の勤務時間", k.weeklyHours != null ? `${k.weeklyHours} 時間` : null],
      ["勤務形態", k.workStyle],
      ["担当", k.role],
      ["業務範囲", (k.workScope || []).join("、") || null],
      ["給与", k.wage],
      ["相談先", k.manager],
    ].filter(([, v]) => v);
    if (!rows.length) return;

    el("cond-card").classList.remove("hidden");
    el("cond").innerHTML = `
      <div class="table-scroll"><table class="kp-items"><tbody>
        ${rows.map(([a, b]) => `
          <tr><td style="width:130px;color:var(--muted);">${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  function renderOnboard(ob) {
    const pf = ob.profile;
    const agreed = (ob.consents || []).filter((c) => c.agreed);
    if (!pf && !agreed.length) return;

    el("ob-card").classList.remove("hidden");
    const sent = ob.profileStatus === "submitted";
    el("ob-tag").textContent = sent ? "提出済み" : "記入中";
    el("ob-tag").className = `kp-chip ${sent ? "event" : "draft"}`;

    // 口座番号は伏せる。自分の画面でも、肩越しに見えるところで出す必要がない
    const masked = pf?.bank_number
      ? `${"*".repeat(Math.max(0, String(pf.bank_number).length - 2))}${String(pf.bank_number).slice(-2)}`
      : null;
    const rows = pf ? [
      ["氏名（カナ）", pf.name_kana],
      ["住所", [pf.postal_code ? `〒${pf.postal_code}` : "", pf.address].filter(Boolean).join(" ")],
      ["電話番号", pf.phone],
      ["緊急連絡先", [pf.emg_name, pf.emg_relation ? `（${pf.emg_relation}）` : "", pf.emg_phone].filter(Boolean).join(" ")],
      ["振込先", [pf.bank_name, pf.bank_branch, pf.bank_type, masked].filter(Boolean).join(" ")],
    ].filter(([, v]) => v) : [];

    el("ob").innerHTML = `
      ${rows.length ? `<div class="table-scroll"><table class="kp-items"><tbody>
        ${rows.map(([a, b]) => `
          <tr><td style="width:130px;color:var(--muted);">${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
      ${agreed.length ? `
        <div style="margin-top:14px;">
          <div class="muted" style="font-size:11.5px;font-weight:700;margin-bottom:6px;">確認したこと</div>
          ${agreed.map((c) => `
            <div style="font-size:13px;padding:5px 0;">
              <span class="material-symbols-outlined"
                    style="font-size:15px;vertical-align:-3px;color:#2f855a;">check_circle</span>
              ${esc(c.label)}
            </div>`).join("")}
        </div>` : ""}
      <div style="margin-top:14px;">
        <a class="btn btn-secondary btn-sm" href="onboarding.html">内容を見る・書き直す</a>
      </div>`;
  }

  function renderGoal(p) {
    const plan = p.plan || p;
    if (!plan?.threeMonthKgi && !(plan?.months || []).length) return;
    el("goal-card").classList.remove("hidden");
    el("goal").innerHTML = `
      ${plan.threeMonthKgi ? `
        <div style="font-size:15px;font-weight:700;line-height:1.7;margin-bottom:14px;">
          ${esc(plan.threeMonthKgi)}</div>` : ""}
      ${(plan.months || []).map((m) => `
        <div style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;">
          <div style="font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--primary);">
            MONTH ${m.month_no ?? m.monthNo ?? ""}</div>
          <div style="font-size:13.5px;font-weight:600;margin:3px 0 8px;line-height:1.7;">${esc(m.kgi || "")}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${(m.kpis || []).map((k) => `
              <span style="font-size:11.5px;border:1px solid var(--border);border-radius:6px;
                           padding:3px 9px;color:var(--muted);">
                ${esc(k.name)} ${k.target_value ?? "—"}${esc(k.unit || "")}</span>`).join("")}
          </div>
        </div>`).join("")}`;
  }

  async function save() {
    const msg = el("msg");
    msg.textContent = "";
    const p1 = el("pw1").value;
    const p2 = el("pw2").value;

    if (p1.length < 8) { msg.textContent = "8文字以上にしてください"; return; }
    if (p1 !== p2) { msg.textContent = "2つの入力が一致していません"; return; }

    try {
      await KPLayout.busy(el("save"), "変更中…", () => API.changePassword(p1));
      el("pw1").value = "";
      el("pw2").value = "";
      msg.style.color = "var(--primary-dark)";
      msg.textContent = "パスワードを変更しました。次回のログインから新しいパスワードを使ってください。";
    } catch (e) {
      msg.style.color = "";
      msg.textContent = e.message || "変更できませんでした";
    }
  }
</script>

</body>
</html>
