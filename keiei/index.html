<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>経営 - EIGHT</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260929c">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.kei-title { font-size:22px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .kei-sub { color:#6b7080; font-size:12.5px; margin:0 0 20px; line-height:1.7; }
    .kei-h { font-size:14px; font-weight:700; color:#1b2440; margin:24px 0 10px; }
    .kei-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
    .kei-card { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 15px; display:block;
                text-decoration:none; color:inherit; }
    .kei-grid.sm { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
    a.kei-card:hover { border-color:#b8bccb; }
    .kei-card .lb { font-size:12px; color:#6b7080; display:flex; align-items:center; gap:6px; justify-content:space-between; }
    .kei-card .val { font-size:24px; font-weight:700; color:#1b2440; margin:6px 0 2px; letter-spacing:.01em; }
    .kei-card .val small { font-size:12px; font-weight:500; color:#6b7080; margin-left:2px; }
    .kei-card .sub { font-size:11.5px; color:#6b7080; line-height:1.6; }
    .kei-card .nt { font-size:11px; color:#9aa0b4; margin-top:6px; line-height:1.6; }
    .kei-card.miss { background:#fafaf7; border-style:dashed; }
    .kei-missing { font-size:15px; font-weight:700; color:#9aa0b4; margin:8px 0 4px; }
    .kei-pill { display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; white-space:nowrap; }
    .kei-pill.prov { background:#fff2d6; color:#8a5a00; }
    .kei-pill.miss { background:#ecece6; color:#6b7080; }
    .kei-banner { background:#fff; border:1px solid #e2e2dc; border-left:3px solid #e6f050; border-radius:8px; padding:11px 14px;
                  font-size:12.5px; color:#4a5068; line-height:1.8; margin:0 0 16px; }
    .kei-banner.warn { border-left-color:#e0a030; background:#fffaf0; }
    .kei-banner.err { border-left-color:#b3261e; background:#fff5f4; }
    .kei-panel { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:16px; margin-bottom:14px; overflow-x:auto; }
    table.kei-t { border-collapse:collapse; width:100%; font-size:13px; }
    table.kei-t th { text-align:left; font-size:11.5px; color:#6b7080; font-weight:500; padding:6px 8px; border-bottom:1px solid #e2e2dc; white-space:nowrap; }
    table.kei-t td { padding:8px; border-bottom:1px solid #f0f0ea; vertical-align:top; }
    table.kei-t td.n, table.kei-t th.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    table.kei-t tr.dim td { color:#9aa0b4; }
    .kei-bars { display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:8px; }
    .kei-bar-col { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
    .kei-bar-col .bar { width:100%; max-width:34px; background:#1b2440; border-radius:4px 4px 0 0; min-height:2px; }
    .kei-bar-col .bar.pend { background:#c7cad4; }
    .kei-bar-col .ml { font-size:10px; color:#9aa0b4; margin-top:4px; white-space:nowrap; }
    .kei-bar-col .mv { font-size:9.5px; color:#6b7080; margin-bottom:2px; white-space:nowrap; }
    .kei-prog { height:8px; background:#ecece6; border-radius:999px; overflow:hidden; }
    .kei-prog > i { display:block; height:100%; background:#1b2440; }
    .kei-row { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px; }
    .kei-row .nm { flex:0 0 120px; color:#4a5068; }
    .kei-row .pg { flex:1; }
    .kei-row .n { flex:0 0 40px; text-align:right; color:#1b2440; font-weight:700; }
    .kei-btn { display:inline-block; background:#1b2440; color:#fff; border-radius:7px; padding:8px 14px; font-size:12.5px;
               font-weight:700; text-decoration:none; margin:4px 8px 4px 0; }
    .kei-btn.sec { background:#fff; color:#1b2440; border:1px solid #c7cad4; }
    .kei-empty { color:#9aa0b4; font-size:12.5px; padding:6px 0; }
    /* 入社準備（6ステップ） */
    .kei-ob { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 15px; margin-bottom:12px; }
    .kei-ob-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .kei-ob-h .nm { font-size:15px; font-weight:700; color:#1b2440; }
    .kei-ob-h .mt { font-size:12px; color:#6b7080; }
    .kei-ob-h .sp { flex:1; }
    .kei-next { display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .kei-next.red { background:#fdeceb; color:#b3261e; }
    .kei-next.yellow { background:#fff2d6; color:#8a5a00; }
    .kei-next.green { background:#e3f4e7; color:#1f6f3a; }
    .kei-next.gray { background:#ecece6; color:#6b7080; }
    .kei-six { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; }
    .kei-st { border:1px solid #e2e2dc; border-radius:8px; padding:9px 10px; font-size:12px; line-height:1.6; min-width:0; }
    .kei-st .t { font-weight:700; color:#1b2440; display:flex; gap:6px; align-items:baseline; }
    .kei-st .g { font-weight:900; }
    .kei-st .nt { color:#6b7080; margin-top:2px; word-break:break-all; }
    .kei-st .who { color:#8a5a00; font-size:11px; margin-top:2px; }
    .kei-st a { display:inline-block; margin-top:4px; font-size:11.5px; font-weight:700; color:#1b2440; }
    .kei-st.done { background:#f3faf5; border-color:#cfe8d6; } .kei-st.done .g { color:#1f8a4c; }
    .kei-st.current { background:#fffaf0; border-color:#e8c977; } .kei-st.current .g { color:#c07a00; }
    .kei-st.todo .g { color:#9aa0b4; } .kei-st.todo .t { color:#6b7080; }
    .kei-st.unlinked { background:#fafaf7; border-style:dashed; } .kei-st.unlinked .g, .kei-st.unlinked .t { color:#9aa0b4; }
    @media (max-width: 820px) { .kei-six { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .kei-after { font-size:12px; color:#6b7080; margin-top:8px; } .kei-after a { color:#1b2440; font-weight:700; }
    .kei-st.na { background:#fafaf7; border-style:dashed; } .kei-st.na .g, .kei-st.na .t { color:#9aa0b4; }
    /* 入社準備の詳細（案内・URL・メール） */
    .kei-back2 { display:inline-block; font-size:12.5px; color:#6b7080; text-decoration:none; margin-bottom:10px; }
    .kei-back2:hover { color:#1b2440; }
    h3.kei-h3 { font-size:15px; font-weight:700; margin:0 0 8px; color:#1b2440; }
    .kei-pill.ok { background:#e3f4e7; color:#1f6f3a; }
    .kei-mute { font-size:12px; color:#9aa0b4; }
    .kei-note { font-size:11.5px; color:#6b7080; line-height:1.8; margin:6px 0; }
    .kei-err { color:#b3261e; font-size:12.5px; line-height:1.7; margin:6px 0; }
    .kei-okmsg { color:#1f6f3a; font-size:13px; font-weight:700; margin:10px 0; }
    dl.kei-dl { display:grid; grid-template-columns:minmax(64px,auto) 1fr; gap:6px 14px; margin:0 0 6px; font-size:13px; }
    dl.kei-dl dt { color:#6b7080; font-size:12px; } dl.kei-dl dd { margin:0; }
    .kei-form { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:12px 0; }
    .kei-f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#6b7080; min-width:0; }
    .kei-f.wide { grid-column:1 / -1; }
    .kei-f input, .kei-f textarea, .kei-inline select { border:1px solid #c7cad4; border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; color:#1b2440; background:#fff; width:100%; box-sizing:border-box; }
    .kei-inline select { width:auto; }
    .kei-inline { font-size:12.5px; color:#6b7080; margin-right:8px; }
    .kei-urlbox { margin:12px 0; padding:12px; background:#f3faf5; border:1px solid #cfe8d6; border-radius:8px; }
    .kei-urlbox input { border:1px solid #c7cad4; border-radius:7px; padding:8px 10px; font-size:12.5px; width:100%; box-sizing:border-box; margin-bottom:6px; }
    .kei-mailbox { margin:12px 0; padding:12px; background:#fafaf7; border:1px solid #e2e2dc; border-radius:8px; font-size:13px; line-height:1.8; }
    .kei-mailbox span { display:inline-block; min-width:52px; color:#6b7080; font-size:12px; }
    .kei-mailbox pre { white-space:pre-wrap; word-break:break-all; font-family:inherit; margin:8px 0 0; }
    .kei-tw { overflow-x:auto; margin-top:8px; }
    .kei-btn.sm { padding:4px 10px; font-size:11.5px; margin:0; }
    .kei-btn[disabled] { opacity:.45; cursor:default; }
    @media (max-width: 820px) { .kei-form { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="kei-shell">
  <nav id="kei-side"></nav>
  <main class="kei-main" id="kei-main"><div class="kei-empty">読み込み中…</div></main>
</div>

<script src="../js/api-client.js?v=20260929c"></script>
<script src="../js/keiei-layout.js?v=20260929c"></script>
<script src="/keiei/onboarding.js?v=20260929c"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KeieiLayout.esc;
  const MISSING = "データ未連携";
  const yen = (n) => `${Math.round(Number(n) || 0).toLocaleString("ja-JP")}円`;
  const num = (n) => Number(n || 0).toLocaleString("ja-JP");
  const ym = (m) => `${String(m).slice(0, 4)}年${Number(String(m).slice(5, 7))}月`;
  const short = (n) => (n >= 10000 ? `${Math.round(n / 1000) / 10}万` : num(n));

  // ---- 部品 ------------------------------------------------------------------
  // 数値カード。取れないもの（status: missing）は、値を持たず「データ未連携」と出す。0円とは出さない
  function card(c) {
    const miss = c.status === "missing";
    const pill = c.status === "provisional" ? `<span class="kei-pill prov">暫定</span>` : "";
    const body = miss
      ? `<div class="kei-missing">${MISSING}</div><div class="sub">${esc(c.reason || "")}</div>`
      : `<div class="val">${c.unit === "yen" ? yen(c.value) : c.unit === "count" ? `${num(c.value)}<small>${esc(c.suffix || "")}</small>` : esc(c.value)}</div>
         <div class="sub">${esc(c.sub || "")}</div>${c.note ? `<div class="nt">${esc(c.note)}</div>` : ""}`;
    const inner = `<div class="lb"><span>${esc(c.label)}</span>${pill}</div>${body}`;
    return c.view ? `<a class="kei-card${miss ? " miss" : ""}" href="#${esc(c.view)}">${inner}</a>`
                  : `<div class="kei-card${miss ? " miss" : ""}">${inner}</div>`;
  }
  const bannerHtml = (text, kind = "") => `<div class="kei-banner ${kind}">${esc(text)}</div>`;
  const head = (title, sub) => `<h1 class="kei-title">${esc(title)}</h1><p class="kei-sub">${esc(sub || "")}</p>`;
  const progress = (done, total) => `<div class="kei-prog"><i style="width:${total ? Math.round((done / total) * 100) : 0}%"></i></div>`;

  // ---- 画面 ------------------------------------------------------------------
  const RENDER = {
    dashboard(d) {
      const money = d.cards.filter((c) => c.group === "money");
      const ops = d.cards.filter((c) => c.group === "ops");
      return head("ダッシュボード", `${ym(d.month)}の会社の状態です。取れている数字だけを出しています。`)
        + bannerHtml("数字は、元のデータ（経費・契約・請求進捗・営業）をその場で数えたものです。元データが無い項目は「" + MISSING + "」と出し、0円とは出しません。", "")
        + `<div class="kei-h">お金</div><div class="kei-grid">${money.map(card).join("")}</div>`
        + `<div class="kei-h">稼働・営業</div><div class="kei-grid">${ops.map(card).join("")}</div>`;
    },

    expenses(d) {
      const e = d.expense;
      if (!e) return head("経費", "") + bannerHtml("経費のデータを読めませんでした（" + MISSING + "）。", "warn");
      const max = Math.max(1, ...e.monthly.map((m) => m.confirmed + m.pending));
      const bars = e.monthly.map((m) => `<div class="kei-bar-col" title="${esc(ym(m.month))}：確定 ${yen(m.confirmed)}／承認待ち ${yen(m.pending)}">
          <div class="mv">${m.confirmed ? short(m.confirmed) : ""}</div>
          <div class="bar pend" style="height:${Math.round((m.pending / max) * 100)}%"></div>
          <div class="bar" style="height:${Math.round((m.confirmed / max) * 100)}%"></div>
          <div class="ml">${Number(m.month.slice(5))}月</div></div>`).join("");
      const diff = e.confirmed.diffPct == null ? "前月は経費なし" : `前月比 ${e.confirmed.diff >= 0 ? "+" : ""}${e.confirmed.diffPct}%（${e.confirmed.diff >= 0 ? "+" : ""}${yen(e.confirmed.diff)}）`;
      return head("経費", `${ym(d.month)}。申請・承認は Office 側（経費精算）で行います。ここは集計です。`)
        + `<div class="kei-grid">
            ${card({ label: "今月の経費（確定）", status: "exact", unit: "yen", value: e.confirmed.thisMonth, sub: diff })}
            ${card({ label: "承認待ち（見込み）", status: "exact", unit: "yen", value: e.pending.thisMonth, sub: `${e.pending.count}件` })}
            ${card({ label: "支払待ち（立替・承認済み）", status: "exact", unit: "yen", value: e.payable.amount, sub: `${e.payable.count}件` })}
            ${card({ label: "内訳（確定）", status: "exact", unit: "text", value: `立替 ${yen(e.byMethod.personal)}`, sub: `法人カード ${yen(e.byMethod.corporate_card)}` })}
          </div>`
        + `<div class="kei-h">月別の推移（12か月）</div><div class="kei-panel"><div class="kei-bars">${bars}</div>
             <div class="kei-sub" style="margin:8px 0 0;">濃い色＝確定、薄い色＝承認待ち。発生日（明細の日付）の月で数えています。</div></div>`
        + `<div class="kei-h">科目別（今月・確定）</div><div class="kei-panel">${
            e.byCategory.length ? `<table class="kei-t"><thead><tr><th>科目</th><th class="n">金額</th></tr></thead><tbody>${
              e.byCategory.map((c) => `<tr><td>${esc(c.category)}</td><td class="n">${yen(c.amount)}</td></tr>`).join("")}</tbody></table>`
              : `<div class="kei-empty">今月の確定した経費はありません。</div>`}</div>`
        + bannerHtml(e.note);
    },

    payroll(d) {
      const p = d.payroll;
      if (!p) return head("人件費", "") + bannerHtml(`${MISSING}。${d.reason || ""}`, "warn");
      return head("人件費", "経営者だけが見られます。全員分の給与を含みます。")
        + bannerHtml(p.note, "warn")
        + `<div class="kei-grid">
            ${card({ label: "今月の人件費", status: "provisional", unit: "yen", value: p.monthlyTotal, sub: `契約ベース・${p.counted}/${p.employeeCount}人分` })}
            ${card({ label: "含めていない人", status: "exact", unit: "count", suffix: "人", value: p.excludedCount, sub: "下の表に理由があります" })}
          </div>`
        + `<div class="kei-h">社員別</div><div class="kei-panel"><table class="kei-t"><thead><tr><th>氏名</th><th>賃金の種類</th><th class="n">契約上の賃金</th><th class="n">月額換算</th><th>備考</th></tr></thead><tbody>${
            p.rows.map((r) => `<tr class="${r.included ? "" : "dim"}"><td>${esc(r.name)}</td><td>${esc(r.wageType || "—")}</td>
              <td class="n">${r.wageAmount == null ? "—" : yen(r.wageAmount)}</td><td class="n">${r.included ? yen(r.monthly) : "—"}</td>
              <td>${esc(r.reason || "")}</td></tr>`).join("")}</tbody></table></div>`;
    },

    revenue(d) {
      const b = d.billing;
      const stageMax = b ? Math.max(1, b.total) : 1;
      return head("売上・利益", `${ym(d.month)}。`)
        + bannerHtml(d.reason, "warn")
        + `<div class="kei-grid">${d.money.map((m) => card({ label: m.label, status: "missing", reason: "" })).join("")}</div>`
        + `<div class="kei-h">今月の請求進捗（金額ではなく、進み具合）</div><div class="kei-panel">${
            b ? `<div class="kei-sub" style="margin:0 0 8px;">対象 ${b.total}件・5段階すべて完了 ${b.complete}件・未着手 ${b.notStarted}件</div>${
              b.byStage.map((s) => `<div class="kei-row"><div class="nm">${esc(s.label)}</div><div class="pg">${progress(s.done, stageMax)}</div><div class="n">${s.done}</div></div>`).join("")}`
              : `<div class="kei-empty">${MISSING}</div>`}</div>`
        + `<div class="kei-h">契約更新（${d.renewals ? d.renewals.days : 45}日以内）</div><div class="kei-panel">${
            d.renewals && d.renewals.upcoming.length ? `<table class="kei-t"><thead><tr><th>終了日</th><th>区分</th><th>更新の状態</th></tr></thead><tbody>${
              d.renewals.upcoming.map((c) => `<tr><td>${esc(c.periodTo)}</td><td>${c.kind === "bp" ? "BP" : "プロパー"}</td><td>${esc(c.renewalStatus || "")}</td></tr>`).join("")}</tbody></table>`
              : `<div class="kei-empty">${d.renewals ? "近く終わる契約はありません。" : MISSING}</div>`}</div>`
        + `<div class="kei-h">営業</div><div class="kei-grid">${
            d.sales ? card({ label: "成約（累計）", status: "exact", unit: "count", suffix: "件", value: d.sales.won, sub: `商談中 ${d.sales.negotiating}件`, note: "営業の成約は件数のみです（金額の列がありません）" })
                    : card({ label: "成約（累計）", status: "missing", reason: "" })}</div>`;
    },

    cash(d) {
      const pay = d.payable;
      return head("入金・支払", `${ym(d.month)}。処理そのものは Office、ここは集計と確認です。`)
        + bannerHtml(d.reason, "warn")
        + `<div class="kei-grid">${
            pay ? card({ label: "支払予定（立替経費）", status: "exact", unit: "yen", value: pay.amount, sub: `${pay.count}件`, note: pay.note })
                : card({ label: "支払予定（立替経費）", status: "missing", reason: "経費のデータを読めませんでした" })}
            ${d.items.map((m) => card({ label: m.label, status: "missing", reason: "" })).join("")}</div>`;
    },

    accounting(d) {
      const j = d.journals;
      return head("会計", "既存の会計画面はそのまま使えます。ここは入口と、このアプリが捕捉している分の確認です。")
        + bannerHtml(d.note, "warn")
        + `<div class="kei-grid">${
            j ? [card({ label: "仕訳（このアプリで承認済み）", status: "provisional", unit: "count", suffix: "件", value: j.approved, sub: `直近の取引日 ${j.latestApprovedOn || "—"}` }),
                 card({ label: "確認待ちの仕訳", status: "exact", unit: "count", suffix: "件", value: j.draft, sub: "承認前" })].join("")
              : card({ label: "仕訳", status: "missing", reason: "仕訳のデータを読めませんでした" })}</div>`
        + `<div class="kei-h">既存の会計</div><div class="kei-panel">
             <a class="kei-btn" href="${esc(d.links.accounting)}">会計（仕訳の承認・試算表）を開く</a>
             <a class="kei-btn sec" href="${esc(d.links.documents)}">会計書類のアップロード</a>
             <div class="kei-sub" style="margin:10px 0 0;">MF（マネーフォワード）の会計実績・残高との照合は、Office の請求・仕入・支払が揃ってから連携します。</div></div>`;
    },

    onboarding(d) {
      if (d.status === "missing") return head("入社準備", "") + bannerHtml(`${MISSING}。${d.reason || ""}`, "warn");
      const sm = d.summary;
      const GLYPH = { done: "✓", current: "△", todo: "○", na: "–", unlinked: "—" };
      const STATE = { done: "完了", current: "要対応", todo: "これから", na: "対象外", unlinked: MISSING };
      const stepHtml = (s) => `<div class="kei-st ${esc(s.state)}" data-step="${esc(s.key)}" data-state="${esc(s.state)}">
          <div class="t"><span class="g" title="${esc(STATE[s.state] || "")}">${GLYPH[s.state] || "○"}</span>${s.n}. ${esc(s.label)}</div>
          <div class="nt">${s.state === "unlinked" ? `<b>${MISSING}</b><br>${esc(s.note || "")}` : esc(s.note || "")}</div>
          ${s.state === "current" && s.actorLabel ? `<div class="who">担当：${esc(s.actorLabel)}</div>` : ""}
          ${s.href ? `<a href="${esc(s.href)}">${s.key === "guide" ? (s.state === "na" ? "案内を作る →" : "案内を開く →") : "開く →"}</a>` : ""}</div>`;
      const dayText = (r) => {
        if (!r.joinOn) return "入社日は未定";
        const dt = String(r.joinOn).replace(/-/g, "/");
        if (r.daysToStart == null) return `${dt} 入社`;
        if (r.daysToStart > 0) return `${dt} 入社（あと${r.daysToStart}日）`;
        return r.daysToStart === 0 ? `${dt} 本日入社` : `${dt} 入社（${-r.daysToStart}日経過）`;
      };
      const person = (r) => `<div class="kei-ob" data-employee="${esc(r.employeeId)}">
          <div class="kei-ob-h"><span class="nm">${esc(r.name)}</span>
            <span class="mt">${esc([r.department, r.position].filter(Boolean).join("・"))}</span>
            <span class="mt">${esc(dayText(r))}</span><span class="sp"></span>
            <span class="kei-next ${esc(r.six.next.tone)}">${esc(r.six.next.label)}${r.six.next.actorLabel ? `（${esc(r.six.next.actorLabel)}）` : ""}</span></div>
          <div class="kei-six">${r.six.steps.map(stepHtml).join("")}</div>
          ${r.six.after ? `<div class="kei-after" data-role="after">このあと：${esc(r.six.after.label)}${r.six.after.actorLabel ? `（${esc(r.six.after.actorLabel)}）` : ""}${r.six.after.href ? ` <a href="${esc(r.six.after.href)}">開く →</a>` : ""}</div>` : ""}
          <div class="kei-after"><a href="${esc(r.links.detail)}" data-role="detail">案内・URL・メールを開く →</a></div></div>`;
      return head("入社準備", "入社が決まった人の準備を、6つのステップで見ます。完了率より、次に誰が何をするかを先に出しています。")
        + bannerHtml("① 入社案内確認は、経営者が作って発行した案内を、本人が確認したかどうかです。案内が無い人は「対象外」で、ほかのステップは止まりません。"
          + "給与・手当の金額と、給与入りの書面の中身はここには出しません（状態だけです）。", "")
        + `<div class="kei-grid sm">
            ${card({ label: "入社準備中", status: "exact", unit: "count", suffix: "人", value: sm.inProgress })}
            ${card({ label: "会社の対応待ち", status: "exact", unit: "count", suffix: "人", value: sm.company, sub: "経営者・人事・上長の番" })}
            ${card({ label: "本人の対応待ち", status: "exact", unit: "count", suffix: "人", value: sm.employee })}
            ${card({ label: "社労士の確認待ち", status: "exact", unit: "count", suffix: "人", value: sm.advisor })}
            ${card({ label: "完了", status: "exact", unit: "count", suffix: "人", value: sm.complete, sub: d.hiddenComplete ? `完了して30日を過ぎた${d.hiddenComplete}人は外しています` : "" })}
          </div>`
        + `<div class="kei-h">入社予定者</div>`
        + (d.rows.length ? d.rows.map(person).join("") : `<div class="kei-panel"><div class="kei-empty">入社準備中の人はいません。</div></div>`)
        + `<div class="kei-panel"><a class="kei-btn" href="${esc(d.links.start)}">新規メンバー登録</a>
             <a class="kei-btn sec" href="${esc(d.links.hr)}">入退社の手続き</a>
             <div class="kei-sub" style="margin:8px 0 0;">労働条件の作成・署名・書類の確認は、これまでの画面で行います（各ステップの「開く」から移れます）。入社案内・案内URL・メールは、各人の「案内・URL・メールを開く」から。</div></div>`;
    },
  };

  // ---- 読み込み ---------------------------------------------------------------
  const errBox = (e) => `${head("読み込めませんでした", "")}${bannerHtml(e.hint || e.detail || e.message || "エラーが起きました", "err")}`;
  const mfaBox = (e) => `${head("二段階認証が必要です", "")}${bannerHtml(e.hint || "", "warn")}<div class="kei-panel"><a class="kei-btn" href="/mypage.html#mfa">マイページで二段階認証を設定する</a></div>`;

  let seq = 0;
  async function show(view) {
    // 入社準備の1人ぶん（#onboarding/<社員ID>）は、keiei/onboarding.js
    const one = /^onboarding\/(.+)$/.exec(view);
    if (one) {
      KeieiLayout.setActive("onboarding");
      const mine = ++seq;
      const main = el("kei-main");
      main.innerHTML = `<div class="kei-empty">読み込み中…</div>`;
      await window.KeieiOnb.open(decodeURIComponent(one[1]), main, () => mine !== seq);
      return;
    }
    if (!RENDER[view]) view = "dashboard";
    KeieiLayout.setActive(view);
    const mine = ++seq;
    const main = el("kei-main");
    main.innerHTML = `<div class="kei-empty">読み込み中…</div>`;
    try {
      const d = await API.api(`/api/keiei?view=${encodeURIComponent(view)}`);
      if (mine !== seq) return;        // 速く切り替えたときは、最後に押した画面だけを出す
      main.innerHTML = RENDER[view](d);
      window.scrollTo(0, 0);
    } catch (e) {
      if (mine !== seq) return;
      if (e.code === "mfa_required") main.innerHTML = mfaBox(e);
      else if (e.status === 403) location.replace("/home.html");
      else main.innerHTML = errBox(e);
    }
  }
  const viewOf = () => (location.hash || "#dashboard").slice(1);

  KeieiLayout.init({ active: viewOf() }).then((ctx) => {
    if (!ctx) return;
    window.addEventListener("hashchange", () => show(viewOf()));
    show(viewOf());
  });
</script>
</body>
</html>
