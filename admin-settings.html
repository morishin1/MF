<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理設定 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260906d">
  <link rel="stylesheet" href="css/layout.css?v=20260906d">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && (kpc.appRole === "admin" || kpc.appRole === "owner" || kpc.appRole === "sr")) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">管理設定</h1>
  <p class="kp-greet-sub">会社情報・アカウント連携・外部サービスの状態を確認します。</p>

  <div class="card">
    <h2><span class="material-symbols-outlined">domain</span>会社情報</h2>
    <div class="inline-controls">
      <div style="min-width:260px;flex:1;"><label>会社名</label><input id="s-name" type="text"></div>
      <div>
        <button class="btn btn-primary" onclick="saveName()">
          <span class="material-symbols-outlined icon-inline">save</span>保存
        </button>
      </div>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 0 0;" id="s-depts"></p>
    <div id="s-msg" class="err-text"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">link</span>ログインアカウントの紐づけ</h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px;">
      名簿に先に登録した人を、本人のログインアカウントと結び付けます。
      すでにアカウントがある人は「<b>紐づけ</b>」を、まだ無い人は「<b>アカウントを作る</b>」を押してください。
      作った場合は初回パスワードがこの画面に一度だけ表示されるので、本人へお伝えください。
    </p>
    <div id="unlinked"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">hub</span>外部サービスの状態</h2>
    <div id="integrations"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">store</span>取引先（会計）</h2>
    <div id="clients"><div class="empty">読み込み中…</div></div>
    <p class="muted" style="font-size:12px;margin:12px 0 0;">
      取引先の追加は「会計書類」画面から行います。
    </p>
  </div>
</div>

<script src="js/api-client.js?v=20260906d"></script>
<script src="js/layout.js?v=20260906d"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  let data = null;

  KPLayout.init({ active: "settings", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      data = await API.settings();
    } catch (e) {
      el("s-msg").textContent = e.detail || e.message || "取得に失敗しました";
      return;
    }
    el("s-name").value = data.tenant?.name || "";
    el("s-depts").textContent = data.departments.length
      ? `部署：${data.departments.join("、")}　／　社員 ${data.counts.employees} 名（在籍 ${data.counts.active} 名）`
      : `部署はまだ登録されていません（メンバー画面で部署を入力すると、ここに集計されます）`;

    renderUnlinked();
    renderIntegrations();
    renderClients();
  }

  async function saveName() {
    const msg = el("s-msg");
    msg.textContent = "";
    const name = el("s-name").value.trim();
    if (!name) { msg.textContent = "会社名を入力してください"; return; }
    try { await API.updateSettings({ name }); msg.textContent = "保存しました"; setTimeout(() => msg.textContent = "", 2500); }
    catch (e) { msg.textContent = e.detail || e.message || "保存に失敗しました"; }
  }

  function renderUnlinked() {
    if (!data.unlinked.length) {
      el("unlinked").innerHTML = `<div class="empty">未連携のメンバーはいません。</div>`;
      return;
    }
    const clientOpts = data.clients.map((c) =>
      `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");

    el("unlinked").innerHTML = data.unlinked.map((e) => `
      <div class="kp-todo" style="align-items:center;">
        <span class="material-symbols-outlined" style="font-size:20px;color:var(--muted);">person</span>
        <span class="t">
          <b>${esc(e.display_name)}</b>
          ${e.department ? `<small>${esc(e.department)}</small>` : ""}
        </span>
        <input type="email" id="lk-${esc(e.id)}" value="${esc(e.email || "")}"
               placeholder="taro@8grp.co.jp" style="max-width:210px;">
        <select id="lc-${esc(e.id)}" style="max-width:140px;">${clientOpts}</select>
        <button class="btn btn-secondary btn-sm" onclick="link('${esc(e.id)}', false)">紐づけ</button>
        <button class="btn btn-primary btn-sm" onclick="link('${esc(e.id)}', true)">アカウントを作る</button>
      </div>`).join("") + `<div id="lk-msg" class="err-text"></div><div id="lk-pass"></div>`;
  }

  async function link(employeeId, create) {
    const msg = el("lk-msg");
    msg.textContent = "";
    const email = el(`lk-${employeeId}`).value.trim();
    const name = data.unlinked.find((x) => x.id === employeeId)?.display_name || "";
    const clientId = el(`lc-${employeeId}`)?.value || null;
    if (!email) { msg.textContent = "メールアドレスを入力してください"; return; }
    if (create && !confirm(`${email} でログインアカウントを作り、${name} さんに紐づけます。よろしいですか？`)) return;

    try {
      const res = await API.linkEmployeeAccount(employeeId, email, clientId, create ? { create: true } : {});
      await load();
      // 自動生成した初回パスワードは、この1回しか表示できない
      if (res.createdPassword) showPassword(name, email, res.createdPassword);
    } catch (e) {
      msg.textContent = e.detail || e.hint || e.message || "紐づけに失敗しました";
    }
  }

  function showPassword(name, email, password) {
    el("lk-pass").innerHTML = `
      <div class="banner ok" style="margin-top:14px;align-items:flex-start;">
        <span class="material-symbols-outlined">key</span>
        <div>
          <b>${esc(name)} さんのアカウントを作成しました。</b><br>
          <span class="muted" style="font-size:12.5px;">この初回パスワードは、この画面を離れると二度と表示できません。いま控えて本人へお伝えください。</span>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <code style="font-size:15px;padding:6px 10px;background:#fff;border:1px solid var(--border);border-radius:6px;">${esc(password)}</code>
            <button class="btn btn-secondary btn-sm" onclick="copyPassword('${esc(password)}')">コピー</button>
          </div>
          <div class="muted" style="font-size:12.5px;margin-top:10px;">
            ログイン先：<b>${esc(location.origin)}/home.html</b>　ID：<b>${esc(email)}</b><br>
            本人には、最初のログイン後にパスワードを変更するようご案内ください。
          </div>
        </div>
      </div>`;
  }

  async function copyPassword(password) {
    try { await navigator.clipboard.writeText(password); }
    catch { alert("コピーできませんでした。手動で選択してください。"); }
  }

  function renderIntegrations() {
    const rows = [
      ["Google Drive", data.integrations.drive,
       "書類の自動保存。GOOGLE_SERVICE_ACCOUNT_JSON と GDRIVE_ROOT_FOLDER_ID が必要"],
      ["Google Drive（人事書類）", data.integrations.driveHr,
       "入社者の個人フォルダ。証憑と混ざらないよう GDRIVE_HR_FOLDER_ID に別フォルダを指定する"],
      ["Slack", data.integrations.slack,
       "新着メッセージは画面右上のベルで届きます。Slack にも流す場合は SLACK_WEBHOOK_URL が必要（未実装）"],
      ["AI（書類判定・仕訳）", data.integrations.anthropic,
       "アップロードした書類の種別判定と仕訳ドラフト。ANTHROPIC_API_KEY が必要"],
    ];
    el("integrations").innerHTML = rows.map(([name, ok, note]) => `
      <div class="kp-todo" style="align-items:center;">
        <span class="material-symbols-outlined" style="font-size:20px;color:${ok ? "var(--primary)" : "#c3cad3"};">
          ${ok ? "check_circle" : "radio_button_unchecked"}</span>
        <span class="t"><b>${esc(name)}</b><small>${esc(note)}</small></span>
        <span class="kp-chip ${ok ? "event" : "draft"}">${ok ? "設定済み" : "未設定"}</span>
      </div>`).join("") + `
      <p class="muted" style="font-size:12px;margin:12px 0 0;">
        設定は Vercel の環境変数で行います。変更後は Redeploy が必要です。
      </p>`;
  }

  function renderClients() {
    if (!data.clients.length) {
      el("clients").innerHTML = `<div class="empty">取引先が登録されていません。</div>`;
      return;
    }
    el("clients").innerHTML = data.clients.map((c) => `
      <div class="kp-todo" style="align-items:center;">
        <span class="material-symbols-outlined" style="font-size:20px;color:var(--muted);">storefront</span>
        <span class="t"><b>${esc(c.name)}</b></span>
        <span class="kp-chip ${c.accounting_software === "mf" ? "event" : ""}">
          ${c.accounting_software === "mf" ? "MF連携あり" : "MF連携なし"}</span>
      </div>`).join("");
  }
</script>

</body>
</html>
