<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク・予定 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260906a">
  <link rel="stylesheet" href="css/layout.css?v=20260906a">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && (kpc.appRole === "admin" || kpc.appRole === "owner" || kpc.appRole === "sr")) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">タスク・予定</h1>
  <p class="kp-greet-sub">担当者と期限を決めて割り当てます。期限を過ぎたものは赤く表示されます。</p>

  <div class="card">
    <h2><span class="material-symbols-outlined">add_task</span>タスクを追加</h2>
    <div style="margin-bottom:12px;">
      <label>やること</label>
      <input id="t-title" type="text" placeholder="例: 8月分の請求書をアップロードする">
    </div>
    <div class="inline-controls" style="margin-bottom:12px;">
      <div style="min-width:180px;"><label>担当者</label><select id="t-assignee"></select></div>
      <div><label>期限</label><input id="t-due" type="date"></div>
      <div>
        <label>重要度</label>
        <select id="t-priority">
          <option value="normal">ふつう</option>
          <option value="high">高い</option>
          <option value="low">低い</option>
        </select>
      </div>
      <div style="min-width:150px;"><label>分類（任意）</label><input id="t-category" type="text" placeholder="月次経理"></div>
      <div style="min-width:180px;"><label>期限超過時の連絡先</label><select id="t-escalate"></select></div>
      <div>
        <button class="btn btn-primary" onclick="create()">
          <span class="material-symbols-outlined icon-inline">add</span>追加
        </button>
      </div>
    </div>
    <div id="t-msg" class="err-text"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-filter="open" onclick="setFilter('open', this)">未完了</button>
      <button class="tab" data-filter="overdue" onclick="setFilter('overdue', this)">期限超過</button>
      <button class="tab" data-filter="done" onclick="setFilter('done', this)">完了</button>
      <button class="tab" data-filter="all" onclick="setFilter('all', this)">すべて</button>
    </div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260906a"></script>
<script src="js/layout.js?v=20260906a"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const today = () => new Date().toISOString().slice(0, 10);

  const STATUS_LABEL = { todo: "未着手", doing: "着手中", done: "完了", cancelled: "取りやめ" };
  const PRIORITY_LABEL = { low: "低", normal: "", high: "高" };

  let tasks = [];
  let employees = [];
  let filter = "open";

  KPLayout.init({ active: "tasks", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    await Promise.all([loadEmployees(), loadTasks()]);
  }

  async function loadEmployees() {
    try {
      const res = await API.listEmployees();
      employees = (res.employees || []).filter((e) => e.status !== "left");
      const opts = employees.map((e) =>
        `<option value="${esc(e.id)}">${esc(e.display_name)}${e.department ? `（${esc(e.department)}）` : ""}</option>`).join("");
      el("t-assignee").innerHTML = `<option value="">（未割り当て）</option>${opts}`;
      el("t-escalate").innerHTML = `<option value="">（設定しない）</option>${opts}`;
    } catch (e) {
      el("t-msg").textContent = e.detail || e.message;
    }
  }

  async function create() {
    const msg = el("t-msg");
    msg.textContent = "";
    const title = el("t-title").value.trim();
    if (!title) { msg.textContent = "やることを入力してください"; return; }
    try {
      await API.createTask({
        title,
        assigneeId: el("t-assignee").value || null,
        escalateTo: el("t-escalate").value || null,
        dueOn: el("t-due").value || null,
        priority: el("t-priority").value,
        category: el("t-category").value.trim() || null,
      });
      el("t-title").value = "";
      el("t-due").value = "";
      await loadTasks();
    } catch (e) {
      msg.textContent = e.detail || e.message || "追加に失敗しました";
    }
  }

  async function loadTasks() {
    try {
      const res = await API.listTasks();
      tasks = res.tasks || [];
      render();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function setFilter(f, btn) {
    filter = f;
    for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b === btn);
    render();
  }

  const isOverdue = (t) =>
    t.due_on && t.status !== "done" && t.status !== "cancelled" && t.due_on < today();

  function render() {
    const shown = tasks.filter((t) => {
      if (filter === "open") return t.status === "todo" || t.status === "doing";
      if (filter === "overdue") return isOverdue(t);
      if (filter === "done") return t.status === "done";
      return true;
    });

    if (!shown.length) {
      el("list").innerHTML = `<div class="empty">該当するタスクはありません。</div>`;
      return;
    }

    el("list").innerHTML = `
      <div class="table-scroll">
        <table class="kp-items">
          <thead><tr>
            <th>やること</th><th>担当</th><th>期限</th><th>状態</th><th></th>
          </tr></thead>
          <tbody>${shown.map(row).join("")}</tbody>
        </table>
      </div>`;
  }

  function row(t) {
    const over = isOverdue(t);
    const cls = t.status === "done" || t.status === "cancelled" ? "done" : "";
    const due = t.due_on
      ? new Date(t.due_on).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" })
      : "—";
    return `
      <tr class="${cls}">
        <td>
          ${t.priority === "high" ? '<span class="kp-chip important">高</span> ' : ""}
          ${esc(t.title)}
          ${t.category ? `<span class="muted" style="font-size:11.5px;">　${esc(t.category)}</span>` : ""}
        </td>
        <td>${esc(t.assignee?.display_name || "未割り当て")}</td>
        <td${over ? ' style="color:#b3261e;font-weight:600;"' : ""}>${esc(due)}${over ? " 超過" : ""}</td>
        <td>
          <select onchange="setStatus('${esc(t.id)}', this.value)">
            ${Object.entries(STATUS_LABEL).map(([k, v]) =>
              `<option value="${k}"${t.status === k ? " selected" : ""}>${v}</option>`).join("")}
          </select>
        </td>
        <td style="text-align:right;">
          <button class="icon-btn" title="削除" onclick="remove('${esc(t.id)}')">
            <span class="material-symbols-outlined" style="font-size:18px;">close</span>
          </button>
        </td>
      </tr>`;
  }

  async function setStatus(id, status) {
    try { await API.updateTask({ id, status }); await loadTasks(); }
    catch (e) { alert(e.detail || e.message || "更新に失敗しました"); await loadTasks(); }
  }

  async function remove(id) {
    const t = tasks.find((x) => x.id === id);
    if (!confirm(`「${t ? t.title : ""}」を削除します。よろしいですか？`)) return;
    try { await API.deleteTask(id); await loadTasks(); }
    catch (e) { alert(e.detail || e.message || "削除に失敗しました"); }
  }
</script>

</body>
</html>
