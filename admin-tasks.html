<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>タスク・予定 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916a">
  <link rel="stylesheet" href="css/layout.css?v=20260916a">
  <style>
    /* ── 毎日の実行管理 ──
       誰が何をしていて、誰が止まっているか。この1枚で分かるようにする。
       個々のタスクの中身は、その人を開いたときだけ */
    .bd-kpi { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
    .bd-kpi .box { flex:1 1 120px; border:1px solid var(--border); border-radius:10px; padding:10px 13px; }
    .bd-kpi .box .k { font-size:11.5px; color:var(--muted); }
    .bd-kpi .box .v { font-size:20px; font-weight:700; color:var(--primary-dark);
                      font-variant-numeric:tabular-nums; }
    .bd-kpi .box.warn .v { color:#c53030; }
    .bd-kpi .box.ok .v { color:#256b36; }

    .bd-f { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin:0 0 14px; }
    .bd-f label { display:block; font-size:11.5px; color:var(--muted); margin-bottom:3px; }
    .bd-f select, .bd-f input { margin:0; font-size:13px; width:auto; min-width:120px; }

    .bd-table { width:100%; border-collapse:collapse; font-size:13px; }
    .bd-table th { text-align:left; font-size:11.5px; color:var(--muted); font-weight:600;
                   padding:0 10px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
    .bd-table td { padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    .bd-table tr.click { cursor:pointer; }
    .bd-table tr.click:hover td { background:var(--soft); }
    .bd-table .nm { font-weight:700; color:var(--primary-dark); }
    .bd-table .sub { display:block; font-size:11.5px; color:var(--muted); font-weight:400; }
    .bd-table .cnt { font-variant-numeric:tabular-nums; font-weight:700; }
    .bd-table .cnt.all { color:#256b36; }
    .bd-table .cnt.none { color:#c53030; }
    .bd-st { display:inline-block; border-radius:999px; padding:2px 10px; font-size:11.5px;
             font-weight:600; white-space:nowrap; }
    .bd-st.done { background:#e8f5ec; color:#256b36; }
    .bd-st.warn { background:#fde8e8; color:#c53030; }
    .bd-st.working { background:#fff3e0; color:#9c4221; }
    .bd-stuck { font-size:12px; color:#9c4221; }
    .bd-li { font-size:12px; color:var(--muted); line-height:1.8; }
    .bd-li .ok { color:#256b36; }
    @media (max-width:760px) {
      .bd-table thead { display:none; }
      .bd-table tr { display:block; border-bottom:1px solid var(--border); padding:10px 0; }
      .bd-table td { display:block; border:0; padding:2px 0; }
    }
  </style>
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">タスク・予定</h1>
  <p class="kp-greet-sub">
    大事なのは、たくさん登録することではなく、毎日3つ終えることです。
    誰が何をしていて、誰が止まっているかを、ここで見ます。
  </p>

  <!-- 毎日の実行管理。いちばん上に置く -->
  <div class="card" id="board-card">
    <h2><span class="material-symbols-outlined">groups</span>今日の実行状況
      <span id="bd-date-label" class="kp-chip" style="margin-left:8px;"></span></h2>
    <div class="bd-kpi" id="bd-kpi"></div>
    <div class="bd-f">
      <div><label for="bd-date">日付</label><input id="bd-date" type="date" onchange="loadBoard()"></div>
      <div><label for="bd-month">月</label><input id="bd-month" type="month" onchange="onMonth()"></div>
      <div><label for="bd-person">担当者</label><select id="bd-person" onchange="loadBoard()"></select></div>
      <div><label for="bd-dep">部署</label><select id="bd-dep" onchange="loadBoard()"></select></div>
      <div><label for="bd-biz">事業・KPI</label><input id="bd-biz" type="text" placeholder="新規開拓" oninput="renderBoard()"></div>
      <div><label for="bd-done">完了</label>
        <select id="bd-done" onchange="loadBoard()">
          <option value="">すべて</option>
          <option value="1">完了のみ</option>
          <option value="0">未完了のみ</option>
        </select></div>
      <div><label for="bd-state">状態</label>
        <select id="bd-state" onchange="loadBoard()">
          <option value="">すべて</option>
        </select></div>
      <div><label class="check" style="font-size:12.5px;">
        <input type="checkbox" id="bd-ai" onchange="loadBoard()"> AI提案あり</label></div>
    </div>
    <div class="table-scroll">
      <table class="bd-table">
        <thead><tr>
          <th>担当者</th><th>今日の3タスク</th><th>完了数</th><th>明日の3タスク</th>
          <th>状態</th><th>止まっているもの</th>
        </tr></thead>
        <tbody id="bd-rows"><tr><td colspan="6">読み込み中…</td></tr></tbody>
      </table>
    </div>
    <div id="bd-msg" class="err-text" style="margin-top:8px;"></div>
  </div>

  <div id="bd-detail"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">add_task</span>タスクを追加</h2>
    <div style="margin-bottom:12px;">
      <label>やること</label>
      <input id="t-title" type="text" placeholder="例: 8月分の請求書をアップロードする">
    </div>
    <div class="inline-controls" style="margin-bottom:12px;">
      <div style="min-width:180px;"><label>担当者</label><select id="t-assignee"></select></div>
      <div><label>期限</label><input id="t-due" type="date"></div>
      <div>
        <label>重要度</label>
        <select id="t-priority">
          <option value="normal">ふつう</option>
          <option value="high">高い</option>
          <option value="low">低い</option>
        </select>
      </div>
      <div style="min-width:150px;"><label>分類（任意）</label><input id="t-category" type="text" placeholder="月次経理"></div>
      <div style="min-width:180px;"><label>期限超過時の連絡先</label><select id="t-escalate"></select></div>
    </div>

    <!-- 終わりの条件。
         「請求書の件よろしく」だけで渡すと、相手は何をどこまでやれば
         終わりなのか分からないまま始める。書く欄が無いから書かれない -->
    <div style="margin-bottom:12px;">
      <label for="t-done">どうなったら終わりか（任意・頼むときは書く）</label>
      <input id="t-done" type="text"
             placeholder="例: MFに8月分が全部入って、試算表の売上が合っている">
    </div>

    <!-- 繰り返し。
         月次の締め・支払・提出は、覚えている人が休んだ日に止まる。
         「元」を1つ置けば、その日になれば必ず並ぶ -->
    <div style="margin-bottom:12px;">
      <label class="check"><input type="checkbox" id="t-recur-on" onchange="onRecur()">
        繰り返す（決まった日に自動で出す）</label>
      <div id="t-recur" class="inline-controls hidden" style="margin-top:8px;">
        <div>
          <label>繰り返し方</label>
          <select id="t-recur-type" onchange="onRecur()">
            <option value="dom">毎月（日にち）</option>
            <option value="biz">毎月（第n営業日）</option>
            <option value="weekly">毎週</option>
            <option value="daily">毎日</option>
          </select>
        </div>
        <div id="t-recur-n-box"><label>日にち / n</label>
          <input id="t-recur-n" type="number" min="1" max="31" value="25"></div>
        <div id="t-recur-adj-box">
          <label>休みに当たったら</label>
          <select id="t-recur-adj">
            <option value="prev">前の営業日</option>
            <option value="next">次の営業日</option>
            <option value="">そのまま</option>
          </select>
        </div>
        <div id="t-recur-wd-box" class="hidden"><label>曜日</label>
          <select id="t-recur-wd">
            <option value="1">月</option><option value="2">火</option>
            <option value="3">水</option><option value="4">木</option>
            <option value="5">金</option><option value="6">土</option>
            <option value="0">日</option>
          </select></div>
        <div id="t-recur-daily-box" class="hidden"><label>対象</label>
          <select id="t-recur-daily">
            <option value="wd">平日のみ（土日祝を除く）</option>
            <option value="all">毎日</option>
          </select></div>
      </div>
      <p class="muted hidden" id="t-recur-note" style="font-size:11.5px;margin:6px 0 0;">
        当月と翌月ぶんを自動で作ります。先の月まで一度に作ると、
        片付けても減らない一覧になるためです。
      </p>
    </div>

    <div>
      <button class="btn btn-primary" onclick="create(this)">
        <span class="material-symbols-outlined icon-inline">add</span>追加
      </button>
    </div>
    <div id="t-msg" class="err-text"></div>
  </div>

  <!-- 繰り返しの「元」。やる仕事ではないので、一覧とは別の箱に置く -->
  <div class="card hidden" id="tpl-card">
    <h2><span class="material-symbols-outlined">repeat</span>繰り返しの設定
      <span id="tpl-n" style="margin-left:auto;font-size:12px;color:var(--muted);"></span>
    </h2>
    <div id="tpl-list"></div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-filter="open" onclick="setFilter('open', this)">未完了</button>
      <button class="tab" data-filter="overdue" onclick="setFilter('overdue', this)">期限超過</button>
      <button class="tab" data-filter="done" onclick="setFilter('done', this)">完了</button>
      <button class="tab" data-filter="all" onclick="setFilter('all', this)">すべて</button>
    </div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260916a"></script>
<script src="js/device.js?v=20260916a"></script>
<script src="js/layout.js?v=20260916a"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const today = () => new Date().toISOString().slice(0, 10);

  const STATUS_LABEL = { todo: "未着手", doing: "着手中", done: "完了", cancelled: "取りやめ" };
  const PRIORITY_LABEL = { low: "低", normal: "", high: "高" };

  let tasks = [];
  let templates = [];        // 繰り返しの「元」
  let employees = [];
  let filter = "open";

  KPLayout.init({ active: "tasks", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    await Promise.all([loadEmployees(), loadTasks(), loadBoard()]);
  }

  // ---- 毎日の実行管理 ----------------------------------------------------------
  //
  // 出すのは3つだけ。今日の3件と完了数／明日の3件の状態／止まっていること。
  // 個々のタスクの中身は、その人を開いたときだけ
  let board = null;

  function onMonth() {
    // 月を選んだら、その月の1日を見る。日付で追いたい日は日付の欄で選ぶ
    const m = el("bd-month").value;
    if (m) el("bd-date").value = `${m}-01`;
    loadBoard();
  }

  async function loadBoard() {
    const p = {
      date: el("bd-date").value || undefined,
      employeeId: el("bd-person").value || undefined,
      department: el("bd-dep").value || undefined,
      state: el("bd-state").value || undefined,
      done: el("bd-done").value || undefined,
      ai: el("bd-ai").checked ? "1" : undefined,
    };
    try { board = await API.taskBoard(p); }
    catch (e) {
      el("bd-rows").innerHTML = `<tr><td colspan="6">
        <div class="banner warn" style="margin:6px 0;">
          <span class="material-symbols-outlined">info</span>
          <div>${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
      return;
    }
    if (!el("bd-date").value) el("bd-date").value = board.date;
    fillBoardFilters();
    renderBoard();
  }

  function fillBoardFilters() {
    const dep = el("bd-dep");
    if (dep.options.length <= 1) {
      dep.innerHTML = `<option value="">すべて</option>`
        + (board.departments || []).map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
    }
    const per = el("bd-person");
    if (per.options.length <= 1) {
      per.innerHTML = `<option value="">全員</option>`
        + (board.people || []).map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
    }
    const st = el("bd-state");
    if (st.options.length <= 1) {
      st.innerHTML = `<option value="">すべて</option>`
        + (board.states || []).map((x) => `<option value="${esc(x.key)}">${esc(x.label)}</option>`).join("");
    }
  }

  function renderBoard() {
    const s = board.summary || {};
    el("bd-date-label").textContent = `${board.date}（明日 ${board.tomorrow || "—"}）`;
    el("bd-kpi").innerHTML = [
      ["対象者", s.people, ""],
      ["今日ぶん完了", s.doneAll, "ok"],
      ["明日が未登録", s.noTomorrow, s.noTomorrow ? "warn" : ""],
      ["確定待ち", s.waiting, ""],
      ["注意", s.warn, s.warn ? "warn" : ""],
    ].map(([k, v, cls]) =>
      `<div class="box ${cls}"><div class="k">${esc(k)}</div><div class="v">${v ?? 0}</div></div>`).join("");

    // 事業・KPIの絞り込みだけは、取ってきたものから画面側で行う
    const word = el("bd-biz").value.trim();
    const rows = (board.rows || []).filter((r) => !word
      || (r.todayList || []).some((t) => t.title.includes(word))
      || (r.tomorrowList || []).some((t) => t.title.includes(word)));

    if (!rows.length) {
      el("bd-rows").innerHTML = `<tr><td colspan="6" class="muted" style="padding:18px 0;">
        該当する人はいません。</td></tr>`;
      return;
    }
    el("bd-rows").innerHTML = rows.map((r) => `
      <tr class="click" onclick="openPerson('${esc(r.employeeId)}')">
        <td><span class="nm">${esc(r.name)}</span>
          ${r.department ? `<span class="sub">${esc(r.department)}</span>` : ""}</td>
        <td>${r.today.count ? `${r.today.count}件` : '<span class="bd-stuck">未登録</span>'}
          <span class="bd-li">${(r.todayList || []).slice(0, 3).map((t) =>
            `<br>${t.status === "done" ? '<span class="ok">✓</span>' : "・"}${esc(t.title)}`).join("")}</span></td>
        <td><span class="cnt ${r.today.allDone ? "all" : r.today.done === 0 && r.today.count ? "none" : ""}">
          ${esc(r.today.label)}</span></td>
        <td>${r.tomorrow.count
          ? `${r.tomorrow.count}件<span class="sub">${esc(r.tomorrow.label)}</span>`
          : '<span class="bd-stuck">未登録</span>'}</td>
        <td><span class="bd-st ${esc(r.state)}">${esc(r.stateLabel)}</span></td>
        <td><span class="bd-stuck">${esc(r.stuck || "")}</span></td>
      </tr>`).join("");
  }

  /** その人の重要タスクを開く。管理者はここから直接足す・確定もできる */
  async function openPerson(employeeId) {
    const r = (board.rows || []).find((x) => x.employeeId === employeeId);
    let f;
    try { f = await API.focus({ employeeId, date: board.date }); }
    catch (e) { el("bd-msg").textContent = e.hint || e.message || "開けませんでした"; return; }

    const list = (t) => t.length
      ? t.map((x, i) => `<div class="kp-todo">
          <span class="material-symbols-outlined" style="font-size:19px;color:${x.status === "done" ? "#3e9c5a" : "var(--muted)"};">
            ${x.status === "done" ? "check_circle" : "radio_button_unchecked"}</span>
          <span class="t">${i + 1}. ${esc(x.title)}
            <small>${x.doneCondition ? `完了条件：${esc(x.doneCondition)}` : ""}
              ${x.dueOn ? `／期限 ${esc(x.dueOn)}` : ""}
              ${x.carryCount ? `／持ち越し ${x.carryCount}回` : ""}</small></span>
        </div>`).join("")
      : `<div class="empty">ありません。</div>`;

    el("bd-detail").innerHTML = `
      <div class="card" style="border:1px solid var(--primary);">
        <h2><span class="material-symbols-outlined">person</span>${esc(r?.name || "")} さん
          <button class="btn btn-secondary btn-sm" style="margin-left:auto;"
                  onclick="closePerson()">閉じる</button></h2>
        <h3 style="font-size:13.5px;margin:6px 0 8px;color:var(--primary-dark);">
          今日（${esc(f.today)}）　${esc(f.todayProgress?.label || "")}</h3>
        ${list(f.todayTasks || [])}
        <h3 style="font-size:13.5px;margin:18px 0 8px;color:var(--primary-dark);">
          明日（${esc(f.tomorrowDate || "")}）　<span class="kp-chip ${f.tomorrowState?.confirmed ? "event" : "draft"}">
            ${esc(f.tomorrowState?.label || "")}</span></h3>
        ${list(f.tomorrowTasks || [])}
        ${f.tomorrowAi ? `<div class="banner" style="display:block;background:#fffdf7;margin-top:10px;">
          <b style="font-size:12.5px;">AIの確認</b>
          <div style="font-size:12.5px;margin-top:4px;">${esc(f.tomorrowAi.summary || "")}</div>
        </div>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
          ${f.tomorrowState?.confirmed ? "" : `
            <button class="btn btn-primary btn-sm"
                    onclick="confirmFor('${esc(employeeId)}', this)"
                    ${f.tomorrowState?.ready ? "" : "disabled"}>
              代わりに確定する</button>
            <span class="muted" style="font-size:12px;align-self:center;">
              ${esc(f.tomorrowState?.todo || "")}</span>`}
        </div>
        <div id="bd-detail-msg" class="err-text" style="margin-top:8px;"></div>
      </div>`;
    el("bd-detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function closePerson() { el("bd-detail").innerHTML = ""; }

  async function confirmFor(employeeId, btn) {
    try {
      await KPLayout.busy(btn, "確定中…", () =>
        API.focusConfirm(board.tomorrow, employeeId));
      await loadBoard();
      await openPerson(employeeId);
    } catch (e) {
      el("bd-detail-msg").textContent = e.hint || e.detail || e.message || "確定できませんでした";
    }
  }

  async function loadEmployees() {
    try {
      const res = await API.listEmployees();
      employees = (res.employees || []).filter((e) => e.status !== "left");
      const opts = employees.map((e) =>
        `<option value="${esc(e.id)}">${esc(e.display_name)}${e.department ? `（${esc(e.department)}）` : ""}</option>`).join("");
      el("t-assignee").innerHTML = `<option value="">（未割り当て）</option>${opts}`;
      el("t-escalate").innerHTML = `<option value="">（設定しない）</option>${opts}`;
    } catch (e) {
      el("t-msg").textContent = e.detail || e.message;
    }
  }

  async function create(btn) {
    const msg = el("t-msg");
    msg.textContent = "";
    const title = el("t-title").value.trim();
    if (!title) { msg.textContent = "やることを入力してください"; return; }
    try {
      await KPLayout.busy(btn, "追加中…", () => API.createTask({
        title,
        assigneeId: el("t-assignee").value || null,
        escalateTo: el("t-escalate").value || null,
        dueOn: el("t-due").value || null,
        priority: el("t-priority").value,
        category: el("t-category").value.trim() || null,
        doneCondition: el("t-done").value.trim() || null,
        recur: recurValue(),
      }));
      el("t-title").value = "";
      el("t-due").value = "";
      el("t-done").value = "";
      await loadTasks();
    } catch (e) {
      msg.textContent = e.hint || e.detail || e.message || "追加に失敗しました";
    }
  }

  /**
   * 繰り返しの欄を、選んだ種類に合わせて出し分ける。
   * 使わない欄を出したままにすると、入れた値が効いているのか分からなくなる
   */
  function onRecur() {
    const on = el("t-recur-on").checked;
    el("t-recur").classList.toggle("hidden", !on);
    el("t-recur-note").classList.toggle("hidden", !on);
    const type = el("t-recur-type").value;
    el("t-recur-n-box").classList.toggle("hidden", type !== "dom" && type !== "biz");
    el("t-recur-adj-box").classList.toggle("hidden", type !== "dom");
    el("t-recur-wd-box").classList.toggle("hidden", type !== "weekly");
    el("t-recur-daily-box").classList.toggle("hidden", type !== "daily");
    el("t-recur-n").max = type === "biz" ? "23" : "31";
  }

  /** 画面の値を、繰り返しの決まりにする。使わないときは null */
  function recurValue() {
    if (!el("t-recur-on").checked) return undefined;
    const type = el("t-recur-type").value;
    const n = Number(el("t-recur-n").value) || 1;
    if (type === "daily") return { type, daily: el("t-recur-daily").value };
    if (type === "weekly") return { type, weekday: Number(el("t-recur-wd").value) };
    if (type === "biz") return { type, n };
    return { type: "dom", n, adj: el("t-recur-adj").value };
  }

  /** 繰り返しの「元」。やる仕事ではないので、一覧とは別に出す */
  function renderTemplates() {
    const card = el("tpl-card");
    if (!templates.length) { card.classList.add("hidden"); return; }
    card.classList.remove("hidden");
    el("tpl-n").textContent = `${templates.length}件`;
    el("tpl-list").innerHTML = templates.map((t) => `
      <div class="kp-todo">
        <span class="material-symbols-outlined"
              style="font-size:20px;color:var(--muted);">repeat</span>
        <span class="t">${esc(t.title)}
          <small>${esc(t.recurLabel || "")}${
            t.assignee ? ` ／ ${esc(t.assignee.display_name)}` : ""}</small>
        </span>
        <button class="btn btn-secondary btn-sm" onclick="remove('${esc(t.id)}')">やめる</button>
      </div>`).join("");
  }

  async function loadTasks() {
    try {
      const res = await API.listTasks();
      tasks = res.tasks || [];
      templates = res.templates || [];
      render();
      renderTemplates();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function setFilter(f, btn) {
    filter = f;
    for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b === btn);
    render();
  }

  const isOverdue = (t) =>
    t.due_on && t.status !== "done" && t.status !== "cancelled" && t.due_on < today();

  function render() {
    const shown = tasks.filter((t) => {
      if (filter === "open") return t.status === "todo" || t.status === "doing";
      if (filter === "overdue") return isOverdue(t);
      if (filter === "done") return t.status === "done";
      return true;
    });

    if (!shown.length) {
      el("list").innerHTML = `<div class="empty">該当するタスクはありません。</div>`;
      return;
    }

    el("list").innerHTML = `
      <div class="table-scroll">
        <table class="kp-items">
          <thead><tr>
            <th>やること</th><th>担当</th><th>期限</th><th>状態</th><th></th>
          </tr></thead>
          <tbody>${shown.map(row).join("")}</tbody>
        </table>
      </div>`;
  }

  function row(t) {
    const over = isOverdue(t);
    const cls = t.status === "done" || t.status === "cancelled" ? "done" : "";
    const due = t.due_on
      ? new Date(t.due_on).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" })
      : "—";
    return `
      <tr class="${cls}">
        <td>
          ${t.priority === "high" ? '<span class="kp-chip important">高</span> ' : ""}
          ${esc(t.title)}
          ${t.category ? `<span class="muted" style="font-size:11.5px;">　${esc(t.category)}</span>` : ""}
        </td>
        <td>${esc(t.assignee?.display_name || "未割り当て")}</td>
        <td${over ? ' style="color:#b3261e;font-weight:600;"' : ""}>${esc(due)}${over ? " 超過" : ""}</td>
        <td>
          <select onchange="setStatus('${esc(t.id)}', this.value)">
            ${Object.entries(STATUS_LABEL).map(([k, v]) =>
              `<option value="${k}"${t.status === k ? " selected" : ""}>${v}</option>`).join("")}
          </select>
        </td>
        <td style="text-align:right;">
          <button class="icon-btn" title="削除" onclick="remove('${esc(t.id)}')">
            <span class="material-symbols-outlined" style="font-size:18px;">close</span>
          </button>
        </td>
      </tr>`;
  }

  async function setStatus(id, status) {
    try { await API.updateTask({ id, status }); await loadTasks(); }
    catch (e) { alert(e.detail || e.message || "更新に失敗しました"); await loadTasks(); }
  }

  async function remove(id) {
    const t = tasks.find((x) => x.id === id);
    if (!confirm(`「${t ? t.title : ""}」を削除します。よろしいですか？`)) return;
    try { await API.deleteTask(id); await loadTasks(); }
    catch (e) { alert(e.detail || e.message || "削除に失敗しました"); }
  }
</script>

</body>
</html>
