<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>日報コーチ（代表レビュー） - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261020cal1">
  <link rel="stylesheet" href="css/layout.css?v=20261020cal1">
  <style>body { font-family:'Zen Kaku Gothic New', sans-serif; } .material-symbols-outlined { font-family:'Material Symbols Rounded'; }</style>
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 日報コーチの代表レビュー（docs/behavior-coach.md）。代表だけが開ける（API が owner_user_id で止める）。
       ここで見るのは、朝08:00 の定時確認の結果・根拠の版・不足情報・ルール下書き・宛先。送信は既定で無効 */
    .cc-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .cc-tools input, .cc-tools select { width:auto; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; max-width:100%; }
    .cc-sum { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; }
    .cc-sum div { border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; background:#fff; min-width:0; }
    .cc-sum b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
    .cc-sum span { font-size:12px; color:var(--muted); }
    .cc-filter { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
    .cc-filter button { border:1px solid var(--border); background:#fff; border-radius:999px; padding:5px 12px; font:inherit; font-size:12.5px; cursor:pointer; }
    .cc-filter button.on { background:var(--primary); color:#fff; border-color:var(--primary); }
    .cc-person { border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; background:#fff; min-width:0; }
    .cc-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .cc-name { font-weight:700; color:var(--primary-dark); }
    .cc-st { font-size:12px; font-weight:700; border-radius:999px; padding:2px 10px; }
    .cc-st.ok { background:#f0fff4; color:#276749; } .cc-st.check { background:#fffaf0; color:#975a16; }
    .cc-st.action { background:#fff5f5; color:#c53030; } .cc-st.unconfirmed { background:#edf2f7; color:#4a5568; }
    .cc-st.excluded { background:#f7fafc; color:#a0aec0; }
    .cc-meta { font-size:12.5px; color:var(--muted); margin-top:6px; overflow-wrap:anywhere; }
    .cc-reasons { margin:8px 0 0; padding-left:18px; font-size:13px; }
    .cc-draft { white-space:pre-wrap; background:#f7fafc; border-radius:8px; padding:10px; font-size:13px; margin-top:8px; overflow-wrap:anywhere; }
    details.cc-more { margin-top:8px; font-size:12.5px; }
    details.cc-more summary { cursor:pointer; color:var(--primary-dark); }
    .cc-refs { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; table-layout:fixed; }
    .cc-refs td, .cc-refs th { border-bottom:1px solid var(--border); padding:4px 6px; text-align:left; overflow-wrap:anywhere; vertical-align:top; }
    .cc-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
    .cc-note { font-size:12px; color:var(--muted); }
    @media (max-width: 640px) {
      .cc-sum { grid-template-columns:repeat(3, minmax(0,1fr)); }
      .cc-refs th:nth-child(4), .cc-refs td:nth-child(4) { display:none; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">日報コーチ（代表レビュー）</h1>
  <p id="greet-sub" class="kp-greet-sub">前勤務日の日報と、次勤務日の計画の照合結果です。送信は既定で無効です。</p>

  <div id="notice"></div>

  <div class="card">
    <div class="cc-tools">
      <label>確認日 <input type="date" id="cc-date"></label>
      <select id="cc-mode" aria-label="確認の種類">
        <option value="morning">朝 08:00 の確認</option>
        <option value="provisional">17:30 暫定確認</option>
        <option value="weekly">月曜の週次確認</option>
      </select>
      <button class="btn btn-secondary btn-sm" id="cc-load"><span class="material-symbols-outlined">refresh</span>表示</button>
      <button class="btn btn-primary btn-sm" id="cc-run"><span class="material-symbols-outlined">play_arrow</span>この日の確認を今すぐ実行</button>
    </div>
    <p class="cc-note" style="margin:10px 0 0;">定時の実行は P の定時タスク（08:00・17:30・月曜08:00）が行います。ここでの実行は同じ処理で、同じ版なら新しい候補は作りません。</p>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">groups</span>名簿全体</h2>
    <div class="cc-sum" id="cc-sum"></div>
    <p class="cc-note" id="cc-consistency"></p>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">fact_check</span>メンバー別</h2>
    <div class="cc-filter" id="cc-filter"></div>
    <div id="cc-list"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">outgoing_mail</span>送信候補（代表DM・日報チャンネル）</h2>
    <p class="cc-note">チーム向けは個人名・件数を含まない定型文だけです。どれも代表の承認と、送信の有効化（別承認）がそろうまで送りません。</p>
    <div id="cc-outbox"></div>
  </div>
</div>

<script src="js/api-client.js?v=20261020cal1"></script>
<script src="js/device.js?v=20261020cal1"></script>
<script src="js/layout.js?v=20261020cal1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const STATUS = { ok: "順調", check: "要確認", action: "要対応", unconfirmed: "未確認", excluded: "対象外" };
  const MODE = { morning: "朝の確認", provisional: "17:30 暫定", weekly: "週次" };
  const BLOCK = {
    coach_delivery_disabled: "送信は無効です（DB の delivery_enabled が false）",
    coach_send_env_off: "送信は無効です（環境変数 NIPPO_COACH_SEND_ENABLED が未設定）",
    coach_slack_not_configured: "Slack の bot トークン・workspace が未設定です",
    slack_team_mismatch: "Slack の workspace が設定と一致しません",
    slack_preflight_required: "Slack の事前確認（preflight）が未実施か、設定変更で無効になりました",
  };
  let data = null, filter = "attention";

  const jstToday = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  el("cc-date").value = jstToday();
  el("cc-date").max = jstToday();

  KPLayout.init({ active: "nippo", roles: ["admin", "owner"] }).then((ctx) => { if (ctx) load(); });
  el("cc-load").onclick = () => load();
  el("cc-run").onclick = () => runNow();

  function notice(kind, text) {
    el("notice").innerHTML = text ? `<div class="banner ${kind}"><span class="material-symbols-outlined">${kind === "err" ? "error" : "info"}</span><div>${esc(text)}</div></div>` : "";
  }
  const errText = (e) => ({
    owner_only: "この画面は、設定された代表だけが開けます。",
    coach_disabled: "日報コーチは無効です（設定の enabled が false）。",
    coach_setup_required: "日報コーチの表がまだありません（SQL 未適用）。",
    coach_morning_disabled: "定時確認は無効です（morning_enabled が false）。",
    run_in_progress: "いま別の確認が実行中です。少し待ってから表示してください。",
  }[e?.error] || e?.hint || e?.detail || e?.message || "取得できませんでした");

  async function load() {
    const q = new URLSearchParams({ view: "checks", date: el("cc-date").value, mode: el("cc-mode").value });
    try { data = await API.api(`/api/nippo/coach?${q}`); }
    catch (e) { notice("err", errText(e)); data = null; render(); return; }
    const b = data.settings?.deliveryBlockedBy;
    notice(b ? "warn" : "ok", b ? `${BLOCK[b] || b}。承認しても送信されません。` : "送信は有効です。承認済みの候補だけが、ボタン操作で1回だけ送られます。");
    render();
  }

  async function runNow() {
    el("cc-run").disabled = true;
    try {
      const r = await API.api("/api/nippo/coach", { method: "POST", body: { action: "morning", date: el("cc-date").value, mode: el("cc-mode").value } });
      notice("info", `確認しました：新規 ${r.created} ／ 変更 ${r.changed} ／ 変化なし ${r.unchanged}（下書きの更新 ${r.reviewsWritten}）`);
      await load();
    } catch (e) { notice("err", errText(e)); }
    finally { el("cc-run").disabled = false; }
  }

  function render() {
    const s = data?.summary || {};
    el("cc-sum").innerHTML = [["名簿", s.total], ["順調", s.ok], ["要確認", s.check], ["要対応", s.action], ["未確認", s.unconfirmed], ["対象外", s.excluded]]
      .map(([k, v]) => `<div><b>${v ?? "—"}</b><span>${k}</span></div>`).join("");
    el("cc-consistency").textContent = data ? (s.total ? `確認済み ${s.checked} ＋ 未確認 ${s.unconfirmed} ＋ 対象外 ${s.excluded} ＝ 名簿 ${s.total}${s.consistent ? "（一致）" : "（不一致：確認が必要）"}。未確認は本人の問題ではありません。` : "この日・この種類の確認結果はまだありません。") : "";
    const chips = [["attention", "要対応・要確認"], ["unconfirmed", "未確認"], ["all", "全員"]];
    el("cc-filter").innerHTML = chips.map(([k, l]) => `<button class="${filter === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("");
    el("cc-filter").querySelectorAll("button").forEach((b) => { b.onclick = () => { filter = b.dataset.f; render(); }; });
    const reviews = new Map((data?.reviews || []).map((r) => [r.id, r]));
    const order = { action: 0, check: 1, unconfirmed: 2, ok: 3, excluded: 4 };
    const rows = (data?.checks || []).filter((c) => filter === "all" || (filter === "attention" ? ["action", "check"].includes(c.status) : c.status === filter))
      .sort((a, b) => order[a.status] - order[b.status] || a.name.localeCompare(b.name, "ja"));
    el("cc-list").innerHTML = rows.length ? rows.map((c) => person(c, reviews.get(c.review_id))).join("") : `<div class="empty">該当する人はいません。</div>`;
    el("cc-list").querySelectorAll("[data-approve]").forEach((b) => { b.onclick = () => approve(b.dataset.approve); });
    el("cc-outbox").innerHTML = (data?.outbox || []).length ? data.outbox.map(outbox).join("") : `<div class="empty">送信候補はありません。</div>`;
    el("cc-outbox").querySelectorAll("[data-oapprove]").forEach((b) => { b.onclick = () => approveOutbox(b.dataset.oapprove); });
  }

  const fmt = (v) => (v ? String(v).replace("T", " ").slice(0, 16) : "—");
  function person(c, r) {
    const d = c.detail || {};
    const refs = (d.refs || []).map((x) => `<tr><td>${esc(x.id)}</td><td>${esc(x.source || "")}</td><td>${esc(x.targetDate || x.from || "")}</td><td>${esc(fmt(x.submittedAt))}</td><td>${esc(fmt(x.version || x.updatedAt))}</td></tr>`).join("");
    const draft = r?.draft;
    const target = draft?.target ? `宛先：限定グループ（${esc(draft.target.members.join("・"))}）／送信元 ${esc(draft.target.senderId)}` : (r ? "宛先：未照合（本人への送信はできません）" : "");
    const canApprove = r && r.state === "owner_review" && draft?.targetHash && draft?.needsContact;
    return `<div class="cc-person" data-emp="${esc(c.employee_id)}">
      <div class="cc-head"><span class="cc-name">${esc(c.name || "（名前なし）")}</span><span class="cc-st ${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
        <span class="cc-note">${esc(c.employmentType || "雇用形態未登録")}</span></div>
      <div class="cc-meta">対象の日報：${esc(c.report_date || "—")}${d.workdayBasis === "latest_submitted_report" ? "（勤務曜日未設定のため直近の提出分）" : ""} ／ 次の勤務日：${esc(c.next_workday || "決められない")} ／ 確認：${esc(fmt(c.checked_at))}（版 ${esc(c.revision)}）</div>
      ${c.reasons.length ? `<ul class="cc-reasons">${c.reasons.map((x) => `<li>${esc(x.label)}</li>`).join("")}</ul>` : `<div class="cc-meta">確認事項なし（本人報告ベース。成果物は未照合）</div>`}
      ${d.weekly ? `<div class="cc-meta">先週：勤務日 ${d.weekly.workdays} ／ 提出 ${d.weekly.submitted} ／ 提出を確認できない日 ${d.weekly.missing} ／ 勤務日か不明 ${d.weekly.unknown}</div>` : ""}
      ${draft ? `<div class="cc-draft">${esc(draft.text)}</div>
        <div class="cc-meta">${target}</div>
        <details class="cc-more"><summary>不足している情報（${(draft.missing || []).length}）・目標の整理（${(draft.goals || []).length}）</summary>
          <ul class="cc-reasons">${(draft.missing || []).map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
          ${(draft.goals || []).map((g) => `<div class="cc-meta">・${esc(g.review.goal.task)}：件数 ${g.review.goal.quantity == null ? "未設定" : esc(g.review.goal.quantity + (g.review.goal.unit || ""))}（${esc(g.review.goal.quantityStatus)}）／ 完了条件 ${esc(g.review.goal.completionCriteria || "未設定")} ／ 不足 ${esc(g.review.missing.join("・"))}</div>`).join("")}
        </details>` : ""}
      <details class="cc-more"><summary>根拠（ID・版・時刻。本文は表示しません）</summary>
        <table class="cc-refs"><thead><tr><th>ID</th><th>元</th><th>対象日</th><th>提出</th><th>版・更新</th></tr></thead><tbody>${refs}</tbody></table>
      </details>
      ${r ? `<div class="cc-actions">${canApprove ? `<button class="btn btn-approve" data-approve="${esc(r.id)}">この本文と宛先で承認</button>` : ""}
        <span class="cc-note">状態：${esc(r.state)}${r.approval ? "（承認済み・未送信）" : ""}。承認しても、送信の有効化までは送られません。</span></div>` : ""}
    </div>`;
  }

  function outbox(o) {
    const kind = o.kind === "owner_report" ? "代表向け報告（代表DM）" : "チーム向けの助言（日報チャンネル）";
    const target = o.target ? (o.target.kind === "owner_dm" ? `代表DM ${esc(o.target.channelId)}（${esc(o.target.userId)}）` : `日報チャンネル ${esc(o.target.channelId)}`) : "宛先が未設定（送れません）";
    return `<div class="cc-person"><div class="cc-head"><span class="cc-name">${kind}</span><span class="cc-st unconfirmed">${esc(o.state)}</span></div>
      <div class="cc-meta">宛先：${target} ／ 世代 ${esc(o.generation)}</div>
      <div class="cc-draft">${esc(o.body)}</div>
      ${o.state === "draft" ? `<div class="cc-actions"><button class="btn btn-approve" data-oapprove="${esc(o.id)}">この本文と宛先で承認</button></div>` : ""}
    </div>`;
  }

  async function approve(id) {
    const r = data.reviews.find((x) => x.id === id);
    if (!r || !confirm("この本文・宛先で承認します。本文・根拠・宛先が変わると承認は無効になります。")) return;
    try {
      const res = await API.api("/api/nippo/coach", { method: "POST", body: { action: "approve", id, draftId: r.draft.id, text: r.draft.text, targetHash: r.draft.targetHash } });
      notice(res.approved ? "ok" : "warn", res.approved ? "承認しました（送信はしていません）。" : "承認できませんでした。再読み込みしてください。");
    } catch (e) { notice("err", errText(e)); }
    await load();
  }

  async function approveOutbox(id) {
    const o = data.outbox.find((x) => x.id === id);
    if (!o || !confirm("この本文・宛先で承認します。変わると承認は無効になります。")) return;
    try {
      const res = await API.api("/api/nippo/coach", { method: "POST", body: { action: "approve_outbox", id, bodyHash: o.body_hash, targetHash: o.target_hash, generation: o.generation } });
      notice(res.approved ? "ok" : "warn", res.approved ? "承認しました（送信はしていません）。" : "承認できませんでした。");
    } catch (e) { notice("err", errText(e)); }
    await load();
  }
</script>

</body>
</html>
