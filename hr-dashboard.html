<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>ダッシュボード - EIGHT HR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260916m">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.hr-title { font-size:24px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .hr-sub { color:#6b7080; font-size:13px; margin:0 0 22px; }
    .hr-sec-h { font-size:15px; font-weight:700; color:#1b2440; margin:0 0 10px; }

    .hr-today { display:grid; gap:10px; margin-bottom:26px; }
    .hr-today-top { background:#e6f050; border-radius:10px; padding:16px 18px; display:flex;
      align-items:center; gap:14px; cursor:pointer; }
    .hr-today-top .material-symbols-outlined { font-size:28px; color:#1b2440; }
    .hr-today-top b { font-size:15px; color:#1b2440; }
    .hr-today-top .n { font-size:12px; color:#4a5068; }
    .hr-today-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
    .hr-today-card { background:#fff; border:1px solid #e2e2dc; border-radius:9px; padding:12px 14px; cursor:pointer; font-size:12.5px; }
    .hr-today-card b { display:block; color:#1b2440; font-size:13px; margin-bottom:3px; }
    .hr-today-card .n { color:#6b7080; }

    .hr-funnel { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; }
    .hr-funnel .step { flex:1; min-width:110px; background:#fff; border:1px solid #e2e2dc; border-radius:9px;
      padding:12px; text-align:center; }
    .hr-funnel .step .v { font-size:22px; font-weight:700; color:#1b2440; }
    .hr-funnel .step .l { font-size:11px; color:#6b7080; margin-top:2px; }
    .hr-auto { font-size:11px; color:#9aa0b4; margin:8px 0 26px; }

    .hr-kpi { display:flex; background:#fff; border:1px solid #e2e2dc; border-radius:9px; margin-bottom:26px; }
    .hr-kpi .b { flex:1; padding:14px; text-align:center; border-right:1px solid #e2e2dc; }
    .hr-kpi .b:last-child { border-right:none; }
    .hr-kpi .v { font-size:20px; font-weight:700; color:#1b2440; }
    .hr-kpi .l { font-size:11px; color:#6b7080; margin-top:3px; }

    .hr-list-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #e2e2dc;
      cursor:pointer; font-size:13px; }
    .hr-list-row:last-child { border-bottom:none; }
    .hr-list-row .nm { font-weight:700; color:#1b2440; flex:1; }
    .hr-list-row .st { color:#6b7080; font-size:12px; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="hr-title">ダッシュボード</h1>
  <p class="hr-sub">今日、何をすべきかが分かります。</p>

  <div class="hr-sec-h">TODAY'S ACTION</div>
  <div class="hr-today" id="today"></div>

  <div class="hr-sec-h">採用ファネル</div>
  <div class="hr-funnel" id="funnel"></div>
  <div class="hr-auto">TimeRex → Google Meet → Google Drive → Slack（自動連携）</div>

  <div class="hr-kpi" id="kpi"></div>

  <div class="hr-sec-h">応募者一覧</div>
  <div class="card"><div id="list"></div></div>
</div>

<script src="js/api-client.js?v=20260916m"></script>
<script src="js/layout.js?v=20260916m"></script>
<script src="js/hr-layout.js?v=20260916m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = HRLayout.esc;

  const STAGES = [
    { key: "applied", label: "応募" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "ceo_recommend", label: "社長推薦" }, { key: "ceo_interview", label: "社長面談" },
    { key: "offer", label: "内定" }, { key: "joining_scheduled", label: "入社予定" },
  ];

  let applicants = [];

  HRLayout.init({ active: "dashboard" }).then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const res = await API.listHrApplicants();
      applicants = res.applicants || [];
      render();
    } catch (e) {
      el("today").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  function render() {
    renderToday();
    renderFunnel();
    renderKpi();
    renderList();
  }

  function renderToday() {
    const open = applicants.filter((a) => !["accepted", "declined", "done", "passed"].includes(a.status));
    const overdue = open.filter((a) => a.overdue);
    const byNext = {};
    for (const a of open) {
      if (!a.nextAction) continue;
      (byNext[a.nextAction] = byNext[a.nextAction] || []).push(a);
    }
    const cards = Object.entries(byNext).sort((a, b) => b[1].length - a[1].length);

    if (!cards.length) {
      el("today").innerHTML = `<div class="empty">いまのところ、対応が必要なものはありません。</div>`;
      return;
    }
    const [firstLabel, firstList] = cards[0];
    el("today").innerHTML = `
      <div class="hr-today-top" onclick="location.href='hr-applicants.html'">
        <span class="material-symbols-outlined">bolt</span>
        <div><b>${esc(firstLabel)}</b><div class="n">${esc(firstList.map((a) => a.name).slice(0, 3).join("・"))}
          ${firstList.length}件${overdue.length ? `　期限超過 ${overdue.length}件` : ""}</div></div>
      </div>
      <div class="hr-today-grid">${cards.slice(1).map(([label, list]) => `
        <div class="hr-today-card" onclick="location.href='hr-applicants.html'">
          <b>${esc(label)}</b><span class="n">${esc(list.map((a) => a.name).slice(0, 2).join("・"))} ${list.length}件</span>
        </div>`).join("")}</div>`;
  }

  function renderFunnel() {
    el("funnel").innerHTML = STAGES.map((s) => {
      const n = applicants.filter((a) => a.stage === s.key).length;
      return `<div class="step"><div class="v">${n}</div><div class="l">${esc(s.label)}</div></div>`;
    }).join("");
  }

  function renderKpi() {
    const thisMonth = new Date().toISOString().slice(0, 7);
    const inMonth = (a, key) => (a.createdAt || "").slice(0, 7) === thisMonth;
    el("kpi").innerHTML = [
      ["新規応募", applicants.filter((a) => a.createdAt?.slice(0, 7) === thisMonth).length],
      ["カジュアル面談", applicants.filter((a) => a.stage === "casual_interview" || (a.interviewCount || 0) > 0).length],
      ["社長推薦", applicants.filter((a) => ["ceo_recommend", "ceo_interview", "offer", "joining_scheduled"].includes(a.stage)).length],
      ["社長面談", applicants.filter((a) => ["ceo_interview", "offer", "joining_scheduled"].includes(a.stage)).length],
      ["今月内定", applicants.filter((a) => a.stage === "offer" && a.updatedAt?.slice(0, 7) === thisMonth).length],
    ].map(([l, v]) => `<div class="b"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join("");
  }

  function renderList() {
    if (!applicants.length) { el("list").innerHTML = `<div class="empty">まだ応募者がいません。</div>`; return; }
    el("list").innerHTML = applicants.slice(0, 20).map((a) => `
      <div class="hr-list-row" onclick="location.href='hr-applicants.html?id=${esc(a.id)}'">
        <span class="nm">${esc(a.name)}</span><span class="st">${esc(a.stageLabel)} ／ ${esc(a.statusLabel)}</span>
        <span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span>
      </div>`).join("");
  }
</script>

</body>
</html>
