<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>予定 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910z">
  <link rel="stylesheet" href="css/layout.css?v=20260910z">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">予定</h1>
  <p class="kp-greet-sub">自分の予定です。<b>他の人には見えません</b>（管理者・経営者にも見えません）。</p>

  <div id="gate"></div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="kp-week">
        <button class="nav" onclick="shiftWeek(-1)" title="前の週">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <div id="days" class="kp-days"></div>
        <button class="nav" onclick="shiftWeek(1)" title="次の週">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <b id="day-title" style="font-size:15px;color:var(--primary-dark);">　</b>
        <button class="btn btn-secondary btn-sm" onclick="goToday()">今日</button>
        <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="openForm()">
          <span class="material-symbols-outlined icon-inline">add</span>予定を追加
        </button>
      </div>

      <div id="events" class="kp-events"><div class="empty">読み込み中…</div></div>
    </div>

    <!-- 予定の入力。追加と編集で同じ枠を使う -->
    <div id="form-card" class="card hidden">
      <h2><span class="material-symbols-outlined">edit_calendar</span><span id="form-title">予定を追加</span></h2>

      <div style="margin-bottom:12px;">
        <label>件名</label>
        <input id="f-title" type="text" maxlength="200" placeholder="例: A社と打ち合わせ">
      </div>

      <div class="inline-controls" style="margin-bottom:12px;">
        <div style="max-width:150px;"><label>日付</label><input id="f-date" type="date"></div>
        <div style="max-width:120px;"><label>開始</label><input id="f-start" type="time" step="900"></div>
        <div style="max-width:120px;"><label>終了</label><input id="f-end" type="time" step="900"></div>
        <div style="max-width:150px;">
          <label>種類</label>
          <select id="f-category">
            <option value="work">仕事</option>
            <option value="meeting">打ち合わせ</option>
            <option value="visit">訪問・外出</option>
            <option value="private">私用</option>
            <option value="other">その他</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:normal;">
          <input id="f-allday" type="checkbox" style="width:auto;margin:0;" onchange="onAllDayChange()">
          終日
        </label>
      </div>

      <div class="inline-controls" style="margin-bottom:12px;">
        <div style="min-width:200px;flex:1;"><label>場所（任意）</label><input id="f-location" type="text" placeholder="本社 会議スペース／オンライン"></div>
      </div>
      <div style="margin-bottom:14px;">
        <label>メモ（任意）</label>
        <textarea id="f-body" rows="3" placeholder="持ち物、相手先の連絡先など"></textarea>
      </div>

      <div id="f-push-wrap" class="hidden" style="margin-bottom:14px;">
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:normal;">
          <input id="f-push" type="checkbox" style="width:auto;margin:0;">
          保存したら、そのままGoogleカレンダーにも入れる
        </label>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button id="btn-save" class="btn btn-primary" onclick="save(this)">
          <span class="material-symbols-outlined icon-inline">save</span>保存
        </button>
        <button class="btn btn-secondary" onclick="closeForm()">やめる</button>
      </div>
      <div id="form-msg" class="err-text"></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">sync</span>Googleカレンダーとの連携</h2>
      <div id="gcal"><div class="empty">確認中…</div></div>
      <p class="muted" style="font-size:12.5px;margin:14px 0 0;">
        連携すると、Googleカレンダーの予定をこの画面に出せます。あわせて、
        ここで入れた予定を<b>あなたのGoogleカレンダーへ書き出す</b>ことができます。
        書き出すのは、あなたがボタンを押した予定だけです。
        連携した予定は<b>あなたにしか見えません</b>（管理者・経営者にも見えません）。
      </p>
    </div>
  </div>
</div>

<script src="js/api-client.js?v=20260910z"></script>
<script src="js/layout.js?v=20260910z"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const CATEGORY_LABEL = { work: "仕事", meeting: "打ち合わせ", visit: "訪問・外出", private: "私用", other: "その他" };

  let weekStart = null;   // 表示中の週の月曜（ローカル日付）
  let selected = null;    // 選択中の日 "YYYY-MM-DD"
  let data = { events: [], bookings: [], tasks: [], external: { connected: false, events: [] } };
  let editingId = null;

  KPLayout.init({ active: "menu", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    if (!ctx.me?.gw?.employee) {
      el("gate").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていないため、予定を使えません。管理者に登録を依頼してください。</div></div>`;
      return;
    }
    el("main").classList.remove("hidden");
    showCallbackResult();
    goToday();
    loadGoogle();
  }

  // 連携から戻ってきた直後の一言。URLに結果が残り続けないよう消しておく
  function showCallbackResult() {
    const p = new URLSearchParams(location.search).get("gcal");
    if (!p) return;
    history.replaceState(null, "", location.pathname);
    const msg = {
      ok: ["ok", "Googleカレンダーと連携しました。"],
      cancelled: ["warn", "連携をやめました。"],
      expired: ["warn", "時間が経ちすぎたため、やり直してください。"],
      no_refresh_token: ["warn", "連携の許可が受け取れませんでした。もう一度お試しください。"],
      failed: ["err", "連携できませんでした。しばらくしてからお試しください。"],
      bad_request: ["err", "連携できませんでした。もう一度お試しください。"],
    }[p] || ["warn", "連携の結果が分かりませんでした。"];

    el("gate").innerHTML =
      `<div class="banner ${msg[0]}" style="margin-bottom:18px;">
         <span class="material-symbols-outlined">${msg[0] === "ok" ? "check_circle" : "info"}</span>
         <div>${esc(msg[1])}</div></div>`;
  }

  // ---- 日付の扱い -----------------------------------------------------------
  // 端末の時計をそのまま使う。社内で使う前提なので日本時間で動く。
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfWeek = (d) => {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    // 月曜はじまり。日曜(0)は前の週の扱いにする
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  };

  function goToday() {
    const now = new Date();
    weekStart = startOfWeek(now);
    selected = ymd(now);
    load();
  }

  function shiftWeek(n) {
    weekStart = addDays(weekStart, n * 7);
    // 週を送ったら、その週の同じ曜日を選ぶ（選択が週の外に残らないように）
    const offset = (new Date(selected + "T00:00:00").getDay() + 6) % 7;
    selected = ymd(addDays(weekStart, offset));
    load();
  }

  function pickDay(d) { selected = d; render(); }

  // ---- 取得 -----------------------------------------------------------------
  async function load() {
    renderWeek();
    el("events").innerHTML = `<div class="empty">読み込み中…</div>`;
    const from = `${ymd(weekStart)}T00:00:00+09:00`;
    const to = `${ymd(addDays(weekStart, 7))}T00:00:00+09:00`;
    try {
      // data.googleLink は書き出しボタンを出すかどうかの判断に使う。
      // 連携カードの表示は loadGoogle() が持っている（あちらは
      // OAuth 自体の設定有無まで見ているので、こちらで上書きしない）
      data = await API.schedule(from, to);
      render();
    } catch (e) {
      el("events").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  // ---- 描画 -----------------------------------------------------------------
  function renderWeek() {
    const today = ymd(new Date());
    el("days").innerHTML = [...Array(7)].map((_, i) => {
      const d = addDays(weekStart, i);
      const key = ymd(d);
      const wd = d.getDay();
      const cls = [
        "kp-day",
        key === selected ? "on" : "",
        key === today ? "today" : "",
        wd === 6 ? "sat" : "", wd === 0 ? "sun" : "",
      ].filter(Boolean).join(" ");
      const n = countFor(key);
      return `
        <div class="${cls}" onclick="pickDay('${key}')">
          <span class="w">${WD[wd]}</span>
          <span class="n">${d.getDate()}</span>
          <span class="dots">${"<i></i>".repeat(Math.min(n, 3))}</span>
        </div>`;
    }).join("");
  }

  const onDay = (iso, key) => ymd(new Date(iso)) === key;

  function countFor(key) {
    return (data.events || []).filter((e) => onDay(e.starts_at, key)).length
      + (data.bookings || []).filter((b) => onDay(b.starts_at, key)).length
      + (data.external?.events || []).filter((g) => onDay(g.startsAt, key)).length
      + (data.tasks || []).filter((t) => t.due_on === key).length;
  }

  const hhmm = (iso) =>
    new Date(iso).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });

  function render() {
    renderWeek();
    const d = new Date(selected + "T00:00:00");
    el("day-title").textContent =
      `${d.toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })}（${WD[d.getDay()]}）`;

    const rows = [];

    for (const e of (data.events || []).filter((x) => onDay(x.starts_at, selected))) {
      rows.push({
        sort: e.all_day ? "" : e.starts_at,
        html: `
          <div class="kp-event ${esc(e.category)}">
            <span class="tm">${e.all_day ? "終日" : esc(hhmm(e.starts_at))}
              ${e.all_day ? "" : `<small>${esc(hhmm(e.ends_at))}</small>`}</span>
            <span class="ct">
              <b>${esc(e.title)}</b>
              <small>${esc(CATEGORY_LABEL[e.category] || "")}${e.location ? `／${esc(e.location)}` : ""}${
                e.gcal_event_id ? '／<span style="color:var(--primary);font-weight:600;">Googleに反映済み</span>' : ""}</small>
              ${e.body ? `<small>${esc(e.body)}</small>` : ""}
            </span>
            <span class="row-actions">
              ${gcalButton(e)}
              <button class="icon-btn" title="直す" onclick="openForm('${esc(e.id)}')">
                <span class="material-symbols-outlined">edit</span></button>
              <button class="icon-btn" title="消す" onclick="remove('${esc(e.id)}')">
                <span class="material-symbols-outlined">delete</span></button>
            </span>
          </div>`,
      });
    }

    for (const b of (data.bookings || []).filter((x) => onDay(x.starts_at, selected))) {
      rows.push({
        sort: b.starts_at,
        html: `
          <div class="kp-event booking readonly">
            <span class="tm">${esc(hhmm(b.starts_at))}<small>${esc(hhmm(b.ends_at))}</small></span>
            <span class="ct">
              <b>${esc(b.title)}</b>
              <small>${esc(b.space?.name || "スペース予約")}${b.status === "pending" ? "／承認待ち" : ""}</small>
            </span>
            <span class="row-actions">
              <a class="btn btn-secondary btn-sm" href="booking.html">予約</a>
            </span>
          </div>`,
      });
    }

    for (const g of (data.external?.events || []).filter((x) => onDay(x.startsAt, selected))) {
      rows.push({
        sort: g.allDay ? "" : g.startsAt,
        html: `
          <div class="kp-event google readonly">
            <span class="tm">${g.allDay ? "終日" : esc(hhmm(g.startsAt))}
              ${g.allDay || !g.endsAt ? "" : `<small>${esc(hhmm(g.endsAt))}</small>`}</span>
            <span class="ct">
              <b>${esc(g.title)}</b>
              <small>Googleカレンダー${g.location ? `／${esc(g.location)}` : ""}</small>
            </span>
            ${g.link ? `<span class="row-actions">
              <a class="icon-btn" href="${esc(g.link)}" target="_blank" rel="noopener" title="Googleカレンダーで開く">
                <span class="material-symbols-outlined">open_in_new</span></a></span>` : ""}
          </div>`,
      });
    }

    for (const t of (data.tasks || []).filter((x) => x.due_on === selected)) {
      rows.push({
        sort: "zz",   // 期限は時刻を持たないので、その日の最後にまとめる
        html: `
          <div class="kp-event task readonly">
            <span class="tm">期限</span>
            <span class="ct">
              <b>${esc(t.title)}</b>
              <small>やること${t.category ? `／${esc(t.category)}` : ""}${t.priority === "high" ? "／重要" : ""}</small>
            </span>
            <span class="row-actions">
              <a class="btn btn-secondary btn-sm" href="tasks.html">やること</a>
            </span>
          </div>`,
      });
    }

    el("events").innerHTML = rows.length
      ? rows.sort((a, b) => a.sort.localeCompare(b.sort)).map((r) => r.html).join("")
      : `<div class="empty">この日の予定はありません。</div>`;
  }

  // ---- Googleカレンダーへの書き出し -----------------------------------------
  // 連携していない・読むだけの権限でつないである場合は、ボタン自体を出さない。
  // 押してから「できません」と言われるより、出さないほうが分かりやすい
  function gcalButton(e) {
    const g = data.googleLink || {};
    if (!g.connected || !g.canWrite) return "";
    return e.gcal_event_id
      ? `<button class="icon-btn" title="Googleカレンダーから取り消す"
                 onclick="pushToGoogle('${esc(e.id)}', true, this)">
           <span class="material-symbols-outlined" style="color:var(--primary);">event_available</span></button>`
      : `<button class="icon-btn" title="Googleカレンダーに入れる"
                 onclick="pushToGoogle('${esc(e.id)}', false, this)">
           <span class="material-symbols-outlined">event_upcoming</span></button>`;
  }

  async function pushToGoogle(id, undo, btn) {
    const e = (data.events || []).find((x) => x.id === id);
    if (undo && !confirm(`「${e ? e.title : ""}」をGoogleカレンダーから取り消します。\n社内の予定は残ります。よろしいですか？`)) return;
    // アイコンだけのボタンなので、KPLayout.busy の文字は入らない。
    // アイコンを回転に差し替えて待たせる
    const before = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined kp-spin">progress_activity</span>';
    try {
      await API.syncEventToGoogle(id, undo ? "unpush" : "push");
      await load();
    } catch (err) {
      btn.innerHTML = before;
      btn.disabled = false;
      alert(err.hint || err.detail || err.message || "Googleカレンダーに反映できませんでした");
    }
  }

  // ---- 入力 -----------------------------------------------------------------
  function openForm(id) {
    editingId = id || null;
    el("form-card").classList.remove("hidden");
    el("form-title").textContent = id ? "予定を直す" : "予定を追加";
    el("form-msg").textContent = "";

    const e = id ? (data.events || []).find((x) => x.id === id) : null;
    if (e) {
      el("f-title").value = e.title;
      el("f-body").value = e.body || "";
      el("f-location").value = e.location || "";
      el("f-category").value = e.category;
      el("f-allday").checked = e.all_day;
      el("f-date").value = ymd(new Date(e.starts_at));
      el("f-start").value = hhmm(e.starts_at);
      el("f-end").value = hhmm(e.ends_at);
    } else {
      el("f-title").value = "";
      el("f-body").value = "";
      el("f-location").value = "";
      el("f-category").value = "work";
      el("f-allday").checked = false;
      el("f-date").value = selected;
      el("f-start").value = "10:00";
      el("f-end").value = "11:00";
    }
    // Googleへ書き出せる状態のときだけチェック欄を出す
    const g = data.googleLink || {};
    el("f-push-wrap").classList.toggle("hidden", !(g.connected && g.canWrite));
    // 既に書き出してある予定は、保存すれば自動で向こうも直る。外させない
    el("f-push").checked = e ? !!e.gcal_event_id : false;
    el("f-push").disabled = !!(e && e.gcal_event_id);

    onAllDayChange();
    el("form-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function closeForm() { el("form-card").classList.add("hidden"); editingId = null; }

  function onAllDayChange() {
    const off = el("f-allday").checked;
    el("f-start").disabled = off;
    el("f-end").disabled = off;
  }

  async function save(btn) {
    const msg = el("form-msg");
    msg.textContent = "";
    const title = el("f-title").value.trim();
    const date = el("f-date").value;
    if (!title) { msg.textContent = "件名を入力してください"; return; }
    if (!date) { msg.textContent = "日付を選んでください"; return; }

    const allDay = el("f-allday").checked;
    const start = allDay ? "00:00" : el("f-start").value;
    const end = allDay ? "23:59" : el("f-end").value;
    if (!allDay && (!start || !end || end < start)) {
      msg.textContent = "終了は開始より後にしてください"; return;
    }

    const payload = {
      title,
      body: el("f-body").value.trim() || null,
      location: el("f-location").value.trim() || null,
      category: el("f-category").value,
      allDay,
      startsAt: `${date}T${start}:00+09:00`,
      endsAt: `${date}T${end}:00+09:00`,
    };

    payload.pushToGoogle = !el("f-push-wrap").classList.contains("hidden") && el("f-push").checked;

    try {
      const res = await KPLayout.busy(btn, "保存中…", () =>
        editingId ? API.updateEvent({ id: editingId, ...payload }) : API.createEvent(payload));
      // 社内には保存できたが Google へ入らなかった場合。黙って落とさない
      if (res?.google && res.google.ok === false) {
        alert("予定は保存しましたが、Googleカレンダーには入りませんでした。\n\n"
          + (res.google.hint || res.google.detail || ""));
      }
      closeForm();
      selected = date;
      // 週の外に保存したら、その週へ移す
      const d = new Date(date + "T00:00:00");
      if (d < weekStart || d >= addDays(weekStart, 7)) weekStart = startOfWeek(d);
      await load();
    } catch (e) {
      msg.textContent = e.hint || e.detail || e.message || "保存できませんでした";
    }
  }

  // ---- Googleカレンダー連携 -------------------------------------------------
  async function loadGoogle() {
    try {
      renderGoogle(await API.googleLink());
    } catch (e) {
      el("gcal").innerHTML =
        `<div class="empty">状態を確認できませんでした：${esc(e.detail || e.message)}</div>`;
    }
  }

  function renderGoogle(s) {
    if (!s.configured) {
      el("gcal").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">link_off</span>
           <div>この機能はまだ使えません。管理者に設定を依頼してください。</div></div>`;
      return;
    }

    if (!s.connected) {
      el("gcal").innerHTML = `
        <p class="muted" style="font-size:13px;margin:0 0 12px;">
          自分のGoogleカレンダーの予定をこの画面に出したり、ここで入れた予定を
          Googleカレンダーへ書き出したりできます。
          ボタンを押すとGoogleの確認画面が開くので、<b>会社のアカウント</b>で許可してください。
        </p>
        <button id="gcal-btn" class="btn btn-primary" onclick="connectGoogle(this)">
          <span class="material-symbols-outlined icon-inline">link</span>Googleカレンダーと連携する
        </button>`;
      return;
    }

    el("gcal").innerHTML = `
      <div class="banner ok" style="margin-bottom:12px;">
        <span class="material-symbols-outlined">check_circle</span>
        <div><b>${esc(s.email || "Googleアカウント")}</b> と連携しています。</div>
      </div>
      ${s.canWrite ? "" : `
        <div class="banner warn" style="margin-bottom:12px;">
          <span class="material-symbols-outlined">upload</span>
          <div><b>書き出しはまだ使えません。</b>
            読み取りだけの許可でつないでいます。「つなぎ直す」を押して、
            Googleの画面で<b>予定の追加・変更</b>にも許可を出してください。</div>
        </div>`}
      ${s.error ? `
        <div class="banner warn" style="margin-bottom:12px;">
          <span class="material-symbols-outlined">warning</span>
          <div>予定を取得できませんでした。連携し直してください。<br>
            <span class="muted" style="font-size:12px;">${esc(s.error)}</span></div>
        </div>` : ""}
      <button class="btn ${s.canWrite ? "btn-secondary" : "btn-primary"}" onclick="connectGoogle(this)">
        <span class="material-symbols-outlined icon-inline">sync</span>つなぎ直す
      </button>
      <button class="btn btn-secondary" onclick="disconnectGoogle(this)">
        <span class="material-symbols-outlined icon-inline">link_off</span>連携をやめる
      </button>`;
  }

  async function connectGoogle(btn) {
    try {
      const s = await KPLayout.busy(btn, "準備中…", () => API.googleLink());
      if (!s.authUrl) { alert("連携の準備ができていません。管理者にご連絡ください。"); return; }
      location.href = s.authUrl;
    } catch (e) {
      alert(e.hint || e.detail || e.message || "連携を始められませんでした");
    }
  }

  async function disconnectGoogle(btn) {
    if (!confirm("Googleカレンダーとの連携をやめます。予定はこの画面に出なくなります。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "解除中…", () => API.googleUnlink());
      await Promise.all([loadGoogle(), load()]);
    } catch (e) {
      alert(e.detail || e.message || "解除できませんでした");
    }
  }

  async function remove(id) {
    const e = (data.events || []).find((x) => x.id === id);
    if (!confirm(`「${e ? e.title : ""}」を消します。よろしいですか？`)) return;
    try {
      const res = await API.deleteEvent(id);
      // 社内からは消えたが Google に残った場合。黙って食べない
      if (res?.google && res.google.ok === false) {
        alert("社内の予定は消しましたが、Googleカレンダー側は消せませんでした。\n\n"
          + (res.google.hint || res.google.detail || "") + "\n\nGoogleカレンダーで直接消してください。");
      }
      await load();
    } catch (err) { alert(err.detail || err.message || "消せませんでした"); }
  }
</script>

</body>
</html>
