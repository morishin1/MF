<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>採用ダッシュボード - EIGHT HR</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261114portal2">
<link rel="stylesheet" href="../css/hr-applicant-overview.css?v=20261116overview1">
<style>
.material-symbols-outlined{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:21px;line-height:1;letter-spacing:normal;font-feature-settings:"liga";display:inline-block;vertical-align:middle}
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1b2440;background:#f6f6f2}
.hr-home{width:min(1330px,100%);margin:auto;padding:24px 20px 70px;box-sizing:border-box}
.hr-home h1{font-size:24px;margin:0 0 4px}.hr-home p{color:#596175;font-size:13px;margin:0}
.hr-home .hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.hr-home a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.hr-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 20px}
.hr-kpi{text-decoration:none;color:inherit}.hr-kpi,.hr-panel{background:#fff;border:1px solid #e1e4e8;border-radius:12px;padding:16px;min-width:0}
.hr-kpi small{display:block;color:#6b7080;font-size:12px}.hr-kpi strong{display:block;font-size:30px;margin-top:5px;font-variant-numeric:tabular-nums}
.hr-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.hr-panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.hr-panel .empty{font-size:13px;color:#777;padding:15px 0}
.hr-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid #eceef0;padding:12px 0;text-decoration:none;color:#1b2440}
.hr-item>div{min-width:0}.hr-item b{display:block;font-size:14px;overflow-wrap:anywhere}.hr-item small{display:block;color:#667085;font-size:12px;margin-top:4px;line-height:1.5}
.hr-item .next{display:inline-flex;max-width:150px;white-space:normal!important;align-items:center;border:1px solid #cfd4df;padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;color:#1b2440}
.hr-item:hover .next{background:#eef2fa}
.hr-home .error{border:1px solid #dbb1b1;background:#fff2f2;color:#8b2c2c;padding:14px;border-radius:9px}
.hr-home .quick{display:flex;gap:8px;flex-wrap:wrap}.hr-home .quick a{border:1px solid #d5d9e0;border-radius:8px;padding:9px 12px;text-decoration:none;background:white;color:#1b2440;font-size:12px}
@media(max-width:880px){.hr-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hr-panels{grid-template-columns:1fr}}
@media(max-width:560px){.hr-home{padding:18px 10px}.hr-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hr-kpi strong{font-size:24px}}
.hr-category-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.hr-category-grid a{color:#354760;text-decoration:none;background:#f7f9fc;border:1px solid #e0e6ee;border-radius:8px;padding:12px 10px;font-size:12px;overflow-wrap:anywhere}
.hr-category-grid b{display:block;font-size:22px;margin-top:6px}.hr-home .meta{display:flex;gap:12px;align-items:center;font-size:12px;color:#65738a;margin:0 0 14px}
.hr-home #hr-home-status:not(:empty){margin-bottom:16px}.hr-home #hr-home-status button{margin-left:10px}
.hr-home [hidden]{display:none!important}.hr-kpi:hover,.hr-category-grid a:hover{border-color:#3787d1;background:#f4f8fd}
.hr-home a:focus-visible,.hr-home button:focus-visible{outline:3px solid #3787d1;outline-offset:3px}
.hr-panel .more{font-size:12px;font-weight:400;color:#2467a9}.hr-item{align-items:start}.hr-home .category-panel{margin-top:16px}
@media(max-width:880px){.hr-category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.hr-category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hr-item{grid-template-columns:minmax(0,1fr)}.hr-item .next{justify-self:start}.hr-kpi{padding:12px}.hr-home h1{font-size:22px}}
</style>
<link rel="stylesheet" href="../css/hr-design.css?v=20261116design1"></head>
<body>
<main class="hr-home">
<div class="hd">
  <div><h1>採用ダッシュボード</h1><p>今日の面談・対応待ち・採用手続きを一画面で確認します。</p></div>
  <div class="quick"><a href="/hr/applicants.html?new=1">＋ 応募者を登録</a><a href="/hr/applicants.html">応募者管理へ</a><a href="/hr/intake.html">応募受付</a><a href="/hr/inbox.html" id="hr-home-history">通知履歴</a></div>
</div>
<a id="hr-inbox-entry" href="/hr/intake.html" class="hr-panel" style="display:block;text-decoration:none;color:inherit;margin-bottom:16px">応募受付：確認中…</a>
<div class="meta"><span id="hr-home-updated">未更新</span><button class="btn btn-secondary btn-sm" id="hr-home-refresh" type="button">再読み込み</button></div>
<div id="hr-home-status" role="status" aria-live="polite">採用状況を読み込んでいます…</div>
<div id="hr-home-content" hidden>
  <section class="hr-kpis" id="hr-home-kpis" aria-label="採用状況"></section>
  <div class="hr-panels">
    <section class="hr-panel"><h2>今日の面談 <span id="count-today"></span></h2><div id="today-interviews"></div></section>
    <section class="hr-panel"><h2>優先して対応する応募者 <span id="count-actions"></span></h2><div id="today-actions"></div><a class="more" href="/hr/applicants.html?scope=priority">優先対応の一覧を開く →</a></section>
  </div>
  <section class="hr-panel category-panel"><h2>採用予定区分の内訳</h2><p>選考中の応募者を、未設定を含めて一人ずつ集計しています。</p><div class="hr-category-grid" id="hr-home-categories"></div></section>
</div>
</main>
<script src="../js/api-client.js?v=20261114portal2"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/hr-layout.js?v=20261114portal2"></script>
<script src="../js/hr-nav-v2.js?v=20261114seven2"></script>
<script src="../js/jst.js?v=20261114portal2"></script>
<script src="../js/hr-applicant-list.js?v=20261115next9"></script>
<script src="../js/hr-hiring-overview.js?v=20261116overview1"></script>
<script>
(function(){
"use strict";
const el=id=>document.getElementById(id);
const esc=s=>HRLayout.esc(String(s==null?"":s));
const href=a=>"/hr/applicants.html?id="+encodeURIComponent(a.id);
function kpi(label,n,url){return '<a class="hr-kpi" href="'+url+'"><small>'+esc(label)+'</small><strong>'+n+'</strong></a>';}
function applicantItem(a){
 const current=HRApplicantList.view(a), guidance=HRApplicantList.guidance(a);
 const next=HRApplicantList.listInterview(a)?'面談・評価を開く':HRApplicantList.pdfUploadTarget(a)?.cta||current.cta;
 return '<a class="hr-item" href="'+href(a)+'"><div><b>'+esc(a.name)+'</b><small>'+esc(a.jobTitle||"職種未設定")+' ／ 担当：'+esc(a.recruiterName||"未定")+'</small><small>'+esc(current.label)+' — '+esc(guidance.instruction)+'</small></div><span class="next">'+esc(next)+'</span></a>';
}
function meetingItem(a){
 const url="/hr/interviews.html?applicantId="+encodeURIComponent(a.applicantId)+"&interviewId="+encodeURIComponent(a.id);
 return '<a class="hr-item" href="'+url+'"><div><b>'+esc(JST.time(a.scheduledAt))+'　'+esc(a.name)+'</b><small>'+esc(a.kindLabel||"面談")+' ／ 担当：'+esc(a.interviewerName||"未定")+'</small></div><span class="next">面談・評価を開く</span></a>';
}
function render(applicants,interviews,interviewError){
 const live=applicants.filter(HRHiringOverview.active);
 el("hr-home-kpis").innerHTML=HRHiringOverview.scopes.filter(x=>x.key!=='priority').map(x=>kpi(x.key==='all'?'選考中の応募者':x.label,live.filter(a=>HRHiringOverview.matches(a,x.key)).length,HRHiringOverview.listUrl(x.key))).join('');
 const categories=[...HRApplicantList.categories,{key:'unassigned',label:'区分未設定'}];
 el('hr-home-categories').innerHTML=categories.map(c=>{
   const n=live.filter(a=>(HRApplicantList.categoryOf(a)||'unassigned')===c.key).length;
   return '<a href="/hr/applicants.html?category='+c.key+'&scope=all">'+esc(c.label)+'<b>'+n+'名</b></a>';
 }).join('');
 const meetingRows=interviews.filter(a=>!a.done&&!a.canceled&&a.id&&a.applicantId&&JST.ymd(a.scheduledAt)===JST.ymd()).sort((a,b)=>String(a.scheduledAt).localeCompare(String(b.scheduledAt)));
 el("count-today").textContent=interviewError?'確認できません':meetingRows.length+"件";
 el("today-interviews").innerHTML=interviewError?'<p class="error">面談予定を取得できません。再読み込みしてください。</p>':meetingRows.length?meetingRows.map(meetingItem).join(""):'<p class="empty">今日の未実施の面談はありません。</p>';
 const actions=live.filter(a=>HRHiringOverview.matches(a,'priority')).sort((a,b)=>Number(Boolean(b.overdue))-Number(Boolean(a.overdue))||(a.priority??9)-(b.priority??9)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
 el("count-actions").textContent=actions.length+"名"+(actions.length>16?'（先頭16名）':'');
 el("today-actions").innerHTML=actions.length?actions.slice(0,16).map(applicantItem).join(""):'<p class="empty">優先対応の応募者はありません。</p>';
 el("hr-home-content").hidden=false;
 el("hr-home-updated").textContent='更新：'+JST.dateTime(new Date())+'（日本時間）';
}
let busy=false;
async function load(){
 if(busy)return; busy=true; el('hr-home-refresh').disabled=true;
 el('hr-home-status').textContent='採用状況を読み込んでいます…';
 const results=await Promise.allSettled([
   API.api('/api/hr/applicants?category=all'),API.todayHrInterviews(),API.api('/api/hr/inbox?count=1')
 ]);
 const [a,i,inbox]=results;
 if(inbox.status==='fulfilled'&&!inbox.value.notReady) {
   const r=inbox.value;
   el('hr-inbox-entry').textContent=`応募受付：未対応 ${r.openCount==null?'確認できません':r.openCount+'件'} ／ 未読 ${r.unreadCount==null?'確認できません':r.unreadCount+'件'} →`;
 }else el('hr-inbox-entry').textContent='応募受付：件数を確認できません →';
 try{
   if(a.status!=='fulfilled')throw a.reason;
   if(a.value.notReady||!Array.isArray(a.value.applicants))throw Error(a.value.message||'応募者を取得できません');
   // Optional trial state is the same enrichment used in the applicant list.
   let stateError=false;
   try{
     const state=await API.api('/api/hr/applicant-state');
     if(!Array.isArray(state.states))throw Error('state unavailable');
     const byId=new Map(state.states.map(x=>[x.id,x]));
     a.value.applicants.forEach(a=>{a.currentTrial=byId.get(a.id)?.currentTrial;});
   }catch{stateError=true;}
   const interviewError=i.status!=='fulfilled'||i.value.notReady||!Array.isArray(i.value.interviews);
   render(a.value.applicants,interviewError?[]:i.value.interviews,interviewError);
   el('hr-home-status').textContent=stateError?'一部の進捗を確認できません。最新のトライアル状態は応募者詳細で確認してください。':'';
 }catch(e){
   el('hr-home-status').innerHTML='<div class="error">採用状況を更新できません：'+esc(e.hint||e.message||'取得に失敗しました')+'。再読み込みしてください。</div>';
 }finally{busy=false;el('hr-home-refresh').disabled=false;}
}
HRLayout.init({active:"home"}).then(ctx=>{if(ctx){el('hr-home-refresh').addEventListener('click',load);load();}});
})();
</script>
</body>
</html>
