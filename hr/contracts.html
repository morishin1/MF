<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>内定・契約 | EIGHT HR</title><link rel="stylesheet" href="../css/app.css?v=20261114hr"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&display=block" rel="stylesheet"><style>body{font-family:system-ui,sans-serif;background:#f6f6f2;color:#1b2440}.material-symbols-outlined{font-family:'Material Symbols Rounded'}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:24px}p{font-size:13px;color:#647084}.contract-card{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:18px;background:#fff;border:1px solid #ddd;border-radius:10px;margin:10px 0;text-decoration:none;color:inherit}.contract-card span{border:1px solid #ddd;padding:8px;border-radius:6px;font-size:13px}</style></head><body><main><h1>内定・契約</h1><p>CEO承認 → 条件設定 → 書類作成・社内確認 → 本人へ送信 → 合意確認 → 契約 → Office引継ぎ</p><div id="contracts" role="status">読み込み中…</div></main><script src="../js/api-client.js?v=20261030officeactions1"></script><script src="../js/layout-marketing.js"></script><script src="../js/hr-layout.js?v=20261030officeactions1"></script><script src="../js/hr-nav-v2.js?v=20261114compact1"></script><script src="../js/hr-applicant-list.js?v=20261114integrated1"></script><script>
HRLayout.init({active:'contracts'}).then(async ctx=>{if(!ctx)return;const el=document.getElementById('contracts'),e=HRLayout.esc;try{const r=await API.listHrApplicants();if(r.notReady)throw Error(r.message);const rows=(r.applicants||[]).filter(a=>!['passed','declined','position_closed'].includes(a.status)&&(a.decision==='hired'||a.pdfFlow||['offer','joining_scheduled'].includes(a.stage)));el.innerHTML=rows.length?rows.map(a=>{const c=HRApplicantList.view(a);return `<a class="contract-card" href="/hr/applicants.html?id=${encodeURIComponent(a.id)}"><div><b>${e(a.name)}</b><p>${e(c.label)}</p></div><span>${e(c.cta)} →</span></a>`;}).join(''):'<p>内定・契約手続き中の応募者はいません。</p>';}catch(err){el.textContent=err.message||'取得できませんでした';}});
</script></body></html>
