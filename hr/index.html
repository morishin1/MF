<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>ダッシュボード - EIGHT HR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260916m">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.hr-title { font-size:24px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .hr-sub { color:#6b7080; font-size:13px; margin:0 0 22px; }
    .hr-sec-h { font-size:15px; font-weight:700; color:#1b2440; margin:0 0 10px; }

    .hr-today { display:grid; gap:8px; margin-bottom:26px; }
    .hr-today-count { font-size:12px; color:#6b7080; margin-bottom:2px; }
    .hr-today-row { background:#fff; border:1px solid #e2e2dc; border-left:3px solid #e6f050; border-radius:9px;
      padding:12px 14px; display:flex; align-items:center; gap:14px; }
    .hr-today-row.overdue { border-left-color:#c0392b; }
    .hr-today-row .info { flex:1; min-width:0; }
    .hr-today-row b { display:block; color:#1b2440; font-size:14px; }
    .hr-today-row .n { color:#4a5068; font-size:12.5px; margin-top:2px; }
    .hr-today-more { font-size:12px; color:#6b7080; text-align:center; padding:4px 0 0; }

    .hr-funnel { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px; }
    .hr-funnel .step { flex:1; min-width:110px; background:#fff; border:1px solid #e2e2dc; border-radius:9px;
      padding:12px; text-align:center; }
    .hr-funnel .step .v { font-size:22px; font-weight:700; color:#1b2440; }
    .hr-funnel .step .l { font-size:11px; color:#6b7080; margin-top:2px; }
    .hr-auto { font-size:11px; color:#9aa0b4; margin:8px 0 26px; }

    .hr-kpi { display:flex; background:#fff; border:1px solid #e2e2dc; border-radius:9px; margin-bottom:26px; }
    .hr-kpi .b { flex:1; padding:14px; text-align:center; border-right:1px solid #e2e2dc; }
    .hr-kpi .b:last-child { border-right:none; }
    .hr-kpi .v { font-size:20px; font-weight:700; color:#1b2440; }
    .hr-kpi .l { font-size:11px; color:#6b7080; margin-top:3px; }

    .hr-list-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #e2e2dc;
      cursor:pointer; font-size:13px; }
    .hr-list-row:last-child { border-bottom:none; }
    .hr-list-row .nm { font-weight:700; color:#1b2440; flex:1; }
    .hr-list-row .st { color:#6b7080; font-size:12px; }

    .hr-rank { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
      border-radius:5px; font-size:11px; font-weight:700; padding:0 6px; }
    .hr-rank.A { background:#1b2440; color:#fff; } .hr-rank.B { background:#e7eaf3; color:#1b2440; }
    .hr-rank.C { background:#efefeb; color:#4a5068; } .hr-rank.D { background:#f6f6f2; color:#9aa0b4; }

    .hr-good-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:26px; }
    .hr-good-card { background:#fff; border:1px solid #e2e2dc; border-radius:9px; padding:13px 14px; cursor:pointer; }
    .hr-good-card .nm { font-weight:700; color:#1b2440; font-size:14px; }
    .hr-good-card .jb { font-size:11.5px; color:#6b7080; margin:2px 0 8px; }
    .hr-good-card .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .hr-good-card .row .st { font-size:11.5px; color:#4a5068; }

    .hr-iv-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #e2e2dc;
      cursor:pointer; font-size:13px; }
    .hr-iv-row:last-child { border-bottom:none; }
    .hr-iv-row .tm { font-weight:700; color:#1b2440; font-variant-numeric:tabular-nums; min-width:44px; }
    .hr-iv-row .nm { font-weight:700; color:#1b2440; }
    .hr-iv-row .jb, .hr-iv-row .iv { color:#6b7080; font-size:12px; }
    .hr-iv-row .st { margin-left:auto; font-size:12px; color:#4a5068; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="hr-title">ダッシュボード</h1>
  <p class="hr-sub">今日、何をすべきかが分かります。</p>

  <div class="hr-sec-h">今やること</div>
  <div class="hr-today" id="today"></div>

  <div class="hr-sec-h">GOOD CANDIDATES</div>
  <div class="hr-good-grid" id="good"></div>

  <div class="hr-sec-h">今日の面談</div>
  <div class="card" style="margin-bottom:26px;"><div id="todayiv"></div></div>

  <div class="hr-sec-h">採用ファネル</div>
  <div class="hr-funnel" id="funnel"></div>
  <div class="hr-auto">TimeRex → Google Meet → Google Drive → Slack（自動連携）</div>

  <div class="hr-sec-h">KPI</div>
  <div class="hr-kpi" id="kpi"></div>

  <div class="hr-sec-h">応募者一覧</div>
  <div class="card"><div id="list"></div></div>
</div>

<script src="../js/api-client.js?v=20260916m"></script>
<script src="../js/layout.js?v=20260916m"></script>
<script src="../js/hr-layout.js?v=20260916m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = HRLayout.esc;

  const STAGES = [
    { key: "applied", label: "応募" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "ceo_recommend", label: "社長推薦" }, { key: "ceo_interview", label: "社長面談" },
    { key: "offer", label: "内定" }, { key: "joining_scheduled", label: "入社予定" },
  ];

  let applicants = [];
  let todayInterviews = [];

  HRLayout.init({ active: "dashboard" }).then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const [res, ti] = await Promise.all([
        API.listHrApplicants(),
        API.todayHrInterviews().catch(() => ({ interviews: [] })),
      ]);
      applicants = res.applicants || [];
      todayInterviews = ti.interviews || [];
      render();
    } catch (e) {
      el("today").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  function render() {
    renderToday();
    renderGoodCandidates();
    renderTodayInterviews();
    renderFunnel();
    renderKpi();
    renderList();
  }

  /** Aランク、または社長推薦の段階まで進んだ人だけ */
  function renderGoodCandidates() {
    const list = applicants.filter((a) => a.rank === "A" || a.stage === "ceo_recommend");
    if (!list.length) { el("good").innerHTML = `<div class="empty">いまのところ対象はいません。</div>`; return; }
    el("good").innerHTML = list.map((a) => `
      <div class="hr-good-card" onclick="location.href='applicants.html?id=${esc(a.id)}'">
        <div class="nm">${esc(a.name)}</div>
        <div class="jb">${esc(a.jobTitle)}</div>
        <div class="row">${a.rank ? `<span class="hr-rank ${esc(a.rank)}">${esc(a.rank)}</span>` : ""}
          <span class="st">${esc(a.stageLabel)}</span></div>
        <button class="btn btn-secondary btn-sm">詳細</button>
      </div>`).join("");
  }

  function renderTodayInterviews() {
    if (!todayInterviews.length) { el("todayiv").innerHTML = `<div class="empty">本日の面談はありません。</div>`; return; }
    el("todayiv").innerHTML = todayInterviews.map((i) => `
      <div class="hr-iv-row" onclick="location.href='applicants.html?id=${esc(i.applicantId)}'">
        <span class="tm">${esc(fmtTime(i.scheduledAt))}</span>
        <span class="nm">${esc(i.name)}</span>
        <span class="jb">${esc(i.jobTitle)}</span>
        <span class="iv">${esc(i.interviewerName || "未定")}</span>
        <span class="st">${esc(i.statusLabel)}</span>
        <span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span>
      </div>`).join("");
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  // 「いま何をすべきか」だけを、対象者ごとに1行＋1つのボタンで出す。
  // HR側で次に動く必要が無い（本人の回答待ちなど＝nextActionCtaが無い）ものは出さない
  function renderToday() {
    const items = applicants
      .filter((a) => !["accepted", "declined", "done", "passed"].includes(a.status) && a.nextActionCta)
      .sort((a, b) => (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0));

    if (!items.length) {
      el("today").innerHTML = `<div class="empty">対応が必要な応募者はいません。</div>`;
      return;
    }
    const LIMIT = 12;
    const shown = items.slice(0, LIMIT);
    el("today").innerHTML = `
      <div class="hr-today-count">${items.length}件</div>
      ${shown.map((a) => `
        <div class="hr-today-row${a.overdue ? " overdue" : ""}">
          <div class="info"><b>${esc(a.name)}</b><span class="n">${esc(a.nextAction)}</span></div>
          <button class="btn btn-primary btn-sm" onclick="location.href='applicants.html?id=${esc(a.id)}'">${esc(a.nextActionCta)}</button>
        </div>`).join("")}
      ${items.length > LIMIT ? `<div class="hr-today-more">ほか${items.length - LIMIT}件は応募者一覧で確認してください</div>` : ""}`;
  }

  function renderFunnel() {
    el("funnel").innerHTML = STAGES.map((s) => {
      const n = applicants.filter((a) => a.stage === s.key).length;
      return `<div class="step"><div class="v">${n}</div><div class="l">${esc(s.label)}</div></div>`;
    }).join("");
  }

  function renderKpi() {
    const thisMonth = new Date().toISOString().slice(0, 7);
    const inMonth = (a, key) => (a.createdAt || "").slice(0, 7) === thisMonth;
    el("kpi").innerHTML = [
      ["新規応募", applicants.filter((a) => a.createdAt?.slice(0, 7) === thisMonth).length],
      ["カジュアル面談", applicants.filter((a) => a.stage === "casual_interview" || (a.interviewCount || 0) > 0).length],
      ["社長推薦", applicants.filter((a) => ["ceo_recommend", "ceo_interview", "offer", "joining_scheduled"].includes(a.stage)).length],
      ["社長面談", applicants.filter((a) => ["ceo_interview", "offer", "joining_scheduled"].includes(a.stage)).length],
      ["今月内定", applicants.filter((a) => a.stage === "offer" && a.updatedAt?.slice(0, 7) === thisMonth).length],
    ].map(([l, v]) => `<div class="b"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join("");
  }

  function renderList() {
    if (!applicants.length) { el("list").innerHTML = `<div class="empty">まだ応募者がいません。</div>`; return; }
    el("list").innerHTML = applicants.slice(0, 20).map((a) => `
      <div class="hr-list-row" onclick="location.href='applicants.html?id=${esc(a.id)}'">
        <span class="nm">${esc(a.name)}</span><span class="st">${esc(a.stageLabel)} ／ ${esc(a.statusLabel)}</span>
        <span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span>
      </div>`).join("");
  }
</script>

</body>
</html>
