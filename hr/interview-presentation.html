<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>会社紹介プレゼン｜株式会社エイト</title>
<link rel="stylesheet" href="../css/hr-company-slides.css?v=20261114a">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1526;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.present-shell{min-height:100vh;display:flex;flex-direction:column;gap:15px;padding:18px}
.present-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:#cbd6e4}
.present-top button{border:1px solid #60728d;color:#fff;background:transparent;border-radius:8px;padding:7px 14px;cursor:pointer}
#present-slide{flex:1;display:flex;align-items:center;justify-content:center}
#present-slide .eight-slide{width:min(100%,1280px);min-height:min(66vw,74vh);padding:clamp(28px,5vw,80px);border-radius:18px}
#present-slide .eight-slide h3{font-size:clamp(28px,3.6vw,56px);margin-top:clamp(30px,6vh,90px)}
#present-slide .eight-slide-lead{font-size:clamp(16px,1.6vw,23px);max-width:900px}
#present-slide .eight-slide-point{font-size:clamp(13px,1.3vw,19px);padding:clamp(12px,2vw,26px)}
.present-help{font-size:12px;color:#94a7c1;text-align:center}
@media(max-width:700px){.present-shell{padding:12px}#present-slide .eight-slide{min-height:70vh;padding:24px}#present-slide .eight-slide h3{font-size:28px;margin-top:28px}#present-slide .eight-slide-point{font-size:13px;padding:10px}.present-top{flex-wrap:wrap}}
</style></head>
<body>
<main class="present-shell">
<header class="present-top"><span>株式会社エイト｜会社紹介</span><button type="button" id="present-fullscreen">全画面で見る</button></header>
<div id="present-slide" aria-live="polite"></div>
<div class="present-help">面談担当者がスライドを操作します。この画面には面談メモ・評価・応募者情報は表示されません。</div>
</main>
<script src="../js/hr-company-slides.js?v=20261114a"></script>
<script>
(function(){
"use strict";
const target=document.getElementById("present-slide");
function render(){
 const m=location.hash.match(/^#slide=(\d+)$/);
 const n=m?Number(m[1]):0;
 target.innerHTML=HRCompanySlides.card(n);
 document.title="会社紹介 "+(HRCompanySlides.bounded(n)+1)+"/7｜株式会社エイト";
}
window.addEventListener("hashchange",render);
document.getElementById("present-fullscreen").addEventListener("click",()=>{
 if(!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{});}
 else if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{});}
});
render();
})();
</script>
</body></html>
