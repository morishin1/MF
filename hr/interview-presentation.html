<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>会社紹介｜株式会社エイト</title>
<link rel="stylesheet" href="../css/hr-company-slides.css?v=20261114a">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1526;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.present-shell{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:16px}
.present-top,.present-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.present-top{font-size:13px;color:#cbd6e4}.present-actions{display:flex;gap:8px;flex-wrap:wrap}
.present-actions button,.present-actions a{display:inline-flex;align-items:center;justify-content:center;border:1px solid #60728d;color:#fff;background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;font-size:13px}
.present-actions button:hover,.present-actions a:hover{background:rgba(255,255,255,.14)}
#present-slide{flex:1;min-height:calc(100vh - 150px);display:flex;align-items:stretch;justify-content:center}
#present-slide .eight-slide{width:min(100%,1280px);min-height:74vh;padding:clamp(28px,5vw,80px);border-radius:18px}
#present-slide .eight-slide h3{font-size:clamp(28px,3.6vw,56px);margin-top:clamp(30px,6vh,90px)}
#present-slide .eight-slide-lead{font-size:clamp(16px,1.6vw,23px);max-width:900px}
#present-slide .eight-slide-point{font-size:clamp(13px,1.3vw,19px);padding:clamp(12px,2vw,26px)}
#present-frame{width:100%;border:0;border-radius:12px;background:#fff;min-height:75vh}
.present-bottom{font-size:12px;color:#aabbd0;line-height:1.65}
@media(max-width:700px){.present-shell{padding:9px}#present-slide{min-height:70vh}#present-slide .eight-slide{padding:24px;min-height:65vh}#present-slide .eight-slide h3{font-size:28px;margin-top:28px}#present-slide .eight-slide-point{font-size:13px;padding:10px}}
</style></head>
<body>
<main class="present-shell">
<header class="present-top"><strong id="present-title">採用ビジョン（標準）</strong>
<div class="present-actions"><a id="present-link" href="https://8grp.co.jp/recruit/vision/" target="_blank" rel="noopener noreferrer">資料を別タブで開く</a>
<button type="button" id="present-fullscreen">全画面で見る</button></div></header>
<div id="present-slide" aria-live="polite"></div>
<footer class="present-bottom"><span>面談担当者が資料を切り替えます。この画面には面談メモや評価は表示されません。</span>
<span>埋め込みが表示されない資料は「資料を別タブで開く」をご利用ください。</span></footer>
</main>
<script src="../js/hr-company-slides.js?v=20261114a"></script>
<script src="../js/hr-interview-sources.js?v=20261114b"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const S=HRInterviewSources;
function render(data){
 const d=data&&typeof data==="object"?data:{};
 const kind=d.kind==="builtin"?"builtin":"url";
 const title=typeof d.title==="string"&&d.title.length<180?d.title:S.DEFAULT.name;
 const idx=HRCompanySlides.bounded(d.slideIndex);
 $("present-title").textContent=title;
 const link=$("present-link");
 if(kind==="builtin"){
  $("present-slide").innerHTML=HRCompanySlides.card(idx);
  link.hidden=true;link.removeAttribute("href");
  document.title="会社紹介 "+(idx+1)+"/7｜株式会社エイト";
 }else{
  const url=S.safeUrl(d.url)||S.VISION_URL;
  const frame=document.createElement("iframe");
  frame.id="present-frame";frame.title=title;
  frame.loading="eager";frame.referrerPolicy="no-referrer";
  frame.setAttribute("sandbox","allow-same-origin allow-scripts allow-forms allow-popups");
  frame.src=S.embedUrl(url);
  $("present-slide").replaceChildren(frame);
  link.hidden=false;link.href=url;
  document.title=title+"｜株式会社エイト";
 }
}
window.addEventListener("message",event=>{
 if(event.origin!==location.origin||event.source!==window.opener)return;
 const data=event.data;
 if(!data||data.type!=="eight-hr-presenter-slide")return;
 if(data.kind!=="builtin"&&!S.safeUrl(data.url))return;
 render(data);
});
$("present-fullscreen").addEventListener("click",()=>{
 if(!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{});}
 else if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{});}
});
render({kind:"url",title:S.DEFAULT.name,url:S.VISION_URL});
if(window.opener)try{window.opener.postMessage({type:"eight-hr-presenter-ready"},location.origin);}catch{}
})();
</script></body></html>
