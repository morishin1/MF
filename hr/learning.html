<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>育成・評価 - EIGHT HR</title>
<link rel="icon" type="image/svg+xml" href="../img/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Material+Symbols+Rounded&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261114portal2"><link rel="stylesheet" href="../css/hr-design.css?v=20261117learning1"><link rel="stylesheet" href="../css/hr-learning.css?v=20261117learning1">
<script src="../js/supabase.min.js"></script><script src="../js/config.js"></script><script src="../js/api-client.js?v=20261114portal2"></script><script src="../js/layout-marketing.js"></script><script src="../js/hr-layout.js?v=20261117learning1"></script><script src="../js/hr-nav-v2.js?v=20261117learning1"></script><script src="../js/hr-learning-client.js?v=20261117learning1"></script><script defer src="../js/hr-learning.js?v=20261117learning1"></script></head>
<body><main class="wrap"><h1>育成・評価</h1><p class="muted">無限道場の学習状況と、2週間の到達目標・担当者評価を確認します。</p>
<div id="learning-counts" class="learning-counts" aria-live="polite"><span>学習状況を確認しています…</span></div>
<section class="hr-list-card"><div class="learning-toolbar"><label>氏名で検索<input id="learning-search" type="search" placeholder="氏名を入力"></label><label>表示対象<select id="learning-filter"><option value="target">育成・評価の対象者</option><option value="learning">学習中</option><option value="trial">2週間トライアル</option><option value="pending">評価待ち</option><option value="all">すべての応募者</option></select></label><button id="learning-refresh" class="btn btn-secondary" type="button">最新にする</button></div>
<p id="learning-message" role="status" aria-live="polite"></p>
<table class="learning-table"><thead><tr><th>氏名・参加状況</th><th>受講区分</th><th>経過</th><th>学習進捗</th><th>目標達成率</th><th>最終学習日</th><th>評価状態</th></tr></thead><tbody id="learning-rows"></tbody></table></section></main>
<dialog id="learning-dialog" aria-labelledby="learning-title"><div class="learning-modal"><header><h2 id="learning-title"></h2><button class="btn btn-secondary" id="learning-close" type="button" aria-label="詳細を閉じる">閉じる</button></header><div id="learning-detail"></div><p id="learning-detail-message" role="status" aria-live="polite"></p></div></dialog>
</body></html>
