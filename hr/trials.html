<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>面談・評価へ移動 - EIGHT HR</title>
</head>
<body>
<p>トライアルの評価は応募者管理の「面談・評価」から行います。</p>
<p><a id="back" href="/hr/applicants.html">応募者管理を開く</a></p>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const id=params.get('applicantId');
  const url='/hr/applicants.html'+(id&&/^[0-9a-f-]{36}$/i.test(id)?'?id='+encodeURIComponent(id):'');
  document.getElementById('back').href=url;
  location.replace(url);
})();
</script>
</body></html>
