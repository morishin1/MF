<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=20261114hr">

<style>
.material-symbols-outlined{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:19px;line-height:1;letter-spacing:normal;font-feature-settings:"liga";vertical-align:middle}
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f6f6f2;color:#1b2440}
.iv-wrap{width:min(1160px,100%);padding:24px 16px 65px;margin:auto;box-sizing:border-box}
.iv-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.iv-title h1{font-size:24px;margin:0 0 4px}.iv-title p{font-size:13px;color:#6b7080;margin:0}
.iv-card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:20px;margin-bottom:14px}
.iv-muted{color:#667085;font-size:12.5px;line-height:1.6}
.iv-error{background:#fff2f2;color:#8b2c2c;border:1px solid #ddb7b7;padding:12px;border-radius:9px;margin-bottom:12px}
.iv-success{color:#236436;font-size:12px}
.iv-list-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eceef1;color:#1b2440;text-decoration:none}
.iv-list-item:last-child{border-bottom:0}.iv-list-item b{font-size:14px}.iv-list-item small{display:block;font-size:12px;color:#6b7080;margin-top:3px}
.iv-list-item .go{padding:7px 13px;border-radius:7px;background:#1b2440;color:white;font-size:12px;white-space:nowrap}
.iv-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:14px 0 18px}
.iv-tab{background:transparent;border:0;padding:0;cursor:pointer;min-width:0;font:inherit;text-align:center;color:#667085}
.iv-tab .track{height:7px;border-radius:9px;background:#e4e7eb;display:block;margin-bottom:7px}
.iv-tab.active .track,.iv-tab.past .track{background:#2b568b}
.iv-tab .lab{display:block;font-size:11px;line-height:1.4;min-height:33px;overflow-wrap:anywhere}
.iv-tab.active .lab{font-weight:700;color:#1b2440}
.iv-step-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iv-step-heading h2{font-size:21px;margin:0}.iv-time{color:#6b7080;font-size:12px;white-space:nowrap}
.iv-question{background:#f4f6fa;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin:14px 0}
.iv-card label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
.iv-card textarea{display:block;width:100%;min-height:170px;box-sizing:border-box;resize:vertical;border:1px solid #cdd3dd;border-radius:8px;padding:12px;font:inherit;font-size:14px;line-height:1.6}
.iv-card textarea:focus{outline:2px solid #457bb7;outline-offset:2px}
.iv-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.iv-btn{font:inherit;cursor:pointer;border:1px solid #d0d6dd;border-radius:8px;background:#fff;color:#1b2440;padding:10px 14px;text-decoration:none;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.iv-btn.primary{border-color:#1b2440;background:#1b2440;color:#fff}
.iv-btn:disabled{opacity:.4;cursor:not-allowed}
.iv-scores{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin:12px 0}
.iv-score-row{display:contents}
.iv-score-row .description{padding:8px 0;border-bottom:1px solid #eef0f3;font-size:13px}
.iv-score-controls{display:flex;align-items:center;gap:4px;border-bottom:1px solid #eef0f3;padding:5px 0}
.iv-score-controls button{width:33px;height:32px;font-size:12px;font-weight:600;background:white;border:1px solid #cbd2dc;border-radius:6px;color:#344054;cursor:pointer}
.iv-score-controls button.selected{background:#1b2440;border-color:#1b2440;color:white}
.iv-sum{font-size:17px;font-weight:700;text-align:right;padding:9px}
.iv-sum strong{font-size:26px}
.iv-note{font-size:12px;color:#687487;line-height:1.7}
.iv-links{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){.iv-wrap{padding:16px 10px}.iv-card{padding:14px}.iv-tab .lab{font-size:10px}.iv-score-controls button{width:28px;height:30px}.iv-step-heading h2{font-size:18px}}

/* 7ページの会社紹介を、スライド＋担当者用台本の2列だけで表示 */
.iv-tab{position:relative}.iv-tab .iv-flow-arrow{position:absolute;top:0;right:-10px;font-size:13px;color:#99a3b1;font-weight:700;z-index:1}
.iv-present-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:15px;align-items:stretch;margin-top:14px}
.iv-present-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.iv-present-tools{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;align-items:center}
.iv-slide-counter{font-size:12px;font-weight:700;color:#53657b;font-variant-numeric:tabular-nums}
.iv-script{border:1px solid #dce5f0;background:#f6f8fb;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:11px}
.iv-script h3{font-size:14px;margin:0;display:flex;align-items:center;gap:6px}.iv-script p{font-size:13px;line-height:1.85;margin:0;white-space:pre-wrap}
.iv-evidence{font-size:11px;color:#59677d;line-height:1.55;border-top:1px solid #dae2eb;padding-top:9px;margin-top:auto}
.iv-privacy{display:flex;align-items:center;gap:5px;font-size:11px;color:#496784}
.iv-work-sample{border:1px solid #e0e6ef;background:#f8fafd;border-radius:9px;padding:13px 15px;margin:12px 0;font-size:13px;line-height:1.75}
.iv-work-sample b{display:block;margin-bottom:4px}
.iv-eval-optional{margin-top:16px;border:1px solid #e2e7ed;border-radius:9px;padding:12px 14px}
.iv-eval-optional summary{cursor:pointer;font-size:13px;font-weight:700}
.iv-remaining{display:flex;align-items:center;gap:4px;color:#52627a;font-size:12px;font-variant-numeric:tabular-nums}
@media(max-width:900px){.iv-present-grid{grid-template-columns:1fr}.iv-present-side{gap:8px}}
@media(max-width:700px){.iv-present-tools{justify-content:center}.iv-script{padding:12px}.iv-remaining{font-size:11px}}

/* 面談中は常に資料と質問を左右に表示。入力はプルダウン・選択チップが中心。 */
.iv-wrap{width:min(1440px,100%);padding-top:15px}
.iv-card{padding:18px}
.iv-interview-layout{display:grid;grid-template-columns:minmax(0,1.36fr) minmax(320px,.84fr);gap:16px;margin-top:15px;align-items:start}
.iv-material-view,.iv-topic-side{min-width:0}
.iv-material-toolbar{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.iv-material-toolbar .iv-material-heading{font-size:12px;font-weight:700;white-space:nowrap}
.iv-material-toolbar select{min-width:195px;max-width:400px;flex:1;border:1px solid #ccd5df;border-radius:8px;background:white;color:#1b2440;font-size:13px;padding:10px}
.iv-material-toolbar a{font-size:12px;color:#295783;white-space:nowrap}
.iv-url-entry{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.iv-url-entry input{flex:1;min-width:0;padding:11px 12px;border:1px solid #cdd3dd;border-radius:8px;font:inherit;font-size:13px}
.iv-url-entry .iv-btn{white-space:nowrap}
.iv-url-entry input[name=material-title]{flex:0 1 170px;min-width:100px}
.iv-url-feedback{min-height:18px;font-size:11px;color:#52657d;margin:2px 0 7px}
.iv-url-feedback.error{color:#a42121}
.iv-url-feedback.success{color:#236436}
.iv-frame-shell{border:1px solid #d5dce7;border-radius:12px;background:#eef2f6;overflow:hidden;min-height:350px}
.iv-frame-shell iframe{display:block;width:100%;height:clamp(350px,48vw,540px);border:0;background:#fff}
.iv-frame-shell .eight-slide{min-height:350px;border-radius:0}
.iv-source-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin-top:10px}
.iv-source-actions a{font-size:12px;color:#305a82}
.iv-source-help{font-size:11px;color:#758193;line-height:1.65;margin:7px 0 0}
.iv-step-prompt{font-size:12px;color:#677388;line-height:1.65;margin:8px 0 12px}
.iv-topic-side{border:1px solid #e3e7ed;border-radius:12px;background:#fafbfc;padding:17px}
.iv-topic-side .iv-step-heading{align-items:flex-start;gap:8px;flex-wrap:wrap}
.iv-topic-side .iv-step-heading h2{font-size:17px}
.iv-choices{display:grid;gap:14px;margin:13px 0}
.iv-choice-label{display:block;font-size:12px;font-weight:700;color:#293952;margin:0 0 7px}
.iv-choice-select{width:100%;padding:12px 11px;font-size:13px;font-family:inherit;background:white;border:1px solid #cdd6e2;border-radius:9px;color:#1b2440;min-height:43px}
.iv-choice-group{display:flex;gap:6px;flex-wrap:wrap}
.iv-card .iv-check{display:inline-flex;align-items:center;position:relative;margin:0;padding:0;font-weight:500;cursor:pointer}
.iv-check input{position:absolute;opacity:0;width:1px;height:1px}
.iv-check span{display:flex;align-items:center;gap:5px;border:1px solid #d0d8e2;background:white;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.3;color:#46556a;min-height:35px}
.iv-check span:before{content:"□";color:#8491a1;font-size:12px}
.iv-check input:checked+span{border-color:#245a90;background:#e9f1fb;color:#1b3f6b;font-weight:700}
.iv-check input:checked+span:before{content:"✓";color:#235a90}
.iv-check input:focus-visible+span{outline:2px solid #347bc9;outline-offset:2px}
.iv-notes{padding:12px 0;border-top:1px solid #e3e7ee}
.iv-notes summary,.iv-script-details summary{font-size:13px;font-weight:700;cursor:pointer}
.iv-notes label{margin:7px 0 3px;color:#5e6a7a;font-weight:500;font-size:12px}
.iv-notes textarea{min-height:95px;font-size:13px}
.iv-script-details{margin:10px 0;padding:12px;border:1px solid #dce5f0;border-radius:9px;background:#f3f7fb}
.iv-script-details p{font-size:12px;line-height:1.8;margin:9px 0;white-space:pre-wrap}
.iv-script-details .iv-evidence{font-size:11px;margin-top:9px}
.iv-topic-side .iv-actions{margin-top:12px}
.iv-topic-side .iv-btn.primary{white-space:nowrap}
.iv-topic-side .iv-eval-optional{margin-top:12px}
@media(max-width:900px){.iv-interview-layout{grid-template-columns:1fr}.iv-frame-shell iframe{height:420px}.iv-topic-side{padding:15px}}
@media(max-width:600px){.iv-url-entry{flex-wrap:wrap}.iv-url-entry input[name=material-title]{flex:1 1 120px}.iv-wrap{padding:10px 8px}.iv-card{padding:12px}.iv-url-entry input{font-size:12px}.iv-material-toolbar select{min-width:140px}.iv-frame-shell iframe{height:350px}.iv-topic-side .iv-step-heading h2{font-size:16px}.iv-card .iv-check span{padding:9px 10px}}
</style></head>
<body>
<main class="iv-wrap">
<div class="iv-title"><div><h1>30分採用面談ナビ</h1><p>会社紹介を見せながら、質問を選んで記録する30分の面談です。</p></div>
<div class="iv-links"><a class="iv-btn" href="/hr/applicants.html">応募者管理</a><a class="iv-btn" href="/hr/dashboard.html">ダッシュボード</a></div></div>
<div id="iv-status" role="status" aria-live="polite">データを読み込んでいます…</div>
<div id="iv-root"></div>
</main>
<script src="../js/api-client.js?v=20261030officeactions1"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/hr-layout.js?v=20261030officeactions1"></script>
<script src="../js/hr-nav-v2.js?v=20261114integrated1"></script>
<script src="../js/hr-company-slides.js?v=20261114a"></script>
<script src="../js/hr-interview-sources.js?v=20261114b"></script>
<script src="../js/hr-interview-choices.js?v=20261114b"></script>
<script src="../js/jst.js?v=20261030officeactions1"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const e=s=>HRLayout.esc(String(s==null?"":s));
const params=new URLSearchParams(location.search);
const steps=[
  {title:"導入",time:2,question:"ご応募ありがとうございます。まず、応募のきっかけと、今日いちばん聞いておきたいことを教えてください。",label:"応募のきっかけ・気になること"},
  {title:"会社紹介",time:8,question:"7ページの会社紹介を見せながら説明します。相手が興味を持った事業を確認してください。",label:"興味を持った事業・質問"},
  {title:"経験・希望",time:8,question:"これまでの仕事で、自分で工夫して成果を出した経験は何ですか？役割・行動・結果と、今後やりたい仕事を聞いてください。",label:"経験・得意なこと・希望する仕事"},
  {title:"仕事の提案",time:6,question:"今回の募集で任せたい仕事、最初の成果目標、相談・支援の方法を具体的に説明し、無理なく取り組めそうか確認してください。",label:"提案した仕事内容・期待成果・本人の反応"},
  {title:"条件・質問",time:4,question:"契約形態、報酬、勤務場所・時間、開始時期を募集条件に沿って確認し、気になる点や不安にも答えてください。",label:"条件の確認・未解決の質問"},
  {title:"次の案内",time:2,question:"お互いの希望を確かめ、次の選考と連絡予定日を具体的に伝えてください。合否はこの場では自動決定しません。",label:"次のアクション・担当・期限"}
];
const dimensions=[
  {label:"成果を出す力",description:"具体的な成果と再現可能性"},
  {label:"実務スキル",description:"業務で求める知識・実行力"},
  {label:"自走力",description:"課題を見つけ実行する行動"},
  {label:"協働・報連相",description:"他者と成果を出す行動"},
  {label:"改善・成長力",description:"指摘から行動を変えた実例"}
];
const MARK1="【30分採用面談ナビ：記録開始】";
const MARK2="【30分採用面談ナビ：記録終了】";
let applicant=null,interview=null,chosen=0;
let notes=steps.map(()=>"");
let scores=dimensions.map(()=>0);
let originalMemo="",saving=false,autoTimer=null,dirty=false,revision=0;
let meetingList=[];
let slideIndex=0,presentationWindow=null,startedAt=0,clockInterval=null;
let sourceId="vision",materialSources=[],materialsLocal=false,materialsError="";
let answers={};
const P=HRInterviewSources;
const Q=HRInterviewChoices;
const LOCAL_KEY="eight-hr-interview-links-v1";
function updateClock(){
 const target=$("iv-clock");if(!target||!startedAt)return;
 const remaining=Math.max(0,1800-Math.floor((Date.now()-startedAt)/1000));
 target.textContent=remaining?"残り "+String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0"):"目安30分経過";
}
function localMaterials(){
 try{const parsed=JSON.parse(localStorage.getItem(LOCAL_KEY)||"[]");return Array.isArray(parsed)?parsed.map(P.fromMaterial).filter(Boolean).slice(0,25):[];}
 catch{return [];}
}
function saveLocalMaterials(items){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(items));return true;}catch{return false;}}
function sourceList(){
 const collected=[P.DEFAULT,P.BUILTIN];
 const seen=new Set([P.DEFAULT.url]);
 for(const src of [...materialSources,...localMaterials()]){
  if(src.kind==="url"&&seen.has(src.url))continue;
  if(src.kind==="url")seen.add(src.url);
  collected.push(src);
 }
 return collected;
}
function currentSource(){return sourceList().find(x=>x.id===sourceId)||P.DEFAULT;}
function syncCandidate(){
 if(!presentationWindow||presentationWindow.closed)return;
 const src=currentSource();
 try{
  presentationWindow.postMessage({
   type:"eight-hr-presenter-slide",kind:src.kind==="builtin"?"builtin":"url",
   title:src.name,url:src.url||null,slideIndex
  },location.origin);
 }catch{}
}
window.addEventListener("message",event=>{
 if(event.origin===location.origin&&event.source===presentationWindow&&event.data?.type==="eight-hr-presenter-ready")syncCandidate();
});
async function loadMaterials(){
 materialsError="";materialsLocal=false;
 try{
  const response=await API.api("/api/hr/materials");
  materialSources=(response.materials||[]).map(P.fromMaterial).filter(Boolean);
 }catch(err){
  materialSources=[];materialsLocal=true;
  materialsError="共通の資料管理を読み込めないため、追加したURLはこのブラウザ内に保存します。";
 }
 if(!sourceList().some(x=>x.id===sourceId))sourceId="vision";
}
function chooseSource(id){
 if(!interview)return;
 capture();
 const source=sourceList().find(x=>x.id===id);
 if(!source)return;
 sourceId=source.id;slideIndex=0;
 answers.__material=source.id;changed();renderWizard();syncCandidate();
}
function moveSlide(index){
 if(!interview||currentSource().kind!=="builtin")return;
 capture();slideIndex=HRCompanySlides.bounded(index);renderWizard();syncCandidate();
}
function showCandidate(){
 if(!interview)return;
 try{
  presentationWindow=window.open("/hr/interview-presentation.html","eightInterviewCompanySlides","width=1200,height=760");
  if(!presentationWindow){setStatus("候補者用画面を開けませんでした。ポップアップの設定をご確認ください。","error");return;}
  presentationWindow.focus();syncCandidate();
  setStatus("候補者用画面を開きました。画面共有では、その画面だけを選んでください。","success");
 }catch{setStatus("候補者用画面を開けませんでした。","error");}
}
function setSourceFeedback(message,error){
 const node=$("iv-url-feedback");
 if(node){node.textContent=message||"";node.className="iv-url-feedback"+(error?" error":message?" success":"");}
}
async function addMaterial(){
 if(!interview)return;
 const field=$("iv-material-url"),button=$("iv-material-add");
 const href=P.safeUrl(field?.value.trim()||"");
 if(!href){setSourceFeedback("https:// から始まる、候補者にも見せられる資料URLを入力してください。",true);return;}
 const duplicate=sourceList().find(x=>x.url===href);
 if(duplicate){field.value="";chooseSource(duplicate.id);setSourceFeedback("登録済みの資料を選びました。");return;}
 const u=new URL(href),hostname=u.hostname;
 const titleField=$("iv-material-name");
 const shortId=u.pathname.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/)?.[1]?.slice(-6);
 const automatic=hostname==="docs.google.com"?"Googleスライド"+(shortId?"（"+shortId+"）":""):hostname+" の資料";
 const name=(titleField?.value||"").trim().slice(0,160)||automatic;
 if(button)button.disabled=true;
 try{
  const fallback=()=> {
   const src={id:"local-"+Date.now().toString(36),name,kind:"url",url:href,active:true,shareExternal:true};
   if(!saveLocalMaterials([...localMaterials(),src].slice(-25)))throw Error("このブラウザに保存できませんでした");
   materialsLocal=true;return src;
  };
  let stored=null;
  if(!materialsLocal){
   try{
    const result=await API.api("/api/hr/materials",{method:"POST",body:{
     name,category:"recruiting",url:href,shareExternal:true,defaultForCasual:false,description:"採用面談ナビから登録したURL"
    }});
    stored=P.fromMaterial(result?.material);
    if(!stored)throw Error("資料を保存できませんでした");
    materialSources.push(stored);
   }catch(err){
    // APIで一時的に保存できない場合も候補者用資料として開けるよう、ブラウザ内へ保存する。
    stored=fallback();
    materialsError="共通保存が利用できず、このブラウザだけに資料を保存しました。";
   }
  }else stored=fallback();
  field.value="";if(titleField)titleField.value="";
  chooseSource(stored.id);
  setSourceFeedback(materialsLocal?"このブラウザだけに追加しました。":"資料を追加し、選択しました。");
 }catch(err){setSourceFeedback(err?.message||"資料を追加できませんでした。",true);}
 finally{if(button)button.disabled=false;}
}
function chooseAnswer(control){
 if(!interview||!control)return;
 const id=control.dataset.q;
 const q=Q.steps.flat().find(x=>x.id===id);
 if(!q)return;
 capture();
 if(q.type==="select"){
  if(!control.value)delete answers[id];
  else if(q.options.includes(control.value))answers[id]=control.value;
 }else if(q.type==="multi"){
  let values=Array.isArray(answers[id])?[...answers[id]]:[];
  const value=control.dataset.value;
  if(!q.options.includes(value))return;
  if(control.checked){
   if(!values.includes(value))values.push(value);
   if(values.length>4){control.checked=false;setStatus("この質問は4つまで選べます。","error");return;}
  }else values=values.filter(x=>x!==value);
  if(values.length)answers[id]=values;else delete answers[id];
 }
 changed();
}
function setStatus(message,kind){
 $("iv-status").textContent=message||"";
 $("iv-status").className=kind==="error"?"iv-error":kind==="success"?"iv-success":"iv-muted";
}
function parseMemo(memo){
 const a=memo.indexOf(MARK1),b=memo.indexOf(MARK2);
 if(a<0||b<a)return;
 const data=memo.slice(a+MARK1.length,b);
 const parts=data.split(/^◆STEP ([1-6]) .*$/m);
 // split() includes capture groups: before, step number, content...
 for(let i=1;i+1<parts.length;i+=2){
  const idx=Number(parts[i])-1;
  if(idx>=0&&idx<6){
    let value=parts[i+1]||"";
    if(idx===5)value=value.split(/^◆選択回答 |^◆評価 /m)[0];
    notes[idx]=value.trim();
  }
 }
 const selected=data.match(/^◆選択回答 (\{[^\n]*\})$/m);
 if(selected){try{answers=Q.normalize(JSON.parse(selected[1]));}catch{answers={};}}
 const match=data.match(/^◆評価 ([0-5],[0-5],[0-5],[0-5],[0-5])$/m);
 if(match)scores=match[1].split(",").map(Number);
}
function preserveOutside(memo){
 const start=memo.indexOf(MARK1),end=memo.indexOf(MARK2);
 if(start<0||end<start)return memo.trim();
 return (memo.slice(0,start)+memo.slice(end+MARK2.length)).trim();
}
function composeMemo(base){
 const text=[MARK1];
 steps.forEach((s,i)=>{text.push("◆STEP "+(i+1)+" "+s.title+"\n"+notes[i].trim());});
 text.push("◆選択回答 "+JSON.stringify(Q.normalize(answers)));
 text.push("◆評価 "+scores.join(","),MARK2);
 return [preserveOutside(base),text.join("\n\n")].filter(Boolean).join("\n\n");
}
function capture(){
 const field=$("iv-note");
 if(field)notes[chosen]=field.value;
}
function safeHttpUrl(value){try{const u=new URL(String(value));return ["http:","https:"].includes(u.protocol)?u.href:"";}catch{return "";}}
function detailLink(){return "/hr/applicants.html?id="+encodeURIComponent(applicant.id);}
function meetingUrl(i){return "/hr/interviews.html?applicantId="+encodeURIComponent(i.applicantId)+"&interviewId="+encodeURIComponent(i.id);}
async function save(){
 if(saving||!interview)return false;
 clearTimeout(autoTimer);
 capture();
 const version=revision;
 const pendingMemo=composeMemo(originalMemo);
 let fresh,savedSuccess=false;
 try{
  saving=true;
  setStatus("保存中…");
  fresh=await API.getHrApplicant(applicant.id);
  const current=(fresh.interviews||[]).find(x=>x.id===interview.id);
  if(!current)throw Error("対象の面談が見つかりません");
  if((current.memo||"")!==originalMemo)throw Error("別の画面で面談メモが更新されました。再読み込みして変更内容を確認してください。");
  const memo=pendingMemo;
  if(memo.length>4000)throw Error("保存できる面談メモは4000文字までです。回答を短くするか、既存の面談メモを整理してください。");
  await API.hrInterviewAct({id:interview.id,action:"memo",memo:memo});
  originalMemo=memo;
  interview.memo=memo;dirty=revision!==version;savedSuccess=true;
  setStatus("面談の記録を保存しました。","success");
  return true;
 }catch(ex){clearTimeout(autoTimer);setStatus(ex.hint||ex.message||"保存できませんでした。","error");return false;}
 finally{saving=false;if(dirty&&savedSuccess) { clearTimeout(autoTimer);autoTimer=setTimeout(()=>save(),1200); }}
}

 applicant=null;interview=null;
 const today=(meetingList||[]).filter(x=>!x.done);

 $("iv-root").innerHTML='<div class="iv-card"><h2 style="font-size:17px;margin:0 0 8px">面談予定の応募者</h2>'

 }).join(""):'<p class="iv-muted">現在、登録された面談予定はありません。応募者管理から面談予定を登録してください。</p>')
 +'</div><p class="iv-note">※面談ナビは既存の面談記録に紐づきます。面談日時・Google Meet URLは既存のHR／TimeRexで管理します。</p>';

function scoreControls(){
 return '<div class="iv-scores">'+dimensions.map((d,i)=>
  '<div class="iv-score-row"><div class="description"><b>'+e(d.label)+'</b><div class="iv-note">'+e(d.description)+'</div></div><div class="iv-score-controls" role="group" aria-label="'+e(d.label)+'">'

  +'</div></div>').join("")+'</div>';

function questionHtml(q){
 const selected=answers[q.id];
 if(q.type==="select")
  return '<div class="iv-choice-item"><label class="iv-choice-label" for="q-'+e(q.id)+'">'+e(q.label)+'</label>'
   +'<select class="iv-choice-select" id="q-'+e(q.id)+'" data-q="'+e(q.id)+'" onchange="HrInterviewNavigator.chooseAnswer(this)">'
   +'<option value="">選んでください</option>'
   +q.options.map(option=>'<option value="'+e(option)+'" '+(selected===option?'selected':'')+'>'+e(option)+'</option>').join("")
   +'</select></div>';
 const picked=Array.isArray(selected)?selected:[];
 return '<div class="iv-choice-item"><div class="iv-choice-label">'+e(q.label)+'</div><div class="iv-choice-group">'
  +q.options.map(option=>'<label class="iv-check"><input type="checkbox" data-q="'+e(q.id)+'" data-value="'+e(option)+'" onchange="HrInterviewNavigator.chooseAnswer(this)" '+(picked.includes(option)?'checked':'')+'><span>'+e(option)+'</span></label>').join("")
  +'</div></div>';
}
function renderWizard(){
 const existingFrame=document.querySelector("#iv-frame-shell iframe");
 const existingFrameUrl=existingFrame?.getAttribute("src");
 const current=steps[chosen];
 const src=currentSource();
 const total=scores.every(n=>n>=1&&n<=5)?scores.reduce((a,b)=>a+b,0):null;
 const controls='<div class="iv-choices">'+(Q.steps[chosen]||[]).map(questionHtml).join("")+'</div>';
 const slide=HRCompanySlides.slides[slideIndex];
 const options=sourceList().map(item=>'<option value="'+e(item.id)+'" '+(src.id===item.id?'selected':'')+'>'+e(item.name)+'</option>').join("");
 const builtin=src.kind==="builtin";
 const reuseFrame=!builtin&&existingFrame&&existingFrameUrl===P.embedUrl(src.url);
 const slideBody=builtin?HRCompanySlides.card(slideIndex)
  :reuseFrame?'<div id="iv-frame-slot"></div>'
  :'<iframe title="'+e(src.name)+'" loading="eager" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" src="'+e(P.embedUrl(src.url))+'"></iframe>';
 const deckControls=builtin?'<div class="iv-present-tools"><button class="iv-btn" type="button" onclick="HrInterviewNavigator.slide('+(slideIndex-1)+')" '+(slideIndex===0?'disabled':'')+'>前のページ</button>'
  +'<span class="iv-slide-counter">'+(slideIndex+1)+' / 7</span>'
  +'<button class="iv-btn" type="button" onclick="HrInterviewNavigator.slide('+(slideIndex+1)+')" '+(slideIndex===6?'disabled':'')+'>次のページ</button></div>':"";
 const material='<section class="iv-material-view" aria-label="候補者に見せる資料">'
  +'<div class="iv-material-toolbar"><label class="iv-material-heading" for="iv-material">表示する資料</label><select id="iv-material" onchange="HrInterviewNavigator.chooseSource(this.value)">'+options+'</select>'
  +'<a href="/hr/materials.html" target="_blank" rel="noopener noreferrer">資料を管理</a></div>'
  +'<div class="iv-url-entry"><input id="iv-material-url" type="url" autocomplete="off" placeholder="追加する資料のURLを貼り付け" aria-label="追加資料のURL" maxlength="1000">'
  +'<input id="iv-material-name" name="material-title" type="text" maxlength="160" placeholder="資料名（任意）" aria-label="資料名（任意）">'
  +'<button class="iv-btn" type="button" id="iv-material-add" onclick="HrInterviewNavigator.addMaterial()"><span class="material-symbols-outlined">add_link</span>追加</button></div>'
  +'<div id="iv-url-feedback" class="iv-url-feedback" role="status">'+e(materialsError)+'</div>'
  +'<div class="iv-frame-shell" id="iv-frame-shell">'+slideBody+'</div>'+deckControls
  +'<div class="iv-source-actions"><span>'
  +(src.url?'<a href="'+e(src.url)+'" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined">open_in_new</span>資料を別タブで開く</a>':'<span class="iv-slide-counter">会社紹介スライド</span>')
  +'</span><button type="button" class="iv-btn primary" onclick="HrInterviewNavigator.showCandidate()"><span class="material-symbols-outlined">present_to_all</span>候補者に見せる画面を開く</button></div>'
  +'<p class="iv-source-help">初期表示はエイトの採用ビジョンです。URLを追加した資料は選んで切り替えられます。埋め込みが表示されない場合は別タブで開いてください。候補者に見せてもよいURLだけを登録してください。</p>'
  +'</section>';
 const offerHint=chosen===3?'<div class="iv-work-sample"><b>今回の募集職種：'+e(applicant.jobTitle||"未設定")+'</b>具体的な仕事内容・最初の成果目標・確認方法を伝え、本人の希望と合うか確認してください。成果や報酬を保証しないでください。</div>':"";
 const termsHint=chosen===4?'<div class="iv-work-sample"><b>契約条件は書面で確認</b>トライアルの実務開始前に業務内容・報酬・期間・秘密保持を合意してください。適用しない場合は案内不要です。</div>':"";
 const script=chosen===1?'<details class="iv-script-details"><summary>会社紹介の説明文（担当者用）</summary><p>'
  +e(builtin?slide.talk:"エイトは『デキルがあふれる社会をつくる』ことを目指し、一人ひとりの強みを学び・実践・仕事につなげています。いまご覧いただいている資料から、興味を持った事業や、ご自身の経験を生かせそうな部分があれば教えてください。")
  +'</p><div class="iv-evidence">'+e(builtin?slide.evidence:"資料：採用ビジョン／面談で選択した公開URL。資料の共有権限を必ず確認してください。")+'</div></details>':"";
 const referenceEvaluation=chosen===5?'<details class="iv-eval-optional"><summary>参考評価を入力する（任意）</summary><p class="iv-note">正式な評価・CEO判断は別画面で行います。職務に関係する事実を記録してください。</p>'
  +scoreControls()+'<div class="iv-sum">合計 <strong>'+(total===null?"未入力":total)+'</strong> / 25点</div></details>':"";
 const panel='<aside class="iv-topic-side" aria-label="面談の質問"><div class="iv-step-heading"><h2>STEP '+(chosen+1)+'　'+e(current.title)+'</h2>'
  +'<div class="iv-remaining"><span class="material-symbols-outlined">timer</span><span id="iv-clock">残り30:00</span></div></div>'
  +'<p class="iv-step-prompt">'+e(current.question)+'</p>'+controls+offerHint+termsHint+script
  +'<details class="iv-notes" '+(notes[chosen]?'open':'')+'><summary>補足メモを書く（任意）</summary><label for="iv-note">会話の要点・数値・次の確認事項</label>'
  +'<textarea id="iv-note" oninput="HrInterviewNavigator.changed()" maxlength="350" placeholder="必要なときだけ、話した内容を残してください。">'+e(notes[chosen])+'</textarea></details>'
  +referenceEvaluation
  +'<div class="iv-actions"><button class="iv-btn" type="button" onclick="HrInterviewNavigator.go('+(chosen-1)+')" '+(chosen===0?'disabled':'')+'><span class="material-symbols-outlined">chevron_left</span>前へ</button>'
  +'<div class="iv-links"><button type="button" class="iv-btn" onclick="HrInterviewNavigator.save()">保存</button>'
  +(chosen<5?'<button class="iv-btn primary" type="button" onclick="HrInterviewNavigator.go('+(chosen+1)+')">次へ<span class="material-symbols-outlined">chevron_right</span></button>'
   :'<button class="iv-btn primary" type="button" onclick="HrInterviewNavigator.finish()">'+(interview.done?"記録を保存して終了":"保存して面談を完了")+'</button>')
  +'</div></div><p class="iv-note" style="margin-top:10px">選択した回答は自動保存されます。採否・契約・送信は自動実行しません。</p></aside>';
 $("iv-root").innerHTML='<section class="iv-card"><div class="iv-step-heading"><div><h2>'+e(applicant.name)+'</h2>'
  +'<p class="iv-muted" style="margin:5px 0 0">'+e(applicant.jobTitle||"応募職種未設定")+' ／ '+e(interview.kindLabel||"採用面談")+'</p></div>'
  +'<div class="iv-links">'+(safeHttpUrl(interview.meetingUrl)?'<a target="_blank" rel="noopener noreferrer" href="'+e(safeHttpUrl(interview.meetingUrl))+'" class="iv-btn">面談に参加</a>':"")
  +'<a href="'+detailLink()+'" class="iv-btn">応募者詳細</a></div></div>'
  +'<nav aria-label="面談の進捗" class="iv-tabs">'+steps.map((step,i)=>
   '<button type="button" class="iv-tab '+(i===chosen?"active":i<chosen?"past":"")+'" aria-current="'+(i===chosen?"step":"false")+'" onclick="HrInterviewNavigator.go('+i+')"><span class="track"></span><span class="lab">'+(i+1)+'. '+e(step.title)+'<br>'+step.time+'分</span>'+(i<5?'<span class="iv-flow-arrow" aria-hidden="true">→</span>':"")+'</button>').join("")+'</nav>'
  +'<div class="iv-interview-layout">'+material+panel+'</div></section>';
 if(reuseFrame){const slot=$("iv-frame-slot");if(slot)slot.replaceWith(existingFrame);}
 updateClock();
}
async function openInterview(applicantId,interviewId){
 try{
  setStatus("応募者と面談情報を確認中…");
  const d=await API.getHrApplicant(applicantId);
  const iv=interviewId
    ? (d.interviews||[]).find(x=>x.id===interviewId)
    : (d.interviews||[]).find(x=>!x.done&&!x.canceled);
  if(!d.applicant||!iv||iv.canceled)throw Error("対象となる有効な面談がありません。応募者詳細から面談を登録してください。");
  applicant=d.applicant;interview=iv;originalMemo=iv.memo||"";
  notes=steps.map(()=>"");scores=dimensions.map(()=>0);answers={};chosen=0;slideIndex=0;sourceId="vision";startedAt=Date.now();
  if(clockInterval)clearInterval(clockInterval);clockInterval=setInterval(updateClock,1000);
  parseMemo(originalMemo);
  sourceId=answers.__material||"vision";
  await loadMaterials();
  history.replaceState({},"",meetingUrl({applicantId:applicant.id,id:iv.id}));
  renderWizard();
  setStatus("保存済みの面談メモを読み込みました。");
 }catch(ex){setStatus(ex.hint||ex.message||"面談を開けませんでした。","error");
  $("iv-root").innerHTML='<a class="iv-btn" href="/hr/applicants.html">応募者管理へ戻る</a>';
 }
}
async function go(i){
 if(!interview||i<0||i>5||saving)return;
 const saved=await save();
 if(!saved)return;
 chosen=i;renderWizard();window.scrollTo({top:0,behavior:"smooth"});
}
function setScore(i,n){
 if(!Number.isInteger(i)||i<0||i>=scores.length||n<1||n>5)return;
 capture();scores[i]=scores[i]===n?0:n;changed();
 renderWizard();
 const optional=document.querySelector(".iv-eval-optional");if(optional)optional.open=true;
}
async function finish(){
 if(!interview)return;
 if(!await save())return;
 if(!interview.done){
  if(!confirm("面談を実施済みとしてHRに記録します。次に既存の評価画面でランク・推薦理由を登録してください。よろしいですか？"))return;
  try{await API.conductHrInterview(interview.id);interview.done=true;}
  catch(ex){setStatus(ex.hint||ex.message||"面談完了を記録できませんでした。","error");return;}
 }
 setStatus("面談ナビの記録を保存しました。正式な評価・採用判断は応募者詳細で行ってください。","success");
 $("iv-root").innerHTML='<div class="iv-card"><h2>面談記録を保存しました</h2><p class="iv-muted">30分面談ナビの参考スコアとメモは面談履歴に保存されています。次に選考の評価を入力してください。</p>'
  +'<a class="iv-btn primary" href="'+detailLink()+'">応募者詳細で評価を登録</a> <a class="iv-btn" href="/hr/interviews.html">面談一覧へ戻る</a></div>';
}
function changed(){dirty=true;revision++;clearTimeout(autoTimer);autoTimer=setTimeout(()=>save(),1000);}
window.addEventListener('beforeunload',event=>{if(dirty||saving){event.preventDefault();event.returnValue='';}});
window.HrInterviewNavigator={go,setScore,save,finish,changed,slide:moveSlide,showCandidate,chooseSource,chooseAnswer,addMaterial};
window.addEventListener("pagehide",()=>{if(clockInterval)clearInterval(clockInterval);});
HRLayout.init({active:"interviews"}).then(async ctx=>{
 if(!ctx)return;
 const aid=params.get("applicantId");
 const iid=params.get("interviewId");
 if(aid){await openInterview(aid,iid);return;}
 try{
  const [a,i]=await Promise.all([API.listHrApplicants(),API.todayHrInterviews()]);
  if(a.notReady)throw Error(a.message||"応募者一覧の取得に失敗しました。");
  meetingList=i.interviews||[];
  renderList(a.applicants||[]);
 }catch(ex){setStatus(ex.hint||ex.message||"面談一覧を取得できませんでした。","error");}
});
})();
