<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>選考結果のご案内</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261008rec3">
  <style>
    /* この画面は KPLayout・HRLayout を使わない（候補者本人が、専用URLだけで開く公開画面） */
    body { font-family:'Zen Kaku Gothic New', sans-serif; background:var(--soft,#f4f6f9); }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    .ho-wrap { max-width:520px; margin:0 auto; padding:48px 16px; }
    .ho-logo { text-align:center; margin-bottom:20px; font-weight:700; font-size:15px; color:#1b2440; }
    .ho-greet { font-size:13.5px; color:#4a5068; line-height:1.9; margin:0 0 18px; }
    .ho-greet b { color:#1b2440; font-size:16px; }
    /* 区分つきのオファー：区分（育成枠・業務委託 など）と書類名 */
    .ho-doc { display:inline-block; background:#1b2440; color:#fff; border-radius:999px; padding:3px 14px; font-size:13px; font-weight:700; }
    .ho-fields dt { color:#6b7080; font-size:11.5px; margin:14px 0 2px; }
    .ho-fields dd { margin:0; color:#1b2440; font-weight:700; font-size:15px; }
    .ho-msg { white-space:pre-wrap; font-size:13px; color:#1b2440; line-height:1.8;
      background:#f6f6f2; border-radius:8px; padding:14px; margin-top:18px; }
    .ho-actions { margin-top:24px; padding-top:20px; border-top:1px solid #e2e2dc; }
    .ho-actions .due { font-size:12.5px; color:#6b7080; margin:0 0 14px; }
    .ho-actions button { width:100%; margin-bottom:10px; }
    .ho-actions .ask { font-size:12.5px; color:#6b7080; margin:18px 0 8px; }
    .ho-done { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;
      color:#2f6f3a; background:#e5f1e2; border-radius:8px; padding:14px; margin-top:20px; }
    .ho-done.declined { color:#4a5068; background:#efefeb; }
    /* 区分つき：重要条件を先にコンパクトに → 契約・条件 → 同意（チェック＋大きなボタン） */
    .ho-sub { font-size:12px; color:#6b7080; margin:6px 0 0; }
    .ho-key { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0 0; }
    .ho-key div { background:#f6f6f2; border-radius:8px; padding:10px 12px; min-width:0; }
    .ho-key span { display:block; font-size:11.5px; color:#6b7080; }
    .ho-key b { display:block; font-size:15px; color:#1b2440; margin-top:2px; overflow-wrap:anywhere; }
    .ho-terms h3 { font-size:13px; color:#1b2440; margin:22px 0 0; padding-bottom:6px; border-bottom:1px solid #e2e2dc; }
    .ho-terms dd { white-space:pre-wrap; font-size:14px; overflow-wrap:anywhere; }
    .ho-agree { display:flex; align-items:flex-start; gap:10px; background:#f6f6f2; border:1.5px solid #d5d7e0; border-radius:10px;
      padding:14px; margin:0 0 14px; font-size:14px; font-weight:700; color:#1b2440; cursor:pointer; }
    .ho-agree input { width:20px; height:20px; margin:1px 0 0; flex:none; accent-color:#1b2440; }
    .ho-agree.on { border-color:#1b2440; }
    .btn.ho-accept { width:100%; padding:16px; font-size:16px; font-weight:700; }
    .btn.ho-accept:disabled { opacity:.45; cursor:not-allowed; }
    .ho-complete { background:#e5f1e2; border-radius:10px; padding:18px 16px; margin-top:20px; color:#2f6f3a; }
    .ho-complete h3 { display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:17px; }
    .ho-complete h3 .material-symbols-outlined { flex:none; width:22px; overflow:hidden; }
    .ho-complete p { margin:0; white-space:pre-wrap; font-size:14px; line-height:1.8; color:#1b2440; }
    @media (max-width: 380px) { .ho-key { grid-template-columns:1fr; } }
  </style>
</head>
<body>

<div class="ho-wrap">
  <div class="ho-logo" id="ho-logo">選考結果のご案内</div>
  <div class="card" id="box"><div class="empty">読み込み中…</div></div>
</div>

<script src="../js/api-client.js?v=20261008rec3"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const token = new URLSearchParams(location.search).get("token") || "";

  load();

  let current = null;

  async function load() {
    if (!token) { showError("URLが正しくありません。"); return; }
    let offer;
    try {
      offer = await API.hrOfferPublic(token);
    } catch (e) {
      showError(e.hint || e.message || "このURLは開けません。");
      return;
    }
    current = offer;
    render(offer);
  }

  function showError(msg) {
    el("box").innerHTML = `
      <h2><span class="material-symbols-outlined">error</span>開けません</h2>
      <div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(msg)}</div></div>
      <p class="muted" style="font-size:12.5px;margin-top:14px;">採用担当までお問い合わせください。</p>`;
  }

  function fmtDate(s) {
    if (!s) return "—";
    const [y, m, d] = String(s).split("-");
    return `${y}年${Number(m)}月${Number(d)}日`;
  }
  function fmtWage(o) {
    if (o.wageAmount == null) return "—";
    return `${o.wageType ? esc(o.wageType) + " " : ""}${Number(o.wageAmount).toLocaleString("ja-JP")}円`;
  }

  // 採用区分つきのオファー（正社員・育成・業務委託・パート・スポット）。区分ごとの書類名と条件の行は
  // サーバが作る（lib/hr-offer-types.js）。社内の状態・評価・社内用の項目は届かない。
  // 重要条件を先にコンパクトに出し、その下に契約・条件の本文。最後に「確認し、同意します」＋［同意して契約を完了する］
  function renderTyped(o) {
    const items = o.items || [];
    const key = items.filter((it) => it.highlight);
    const rest = items.filter((it) => !it.highlight);
    document.title = "オファーのご案内";
    el("ho-logo").textContent = "オファーのご案内";
    el("box").innerHTML = `
      <h2>${o.tenantName ? `${esc(o.tenantName)}からの` : ""}オファー</h2>
      <p style="margin:0;"><span class="ho-doc" id="ho-type">${esc(o.typeLabel || o.offerName)}</span></p>
      <p class="ho-sub">${esc(o.offerName)}</p>
      <p class="ho-greet" style="margin-top:14px;">
        <b>${esc(o.candidateName)} 様</b><br>
        このたびは面談にご参加いただき、ありがとうございました。<br>
        下記の内容をご確認ください。
      </p>
      <div class="ho-key" id="ho-key">
        ${key.map((it) => `<div><span>${esc(it.label)}</span><b>${esc(it.value)}</b></div>`).join("")}
        <div><span>回答期限</span><b>${fmtDate(o.respondBy)}</b></div>
      </div>
      ${rest.length ? `
      <div class="ho-terms">
        <h3>契約・条件</h3>
        <dl class="ho-fields" id="ho-items">${rest.map((it) => `<dt>${esc(it.label)}</dt><dd>${esc(it.value)}</dd>`).join("")}</dl>
      </div>` : ""}
      ${o.messageToCandidate ? `
        <h4 style="font-size:12.5px;color:#6b7080;margin:20px 0 0;">採用担当からのメッセージ</h4>
        <div class="ho-msg">${esc(o.messageToCandidate)}</div>` : ""}
      <div id="ho-actions"></div>`;
    renderActions(o);
  }

  // 区分つきの同意（チェックしたときだけ押せる）。同意＝契約手続きの完了
  function renderAgree(o, box, mailto) {
    if (o.responseStatus === "accepted") {
      box.innerHTML = `<div class="ho-complete" id="ho-complete">
        <h3><span class="material-symbols-outlined">check_circle</span>${esc(o.doneTitle || "契約手続きが完了しました。")}</h3>
        <p>${esc(o.afterAccept || "")}</p></div>`;
      return;
    }
    box.innerHTML = `
      <div class="ho-actions">
        <label class="ho-agree" id="ho-agree-box"><input type="checkbox" id="ho-agree" onchange="toggleAgree(this)">
          <span>${esc(o.agreeCheck || "上記の内容を確認し、同意します")}</span></label>
        <button class="btn btn-primary ho-accept" id="ho-accept" disabled onclick="submitAccept(this)">${esc(o.agreeButton || "同意して契約を完了する")}</button>
        <button class="btn btn-secondary" onclick="openDeclineForm()">辞退する</button>
        <div id="ho-decline"></div>
        ${mailto ? `
          <p class="ask">条件について確認したいことがありますか？</p>
          <a class="btn btn-secondary" href="${esc(mailto)}">採用担当へ連絡</a>` : ""}
      </div>
      <div id="ho-msg" class="err-text" style="margin-top:10px;"></div>`;
  }
  function toggleAgree(box) {
    el("ho-accept").disabled = !box.checked;
    el("ho-agree-box").classList.toggle("on", box.checked);
  }

  // 同意・辞退を送る（ログイン不要の口。同意は agreed: true を付ける）
  async function respond(body) {
    const r = await fetch("/api/hr/offers/public", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, ...body }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const err = new Error(data.hint || data.message || "送れませんでした");
      err.hint = data.hint || data.message || null;
      throw err;
    }
    return data;
  }

  function render(o) {
    if (o.offerType) return renderTyped(o);
    el("box").innerHTML = `
      <h2>選考結果のご案内</h2>
      <p class="ho-greet">
        ${o.tenantName ? `${esc(o.tenantName)}<br>` : ""}
        <b>${esc(o.candidateName)} 様</b><br><br>
        このたびは弊社採用選考にご参加いただきありがとうございました。<br>
        採用条件をご確認ください。
      </p>
      <dl class="ho-fields">
        ${o.jobTitle ? `<dt>職種</dt><dd>${esc(o.jobTitle)}</dd>` : ""}
        ${o.employmentType ? `<dt>雇用形態</dt><dd>${esc(o.employmentType)}</dd>` : ""}
        <dt>入社予定日</dt><dd>${fmtDate(o.joinDate)}</dd>
        <dt>給与条件</dt><dd>${fmtWage(o)}</dd>
        ${o.weeklyHours ? `<dt>勤務時間</dt><dd>週${esc(o.weeklyHours)}時間</dd>` : ""}
        ${o.workLocation ? `<dt>勤務地</dt><dd>${esc(o.workLocation)}</dd>` : ""}
        ${o.probationMonths ? `<dt>試用期間</dt><dd>${esc(o.probationMonths)}か月</dd>` : ""}
        ${o.contractType ? `<dt>契約形態</dt><dd>${esc(o.contractType)}${o.contractEndDate ? `（${fmtDate(o.contractEndDate)}まで）` : ""}</dd>` : ""}
        <dt>回答期限</dt><dd>${fmtDate(o.respondBy)}</dd>
      </dl>
      ${o.messageToCandidate ? `
        <h4 style="font-size:12.5px;color:#6b7080;margin:20px 0 0;">採用担当からのメッセージ</h4>
        <div class="ho-msg">${esc(o.messageToCandidate)}</div>` : ""}
      <div id="ho-actions"></div>`;
    renderActions(o);
  }

  // ---- 承諾・辞退・採用担当への連絡（Stage 7） ------------------------------------
  // 本人が「承諾」しただけでは、本採用（gw_employees作成）は行わない。
  // 人事が改めて「本採用へ進める」を押してから（次のステージ）
  function renderActions(o) {
    const box = el("ho-actions");
    if (o.offerType && o.responseStatus !== "declined") {
      const mailto = o.recruiterEmail
        ? `mailto:${encodeURIComponent(o.recruiterEmail)}?subject=${encodeURIComponent(`${o.offerName}について`)}` : null;
      return renderAgree(o, box, mailto);
    }
    if (o.responseStatus === "accepted") {
      box.innerHTML = `<div class="ho-done"><span class="material-symbols-outlined">check_circle</span>
        ${esc(o.afterAccept || "承諾済みです。採用担当からのご連絡をお待ちください。")}</div>`;
      return;
    }
    if (o.responseStatus === "declined") {
      box.innerHTML = `<div class="ho-done declined"><span class="material-symbols-outlined">info</span>
        辞退のご連絡を受け付けました。</div>`;
      return;
    }
    const mailto = o.recruiterEmail
      ? `mailto:${encodeURIComponent(o.recruiterEmail)}?subject=${encodeURIComponent(o.offerName ? `${o.offerName}について` : "選考結果について")}`
      : null;
    box.innerHTML = `
      <div class="ho-actions">
        <p class="due">採用条件を確認しました。回答期限：${fmtDate(o.respondBy)}</p>
        <button class="btn btn-primary" onclick="submitAccept(this)">承諾する</button>
        <button class="btn btn-secondary" onclick="openDeclineForm()">辞退する</button>
        <div id="ho-decline"></div>
        ${mailto ? `
          <p class="ask">条件について確認したいことがありますか？</p>
          <a class="btn btn-secondary" href="${esc(mailto)}">採用担当へ連絡</a>` : ""}
      </div>
      <div id="ho-msg" class="err-text" style="margin-top:10px;"></div>`;
  }

  async function submitAccept(btn) {
    // 区分つきは、チェック（上記の内容を確認し、同意します）が確認の代わり。これまでの合格通知は確認ダイアログ
    if (current.offerType) {
      if (!el("ho-agree")?.checked) { el("ho-msg").textContent = "「上記の内容を確認し、同意します」にチェックしてください"; return; }
    } else if (!confirm("この内容で承諾します。よろしいですか？")) return;
    const msg = el("ho-msg"); msg.textContent = "";
    btn.disabled = true;
    try {
      if (current.offerType) await respond({ action: "accept", agreed: true });
      else await API.hrOfferRespond(token, "accept");
      current.responseStatus = "accepted";
      renderActions(current);
    } catch (e) {
      msg.textContent = e.hint || e.message || "承諾できませんでした";
      btn.disabled = false;
    }
  }

  function openDeclineForm() {
    el("ho-decline").innerHTML = `
      <label>辞退の理由（任意）</label>
      <textarea id="ho-reason" rows="3"></textarea>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="submitDecline(this)">この内容で辞退する</button>`;
  }

  async function submitDecline(btn) {
    const msg = el("ho-msg"); msg.textContent = "";
    btn.disabled = true;
    try {
      await API.hrOfferRespond(token, "decline", el("ho-reason").value.trim() || undefined);
      current.responseStatus = "declined";
      renderActions(current);
    } catch (e) {
      msg.textContent = e.hint || e.message || "辞退の連絡ができませんでした";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
