<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>ダッシュボード - EIGHT HR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261024nav1">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.hr-title { font-size:24px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .hr-sub { color:#6b7080; font-size:13px; margin:0 0 20px; }

    .hr-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .hr-toolbar input[type="text"] { max-width:240px; margin:0; }
    .hr-stage-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .hr-stage-tabs button { border:1px solid #e2e2dc; background:#fff; border-radius:999px; padding:6px 13px;
      font-size:12px; font-weight:500; color:#4a5068; cursor:pointer; font-family:inherit; }
    .hr-stage-tabs button.on { background:#1b2440; border-color:#1b2440; color:#fff; font-weight:700; }
    /* 選考パイプライン：段階ごとの人数。0人の段階は薄く（押せるがレイアウトは変えない） */
    .hr-stage-tabs button .n { display:inline-block; min-width:1.4em; margin-left:6px; font-weight:700; text-align:center; }
    .hr-stage-tabs button.zero:not(.on) { opacity:.45; }
    /* 区分（選考中／採用／無限道場／不採用）。選考パイプラインより一段上の切り替え（検索・段階の行とは別の行） */
    .hr-catbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .hr-cat-tabs { display:inline-flex; max-width:100%; border:1px solid #e2e2dc; border-radius:8px; overflow-x:auto; background:#fff; -webkit-overflow-scrolling:touch; }
    .hr-cat-tabs button, .hr-cat-tabs a.spot-link { display:inline-flex;flex:0 0 auto;white-space:nowrap;align-items:center;text-decoration:none; border:none; border-right:1px solid #e2e2dc; background:#fff; padding:7px 14px; font-size:12.5px;
      font-weight:600; color:#4a5068; cursor:pointer; font-family:inherit; }
    .hr-cat-tabs button:last-child { border-right:none; }
    .hr-cat-tabs button.on { background:#1b2440; color:#fff; }
    .hr-cat-tabs button .n, .hr-cat-tabs a.spot-link .n { margin-left:6px; font-weight:700; }
    .hr-lead-badge { display:inline-block; margin-left:6px; background:#fbf1d6; color:#7d5a00; border-radius:999px;
      padding:1px 8px; font-size:10.5px; font-weight:700; vertical-align:middle; }
    .hr-chips-sm span { display:inline-block; background:#e7eaf3; color:#1b2440; border-radius:999px; padding:1px 8px;
      font-size:11px; margin:0 4px 3px 0; }
    .hr-lead-iv { border:1px solid #e2e2dc; border-radius:8px; padding:10px 12px; margin:0 0 8px; font-size:12.5px; }
    .hr-watch-list label { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; border-bottom:1px solid #f0f0ec; }

    .hr-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e2e2dc; border-radius:10px; overflow:hidden; }
    .hr-table th { text-align:left; font-size:11px; color:#6b7080; font-weight:700; padding:10px 14px;
      background:#f6f6f2; border-bottom:1px solid #e2e2dc; }
    .hr-table td { padding:12px 14px; border-bottom:1px solid #e2e2dc; font-size:13px; vertical-align:top; }
    .hr-table tr:last-child td { border-bottom:none; }
    .hr-table tr.click { cursor:pointer; }
    .hr-table tr.click:hover { background:#f6f6f2; }
    .hr-nm { font-weight:700; color:#1b2440; font-size:14px; display:block; }
    .hr-sub2 { font-size:11.5px; color:#6b7080; display:block; margin-top:2px; }
    .hr-dr-sel { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:0 20px 10px; font-size:12.5px; color:#4a5068; }
    .hr-dr-sel b { color:#1b2440; }
    .hr-due { font-size:12px; color:#1b2440; white-space:nowrap; }
    .hr-due.over { color:#b42318; font-weight:700; }
    .hr-alerts { display:flex; flex-wrap:wrap; gap:4px; }
    .hr-alert { font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; white-space:nowrap; }
    .hr-alert.danger { background:#fde8e6; color:#b42318; }
    .hr-alert.warn { background:#fbf1d6; color:#7d5a00; }

    .hr-rank { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
      border-radius:5px; font-size:11px; font-weight:700; padding:0 6px; }
    .hr-rank.A { background:#1b2440; color:#fff; } .hr-rank.B { background:#e7eaf3; color:#1b2440; }
    .hr-rank.C { background:#efefeb; color:#4a5068; } .hr-rank.D { background:#f6f6f2; color:#9aa0b4; }

    .hr-pill { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:600; }
    .hr-pill .material-symbols-outlined { font-size:14px; }

    .hr-drawer-bg { position:fixed; inset:0; background:rgba(27,36,64,.35); z-index:40; }
    .hr-drawer { position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; padding:22px; }
    .hr-detail { position:fixed; top:0; right:0; bottom:0; width:660px; max-width:94vw; background:#f6f6f2;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; overflow-x:hidden; padding:0; }
    /* スマホはフル幅・1列（横にはみ出さない） */
    @media (max-width:600px) { .hr-detail { width:100vw; max-width:100vw; } }

    /* モーダル＝1つの操作を実行する場所。ドロワー（詳細）の上に重ねて出す。
       閉じてもドロワーは閉じない（採用HR応募者一覧・ドロワーUI改善指示書 §4・§5） */
    .hr-list-status { display:block; margin-top:6px; max-width:160px; font-size:12px; padding:5px; }
    .hr-list-note-text { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere; max-width:170px; margin-top:5px; font-size:12px; }
    .hr-modal-bg { position:fixed; inset:0; background:rgba(27,36,64,.45); z-index:50; }
    .hr-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:440px; max-width:92vw;
      max-height:86vh; overflow-y:auto; background:#fff; border-radius:14px; padding:22px; z-index:51;
      box-shadow:0 20px 60px rgba(27,36,64,.28); overscroll-behavior:contain; }
    /* 項目の多い操作（評価・合格通知・書類・応募者追加）。中だけスクロールする */
    .hr-modal.wide { width:680px; max-height:88vh; }
    /* 評価・採用判断・本人への連絡（hr/applicants.html と hr/ceo-review.html で同じ。直すときは両方そろえる）
       色は意味のあるものだけ：緑＝内定・黄＝保留・赤＝見送り・オレンジ＝本人へ未連絡 */
    .hr-flow-sec { border:1px solid #e2e2dc; border-radius:12px; padding:16px 18px; margin:0 0 14px; background:#fff; }
    .hr-flow-sec.is-wait { background:#fafaf8; }
    .hr-flow-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
    .hr-flow-hd h3 { font-size:14px; font-weight:700; color:#1b2440; margin:0; display:flex; align-items:center; gap:8px; }
    .hr-flow-hd .st { font-size:11px; font-weight:700; color:#6b7080; letter-spacing:.06em; }
    .hr-flow-state { display:inline-flex; align-items:center; gap:3px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:700; background:#efefeb; color:#4a5068; white-space:nowrap; }
    .hr-flow-state .material-symbols-outlined { font-size:15px; }
    .hr-flow-state.done { background:#e5f1e2; color:#2f6f3a; }
    .hr-flow-state.todo { background:#ffedd5; color:#c2410c; }
    .hr-flow-note { font-size:12.5px; color:#6b7080; margin:0; }
    .hr-flow-sum { font-size:13px; color:#1b2440; line-height:1.7; }

    .hr-score-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid #f0f0ec; }
    .hr-score-row:last-of-type { border-bottom:none; }
    .hr-score-row .k { font-size:13px; color:#1b2440; }
    .hr-score-opts { display:flex; gap:6px; flex-shrink:0; }
    .hr-score { width:42px; height:36px; border:1px solid #d9d9d2; border-radius:8px; background:#fff; color:#9aa0b4;
      font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; padding:0; }
    .hr-score:disabled { cursor:default; }
    .hr-score.on[data-v="great"] { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    .hr-score.on[data-v="good"] { background:#e5f1e2; border-color:#2f6f3a; color:#2f6f3a; }
    .hr-score.on[data-v="fair"] { background:#fbf1d6; border-color:#a16207; color:#a16207; }
    .hr-score.on[data-v="bad"] { background:#fdecea; border-color:#b3261e; color:#b3261e; }

    .hr-seg { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #d9d9d2; border-radius:10px; overflow:hidden; background:#fff; margin:0 0 12px; }
    .hr-seg button { border:none; border-right:1px solid #d9d9d2; background:#fff; color:#4a5068; padding:11px 6px; font-size:14px;
      font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:4px; }
    .hr-seg button:last-child { border-right:none; }
    .hr-seg button .material-symbols-outlined { font-size:18px; }
    .hr-seg button.on[data-kind="hired"] { background:#2f6f3a; color:#fff; }
    .hr-seg button.on[data-kind="hold"] { background:#b7791f; color:#fff; }
    .hr-seg button.on[data-kind="rejected"] { background:#b3261e; color:#fff; }
    .hr-dk-banner { border:1px solid; border-radius:10px; padding:10px 12px; font-size:12.5px; margin:0 0 12px; display:flex; gap:6px; align-items:flex-start; }
    .hr-dk-banner .material-symbols-outlined { font-size:18px; }
    .hr-dk-banner[data-kind="hired"] { background:#e5f1e2; color:#2f6f3a; border-color:#2f6f3a; }
    .hr-dk-banner[data-kind="hold"] { background:#fbf1d6; color:#8a5a00; border-color:#b7791f; }
    .hr-dk-banner[data-kind="rejected"] { background:#fdecea; color:#b3261e; border-color:#b3261e; }
    .btn.hr-dk-save[data-kind="hired"] { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    .btn.hr-dk-save[data-kind="hold"] { background:#b7791f; border-color:#b7791f; color:#fff; }
    .btn.hr-dk-save[data-kind="rejected"] { background:#b3261e; border-color:#b3261e; color:#fff; }
    .hr-msg-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .hr-msg-actions .later { margin-left:auto; font-size:12.5px; color:#6b7080; background:none; border:none; cursor:pointer; font-family:inherit; }

    /* 一覧・詳細・カードの小さなバッジ（判断と、本人への連絡状況は別のバッジ） */
    .hr-badges { display:inline-flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
    .hr-badge { display:inline-flex; align-items:center; gap:2px; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
    .hr-badge .material-symbols-outlined { font-size:13px; }
    .hr-badge.d-hired { background:#e5f1e2; color:#2f6f3a; }
    .hr-badge.d-hold { background:#fbf1d6; color:#8a5a00; }
    .hr-badge.d-rejected { background:#fdecea; color:#b3261e; }
    .hr-badge.c-pending { background:#ffedd5; color:#c2410c; border:1px solid #fdba74; }
    .hr-badge.c-done { background:#efefeb; color:#4a5068; }
    /* 確認モーダル（削除など）は、書類のモーダルの上にも出せるように1段上げる */
    .hr-modal-bg.top { z-index:60; } .hr-modal.top { z-index:61; }

    /* メールを送る（ひな型から） */
    .hr-mail-to { background:#f6f6f2; border:1px solid #e2e2dc; border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:13px; color:#1b2440; word-break:break-all; }
    .hr-mail-to .lb { font-size:11px; color:#6b7080; margin-right:6px; }
    .hr-mail-to .sub { font-size:11.5px; color:#4a5068; margin-top:4px; }
    .hr-mail-hist { list-style:none; padding:0; margin:6px 0 0; }
    .hr-mail-hist li { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; font-size:12px; padding:6px 0; border-bottom:1px solid #efefeb; }
    .hr-mail-hist .t { color:#6b7080; } .hr-mail-hist .s { color:#1b2440; font-weight:600; } .hr-mail-hist .m { color:#6b7080; flex-basis:100%; }
    .hr-mail-st { border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; }
    .hr-mail-st.ok { background:#e5f1e2; color:#2f6f3a; } .hr-mail-st.ng { background:#fdecea; color:#b3261e; } .hr-mail-st.warn { background:#fbf1d6; color:#8a5a00; }

    /* 書類タブ */
    .hr-doc { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .hr-doc .t { font-size:13px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:6px; }
    .hr-doc .t .material-symbols-outlined { font-size:18px; color:#6b7080; }
    .hr-doc .f { font-size:13px; margin:6px 0 2px; word-break:break-all; }
    .hr-doc .m { font-size:11.5px; color:#6b7080; }
    .hr-doc .acts { display:flex; gap:6px; margin-top:10px; align-items:center; position:relative; flex-wrap:wrap; }
    .hr-doc .none { font-size:12.5px; color:#9aa0b4; margin:6px 0 0; }
    /* 書類タブの見出しと、書類ごとの状態（未登録→登録済み→送付済み→本人確認済み→承諾済み）。色だけでなく文字でも出す */
    .hr-doc-h { font-size:14px; font-weight:700; color:#1b2440; margin:18px 0 8px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .hr-doc-h:first-child { margin-top:0; }
    .hr-doc-h .sub { font-size:11.5px; font-weight:400; color:#6b7080; }
    .hr-dst { display:inline-flex; align-items:center; border-radius:999px; padding:1px 9px; font-size:11px; font-weight:700; background:#efefeb; color:#4a5068; margin-left:auto; white-space:nowrap; }
    .hr-dst[data-st="registered"] { background:#e7eaf3; color:#1b2440; }
    .hr-dst[data-st="sent"] { background:#fbf1d6; color:#7d5a00; }
    .hr-dst[data-st="confirmed"] { background:#e1ecf9; color:#1b4b8f; }
    .hr-dst[data-st="accepted"] { background:#e5f1e2; color:#2f6f3a; }
    .hr-dst[data-st="declined"], .hr-dst[data-st="revoked"] { background:#fdecea; color:#b3261e; }
    .hr-doc .t .hr-dst { margin-left:auto; }
    .hr-doc .note { font-size:11.5px; color:#9aa0b4; margin:4px 0 0; }
    .hr-more { position:relative; }
    .hr-menu-pop { position:absolute; right:0; top:34px; background:#fff; border:1px solid #e2e2dc; border-radius:8px;
      box-shadow:0 8px 24px rgba(27,36,64,.14); min-width:160px; z-index:5; padding:4px 0; }
    .hr-menu-pop button { display:block; width:100%; text-align:left; border:none; background:none; padding:9px 14px;
      font-size:13px; color:#1b2440; cursor:pointer; font-family:inherit; }
    .hr-menu-pop button:hover { background:#f6f6f2; }
    .hr-menu-pop button.danger { color:#b3261e; }
    .hr-drop { border:2px dashed #cfd4e0; border-radius:10px; padding:22px; text-align:center; color:#6b7080;
      font-size:13px; cursor:pointer; background:#fafaf7; }
    .hr-drop.over { border-color:#1b2440; background:#eef0f6; color:#1b2440; }
    /* 書類列：登録済みの書類だけアイコンで。押すとプレビューを別タブで（行は開かない） */
    .hr-docs { display:inline-flex; gap:6px; white-space:nowrap; }
    .hr-docs a { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:7px;
      color:#1b2440; text-decoration:none; overflow:hidden; }   /* アイコンの字が読み込み前でも隣へはみ出さない */
    .hr-docs a:hover { background:#eef0f6; }
    .hr-docs a .material-symbols-outlined { font-size:20px; }

    /* 選択中バー（Selection Action Bar）。1件以上チェックすると画面下部に固定表示する。
       ドロワー(41)・モーダル(51)より前面に出ないよう、z-indexは30〜35の範囲にとどめる */
    .hr-bulkbar { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      width:fit-content; min-width:520px; max-width:calc(100vw - 40px);
      display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #d8dce8;
      border-radius:13px; padding:12px 16px; font-size:13px; color:#1b2440; flex-wrap:wrap;
      box-shadow:0 12px 32px rgba(27,36,64,.18); z-index:32; }
    .hr-bulkbar .cnt { font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .hr-bulkbar .cnt .material-symbols-outlined { font-size:17px; color:#1b2440; }
    .hr-bulkbar .sp { flex:1; }
    @media (max-width:600px) {
      .hr-bulkbar { left:12px; right:12px; transform:none; width:auto; min-width:0; max-width:none; }
    }
    .hr-check-col { width:34px; }

    /* NEXT ACTION：いまの状態と、次に押すボタン1つだけ（高さ 80〜110px 程度。淡い注意色） */
    .hr-next { background:#f3f8e3; border:1px solid #dde8bd; border-radius:10px; padding:12px 14px; margin:0 0 12px; }
    .hr-next .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hr-next .ttl { font-size:15px; font-weight:700; color:#1b2440; }
    .hr-next .st { font-size:12px; font-weight:600; color:#4a5068; background:#fff; border:1px solid #dde8bd; border-radius:999px; padding:1px 10px; }
    .hr-next .chip { font-size:11px; color:#4a5068; }
    .hr-next .sub { font-size:12px; color:#4a5068; margin:4px 0 8px; line-height:1.5; }
    .hr-next > .btn { margin-top:0; }
    .hr-contact-row { padding:0 2px; }
    /* 概要：値のある項目だけ。メールはその場で登録・編集 */
    .hr-email-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; margin:2px 0 10px; }
    .hr-email-row .k { color:#6b7080; min-width:3em; }
    .hr-email-row .v { color:#1b2440; font-weight:600; overflow-wrap:anywhere; }
    .hr-email-row .v.muted { color:#9a5b00; font-weight:600; }
    .hr-email-row input { flex:1 1 220px; min-width:0; }
    .hr-email-row .acts { display:flex; gap:6px; }
    .hr-email-row .err-text { flex-basis:100%; margin:0; }
    .hr-more-info summary { cursor:pointer; font-size:12.5px; font-weight:700; color:#1b2440; padding:4px 0; }
    .hr-more-info .when-open, .hr-more-info[open] .when-closed { display:none; }
    .hr-more-info[open] .when-open { display:inline; }
    .hr-ceo-brief { display:flex; align-items:center; gap:10px; font-size:13px; color:#1b2440; background:#fff;
      border:1px solid #e2e2dc; border-radius:8px; padding:8px 12px; margin-top:12px; }
    .hr-ceo-brief b { font-size:15px; }
    .hr-head-mail { font-size:12px; color:#4a5068; margin-top:2px; overflow-wrap:anywhere; }
    .hr-head-mail.none { color:#9a5b00; }
    .hr-next .now { font-size:11px; color:#4a5068; margin-bottom:2px; }
    /* 選考（どこまで進んだか）・状態（いま何待ちか）・NEXT ACTION（次に何をするか）を上から並べる */
    .hr-state { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin:0 0 10px; }
    .hr-state dt { font-size:11px; font-weight:700; color:#4a5068; }
    .hr-state dd { margin:0; font-size:14px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

<div class="wrap">
