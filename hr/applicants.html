  </div>
  <div style="display:flex;align-items:center;justify-content:flex-end;margin:0 0 12px;">
    <a href="/hr/inbox.html" id="hr-inbox-link" style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #d0d4de;border-radius:8px;padding:8px 12px;background:#fff;color:#1b2440;font-size:12px;font-weight:700;text-decoration:none;">採用メールの新着受付 →</a>
  </div>
  <div id="source-summary" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;"></div>

  <div id="bulkbar"></div>

  <div style="overflow-x:auto;">
    <table class="hr-table">
      <thead id="thead"><tr>
        <th class="hr-check-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
        <th>応募者</th><th>書類</th><th>選考</th><th>状態</th><th>社内メモ</th><th>NEXT</th><th>担当</th><th>対応期限</th><th>警告</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="11" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="modal-root"></div>
<div id="action-root"></div>
<div id="hr-modal-root"></div>
<div id="confirm-root"></div>

<script src="../js/api-client.js?v=20261024nav1"></script>
<script src="../js/layout-marketing.js"></script>
<script src="../js/hr-layout.js?v=20261024nav1"></script>
<script src="../js/hr-nav-analytics.js?v=20261023hr1"></script>
<script src="../js/hr-materials-nav.js?v=20261015hrmat1"></script>
<script src="../js/jst.js?v=20261024nav1"></script>
<script src="../js/hr-lms-trial.js?v=20261024step1"></script>
<script src="../js/hr-inbox-count.js?v=20261024inbox1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = HRLayout.esc;

  const STAGES = [
    { key: "applied", label: "新規応募" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "ceo_recommend", label: "社長推薦" }, { key: "ceo_interview", label: "社長面談" },
    { key: "offer", label: "内定" }, { key: "joining_scheduled", label: "入社予定" },
  ];
  // 無限道場リードの段階（lib/hr-lead-flow.js の MUGENDOJO_STAGES と同じ並び）
  const MD_STAGES = [
    { key: "applied", label: "新規リード" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "md_trial", label: "体験案内" }, { key: "md_considering", label: "参加検討" },
    { key: "md_applied", label: "申込" }, { key: "md_joined", label: "参加" },
  ];
  // 上段の区分。デフォルトは「選考中」＝見送り・辞退を除いた、まだ対応中の人だけ。
  // 区分タブ（選考中／業務委託／無限道場／終了）。どのタブに入るかはサーバ（lib/hr.js listTabOf → a.listTab）が決める。
  // 「終了」には見送り（passed）・辞退（declined）・募集終了（position_closed）が自動で入る。削除とは別で履歴等は残る
  const CATEGORIES = [
    { key: "active", label: "選考中" },
    { key: "contractor", label: "業務委託" },
    { key: "mugendojo", label: "無限道場" },
    { key: "closed", label: "終了" },
  ];
  // 古い URL（?category=recruitment / rejected / all）も開けるように
  const CATEGORY_ALIAS = { all: "active", recruitment: "active", rejected: "closed" };
  const isLead = (a) => a?.leadCategory === "mugendojo";
  const tabOf = (a) => a?.listTab || (["passed", "declined", "position_closed"].includes(a?.status) ? "closed" : isLead(a) ? "mugendojo" : "active");
  const inCategory = (a, key) => tabOf(a) === (CATEGORY_ALIAS[key] || key);
  const STATUS_COLOR = {
    todo: ["#efefeb", "#4a5068", "remove"], scheduling: ["#e7eaf3", "#1b2440", "calendar_month"],
    interview_scheduled: ["#e7eaf3", "#1b2440", "video_call"], eval_pending: ["#fbf1d6", "#7d5a00", "edit_note"],
    ceo_recommend_pending: ["#fbf1d6", "#7d5a00", "recommend"], ceo_interview_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    ceo_decision_pending: ["#fbf1d6", "#7d5a00", "pending_actions"], next_scheduling_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    offer_draft_pending: ["#fbf1d6", "#7d5a00", "description"], offer_review_pending: ["#fbf1d6", "#7d5a00", "fact_check"],
    offer_send_pending: ["#fbf1d6", "#7d5a00", "send"], offer_sent: ["#e7eaf3", "#1b2440", "mark_email_read"],
    offer_viewed: ["#e5f1e2", "#2f6f3a", "visibility"], offer_resend_pending: ["#fbf1d6", "#7d5a00", "send"],
    offer_response_pending: ["#e7eaf3", "#1b2440", "hourglass_empty"],
    accepted: ["#e5f1e2", "#2f6f3a", "check_circle"], declined: ["#efefeb", "#4a5068", "remove"],
    done: ["#e5f1e2", "#2f6f3a", "check_circle"], passed: ["#efefeb", "#4a5068", "remove"],
    position_closed: ["#efefeb", "#4a5068", "inventory_2"],
  };
  const OVERDUE_COLOR = ["#fdecea", "#b3261e", "error"];
  // 社長判断待ちのうち、保留にしたもの（判断そのものは済んでいない。期限と次の確認事項を見る）
  const HOLD_COLOR = ["#fbf1d6", "#7d5a00", "pause_circle"];
  const isOnHold = (a) => a.decision === "hold" && a.status === "ceo_decision_pending";
  const STATUS_LABEL = {
    todo: "未対応", scheduling: "日程調整中", interview_scheduled: "面談予定",
    eval_pending: "評価入力待ち", ceo_recommend_pending: "社長推薦待ち",
    ceo_interview_pending: "社長面談設定待ち", ceo_decision_pending: "社長判断待ち",
    next_scheduling_pending: "次回調整待ち", offer_draft_pending: "合格通知作成待ち",
    offer_review_pending: "社内確認待ち", offer_send_pending: "本人送付待ち",
    offer_sent: "本人送付済み", offer_viewed: "本人が閲覧済み", offer_resend_pending: "URL再送待ち",
    offer_response_pending: "承諾待ち", accepted: "承諾済み", declined: "辞退",
    done: "完了", passed: "見送り", position_closed: "募集終了",
  };

  let applicants = [];
  let employees = [];
  let meEmployeeId = null;   // 応募者を追加するときの担当の初期値（登録する本人）
  let sourceOptions = ["Wantedly", "Green", "Indeed", "求人ボックス", "エージェント", "リファラル", "自社サイト", "SNS", "イベント・セミナー", "その他"];
  let sourceCounts = [];
  /** 担当の選択肢（一括変更・追加・詳細で同じもの） */
  const recruiterOptions = (selected) => `<option value="">未定</option>` + employees.map((e) =>
    `<option value="${esc(e.id)}" ${e.id === selected ? "selected" : ""}>${esc(e.display_name)}</option>`).join("");
  let stageFilter = "";
  let categoryFilter = "active";
  let spotCount = null;
  let leadReady = true;      // db/118（リードの列）が入っているか。無ければ無限道場の欄を出さない
  let openId = null;
  let canDecide = false;
  let canAdvance = false;   // 本採用へ進める（社長・管理者・人事）
  // 一覧の複数選択（ページ内表示分だけを対象にする。README §1）
  let selectedIds = new Set();
  let visibleIds = [];

  // 表示速度：枠（権限の確認）を待たずに一覧を取りにいき始める。
  // この画面は「選考中／採用／無限道場／不採用」を切り替えるので、閉じた人も含めて一度取得する（category=all）。
  // HRダッシュボードは採用だけ（既定）を取るので、鍵を分ける（混ぜると、ダッシュボードに無限道場が出る）
  const fetchApplicants = () => API.api("/api/hr/applicants?category=all");
  API.warm("hr:applicants:all", fetchApplicants, (me) => HRLayout.allows(me, "applicants"));

  HRLayout.init({ active: "applicants" }).then((ctx) => { if (ctx) { canDecide = ctx.canDecide; canAdvance = canAdvanceOf(ctx.me); start(); window.HrInboxCount?.mount(el("hr-inbox-link")); } });
  // 本採用へ進める（社員登録へ）。社長・管理者・人事（社員登録の画面に入れる人＝/api/me の access.officeHr）。
  // サーバの canAdvanceHire（lib/gw.js）と同じ条件（test/accessparity.mjs が見張る）
  function canAdvanceOf(me) {
    const roles = me?.gw?.roles || [];
    const isAdmin = Boolean(me?.gw?.isAdmin || me?.isAdmin);
    return isAdmin || roles.includes("owner") || (roles.includes("hr") && Boolean(me?.access?.officeHr));
  }

  function start() {
    const cat = new URLSearchParams(location.search).get("category");
    const want = CATEGORY_ALIAS[cat] || cat;   // 旧URL互換
    if (CATEGORIES.some((c) => c.key === want)) categoryFilter = want;
    restoreView();
    renderCategoryTabs();
    renderStageTabs();
    load();
    loadSpotCount();
    const q = new URLSearchParams(location.search);
    if (q.get("new")) openAdd();
    if (q.get("id")) openDetail(q.get("id"));
  }

  // 選考パイプライン：「採用フロー上のどこに人が溜まっているか」。人数は取得済みの応募者から数える
  // （固定値を持たない）。細かい状態（status）は上に出さない
  /** いまの区分の応募者 */
  const catList = () => applicants.filter((a) => inCategory(a, categoryFilter));
  const listUrl = () => (categoryFilter === "active" ? "/hr/applicants.html" : `/hr/applicants.html?category=${categoryFilter}`);

  async function loadSpotCount() {
    try {
      const r=await API.api("/api/hr/spot?summary=1");
      spotCount=Number(r.count);
    } catch { spotCount=null; }
    renderCategoryTabs();
  }
  function renderCategoryTabs() {
    API.morph(el("cat-tabs"), CATEGORIES.map((c) => {
      const n = applicants.filter((a) => inCategory(a, c.key)).length;
      return `${c.key === "closed" ? '<a role="tab" aria-selected="false" class="spot-link" href="/hr/spot.html">スポット人材<span class="n">'+(spotCount===null?"—":spotCount)+'</span></a>' : ""}<button role="tab" aria-selected="${categoryFilter === c.key}" class="${categoryFilter === c.key ? "on" : ""}"
        data-category="${esc(c.key)}" onclick="setCategory('${esc(c.key)}')">${esc(c.label)}<span class="n">${n}</span></button>`;
    }).join(""));
    // 無限道場の通知先（運営担当）は、無限道場を見ているときだけ出す
    el("lead-tools").innerHTML = categoryFilter === "mugendojo"
      ? `<button class="btn btn-secondary btn-sm" onclick="openLeadWatchers()">
          <span class="material-symbols-outlined icon-inline">notifications</span>通知先（運営担当）</button>
        ${leadReady ? "" : `<span class="muted" style="font-size:12px;margin-left:8px;">リードの列がまだありません（db/118_hr_leads.sql 未実行）</span>`}`
      : "";
  }
  function renderSourceSummary() {
    const box = el("source-summary");
    if (!box) return;
    const rows = (sourceCounts || []).filter((x) => Number(x.count) > 0);
    box.innerHTML = rows.length
      ? `<span style="font-size:11.5px;color:#6b7080;">応募媒体</span>${rows.map((x) =>
          `<span class="hr-chip" style="margin:0;padding:3px 9px;">${esc(x.label)} <b>${esc(x.count)}</b></span>`).join("")}`
      : "";
  }

  function setCategory(key) {
    categoryFilter = key;
    stageFilter = "";
    saveView();
    selectedIds.clear();
    if (!openId) history.replaceState({}, "", listUrl());
    renderCategoryTabs(); renderStageTabs(); render();
  }

  function stageMatch(a, key) {
    if (!key) return true;
    if (key === "status:passed") return a.status === "passed";
    if (key === "status:declined") return a.status === "declined";
    if (key === "status:position_closed") return a.status === "position_closed";
    return a.stage === key;
  }
  function renderStageTabs() {
    const pool = catList();
    const count = (key) => (key ? pool.filter((a) => stageMatch(a, key)).length : pool.length);
    const tab = (key, label) => {
      const n = count(key);
      return `<button class="${stageFilter === key ? "on" : ""}${n ? "" : " zero"}" data-stage="${esc(key || "all")}"
        onclick="setStage('${esc(key)}')">${esc(label)}<span class="n">${n}</span></button>`;
    };
    const stages = categoryFilter === "closed"
      ? [{ key: "status:passed", label: "見送り・不採用" }, { key: "status:declined", label: "辞退" }, { key: "status:position_closed", label: "募集終了" }]
      : categoryFilter === "mugendojo" ? MD_STAGES : STAGES;
    API.morph(el("stage-tabs"), tab("", "すべて") + stages.map((s) => tab(s.key, s.label)).join(""));
  }
  function setStage(key) { stageFilter = key; saveView(); renderStageTabs(); render(); }

  // 一覧の見え方（区分・段階・検索・スクロール位置）を、この画面のあいだだけ覚えておく。
  // 詳細を開いて戻る・再読み込みしたときに、勝手に「選考中」の先頭へ戻さないため（終了タブから開いた人も同じ）
  const VIEW_KEY = "hr-applicants-view";
  function saveView() {
    try {
      sessionStorage.setItem(VIEW_KEY, JSON.stringify({ category: categoryFilter, stage: stageFilter,
        q: el("q")?.value || "", y: window.scrollY || 0 }));
    } catch { /* 保存できなくても動く */ }
  }
  function restoreView() {
    let v = null;
    try { v = JSON.parse(sessionStorage.getItem(VIEW_KEY) || "null"); } catch { v = null; }
    if (!v) return;
    // URL で区分を指定して開いたときは URL を優先。段階・検索は、同じ区分のときだけ戻す
    const urlCat = new URLSearchParams(location.search).get("category");
    if (!urlCat && CATEGORIES.some((c) => c.key === v.category)) categoryFilter = v.category;
    if (v.category === categoryFilter) {
      stageFilter = typeof v.stage === "string" ? v.stage : "";
      if (v.q && el("q")) el("q").value = v.q;
      if (v.y) restoreScrollY = v.y;
    }
  }
  var restoreScrollY = 0;   // var：start() より先に読まれても TDZ にならないように
  addEventListener("pagehide", saveView);

  let loading = null;   // 一覧の読み込み中（追加フォームが担当の選択肢を待つため）
  function load() { loading = loadList().finally(() => { loading = null; }); return loading; }
  async function loadList() {
    try {
      // 2回目からは前回の一覧をすぐ出し、裏で最新にする（変わった行だけ描き直す）
      await API.swr("hr:applicants:all", fetchApplicants, (res) => {
        if (res.notReady) {
          el("rows").innerHTML = `<tr><td colspan="${colCount()}"><div class="banner warn">
            <span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div></td></tr>`;
          return;
        }
        applicants = res.applicants || [];
        employees = res.employees || [];
        meEmployeeId = res.meEmployeeId || null;
        if (Array.isArray(res.sources?.options) && res.sources.options.length) sourceOptions = res.sources.options;
        sourceCounts = Array.isArray(res.sources?.counts) ? res.sources.counts : [];
        leadReady = res.leadReady !== false;
        renderSourceSummary();
        renderCategoryTabs();
        renderStageTabs();
        render();
      });
    } catch (e) {
      el("rows").innerHTML = `<tr><td colspan="${colCount()}"><div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
    }
  }

  // 書類列。登録済みの書類（最新版）だけアイコンで出す。未登録は何も出さない。
  // 押すと既存のプレビュー（hr/document.html）を別タブで開く。行のクリック（詳細ドロワー）は発火させない。
  // 表示用の URL はここでは持たない（document.html が権限を確かめてから短時間の URL を取る）
  function docsCell(a) {
    const d = a.docs;
    if (!d) return "";
    const link = (docId, icon, label) => (docId ? `<a href="/hr/document.html?applicant=${encodeURIComponent(a.id)}&doc=${encodeURIComponent(docId)}"
      target="_blank" rel="noopener noreferrer" title="${label}をプレビュー" aria-label="${label}をプレビュー" data-doc-link="${icon}"
      onclick="event.stopPropagation()"><span class="material-symbols-outlined">${icon}</span></a>` : "");
    return `<span class="hr-docs" data-docs>${link(d.resumeId, "description", "履歴書")}${link(d.workHistoryId, "work_history", "職務経歴書")}</span>`;
  }

  /** 流入元の1語（UTM → 参照元のドメイン → 直接） */
  function leadSourceLabel(a) {
    const utm = [a.utmSource, a.utmMedium].filter(Boolean).join(" / ");
    if (utm) return utm;
    const ref = a.attribution?.first?.referrer;
    if (ref) { try { return new URL(ref).hostname; } catch { /* そのまま下へ */ } }
    return "直接";
  }
  const leadDiagnosis = (a) => a.leadProfile?.diagnosis_label || a.leadProfile?.diagnosis_type || "";
  const leadInterests = (a) => (a.leadProfile?.interests || []);

  const THEAD = {
    standard: ["応募者", "書類", "選考", "状態", "社内メモ", "NEXT", "担当", "対応期限", "警告", ""],
    mugendojo: ["氏名", "流入元", "興味・目的", "適性診断", "状態", "面談日時", "担当", "登録日", "最終接触", ""],
  };
  let theadKind = "standard";
  function renderThead() {
    const kind = categoryFilter === "mugendojo" ? "mugendojo" : "standard";
    if (kind === theadKind && el("chk-all")) return;
    theadKind = kind;
    el("thead").innerHTML = `<tr><th class="hr-check-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
      ${THEAD[kind].map((h) => `<th>${esc(h)}</th>`).join("")}</tr>`;
  }
  const colCount = () => THEAD[theadKind].length + 1;

  function statusPill(a) {
    const [bg, fg, icon] = a.overdue ? OVERDUE_COLOR : (STATUS_COLOR[a.status] || STATUS_COLOR.todo);
    const statusLabel = a.overdue ? "期限超過" : a.statusLabel;
    return `<span class="hr-pill" style="background:${bg};color:${fg};">
          <span class="material-symbols-outlined">${icon}</span>${esc(statusLabel)}</span>`;
  }

  /** 期限の列：対応期限（超過は赤）。無ければ今日の面談 */
  function dueCell(a) {
    if (a.decisionDueOn) return `<span class="${a.overdue ? "hr-due over" : "hr-due"}">${esc(a.decisionDueOn)}</span>`;
    if (a.nextInterviewAt) return `<span class="hr-due">${esc(fmtDate(a.nextInterviewAt))}</span>`;
    return `<span class="muted">—</span>`;
  }
  /** 警告（起きてはいけない状態。サーバの alerts。lib/hr.js applicantAlerts） */
  function alertsHtml(a) {
    const list = a.alerts || [];
    if (!list.length) return "";
    return `<span class="hr-alerts">${list.map((x) =>
      `<span class="hr-alert ${x.level === "danger" ? "danger" : "warn"}" data-alert="${esc(x.key)}">${esc(x.label)}</span>`).join("")}</span>`;
  }

  /** 無限道場の一覧の1行 */
  function leadRow(a) {
    return `
      <tr class="click" onclick="openDetail('${esc(a.id)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${selectedIds.has(a.id) ? "checked" : ""}
          onchange="toggleSelect('${esc(a.id)}', this.checked)"></td>
        <td><span class="hr-nm">${esc(a.name)}</span><span class="hr-sub2">${esc(a.leadProfile?.occupation || "")}</span></td>
        <td>${esc(leadSourceLabel(a))}${a.utmCampaign ? `<span class="hr-sub2">${esc(a.utmCampaign)}</span>` : ""}</td>
        <td class="hr-chips-sm">${leadInterests(a).map((x) => `<span>${esc(x)}</span>`).join("") || "—"}</td>
        <td>${esc(leadDiagnosis(a) || "—")}</td>
        <td>${statusPill(a)}<span class="hr-sub2">${esc(a.stageLabel)}</span></td>
        <td>${a.nextInterviewAt ? esc(fmtDate(a.nextInterviewAt)) : "—"}</td>
        <td>${esc(a.recruiterName || "未定")}</td>
        <td>${esc(JST.date(a.createdAt))}</td>
        <td>${a.lastContactedAt ? esc(JST.date(a.lastContactedAt)) : "—"}</td>
        <td style="text-align:right;"><span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span></td>
      </tr>`;
  }

  function render() {
    renderThead();
    const q = (el("q").value || "").trim().toLowerCase();
    const list = catList().filter((a) =>
      stageMatch(a, stageFilter)
      && (!q || `${a.name} ${a.jobTitle} ${a.source || ""}`.toLowerCase().includes(q)));
    // 毎日の確認順（期限超過 → 今日対応 → 新規応募 → その他 → 終わったもの。サーバの priority。lib/hr.js）。
    // 同じ順位の中は、いままでどおり新しい応募が上
    list.sort((x, y) => (x.priority ?? 3) - (y.priority ?? 3));
    visibleIds = list.map((a) => a.id);

    if (!list.length) {
      API.morph(el("rows"), `<tr><td colspan="${colCount()}" class="empty">対象がありません。</td></tr>`);
      renderBulkBar();
      return;
    }
    if (theadKind === "mugendojo") {
      API.morph(el("rows"), list.map(leadRow).join(""));
      renderBulkBar();
      return;
    }
    API.morph(el("rows"), list.map((a) => {
      const [bg, fg, icon] = a.overdue ? OVERDUE_COLOR : isOnHold(a) ? HOLD_COLOR : (STATUS_COLOR[a.status] || STATUS_COLOR.todo);
      const statusLabel = a.overdue ? "期限超過" : isOnHold(a) ? "保留中（社長判断）" : a.statusLabel;
      return `
      <tr class="click" onclick="openDetail('${esc(a.id)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${selectedIds.has(a.id) ? "checked" : ""}
          onchange="toggleSelect('${esc(a.id)}', this.checked)"></td>
        <td><span class="hr-nm">${esc(a.name)}${isLead(a) ? `<span class="hr-lead-badge">無限道場</span>` : ""}</span><span class="hr-sub2">${esc(a.jobTitle)} ／ ${esc(a.source)}</span></td>
        <td>${docsCell(a)}</td>
        <td>${esc(a.stageLabel)}${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:6px;">${esc(a.rank)}</span>` : ""}</td>
        <td><span class="hr-pill" style="background:${bg};color:${fg};">
          <span class="material-symbols-outlined">${icon}</span>${esc(statusLabel)}</span>${decisionBadges(a)}${listStatusSelect(a)}</td>
        <td onclick="event.stopPropagation()">${listNoteCell(a)}</td>
        <td>${esc(listNextAction(a))}</td>
        <td>${esc(a.recruiterName || "未定")}</td>
        <td data-col="due">${dueCell(a)}</td>
        <td data-col="alerts">${alertsHtml(a)}</td>
        <td style="text-align:right;"><span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span></td>
      </tr>`;
    }).join(""));
    renderBulkBar();
    // 詳細から戻った・再読み込みしたときは、前に見ていた位置まで戻す（一覧が描けてから1回だけ）
    if (restoreScrollY && applicants.length) {
      const y = restoreScrollY; restoreScrollY = 0;
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
  }

  // ---- 複数選択・一括操作 -----------------------------------------------------------
  // 全選択は「いま表示している分（visibleIds）」だけを対象にする。
  // 意図せず全DBを対象にしない（README §1）
  function toggleSelectAll(checked) {
    if (checked) visibleIds.forEach((id) => selectedIds.add(id));
    else visibleIds.forEach((id) => selectedIds.delete(id));
    render();
  }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    renderBulkBar();
    updateSelectAllCheckbox();
  }

  function updateSelectAllCheckbox() {
    const box = el("chk-all");
    if (!box) return;
    const selectedOnPage = visibleIds.filter((id) => selectedIds.has(id)).length;
    box.checked = visibleIds.length > 0 && selectedOnPage === visibleIds.length;
    box.indeterminate = selectedOnPage > 0 && selectedOnPage < visibleIds.length;
  }

  function clearSelection() { selectedIds.clear(); render(); }

  function renderBulkBar() {
    updateSelectAllCheckbox();
    const box = el("bulkbar");
    if (!selectedIds.size) { box.innerHTML = ""; return; }
    box.innerHTML = `
      <div class="hr-bulkbar">
        <span class="cnt"><span class="material-symbols-outlined">check_circle</span>${selectedIds.size}名選択中</span>
        <span class="sp"></span>
        <button class="btn btn-secondary btn-sm" onclick="openBulkStatusModal()">ステータス変更</button>
        <button class="btn btn-secondary btn-sm" onclick="openBulkRecruiterModal()">担当変更</button>
        <button class="btn btn-danger btn-sm" onclick="openBulkDeleteModal()">削除</button>
        <button class="btn btn-secondary btn-sm" onclick="clearSelection()">選択解除</button>
      </div>`;
  }

  // ---- モーダル（1つの操作を実行する場所）。ドロワーの上に重ねて出し、
  // 閉じてもドロワーは閉じない（README §4・§5） ------------------------------------
  function openHrModal(html, keepListEdit = false) {
    if (!keepListEdit) listEdit = null;
    el("hr-modal-root").innerHTML = `<div class="hr-modal-bg" onclick="closeHrModal()"></div><div class="hr-modal">${html}</div>`;
  }
  function closeHrModal() { listEdit = null; el("hr-modal-root").innerHTML = ""; }

  // 一覧の編集は応募者メモ / status と明示完了時の対応期限。NEXT・採否・面談・メールは変更しない。
  let listEdit = null;
  window.addEventListener("popstate", () => { if (listEdit) closeHrModal(); });
  document.addEventListener("keydown", (event) => {
    if (!listEdit) return;
    if (event.key === "Escape") { event.preventDefault(); closeHrModal(); }
    if (event.key === "Tab") {
      const controls = [...el("hr-modal-root").querySelectorAll("button:not([disabled]), textarea:not([disabled]), input:not([disabled])")];
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
  });
  const manualStatusKeys = Object.keys(STATUS_LABEL).filter((key) => !key.startsWith("offer_") && !["accepted", "done"].includes(key));
  function listStatusSelect(a) {
    const locked = a.employeeId || ["accepted", "done"].includes(a.status);
    const keys = manualStatusKeys.includes(a.status) ? manualStatusKeys : [a.status, ...manualStatusKeys];
    return `<select class="hr-list-status" ${locked ? 'disabled title="承諾・社員登録後は専用の手続きから変更してください"' : ""} aria-label="${esc(a.name)}の状態" onclick="event.stopPropagation()"
      onchange="event.stopPropagation();openListEdit('${esc(a.id)}','status',this.value);this.value='${esc(a.status)}'">
      ${keys.map((key) => `<option value="${esc(key)}" ${key === a.status ? "selected" : ""}>${esc(STATUS_LABEL[key] || a.statusLabel || key)}</option>`).join("")}</select>`;
  }
  function listNoteCell(a) {
    return `<button class="btn btn-secondary btn-sm hr-list-note" aria-label="${esc(a.name)}の社内メモを編集"
      onclick="openListEdit('${esc(a.id)}','note')">${a.note ? "メモを編集" : "メモを追加"}</button>
      ${a.note ? `<span class="hr-list-note-text">${esc(a.note)}</span>` : ""}`;
  }
  async function openListEdit(id, kind, status) {
    const current = applicants.find((a) => a.id === id);
    if (!current || (kind === "status" && (current.status === status || !manualStatusKeys.includes(status)))) return;
    openHrModal(`<h2>内容を確認しています…</h2><button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>`);
    const f = listEdit = { id, kind, status, busy: false };
    try {
      const d = await API.getHrApplicant(id);
      if (listEdit !== f) return;
      f.before = d.applicant;
      if (kind === "status") {
        if (d.applicant.employeeId || ["accepted", "done"].includes(d.applicant.status)) throw new Error("承諾・社員登録後は専用の手続きから変更してください");
        if (!(d.statusOptions || []).some((o) => o.key === status)) throw new Error("この状態は選択できません。再読み込みしてください");
        f.check = await API.updateHrApplicant({ id, action: "setStatus", status, dryRun: true });
        if (listEdit !== f) return;
      }
      openHrModal(`<h2>${kind === "note" ? "社内メモ" : "状態を変更"}</h2><p>${esc(d.applicant.name)}</p>
        ${kind === "note" ? `<label for="list-note">応募者全体の社内メモ（2000文字まで）</label>
          <textarea id="list-note" rows="6" maxlength="2000">${esc(d.applicant.note || "")}</textarea>
          <p class="muted">本人には送信しません。空にして保存するとメモを削除します。NEXTの案内・面談メモは変わりません。</p>`
          : `<p>${esc(f.check.from)} → <b>${esc(f.check.to)}</b></p>
          <p class="muted">状態と、完了チェック時は対応期限を変更します。選考段階・面談予定・採否判断は変わらず、メールも送りません。期限超過は対応期限から自動判定されます。承諾・完了・通知の進行は専用の手続きから行ってください。</p>
          <div style="margin:12px 0;"><p>現在の対応期限：<b>${esc(d.applicant.decisionDueOn || "未設定")}</b></p>
            <label><input id="list-complete" type="checkbox" onchange="toggleListDeadline()">現在の対応を完了し、この対応期限を終了する</label>
            <p class="muted">状態を変えるだけでは期限を消しません。この対応が実際に完了した場合だけチェックしてください。</p>
            <label for="list-next-due">次の対応期限（任意）</label><input id="list-next-due" type="date" disabled>
            <p class="muted">完了チェック時、空欄なら次の期限は未設定。入力した場合は、その日付で期限超過を判定します。</p>
          </div>
          ${(f.check.warnings || []).length ? `<div class="banner warn" style="display:block"><ul>${f.check.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
          <label><input id="list-status-ack" type="checkbox">注意を確認しました</label></div>` : ""}`}
        <div id="list-edit-msg" class="err-text" role="status" aria-live="polite"></div>
        <button class="btn btn-primary" id="list-edit-save" onclick="saveListEdit(this)">保存する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>`, true);
      el("hr-modal-root").querySelector(".hr-modal").setAttribute("role", "dialog");
      el("hr-modal-root").querySelector(".hr-modal").setAttribute("aria-modal", "true");
      (el("list-note") || el("list-edit-save")).focus();
    } catch (e) {
      if (listEdit !== f) return;
      openHrModal(`<h2>編集できませんでした</h2><p role="alert">${esc(e.hint || e.detail || e.message)}</p><button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>`);
    }
  }
  function toggleListDeadline() {
    if (listEdit?.busy) return;
    const due = el("list-next-due");
    if (due) due.disabled = !el("list-complete")?.checked;
  }
  async function saveListEdit(btn) {
    const f = listEdit, msg = el("list-edit-msg");
    if (!f || f.busy || !msg) return;
    const ack = f.kind === "status" && (f.check.warnings || []).length > 0;
    if (ack && !el("list-status-ack")?.checked) { msg.textContent = "注意を確認してから保存してください"; return; }
    const note = el("list-note")?.value || "";
    if (f.kind === "note" && note.length > 2000) { msg.textContent = "メモは2000文字以内にしてください"; return; }
    const complete = f.kind === "status" && el("list-complete")?.checked;
    const deadline = complete ? { completeCurrentAction: true, expectedStatus: f.before.status,
      expectedDecisionDueOn: f.before.decisionDueOn || null, nextDecisionDueOn: el("list-next-due")?.value || null } : {};
    f.busy = true; msg.textContent = "";
    const inputs = [el("list-note"), el("list-status-ack"), el("list-complete"), el("list-next-due")].filter(Boolean);
    const disabled = inputs.map((input) => input.disabled);
    inputs.forEach((input) => { input.disabled = true; });
    try {
      await KPLayout.busy(btn, "保存中…", async () => {
        // 長く開いたままのフォームで、他の担当者の変更を不用意に上書きしない。
        const latest = await API.getHrApplicant(f.id);
        if (listEdit !== f) return;
        const field = f.kind === "note" ? "note" : "status";
        if ((latest.applicant[field] || "") !== (f.before[field] || "")) throw new Error("別の担当者が変更しました。閉じて開き直してください");
        if (f.kind === "status") {
          if (latest.applicant.employeeId || ["accepted", "done"].includes(latest.applicant.status)) throw new Error("承諾・社員登録後は専用の手続きから変更してください");
          const check = await API.updateHrApplicant({ id: f.id, action: "setStatus", status: f.status, dryRun: true, ...deadline });
          if (listEdit !== f) return;
          if (JSON.stringify([check.from, check.to, check.warnings || []]) !== JSON.stringify([f.check.from, f.check.to, f.check.warnings || []])) {
            throw new Error("確認内容が変わりました。閉じて開き直し、最新の注意を確認してください");
          }
        }
        await API.updateHrApplicant(f.kind === "note" ? { id: f.id, note }
          : { id: f.id, action: "setStatus", status: f.status, ...deadline, ...(ack ? { acknowledgeWarnings: true } : {}) });
        f.saved = true;
      });
      if (f.saved) {
        if (listEdit === f) closeHrModal();
        await load();
      }
    } catch (e) {
      if (listEdit === f) msg.textContent = e.hint || e.detail || e.message || "保存できませんでした";
    } finally { f.busy = false; if (listEdit === f) inputs.forEach((input, i) => { input.disabled = disabled[i]; }); }
  }

  function openBulkStatusModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">ステータス変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名のステータスを変更します。</p>
      <label>変更後のステータス</label>
      <select id="bs-status">${Object.entries(STATUS_LABEL).map(([k, l]) =>
        `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
      <div id="bs-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkStatus(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkStatus(btn) {
    const msg = el("bs-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "変更中…", () => API.setHrApplicantsStatus(ids, el("bs-status").value));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "変更できませんでした"; }
  }

  function openBulkRecruiterModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">担当変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名の採用担当を変更します。</p>
      <label>担当者</label>
      <select id="br-recruiter">
        <option value="">（未定にする）</option>
        ${employees.map((e) => `<option value="${esc(e.id)}">${esc(e.display_name)}</option>`).join("")}
      </select>
      <div id="br-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkRecruiter(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkRecruiter(btn) {
    const msg = el("br-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "変更中…", () => API.setHrApplicantsRecruiter(ids, el("br-recruiter").value || null));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "変更できませんでした"; }
  }

  // 削除は選考終了（見送り・辞退）とは別の操作。応募者レコードそのものを消す（README §2・§6）
  function openBulkDeleteModal() {
    const picked = applicants.filter((a) => selectedIds.has(a.id));
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 10px;">
        ${picked.length === 1 ? "この応募者を削除しますか？" : `${picked.length}名の応募者を削除します`}</h2>
      ${picked.length === 1
        ? `<div style="font-size:14px;font-weight:700;color:#1b2440;">${esc(picked[0].name)}</div>
           <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(picked[0].email || "メール未登録")}</div>`
        : `<ul style="margin:0;padding-left:18px;font-size:12.5px;color:#4a5068;max-height:160px;overflow-y:auto;">
             ${picked.map((a) => `<li>${esc(a.name)}</li>`).join("")}</ul>`}
      <p class="muted" style="font-size:12px;margin-top:14px;">
        削除すると、面談・合格通知の記録も一緒に削除されます。元に戻せません。</p>
      <div id="bd-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitBulkDelete(this)">削除する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>
      </div>`);
  }

  async function submitBulkDelete(btn) {
    const msg = el("bd-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteHrApplicants(ids));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "削除できませんでした"; }
  }

  // ---- 応募者を追加（右ドロワー） ------------------------------------------------
  const SOURCE_HISTORY_KEY = "hr_sources";
  function sourceSuggestions() {
    return sourceOptions;
  }

  async function openAdd() {
    // 担当の選択肢（社員一覧）は一覧の読み込みで届く。まだなら待ってから開く
    if (!employees.length && loading) await loading;
    closeModal();
    const root = el("modal-root");
    root.innerHTML = `
      <div class="hr-modal-bg" onclick="closeModal()"></div>
      <div class="hr-modal wide" role="dialog" aria-modal="true">
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 16px;">応募者を追加</h2>
        <label>氏名 <span style="color:#b3261e;">*</span></label>
        <input id="a-name" type="text">
        <label style="margin-top:10px;">応募職種 <span style="color:#b3261e;">*</span></label>
        <input id="a-job" type="text">
        <label style="margin-top:10px;">応募媒体 <span style="color:#b3261e;">*</span></label>
        <div id="a-sources">${sourceSuggestions().map((s) => `
          <label class="hr-chip" style="cursor:pointer;">
            <input type="radio" name="a-source" value="${esc(s)}" style="width:auto;margin:0 4px 0 0;" onchange="toggleOtherSource()">${esc(s)}
          </label>`).join("")}</div>
        <input id="a-source-other" type="text" placeholder="その他の媒体名" style="margin-top:6px;" hidden>
        <label style="margin-top:10px;">応募形態</label>
        <select id="a-employment">
          <option value="">未定（選考中に入ります）</option>
          ${["正社員", "契約社員", "パート", "アルバイト", "業務委託", "副業", "フリーランス"].map((x) => `<option value="${x}">${x}</option>`).join("")}
        </select>
        <p class="muted" style="font-size:12px;margin:4px 0 0;">業務委託・副業・フリーランスは「業務委託」タブに入ります（条件提示で変わることがあります）。</p>
        <label style="margin-top:10px;">担当</label>
        <select id="a-recruiter">${recruiterOptions(meEmployeeId)}</select>
        <p class="muted" style="font-size:12px;margin:4px 0 0;">NEXT ACTION はこの人に届きます。あとから詳細の「担当」で変更できます。</p>
        <label style="margin-top:10px;">メール</label><input id="a-email" type="email">
        <label style="margin-top:10px;">電話</label><input id="a-phone" type="text">
        <label style="margin-top:10px;">プロフィールURL</label><input id="a-url" type="text">
        <label style="margin-top:10px;">メモ</label><textarea id="a-note" rows="3"></textarea>
        <div id="a-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitAdd(this)">追加する</button>
          <button class="btn btn-secondary" onclick="closeModal()">閉じる</button>
        </div>
      </div>`;
  }

  function toggleOtherSource() {
    const picked = document.querySelector('input[name="a-source"]:checked')?.value;
    const input = el("a-source-other");
    if (!input) return;
    input.hidden = picked !== "その他";
    if (!input.hidden) input.focus();
    else input.value = "";
  }

  async function submitAdd(btn) {
    const msg = el("a-msg"); msg.textContent = "";
    const name = el("a-name").value.trim();
    const jobTitle = el("a-job").value.trim();
    const picked = document.querySelector('input[name="a-source"]:checked');
    const otherSource = el("a-source-other").value.trim();
    const source = picked?.value === "その他" ? otherSource : (picked?.value || "");
    if (!name) { msg.textContent = "氏名を入力してください"; return; }
    if (!jobTitle) { msg.textContent = "応募職種を入力してください"; return; }
    if (!source) { msg.textContent = picked?.value === "その他" ? "その他の媒体名を入力してください" : "応募媒体を選んでください"; return; }

    try {
      const r = await KPLayout.busy(btn, "追加中…", () => API.createHrApplicant({
        name, jobTitle, source,
        recruiterId: el("a-recruiter").value || null,
        employmentType: el("a-employment").value || undefined,
        email: el("a-email").value.trim() || undefined,
        phone: el("a-phone").value.trim() || undefined,
        profileUrl: el("a-url").value.trim() || undefined,
        note: el("a-note").value.trim() || undefined,
      }));
      closeModal();
      history.replaceState({}, "", listUrl());
      await load();
      // 登録したら、その人の詳細を開く（NEXT ACTION：日程調整を送る／メールが無ければ先にメールを登録。HRフロー仕様 §1）
      if (r?.applicant?.id) await openDetail(r.applicant.id);
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "追加できませんでした"; }
  }

  // ---- 応募者詳細（右ドロワー） --------------------------------------------------
  let detail = null;
  let detailTab = "overview";

  // ---- 合格後の採用区分（API が返す lib/hr-offer-types.js が正。画面側に定義を持たない） --------
  let offerTypesDef = [];
  let offerTypeReady = true;   // false は db/129 未適用（区分を選ぶ操作だけ止め、これまでの合格通知で進める）
  const offerTypeDef = (key) => offerTypesDef.find((t) => t.key === key) || null;
  function takeOfferTypes(d) {
    if (Array.isArray(d?.offerTypes)) offerTypesDef = d.offerTypes;
    if (d && "offerTypeReady" in d) offerTypeReady = d.offerTypeReady !== false;
  }

  /** 採用区分の5つのカード。onPick は選んだときに呼ぶ関数名（区分の key を渡す） */
  function offerTypeCards(selected, onPick) {
    if (!offerTypesDef.length) return `<p class="hr-flow-note">採用区分を読み込み中…</p>`;
    return `<div class="hr-otype-grid" role="radiogroup" aria-label="採用区分">${offerTypesDef.map((t) => `
      <button type="button" class="hr-otype${selected === t.key ? " on" : ""}" role="radio" aria-checked="${selected === t.key}"
        data-otype="${esc(t.key)}" onclick="${onPick}('${esc(t.key)}')">
        <span class="hd"><span class="material-symbols-outlined" aria-hidden="true">${esc(t.icon)}</span>${esc(t.label)}</span>
        <span class="sm">${esc(t.summary)}</span>
        <span class="fl">${esc((t.flow || []).join(" → "))}</span>
      </button>`).join("")}</div>`;
  }

  /** 採用フローのステップバー（応募 → 面談 → 合格 → オファー → 承諾 → 契約 → 入社/稼働。育成枠は育成の流れ） */
  // 選考ステップ（HRフロー仕様 §14）。選考段階（stage）6つの現在地。見送り・辞退は「選考終了」
  const SELECTION_STEPS = [["applied", "新規応募"], ["casual_interview", "カジュアル面談"], ["ceo_recommend", "社長推薦"],
    ["ceo_interview", "社長面談"], ["offer", "内定"], ["joining_scheduled", "入社予定"]];
  // ---- ステップの直接移動（api/hr/applicants/detail.js action:"moveStep"。判定は lib/hr-step-move.js がサーバーで行う） ----
  // 採用フローのバー（応募〜入社/稼働）の段 → 移動先の選考ステップ。対応が無い段（オファー・承諾・契約…）は、押すと理由を見せるだけ
  const FLOW_TO_MOVE = { applied: "applied", interview: "casual_interview", passed: "offer" };
  const MOVE_STATE_LABEL = { current: "現在", allowed: "移動できる", blocked: "移動できない" };
  const moveOptionOf = (key) => (detail?.stepMoves?.options || []).find((o) => o.key === key) || null;
  /** li に付ける data-move（current/allowed/blocked）と、押したときの説明（title） */
  function moveAttr(key) {
    if (!detail?.stepMoves) return "";
    const o = key ? moveOptionOf(key) : null;
    const state = o ? o.state : "blocked";
    const why = o ? (o.state === "current" ? "現在のステップです" : o.state === "allowed" ? "押すと、理由を残してこのステップへ移動できます" : `移動できません：${o.reason || ""}`)
      : "この段は、合格通知の作成・本人の承諾・契約の記録から進みます（ステップ移動では動かしません）";
    return ` data-move="${state}" title="${esc(why)}"`;
  }
  function stepInner(key, inner, label) {
    if (!detail?.stepMoves) return inner;
    const o = key ? moveOptionOf(key) : null;
    const state = o ? o.state : "blocked";
    return `<button type="button" class="hr-step-go" data-move-key="${esc(key || "")}" onclick="openStepMove(${key ? `'${esc(key)}'` : "null"})"
      aria-label="${esc(`${label}（${MOVE_STATE_LABEL[state]}）`)}">${inner}</button>`;
  }
  let stepMoveFlow = null;   // { key, seq, check:{warnings,notes,from,to}|null, error }
  function openStepMove(preselect) {
    const m = detail?.stepMoves;
    if (!m) return;
    const a = detail.applicant;
    const pick = preselect && moveOptionOf(preselect)?.state === "allowed" ? preselect : null;
    stepMoveFlow = { key: null, seq: 0, check: null, error: null };
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">ステップを移動</h2>
      <p class="hr-sub" style="margin:0;">いま：<b>${esc(a.stageLabel || "—")}</b>（${esc(a.statusLabel || "—")}）。
        電話で面談・合格を確認したときなど、実際の進み方に合わせて、理由を残して動かします（<b>メールは送りません</b>）。</p>
      ${m.locked ? `<div class="banner warn" id="mv-locked" style="display:block;margin:10px 0 0;">${esc(m.locked)}</div>` : ""}
      <div class="hr-mv-list" id="mv-opts" role="radiogroup" aria-label="移動先">${m.options.map((o) => `
        <label class="hr-mv-opt" data-state="${esc(o.state)}" data-key="${esc(o.key)}">
          <input type="radio" name="mv-to" value="${esc(o.key)}" ${o.state === "allowed" ? "" : "disabled"} onchange="pickStepMove('${esc(o.key)}')">
          <b>${esc(o.label)}</b><span class="st">${MOVE_STATE_LABEL[o.state]}</span>
          ${o.state === "blocked" && o.reason ? `<span class="why">${esc(o.reason)}</span>` : ""}
        </label>`).join("")}</div>
      <div id="mv-check"></div>
      <label for="mv-reason" style="margin-top:10px;">移動の理由 <span style="color:#b3261e;">*</span></label>
      <textarea id="mv-reason" rows="3" maxlength="500" placeholder="例：電話で社長面談を行い、合格を確認済み（10/24 社長）" oninput="syncStepMove()"></textarea>
      <div id="mv-msg" class="err-text" style="margin:8px 0 0;"></div>
      <div class="hr-of-actions">
        <button class="btn btn-primary" id="mv-go" disabled onclick="submitStepMove(this)">この内容で移動する</button>
        <button class="btn btn-secondary" onclick="closeAction()">やめる</button>
      </div>`);
    if (pick) {
      const r = document.querySelector(`#mv-opts input[value="${pick}"]`);
      if (r) { r.checked = true; pickStepMove(pick); }
    }
  }
  async function pickStepMove(key) {
    const f = stepMoveFlow;
    if (!f) return;
    f.key = key; f.check = null; f.error = null;
    const seq = ++f.seq;
    document.querySelectorAll("#mv-opts .hr-mv-opt").forEach((x) => x.classList.toggle("on", x.dataset.key === key));
    el("mv-check").innerHTML = `<div class="hr-mv-notes" id="mv-checking">変更内容を確認しています…</div>`;
    syncStepMove();
    try {
      const r = await API.updateHrApplicant({ id: detail.applicant.id, action: "moveStep", to: key, dryRun: true });
      if (stepMoveFlow !== f || f.seq !== seq) return;
      f.check = r;
    } catch (e) {
      if (stepMoveFlow !== f || f.seq !== seq) return;
      f.error = e.hint || e.detail || e.message || "確認できませんでした";
    }
    renderStepMoveCheck();
  }
  function renderStepMoveCheck() {
    const f = stepMoveFlow;
    const box = el("mv-check");
    if (!f || !box) return;
    if (f.error) { box.innerHTML = `<div class="banner err" id="mv-error" style="display:block;margin:10px 0 0;">${esc(f.error)}</div>`; syncStepMove(); return; }
    const c = f.check;
    if (!c) return;
    box.innerHTML = `
      <div class="hr-mv-notes" id="mv-diff"><b>変更前</b> ${esc(c.from)}　→　<b>変更後</b> ${esc(c.to)}
        ${(c.notes || []).length ? `<ul id="mv-notes">${c.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>
      ${(c.warnings || []).length ? `<div class="banner warn" id="mv-warnings" style="display:block;margin:8px 0 0;">
        <b>確認してください</b><ul style="margin:4px 0 0;padding-left:18px;">${c.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
        <label class="hr-mv-ack"><input type="checkbox" id="mv-ack" onchange="syncStepMove()">上の注意を確認したうえで移動します</label></div>` : ""}`;
    syncStepMove();
  }
  function syncStepMove() {
    const f = stepMoveFlow, go = el("mv-go");
    if (!go) return;
    const reason = (el("mv-reason")?.value || "").trim();
    const warns = (f?.check?.warnings || []).length;
    go.disabled = !(f?.key && f.check && !f.error && reason && (!warns || el("mv-ack")?.checked));
  }
  async function submitStepMove(btn) {
    const f = stepMoveFlow;
    const msg = el("mv-msg"); msg.textContent = "";
    const reason = (el("mv-reason").value || "").trim();
    if (!f?.key || !f.check) { msg.textContent = "移動先を選んでください"; return; }
    if (!reason) { msg.textContent = "移動の理由を入力してください"; return; }
    const ack = (f.check.warnings || []).length > 0;
    if (ack && !el("mv-ack")?.checked) { msg.textContent = "注意を確認してから移動してください"; return; }
    try {
      await KPLayout.busy(btn, "移動中…", () => API.updateHrApplicant({
        id: detail.applicant.id, action: "moveStep", to: f.key, reason, ...(ack ? { acknowledgeWarnings: true } : {}),
      }));
    } catch (e) {
      const text = e.hint || e.detail || e.message || "移動できませんでした";
      // 注意が増えた・ほかの人が動かした・動かせなくなった：最新の状態で確認からやり直す（古い確認のままでは移動させない）
      if (["step_move_warning", "stale", "step_blocked"].includes(e.code)) {
        await refreshDetail();
        openStepMove(f.key);
        reason && el("mv-reason") && (el("mv-reason").value = reason);
        syncStepMove();
      }
      if (el("mv-msg")) el("mv-msg").textContent = text;
      return;
    }
    stepMoveFlow = null;
    closeAction();
    await refreshDetail();
    load();
  }

  /** 上部のステップバー（1本だけ）。内定より前は選考ステップ、内定からは採用フロー（オファー・承諾・契約…） */
  function progressBar(a) {
    return ["offer", "joining_scheduled"].includes(a.stage) && (a.steps?.steps || []).length ? stepBar(a) : stageSteps(a);
  }

  function stageSteps(a) {
    const at = SELECTION_STEPS.findIndex(([k]) => k === a.stage);
    const ended = ["passed", "declined", "position_closed"].includes(a.status);
    return `<ol class="hr-steps" id="hr-stage-steps" aria-label="選考ステップ">${SELECTION_STEPS.map(([k, l], i) => {
      const st = i < at || (i === at && a.status === "done") ? "done" : i === at ? "now" : "todo";
      return `<li class="${st}" data-stage="${k}" aria-current="${st === "now" ? "step" : "false"}"${moveAttr(k)}>
        ${stepInner(k, `<span class="m" aria-hidden="true">${st === "done" ? "✓" : i + 1}</span><span class="l">${esc(l)}</span>`, l)}</li>`;
    }).join("")}</ol>
      ${ended ? `<div class="hr-steps-ended">選考は終了しました（${esc(a.statusLabel)}）</div>` : ""}`;
  }

  function stepBar(a) {
    const s = a.steps;
    if (!s || !(s.steps || []).length) return "";
    return `<ol class="hr-steps" id="hr-steps" data-flow="${esc(s.flow)}" aria-label="採用の進み具合">${s.steps.map((p, i) => `
      <li class="${esc(p.state)}" data-step="${esc(p.key)}" aria-current="${p.state === "now" ? "step" : "false"}"${moveAttr(FLOW_TO_MOVE[p.key] || null)}>
        ${stepInner(FLOW_TO_MOVE[p.key] || null, `<span class="m" aria-hidden="true">${p.state === "done" ? "✓" : i + 1}</span><span class="l">${esc(p.label)}</span>`, p.label)}</li>`).join("")}</ol>
      ${s.ended ? `<div class="hr-steps-ended">選考は終了しました（${esc(s.ended)}）</div>` : ""}`;
  }

  async function openDetail(id) {
    // 同じ応募者を開き直す場合（各操作後の再読み込み）は、いま見ているタブを保つ。
    // 呼び出し側が detailTab = "interviews" を先に指定してから呼ぶケースがあるため
    // （openIdはcloseModal()内でnullに戻るため、判定にはdetailの中身を使う）
    if (detail?.applicant?.id !== id) { detailTab = "overview"; emailEditing = false; }
    openId = id;
    closeModal();
    const root = el("modal-root");
    root.innerHTML = `<div class="hr-drawer-bg" onclick="closeModal()"></div>
      <div class="hr-detail" id="hr-detail-box"><div class="empty" style="padding:40px;">読み込み中…</div></div>`;
    history.replaceState({}, "", `/hr/applicants.html?id=${encodeURIComponent(id)}`);
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      takeOfferTypes(d);
      await loadContract(id);
      renderDetail();
    } catch (e) {
      el("hr-detail-box").innerHTML = `<div class="banner err" style="margin:20px;">
        <span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  /**
   * 開いたままの応募者詳細を、取り直して描き直す（各操作の保存後）。
   * ドロワーは閉じない。いま見ているタブも保つ（tab を渡したときはそのタブへ）
   */
  async function refreshDetail(tab) {
    const id = detail?.applicant?.id;
    if (!id) return;
    if (tab) detailTab = tab;
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      takeOfferTypes(d);
      await loadContract(id);
      if (el("hr-detail-box")) renderDetail();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "再読み込みできませんでした");
    }
  }

  // ---- 書類（履歴書・職務経歴書・その他） ------------------------------------------
  let docs = null;       // { documents:[{docType,label,icon,latest,history}], limits }
  let docsError = null;
  async function loadDocs(id) {
    try { docs = await API.hrDocuments(id); docsError = null; }
    catch (e) { docs = null; docsError = e.message || e.hint || "書類を読み込めませんでした"; }
  }

  // ---- 契約手続き（社労士の正式PDF・db/139）。正式PDFで進める人だけ（applicant.contractState がある人）読む ----
  let contract = null;        // GET /api/hr/offers/contract?applicantId= の応答
  let contractError = null;
  async function loadContract(id) {
    contract = null; contractError = null;
    if (!detail?.applicant?.contractState) return;
    try { contract = await API.api(`/api/hr/offers/contract?applicantId=${encodeURIComponent(id)}`); }
    catch (e) { contractError = e.hint || e.message || "契約手続きを読み込めませんでした"; }
  }

  function closeModal() {
    el("modal-root").innerHTML = "";
    el("action-root").innerHTML = "";
    openId = null;
    history.replaceState({}, "", listUrl());
  }

  function setDetailTab(t) { detailTab = t; renderDetail(); }

  function renderDetail() {
    const a = detail.applicant;
    const box = el("hr-detail-box");
    if (!box) return;
    // 無限道場リードには書類（履歴書・職務経歴書）が無い
    const TABS = isLead(a)
      ? [["overview", "概要"], ["interviews", "面談"], ["history", "履歴"]]
      : [["overview", "基本情報"], ["interviews", "選考"], ["docs", "書類"], ["mail", "メール"], ["history", "履歴"]];
    if (!TABS.some(([k]) => k === detailTab)) detailTab = "overview";
    // 採用の応募者は、上から順番を固定する（HRフロー仕様 §14）：
    //   ① 応募者（氏名・職種・メール・電話・応募媒体）② 選考・状態 ③ NEXT ACTION（主ボタン1つ）
    //   ④ 選考ステップ（新規応募 → … → 入社予定）⑤ タブ（概要／面談／評価／書類／メール／履歴）
    // NEXT ACTION はタブの外に置く（どのタブを見ていても、次にすることが見える）
    if (!isLead(a)) {
      box.innerHTML = `
      <div style="padding:20px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;" id="hr-dr-person">
        <div style="min-width:0;">
          <div style="font-size:18px;font-weight:700;color:#1b2440;">${esc(a.name)}
            ${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:8px;">${esc(a.rank)}</span>` : ""}</div>
          <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(a.jobTitle)}</div>
          <div class="hr-head-mail${a.email ? "" : " none"}" id="hr-head-mail">${esc(a.email || "メール未登録")}</div>
          <div style="font-size:12.5px;color:#6b7080;margin-top:2px;" id="hr-head-meta">電話 ${esc(a.phone || "未登録")} ／ 応募媒体 ${esc(a.source || "—")}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-secondary btn-sm" id="hr-mail-btn" onclick="openMailForm()">
            <span class="material-symbols-outlined icon-inline">mail</span>メールを送る</button>
          <button class="btn btn-secondary btn-sm" onclick="closeModal()">閉じる</button>
        </div>
      </div>
      <div class="hr-dr-sel" id="hr-dr-sel">
        <span>選考：<b>${esc(a.stageLabel || "—")}</b></span><span>状態：<b>${esc(a.statusLabel || "—")}</b></span>
        <span>担当：<b>${esc(a.recruiterName || "未定")}</b></span>
        ${detail.stepMoves ? `<button type="button" class="hr-step-move-open" id="hr-step-move-open" onclick="openStepMove(null)"
          title="電話で面談・合格を確認したときなど、理由を残してステップを直接移動します（メールは送りません）">
          <span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span>ステップを移動</button>` : ""}
        ${(a.alerts || []).length ? `<span class="hr-alerts" id="hr-dr-alerts">${a.alerts.map((x) =>
          `<span class="hr-alert ${x.level === "danger" ? "danger" : "warn"}" data-alert="${esc(x.key)}">${esc(x.label)}</span>`).join("")}</span>` : ""}
      </div>
      <div style="padding:0 20px;" id="hr-detail-next">${nextActionBox(a)}</div>
      ${progressBar(a)}
      <div class="hr-tabs">${TABS.map(([k, l]) =>
        `<button class="${detailTab === k ? "on" : ""}" data-tab="${k}" onclick="setDetailTab('${k}')">${l}</button>`).join("")}</div>
      <div class="hr-detail-body" id="hr-detail-tab"></div>`;
      renderDetailTab();
      if (window.HrLmsTrial) HrLmsTrial.mount(detail);
      return;
    }
    box.innerHTML = `
      <div style="padding:20px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:18px;font-weight:700;color:#1b2440;">${esc(a.name)}
            ${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:8px;">${esc(a.rank)}</span>` : ""}
            ${isLead(a) ? `<span class="hr-lead-badge">無限道場</span>` : ""}</div>
          ${isLead(a) ? "" : `<div class="hr-head-mail${a.email ? "" : " none"}" id="hr-head-mail">${esc(a.email || "メール未登録")}</div>`}
          <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(a.jobTitle)} ／ ${esc(a.source)}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">
          <button class="btn btn-secondary btn-sm" id="hr-mail-btn" onclick="openMailForm()">
            <span class="material-symbols-outlined icon-inline">mail</span>メールを送る</button>
          <button class="btn btn-secondary btn-sm" onclick="closeModal()">閉じる</button>
        </div>
      </div>
      ${stepBar(a)}
      <div class="hr-tabs">${TABS.map(([k, l]) =>
        `<button class="${detailTab === k ? "on" : ""}" data-tab="${k}" onclick="setDetailTab('${k}')">${l}</button>`).join("")}</div>
      <div class="hr-detail-body" id="hr-detail-tab"></div>`;
    renderDetailTab();
    if (window.HrLmsTrial) HrLmsTrial.mount(detail);   // 概要タブに「無限道場 体験」（js/hr-lms-trial.js）
  }

  /**
   * 判断済み・本人へ未連絡のとき、ほかにすることが無ければ（見送り）「本人へ連絡」を NEXT ACTION にする。
   * 保留は「採用判断を更新」、内定は「合格通知を作成」が先に出る（未連絡はバッジと「本人へ連絡」ボタンで並べて出す）
   */
  function withContactAction(a) {
    if (a.contact?.state !== "pending") return a;
    if (a.decision === "rejected") {
      return { ...a, nextAction: `本人へ${DECIDE_LABEL[a.decision]}を伝えてください`, nextActionCta: "本人へ連絡", nextActionKey: "contact" };
    }
    return a;
  }
  const listNextAction = (a) => withContactAction(a).nextAction;

  /** 判断と本人への連絡状況の行（NEXT ACTION の中。判断済みのときだけ） */
  function contactRow(a) {
    if (!DECIDE_LABEL[a.decision] || isLead(a)) return "";
    const pending = a.contact?.state === "pending";
    return `<div class="hr-contact-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;">
      <span style="font-size:12px;color:#4a5068;">採用判断</span>${decisionBadges(a)}
      ${pending && withContactAction(a).nextActionKey !== "contact" ? `<button class="btn btn-secondary btn-sm" onclick="openContactForm('${esc(a.id)}', '${esc(a.decision)}')">
        <span class="material-symbols-outlined icon-inline">mail</span>本人へ連絡</button>` : ""}
      ${a.contact?.state === "done" && ["ceo_decision_pending", "passed"].includes(a.status)
        ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="openContactForm('${esc(a.id)}', '${esc(a.decision)}')">もう一度連絡する</button>` : ""}
    </div>`;
  }

  /** NEXT ACTION と、その1つの CTA（原則1つ） */
  function nextActionBox(a) {
    a = withContactAction(a);
    // 「面談を実施済みにする」は、実施する面談（nextInterviewId）があるときだけ出す。
    // 無ければ面談の記録を確かめてもらう（API も同じ判定。古いデータへの保険）
    if (a.nextActionKey === "conduct" && !a.nextInterviewId) {
      a = { ...a, nextAction: "面談予定の記録を確認してください", nextActionCta: "面談タブを確認", nextActionKey: "checkInterviews" };
    }
    // 採用区分を選べない環境（db/129 未適用）では、これまでどおり合格通知を作る
    if (a.nextActionKey === "chooseOfferType" && !offerTypeReady) {
      a = { ...a, nextAction: "合格通知を作成してください", nextActionCta: "合格通知を作成", nextActionKey: "createOffer" };
    }
    // 見出し：オファーの段階では書類名（育成参加決定通知 など）、それ以外は選考段階
    const otype = offerTypeDef(a.offerType);
    const offerStage = ["offer_draft_pending", "offer_review_pending", "offer_send_pending", "offer_sent", "offer_viewed",
      "offer_response_pending", "offer_resend_pending", "accepted"].includes(a.status);
    const title = otype && offerStage ? otype.offerName : (a.stageLabel || "—");
    // 見出しと同じ書類名で始まる状態は、重ねて書かない（「育成参加決定通知」＋「下書き（本人未送信）」）
    const statusText = String(a.statusLabel || "—").startsWith(`${title}の`) ? a.statusLabel.slice(title.length + 1) : (a.statusLabel || "—");
    // 無限道場 体験（js/hr-lms-trial.js）。面談後・未案内なら主のボタンを［お礼＋無限道場体験を案内］にし、
    // もとの操作（評価を入力 など）は補助のボタンに回す。案内後は体験の状況を1行で出す
    const lms = window.HrLmsTrial ? HrLmsTrial.nextAction(a) : null;
    const canRun = a.nextActionCta && (a.nextActionKey === "decide" ? canDecide : ["advance", "handoff"].includes(a.nextActionKey) ? canAdvance : true);
    return `
      <div class="hr-next" data-lms-na="${esc(lms?.key || "")}">
        <div class="row1"><span class="ttl" id="hr-stage">${esc(title)}</span><span class="st" id="hr-status">${esc(statusText)}</span>
          ${a.offerTypeLabel ? `<span class="chip" id="hr-otype">${esc(a.offerTypeLabel)}</span>` : ""}</div>
        <div class="sub">${esc(lms?.primary ? lms.label : a.nextAction)}${a.decisionDueOn ? `　期限：${esc(a.decisionDueOn)}` : ""}</div>
        ${isOnHold(a) ? `<div class="hr-dk-banner" data-kind="hold"><span class="material-symbols-outlined">pause_circle</span>
          <div><b>保留中</b>${a.holdReason ? `　理由：${esc(a.holdReason)}` : ""}${a.holdNextStep ? `<br>次に確認：${esc(a.holdNextStep)}` : ""}${a.decisionDueOn ? `<br>再判断期限：${esc(a.decisionDueOn)}` : ""}</div></div>` : ""}
        ${lms?.line ? `<div class="sub" data-lms-next>${lms.line}</div>` : ""}
        ${lms?.primary
          ? `<button class="btn btn-primary btn-sm" data-lms-next-invite onclick="HrLmsTrial.openSend(false)">${esc(lms.cta)}</button>
             ${canRun ? `<button class="btn btn-secondary btn-sm" onclick="runNextAction()">${esc(a.nextActionCta)}</button>` : ""}`
          : canRun && a.nextActionKey === "openContract" && detailTab === "docs"
          ? `<p class="muted" id="hr-next-here" style="font-size:12px;margin:0;">下の「契約手続き」で進めます。</p>`
          : canRun
          ? `<button class="btn btn-primary btn-sm" onclick="runNextAction()">${esc(a.nextActionCta)}</button>`
          : a.nextActionKey === "decide"
            ? `<p class="muted" style="font-size:12px;margin:0;">採用判断は社長・管理者が行います。</p>`
            : a.nextActionKey === "advance"
              ? `<p class="muted" style="font-size:12px;margin:0;">本採用へ進めるのは社長・管理者・人事が行います。</p>`
            : a.nextActionKey === "handoff"
              ? `<p class="muted" style="font-size:12px;margin:0;">Office への引き渡しは社長・管理者・人事が行います。</p>`
              : a.status === "done" && a.employeeId
                ? `<a class="btn btn-secondary btn-sm" href="../admin-probation.html?employeeId=${esc(a.employeeId)}">試用期間の管理へ</a>` : ""}
      </div>
      ${acceptedPanel(a)}
      ${contactRow(a)}`;
  }

  /**
   * 本人が条件を承諾したあと（区分つき）。HR → Office 切替ルール §8：HR の上部に大きく「条件承諾済み」を出す。
   *   承諾日／採用区分／入社予定日／条件通知書（確認済み）／正式契約：必要・不要／正式契約の状況：未対応・案内済み・署名済み
   * ■ Office へは、承諾しただけでは渡らない。HR が承諾内容を確認して［承諾内容を確認してOfficeへ引き渡す］を押したときに初めて渡る
   *   （押せるのは、正式契約が不要か、必要で署名済みになってから。ボタンは NEXT ACTION の1つだけ。ここには重ねて置かない）。
   * ■ 正式契約（LegalSign）も HR で終える。Office に移さない。完了してから Office へ引き渡す。
   * ■ 育成枠は Office へ渡さない（正式契約の要否に関わらず LMS・育成開始＝HR）。
   * 「契約完了」とは書かない（正式な契約は LegalSign。条件の承諾は MF の電子承諾記録）
   */
  function acceptedPanel(a) {
    const o = (detail.offers || []).find((x) => x.offerType && x.status === "accepted");
    if (!o || !["accepted", "done"].includes(a.status)) return "";
    const t = offerTypeDef(o.offerType);
    const training = t?.key === "training";
    const canPdf = detail.salaryVisible !== false && o.docsReady && o.noticePdf;
    // 正式契約（LegalSign）の要否はオファーごと（db/133。送ったときに決まっている）
    const formalNeeded = typeof o.formalRequired === "boolean" ? o.formalRequired : Boolean(t?.legalSign);
    const signed = Boolean(o.formalSignedAt), sent = Boolean(o.formalSentAt);
    const handedOff = Boolean(o.handoffAt);
    const formalDone = !formalNeeded || signed;
    const canHandoff = !training && o.handoffReady && !handedOff;

    const formalState = !formalNeeded ? ""
      : signed ? `<span class="ok">✓ 署名済み</span>（${esc(JST.dateTime(o.formalSignedAt))}）`
      : sent ? `<span class="wait">案内済み</span>（${esc(JST.dateTime(o.formalSentAt))}・署名待ち）`
      : `<span class="wait">未対応</span>${o.legalsignUrl ? "（URL 登録済み・まだ案内していません）" : ""}`;
    const kind = [o.offerTypeLabel || t?.label || "", o.employmentType && o.employmentType !== (o.offerTypeLabel || t?.label) ? o.employmentType : ""]
      .filter(Boolean).join("・");
    const by = o.handoffByName ? `（${esc(o.handoffByName)}）` : "";

    const lead = handedOff ? "本人が条件を承諾し、Office へ引き渡し済みです。入社準備は Office で進みます。"
      : training ? "本人が採用条件を承諾しました。育成枠は Office へ引き渡さず、HR で LMS・育成開始へ進めます。"
      : !canHandoff ? `本人が採用条件を承諾しました。${t?.afterAccept?.label ? `次は${t.afterAccept.label}。` : ""}`
      : formalDone ? "本人が採用条件を承諾しました。承諾内容を確認して、Office へ引き渡してください（承諾しただけでは Office へ渡りません）。"
      : "本人が採用条件を承諾しました。正式契約（LegalSign）まで HR で進めます。署名が済んだら Office へ引き渡せます。";
    const next = handedOff
      ? `次の手続き：<b>Office で入社準備</b>（入社書類 → アカウント・端末 → オリエンテーション → 入社完了）`
      : training ? `次の手続き：<b>${esc(t?.afterAccept?.label || "LMS・育成開始の手続き")}</b>（HR で進めます）`
      : !canHandoff ? `次の手続き：<b>${esc(t?.afterAccept?.label || "本採用の手続き")}</b>`
      : formalDone ? `次の手続き：<b>承諾内容を確認して Office へ引き渡す</b>（${formalNeeded ? "正式契約は署名済み" : "正式契約は不要"}）`
      : `次の手続き：<b>正式契約（LegalSign）</b> → 署名済みになったら Office へ引き渡し`;

    return `
      <section class="hr-acc" id="hr-accepted" data-handoff="${handedOff ? "done" : training ? "training" : formalDone ? "ready" : "formal"}" aria-label="条件承諾済み">
        <div class="hd"><span class="material-symbols-outlined" aria-hidden="true">${handedOff ? "task_alt" : "verified"}</span>
          <div><div class="ttl" data-acc="title">${handedOff ? "条件承諾済み・Office へ引き渡し済み" : "条件承諾済み"}</div>
            <div class="lead" data-acc="lead">${esc(lead)}</div></div></div>
        <dl>
          <div data-acc="accepted"><dt>承諾日</dt><dd>${esc(JST.dateTime(o.acceptedAt))}（第${esc(o.version)}版）</dd></div>
          <div data-acc="etype"><dt>採用区分</dt><dd>${esc(kind || "—")}</dd></div>
          <div data-acc="join"><dt>入社予定日</dt><dd>${o.joinDate ? esc(fmtYmdJa(o.joinDate)) : "未定"}</dd></div>
          <div data-acc="notice"><dt>条件通知書</dt><dd>${o.noticePdf ? `<span class="ok">✓ 確認済み</span>` : "—（PDF なし）"}</dd></div>
          <div data-acc="formal-required"><dt>正式契約</dt><dd>${formalNeeded ? "必要" : "不要"}</dd></div>
          ${formalNeeded ? `<div data-acc="formal"><dt>正式契約の状況</dt><dd>${formalState}</dd></div>` : ""}
          ${handedOff ? `<div data-acc="handoff"><dt>Office へ引き渡し</dt><dd><span class="ok">✓ 引き渡し済み</span><br>${esc(JST.dateTime(o.handoffAt))}${by}</dd></div>` : ""}
        </dl>
        <div class="next" data-acc="next">${next}</div>
        <div class="acts">
          ${handedOff && canAdvance ? `<a class="btn btn-primary" id="hr-accepted-office" href="../admin-hr.html">Office で確認する</a>` : ""}
          ${handedOff && !canAdvance ? `<span class="muted" style="font-size:12px;">Office の人事・労務（社長・管理者・人事）が進めます。</span>` : ""}
          ${canPdf ? `<button class="btn btn-secondary" id="hr-accepted-pdf" onclick="openOfferPdf('${esc(o.id)}', 'accepted', this)">承諾済みPDFを確認する</button>` : ""}
        </div>
      </section>`;
  }

  /** いちばん新しい、評価済みの面談 */
  // ---- 評価タブ：面談ごとの5項目評価・総合ランク・推薦理由・所感（入力は NEXT ACTION の「評価を入力」から） ----
  function evalTab(a) {
    const evs = (detail.interviews || []).filter((i) => i.done && !i.canceled && (i.rank || Object.keys(i.scores || {}).length || i.notes));
    const rankLabel = detail.rankLabel || {};
    const head = a.status === "eval_pending"
      ? `<div class="banner warn" style="margin:0 0 12px;"><span class="material-symbols-outlined">rate_review</span><div>面談の評価がまだ入力されていません。NEXT ACTION の［評価を入力］から入力してください。</div></div>` : "";
    if (!evs.length) return `${head}<p class="muted" data-eval-empty>まだ評価がありません。</p>`;
    return head + evs.map((i) => `
      <section class="hr-flow-sec" data-eval="${esc(i.id)}" style="margin-bottom:12px;">
        <div class="hr-flow-hd"><h3>${esc(i.kindLabel)}${i.rank ? `<span class="hr-rank ${esc(i.rank)}" style="margin-left:8px;">${esc(i.rank)}</span>` : ""}</h3>
          <span class="hr-flow-note">${i.scheduledAt ? esc(JST.when(i.scheduledAt)) : ""}${i.interviewerName ? `　${esc(i.interviewerName)}` : ""}</span></div>
        ${i.rank ? `<div style="font-size:12.5px;color:#1b2440;margin:0 0 8px;">総合：${esc(i.rank)}（${esc(rankLabel[i.rank] || "")}）</div>` : ""}
        ${(detail.evalItems || []).map((it) => `<div class="hr-score-row"><span class="k">${esc(it.label)}</span><span>${esc(i.scores?.[it.key] ? scaleLabel(i.scores[it.key]) : "—")}</span></div>`).join("")}
        ${i.recommendReason ? `<div style="font-size:12.5px;white-space:pre-wrap;margin-top:8px;"><b style="color:#6b7080;font-size:11px;display:block;">推薦理由</b>${esc(i.recommendReason)}</div>` : ""}
        ${i.notes ? `<div style="font-size:12.5px;white-space:pre-wrap;margin-top:8px;"><b style="color:#6b7080;font-size:11px;display:block;">所感・メモ</b>${esc(i.notes)}</div>` : ""}
      </section>`).join("");
  }

  // ---- メールタブ：この応募者へ送ったメール（api/hr/applicants/mail.js の記録）と［メールを送る］ ----
  async function loadMailTab(id) {
    let r = null, err = null;
    try { r = await API.api(`/api/hr/applicants/mail?id=${encodeURIComponent(id)}`); } catch (e) { err = e; }
    const box = el("hr-detail-tab");
    if (!box || detailTab !== "mail" || detail?.applicant?.id !== id) return;
    box.innerHTML = `
      <button class="btn btn-secondary btn-sm" style="margin:0 0 12px;" onclick="openMailForm()">
        <span class="material-symbols-outlined icon-inline">mail</span>メールを送る</button>
      ${err ? `<div class="banner warn"><span class="material-symbols-outlined">error</span><div>${esc(err.hint || err.message || "読み込めませんでした")}</div></div>`
        : `<div data-mail-tab>${mailHistoryHtml(r.sends)}</div>`}`;
  }

          <div><dt>直近の流入</dt><dd>${dd(lastUtm)}${a.attribution?.touches > 1 ? `<small class="muted">（送信${esc(a.attribution.touches)}回）</small>` : ""}</dd></div>
          <div><dt>AI経験</dt><dd>${dd(p.ai_experience)}</dd></div>

          <div style="grid-column:1/-1;"><dt>挑戦してみたいこと</dt><dd style="white-space:pre-wrap;font-weight:500;">${dd(p.challenge_text)}</dd></div>

          <div><dt>最終接触</dt><dd>${a.lastContactedAt ? esc(fmtDate(a.lastContactedAt)) : "—"}</dd></div>
        </dl>
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">面談</h4>
        ${ivs.length ? ivs.map((i) => `<div class="hr-lead-iv">
            <b>${esc(i.kindLabel)}</b>　${i.scheduledAt ? esc(fmtDate(i.scheduledAt)) : "日時未定"}${i.done ? "（実施済み）" : ""}
            ${i.memo ? `<div style="white-space:pre-wrap;margin-top:6px;color:#4a5068;">${esc(i.memo)}</div>` : ""}

        <p class="muted" style="font-size:12px;margin:6px 0 0;">面談メモの編集は<a href="#" onclick="setDetailTab('interviews');return false;">面談タブ</a>、経過は<a href="#" onclick="setDetailTab('history');return false;">履歴タブ</a>で見られます。</p>`;
