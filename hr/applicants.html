<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>応募者 - EIGHT HR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261008rec3">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.hr-title { font-size:24px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .hr-sub { color:#6b7080; font-size:13px; margin:0 0 20px; }

    .hr-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .hr-toolbar input[type="text"] { max-width:240px; margin:0; }
    .hr-stage-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .hr-stage-tabs button { border:1px solid #e2e2dc; background:#fff; border-radius:999px; padding:6px 13px;
      font-size:12px; font-weight:500; color:#4a5068; cursor:pointer; font-family:inherit; }
    .hr-stage-tabs button.on { background:#1b2440; border-color:#1b2440; color:#fff; font-weight:700; }
    /* 選考パイプライン：段階ごとの人数。0人の段階は薄く（押せるがレイアウトは変えない） */
    .hr-stage-tabs button .n { display:inline-block; min-width:1.4em; margin-left:6px; font-weight:700; text-align:center; }
    .hr-stage-tabs button.zero:not(.on) { opacity:.45; }
    /* 区分（すべて／採用／無限道場）。選考パイプラインより一段上の切り替え（検索・段階の行とは別の行） */
    .hr-catbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .hr-cat-tabs { display:inline-flex; border:1px solid #e2e2dc; border-radius:8px; overflow:hidden; background:#fff; }
    .hr-cat-tabs button { border:none; border-right:1px solid #e2e2dc; background:#fff; padding:7px 14px; font-size:12.5px;
      font-weight:600; color:#4a5068; cursor:pointer; font-family:inherit; }
    .hr-cat-tabs button:last-child { border-right:none; }
    .hr-cat-tabs button.on { background:#1b2440; color:#fff; }
    .hr-cat-tabs button .n { margin-left:6px; font-weight:700; }
    .hr-lead-badge { display:inline-block; margin-left:6px; background:#fbf1d6; color:#7d5a00; border-radius:999px;
      padding:1px 8px; font-size:10.5px; font-weight:700; vertical-align:middle; }
    .hr-chips-sm span { display:inline-block; background:#e7eaf3; color:#1b2440; border-radius:999px; padding:1px 8px;
      font-size:11px; margin:0 4px 3px 0; }
    .hr-lead-iv { border:1px solid #e2e2dc; border-radius:8px; padding:10px 12px; margin:0 0 8px; font-size:12.5px; }
    .hr-watch-list label { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; border-bottom:1px solid #f0f0ec; }

    .hr-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e2e2dc; border-radius:10px; overflow:hidden; }
    .hr-table th { text-align:left; font-size:11px; color:#6b7080; font-weight:700; padding:10px 14px;
      background:#f6f6f2; border-bottom:1px solid #e2e2dc; }
    .hr-table td { padding:12px 14px; border-bottom:1px solid #e2e2dc; font-size:13px; vertical-align:top; }
    .hr-table tr:last-child td { border-bottom:none; }
    .hr-table tr.click { cursor:pointer; }
    .hr-table tr.click:hover { background:#f6f6f2; }
    .hr-nm { font-weight:700; color:#1b2440; font-size:14px; display:block; }
    .hr-sub2 { font-size:11.5px; color:#6b7080; display:block; margin-top:2px; }

    .hr-rank { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
      border-radius:5px; font-size:11px; font-weight:700; padding:0 6px; }
    .hr-rank.A { background:#1b2440; color:#fff; } .hr-rank.B { background:#e7eaf3; color:#1b2440; }
    .hr-rank.C { background:#efefeb; color:#4a5068; } .hr-rank.D { background:#f6f6f2; color:#9aa0b4; }

    .hr-pill { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:600; }
    .hr-pill .material-symbols-outlined { font-size:14px; }

    .hr-drawer-bg { position:fixed; inset:0; background:rgba(27,36,64,.35); z-index:40; }
    .hr-drawer { position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; padding:22px; }
    .hr-detail { position:fixed; top:0; right:0; bottom:0; width:560px; max-width:94vw; background:#f6f6f2;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; padding:0; }

    /* モーダル＝1つの操作を実行する場所。ドロワー（詳細）の上に重ねて出す。
       閉じてもドロワーは閉じない（採用HR応募者一覧・ドロワーUI改善指示書 §4・§5） */
    .hr-modal-bg { position:fixed; inset:0; background:rgba(27,36,64,.45); z-index:50; }
    .hr-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:440px; max-width:92vw;
      max-height:86vh; overflow-y:auto; background:#fff; border-radius:14px; padding:22px; z-index:51;
      box-shadow:0 20px 60px rgba(27,36,64,.28); overscroll-behavior:contain; }
    /* 項目の多い操作（評価・合格通知・書類・応募者追加）。中だけスクロールする */
    .hr-modal.wide { width:680px; max-height:88vh; }
    /* 評価・採用判断・本人への連絡（hr/applicants.html と hr/ceo-review.html で同じ。直すときは両方そろえる）
       色は意味のあるものだけ：緑＝内定・黄＝保留・赤＝見送り・オレンジ＝本人へ未連絡 */
    .hr-flow-sec { border:1px solid #e2e2dc; border-radius:12px; padding:16px 18px; margin:0 0 14px; background:#fff; }
    .hr-flow-sec.is-wait { background:#fafaf8; }
    .hr-flow-hd { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
    .hr-flow-hd h3 { font-size:14px; font-weight:700; color:#1b2440; margin:0; display:flex; align-items:center; gap:8px; }
    .hr-flow-hd .st { font-size:11px; font-weight:700; color:#6b7080; letter-spacing:.06em; }
    .hr-flow-state { display:inline-flex; align-items:center; gap:3px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:700; background:#efefeb; color:#4a5068; white-space:nowrap; }
    .hr-flow-state .material-symbols-outlined { font-size:15px; }
    .hr-flow-state.done { background:#e5f1e2; color:#2f6f3a; }
    .hr-flow-state.todo { background:#ffedd5; color:#c2410c; }
    .hr-flow-note { font-size:12.5px; color:#6b7080; margin:0; }
    .hr-flow-sum { font-size:13px; color:#1b2440; line-height:1.7; }

    .hr-score-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid #f0f0ec; }
    .hr-score-row:last-of-type { border-bottom:none; }
    .hr-score-row .k { font-size:13px; color:#1b2440; }
    .hr-score-opts { display:flex; gap:6px; flex-shrink:0; }
    .hr-score { width:42px; height:36px; border:1px solid #d9d9d2; border-radius:8px; background:#fff; color:#9aa0b4;
      font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; padding:0; }
    .hr-score:disabled { cursor:default; }
    .hr-score.on[data-v="great"] { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    .hr-score.on[data-v="good"] { background:#e5f1e2; border-color:#2f6f3a; color:#2f6f3a; }
    .hr-score.on[data-v="fair"] { background:#fbf1d6; border-color:#a16207; color:#a16207; }
    .hr-score.on[data-v="bad"] { background:#fdecea; border-color:#b3261e; color:#b3261e; }

    .hr-seg { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #d9d9d2; border-radius:10px; overflow:hidden; background:#fff; margin:0 0 12px; }
    .hr-seg button { border:none; border-right:1px solid #d9d9d2; background:#fff; color:#4a5068; padding:11px 6px; font-size:14px;
      font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:4px; }
    .hr-seg button:last-child { border-right:none; }
    .hr-seg button .material-symbols-outlined { font-size:18px; }
    .hr-seg button.on[data-kind="hired"] { background:#2f6f3a; color:#fff; }
    .hr-seg button.on[data-kind="hold"] { background:#b7791f; color:#fff; }
    .hr-seg button.on[data-kind="rejected"] { background:#b3261e; color:#fff; }
    .hr-dk-banner { border:1px solid; border-radius:10px; padding:10px 12px; font-size:12.5px; margin:0 0 12px; display:flex; gap:6px; align-items:flex-start; }
    .hr-dk-banner .material-symbols-outlined { font-size:18px; }
    .hr-dk-banner[data-kind="hired"] { background:#e5f1e2; color:#2f6f3a; border-color:#2f6f3a; }
    .hr-dk-banner[data-kind="hold"] { background:#fbf1d6; color:#8a5a00; border-color:#b7791f; }
    .hr-dk-banner[data-kind="rejected"] { background:#fdecea; color:#b3261e; border-color:#b3261e; }
    .btn.hr-dk-save[data-kind="hired"] { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    .btn.hr-dk-save[data-kind="hold"] { background:#b7791f; border-color:#b7791f; color:#fff; }
    .btn.hr-dk-save[data-kind="rejected"] { background:#b3261e; border-color:#b3261e; color:#fff; }
    .hr-msg-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .hr-msg-actions .later { margin-left:auto; font-size:12.5px; color:#6b7080; background:none; border:none; cursor:pointer; font-family:inherit; }

    /* 一覧・詳細・カードの小さなバッジ（判断と、本人への連絡状況は別のバッジ） */
    .hr-badges { display:inline-flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
    .hr-badge { display:inline-flex; align-items:center; gap:2px; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; white-space:nowrap; }
    .hr-badge .material-symbols-outlined { font-size:13px; }
    .hr-badge.d-hired { background:#e5f1e2; color:#2f6f3a; }
    .hr-badge.d-hold { background:#fbf1d6; color:#8a5a00; }
    .hr-badge.d-rejected { background:#fdecea; color:#b3261e; }
    .hr-badge.c-pending { background:#ffedd5; color:#c2410c; border:1px solid #fdba74; }
    .hr-badge.c-done { background:#efefeb; color:#4a5068; }
    /* 確認モーダル（削除など）は、書類のモーダルの上にも出せるように1段上げる */
    .hr-modal-bg.top { z-index:60; } .hr-modal.top { z-index:61; }

    /* メールを送る（ひな型から） */
    .hr-mail-to { background:#f6f6f2; border:1px solid #e2e2dc; border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:13px; color:#1b2440; word-break:break-all; }
    .hr-mail-to .lb { font-size:11px; color:#6b7080; margin-right:6px; }
    .hr-mail-to .sub { font-size:11.5px; color:#4a5068; margin-top:4px; }
    .hr-mail-hist { list-style:none; padding:0; margin:6px 0 0; }
    .hr-mail-hist li { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; font-size:12px; padding:6px 0; border-bottom:1px solid #efefeb; }
    .hr-mail-hist .t { color:#6b7080; } .hr-mail-hist .s { color:#1b2440; font-weight:600; } .hr-mail-hist .m { color:#6b7080; flex-basis:100%; }
    .hr-mail-st { border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; }
    .hr-mail-st.ok { background:#e5f1e2; color:#2f6f3a; } .hr-mail-st.ng { background:#fdecea; color:#b3261e; } .hr-mail-st.warn { background:#fbf1d6; color:#8a5a00; }

    /* 書類タブ */
    .hr-doc { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .hr-doc .t { font-size:13px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:6px; }
    .hr-doc .t .material-symbols-outlined { font-size:18px; color:#6b7080; }
    .hr-doc .f { font-size:13px; margin:6px 0 2px; word-break:break-all; }
    .hr-doc .m { font-size:11.5px; color:#6b7080; }
    .hr-doc .acts { display:flex; gap:6px; margin-top:10px; align-items:center; position:relative; flex-wrap:wrap; }
    .hr-doc .none { font-size:12.5px; color:#9aa0b4; margin:6px 0 0; }
    .hr-more { position:relative; }
    .hr-menu-pop { position:absolute; right:0; top:34px; background:#fff; border:1px solid #e2e2dc; border-radius:8px;
      box-shadow:0 8px 24px rgba(27,36,64,.14); min-width:160px; z-index:5; padding:4px 0; }
    .hr-menu-pop button { display:block; width:100%; text-align:left; border:none; background:none; padding:9px 14px;
      font-size:13px; color:#1b2440; cursor:pointer; font-family:inherit; }
    .hr-menu-pop button:hover { background:#f6f6f2; }
    .hr-menu-pop button.danger { color:#b3261e; }
    .hr-drop { border:2px dashed #cfd4e0; border-radius:10px; padding:22px; text-align:center; color:#6b7080;
      font-size:13px; cursor:pointer; background:#fafaf7; }
    .hr-drop.over { border-color:#1b2440; background:#eef0f6; color:#1b2440; }
    /* 書類列：登録済みの書類だけアイコンで。押すとプレビューを別タブで（行は開かない） */
    .hr-docs { display:inline-flex; gap:6px; white-space:nowrap; }
    .hr-docs a { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:7px;
      color:#1b2440; text-decoration:none; overflow:hidden; }   /* アイコンの字が読み込み前でも隣へはみ出さない */
    .hr-docs a:hover { background:#eef0f6; }
    .hr-docs a .material-symbols-outlined { font-size:20px; }

    /* 選択中バー（Selection Action Bar）。1件以上チェックすると画面下部に固定表示する。
       ドロワー(41)・モーダル(51)より前面に出ないよう、z-indexは30〜35の範囲にとどめる */
    .hr-bulkbar { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      width:fit-content; min-width:520px; max-width:calc(100vw - 40px);
      display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #d8dce8;
      border-radius:13px; padding:12px 16px; font-size:13px; color:#1b2440; flex-wrap:wrap;
      box-shadow:0 12px 32px rgba(27,36,64,.18); z-index:32; }
    .hr-bulkbar .cnt { font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .hr-bulkbar .cnt .material-symbols-outlined { font-size:17px; color:#1b2440; }
    .hr-bulkbar .sp { flex:1; }
    @media (max-width:600px) {
      .hr-bulkbar { left:12px; right:12px; transform:none; width:auto; min-width:0; max-width:none; }
    }
    .hr-check-col { width:34px; }

    .hr-next { background:#e6f050; border-radius:10px; padding:16px 18px; margin:0 0 16px; }
    .hr-next .now { font-size:11px; color:#4a5068; margin-bottom:2px; }
    /* 選考（どこまで進んだか）・状態（いま何待ちか）・NEXT ACTION（次に何をするか）を上から並べる */
    .hr-state { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin:0 0 10px; }
    .hr-state dt { font-size:11px; font-weight:700; color:#4a5068; }
    .hr-state dd { margin:0; font-size:14px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hr-state dd small { font-size:11px; font-weight:400; color:#6b7080; }
    .hr-next .lb { font-size:11px; font-weight:700; color:#4a5068; display:flex; align-items:center; gap:5px; }
    .hr-next .lb .material-symbols-outlined { font-size:15px; }
    .hr-next h3 { font-size:18px; font-weight:700; color:#1b2440; margin:6px 0 8px; }
    .hr-next .meta { font-size:12px; color:#4a5068; margin-bottom:10px; }
    .hr-done-banner { background:#e5f1e2; color:#2f6f3a; border-radius:10px; padding:14px 16px;
      display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }

    .hr-tabs { display:flex; gap:2px; padding:0 20px; background:#fff; border-bottom:1px solid #e2e2dc; }
    .hr-tabs button { border:none; background:none; padding:12px 4px; margin-right:20px; font-size:13px;
      font-weight:600; color:#6b7080; cursor:pointer; border-bottom:3px solid transparent; font-family:inherit; }
    .hr-tabs button.on { color:#1b2440; border-bottom-color:#1b2440; }
    .hr-detail-body { padding:20px; }

    .hr-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:12.5px; }
    .hr-grid2 dt { color:#6b7080; margin-bottom:2px; } .hr-grid2 dd { margin:0 0 10px; color:#1b2440; font-weight:600; }

    /* 合格後の採用区分のカード（「この方をどの形で迎えますか？」）。PCは横並び、スマホは1列 */
    .hr-otype-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin:6px 0 4px; }
    .hr-otype { text-align:left; border:1.5px solid #e2e2dc; border-radius:10px; background:#fff; padding:12px;
      cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:4px; min-width:0; }
    .hr-otype:hover { border-color:#9aa0b4; }
    .hr-otype.on { border-color:#1b2440; background:#eef0f6; box-shadow:inset 0 0 0 1px #1b2440; }
    .hr-otype .hd { display:flex; align-items:center; gap:6px; font-weight:700; color:#1b2440; font-size:13.5px; }
    .hr-otype .hd .material-symbols-outlined { font-size:20px; overflow:hidden; width:20px; }
    .hr-otype .sm { font-size:11.5px; color:#4a5068; line-height:1.5; }
    .hr-otype .fl { font-size:10.5px; color:#6b7080; line-height:1.5; }
    @media (max-width: 520px) { .hr-otype-grid { grid-template-columns:1fr; } }
    /* 区分ごとのオファー入力（必要な項目だけ） */
    .hr-of-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
    .hr-of-grid .wide { grid-column:1 / -1; }
    .hr-of-grid label { margin-top:0; }
    @media (max-width: 520px) { .hr-of-grid { grid-template-columns:1fr; } }
    .hr-of-docs { font-size:11.5px; color:#4a5068; background:#f6f6f2; border-radius:8px; padding:8px 10px; margin:0 0 12px; }
    /* 採用フローのステップバー（候補者詳細の上部に常時表示。いまの段階を強調） */
    .hr-steps { display:flex; list-style:none; margin:0; padding:0 16px 12px; overflow-x:auto; }
    .hr-steps li { flex:1 0 auto; min-width:56px; display:flex; flex-direction:column; align-items:center;
      position:relative; font-size:11px; color:#9aa0b4; }
    .hr-steps li::before { content:""; position:absolute; top:10px; left:-50%; width:100%; height:2px; background:#e2e2dc; z-index:0; }
    .hr-steps li:first-child::before { display:none; }
    .hr-steps li.done::before, .hr-steps li.now::before { background:#3e9c5a; }
    .hr-steps .m { width:21px; height:21px; border-radius:50%; border:2px solid #c5cfdd; background:#fff; z-index:1;
      display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; }
    .hr-steps li.done .m { background:#eaf5ec; border-color:#3e9c5a; color:#256b36; }
    .hr-steps li.now .m { background:#1b2440; border-color:#1b2440; color:#fff; }
    .hr-steps .l { margin-top:3px; white-space:nowrap; }
    .hr-steps li.now .l { color:#1b2440; font-weight:700; }
    .hr-steps li.done .l { color:#256b36; }
    .hr-steps-ended { padding:0 20px 10px; font-size:11.5px; color:#b3261e; }
    .hr-tl .row .d .who { margin-left:6px; color:#4a5068; }

    .hr-tl { border-left:2px solid #e2e2dc; margin-left:6px; padding-left:16px; }
    .hr-tl .row { position:relative; padding-bottom:16px; }
    .hr-tl .row::before { content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:999px; background:#1b2440; }
    .hr-tl .row .d { font-size:11px; color:#6b7080; } .hr-tl .row .l { font-size:13px; font-weight:600; color:#1b2440; }
    .hr-tl .row .now { display:inline-block; margin-left:6px; background:#1b2440; color:#fff; font-size:10px;
      font-weight:700; padding:1px 7px; border-radius:999px; }

    .hr-chip { display:inline-flex; align-items:center; gap:4px; background:#e7eaf3; color:#1b2440;
      border-radius:999px; padding:5px 11px; font-size:12px; margin:0 6px 6px 0; }
    .hr-chip button { border:none; background:none; cursor:pointer; color:#1b2440; font-weight:700; padding:0; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="hr-title">応募者</h1>
  <p class="hr-sub">選考中の応募者を一覧で見て、詳細は右ドロワーで開きます。</p>

  <div class="hr-catbar">
    <div class="hr-cat-tabs" id="cat-tabs" role="tablist" aria-label="区分"></div>
    <span id="lead-tools"></span>
  </div>
  <div class="hr-toolbar">
    <input type="text" id="q" placeholder="氏名・職種で絞り込む" oninput="render()">
    <div class="hr-stage-tabs" id="stage-tabs"></div>
  </div>

  <div id="bulkbar"></div>

  <div style="overflow-x:auto;">
    <table class="hr-table">
      <thead id="thead"><tr>
        <th class="hr-check-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
        <th>応募者</th><th>書類</th><th>選考</th><th>状態</th><th>NEXT</th><th>担当</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="modal-root"></div>
<div id="action-root"></div>
<div id="hr-modal-root"></div>
<div id="confirm-root"></div>

<script src="../js/api-client.js?v=20261008rec3"></script>
<script src="../js/layout.js?v=20261008rec3"></script>
<script src="../js/hr-layout.js?v=20261008rec3"></script>
<script src="../js/jst.js?v=20261008rec3"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = HRLayout.esc;

  const STAGES = [
    { key: "applied", label: "新規応募" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "ceo_recommend", label: "社長推薦" }, { key: "ceo_interview", label: "社長面談" },
    { key: "offer", label: "内定" }, { key: "joining_scheduled", label: "入社予定" },
  ];
  // 無限道場リードの段階（lib/hr-lead-flow.js の MUGENDOJO_STAGES と同じ並び）
  const MD_STAGES = [
    { key: "applied", label: "新規リード" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "md_trial", label: "体験案内" }, { key: "md_considering", label: "参加検討" },
    { key: "md_applied", label: "申込" }, { key: "md_joined", label: "参加" },
  ];
  // 区分。「採用」は無限道場以外（API の既定と同じ）
  const CATEGORIES = [{ key: "all", label: "すべて" }, { key: "recruitment", label: "採用" }, { key: "mugendojo", label: "無限道場" }];
  const isLead = (a) => a?.leadCategory === "mugendojo";
  const inCategory = (a, key) => key === "all" || (key === "mugendojo" ? isLead(a) : !isLead(a));
  const STATUS_COLOR = {
    todo: ["#efefeb", "#4a5068", "remove"], scheduling: ["#e7eaf3", "#1b2440", "calendar_month"],
    interview_scheduled: ["#e7eaf3", "#1b2440", "video_call"], eval_pending: ["#fbf1d6", "#7d5a00", "edit_note"],
    ceo_recommend_pending: ["#fbf1d6", "#7d5a00", "recommend"], ceo_interview_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    ceo_decision_pending: ["#fbf1d6", "#7d5a00", "pending_actions"], next_scheduling_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    offer_draft_pending: ["#fbf1d6", "#7d5a00", "description"], offer_review_pending: ["#fbf1d6", "#7d5a00", "fact_check"],
    offer_send_pending: ["#fbf1d6", "#7d5a00", "send"], offer_sent: ["#e7eaf3", "#1b2440", "mark_email_read"],
    offer_viewed: ["#e5f1e2", "#2f6f3a", "visibility"], offer_resend_pending: ["#fbf1d6", "#7d5a00", "send"],
    offer_response_pending: ["#e7eaf3", "#1b2440", "hourglass_empty"],
    accepted: ["#e5f1e2", "#2f6f3a", "check_circle"], declined: ["#efefeb", "#4a5068", "remove"],
    done: ["#e5f1e2", "#2f6f3a", "check_circle"], passed: ["#efefeb", "#4a5068", "remove"],
  };
  const OVERDUE_COLOR = ["#fdecea", "#b3261e", "error"];
  // 社長判断待ちのうち、保留にしたもの（判断そのものは済んでいない。期限と次の確認事項を見る）
  const HOLD_COLOR = ["#fbf1d6", "#7d5a00", "pause_circle"];
  const isOnHold = (a) => a.decision === "hold" && a.status === "ceo_decision_pending";
  const STATUS_LABEL = {
    todo: "未対応", scheduling: "日程調整中", interview_scheduled: "面談予定",
    eval_pending: "評価入力待ち", ceo_recommend_pending: "社長推薦待ち",
    ceo_interview_pending: "社長面談設定待ち", ceo_decision_pending: "社長判断待ち",
    next_scheduling_pending: "次回調整待ち", offer_draft_pending: "合格通知作成待ち",
    offer_review_pending: "社内確認待ち", offer_send_pending: "本人送付待ち",
    offer_sent: "本人送付済み", offer_viewed: "本人が閲覧済み", offer_resend_pending: "URL再送待ち",
    offer_response_pending: "承諾待ち", accepted: "承諾済み", declined: "辞退",
    done: "完了", passed: "見送り",
  };

  let applicants = [];
  let employees = [];
  let meEmployeeId = null;   // 応募者を追加するときの担当の初期値（登録する本人）
  /** 担当の選択肢（一括変更・追加・詳細で同じもの） */
  const recruiterOptions = (selected) => `<option value="">未定</option>` + employees.map((e) =>
    `<option value="${esc(e.id)}" ${e.id === selected ? "selected" : ""}>${esc(e.display_name)}</option>`).join("");
  let stageFilter = "";
  let categoryFilter = "all";
  let leadReady = true;      // db/118（リードの列）が入っているか。無ければ無限道場の欄を出さない
  let openId = null;
  let canDecide = false;
  // 一覧の複数選択（ページ内表示分だけを対象にする。README §1）
  let selectedIds = new Set();
  let visibleIds = [];

  // 表示速度：枠（権限の確認）を待たずに一覧を取りにいき始める。
  // この画面は「すべて／採用／無限道場」を切り替えるので、無限道場リードも含めて取る（category=all）。
  // HRダッシュボードは採用だけ（既定）を取るので、鍵を分ける（混ぜると、ダッシュボードに無限道場が出る）
  const fetchApplicants = () => API.api("/api/hr/applicants?category=all");
  API.warm("hr:applicants:all", fetchApplicants, (me) => HRLayout.allows(me, "applicants"));

  HRLayout.init({ active: "applicants" }).then((ctx) => { if (ctx) { canDecide = ctx.canDecide; start(); } });

  function start() {
    const cat = new URLSearchParams(location.search).get("category");
    if (CATEGORIES.some((c) => c.key === cat)) categoryFilter = cat;
    renderCategoryTabs();
    renderStageTabs();
    load();
    const q = new URLSearchParams(location.search);
    if (q.get("new")) openAdd();
    if (q.get("id")) openDetail(q.get("id"));
  }

  // 選考パイプライン：「採用フロー上のどこに人が溜まっているか」。人数は取得済みの応募者から数える
  // （固定値を持たない）。細かい状態（status）は上に出さない
  /** いまの区分の応募者 */
  const catList = () => applicants.filter((a) => inCategory(a, categoryFilter));
  const listUrl = () => (categoryFilter === "all" ? "/hr/applicants.html" : `/hr/applicants.html?category=${categoryFilter}`);

  function renderCategoryTabs() {
    API.morph(el("cat-tabs"), CATEGORIES.map((c) => {
      const n = applicants.filter((a) => inCategory(a, c.key)).length;
      return `<button role="tab" aria-selected="${categoryFilter === c.key}" class="${categoryFilter === c.key ? "on" : ""}"
        data-category="${esc(c.key)}" onclick="setCategory('${esc(c.key)}')">${esc(c.label)}<span class="n">${n}</span></button>`;
    }).join(""));
    // 無限道場の通知先（運営担当）は、無限道場を見ているときだけ出す
    el("lead-tools").innerHTML = categoryFilter === "mugendojo"
      ? `<button class="btn btn-secondary btn-sm" onclick="openLeadWatchers()">
          <span class="material-symbols-outlined icon-inline">notifications</span>通知先（運営担当）</button>
        ${leadReady ? "" : `<span class="muted" style="font-size:12px;margin-left:8px;">リードの列がまだありません（db/118_hr_leads.sql 未実行）</span>`}`
      : "";
  }
  function setCategory(key) {
    categoryFilter = key;
    stageFilter = "";
    selectedIds.clear();
    if (!openId) history.replaceState({}, "", listUrl());
    renderCategoryTabs(); renderStageTabs(); render();
  }

  function renderStageTabs() {
    const pool = catList();
    const count = (key) => (key ? pool.filter((a) => a.stage === key).length : pool.length);
    const tab = (key, label) => {
      const n = count(key);
      return `<button class="${stageFilter === key ? "on" : ""}${n ? "" : " zero"}" data-stage="${esc(key || "all")}"
        onclick="setStage('${esc(key)}')">${esc(label)}<span class="n">${n}</span></button>`;
    };
    const stages = categoryFilter === "mugendojo" ? MD_STAGES : STAGES;
    API.morph(el("stage-tabs"), tab("", "すべて") + stages.map((s) => tab(s.key, s.label)).join(""));
  }
  function setStage(key) { stageFilter = key; renderStageTabs(); render(); }

  let loading = null;   // 一覧の読み込み中（追加フォームが担当の選択肢を待つため）
  function load() { loading = loadList().finally(() => { loading = null; }); return loading; }
  async function loadList() {
    try {
      // 2回目からは前回の一覧をすぐ出し、裏で最新にする（変わった行だけ描き直す）
      await API.swr("hr:applicants:all", fetchApplicants, (res) => {
        if (res.notReady) {
          el("rows").innerHTML = `<tr><td colspan="8"><div class="banner warn">
            <span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div></td></tr>`;
          return;
        }
        applicants = res.applicants || [];
        employees = res.employees || [];
        meEmployeeId = res.meEmployeeId || null;
        leadReady = res.leadReady !== false;
        renderCategoryTabs();
        renderStageTabs();
        render();
      });
    } catch (e) {
      el("rows").innerHTML = `<tr><td colspan="8"><div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
    }
  }

  // 書類列。登録済みの書類（最新版）だけアイコンで出す。未登録は何も出さない。
  // 押すと既存のプレビュー（hr/document.html）を別タブで開く。行のクリック（詳細ドロワー）は発火させない。
  // 表示用の URL はここでは持たない（document.html が権限を確かめてから短時間の URL を取る）
  function docsCell(a) {
    const d = a.docs;
    if (!d) return "";
    const link = (docId, icon, label) => (docId ? `<a href="/hr/document.html?applicant=${encodeURIComponent(a.id)}&doc=${encodeURIComponent(docId)}"
      target="_blank" rel="noopener noreferrer" title="${label}をプレビュー" aria-label="${label}をプレビュー" data-doc-link="${icon}"
      onclick="event.stopPropagation()"><span class="material-symbols-outlined">${icon}</span></a>` : "");
    return `<span class="hr-docs" data-docs>${link(d.resumeId, "description", "履歴書")}${link(d.workHistoryId, "work_history", "職務経歴書")}</span>`;
  }

  /** 流入元の1語（UTM → 参照元のドメイン → 直接） */
  function leadSourceLabel(a) {
    const utm = [a.utmSource, a.utmMedium].filter(Boolean).join(" / ");
    if (utm) return utm;
    const ref = a.attribution?.first?.referrer;
    if (ref) { try { return new URL(ref).hostname; } catch { /* そのまま下へ */ } }
    return "直接";
  }
  const leadDiagnosis = (a) => a.leadProfile?.diagnosis_label || a.leadProfile?.diagnosis_type || "";
  const leadInterests = (a) => (a.leadProfile?.interests || []);

  const THEAD = {
    standard: ["応募者", "書類", "選考", "状態", "NEXT", "担当", ""],
    mugendojo: ["氏名", "流入元", "興味・目的", "適性診断", "状態", "面談日時", "担当", "登録日", "最終接触", ""],
  };
  let theadKind = "standard";
  function renderThead() {
    const kind = categoryFilter === "mugendojo" ? "mugendojo" : "standard";
    if (kind === theadKind && el("chk-all")) return;
    theadKind = kind;
    el("thead").innerHTML = `<tr><th class="hr-check-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
      ${THEAD[kind].map((h) => `<th>${esc(h)}</th>`).join("")}</tr>`;
  }
  const colCount = () => THEAD[theadKind].length + 1;

  function statusPill(a) {
    const [bg, fg, icon] = a.overdue ? OVERDUE_COLOR : (STATUS_COLOR[a.status] || STATUS_COLOR.todo);
    const statusLabel = a.overdue ? "期限超過" : a.statusLabel;
    return `<span class="hr-pill" style="background:${bg};color:${fg};">
          <span class="material-symbols-outlined">${icon}</span>${esc(statusLabel)}</span>`;
  }

  /** 無限道場の一覧の1行 */
  function leadRow(a) {
    return `
      <tr class="click" onclick="openDetail('${esc(a.id)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${selectedIds.has(a.id) ? "checked" : ""}
          onchange="toggleSelect('${esc(a.id)}', this.checked)"></td>
        <td><span class="hr-nm">${esc(a.name)}</span><span class="hr-sub2">${esc(a.leadProfile?.occupation || "")}</span></td>
        <td>${esc(leadSourceLabel(a))}${a.utmCampaign ? `<span class="hr-sub2">${esc(a.utmCampaign)}</span>` : ""}</td>
        <td class="hr-chips-sm">${leadInterests(a).map((x) => `<span>${esc(x)}</span>`).join("") || "—"}</td>
        <td>${esc(leadDiagnosis(a) || "—")}</td>
        <td>${statusPill(a)}<span class="hr-sub2">${esc(a.stageLabel)}</span></td>
        <td>${a.nextInterviewAt ? esc(fmtDate(a.nextInterviewAt)) : "—"}</td>
        <td>${esc(a.recruiterName || "未定")}</td>
        <td>${esc(JST.date(a.createdAt))}</td>
        <td>${a.lastContactedAt ? esc(JST.date(a.lastContactedAt)) : "—"}</td>
        <td style="text-align:right;"><span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span></td>
      </tr>`;
  }

  function render() {
    renderThead();
    const q = (el("q").value || "").trim().toLowerCase();
    const list = catList().filter((a) =>
      (!stageFilter || a.stage === stageFilter)
      && (!q || `${a.name} ${a.jobTitle} ${a.source || ""}`.toLowerCase().includes(q)));
    visibleIds = list.map((a) => a.id);

    if (!list.length) {
      API.morph(el("rows"), `<tr><td colspan="${colCount()}" class="empty">対象がありません。</td></tr>`);
      renderBulkBar();
      return;
    }
    if (theadKind === "mugendojo") {
      API.morph(el("rows"), list.map(leadRow).join(""));
      renderBulkBar();
      return;
    }
    API.morph(el("rows"), list.map((a) => {
      const [bg, fg, icon] = a.overdue ? OVERDUE_COLOR : isOnHold(a) ? HOLD_COLOR : (STATUS_COLOR[a.status] || STATUS_COLOR.todo);
      const statusLabel = a.overdue ? "期限超過" : isOnHold(a) ? "保留中（社長判断）" : a.statusLabel;
      return `
      <tr class="click" onclick="openDetail('${esc(a.id)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${selectedIds.has(a.id) ? "checked" : ""}
          onchange="toggleSelect('${esc(a.id)}', this.checked)"></td>
        <td><span class="hr-nm">${esc(a.name)}${isLead(a) ? `<span class="hr-lead-badge">無限道場</span>` : ""}</span><span class="hr-sub2">${esc(a.jobTitle)} ／ ${esc(a.source)}</span></td>
        <td>${docsCell(a)}</td>
        <td>${esc(a.stageLabel)}${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:6px;">${esc(a.rank)}</span>` : ""}</td>
        <td><span class="hr-pill" style="background:${bg};color:${fg};">
          <span class="material-symbols-outlined">${icon}</span>${esc(statusLabel)}</span>${decisionBadges(a)}</td>
        <td>${esc(listNextAction(a))}${a.decisionDueOn ? `<span class="hr-sub2">期限 ${esc(a.decisionDueOn)}</span>` : ""}</td>
        <td>${esc(a.recruiterName || "未定")}</td>
        <td style="text-align:right;"><span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span></td>
      </tr>`;
    }).join(""));
    renderBulkBar();
  }

  // ---- 複数選択・一括操作 -----------------------------------------------------------
  // 全選択は「いま表示している分（visibleIds）」だけを対象にする。
  // 意図せず全DBを対象にしない（README §1）
  function toggleSelectAll(checked) {
    if (checked) visibleIds.forEach((id) => selectedIds.add(id));
    else visibleIds.forEach((id) => selectedIds.delete(id));
    render();
  }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    renderBulkBar();
    updateSelectAllCheckbox();
  }

  function updateSelectAllCheckbox() {
    const box = el("chk-all");
    if (!box) return;
    const selectedOnPage = visibleIds.filter((id) => selectedIds.has(id)).length;
    box.checked = visibleIds.length > 0 && selectedOnPage === visibleIds.length;
    box.indeterminate = selectedOnPage > 0 && selectedOnPage < visibleIds.length;
  }

  function clearSelection() { selectedIds.clear(); render(); }

  function renderBulkBar() {
    updateSelectAllCheckbox();
    const box = el("bulkbar");
    if (!selectedIds.size) { box.innerHTML = ""; return; }
    box.innerHTML = `
      <div class="hr-bulkbar">
        <span class="cnt"><span class="material-symbols-outlined">check_circle</span>${selectedIds.size}名選択中</span>
        <span class="sp"></span>
        <button class="btn btn-secondary btn-sm" onclick="openBulkStatusModal()">ステータス変更</button>
        <button class="btn btn-secondary btn-sm" onclick="openBulkRecruiterModal()">担当変更</button>
        <button class="btn btn-danger btn-sm" onclick="openBulkDeleteModal()">削除</button>
        <button class="btn btn-secondary btn-sm" onclick="clearSelection()">選択解除</button>
      </div>`;
  }

  // ---- モーダル（1つの操作を実行する場所）。ドロワーの上に重ねて出し、
  // 閉じてもドロワーは閉じない（README §4・§5） ------------------------------------
  function openHrModal(html) {
    el("hr-modal-root").innerHTML = `<div class="hr-modal-bg" onclick="closeHrModal()"></div><div class="hr-modal">${html}</div>`;
  }
  function closeHrModal() { el("hr-modal-root").innerHTML = ""; }

  function openBulkStatusModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">ステータス変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名のステータスを変更します。</p>
      <label>変更後のステータス</label>
      <select id="bs-status">${Object.entries(STATUS_LABEL).map(([k, l]) =>
        `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
      <div id="bs-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkStatus(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkStatus(btn) {
    const msg = el("bs-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "変更中…", () => API.setHrApplicantsStatus(ids, el("bs-status").value));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "変更できませんでした"; }
  }

  function openBulkRecruiterModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">担当変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名の採用担当を変更します。</p>
      <label>担当者</label>
      <select id="br-recruiter">
        <option value="">（未定にする）</option>
        ${employees.map((e) => `<option value="${esc(e.id)}">${esc(e.display_name)}</option>`).join("")}
      </select>
      <div id="br-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkRecruiter(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkRecruiter(btn) {
    const msg = el("br-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {

        ? `<div style="font-size:14px;font-weight:700;color:#1b2440;">${esc(picked[0].name)}</div>

        : `<ul style="margin:0;padding-left:18px;font-size:12.5px;color:#4a5068;max-height:160px;overflow-y:auto;">
             ${picked.map((a) => `<li>${esc(a.name)}</li>`).join("")}</ul>`}

  async function submitAdd(btn) {
    const msg = el("a-msg"); msg.textContent = "";
    const name = el("a-name").value.trim();
    const jobTitle = el("a-job").value.trim();
    const picked = document.querySelector('input[name="a-source"]:checked');
    const source = (el("a-source-other").value.trim()) || (picked ? picked.value : "");
    if (!name) { msg.textContent = "氏名を入力してください"; return; }
    if (!jobTitle) { msg.textContent = "応募職種を入力してください"; return; }
    if (!source) { msg.textContent = "応募媒体を選ぶか入力してください"; return; }

    try {
      await KPLayout.busy(btn, "追加中…", () => API.createHrApplicant({
        name, jobTitle, source,
        recruiterId: el("a-recruiter").value || null,
        email: el("a-email").value.trim() || undefined,
        phone: el("a-phone").value.trim() || undefined,
        profileUrl: el("a-url").value.trim() || undefined,
        note: el("a-note").value.trim() || undefined,
      }));
      closeModal();
      history.replaceState({}, "", listUrl());
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "追加できませんでした"; }
  }

  // ---- 応募者詳細（右ドロワー） --------------------------------------------------
  let detail = null;
  let detailTab = "overview";

  // ---- 合格後の採用区分（API が返す lib/hr-offer-types.js が正。画面側に定義を持たない） --------
  let offerTypesDef = [];
  let offerTypeReady = true;   // false は db/129 未適用（区分を選ぶ操作だけ止め、これまでの合格通知で進める）
  const offerTypeDef = (key) => offerTypesDef.find((t) => t.key === key) || null;
  function takeOfferTypes(d) {
    if (Array.isArray(d?.offerTypes)) offerTypesDef = d.offerTypes;
    if (d && "offerTypeReady" in d) offerTypeReady = d.offerTypeReady !== false;
  }

  /** 採用区分の5つのカード。onPick は選んだときに呼ぶ関数名（区分の key を渡す） */
  function offerTypeCards(selected, onPick) {
    if (!offerTypesDef.length) return `<p class="hr-flow-note">採用区分を読み込み中…</p>`;
    return `<div class="hr-otype-grid" role="radiogroup" aria-label="採用区分">${offerTypesDef.map((t) => `
      <button type="button" class="hr-otype${selected === t.key ? " on" : ""}" role="radio" aria-checked="${selected === t.key}"
        data-otype="${esc(t.key)}" onclick="${onPick}('${esc(t.key)}')">
        <span class="hd"><span class="material-symbols-outlined" aria-hidden="true">${esc(t.icon)}</span>${esc(t.label)}</span>
        <span class="sm">${esc(t.summary)}</span>
        <span class="fl">${esc((t.flow || []).join(" → "))}</span>
      </button>`).join("")}</div>`;
  }

  /** 採用フローのステップバー（応募 → 面談 → 合格 → オファー → 承諾 → 契約 → 入社/稼働。育成枠は育成の流れ） */
  function stepBar(a) {
    const s = a.steps;
    if (!s || !(s.steps || []).length) return "";
    return `<ol class="hr-steps" id="hr-steps" data-flow="${esc(s.flow)}" aria-label="採用の進み具合">${s.steps.map((p, i) => `
      <li class="${esc(p.state)}" data-step="${esc(p.key)}" aria-current="${p.state === "now" ? "step" : "false"}">
        <span class="m" aria-hidden="true">${p.state === "done" ? "✓" : i + 1}</span><span class="l">${esc(p.label)}</span></li>`).join("")}</ol>
      ${s.ended ? `<div class="hr-steps-ended">選考は終了しました（${esc(s.ended)}）</div>` : ""}`;
  }

  async function openDetail(id) {
    // 同じ応募者を開き直す場合（各操作後の再読み込み）は、いま見ているタブを保つ。
    // 呼び出し側が detailTab = "interviews" を先に指定してから呼ぶケースがあるため
    // （openIdはcloseModal()内でnullに戻るため、判定にはdetailの中身を使う）
    if (detail?.applicant?.id !== id) detailTab = "overview";
    openId = id;
    closeModal();
    const root = el("modal-root");
    root.innerHTML = `<div class="hr-drawer-bg" onclick="closeModal()"></div>
      <div class="hr-detail" id="hr-detail-box"><div class="empty" style="padding:40px;">読み込み中…</div></div>`;
    history.replaceState({}, "", `/hr/applicants.html?id=${encodeURIComponent(id)}`);
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      takeOfferTypes(d);
      renderDetail();
    } catch (e) {
      el("hr-detail-box").innerHTML = `<div class="banner err" style="margin:20px;">
        <span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  /**
   * 開いたままの応募者詳細を、取り直して描き直す（各操作の保存後）。
   * ドロワーは閉じない。いま見ているタブも保つ（tab を渡したときはそのタブへ）
   */
  async function refreshDetail(tab) {
    const id = detail?.applicant?.id;
    if (!id) return;
    if (tab) detailTab = tab;
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      takeOfferTypes(d);
      if (el("hr-detail-box")) renderDetail();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "再読み込みできませんでした");
    }
  }

  // ---- 書類（履歴書・職務経歴書・その他） ------------------------------------------
  let docs = null;       // { documents:[{docType,label,icon,latest,history}], limits }
  let docsError = null;
  async function loadDocs(id) {
    try { docs = await API.hrDocuments(id); docsError = null; }
    catch (e) { docs = null; docsError = e.message || e.hint || "書類を読み込めませんでした"; }
  }

    // 無限道場リードには書類（履歴書・職務経歴書）が無い
    const TABS = isLead(a)
      ? [["overview", "概要"], ["interviews", "面談"], ["history", "履歴"]]

            ${isLead(a) ? `<span class="hr-lead-badge">無限道場</span>` : ""}</div>
          <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(a.jobTitle)} ／ ${esc(a.source)}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;">

  /**
   * 判断済み・本人へ未連絡のとき、ほかにすることが無ければ（見送り）「本人へ連絡」を NEXT ACTION にする。
   * 保留は「採用判断を更新」、内定は「合格通知を作成」が先に出る（未連絡はバッジと「本人へ連絡」ボタンで並べて出す）
   */
  function withContactAction(a) {
    if (a.contact?.state !== "pending") return a;
    if (a.decision === "rejected") {
      return { ...a, nextAction: `本人へ${DECIDE_LABEL[a.decision]}を伝えてください`, nextActionCta: "本人へ連絡", nextActionKey: "contact" };
    }
    return a;
  }
  const listNextAction = (a) => withContactAction(a).nextAction;

  /** 判断と本人への連絡状況の行（NEXT ACTION の中。判断済みのときだけ） */
  function contactRow(a) {
    if (!DECIDE_LABEL[a.decision] || isLead(a)) return "";
    const pending = a.contact?.state === "pending";
    return `<div class="hr-contact-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;">
      <span style="font-size:12px;color:#4a5068;">採用判断</span>${decisionBadges(a)}
      ${pending && withContactAction(a).nextActionKey !== "contact" ? `<button class="btn btn-secondary btn-sm" onclick="openContactForm('${esc(a.id)}', '${esc(a.decision)}')">
        <span class="material-symbols-outlined icon-inline">mail</span>本人へ連絡</button>` : ""}
      ${a.contact?.state === "done" && ["ceo_decision_pending", "passed"].includes(a.status)
        ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="openContactForm('${esc(a.id)}', '${esc(a.decision)}')">もう一度連絡する</button>` : ""}
    </div>`;
  }

  /** NEXT ACTION と、その1つの CTA（原則1つ） */
  function nextActionBox(a) {
    a = withContactAction(a);
    // 「面談を実施済みにする」は、実施する面談（nextInterviewId）があるときだけ出す。
    // 無ければ面談の記録を確かめてもらう（API も同じ判定。古いデータへの保険）
    if (a.nextActionKey === "conduct" && !a.nextInterviewId) {
      a = { ...a, nextAction: "面談予定の記録を確認してください", nextActionCta: "面談タブを確認", nextActionKey: "checkInterviews" };
    }
    // 採用区分を選べない環境（db/129 未適用）では、これまでどおり合格通知を作る
    if (a.nextActionKey === "chooseOfferType" && !offerTypeReady) {
      a = { ...a, nextAction: "合格通知を作成してください", nextActionCta: "合格通知を作成", nextActionKey: "createOffer" };
    }
    return `
      <div class="hr-next" style="margin:0 0 16px;">
        <dl class="hr-state now">
          <dt>${isLead(a) ? "段階" : "選考"}</dt><dd id="hr-stage">${esc(a.stageLabel || "—")}<small>どこまで進んでいるか</small></dd>
          <dt>状態</dt><dd id="hr-status">${esc(a.statusLabel || "—")}<small>いま何待ちか</small></dd>
          ${a.offerTypeLabel ? `<dt>採用区分</dt><dd id="hr-otype">${esc(a.offerTypeLabel)}<small>どの形で迎えるか</small></dd>` : ""}
        </dl>
        <div class="lb"><span class="material-symbols-outlined">bolt</span>NEXT ACTION<small style="font-weight:400;margin-left:6px;">次にすること</small></div>
        <h3>${esc(a.nextAction)}</h3>
        <div class="meta">担当：${esc(a.recruiterName || "未定")}${a.decisionDueOn ? `　期限：${esc(a.decisionDueOn)}` : ""}</div>
        ${isOnHold(a) ? `<div class="hr-dk-banner" data-kind="hold"><span class="material-symbols-outlined">pause_circle</span>
          <div><b>保留中</b>${a.holdReason ? `　理由：${esc(a.holdReason)}` : ""}${a.holdNextStep ? `<br>次に確認：${esc(a.holdNextStep)}` : ""}${a.decisionDueOn ? `<br>再判断期限：${esc(a.decisionDueOn)}` : ""}</div></div>` : ""}
        ${contactRow(a)}
        ${a.nextActionCta && (!["decide", "advance"].includes(a.nextActionKey) || canDecide)
          ? `<button class="btn btn-primary btn-sm" onclick="runNextAction()">${esc(a.nextActionCta)}</button>`
          : a.nextActionKey === "decide"
            ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">採用判断は社長・管理者が行います。</p>`
            : a.nextActionKey === "advance"
              ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">本採用へ進めるのは社長・管理者が行います。</p>`
              : a.status === "done" && a.employeeId
                ? `<a class="btn btn-secondary btn-sm" href="../admin-probation.html?employeeId=${esc(a.employeeId)}">試用期間の管理へ</a>` : ""}
      </div>`;
  }

  /**
   * 無限道場の講師・メンター応募（lead_type = mugendojo_instructor）。採用の応募者として入る（区分は recruitment）。

  const isInstructorApplicant = (a) => a?.attribution?.lead_type === "mugendojo_instructor" || a?.leadProfile?.kind === "instructor";
  function instructorApplication(a) {
    if (!isInstructorApplicant(a)) return "";
    const p = a.leadProfile || {};
    const first = a.attribution?.first || {};
    const dd = (v) => esc(v || "—");

    const link = (u) => (u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="word-break:break-all;">${esc(u)}</a>` : "—");
    const utm = [first.utm_source, first.utm_medium, first.utm_campaign].filter(Boolean).join(" / ");
    return `
        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">講師・メンター応募の内容</h4>
        <dl class="hr-grid2" style="margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid #e7eaf3;">

          <div><dt>会社・所属</dt><dd>${dd(p.company)}</dd></div>
          <div style="grid-column:1/-1;"><dt>専門分野</dt><dd class="hr-chips-sm">${(p.specialties || []).map((x) => `<span>${esc(x)}</span>`).join("") || "—"}</dd></div>
          <div style="grid-column:1/-1;"><dt>経歴・実績・できること</dt>${pre(p.career_text)}</div>
          <div style="grid-column:1/-1;"><dt>応募理由</dt>${pre(p.motivation_text)}</div>

          <div><dt>対応可能な曜日・時間</dt><dd>${dd(p.availability)}</dd></div>

          <div><dt>プロフィールURL</dt><dd>${link(p.profile_url || a.profileUrl)}</dd></div>
          <div><dt>SNS／Webサイト</dt><dd>${link(p.website_url)}</dd></div>
          <div style="grid-column:1/-1;"><dt>その他</dt>${pre(p.note_text)}</div>
          <div><dt>流入（UTM）</dt><dd>${dd(utm)}</dd></div>
          <div><dt>送信したページ</dt><dd>${link(a.attribution?.last?.source_url || first.source_url)}</dd></div>
        </dl>`;
  }

  /** いちばん新しい、評価済みの面談 */
  function latestEvaluation() {
    return (detail.interviews || []).find((i) => i.rank) || null;
  }

  /** 無限道場リードの概要（LP で本人が入れた内容・流入・面談・次のアクション） */
  function leadOverview(a) {
    const p = a.leadProfile || {};
    const first = a.attribution?.first || {};
    const last = a.attribution?.last || {};
    const dd = (v) => esc(v || "—");
    const link = (u) => (u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="word-break:break-all;">${esc(u)}</a>` : "—");
    const utm = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"]
      .map((k) => (first[k] ? `${k.replace("utm_", "")}=${first[k]}` : null)).filter(Boolean).join("　");
    const lastUtm = [last.utm_source, last.utm_medium, last.utm_campaign].filter(Boolean).join(" / ");
    const ivs = (detail.interviews || []).filter((i) => !i.canceled);
    return `
        ${nextActionBox(a)}
        <dl class="hr-grid2">
          <div><dt>氏名</dt><dd>${dd(a.name)}</dd></div>
          <div><dt>メール</dt><dd>${dd(a.email)}</dd></div>
          <div><dt>電話</dt><dd>${dd(a.phone)}</dd></div>
          <div><dt>現在の状況</dt><dd>${dd(p.occupation)}</dd></div>
          <div><dt>都道府県</dt><dd>${dd(p.prefecture)}</dd></div>
          <div><dt>担当</dt><dd id="hr-recruiter">${esc(a.recruiterName || "未定")}
            <button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="openRecruiterModal()">変更</button></dd></div>
          <div><dt>流入元</dt><dd>${esc(leadSourceLabel(a))}</dd></div>
          <div><dt>UTM（最初）</dt><dd>${dd(utm)}</dd></div>
          <div><dt>参照元</dt><dd>${link(first.referrer)}</dd></div>
          <div><dt>最初に来たページ</dt><dd>${link(first.landing_page)}</dd></div>
          <div><dt>送信したページ</dt><dd>${link(last.source_url || first.source_url)}</dd></div>
          <div><dt>直近の流入</dt><dd>${dd(lastUtm)}${a.attribution?.touches > 1 ? `<small class="muted">（送信${esc(a.attribution.touches)}回）</small>` : ""}</dd></div>
          <div><dt>AI経験</dt><dd>${dd(p.ai_experience)}</dd></div>
          <div><dt>IT経験</dt><dd>${dd(p.it_experience)}</dd></div>
          <div style="grid-column:1/-1;"><dt>興味・目的</dt><dd class="hr-chips-sm">${(p.interests || []).map((x) => `<span>${esc(x)}</span>`).join("") || "—"}</dd></div>
          <div style="grid-column:1/-1;"><dt>挑戦してみたいこと</dt><dd style="white-space:pre-wrap;font-weight:500;">${dd(p.challenge_text)}</dd></div>
          <div><dt>適性診断</dt><dd>${dd(leadDiagnosis(a))}</dd></div>
          <div><dt>次のアクション</dt><dd>${dd(a.leadNextActionLabel)}</dd></div>
          <div><dt>登録日</dt><dd>${esc(fmtDate(a.createdAt))}</dd></div>
          <div><dt>最終接触</dt><dd>${a.lastContactedAt ? esc(fmtDate(a.lastContactedAt)) : "—"}</dd></div>
        </dl>
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">面談</h4>
        ${ivs.length ? ivs.map((i) => `<div class="hr-lead-iv">
            <b>${esc(i.kindLabel)}</b>　${i.scheduledAt ? esc(fmtDate(i.scheduledAt)) : "日時未定"}${i.done ? "（実施済み）" : ""}
            ${i.memo ? `<div style="white-space:pre-wrap;margin-top:6px;color:#4a5068;">${esc(i.memo)}</div>` : ""}
          </div>`).join("") : `<p class="muted" style="font-size:12.5px;">まだ面談の予定はありません（本人の TimeRex 予約を待っています）。</p>`}
        <p class="muted" style="font-size:12px;margin:6px 0 0;">面談メモの編集は<a href="#" onclick="setDetailTab('interviews');return false;">面談タブ</a>、経過は<a href="#" onclick="setDetailTab('history');return false;">履歴タブ</a>で見られます。</p>`;
  }

  function renderDetailTab() {
    const a = detail.applicant;
    const box = el("hr-detail-tab");
    if (detailTab === "overview" && isLead(a)) {
      box.innerHTML = leadOverview(a);
    } else if (detailTab === "overview") {
      const ev = latestEvaluation();
      const evLine = ev ? (detail.evalItems || []).filter((e) => ev.scores?.[e.key])
        .map((e) => `${esc(e.label)} ${esc(scaleLabel(ev.scores[e.key]))}`).join("　") : "";
      const missing = docMissingLabels();
      box.innerHTML = `
        ${nextActionBox(a)}
        ${instructorApplication(a)}
        <dl class="hr-grid2">
          <div><dt>応募経路</dt><dd>${esc(a.source || "—")}</dd></div>
          <div><dt>応募職種</dt><dd>${esc(a.jobTitle || "—")}</dd></div>
          <div><dt>選考段階</dt><dd>${esc(a.stageLabel || "—")}</dd></div>
          <div><dt>担当</dt><dd id="hr-recruiter">${esc(a.recruiterName || "未定")}
            <button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="openRecruiterModal()">変更</button></dd></div>
          <div><dt>メール</dt><dd>${esc(a.email || "—")}</dd></div>
          <div><dt>電話</dt><dd>${esc(a.phone || "—")}</dd></div>
          <div><dt>ランク</dt><dd>${a.rank ? `<span class="hr-rank ${esc(a.rank)}">${esc(a.rank)}</span> ${esc((detail.rankLabel || {})[a.rank] || "")}` : "—"}</dd></div>
          <div><dt>最新評価</dt><dd>${ev ? `${esc(ev.kindLabel)}：${esc(ev.rank)}${evLine ? `<br><small class="muted">${evLine}</small>` : ""}` : "まだありません"}</dd></div>
          <div><dt>雇用形態</dt><dd>${esc(a.employmentType || "—")}</dd></div>
          <div><dt>入社予定日</dt><dd>${esc(a.joinDate || "—")}</dd></div>
          ${detail.salaryVisible === false ? "" : `<div><dt>給与</dt><dd>${a.wageAmount ? `${esc(a.wageType || "")} ${Number(a.wageAmount).toLocaleString("ja-JP")}円` : "—"}</dd></div>`}
          <div><dt>勤務地</dt><dd>${esc(a.workLocation || "—")}</dd></div>
        </dl>
        ${missing.length ? `<p class="muted" style="font-size:12px;margin:12px 0 0;">
          ${esc(missing.join("・"))}が未登録です。<a href="#" onclick="setDetailTab('docs');return false;">書類タブ</a>から登録できます。</p>` : ""}
        ${ceoEvalSummary(detail)}
        ${(detail.offers || []).length ? `
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">オファー（候補者へ送る条件）</h4>
        ${detail.offers.map(offerRow).join("")}` : ""}`;
    } else if (detailTab === "interviews") {
      box.innerHTML = `
        <button class="btn btn-secondary btn-sm" onclick="openScheduleForm()" style="margin-bottom:12px;">
          <span class="material-symbols-outlined icon-inline">add</span>面談を予定する</button>
        ${(detail.interviews || []).length ? detail.interviews.map(interviewRow).join("")
          : `<p class="muted">まだ面談の記録がありません。</p>`}`;
    } else if (detailTab === "docs") {
      box.innerHTML = renderDocsTab();
    } else {
      box.innerHTML = `
        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">選考タイムライン</h4>
        <div class="hr-tl">${(detail.timeline || []).map((t, i, arr) => `
          <div class="row"><div class="d">${esc(fmtDate(t.occurredAt))}${timelineWho(t) ? `<span class="who">・${esc(timelineWho(t))}</span>` : ""}</div>
            <div class="l">${esc(t.label)}${t.detail ? `　${esc(t.detail)}` : ""}${i === arr.length - 1 ? `<span class="now">← 現在</span>` : ""}</div>
          </div>`).join("") || `<p class="muted">まだ記録がありません。</p>`}</div>`;
    }
  }

  // 選考タイムラインの「誰が」。社内の操作は社員名、本人の閲覧・承諾・辞退は「本人」
  const CANDIDATE_EVENTS = ["offer_viewed", "offer_accepted", "offer_declined"];
  const timelineWho = (t) => t.actorName || (CANDIDATE_EVENTS.includes(t.eventKey) ? "本人" : "");

  // ---- 書類タブ ---------------------------------------------------------------------
  const fmtDay = (iso) => JST.date(iso);   // 日本時間の日付（js/jst.js）
  const fmtSize = (n) => (n ? (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`) : "");
  const docGroup = (type) => (docs?.documents || []).find((d) => d.docType === type) || null;

  /** 履歴書・職務経歴書のうち、まだ無いもの */
  function docMissingLabels() {
    if (!docs) return [];
    return ["resume", "work_history"].map(docGroup).filter((g) => g && !g.latest).map((g) => g.label);
  }

  function renderDocsTab() {
    if (docsError) return `<div class="banner warn"><span class="material-symbols-outlined">info</span><div>${esc(docsError)}</div></div>`;
    if (!docs) return `<p class="muted">読み込み中…</p>`;
    const main = ["resume", "work_history"].map(docGroup).filter(Boolean);
    const other = docGroup("other");
    const card = (g, d) => `
      <div class="hr-doc" data-doc="${esc(g.docType)}">
        <div class="t"><span class="material-symbols-outlined">${esc(g.icon)}</span>${esc(g.label)}</div>
        ${d ? `
          <div class="f">${esc(d.filename)}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))} アップロード${d.sizeBytes ? `・${esc(fmtSize(d.sizeBytes))}` : ""}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}${g.history.length ? `・過去の版 ${g.history.length}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
                <button onclick="openDocHistory('${esc(g.docType)}')">履歴を見る</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>` : `
          <div class="none">未登録</div>
          <div class="acts"><button class="btn btn-primary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">アップロード</button></div>`}
      </div>`;
    const others = other ? [other.latest, ...other.history].filter(Boolean) : [];
    return `
      ${main.map((g) => card(g, g.latest)).join("")}
      <div class="hr-doc" data-doc="other">
        <div class="t"><span class="material-symbols-outlined">attach_file</span>その他の書類</div>
        ${others.length ? others.map((d) => `
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
            <span class="f" style="margin:0;flex:1;min-width:160px;">${esc(d.filename)}
              <span class="m">　${esc(fmtDay(d.uploadedAt))}</span></span>
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>`).join("") : `<div class="none">未登録</div>`}
        <div class="acts"><button class="btn btn-secondary btn-sm" onclick="openUploadDoc('other')">アップロード</button></div>
      </div>
      <p class="muted" style="font-size:11.5px;margin:8px 0 0;">
        書類は採用担当・人事・管理者だけが見られます。表示用のリンクは数分で切れます。</p>`;
  }

  function toggleDocMenu(ev, id) {
    ev.stopPropagation();
    const m = el(`docmenu-${id}`);
    const open = m && m.classList.contains("hidden");
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
    if (m && open) m.classList.remove("hidden");
  }
  document.addEventListener("click", () => {
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
  });

  const findDoc = (id) => (docs?.documents || []).flatMap((g) => [g.latest, ...g.history]).find((d) => d && d.id === id);

  // プレビューは別タブの書類専用ページ（hr/document.html）で開く。
  // この画面の中には PDF を出さない（ドロワー・一覧・スクロール位置・選考の状態はそのまま）。
  // 別タブ側で、採用HRの権限を確かめてから短時間の signed URL を取り直す（公開URLにしない）
  function previewDoc(id) {
    const d = findDoc(id);
    const applicantId = d?.applicantId || detail?.applicant?.id;
    const url = `/hr/document.html?applicant=${encodeURIComponent(applicantId || "")}&doc=${encodeURIComponent(id)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }
  async function downloadDoc(id) {
    try { window.open((await API.hrDocumentUrl(id, true)).url, "_blank", "noopener"); }
    catch (e) { alert(e.hint || e.message || "保存できませんでした"); }
  }

  // 書類のアップロード（中央モーダル）。差し替えも同じ（前の版は履歴に残る）
  let docFile = null;
  function openUploadDoc(type) {
    docFile = null;
    const types = docs?.types || [{ key: "resume", label: "履歴書" }, { key: "work_history", label: "職務経歴書" }, { key: "other", label: "その他" }];
    const replacing = type !== "other" && docGroup(type)?.latest;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${replacing ? "書類を差し替え" : "書類をアップロード"}</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん</p>
      <label>書類の種類</label>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;">${types.map((t) => `
        <label style="display:flex;gap:5px;align-items:center;font-weight:500;margin:0;">
          <input type="radio" name="doc-type" value="${esc(t.key)}" ${t.key === (type || "resume") ? "checked" : ""}
                 style="width:auto;margin:0;">${esc(t.label)}</label>`).join("")}</div>
      <div class="hr-drop" id="doc-drop" onclick="el('doc-file').click()">
        <span class="material-symbols-outlined" style="font-size:28px;">upload_file</span>
        <div id="doc-drop-text">ここにファイルをドラッグ、または押して選択</div>
        <div style="font-size:11.5px;margin-top:4px;">PDF・DOC・DOCX・JPG・PNG／10MBまで</div>
      </div>
      <input id="doc-file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="hidden" onchange="pickDocFile(this.files[0])">
      ${replacing ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">いまのファイルは「履歴」に残ります。</p>` : ""}
      <div id="doc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" id="doc-save" onclick="submitUploadDoc(this)">アップロード</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`, { wide: true });
    const drop = el("doc-drop");
    ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => pickDocFile(e.dataTransfer?.files?.[0]));
  }

  const DOC_MIME = ["application/pdf", "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "image/jpeg", "image/png"];
  function pickDocFile(f) {
    const msg = el("doc-msg");
    msg.textContent = "";
    docFile = null;
    if (!f) return;
    const max = docs?.limits?.maxBytes || 10 * 1024 * 1024;
    if (!DOC_MIME.includes(f.type)) { msg.textContent = "PDF・Word（.doc / .docx）・JPEG・PNG を選んでください"; return; }
    if (f.size > max) { msg.textContent = "ファイルは10MBまでにしてください"; return; }
    docFile = f;
    el("doc-drop-text").textContent = `${f.name}（${fmtSize(f.size)}）`;
  }

  async function submitUploadDoc(btn) {
    const msg = el("doc-msg");
    msg.textContent = "";
    if (!docFile) { msg.textContent = "ファイルを選んでください"; return; }
    const type = document.querySelector('input[name="doc-type"]:checked')?.value || "other";
    try {
      await KPLayout.busy(btn, "アップロード中…", () => API.uploadHrDocument(detail.applicant.id, type, docFile));
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "アップロードできませんでした"; }
  }

  function openDocHistory(type) {
    const g = docGroup(type);
    if (!g) return;
    const list = [g.latest, ...g.history].filter(Boolean);
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${esc(g.label)}の履歴</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん・新しい順</p>
      ${list.map((d, i) => `
        <div class="hr-doc" style="margin-bottom:8px;">
          <div class="f" style="margin:0;">${esc(d.filename)} ${i === 0 ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;">いまの版</span>` : ""}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
          </div>
        </div>`).join("")}
      <div style="margin-top:14px;"><button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`, { wide: true });
  }

  // 削除は確認モーダルを挟む（一覧に赤い削除ボタンを常に置かない）
  function confirmDeleteDoc(id) {
    const d = findDoc(id);
    if (!d) return;
    el("confirm-root").innerHTML = `<div class="hr-modal-bg top" onclick="closeConfirm()"></div>
      <div class="hr-modal top" role="alertdialog" aria-modal="true">
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">書類を削除しますか？</h2>
        <p class="hr-sub" style="margin:0 0 6px;">${esc(d.docTypeLabel)}：${esc(d.filename)}</p>
        <p class="muted" style="font-size:12px;margin:0 0 14px;">ファイルは元に戻せません。過去の版があれば、1つ前の版がいまの版になります。</p>
        <div id="del-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" style="background:#b3261e;" onclick="submitDeleteDoc('${esc(id)}', this)">削除する</button>
          <button class="btn btn-secondary" onclick="closeConfirm()">やめる</button>
        </div>
      </div>`;
  }
  function closeConfirm() { el("confirm-root").innerHTML = ""; }
  async function submitDeleteDoc(id, btn) {
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteHrDocument(id));
      closeConfirm();
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { el("del-msg").textContent = e.hint || e.message || "削除できませんでした"; }
  }

  function interviewRow(i) {
    const scoreLine = (detail.evalItems || []).filter((e) => i.scores?.[e.key])
      .map((e) => `${esc(e.label)}：${esc(scaleLabel(i.scores[e.key]))}`).join("　");
    // 実施済み・キャンセル済みではない＝いま動かせる面談だけ、面談情報の編集・キャンセルを出す
    const pending = !i.done && !i.canceled;
    // TimeRex 連携済みの面談は TimeRex を正とする。日程変更・取消は TimeRex の導線から（HR で日時を直さない）
    const tr = i.timerex;
    return `
      <div class="card" style="margin-bottom:10px;${i.canceled ? "opacity:.6;" : ""}">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">${esc(i.kindLabel)}
          ${i.rank ? `<span class="hr-rank ${esc(i.rank)}" style="margin-left:6px;">${esc(i.rank)}</span>` : ""}
          ${pending ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;margin-left:6px;">予定</span>` : ""}
          ${i.canceled ? `<span class="hr-pill" style="background:#efefeb;color:#6b7080;margin-left:6px;">キャンセル済み</span>` : ""}
          ${tr ? `<span class="hr-pill hr-timerex" style="background:#e6f4ea;color:#256b36;margin-left:6px;">TimeRex連携済み</span>` : ""}
          ${i.meetingUrl && pending ? `<span class="muted" style="font-size:11.5px;font-weight:500;margin-left:6px;">Google Meet</span>` : ""}</div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">
          ${i.done ? `実施：${esc(fmtDate(i.conductedAt))}`
            : i.canceled ? `予定していた日時：${esc(fmtDate(i.scheduledAt))}（${esc(fmtDate(i.canceledAt))}にキャンセル）`
            : `予定：${esc(fmtDate(i.scheduledAt))}`}
          ${i.interviewerName ? `　面談担当：${esc(i.interviewerName)}` : ""}
          ${i.methodLabel ? `　面談方法：${esc(i.methodLabel)}` : ""}</div>
        ${scoreLine ? `<div style="font-size:12px;margin-top:4px;">${scoreLine}</div>` : ""}
        ${i.recommendReason ? `<div style="font-size:12.5px;margin-top:6px;">${esc(i.recommendReason)}</div>` : ""}
        ${i.notes ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">${esc(i.notes)}</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
          ${pending && i.meetingUrl ? `<a href="${esc(i.meetingUrl)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">面談に参加</a>` : ""}
          ${pending ? `<button class="btn btn-primary btn-sm" onclick="conductInterview('${esc(i.id)}')">実施済みにする</button>` : ""}
          ${pending ? `<button class="btn btn-secondary btn-sm" onclick="openRescheduleModal('${esc(i.id)}')">面談情報を編集</button>` : ""}
          ${pending && !tr ? `<button class="btn btn-secondary btn-sm" onclick="openCancelInterviewModal('${esc(i.id)}')">面談をキャンセル</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="reschedule" onclick="openTimerexReschedule('${esc(i.id)}')">日程変更</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="cancel" onclick="openTimerexCancel('${esc(i.id)}')">取消</button>` : ""}
          ${i.done && !i.rank && i.kind !== "ceo"

  // ---- 面談メモ（db/109。その面談に紐づくメモ。応募者全体のメモとは別） ---------------

  const METHODS = [["", "（未設定）"], ["online", "オンライン"], ["onsite", "対面"], ["phone", "電話"]];

  // 面談キャンセルは応募者を削除しない・面談履歴も物理削除しない（README §3・§6）。

  // ---- NEXT ACTIONのボタン --------------------------------------------------------
  function targetInterview(action) {
    const list = detail.interviews || [];
    // NEXT ACTION が指す面談は API が決める（nextInterviewId）。未完了の先頭を推測で探さない
    // （古いカジュアル面談と社長面談が両方残っていても、いまの段階の面談だけを実施済みにする）
    if (action === "conduct") return list.find((i) => i.id === detail.applicant.nextInterviewId) || null;
    if (action === "evaluate") return list.find((i) => i.done && !i.rank) || list[0] || null;
    return null;
  }

  function runNextAction() {
    // 画面に出している NEXT ACTION と同じもの（判断済み・本人へ未連絡なら「本人へ連絡」）
    const a = withContactAction(detail.applicant);
    const key = a.nextActionKey;
    if (key === "sendSchedulingLink") return openSendSchedulingForm();
    if (key === "leadNextAction") return openLeadNextActionForm();
    if (key === "schedule") return openScheduleForm(a.nextActionKind);
    // 実施する面談が無い（NEXT ACTION は「面談タブを確認」と出している）ときは、面談タブへ
    if (key === "conduct" && !a.nextInterviewId) return setDetailTab("interviews");
    if (key === "conduct") {
      // 実施する面談は API が決めたもの（nextInterviewId）だけ。見つからなくても「面談を予定する」は開かない
      const iv = targetInterview("conduct");
      return iv ? conductInterview(iv.id) : showNoInterviewToConduct();
    }
    if (key === "checkInterviews") return setDetailTab("interviews");
    if (key === "evaluate") {
      const iv = targetInterview("evaluate");
      return iv ? openEvaluateForm(iv.id) : null;
    }
    if (key === "recommend") return openRecommendForm();
    if (key === "advance") return startAdvance();
    if (key === "reject") return confirmDecisionMove("reject");
    if (key === "decide") return openDecideForm();
    if (key === "contact") return openContactForm(a.id, a.decision);
    if (key === "chooseOfferType") return offerTypeReady ? openOfferTypeModal() : openOfferForm();
    if (key === "createOffer" || key === "reviewOffer") return openOfferForm();
    if (key === "sendOffer" || key === "reissueOffer") return openSendOfferForm();
  }
