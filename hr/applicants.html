  function openActionModal(html, { wide = false } = {}) {
    el("action-root").innerHTML = `<div class="hr-modal-bg" onclick="closeAction()"></div>
      <div class="hr-modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  }
  function closeAction() { el("action-root").innerHTML = ""; }

  async function submitSchedule(btn) {
    const msg = el("iv-msg"); msg.textContent = "";
    const when = el("iv-when").value;
    const kind = el("iv-kind").value;
    const meetingUrl = el("iv-url").value.trim();
    if (kind === "casual" && !meetingUrl) { msg.textContent = "カジュアル面談は面談URLを入力してください"; return; }
    if (meetingUrl && !/^https?:\/\//i.test(meetingUrl)) { msg.textContent = "面談URLは http:// または https:// で始めてください"; return; }
    const materialIds = [...document.querySelectorAll('input[name="iv-material"]:checked')].map((x) => x.value);
    const memo = el("iv-memo").value.trim();
    try {
      const out = await KPLayout.busy(btn, "保存中…", () => API.scheduleHrInterview({
        applicantId: detail.applicant.id, kind,
        scheduledAt: when ? JST.fromInput(when) : undefined,
        interviewerId: el("iv-who").value || undefined,
        method: el("iv-method").value || undefined,
        meetingUrl: meetingUrl || undefined,
      }));
      if (out?.interview?.id && detail.materialsReady) {
        await API.api('/api/hr/interview-materials', { method:'PUT', body:{ interviewId:out.interview.id, materialIds } });
      }
      if (out?.interview?.id && memo) await API.hrInterviewAct({ id:out.interview.id, action:"memo", memo });
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "予定できませんでした"; }
  }

  // ---- 評価を入力（右ドロワー） ----------------------------------------------------
  //
  // 短時間で入力できるように、長いフォームにしない（5項目＋自由記述は3つだけ）
  function openEvaluateForm(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    const items = detail.evalItems || [];
    const scale = detail.evalScale || [];
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">評価を入力</h2>
        <p class="hr-sub" style="margin:0 0 14px;">${esc(iv.kindLabel)}</p>
        ${items.map((it) => `
          <label style="margin-top:8px;">${esc(it.label)}</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${scale.map((s) => `
              <label class="hr-chip" style="cursor:pointer;">
                <input type="radio" name="ev-${esc(it.key)}" value="${esc(s.key)}"
                       ${iv.scores?.[it.key] === s.key ? "checked" : ""} style="width:auto;margin:0 4px 0 0;">${esc(s.label)}
              </label>`).join("")}
          </div>`).join("")}
        <label style="margin-top:14px;">ランク <span style="color:#b3261e;">*</span></label>
        <select id="ev-rank">
          <option value="">（選ぶ）</option>
          ${(detail.ranks || []).map((r) =>
            `<option value="${esc(r)}" ${iv.rank === r ? "selected" : ""}>${esc(r)}：${esc((detail.rankLabel || {})[r] || "")}</option>`).join("")}
        </select>
        <label style="margin-top:10px;">良かった点・推薦理由</label>
        <input id="ev-reason" type="text" value="${esc(iv.recommendReason || "")}">
        <label style="margin-top:10px;">気になる点・次に確認したいこと</label>
        <textarea id="ev-notes" rows="3">${esc(iv.notes || "")}</textarea>
        <label style="margin-top:10px;">次回確認事項の期限（任意）</label>
        <input id="ev-due" type="date" value="${esc(iv.nextDueOn || "")}">
        <div id="ev-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitEvaluate('${esc(id)}', this)">保存する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  async function submitEvaluate(id, btn) {
    const msg = el("ev-msg"); msg.textContent = "";
    const rank = el("ev-rank").value;
    if (!rank) { msg.textContent = "ランクを選んでください"; return; }
    const scores = {};
    for (const it of detail.evalItems || []) {
      const picked = document.querySelector(`input[name="ev-${it.key}"]:checked`);
      if (picked) scores[it.key] = picked.value;
    }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.evaluateHrInterview({
        id, scores, rank,
        recommendReason: el("ev-reason").value.trim() || undefined,
        notes: el("ev-notes").value.trim() || undefined,
        nextDueOn: el("ev-due").value || undefined,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ---- 合格通知を作成・確認（右ドロワー） --------------------------------------------
  // Stage 5：作成→社内確認→確定（本人送付待ち）まで。本人への実際の送付はStage 6
  const OFFER_STATUS_LABEL = {
    none: "—", draft: "作成中", sent: "送付済み", viewed: "閲覧済み", accepted: "承諾", declined: "辞退",
    revoked: "無効化", expired: "期限切れ",
  };
  function offerRow(o) {
    // 区分つきは、本人の承諾＝条件承諾済み（正式契約は LegalSign。承諾した版・日時・承諾記録がこの行に残る）
    const accepted = o.offerType && o.status === "accepted";
    const label = !accepted ? (OFFER_STATUS_LABEL[o.status] || o.status)
      : o.handoffAt ? "Office引き渡し済み" : o.formalSignedAt ? "正式契約済み" : o.formalSentAt ? "正式契約待ち" : "条件承諾済み";
    const canPdf = detail.salaryVisible !== false && o.docsReady;
    return `
      <div class="card hr-offer-card" style="margin-bottom:10px;" data-offer="${esc(o.id)}">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">第${o.version}版${o.offerType ? `　${esc(o.offerName || "")}` : ""}
          <span class="hr-pill" data-offer-state style="background:${accepted ? "#e5f1e2;color:#2f6f3a" : "#e7eaf3;color:#1b2440"};margin-left:6px;">${esc(label)}</span></div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">回答期限：${esc(o.respondBy || "—")}
          ${o.sentAt ? `　送付：${esc(fmtDate(o.sentAt))}` : ""}
          ${o.viewedAt ? `　閲覧：${esc(fmtDate(o.viewedAt))}` : ""}
          ${o.acceptedAt ? `　${accepted ? "条件承諾" : "承諾"}：${esc(fmtDate(o.acceptedAt))}` : ""}
          ${o.formalSentAt ? `　正式契約の案内：${esc(fmtDate(o.formalSentAt))}` : ""}
          ${o.formalSignedAt ? `　正式契約済み：${esc(fmtDate(o.formalSignedAt))}` : ""}
          ${o.declinedAt ? `　辞退：${esc(fmtDate(o.declinedAt))}` : ""}</div>
        ${canPdf && (o.noticePdf || o.acceptedPdf || (accepted && o.noticePdf)) ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
          ${o.noticePdf ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="openOfferPdf('${esc(o.id)}', 'notice', this)">${esc(o.noticeTitle || "条件通知書")}（PDF）</button>` : ""}
          ${accepted && o.noticePdf ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="openOfferPdf('${esc(o.id)}', 'accepted', this)">承諾済みPDF（電子承諾記録つき）</button>` : ""}
        </div>` : ""}
        ${accepted && o.offerType ? `<div class="muted" style="font-size:11.5px;margin-top:4px;" data-offer-formal>正式契約（LegalSign）：${o.formalRequired === false ? "不要" : "必要"}${o.handoffAt ? `　Office へ引き渡し：${esc(fmtDate(o.handoffAt))}` : ""}</div>` : ""}
        ${accepted && o.docsReady && o.formalRequired !== false && !o.formalSignedAt ? `<button class="btn btn-secondary btn-sm" style="margin-top:6px;padding:2px 10px;" onclick="openFormalContract()">正式契約（LegalSign）</button>` : ""}
        ${o.messageToCandidate ? `<div style="font-size:12px;margin-top:4px;">${esc(o.messageToCandidate)}</div>` : ""}
        ${o.declineReason ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">辞退理由：${esc(o.declineReason)}</div>` : ""}
      </div>`;
  }

  // いま有効な（無効化されていない）最新の合格通知。版は新しい順に並んでいる
  function currentOffer() {
    const list = detail.offers || [];
    return list.find((o) => o.status !== "revoked") || null;
  }

  // ---- 採用区分を選ぶ（合格後。区分を選ぶと、その区分のオファーの入力へ進む） ------------------
  let pickOfferType = null;
  function openOfferTypeModal() {
    const a = detail.applicant;
    pickOfferType = a.offerType || null;
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">この方をどの形で迎えますか？</h2>
        <p class="hr-sub" style="margin:0 0 12px;">${esc(a.name)}さん　選んだ区分に必要な項目だけで、オファー（候補者へ送る条件）を作ります。</p>
        <div id="ot-cards">${offerTypeCards(pickOfferType, "pickModalOfferType")}</div>
        <div id="ot-msg" class="err-text" style="margin:10px 0 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="ot-save" onclick="submitOfferType(this)">この区分で進む</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }
  function pickModalOfferType(key) {
    pickOfferType = key;
    el("ot-cards").innerHTML = offerTypeCards(pickOfferType, "pickModalOfferType");
  }
  async function submitOfferType(btn) {
    const msg = el("ot-msg"); msg.textContent = "";
    if (!pickOfferType) { msg.textContent = "採用区分を選んでください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({ id: detail.applicant.id, offerType: pickOfferType }));
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; return; }
    closeAction();
    await refreshDetail();
    load();
    openOfferForm();   // 続けて、その区分の条件を入れる
  }

  // ---- オファー（候補者へ送る条件）を作る → 内容を確認してメールで送る ------------------------------
  // 候補者ごとの差分だけ入力する（オファー作成・メール送信・同意完結 UI/UX改善仕様）。
  //   ・通常表示は区分ごとの4〜6項目だけ。ほかは［詳細設定を開く］の中（閉じた状態）
  //   ・よく使う値は既定で入る（業務委託の更新・支払条件・NDA、育成コースの期間、回答期限＝送る日から3日後）
  //   ・選択肢が少ないもの（報酬の区分・パート/アルバイト・NDA など）はボタン
  //   ・業務内容は標準文を選んで、そのまま直せる
  // 項目・既定値・標準文の定義はサーバー（lib/hr-offer-types.js）が正。画面は受け取ったものを並べるだけ
  let offerFormType = null;
  let offerPay = "";            // 報酬のボタンで選んだ値（"__none" は育成の［なし］）
  const PAY_NONE = "__none";
  const jstYmd = (days = 0) => JST.ymd(new Date(Date.now() + days * 86400000));   // 日本の日付（今日から days 日後）
  const RESPOND_DAYS = 3;       // 回答期限の既定：送る日から3日後（lib/hr-offer-types.js RESPOND_DAYS と同じ）

  function openOfferForm() {
    const a = detail.applicant;
    const reviewing = a.status === "offer_review_pending";
    const o = reviewing ? currentOffer() : null;
    const t = offerTypeDef(reviewing ? o?.offerType : a.offerType);
    if (!t) { offerFormType = null; return openLegacyOfferForm(); }
    offerFormType = t;
    const hideSalary = detail.salaryVisible === false;
    const terms = o?.offerTerms || {};
    // 既存の値：下書きはその版の値、作成時は応募者に入っている条件と既定値（区分の選択肢に無い値は入れない）
    const valueOf = (f) => {
      let raw = f.term ? terms[f.key] : (o ? o[f.key] : a[f.key]);
      if ((raw == null || raw === "") && !o && f.value != null) raw = f.value;
      if (raw == null) return "";
      if (f.kind === "select" && !(f.options || []).includes(raw)) return "";
      return raw;
    };
    // 報酬：ボタンの選択と金額。給与区分が区分の選択肢に無ければ、金額も持ち込まない（「月給 30万円」を「時給」にしない）
    const pay = t.pay || null;
    const wageF = t.fields.find((f) => f.key === "wageType");
    const wageType = wageF ? valueOf(wageF) : "";
    const noneKey = pay?.none?.key;
    offerPay = pay?.fixed ? pay.fixed : (noneKey && terms[noneKey] === pay.none.no) ? PAY_NONE : wageType || "";
    const amountF = t.fields.find((f) => f.key === "wageAmount");
    const amount = amountF && (wageType || (pay?.fixed && (o ? o.wageType : a.wageType) === pay.fixed)) ? valueOf(amountF) : "";

    const shown = (f) => !f.hidden && !(f.salary && hideSalary);
    const basic = t.fields.filter((f) => f.basic && shown(f));
    const more = t.fields.filter((f) => !f.basic && shown(f));
    const respondBy = o?.respondBy && o.respondBy >= jstYmd(0) ? o.respondBy : jstYmd(RESPOND_DAYS);
    const canChangeType = !reviewing && a.status === "offer_draft_pending";
    const fieldHtml = (f) => (f.key === "wageAmount" ? (pay ? payControl(t, amount) : "") : offerFieldHtml(f, valueOf(f)));
    // 社労士の正式PDFで進めるか（db/139）。確定すると社労士への依頼へ進む（HR の条件通知書は依頼用の条件案）
    const official = officialFormMode(a, t);
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">${esc(t.offerName)}を${reviewing ? "確認" : "作成"}</h2>
        <p class="hr-sub" style="margin:0 0 12px;">採用区分：<b id="of-type" data-otype="${esc(t.key)}">${esc(t.label)}</b>
          ${canChangeType ? `<button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="closeAction();openOfferTypeModal()">区分を変える</button>` : ""}
          　候補者には「${esc(t.offerName)}」として届きます（社内の状態や評価は見えません）。</p>
        <div class="hr-of-grid" id="of-fields" data-otype="${esc(t.key)}">
          ${basic.map(fieldHtml).join("")}
          <div data-field="respondBy"><label for="of-respondby">回答期限 <span style="color:#b3261e;">*</span></label>
            <input id="of-respondby" type="date" value="${esc(respondBy)}">
            <div class="hr-of-auto">送る日から${RESPOND_DAYS}日後（自動）。必要なときだけ変えてください</div></div>
          ${t.key === "training" ? `<div class="wide hr-of-auto" id="of-auto-note"></div>` : ""}
        </div>
        ${hideSalary && t.fields.some((f) => f.salary) ? `
        <p class="hr-sub" style="margin:10px 0 0;">給与・報酬は、権限のある方が入力・確認します（応募者に入っている条件が、そのままオファーに入ります）。</p>` : ""}
        <details class="hr-of-more" id="of-more">
          <summary><span class="when-closed">詳細設定を開く</span><span class="when-open">詳細設定を閉じる</span></summary>
          <div class="hr-of-grid" id="of-more-fields">
            ${groupedFieldsHtml(more, fieldHtml, formalControlHtml(t, o))}
            <div class="wide"><label for="of-message">本人向けメッセージ</label>
              <textarea id="of-message" rows="3">${esc(o?.messageToCandidate || "")}</textarea></div>
          </div>
          <div class="hr-of-docs" style="margin:12px 0 0;"><b>この区分の流れ</b>　${esc((t.flow || []).join(" → "))}<br><b>必要書類</b>　${esc((t.documents || []).join("・"))}</div>
        </details>
        ${official ? `<p class="hr-sub" id="of-official-note" style="margin:10px 0 0;">確定すると、${esc(official.attorney)}へ正式な${esc(official.docName)}の作成を依頼する段階へ進みます。
          HR の条件通知書PDFは、依頼のときの<b>条件案</b>です（本人へは送りません。本人へは社労士の正式PDFを送ります）。</p>` : ""}
        <div id="of-msg" class="err-text" style="margin:10px 0 0;"></div>
        <div class="hr-of-actions">
          <button class="btn btn-secondary" id="of-draft" onclick="submitOffer(this)">下書き保存</button>
          ${official
            ? `<button class="btn btn-primary" id="of-confirm" onclick="submitOfferAndConfirm(this)">条件を確定する</button>`
            : `<button class="btn btn-primary" id="of-send" onclick="submitOfferAndSend(this)">PDFをプレビュー</button>`}
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
    offerAutoFill({ init: true });
    offerShowIf();
  }

  /** オファー入力を、社労士の正式PDFの流れ（条件を確定 → 社労士へ依頼）で出すか。null ならこれまでどおり */
  function officialFormMode(a, t) {
    const types = detail.contract?.types || [];
    const on = a.contractState === "conditions"
      || (detail.contract?.ready && a.status === "offer_draft_pending" && types.includes(t?.key));
    if (!on) return null;
    const emp = ["executive_employee", "part_time"].includes(t?.key);
    return { attorney: emp ? "社労士" : "社労士・法務", docName: emp ? "労働条件通知書（雇用契約書）" : "業務委託契約書（条件通知書）" };
  }

  // ［条件を確定する］（社労士の正式PDFで進める人）：下書きとして保存し、確定する → 書類タブの「契約手続き」へ
  async function submitOfferAndConfirm(btn) {
    const msg = el("of-msg"); msg.textContent = "";
    const t = offerFormType;
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    if (respondBy < jstYmd(0)) { msg.textContent = "回答期限が過ぎています。今日以降の日付にしてください"; return; }
    const missing = t.fields.filter((f) => f.required && el(`of-f-${f.key}`) && !String(el(`of-f-${f.key}`).value || "").trim()).map((f) => f.label);
    if (missing.length) { msg.textContent = `次の項目を入力してください：${missing.join("・")}`; return; }
    if (el("of-f-wageAmount") && offerPay && offerPay !== PAY_NONE && !el("of-f-wageAmount").value) {
      msg.textContent = `${payUnitLabel(offerPay)}の金額を入力してください`; return;
    }
    const fields = offerFields();
    try {
      await KPLayout.busy(btn, "確定中…", async () => {
        const offer = detail.applicant.status === "offer_review_pending"
          ? (await API.updateHrOffer({ id: currentOffer().id, ...fields, respondBy })).offer
          : (await API.createHrOffer({ applicantId: detail.applicant.id, ...fields, respondBy })).offer;
        await API.hrOfferAct({ id: offer.id, action: "confirm" });
      });
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "確定できませんでした"; return; }
    closeAction();
    await refreshDetail("docs");
    load();
    setTimeout(() => el("hr-contract")?.scrollIntoView({ block: "start" }), 0);
  }

  /**
   * 正式契約（LegalSign）の 必要／不要（db/133）。区分の既定（育成枠は不要で、選ばせない）から始めて、オファーごとに決める。
   * 送ったあとは変えられない（条件通知書PDFに、正式契約の有無を書いて送るため）
   */
  function formalControlHtml(t, o) {
    if (t.key === "training") return `<input type="hidden" id="of-formal" value="0">`;
    const v = (o && typeof o.formalRequired === "boolean" ? o.formalRequired : t.formalDefault !== false) ? "1" : "0";
    return `<div class="wide" data-field="formal"><label>正式契約（LegalSign）</label>
      ${segHtml("of-formal", [{ value: "1", label: "必要" }, { value: "0", label: "不要" }], v, { label: "正式契約（LegalSign）" })}
      <input type="hidden" id="of-formal" value="${v}">
      <div class="hr-of-auto">「必要」なら、本人の条件承諾のあと LegalSign で正式契約をしてから Office へ引き渡します。
        「不要」なら、条件承諾のあと${esc(t.nextStep || "次の手続き")}へ進みます（条件通知書にも書きます）。送ったあとは変えられません。</div></div>`;
  }

  /** ボタンの並び（選択肢が少ないもの）。押すと target（hidden の入力、または報酬）に値が入る */
  function segHtml(target, opts, v, { clear = false, label = "" } = {}) {
    return `<div class="hr-opt" role="radiogroup" aria-label="${esc(label)}" data-target="${esc(target)}" data-clear="${clear ? 1 : 0}">${opts.map((op) => `
      <button type="button" role="radio" aria-checked="${op.value === v}" class="${op.value === v ? "on" : ""}"
        data-v="${esc(op.value)}" onclick="pickSeg(this)">${esc(op.label)}</button>`).join("")}</div>`;
  }
  function pickSeg(btn) {
    const box = btn.parentElement;
    const off = btn.classList.contains("on") && box.dataset.clear === "1";   // 必須でなければ、もう一度押すと外れる
    box.querySelectorAll("button").forEach((b) => {
      const on = !off && b === btn;
      b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on));
    });
    const v = off ? "" : btn.dataset.v;
    if (box.dataset.target === "pay") return setOfferPay(v);
    el(box.dataset.target).value = v;
    offerShowIf();
  }

  /** 1項目の入力欄（報酬は payControl） */
  function offerFieldHtml(f, v) {
    const id = `of-f-${f.key}`;
    const req = f.required ? ` <span style="color:#b3261e;">*</span>` : "";
    const recommended = f.documentRecommended && !f.required
      ? ` <span style="font-size:10px;color:#7d5a00;background:#fbf1d6;border-radius:999px;padding:1px 6px;">確認推奨</span>` : "";
    const unit = f.kind === "number" && f.unit ? `（${esc(f.unit)}）` : "";
    const auto = f.auto || f.key === "trainingPeriod";
    let ctl;
    if (f.presets) {
      // 育成コース：コースを選ぶ（その他は名前を入れる）。コースを選ぶと、期間と評価日が自動で入る
      const known = f.presets.some((p) => p.label === v);
      const other = Boolean(v) && !known;
      ctl = `<select id="${id}-pick" onchange="pickPreset('${esc(f.key)}')">
          <option value="">（選択）</option>${f.presets.map((p) => `<option value="${esc(p.label)}" ${p.label === v ? "selected" : ""}>${esc(p.label)}</option>`).join("")}
          <option value="__other" ${other ? "selected" : ""}>その他</option></select>
        <input id="${id}" type="text" value="${esc(v)}" placeholder="コース名" ${other ? "" : "hidden"} style="margin-top:6px;" oninput="offerAutoFill()">`;
    } else if (f.kind === "select" && (f.options || []).length <= 3 && f.ui !== "select") {
      ctl = `${segHtml(id, f.options.map((x) => ({ value: x, label: x })), v, { clear: !f.required, label: f.label })}
        <input type="hidden" id="${id}" value="${esc(v)}">`;
    } else if (f.kind === "select") {
      // ui:"select" は選択肢が少なくてもプルダウン（契約手続きの区分：雇用期間・勤務地の種別・働き方）
      ctl = `<select id="${id}" onchange="offerShowIf()"><option value="">（選択）</option>${f.options.map((op) =>
        `<option value="${esc(op)}" ${op === v ? "selected" : ""}>${esc(op)}</option>`).join("")}</select>`;
    } else if (f.kind === "textarea") {
      const tpl = f.templates ? `<div class="hr-tpl" aria-label="標準文">${f.templates.map((x) =>
        `<button type="button" onclick="applyDutyTemplate('${esc(f.key)}', '${esc(x.key)}')">${esc(x.label)}</button>`).join("")}</div>` : "";
      ctl = `${tpl}<textarea id="${id}" rows="${f.basic ? 2 : 3}" placeholder="${esc(f.placeholder || (f.templates ? "標準文を選ぶか、入力してください" : ""))}">${esc(v)}</textarea>`;
    } else {
      const type = f.kind === "number" ? "number" : f.kind === "date" ? "date" : "text";
      const watch = f.key === "joinDate" || auto ? ` oninput="${auto ? "this.dataset.auto='0';" : ""}offerAutoFill()"` : "";
      ctl = `<input id="${id}" type="${type}" ${f.kind === "number" ? 'step="any" min="0"' : ""} value="${esc(v)}"
        placeholder="${esc(f.placeholder || (auto ? "自動で入ります" : ""))}"${watch}>`;
    }
    // showIf：その項目がその値のときだけ出す（雇用期間「期間の定めあり」→ 終了日）
    const showIf = f.showIf ? ` data-show-if="${esc(f.showIf.key)}" data-show-if-value="${esc(f.showIf.value)}"` : "";
    return `<div class="${f.kind === "textarea" ? "wide" : ""}" data-field="${esc(f.key)}"${showIf}>
      <label for="${f.presets ? `${id}-pick` : id}">${esc(f.label)}${unit}${req}${recommended}</label>${ctl}</div>`;
  }
  /** showIf の項目を、いまの選択に合わせて出す・隠す */
  function offerShowIf() {
    for (const box of document.querySelectorAll("#action-root [data-show-if]")) {
      box.hidden = (el(`of-f-${box.dataset.showIf}`)?.value || "") !== box.dataset.showIfValue;
    }
  }
  // 詳細設定の並び（基本情報／勤務条件／給与・報酬／契約条件／その他）。どれにも入らない項目は「その他」
  const OFFER_GROUPS = [
    { key: "work", label: "勤務条件", keys: ["workplaceType", "workStyle", "workDays", "workHours", "weeklyHours", "breakTime", "holidays", "overtime", "workLocationChange", "implementationMethod"] },
    { key: "pay", label: "給与・報酬", keys: ["wagePayment", "allowances", "commuteCost", "incentive", "paymentTerms", "expenseHandling", "compensationScope"] },
    { key: "contract", label: "契約条件", keys: ["probationMonths", "contractPeriod", "contractEndDate", "renewal", "terminationRule", "cancellationPolicy", "nda"] },
  ];
  function groupedFieldsHtml(fields, fieldHtml, extraContract = "") {
    const used = new Set();
    const parts = OFFER_GROUPS.map((g) => {
      const fs = fields.filter((f) => g.keys.includes(f.key));
      fs.forEach((f) => used.add(f.key));
      const extra = g.key === "contract" ? extraContract : "";
      if (!fs.length && !extra) return "";
      return `<h4 class="hr-of-group wide" data-group="${g.key}">${g.label}</h4>${fs.map(fieldHtml).join("")}${extra}`;
    });
    const rest = fields.filter((f) => !used.has(f.key));
    return `${parts.join("")}${rest.length ? `<h4 class="hr-of-group wide" data-group="other">その他</h4>${rest.map(fieldHtml).join("")}` : ""}`;
  }

  /** 報酬：区分のボタン（[なし][時給][月額] など）＋金額。パート・アルバイトは時給だけ（区分を選ばせない） */
  function payControl(t, amount) {
    const pay = t.pay;
    const input = `<input id="of-f-wageAmount" type="number" min="0" step="1" inputmode="numeric" value="${esc(amount)}" aria-label="金額">`;
    if (pay.fixed) {
      return `<div data-field="pay"><label for="of-f-wageAmount">${esc(pay.label)}</label>
        <div class="hr-yen" id="of-pay-amount"><span id="of-pay-unit">${esc(pay.fixed)}</span>${input}<span>円</span></div></div>`;
    }
    const opts = [...(pay.none ? [{ value: PAY_NONE, label: pay.none.label }] : []), ...pay.buttons];
    // これまでの版の値（いまのボタンに無い。例：月額固定）は、選ばれた状態で残す
    if (offerPay && offerPay !== PAY_NONE && !opts.some((x) => x.value === offerPay)) opts.push({ value: offerPay, label: offerPay });
    const showAmount = offerPay && offerPay !== PAY_NONE;
    return `<div class="wide" data-field="pay"><label>${esc(pay.label)}</label>
      ${segHtml("pay", opts, offerPay, { clear: true, label: pay.label })}
      <div class="hr-yen" id="of-pay-amount" ${showAmount ? "" : "hidden"}><span id="of-pay-unit">${esc(payUnitLabel(offerPay))}</span>${input}<span>円</span></div></div>`;
  }
  const payUnitLabel = (v) => (offerFormType?.pay?.buttons || []).find((b) => b.value === v)?.label || v || "";
  function setOfferPay(v) {
    offerPay = v;
    const show = Boolean(v) && v !== PAY_NONE;
    el("of-pay-amount").hidden = !show;
    if (show) { el("of-pay-unit").textContent = payUnitLabel(v); el("of-f-wageAmount").focus(); }
  }

  /** 業務内容の標準文を入れる（入っている文章は置き換える。「その他」は空にして入力へ） */
  function applyDutyTemplate(key, tplKey) {
    const f = offerFormType?.fields.find((x) => x.key === key);
    const tpl = f?.templates?.find((x) => x.key === tplKey);
    const box = el(`of-f-${key}`);
    if (!tpl || !box) return;
    box.value = tpl.text;
    box.focus();
  }

  function pickPreset(key) {
    const pick = el(`of-f-${key}-pick`), input = el(`of-f-${key}`);
    const f = offerFormType.fields.find((x) => x.key === key);
    if (pick.value === "__other") {
      input.hidden = false;
      if ((f.presets || []).some((p) => p.label === input.value)) input.value = "";
      input.focus();
    } else { input.hidden = true; input.value = pick.value; }
    offerAutoFill();
  }

  // 育成：期間（コースの既定）と評価日（開始日＋期間）を自動で入れる。手で直した欄は変えない（data-auto="0"）
  const periodMonthsOf = (s) => { const m = /^\s*(\d{1,2})\s*(?:か|ヶ|ケ|カ|ヵ|箇)?\s*月/.exec(String(s || "")); const n = m ? Number(m[1]) : 0; return n >= 1 && n <= 36 ? n : null; };
  function reviewDatesOf(start, months) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(start || "")) || !months) return null;
    const [y, m, d] = start.split("-").map(Number);
    const lastDay = new Date(Date.UTC(y, m - 1 + months + 1, 0)).getUTCDate();
    const end = new Date(Date.UTC(y, m - 1 + months, Math.min(d, lastDay)));
    end.setUTCDate(end.getUTCDate() - 1);
    const begin = Date.UTC(y, m - 1, d);
    const mid = new Date(begin + Math.round((end.getTime() - begin) / 86400000 / 2) * 86400000);
    const fmt = (x) => `${x.getUTCFullYear()}-${String(x.getUTCMonth() + 1).padStart(2, "0")}-${String(x.getUTCDate()).padStart(2, "0")}`;
    return { mid: fmt(mid), final: fmt(end) };
  }
  function offerAutoFill({ init = false } = {}) {
    const t = offerFormType;
    if (!t || t.key !== "training") return;
    const courseF = t.fields.find((f) => f.key === "course");
    const course = el("of-f-course")?.value || "";
    const preset = (courseF?.presets || []).find((p) => p.label === course);
    const per = el("of-f-trainingPeriod");
    if (init) {
      // 下書きを開いたとき：自動で入った値のままの欄は、開始日・期間を変えたら追いかける
      const d0 = reviewDatesOf(el("of-f-joinDate")?.value, periodMonthsOf(per?.value));
      if (per && preset?.period && per.value === preset.period) per.dataset.auto = "1";
      for (const [k, v] of [["midReviewOn", d0?.mid], ["finalReviewOn", d0?.final]]) {
        const n = el(`of-f-${k}`);
        if (n && v && n.value === v) n.dataset.auto = "1";
      }
    }
    const isAuto = (n) => n && (n.value === "" || n.dataset.auto === "1");
    if (per && preset?.period && isAuto(per)) { per.value = preset.period; per.dataset.auto = "1"; }
    const dates = reviewDatesOf(el("of-f-joinDate")?.value, periodMonthsOf(per?.value));
    for (const [k, v] of [["midReviewOn", dates?.mid], ["finalReviewOn", dates?.final]]) {
      const n = el(`of-f-${k}`);
      if (n && v && isAuto(n)) { n.value = v; n.dataset.auto = "1"; }
    }
    const note = el("of-auto-note");
    if (note) {
      const md = (s) => (s ? `${Number(s.slice(5, 7))}/${Number(s.slice(8, 10))}` : "—");
      note.textContent = per?.value
        ? `育成期間：${per.value}　中間評価 ${md(el("of-f-midReviewOn")?.value)}・最終評価 ${md(el("of-f-finalReviewOn")?.value)}（自動。詳細設定で変えられます）`
        : "";
    }
  }

  /** 区分つきの入力。既存の列の項目はそのまま、区分にしか無い項目は offerTerms にまとめる。空欄は消す（null） */
  function typedOfferFields(t) {
    const out = { offerTerms: {}, messageToCandidate: el("of-message").value.trim() || undefined };
    const payShown = Boolean(el("of-f-wageAmount"));   // 給与を見られない人には出していない（送らない＝変えない）
    for (const f of t.fields) {
      let v;
      if (f.key === "wageType") {
        if (!payShown || !t.pay) continue;
        v = t.pay.fixed || (offerPay === PAY_NONE ? "" : offerPay);
      } else if (t.pay?.none && f.key === t.pay.none.key) {
        if (!payShown) continue;
        v = offerPay === PAY_NONE ? t.pay.none.no : offerPay ? t.pay.none.yes : "";
      } else if (f.key === "wageAmount") {
        if (!payShown) continue;
        v = offerPay === PAY_NONE ? "" : String(el("of-f-wageAmount").value || "").trim();
      } else {
        const node = el(`of-f-${f.key}`);
        if (!node) continue;
        v = String(node.value || "").trim();
        // 出していない項目（雇用期間が「期間の定めなし」のときの終了日など）は空で送る
        if (f.showIf && (el(`of-f-${f.showIf.key}`)?.value || "") !== f.showIf.value) v = "";
      }
      if (f.term) { if (v) out.offerTerms[f.key] = v; } else out[f.key] = v;
    }
    // 正式契約（LegalSign）の 必要／不要（db/133。列が無い環境では、サーバが外して区分の既定で扱う）
    if (el("of-formal")) out.formalContractRequired = el("of-formal").value === "1";
    return out;
  }
  const offerFields = () => (offerFormType ? typedOfferFields(offerFormType) : offerFormFields());

    const reviewing = a.status === "offer_review_pending";

    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">合格通知を${reviewing ? "確認" : "作成"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">候補者本人に送る、確定した条件です。本人へ送付するまでは、いつでも直せます。</p>
        <label>雇用形態</label><input id="of-employment" type="text" value="${v("employmentType", a.employmentType)}">
        <label style="margin-top:10px;">入社予定日</label><input id="of-join" type="date" value="${v("joinDate", a.joinDate)}">
        <label style="margin-top:10px;">契約形態</label><input id="of-contract" type="text" value="${v("contractType", a.contractType)}">

        ${detail.salaryVisible === false ? `

        <label style="margin-top:10px;">給与区分</label><input id="of-wagetype" type="text" value="${v("wageType", a.wageType)}">
        <label style="margin-top:10px;">給与・報酬</label><input id="of-wage" type="number" value="${v("wageAmount", a.wageAmount)}">`}
        <label style="margin-top:10px;">勤務時間（週）</label><input id="of-hours" type="number" step="0.5" value="${v("weeklyHours", a.weeklyHours)}">

        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn ${reviewing ? "btn-secondary" : "btn-primary"}" onclick="submitOffer(this)">${reviewing ? "内容を保存" : "作成する"}</button>
          ${reviewing ? `<button class="btn btn-primary" onclick="submitConfirmOffer(this)">確定して送付待ちにする</button>` : ""}
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  function offerFormFields() {
    return {
      employmentType: el("of-employment").value.trim() || undefined,
      joinDate: el("of-join").value || undefined,
      contractType: el("of-contract").value.trim() || undefined,
      contractEndDate: el("of-contractend").value || undefined,
      probationMonths: el("of-prob").value || undefined,
      // 給与の欄が無い（給与を見られない）ときは送らない
      wageType: el("of-wagetype")?.value.trim() || undefined,
      wageAmount: el("of-wage")?.value || undefined,
      weeklyHours: el("of-hours").value || undefined,
      workLocation: el("of-loc").value.trim() || undefined,
      messageToCandidate: el("of-message").value.trim() || undefined,

  async function submitOffer(btn) {
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    const fields = offerFields();
    try {
      if (detail.applicant.status === "offer_review_pending") {
        const o = currentOffer();
        await KPLayout.busy(btn, "保存中…", () => API.updateHrOffer({ id: o.id, ...fields, respondBy }));
      } else {
        await KPLayout.busy(btn, "作成中…", () => API.createHrOffer({ applicantId: detail.applicant.id, ...fields, respondBy }));
      }
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ［PDFをプレビュー］：入力を下書きとして保存し、送る前のプレビュー（条件通知書PDF・本人に届く内容・メールの件名と本文）へ。
  //   プレビューでは確定しない（PDF はその場で作って見せるだけ。db/132 の列は送るときに初めて入る）
  async function submitOfferAndSend(btn) {
    const msg = el("of-msg"); msg.textContent = "";
    const t = offerFormType;
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    if (respondBy < jstYmd(0)) { msg.textContent = "回答期限が過ぎています。今日以降の日付にしてください"; return; }
    const missing = t.fields.filter((f) => f.required && el(`of-f-${f.key}`) && !String(el(`of-f-${f.key}`).value || "").trim()).map((f) => f.label);
    if (missing.length) { msg.textContent = `次の項目を入力してください：${missing.join("・")}`; return; }
    if (el("of-f-wageAmount") && offerPay && offerPay !== PAY_NONE && !el("of-f-wageAmount").value) {
      msg.textContent = `${payUnitLabel(offerPay)}の金額を入力してください`; return;
    }
    const fields = offerFields();
    let offer;
    try {
      offer = await KPLayout.busy(btn, "保存中…", async () => {
        if (detail.applicant.status === "offer_review_pending") {
          return (await API.updateHrOffer({ id: currentOffer().id, ...fields, respondBy })).offer;
        }
        return (await API.createHrOffer({ applicantId: detail.applicant.id, ...fields, respondBy })).offer;
      });
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; return; }
    await refreshDetail();
    load();
    openOfferSend(offer.id);
  }

  // ---- 内容を確認して、メールで送る（api/hr/offers の GET と action: "send"） ------------------------
  //   1回の［メールでオファー送信］で：内容の確定 → 本人専用URLの発行 → メール送信 → 送付済み → 承諾待ち。
  //   件名・本文は送る直前まで直せる（{{オファーURL}} の位置に本人専用URLが入る）。
  //   メールで送れない（設定が無い・メールアドレスが無い）ときは、URLを発行して手で送る（従来の流れ）
  let offerSend = null;
  async function openOfferSend(offerId) {
    const id = offerId || currentOffer()?.id;
    if (!id) return;
    openActionModal(`
        <h2 id="sm-title" style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">プレビュー</h2>
        <div id="sm-box"><div class="empty">読み込み中…</div></div>`, { wide: true });
    let d;
    try { d = await API.api(`/api/hr/offers?id=${encodeURIComponent(id)}`); }
    catch (e) {
      el("sm-box").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.message || "読み込めませんでした")}</div></div>`;
      return;
    }
    dropSendConfirm();
    offerSend = { id, d, key: newMailKey(), confirm: null };
    renderOfferSend();
    loadSendPdf();
  }

  function renderOfferSend() {
    const { d } = offerSend;
    const o = d.offer;
    const a = detail.applicant;
    const items = d.items || [];
    const top = items.filter((x) => x.highlight), rest = items.filter((x) => !x.highlight);
    const row = (x) => `<dt>${esc(x.label)}</dt><dd>${esc(x.value)}</dd>`;
    const waitingSend = a.status === "offer_send_pending" && !d.canSend;   // 送った結果が分からない・手で送った途中
    const offerLetter = d.offerLetter?.ready ? d.offerLetter : null;
    // 社労士の正式PDFで進める版（db/139）：本人へは承認した正式PDFを送る（HR の条件通知書は条件案で、送らない）

    const docWarnings = Array.isArray(d.notice?.warnings) ? d.notice.warnings : [];
    if (el("sm-title")) el("sm-title").textContent = official ? "内容を確認して本人へ案内" : notice ? `${notice.title}のプレビュー` : "内容を確認して送信";
    el("sm-box").innerHTML = `
      <p class="hr-sub" style="margin:0 0 10px;">${official
        ? "まだ本人には送っていません。［この内容で本人へ送る］を押すと、社労士の正式PDF（承認した版）をそのまま添付して、本人専用URLをメールで送ります。"
        : notice && !notice.stored
        ? "まだ本人には送っていません。［この内容で本人へ送る］を押すと、この内容で確定し、条件通知書PDFを添付してメールで送ります。"
        : "候補者に届く内容です。送ったあと、この版の内容は変わりません（承諾したときの内容として残ります）。"}</p>
      ${official && !official.ready ? `<div class="banner err" id="sm-official-block" style="display:block;margin:0 0 10px;">
        <b>まだ本人へ送れません</b><div style="margin-top:4px;">${esc(official.hint || "")}</div>
        <button class="btn btn-secondary btn-sm" style="margin-top:8px;" onclick="closeAction();openContractCard()">契約手続きを開く</button></div>` : ""}
      ${offerLetter ? `
      <div class="hr-pdf-box" id="sm-offer-letter" style="margin-bottom:8px;">
        <div class="hd"><span class="material-symbols-outlined" style="font-size:18px;width:18px;overflow:hidden;">description</span>
          <span><b>${esc(offerLetter.title)}</b>（PDF・A4）　${offerLetter.stored ? "送った時点の版です" : "送るときに、この内容で確定して添付します"}</span>
          <button class="btn btn-secondary btn-sm" id="sm-offer-pdf-open" style="padding:2px 10px;"
            onclick="openOfferPdf('${esc(o.id)}', '${offerLetter.stored ? "offer" : "previewOffer"}', this)">PDFを開く</button></div>
      </div>` : ""}
      ${official?.doc ? `
      <div class="hr-pdf-box" id="sm-official">
        <div class="hd"><span class="material-symbols-outlined" style="font-size:18px;width:18px;overflow:hidden;">verified</span>
          <span><b>${esc(official.doc.title)}</b>（社労士作成の正式PDF・受領第${esc(official.doc.revision)}版・承認済み）　送るときに、この版をそのまま添付します</span>
          ${detail.salaryVisible === false ? "" : `<button class="btn btn-secondary btn-sm" id="sm-official-open" style="padding:2px 10px;" onclick="openOfficialPdf('${esc(official.doc.id)}', this)">PDFを開く</button>`}</div>
        <div class="hr-of-auto">SHA-256：${esc(String(official.doc.sha256 || "").slice(0, 16))}…（受け取ったときの値と同じことを、送る直前にもう一度確かめます）
          ／ 正式契約：${official.contractRoute === "other" ? "例外ルート（紙・対面など）" : official.legalsign ? "LegalSign（登録済み）" : d.formalRequired ? "LegalSign（未登録）" : "なし"}</div>
        ${detail.salaryVisible === false
          ? `<div class="hr-of-auto">給与・報酬が入るため、PDF は給与を見られる方が確認します。</div>`
          : pdfInline() ? `<div class="frame" id="sm-pdf-frame-box"><div class="empty" id="sm-pdf-loading">PDFを読み込み中…</div></div>` : ""}
      </div>` : ""}
      ${notice ? `
      <div class="hr-pdf-box" id="sm-notice">
        <div class="hd"><span class="material-symbols-outlined" style="font-size:18px;width:18px;overflow:hidden;">picture_as_pdf</span>
          <span><b>${esc(notice.title)}</b>（PDF・A4）　${notice.stored ? "送った時点の版です" : "送るときに、この内容で確定してメールに添付します"}</span>
          ${notice.salaryVisible === false ? "" : `<button class="btn btn-secondary btn-sm" id="sm-pdf-open" style="padding:2px 10px;" onclick="openOfferPdf('${esc(o.id)}', '${notice.stored ? "notice" : "preview"}', this)">PDFを開く</button>`}</div>
        ${notice.salaryVisible === false
          ? `<div class="hr-of-auto" id="sm-pdf-hidden">給与・報酬が入るため、PDF は給与を見られる方が確認します。</div>`
          : pdfInline() ? `<div class="frame" id="sm-pdf-frame-box"><div class="empty" id="sm-pdf-loading">PDFを読み込み中…</div></div>` : ""}
      </div>` : ""}
      ${notice ? `<div class="hr-of-auto" id="sm-doc-check" style="margin:8px 0 0;padding:8px 10px;background:#f6f6f2;border-radius:8px;">
        送付前に、<b>宛名・条件／報酬・回答期限・承諾後の流れ・問い合わせ先</b>をPDFで確認してください。
        登録済みの会社印がある場合は、PDFに会社印も表示します。
      </div>` : ""}
      ${docWarnings.length ? `<div class="banner warn" id="sm-doc-warnings" style="margin:8px 0 0;display:block;">
        <b>通知書の確認推奨項目に未入力があります</b>
        <div style="margin-top:4px;">${esc(docWarnings.join("・"))}</div>
        <div style="font-size:11.5px;margin-top:4px;">送信はできますが、本人への説明不足を防ぐため、必要な項目は［条件を修正］から入力してください。</div>
      </div>` : ""}
      <div class="hr-of-preview" id="sm-preview" style="margin-top:${notice ? 10 : 0}px;">
        <div class="hd"><span class="hr-pill" style="background:#1b2440;color:#fff;">${esc(o.offerName || "合格通知")}</span>
          <b>${esc(d.candidateName)} 様</b>　第${esc(o.version)}版</div>
        <dl>${top.map(row).join("")}<dt>回答期限</dt><dd>${esc(fmtYmdJa(o.respondBy))}</dd></dl>
        ${rest.length ? `<details><summary>その他の条件（${rest.length}件）</summary><dl>${rest.map(row).join("")}</dl></details>` : ""}
      </div>
      ${official ? "" : o.offerType && typeof d.formalRequired === "boolean" ? `<div class="hr-of-auto" id="sm-formal" style="margin-top:6px;">社内の設定：正式契約（LegalSign）は
        <b>${d.formalRequired ? "必要" : "不要"}</b>（${d.formalRequired ? "条件承諾のあと LegalSign で正式契約" : "条件承諾のあと、正式契約なしで次の手続きへ"}。条件通知書にも書きます）</div>` : ""}
      ${!d.to ? `
      <div class="banner warn" id="sm-email-need" style="margin-top:12px;display:block;">
        <b>本人のメールアドレスが未登録です</b>
        <div class="hr-email-row" style="margin:8px 0 0;"><input id="sm-email-new" type="email" inputmode="email" autocomplete="off" placeholder="example@example.com"
          onkeydown="if(event.key==='Enter'){event.preventDefault();registerSendEmail(this)}">
          <button class="btn btn-primary btn-sm" onclick="registerSendEmail(this)">登録して続ける</button></div>
        <div class="err-text" id="sm-email-msg"></div></div>`
      : d.mail.configured ? "" : `
      <div class="banner warn" id="sm-nomail" style="margin-top:12px;"><span class="material-symbols-outlined">mail</span>
        <div>メールで送れません（${esc(d.mail.reason || "設定がありません")}）。URLを発行して、下の文面をコピーして送ってください。</div></div>`}
      <div class="hr-of-grid" style="margin-top:12px;">
        <div class="wide"><label>送信先</label>
          ${offerSend.editTo ? `<div class="hr-email-row" style="margin:0;"><input id="sm-to-input" type="email" inputmode="email" autocomplete="off" value="${esc(d.to || "")}"
              onkeydown="if(event.key==='Enter'){event.preventDefault();saveSendTo(this)}">
            <span class="acts"><button class="btn btn-primary btn-sm" onclick="saveSendTo(this)">保存</button>
              <button class="btn btn-secondary btn-sm" onclick="offerSend.editTo=false;renderOfferSendKeep()">キャンセル</button></span>
            <div class="err-text" id="sm-to-msg"></div></div>`
          : `<div class="hr-to" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${esc(d.candidateName)} 様
              <b id="sm-to">${esc(d.to || "（メールアドレス未登録）")}</b>
              ${d.to ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" id="sm-to-change" onclick="offerSend.editTo=true;renderOfferSendKeep();el('sm-to-input')?.focus()">変更</button>` : ""}</div>`}</div>
        <div class="wide"><label for="sm-subject">件名</label><input id="sm-subject" type="text" value="${esc(d.subject)}"></div>
        <div class="wide"><label for="sm-body">本文</label><textarea id="sm-body" rows="12">${esc(d.body)}</textarea>
          <div class="hr-of-auto">${esc(d.urlTag)} の位置に、この方専用のURLが入ります（送った記録にはURLを残しません）</div></div>
      </div>
      <div id="sm-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="hr-of-actions">
        ${d.canSend ? (d.mail.configured
          ? `<button class="btn btn-primary" id="sm-review" onclick="openSendConfirm(this)">送信内容を確認する</button>`
          : `<button class="btn btn-primary" id="sm-manual" onclick="sendOfferManual(this)">URLを発行して手で送る</button>`) : ""}
        ${waitingSend ? `<button class="btn btn-primary" onclick="submitMarkSent(this, '${esc(o.id)}')">送付済みにする</button>
          <button class="btn btn-secondary" onclick="openSendOfferForm()">URLを再発行する</button>` : ""}
        ${a.status === "offer_review_pending" ? `<button class="btn btn-secondary" id="sm-edit" onclick="openOfferForm()">条件を修正</button>` : ""}
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`;
  }
  const fmtYmdJa = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "")); return m ? `${m[1]}年${Number(m[2])}月${Number(m[3])}日` : "—"; };

  // 件名・本文の手直しを残したまま描き直す（送信先を変える・メールを登録するとき）
  function renderOfferSendKeep() {
    const subject = el("sm-subject")?.value, body = el("sm-body")?.value;
    renderOfferSend();
    showSendPdf();
    if (subject != null) el("sm-subject").value = subject;
    if (body != null) el("sm-body").value = body;
  }
  // メールを登録・変更したら、送信先と「メールで送れるか」をサーバーから読み直す（画面は閉じない）
  async function reloadSendDraft() {
    const subject = el("sm-subject")?.value, body = el("sm-body")?.value;
    const d = await API.api(`/api/hr/offers?id=${encodeURIComponent(offerSend.id)}`);
    dropSendConfirm();
    offerSend.d = { ...d, subject: subject ?? offerSend.d.subject ?? d.subject, body: body ?? offerSend.d.body ?? d.body };
    offerSend.editTo = false;
    renderOfferSend();
    showSendPdf();
  }
  async function registerSendEmail(btn) {
    const msg = el("sm-email-msg"); msg.textContent = "";
    const err = await saveApplicantEmail(el("sm-email-new").value, btn);
    if (err) { msg.textContent = err; return; }
    if (!detail.applicant.email) { msg.textContent = "メールアドレスを入力してください"; return; }
    try { await reloadSendDraft(); } catch (e) { msg.textContent = e.hint || e.message || "読み込めませんでした"; }
  }
  async function saveSendTo(btn) {
    const msg = el("sm-to-msg"); msg.textContent = "";
    const value = el("sm-to-input").value;
    if (!String(value).trim()) { msg.textContent = "送信先のメールアドレスを入力してください"; return; }
    const err = await saveApplicantEmail(value, btn);
    if (err) { msg.textContent = err; return; }
    try { await reloadSendDraft(); } catch (e) { msg.textContent = e.hint || e.message || "読み込めませんでした"; }
  }

  // オファーの PDF（条件通知書・承諾済み・送る前の確認用）を取ってくる。ログインの鍵が要るので fetch で受け取る
  async function fetchOfferPdf(offerId, file) {
    return fetchPdfAt(`/api/hr/offers?id=${encodeURIComponent(offerId)}&file=${encodeURIComponent(file)}`);
  }
  async function fetchPdfAt(path) {
    const token = await API.getToken();
    const r = await fetch(path, { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" });
    if (!r.ok) {
      const b = await r.json().catch(() => ({}));
      throw new Error(b.hint || b.message || "PDFを開けませんでした");
    }
    const blob = await r.blob();
    const name = decodeURIComponent((/filename\*=UTF-8''([^;]+)/.exec(r.headers.get("content-disposition") || "") || [])[1] || "offer.pdf");
    return { blob, name };
  }
  // 社労士の正式PDF（受領した版）を開く（給与を見られる人だけ。サーバが SHA-256 を確かめてから返す）
  async function openOfficialPdf(docId, btn) {
    try {
      await KPLayout.busy(btn, "読み込み中…", async () => {
        const { blob, name } = await fetchPdfAt(`/api/hr/offers/contract?docId=${encodeURIComponent(docId)}&file=1`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      });
    } catch (e) { alert(e.message || "PDFを開けませんでした"); }
  }
  // 開く（保存させる）。スマホではそのまま PDF の表示になる
  async function openOfferPdf(offerId, file, btn) {
    try {
      await KPLayout.busy(btn, "読み込み中…", async () => {
        const { blob, name } = await fetchOfferPdf(offerId, file);
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      });
    } catch (e) { alert(e.message || "PDFを開けませんでした"); }
  }
  // プレビュー画面の中に PDF を出すか。PC だけ（スマホのブラウザは画面の中の PDF を1ページ目しか見せない・見せないので、［PDFを開く］にする）
  const pdfInline = () => window.matchMedia("(min-width: 721px) and (pointer: fine)").matches;
  // プレビュー画面の PDF。読み込んだものは、描き直し（送信先の変更など）でも使い回す。開くたびに作り直す（直した内容が出る）
  let sendPdf = null;   // { offerId, url }
  async function loadSendPdf() {
    if (sendPdf) { URL.revokeObjectURL(sendPdf.url); sendPdf = null; }
    // 社労士の正式PDF（承認した版）を画面の中に出す（PC・給与を見られる人だけ）
    const off = offerSend?.d?.official;
    if (off) {
      if (!off.doc || detail.salaryVisible === false || !pdfInline()) return;
      const offerId = offerSend.id;
      try {
        const { blob } = await fetchPdfAt(`/api/hr/offers/contract?docId=${encodeURIComponent(off.doc.id)}&file=1`);
        if (offerSend?.id !== offerId) return;
        sendPdf = { offerId, url: URL.createObjectURL(blob) };
        showSendPdf();
      } catch (e) {
        const box = el("sm-pdf-frame-box");
        if (box) box.innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(e.message || "PDFを表示できませんでした")}</div></div>`;
      }
      return;
    }
    const n = offerSend?.d?.notice;
    if (!n?.ready || n.salaryVisible === false || !pdfInline()) return;
    const offerId = offerSend.id;
    try {
      const { blob } = await fetchOfferPdf(offerId, n.stored ? "notice" : "preview");
      if (offerSend?.id !== offerId) return;
      sendPdf = { offerId, url: URL.createObjectURL(blob) };
      showSendPdf();
    } catch (e) {
      const box = el("sm-pdf-frame-box");
      if (box) box.innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(e.message || "PDFを表示できませんでした")}</div></div>`;
    }
  }
  function showSendPdf() {
    const box = el("sm-pdf-frame-box");
    if (!box || !sendPdf || sendPdf.offerId !== offerSend?.id) return;
    box.innerHTML = `<iframe id="sm-pdf-frame" title="条件通知書のプレビュー" src="${sendPdf.url}#view=FitH"></iframe>`;
  }

  // ---- 送る前の確認（送信元・宛先〔CC/BCC はなし〕・件名・本文・添付PDF）。確認したものだけを送る ----------------
  //   confirmDigest＝サーバーの要約（confirm.base）＋確認した件名・本文の SHA-256（lib/hr-offer-confirm.js と同じ作り方）。
  //   確認のあとで宛先・件名・本文・添付PDFが変われば、サーバーが 409 で止める（送らない）。
  //   添付PDFは、見られるもの（給与を見られる人・オファー通知PDF）はその場で取ってきて開けるように、
  //   見られないものはサーバーで「作れるか」だけ確かめる（check=1）。1つでも作れなければ送れない
  const CONFIRM_VERSION = "hr-offer-send-v1";
  async function confirmDigestOf(base, subject, body) {
    const text = JSON.stringify([CONFIRM_VERSION, String(base || ""), String(subject ?? "").trim(), String(body ?? "").replace(/\r\n/g, "\n")]);
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const DOC_STATE_LABEL = { loading: "確認中…", ok: "確認済み", failed: "作成できません" };
  async function openSendConfirm(btn) {
    const m = offerMailText();
    if (!m) return;
    const f = offerSend;
    const c = f.d.confirm;
    if (!c?.base) { el("sm-msg").textContent = "送信前の確認に必要な情報を読み込めませんでした。画面を開き直してください"; return; }
    // 戻ったときに直した件名・本文が残るように
    f.d.subject = m.subject; f.d.body = m.body;
    const digest = await confirmDigestOf(c.base, m.subject, m.body);
    if (offerSend !== f) return;
    f.confirm = {
      subject: m.subject, body: m.body, digest, base: c.base, changed: false, checked: false,
      docs: (c.documents || []).map((x) => ({ ...x, state: "loading", hint: null, url: null })),
    };
    renderSendConfirm();
    verifySendDocs(f);
  }
  function viewableDoc(x) { return !(x.salary && detail.salaryVisible === false) && (x.kind === "official" ? Boolean(x.docId) : Boolean(x.file)); }
  async function verifySendDocs(f) {
    const c = f.confirm;
    // 1) サーバーで「いま作れるか・送るものが変わっていないか」
    try {
      const r = await API.api(`/api/hr/offers?id=${encodeURIComponent(f.id)}&check=1`);
      if (offerSend !== f || f.confirm !== c) return;
      if (r.base !== c.base) c.changed = true;
      for (const x of c.docs) {
        const got = (r.documents || []).find((y) => y.kind === x.kind);
        if (!got) { x.state = "failed"; x.hint = "添付PDFの確認ができませんでした"; continue; }
        if (!got.ok) { x.state = "failed"; x.hint = got.hint; continue; }
        if (!viewableDoc(x)) { x.state = "ok"; x.hint = "給与・報酬が入るため、内容は給与を見られる方が確認します（作成できることは確認済み）"; }
      }
    } catch (e) {
      if (offerSend !== f || f.confirm !== c) return;
      for (const x of c.docs) { x.state = "failed"; x.hint = e.hint || e.message || "添付PDFを確認できませんでした"; }
    }
    renderSendConfirm();
    // 2) 見られるPDFは取ってきて、［PDFを開く］で実物を見られるようにする
    for (const x of c.docs) {
      if (x.state !== "loading" || !viewableDoc(x)) continue;
      try {
        const { blob } = x.kind === "official"
          ? await fetchPdfAt(`/api/hr/offers/contract?docId=${encodeURIComponent(x.docId)}&file=1`)
          : await fetchOfferPdf(f.id, x.file);
        if (offerSend !== f || f.confirm !== c) return;
        x.url = URL.createObjectURL(blob); x.state = "ok";
      } catch (e) {
        if (offerSend !== f || f.confirm !== c) return;
        x.state = "failed"; x.hint = e.message || "PDFを開けませんでした";
      }
      renderSendConfirm();
    }
  }
  function sendConfirmReady() {
    const c = offerSend?.confirm;
    return Boolean(c && !c.changed && offerSend.d.confirm?.from && c.docs.every((x) => x.state === "ok") && c.checked);
  }
  function renderSendConfirm() {
    const f = offerSend, c = f?.confirm;
    if (!c) return;
    const d = f.d, k = d.confirm;
    const bodyHtml = esc(c.body).split(esc(d.urlTag)).join(`<mark>〔${esc(d.candidateName)} 様専用のURL（送信するときに入ります）〕</mark>`);
    if (el("sm-title")) el("sm-title").textContent = "送信内容の確認";
    el("sm-box").innerHTML = `
      <div id="sm-confirm">
        <p class="hr-sub" style="margin:0;">まだ送っていません。<b>この内容のとおりに送ります。</b>確認できたら［この内容で送信する］を押してください。</p>
        ${c.changed ? `<div class="banner err" id="sc-changed" style="display:block;margin:10px 0 0;"><b>確認中に内容が変わりました</b>
          <div style="margin-top:4px;">宛先・条件・添付PDFのどれかが、ほかの操作で変わっています。［戻って修正する］から開き直して、もう一度確認してください。</div></div>` : ""}
        <dl class="hr-sc-dl">
          <dt>送信元</dt><dd id="sc-from">${k.from ? esc(k.from) : `<span style="color:#b3261e;">未設定（送信できません。管理者にメール送信の設定を依頼してください）</span>`}</dd>
          ${k.replyTo ? `<dt>返信先</dt><dd id="sc-reply">${esc(k.replyTo)}</dd>` : ""}
          <dt>宛先（To）</dt><dd id="sc-to">${esc(k.toName || d.candidateName)} 様 &lt;${esc(k.to || d.to || "")}&gt;</dd>
          <dt>CC</dt><dd id="sc-cc">なし</dd>
          <dt>BCC</dt><dd id="sc-bcc">なし</dd>
          <dt>件名</dt><dd id="sc-subject">${esc(c.subject)}</dd>
        </dl>
        <div class="hr-sc-body" id="sc-body">${bodyHtml}</div>
        <div style="margin:12px 0 0;font-size:12.5px;font-weight:700;color:#1b2440;">添付するPDF（${c.docs.length}件）</div>
        ${c.docs.length ? `<ul class="hr-sc-docs" id="sc-docs">${c.docs.map((x, i) => `
          <li data-doc-kind="${esc(x.kind)}" data-state="${esc(x.state)}">
            <b>${esc(x.title)}</b><span class="st">${DOC_STATE_LABEL[x.state]}</span>
            ${x.url ? `<a class="btn btn-secondary btn-sm" style="padding:2px 10px;" data-sc-open="${i}" href="${x.url}" target="_blank" rel="noopener">PDFを開く</a>` : ""}
            <span class="note">${x.stored ? "送った時点の版（保存済み）をそのまま添付します" : "送るときに、この内容で確定して添付します"}${x.hint ? `。${esc(x.hint)}` : ""}${x.note ? `。${esc(x.note)}` : ""}</span>
          </li>`).join("")}</ul>` : `<p class="hr-sub" id="sc-docs-none" style="margin:4px 0 0;">なし（PDFは添付しません）</p>`}
        <label class="hr-mv-ack" style="margin-top:12px;"><input type="checkbox" id="sc-check" ${c.checked ? "checked" : ""}
          onchange="offerSend.confirm.checked=this.checked;syncSendConfirm()">送信元・宛先・件名・本文・添付PDFを確認しました</label>
        <div id="sm-msg" class="err-text" style="margin:10px 0 0;"></div>
        <div class="hr-of-actions">
          <button class="btn btn-primary" id="sm-send" onclick="sendOfferMail(this)" disabled>この内容で送信する</button>
          <button class="btn btn-secondary" id="sm-back" onclick="backToSendEdit()">戻って修正する</button>
        </div>
      </div>`;
    syncSendConfirm();
  }
  function syncSendConfirm() { const b = el("sm-send"); if (b && offerSend?.confirm) b.disabled = !sendConfirmReady(); }
  function dropSendConfirm() {
    for (const x of offerSend?.confirm?.docs || []) if (x.url) URL.revokeObjectURL(x.url);
    if (offerSend) offerSend.confirm = null;
  }
  async function backToSendEdit() {
    const changed = offerSend?.confirm?.changed;
    dropSendConfirm();
    if (changed) { try { await reloadSendDraft(); } catch (e) { renderOfferSend(); showSendPdf(); } return; }
    renderOfferSend();
    showSendPdf();
  }

  function offerMailText() {
    const subject = el("sm-subject").value.trim();
    const body = el("sm-body").value;
    const msg = el("sm-msg"); msg.textContent = "";
    if (!subject) { msg.textContent = "件名を入力してください"; return null; }
    if (/[\r\n]/.test(subject)) { msg.textContent = "件名に改行は使えません"; return null; }
    if (!body.includes(offerSend.d.urlTag)) { msg.textContent = `本文に ${offerSend.d.urlTag} を残してください（本人専用URLが入る場所です）`; return null; }
    return { subject, body };
  }

  async function sendOfferMail(btn) {
    const f = offerSend;
    const c = f?.confirm;
    // 送るのは、確認画面で確認した件名・本文だけ（入力欄から読み直さない）
    if (!c || !sendConfirmReady()) { if (el("sm-msg")) el("sm-msg").textContent = "送信内容を確認してから送ってください"; return; }
    // 二度押し：送っている間・送り終えたあと（画面の描き直し待ちの間も）は、もう送らない（サーバーの requestKey とあわせて二重に防ぐ）
    if (f.sending) return;
    f.sending = true;
    const m = { subject: c.subject, body: c.body };
    let r = null, err = null;
    try {
      r = await KPLayout.busy(btn, "送信中…", () => API.hrOfferAct({ id: f.id, action: "send", ...m, requestKey: f.key, confirmDigest: c.digest }));
    } catch (e) { err = e; }
    if (offerSend !== f) return;
    if (err && !err.body?.url) f.sending = false;   // 送れていない（URL が返っていない）ときだけ、同じ鍵でやり直せる
    if (err) {
      const b = err.body || {};
      if (b.url) { await afterOfferSendChange(); return showOfferManual(b.url, m, b.hint || err.hint, b.offer?.id || f.id); }
      if (err.code === "confirm_mismatch" || err.code === "confirm_required") {
        // 確認のあとで内容が変わった：送っていない。最新の内容を読み直して、確認からやり直す
        c.changed = true;
        renderSendConfirm();
        el("sm-msg").textContent = err.hint || "確認のあとで内容が変わりました。もう一度確認してください";
        return;
      }
      if (err.code === "mail_not_configured" || err.code === "no_email") {
        f.d.mail = { configured: false, reason: err.hint };
        dropSendConfirm();
        renderOfferSend();
      }
      el("sm-msg").textContent = err.hint || err.detail || err.message || "送れませんでした";
      return;
    }
    await afterOfferSendChange();
    if (r.status === "unknown") return showOfferManual(r.url, m, r.hint, r.offer?.id || f.id);
    if (r.status !== "sent") {
      el("sm-msg").textContent = r.duplicate ? `この送信はすでに処理されています（結果：${r.status}）。画面を開き直してください` : "送れませんでした";
      return;
    }
    el("sm-box").innerHTML = `
      <div class="banner ok" id="sm-done"><span class="material-symbols-outlined">mark_email_read</span>
        <div><b>メールでオファーを送りました。</b><br>${esc(f.d.candidateName)} 様の同意を待っています（承諾待ち）。
          メールサービスが受け付けたことで、相手に届いた・開いた、ではありません。</div></div>
      <div class="hr-of-actions"><button class="btn btn-primary" onclick="closeAction()">閉じる</button></div>`;
  }

  // メールで送れないとき：内容を確定して URL を発行し、文面をコピーして手で送る → 送付済みにする
  async function sendOfferManual(btn) {
    const m = offerMailText();
    if (!m) return;
    const o = offerSend.d.offer;
    try {
      const r = await KPLayout.busy(btn, "発行中…", async () => {
        if (detail.applicant.status === "offer_review_pending") await API.confirmHrOffer(o.id);
        return API.issueHrOfferLink(o.id);
      });
      await afterOfferSendChange();
      showOfferManual(`${location.origin}/hr/offer.html?token=${encodeURIComponent(r.token)}`, m,
        "URLを発行しました。文面をコピーして送り、送り終えたら「送付済みにする」を押してください。", r.offer.id);
    } catch (e) { el("sm-msg").textContent = e.hint || e.detail || e.message || "発行できませんでした"; }
  }

  function showOfferManual(url, m, hint, offerId) {
    const text = `件名：${m.subject}\n\n${m.body.split(offerSend.d.urlTag).join(url)}`;
    el("sm-box").innerHTML = `
      <div class="banner warn" id="sm-fallback"><span class="material-symbols-outlined">info</span><div>${esc(hint || "")}</div></div>
      <label style="margin-top:12px;">候補者専用URL（この画面を閉じると、二度と表示されません）</label>
      <input id="so-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
      <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-url')">URLをコピー</button>
      <label style="margin-top:14px;">メール文面</label>
      <textarea id="so-mail" rows="10" readonly>${esc(text)}</textarea>
      <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-mail')">メール文面をコピー</button>
      <div class="hr-of-actions">
        <button class="btn btn-primary" onclick="submitMarkSent(this, '${esc(offerId)}')">送付済みにする</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`;
  }

  async function afterOfferSendChange() {
    await refreshDetail();
    load();
  }

  async function submitConfirmOffer(btn) {
    const o = currentOffer();
    if (!o) return;
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "確定中…", async () => {
        await API.updateHrOffer({ id: o.id, ...offerFields(), respondBy });
        await API.confirmHrOffer(o.id);
      });
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "確定できませんでした"; }
  }

  // ---- 本人へ送る・URLを再発行（右ドロワー） -----------------------------------------
  // 区分の無い、これまでの合格通知と、URL の再発行の画面（区分つきは openOfferSend でメールまで送る）。
  // Stage 6：URLを発行してコピーしてもらい、
  // 実際に送り終えたら「送付済みにする」を明示的に押してもらう（README §12）
  function openSendOfferForm() {
    const reissuing = ["offer_sent", "offer_viewed", "offer_response_pending"].includes(detail.applicant.status);
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">${reissuing ? "URLを再発行" : "本人へ送る"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">
          ${reissuing ? "現在のURLは使えなくなります。新しいURLを発行しますか？" : "候補者専用のURLを発行します。いつもお使いのメールから、手動で送ってください。"}</p>
        <div id="so-body">
          <button class="btn btn-primary" onclick="submitIssueLink(this)">${reissuing ? "再発行する" : "URLを発行する"}</button>
        </div>
        <div id="so-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  async function submitIssueLink(btn) {
    const msg = el("so-msg"); msg.textContent = "";
    const o = currentOffer();
    if (!o) return;
    try {
      const r = await KPLayout.busy(btn, "発行中…", () => API.issueHrOfferLink(o.id));
      const url = `${location.origin}/hr/offer.html?token=${encodeURIComponent(r.token)}`;
      const mail = offerMailTemplate(url);
      el("so-body").innerHTML = `
        <label>候補者専用URL（この画面を閉じると、二度と表示されません）</label>
        <input id="so-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-url')">URLをコピー</button>
        <label style="margin-top:14px;">メール文面</label>
        <textarea id="so-mail" rows="9" readonly>${esc(mail)}</textarea>
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-mail')">メール文面をコピー</button>
        <p class="muted" style="font-size:12px;margin-top:12px;">
          上のURLをメールに貼って、実際に送ってください。送り終えたら、下のボタンを押して記録してください。</p>
        <button class="btn btn-primary" style="margin-top:6px;" onclick="submitMarkSent(this, '${esc(r.offer.id)}')">送付済みにする</button>`;

  let formalFlow = null;

    el("fc-box").innerHTML = `
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">正式契約（LegalSign）</h2>

      ${!o.docsReady ? `<div class="banner warn"><span class="material-symbols-outlined">build</span><div>db/132_hr_offer_documents.sql を Supabase に流すと使えます。</div></div>` : `
      ${detail.salaryVisible !== false && o.noticePdf ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="openOfferPdf('${esc(o.id)}', 'accepted', this)">承諾済みPDF（電子承諾記録つき）</button></div>` : ""}
      ${step(1, Boolean(o.legalsignUrl), "LegalSign の URL", sent

           <div class="hr-of-auto">https:// で始まる URL だけ登録できます。本人へ案内するまでは直せます。</div>

           <div id="fc-mail">${signed ? "" : `<button class="btn ${sent ? "btn-secondary" : "btn-primary"} btn-sm" id="fc-guide" onclick="openFormalMail(this)">${sent ? "もう一度案内する" : "本人へ正式契約を案内"}</button>`}</div>`)}
      ${step(3, signed, "正式契約済みにする", signed
        ? `<p class="hr-sub" style="margin:0 0 8px;">正式契約済み：${esc(fmtDate(o.formalSignedAt))}</p>

        : `<p class="hr-sub" style="margin:0 0 8px;">LegalSign で本人の署名が終わったことを確かめてから押してください（取り消せません）。</p>

  async function sendFormalMail(btn) {
    const msg = el("fc-msg"); msg.textContent = "";
    const subject = el("fc-subject").value.trim(), body = el("fc-body").value;
    if (!subject) { msg.textContent = "件名を入力してください"; return; }
    if (!body.includes(formalFlow.mail.urlTag)) { msg.textContent = `本文に ${formalFlow.mail.urlTag} を残してください`; return; }
    try {
      const r = await formalAct(btn, "送信中…", { action: "sendFormal", channel: "email", subject, body, requestKey: formalFlow.key });
      if (r?.status && r.status !== "sent") { msg.textContent = r.hint || "送れませんでした"; return; }
      formalFlow.key = newMailKey();
      if (formalFlow.official) { closeAction(); return; }
      renderFormal();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "送れませんでした"; }
  }
  async function sendFormalManual(btn) {
    const msg = el("fc-msg"); msg.textContent = "";

    try {

  }

  // ---- 承諾内容を確認して Office へ引き渡す（db/133） ------------------------------------------

  // ---- 契約手続き（書類タブ）。社労士への依頼 → 正式PDFの受領・照合・承認 → LegalSign の登録 → 本人へ案内 → 同意 → 締結 → Office ----

  //   Slack へは送らない（依頼文を作ってコピーするだけ）。「依頼済み」は担当者がボタンを押したときだけ記録する
  const CT_MARK = { done: "✓", now: "●", wait: "…", todo: "－", skip: "不要", ended: "×" };
  const CT_NUM = ["①", "②", "③", "④", "⑤", "⑥", "⑦"];
  const CT_DOC_ST = { received: "確認待ち", approved: "承認済み", returned: "差し戻し", superseded: "使わない版" };
  const ctShort = (sha) => (sha ? `${String(sha).slice(0, 12)}…` : "—");
  const ctOfferDocs = () => (contract?.docs || []).filter((d) => d.offerId === contract.offer.id);

  function openContractCard() {
    setDetailTab("docs");
    setTimeout(() => el("hr-contract")?.scrollIntoView({ block: "start", behavior: "smooth" }), 0);

  function contractWaitText(p, o) {
    if (p.state === "guided") return `本人の条件同意を待っています（回答期限：${fmtYmdJa(o.respondBy)}）。`;
    if (p.state === "signed_before_consent") return "正式契約は記録済みです。本人の条件同意を待っています（同意がそろったら Office へ引き渡せます）。";
    if (p.state === "handed_off") return "Office へ引き渡し済みです。入社準備は Office で進みます。";
    if (p.state === "declined") return "本人が辞退しました。";
    if (p.state === "expired") return "回答期限を過ぎました。本人の回答ページはもう開けません。本人へ確認してください（URLを再発行しても回答期限は変わりません）。";
    return "";

    const steps = p.steps.map((s, i) => `

    const docs = (contract.docs || []).map((d) => `
      <div class="hr-ct-row" data-ct-doc="${esc(d.id)}" data-st="${esc(d.status)}">
        <b>受領第${esc(d.revision)}版</b>${d.offerId !== o.id ? `<span class="muted">（前の条件の版）</span>` : ""}
        <span>${esc(d.title)}</span><span class="hr-ct-chip" data-st="${esc(d.status)}">${esc(d.sent ? "本人へ案内した版" : CT_DOC_ST[d.status] || d.status)}</span>
        ${contract.perms?.salary ? `<button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="openOfficialPdf('${esc(d.id)}', this)">PDFを開く</button>` : ""}
        <span class="sub">受領日 ${esc(fmtYmdJa(d.receivedOn))}${d.authorName ? `・作成 ${esc(d.authorName)}` : ""}・アップロード ${esc(d.uploadedByName || "—")}
          ・SHA-256 ${esc(ctShort(d.sha256))}${d.reviewedAt ? `・確認 ${esc(d.reviewedByName || "—")}（${esc(JST.date(d.reviewedAt))}）` : ""}
          ${d.reviewNote ? `<br>差し戻しの理由：${esc(d.reviewNote)}` : ""}${d.carried ? "<br>再発行で前の版から引き継いだ正式PDF" : ""}</span>
      </div>`).join("");
    const rec = p.reconcile?.rows || [];
    const recHtml = rec.some((r) => r.sha && r.key !== "approved") ? `
      <table class="hr-ct-rec" id="hr-ct-reconcile"><thead><tr><th>版の照合</th><th>SHA-256</th><th></th></tr></thead><tbody>
        ${rec.map((r) => `<tr data-rec="${esc(r.key)}"><td>${esc(r.label)}</td><td>${esc(r.short ? `${r.short}…` : "—")}</td>
          <td class="${r.match === false ? "ng" : r.match ? "ok" : ""}">${r.match === false ? "✗ 違う版" : r.match ? "✓ 同じ" : "まだ"}</td></tr>`).join("")}</tbody></table>` : "";
    const reqs = (contract.requests || []).map((r) => `
      <div class="hr-ct-row" data-ct-req="${esc(r.id)}"><b>${esc(JST.dateTime(r.requestedAt))}</b>

        ${r.note || (r.missingLabels || []).length ? `<span class="sub">${r.note ? `メモ：${esc(r.note)}` : ""}${r.note && r.missingLabels.length ? "　" : ""}${r.missingLabels.length ? `要確認のまま依頼：${esc(r.missingLabels.join("・"))}` : ""}</span>` : ""}

        <details class="hr-ct-more" id="hr-ct-docs"><summary>受領した正式PDF・版の照合（${(contract.docs || []).length}件）</summary>
          ${docs || `<p class="muted" style="font-size:12px;">まだ受け取っていません。</p>`}${recHtml}</details>
        <details class="hr-ct-more" id="hr-ct-hist"><summary>依頼文・依頼の記録を見る（${(contract.requests || []).length}件）</summary>
          ${reqs || `<p class="muted" style="font-size:12px;">まだ依頼の記録はありません。</p>`}
          <p class="muted" style="font-size:11.5px;margin:6px 0 0;">Slack へはこのシステムから送りません。依頼文をコピーして担当者が送り、［依頼済みにする］で記録します。</p></details>
      </section>`;
  }

  function contractAction(action, kind) {
    if (action === "editConditions") return openOfferForm();
    if (action === "request") return openContractRequest(kind || "");
    if (action === "upload") return openContractUpload();
    if (action === "review") return openContractReview();
    if (action === "legalsign") return openContractLegalsign();
    if (action === "guide") return openOfferSend(contract.offer.id);
    if (action === "signed") return openContractSigned();
    if (action === "handoff") return openHandoff();
    if (action === "reopen") return contractReopen();
    if (action === "formalMail") return openContractFormalMail();
  }
  const contractPost = (action, body = {}) => API.api("/api/hr/offers/contract", { method: "POST", body: { offerId: contract.offer.id, action, ...body } });
  async function contractDone() {
    closeAction();
    await refreshDetail("docs");
    load();
    setTimeout(() => el("hr-contract")?.scrollIntoView({ block: "start" }), 0);
  }

  // ① 社労士への依頼文（下書き → 編集 → コピー → Slack で送ったら「依頼済みにする」）

      el("ct-req-box").innerHTML = `<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.message || "読み込めませんでした")}</div></div>

    }
    ctReq = d;
    el("ct-req-box").innerHTML = `
      <p class="hr-sub" style="margin:0 0 8px;">HR に登録した条件から作った<b>送信用の下書き</b>です。内容を確かめて必要なら直し、［文章をコピー］して Slack で${esc(who)}へ送ってください。
        <b>このシステムから Slack へは送りません。</b>相手に渡してよい内容かも確認してください。</p>
      ${d.missing.length ? `<div class="banner warn" id="ct-req-missing" style="display:block;margin:0 0 8px;"><b>要確認の項目があります（${d.missing.length}件）</b>
        <div style="margin-top:2px;">${esc(d.missing.join("・"))}</div>
        <div style="font-size:11.5px;margin-top:2px;">文中では【要確認】になっています（架空の値では埋めません）。条件を入れてから作り直すか、確認をお願いする場合はそのまま送ってください。</div></div>` : ""}
      <label for="ct-req-text">依頼文（${esc(d.docName)}）</label>
      <textarea id="ct-req-text" rows="16" style="font-size:12.5px;">${esc(d.text)}</textarea>
      <div class="hr-ct-act" style="margin-top:8px;">
        <button class="btn btn-secondary" id="ct-req-copy" onclick="copyContractRequest(this)">文章をコピー</button>
        ${detail.salaryVisible !== false ? `<button class="btn btn-secondary" id="ct-req-draftpdf" onclick="openOfferPdf('${esc(contract.offer.id)}', 'preview', this)">条件案PDF（依頼の参考）</button>` : ""}
        <span class="muted" id="ct-req-copied" aria-live="polite" style="font-size:12px;"></span></div>
      <section class="hr-flow-sec" style="margin-top:12px;">
        <div class="hr-flow-hd"><h3>Slack で送ったら</h3></div>
        <label class="hr-ct-check"><input type="checkbox" id="ct-req-sent" onchange="el('ct-req-done').disabled=!this.checked">
          <span>Slack で${esc(who)}へ送りました（コピーしただけでは記録しません）</span></label>
        <label for="ct-req-note" style="margin-top:6px;">メモ（任意・送ったチャンネルなど）</label>
        <input id="ct-req-note" type="text" maxlength="300" placeholder="例：#労務相談 で依頼">
      </section>
      <div id="ct-req-msg" class="err-text"></div>
      <div class="hr-of-actions">
        <button class="btn btn-primary" id="ct-req-done" disabled onclick="submitContractRequested(this)">${esc(who)}へ依頼済みにする</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`;
  }
  async function copyContractRequest(btn) {
    const ta = el("ct-req-text");
    const note = el("ct-req-copied");
    try { await navigator.clipboard.writeText(ta.value); note.textContent = "コピーしました（Slack へは送っていません）"; }
    catch { ta.focus(); ta.select(); note.textContent = "選択しました。Ctrl+C（⌘+C）でコピーしてください"; }
  }
  async function submitContractRequested(btn) {
    const msg = el("ct-req-msg"); msg.textContent = "";
    if (!el("ct-req-sent").checked) { msg.textContent = "Slack で送ったことを確かめてから押してください"; return; }
    try {
      await KPLayout.busy(btn, "記録中…", () => contractPost("markRequested", { kind: ctReq?.kind, note: el("ct-req-note").value, missingLabels: ctReq?.missing || [] }));
      await contractDone();
    } catch (e) { msg.textContent = e.hint || e.message || "記録できませんでした"; }
  }

  // ② 社労士が作った正式PDFを受け取る（PDF・15MB まで・パスワードなし）
  function openContractUpload() {
    const kinds = contract.docKinds || [];
    const def = contract.defaultDocKind;
    openActionModal(`<h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">正式PDFを受け取る</h2>
      <p class="hr-sub" style="margin:0 0 10px;">${esc(contract.attorneyLabel)}から届いたPDFをアップロードします（PDF・15MB まで・パスワードなし）。
        受け取ると、版と SHA-256（あとで同じファイルかを確かめるための値）を記録します。</p>
      <label for="ct-up-file">PDF ファイル</label>
      <input id="ct-up-file" type="file" accept="application/pdf,.pdf">
      <div class="hr-of-grid" style="margin-top:10px;">
        <div><label for="ct-up-kind">書類の種類</label><select id="ct-up-kind" onchange="el('ct-up-title').value=this.options[this.selectedIndex].text">
          ${kinds.map((k) => `<option value="${esc(k.key)}" ${k.key === def ? "selected" : ""}>${esc(k.label)}</option>`).join("")}</select></div>
        <div><label for="ct-up-title">書類名</label><input id="ct-up-title" type="text" maxlength="100" value="${esc((kinds.find((k) => k.key === def) || kinds[0] || {}).label || "")}"></div>
        <div><label for="ct-up-date">受領日</label><input id="ct-up-date" type="date" value="${esc(contract.today)}" max="${esc(contract.today)}"></div>
        <div><label for="ct-up-author">作成者（任意）</label><input id="ct-up-author" type="text" maxlength="100" placeholder="〇〇社労士事務所"></div>
      </div>
      <div id="ct-up-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="hr-of-actions">
        <button class="btn btn-primary" id="ct-up-go" onclick="submitContractUpload(this)">アップロードして受け取る</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`);
  }
  async function submitContractUpload(btn) {
    const msg = el("ct-up-msg"); msg.textContent = "";
    const file = el("ct-up-file").files?.[0];
    if (!file) { msg.textContent = "PDF ファイルを選んでください"; return; }
    if (!/\.pdf$/i.test(file.name)) { msg.textContent = "PDF（.pdf）を選んでください"; return; }
    if (file.size > (contract.maxBytes || 15728640)) { msg.textContent = "15MB までの PDF を選んでください"; return; }
    if (!el("ct-up-date").value) { msg.textContent = "受領日を入れてください"; return; }
    try {
      await KPLayout.busy(btn, "アップロード中…", async () => {
        const sign = await contractPost("uploadUrl", { fileName: file.name, size: file.size });
        const put = await fetch(sign.uploadUrl, { method: "PUT", headers: { "Content-Type": "application/pdf", "x-upsert": "false" }, body: file });
        if (!put.ok) throw new Error(`アップロードに失敗しました（${put.status}）`);
        await contractPost("attach", { path: sign.path, docKind: el("ct-up-kind").value, title: el("ct-up-title").value,
          receivedOn: el("ct-up-date").value, authorName: el("ct-up-author").value, fileName: file.name });
      });
      await contractDone();
    } catch (e) { msg.textContent = e.hint || e.message || "受け取れませんでした"; }
  }

        ${checks.map((c) => `<label class="hr-ct-check"><input type="checkbox" data-ct-check="${esc(c.key)}" onchange="ctReviewReady()"><span>${esc(c.label)}</span></label>`).join("")}

  function ctReviewReady() {

  async function submitContractApprove(btn, docId) {
    const msg = el("ct-rv-msg"); msg.textContent = "";

  }

      body.url = el("ct-ls-url").value.trim();
      body.sameDoc = el("ct-ls-same").checked;
      if (!/^https:\/\/\S+$/i.test(body.url)) { msg.textContent = "https:// で始まる URL を入力してください"; return; }
      if (!body.sameDoc) { msg.textContent = "LegalSign に登録したのが、承認した正式PDFと同じであることを確かめてください"; return; }
    }
    try { await KPLayout.busy(btn, "記録中…", () => contractPost("legalsign", body)); await contractDone(); }
    catch (e) { msg.textContent = e.hint || e.message || "記録できませんでした"; }
  }

  // ⑥ 締結を確かめて記録（社長・管理者・人事。本人のHRでの同意とは別の記録）
  function openContractSigned() {
    const o = contract.offer;
    const d = ctOfferDocs().find((x) => x.sent);
    const other = o.contractRoute === "other";
    openActionModal(`<h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">締結を確かめて記録</h2>
      <p class="hr-sub" style="margin:0 0 10px;">${other ? "例外ルート（紙・対面など）" : "LegalSign"}で締結したことを、証跡で確かめてから記録します（取り消せません）。
        本人のHRでの条件同意とは別の記録です。同意がまだでも記録できます（Office への引き渡しは、同意と締結の両方がそろってから）。</p>
      <label for="ct-sg-evidence">確かめた証跡 <span style="color:#b3261e;">*</span></label>
      <textarea id="ct-sg-evidence" rows="3" maxlength="1000" oninput="ctSignedReady()"
        placeholder="${other ? "例：双方押印の雇用契約書を確認・原本は総務で保管" : "例：LegalSign の締結完了の通知と、締結済みPDFを確認"}"></textarea>
      <label for="ct-sg-ref" style="margin-top:8px;">${other ? "契約書の番号など（任意）" : "LegalSign の文書ID・契約番号（任意）"}</label>
      <input id="ct-sg-ref" type="text" maxlength="200">
      <label class="hr-ct-check"><input type="checkbox" id="ct-sg-same" onchange="ctSignedReady()">
        <span>締結した書類は、本人へ案内した正式PDF（${esc(d?.title || o.noticeTitle || "")}・受領第${esc(d?.revision || "")}版・SHA-256 ${esc(ctShort(d?.sha256))}）と同じです</span></label>
      <div id="ct-sg-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="hr-of-actions">
        <button class="btn btn-primary" id="ct-sg-go" disabled onclick="submitContractSigned(this)">締結を記録する</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`);
  }
  function ctSignedReady() { el("ct-sg-go").disabled = !el("ct-sg-same").checked || !el("ct-sg-evidence").value.trim(); }
  async function submitContractSigned(btn) {
    const msg = el("ct-sg-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "記録中…", () => contractPost("signed", {
        evidence: el("ct-sg-evidence").value, contractRef: el("ct-sg-ref").value, sameDoc: el("ct-sg-same").checked }));
      await contractDone();
    } catch (e) { msg.textContent = e.hint || e.message || "記録できませんでした"; }
  }

  // 条件を直す（確定を取り消す。受け取った正式PDFは使わなくなり、社労士へ依頼し直す）
  async function contractReopen() {
    if (!confirm("条件を直しますか？\n確定を取り消し、受け取った正式PDFは使わなくなります（直したあと、社労士へ依頼し直します）。")) return;
    try {
      await contractPost("reopen", {});
      await refreshDetail("docs");
      load();
      openOfferForm();
    } catch (e) { alert(e.hint || e.message || "条件を直せませんでした"); }
  }

  // LegalSign の案内メール（本人へ案内したあと。同意の前でもよい）。送った記録には URL を残さない
  async function openContractFormalMail() {
    formalFlow = { offerId: contract.offer.id, mail: null, key: newMailKey(), official: true };
    openActionModal(`<h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">LegalSign の案内メール</h2>
      <p class="hr-sub" style="margin:0 0 8px;">LegalSign からの通知とは別に、署名の URL を本人へ案内するときに使います。本人の条件同意とは別の手続きです。</p>
      <div id="fc-mail"><div class="empty">読み込み中…</div></div>
      <div id="fc-msg" class="err-text" style="margin:10px 0 0;"></div>
      <div class="hr-of-actions"><button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`, { wide: true });
    await openFormalMail(null);
  }

  async function startAdvance() {
    try {
      await API.claimHrAdvance(detail.applicant.id);
      location.href = `../admin-onboard.html?applicantId=${encodeURIComponent(detail.applicant.id)}`;
    } catch (e) { alert(e.hint || e.detail || e.message || "本採用の手続きを始められませんでした"); }
  }
</script>

</body>
</html>
