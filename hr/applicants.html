<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>応募者 - EIGHT HR</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20260929b">
  <style>
    body { font-family:'Zen Kaku Gothic New', sans-serif; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    h1.hr-title { font-size:24px; font-weight:700; color:#1b2440; margin:0 0 4px; }
    .hr-sub { color:#6b7080; font-size:13px; margin:0 0 20px; }

    .hr-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    .hr-toolbar input[type="text"] { max-width:240px; margin:0; }
    .hr-stage-tabs { display:flex; gap:6px; flex-wrap:wrap; }
    .hr-stage-tabs button { border:1px solid #e2e2dc; background:#fff; border-radius:999px; padding:6px 13px;
      font-size:12px; font-weight:500; color:#4a5068; cursor:pointer; font-family:inherit; }
    .hr-stage-tabs button.on { background:#1b2440; border-color:#1b2440; color:#fff; font-weight:700; }

    .hr-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e2e2dc; border-radius:10px; overflow:hidden; }
    .hr-table th { text-align:left; font-size:11px; color:#6b7080; font-weight:700; padding:10px 14px;
      background:#f6f6f2; border-bottom:1px solid #e2e2dc; }
    .hr-table td { padding:12px 14px; border-bottom:1px solid #e2e2dc; font-size:13px; vertical-align:top; }
    .hr-table tr:last-child td { border-bottom:none; }
    .hr-table tr.click { cursor:pointer; }
    .hr-table tr.click:hover { background:#f6f6f2; }
    .hr-nm { font-weight:700; color:#1b2440; font-size:14px; display:block; }
    .hr-sub2 { font-size:11.5px; color:#6b7080; display:block; margin-top:2px; }

    .hr-rank { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
      border-radius:5px; font-size:11px; font-weight:700; padding:0 6px; }
    .hr-rank.A { background:#1b2440; color:#fff; } .hr-rank.B { background:#e7eaf3; color:#1b2440; }
    .hr-rank.C { background:#efefeb; color:#4a5068; } .hr-rank.D { background:#f6f6f2; color:#9aa0b4; }

    .hr-pill { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px;
      font-size:11.5px; font-weight:600; }
    .hr-pill .material-symbols-outlined { font-size:14px; }

    .hr-drawer-bg { position:fixed; inset:0; background:rgba(27,36,64,.35); z-index:40; }
    .hr-drawer { position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; padding:22px; }
    .hr-detail { position:fixed; top:0; right:0; bottom:0; width:560px; max-width:94vw; background:#f6f6f2;
      z-index:41; box-shadow:-8px 0 24px rgba(27,36,64,.15); overflow-y:auto; padding:0; }

    /* モーダル＝1つの操作を実行する場所。ドロワー（詳細）の上に重ねて出す。
       閉じてもドロワーは閉じない（採用HR応募者一覧・ドロワーUI改善指示書 §4・§5） */
    .hr-modal-bg { position:fixed; inset:0; background:rgba(27,36,64,.45); z-index:50; }
    .hr-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:440px; max-width:92vw;
      max-height:86vh; overflow-y:auto; background:#fff; border-radius:14px; padding:22px; z-index:51;
      box-shadow:0 20px 60px rgba(27,36,64,.28); overscroll-behavior:contain; }
    /* 項目の多い操作（評価・合格通知・書類・応募者追加）。中だけスクロールする */
    .hr-modal.wide { width:680px; max-height:88vh; }
    /* 確認モーダル（削除など）は、書類のモーダルの上にも出せるように1段上げる */
    .hr-modal-bg.top { z-index:60; } .hr-modal.top { z-index:61; }

    /* 書類タブ */
    .hr-doc { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .hr-doc .t { font-size:13px; font-weight:700; color:#1b2440; display:flex; align-items:center; gap:6px; }
    .hr-doc .t .material-symbols-outlined { font-size:18px; color:#6b7080; }
    .hr-doc .f { font-size:13px; margin:6px 0 2px; word-break:break-all; }
    .hr-doc .m { font-size:11.5px; color:#6b7080; }
    .hr-doc .acts { display:flex; gap:6px; margin-top:10px; align-items:center; position:relative; flex-wrap:wrap; }
    .hr-doc .none { font-size:12.5px; color:#9aa0b4; margin:6px 0 0; }
    .hr-more { position:relative; }
    .hr-menu-pop { position:absolute; right:0; top:34px; background:#fff; border:1px solid #e2e2dc; border-radius:8px;
      box-shadow:0 8px 24px rgba(27,36,64,.14); min-width:160px; z-index:5; padding:4px 0; }
    .hr-menu-pop button { display:block; width:100%; text-align:left; border:none; background:none; padding:9px 14px;
      font-size:13px; color:#1b2440; cursor:pointer; font-family:inherit; }
    .hr-menu-pop button:hover { background:#f6f6f2; }
    .hr-menu-pop button.danger { color:#b3261e; }
    .hr-drop { border:2px dashed #cfd4e0; border-radius:10px; padding:22px; text-align:center; color:#6b7080;
      font-size:13px; cursor:pointer; background:#fafaf7; }
    .hr-drop.over { border-color:#1b2440; background:#eef0f6; color:#1b2440; }
    .hr-docs-mini { display:inline-flex; gap:8px; margin-left:6px; font-size:10.5px; color:#9aa0b4; white-space:nowrap; }
    .hr-docs-mini .ok { color:#256b36; }

    /* 選択中バー（Selection Action Bar）。1件以上チェックすると画面下部に固定表示する。
       ドロワー(41)・モーダル(51)より前面に出ないよう、z-indexは30〜35の範囲にとどめる */
    .hr-bulkbar { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      width:fit-content; min-width:520px; max-width:calc(100vw - 40px);
      display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #d8dce8;
      border-radius:13px; padding:12px 16px; font-size:13px; color:#1b2440; flex-wrap:wrap;
      box-shadow:0 12px 32px rgba(27,36,64,.18); z-index:32; }
    .hr-bulkbar .cnt { font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .hr-bulkbar .cnt .material-symbols-outlined { font-size:17px; color:#1b2440; }
    .hr-bulkbar .sp { flex:1; }
    @media (max-width:600px) {
      .hr-bulkbar { left:12px; right:12px; transform:none; width:auto; min-width:0; max-width:none; }
    }
    .hr-check-col { width:34px; }

    .hr-next { background:#e6f050; border-radius:10px; padding:16px 18px; margin:0 0 16px; }
    .hr-next .now { font-size:11px; color:#4a5068; margin-bottom:2px; }
    .hr-next .lb { font-size:11px; font-weight:700; color:#4a5068; display:flex; align-items:center; gap:5px; }
    .hr-next .lb .material-symbols-outlined { font-size:15px; }
    .hr-next h3 { font-size:18px; font-weight:700; color:#1b2440; margin:6px 0 8px; }
    .hr-next .meta { font-size:12px; color:#4a5068; margin-bottom:10px; }
    .hr-done-banner { background:#e5f1e2; color:#2f6f3a; border-radius:10px; padding:14px 16px;
      display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }

    .hr-tabs { display:flex; gap:2px; padding:0 20px; background:#fff; border-bottom:1px solid #e2e2dc; }
    .hr-tabs button { border:none; background:none; padding:12px 4px; margin-right:20px; font-size:13px;
      font-weight:600; color:#6b7080; cursor:pointer; border-bottom:3px solid transparent; font-family:inherit; }
    .hr-tabs button.on { color:#1b2440; border-bottom-color:#1b2440; }
    .hr-detail-body { padding:20px; }

    .hr-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:12.5px; }
    .hr-grid2 dt { color:#6b7080; margin-bottom:2px; } .hr-grid2 dd { margin:0 0 10px; color:#1b2440; font-weight:600; }

    .hr-tl { border-left:2px solid #e2e2dc; margin-left:6px; padding-left:16px; }
    .hr-tl .row { position:relative; padding-bottom:16px; }
    .hr-tl .row::before { content:""; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:999px; background:#1b2440; }
    .hr-tl .row .d { font-size:11px; color:#6b7080; } .hr-tl .row .l { font-size:13px; font-weight:600; color:#1b2440; }
    .hr-tl .row .now { display:inline-block; margin-left:6px; background:#1b2440; color:#fff; font-size:10px;
      font-weight:700; padding:1px 7px; border-radius:999px; }

    .hr-chip { display:inline-flex; align-items:center; gap:4px; background:#e7eaf3; color:#1b2440;
      border-radius:999px; padding:5px 11px; font-size:12px; margin:0 6px 6px 0; }
    .hr-chip button { border:none; background:none; cursor:pointer; color:#1b2440; font-weight:700; padding:0; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="hr-title">応募者</h1>
  <p class="hr-sub">選考中の応募者を一覧で見て、詳細は右ドロワーで開きます。</p>

  <div class="hr-toolbar">
    <input type="text" id="q" placeholder="氏名・職種で絞り込む" oninput="render()">
    <div class="hr-stage-tabs" id="stage-tabs"></div>
  </div>

  <div id="bulkbar"></div>

  <div style="overflow-x:auto;">
    <table class="hr-table">
      <thead><tr>
        <th class="hr-check-col"><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
        <th>応募者</th><th>選考</th><th>状態</th><th>NEXT</th><th>担当</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="modal-root"></div>
<div id="action-root"></div>
<div id="hr-modal-root"></div>
<div id="confirm-root"></div>

<script src="../js/api-client.js?v=20260929b"></script>
<script src="../js/layout.js?v=20260929b"></script>
<script src="../js/hr-layout.js?v=20260929b"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = HRLayout.esc;

  const STAGES = [
    { key: "applied", label: "新規応募" }, { key: "casual_interview", label: "カジュアル面談" },
    { key: "ceo_recommend", label: "社長推薦" }, { key: "ceo_interview", label: "社長面談" },
    { key: "offer", label: "内定" }, { key: "joining_scheduled", label: "入社予定" },
  ];
  const STATUS_COLOR = {
    todo: ["#efefeb", "#4a5068", "remove"], scheduling: ["#e7eaf3", "#1b2440", "calendar_month"],
    interview_scheduled: ["#e7eaf3", "#1b2440", "video_call"], eval_pending: ["#fbf1d6", "#7d5a00", "edit_note"],
    ceo_recommend_pending: ["#fbf1d6", "#7d5a00", "recommend"], ceo_interview_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    ceo_decision_pending: ["#fbf1d6", "#7d5a00", "pending_actions"], next_scheduling_pending: ["#e7eaf3", "#1b2440", "calendar_month"],
    offer_draft_pending: ["#fbf1d6", "#7d5a00", "description"], offer_review_pending: ["#fbf1d6", "#7d5a00", "fact_check"],
    offer_send_pending: ["#fbf1d6", "#7d5a00", "send"], offer_sent: ["#e7eaf3", "#1b2440", "mark_email_read"],
    offer_viewed: ["#e5f1e2", "#2f6f3a", "visibility"], offer_resend_pending: ["#fbf1d6", "#7d5a00", "send"],
    offer_response_pending: ["#e7eaf3", "#1b2440", "hourglass_empty"],
    accepted: ["#e5f1e2", "#2f6f3a", "check_circle"], declined: ["#efefeb", "#4a5068", "remove"],
    done: ["#e5f1e2", "#2f6f3a", "check_circle"], passed: ["#efefeb", "#4a5068", "remove"],
  };
  const OVERDUE_COLOR = ["#fdecea", "#b3261e", "error"];
  const STATUS_LABEL = {
    todo: "未対応", scheduling: "日程調整中", interview_scheduled: "面談予定",
    eval_pending: "評価入力待ち", ceo_recommend_pending: "社長推薦待ち",
    ceo_interview_pending: "社長面談設定待ち", ceo_decision_pending: "社長判断待ち",
    next_scheduling_pending: "次回調整待ち", offer_draft_pending: "合格通知作成待ち",
    offer_review_pending: "社内確認待ち", offer_send_pending: "本人送付待ち",
    offer_sent: "本人送付済み", offer_viewed: "本人が閲覧済み", offer_resend_pending: "URL再送待ち",
    offer_response_pending: "承諾待ち", accepted: "承諾済み", declined: "辞退",
    done: "完了", passed: "見送り",
  };

  let applicants = [];
  let employees = [];
  let meEmployeeId = null;   // 応募者を追加するときの担当の初期値（登録する本人）
  /** 担当の選択肢（一括変更・追加・詳細で同じもの） */
  const recruiterOptions = (selected) => `<option value="">未定</option>` + employees.map((e) =>
    `<option value="${esc(e.id)}" ${e.id === selected ? "selected" : ""}>${esc(e.display_name)}</option>`).join("");
  let stageFilter = "";
  let openId = null;
  let canDecide = false;
  // 一覧の複数選択（ページ内表示分だけを対象にする。README §1）
  let selectedIds = new Set();
  let visibleIds = [];

  HRLayout.init({ active: "applicants" }).then((ctx) => { if (ctx) { canDecide = ctx.canDecide; start(); } });

  function start() {
    renderStageTabs();
    load();
    const q = new URLSearchParams(location.search);
    if (q.get("new")) openAdd();
    if (q.get("id")) openDetail(q.get("id"));
  }

  function renderStageTabs() {
    el("stage-tabs").innerHTML = `<button class="${!stageFilter ? "on" : ""}" onclick="setStage('')">すべて</button>`
      + STAGES.map((s) => `<button class="${stageFilter === s.key ? "on" : ""}" onclick="setStage('${s.key}')">${esc(s.label)}</button>`).join("");
  }
  function setStage(key) { stageFilter = key; renderStageTabs(); render(); }

  let loading = null;   // 一覧の読み込み中（追加フォームが担当の選択肢を待つため）
  function load() { loading = loadList().finally(() => { loading = null; }); return loading; }
  async function loadList() {
    try {
      const res = await API.listHrApplicants();
      if (res.notReady) {
        el("rows").innerHTML = `<tr><td colspan="7"><div class="banner warn">
          <span class="material-symbols-outlined">build</span><div>${esc(res.message)}</div></div></td></tr>`;
        return;
      }
      applicants = res.applicants || [];
      employees = res.employees || [];
      meEmployeeId = res.meEmployeeId || null;
      render();
    } catch (e) {
      el("rows").innerHTML = `<tr><td colspan="7"><div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>取得に失敗しました：${esc(e.hint || e.detail || e.message)}</div></div></td></tr>`;
    }
  }

  // 書類のそろい具合。一覧を重くしないよう、小さく灰色で（そろっているものだけ緑）
  function docsMini(d) {
    if (!d) return "";
    const one = (ok, label) => `<span class="${ok ? "ok" : ""}" title="${label}${ok ? "：登録済み" : "：未登録"}">${label} ${ok ? "✓" : "—"}</span>`;
    return `<span class="hr-docs-mini" data-docs>${one(d.resume, "履歴書")}${one(d.workHistory, "職務経歴書")}</span>`;
  }

  function render() {
    const q = (el("q").value || "").trim().toLowerCase();
    const list = applicants.filter((a) =>
      (!stageFilter || a.stage === stageFilter)
      && (!q || `${a.name} ${a.jobTitle}`.toLowerCase().includes(q)));
    visibleIds = list.map((a) => a.id);

    if (!list.length) {
      el("rows").innerHTML = `<tr><td colspan="7" class="empty">対象がありません。</td></tr>`;
      renderBulkBar();
      return;
    }
    el("rows").innerHTML = list.map((a) => {
      const [bg, fg, icon] = a.overdue ? OVERDUE_COLOR : (STATUS_COLOR[a.status] || STATUS_COLOR.todo);
      const statusLabel = a.overdue ? "期限超過" : a.statusLabel;
      return `
      <tr class="click" onclick="openDetail('${esc(a.id)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox" ${selectedIds.has(a.id) ? "checked" : ""}
          onchange="toggleSelect('${esc(a.id)}', this.checked)"></td>
        <td><span class="hr-nm">${esc(a.name)}</span><span class="hr-sub2">${esc(a.jobTitle)} ／ ${esc(a.source)}${docsMini(a.docs)}</span></td>
        <td>${esc(a.stageLabel)}${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:6px;">${esc(a.rank)}</span>` : ""}</td>
        <td><span class="hr-pill" style="background:${bg};color:${fg};">
          <span class="material-symbols-outlined">${icon}</span>${esc(statusLabel)}</span></td>
        <td>${esc(a.nextAction)}${a.decisionDueOn ? `<span class="hr-sub2">期限 ${esc(a.decisionDueOn)}</span>` : ""}</td>
        <td>${esc(a.recruiterName || "未定")}</td>
        <td style="text-align:right;"><span class="material-symbols-outlined" style="color:#9aa0b4;">chevron_right</span></td>
      </tr>`;
    }).join("");
    renderBulkBar();
  }

  // ---- 複数選択・一括操作 -----------------------------------------------------------
  // 全選択は「いま表示している分（visibleIds）」だけを対象にする。
  // 意図せず全DBを対象にしない（README §1）
  function toggleSelectAll(checked) {
    if (checked) visibleIds.forEach((id) => selectedIds.add(id));
    else visibleIds.forEach((id) => selectedIds.delete(id));
    render();
  }

  function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
    renderBulkBar();
    updateSelectAllCheckbox();
  }

  function updateSelectAllCheckbox() {
    const box = el("chk-all");
    if (!box) return;
    const selectedOnPage = visibleIds.filter((id) => selectedIds.has(id)).length;
    box.checked = visibleIds.length > 0 && selectedOnPage === visibleIds.length;
    box.indeterminate = selectedOnPage > 0 && selectedOnPage < visibleIds.length;
  }

  function clearSelection() { selectedIds.clear(); render(); }

  function renderBulkBar() {
    updateSelectAllCheckbox();
    const box = el("bulkbar");
    if (!selectedIds.size) { box.innerHTML = ""; return; }
    box.innerHTML = `
      <div class="hr-bulkbar">
        <span class="cnt"><span class="material-symbols-outlined">check_circle</span>${selectedIds.size}名選択中</span>
        <span class="sp"></span>
        <button class="btn btn-secondary btn-sm" onclick="openBulkStatusModal()">ステータス変更</button>
        <button class="btn btn-secondary btn-sm" onclick="openBulkRecruiterModal()">担当変更</button>
        <button class="btn btn-danger btn-sm" onclick="openBulkDeleteModal()">削除</button>
        <button class="btn btn-secondary btn-sm" onclick="clearSelection()">選択解除</button>
      </div>`;
  }

  // ---- モーダル（1つの操作を実行する場所）。ドロワーの上に重ねて出し、
  // 閉じてもドロワーは閉じない（README §4・§5） ------------------------------------
  function openHrModal(html) {
    el("hr-modal-root").innerHTML = `<div class="hr-modal-bg" onclick="closeHrModal()"></div><div class="hr-modal">${html}</div>`;
  }
  function closeHrModal() { el("hr-modal-root").innerHTML = ""; }

  function openBulkStatusModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">ステータス変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名のステータスを変更します。</p>
      <label>変更後のステータス</label>
      <select id="bs-status">${Object.entries(STATUS_LABEL).map(([k, l]) =>
        `<option value="${esc(k)}">${esc(l)}</option>`).join("")}</select>
      <div id="bs-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkStatus(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkStatus(btn) {
    const msg = el("bs-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "変更中…", () => API.setHrApplicantsStatus(ids, el("bs-status").value));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "変更できませんでした"; }
  }

  function openBulkRecruiterModal() {
    const n = selectedIds.size;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">担当変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${n}名の採用担当を変更します。</p>
      <label>担当者</label>
      <select id="br-recruiter">
        <option value="">（未定にする）</option>
        ${employees.map((e) => `<option value="${esc(e.id)}">${esc(e.display_name)}</option>`).join("")}
      </select>
      <div id="br-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitBulkRecruiter(this)">変更する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitBulkRecruiter(btn) {
    const msg = el("br-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "変更中…", () => API.setHrApplicantsRecruiter(ids, el("br-recruiter").value || null));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "変更できませんでした"; }
  }

  // 削除は選考終了（見送り・辞退）とは別の操作。応募者レコードそのものを消す（README §2・§6）
  function openBulkDeleteModal() {
    const picked = applicants.filter((a) => selectedIds.has(a.id));
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 10px;">
        ${picked.length === 1 ? "この応募者を削除しますか？" : `${picked.length}名の応募者を削除します`}</h2>
      ${picked.length === 1
        ? `<div style="font-size:14px;font-weight:700;color:#1b2440;">${esc(picked[0].name)}</div>
           <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(picked[0].email || "メール未登録")}</div>`
        : `<ul style="margin:0;padding-left:18px;font-size:12.5px;color:#4a5068;max-height:160px;overflow-y:auto;">
             ${picked.map((a) => `<li>${esc(a.name)}</li>`).join("")}</ul>`}
      <p class="muted" style="font-size:12px;margin-top:14px;">
        削除すると、面談・合格通知の記録も一緒に削除されます。元に戻せません。</p>
      <div id="bd-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitBulkDelete(this)">削除する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>
      </div>`);
  }

  async function submitBulkDelete(btn) {
    const msg = el("bd-msg"); msg.textContent = "";
    const ids = [...selectedIds];
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteHrApplicants(ids));
      closeHrModal();
      selectedIds.clear();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "削除できませんでした"; }
  }

  // ---- 応募者を追加（右ドロワー） ------------------------------------------------
  const SOURCE_HISTORY_KEY = "hr_sources";
  function sourceSuggestions() {
    const fromData = [...new Set(applicants.map((a) => a.source).filter(Boolean))];
    return fromData.length ? fromData : ["リファラル", "Wantedly", "Green", "エージェント", "自社サイト"];
  }

  async function openAdd() {
    // 担当の選択肢（社員一覧）は一覧の読み込みで届く。まだなら待ってから開く
    if (!employees.length && loading) await loading;
    closeModal();
    const root = el("modal-root");
    root.innerHTML = `
      <div class="hr-modal-bg" onclick="closeModal()"></div>
      <div class="hr-modal wide" role="dialog" aria-modal="true">
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 16px;">応募者を追加</h2>
        <label>氏名 <span style="color:#b3261e;">*</span></label>
        <input id="a-name" type="text">
        <label style="margin-top:10px;">応募職種 <span style="color:#b3261e;">*</span></label>
        <input id="a-job" type="text">
        <label style="margin-top:10px;">応募媒体 <span style="color:#b3261e;">*</span></label>
        <div id="a-sources">${sourceSuggestions().map((s) => `
          <label class="hr-chip" style="cursor:pointer;">
            <input type="radio" name="a-source" value="${esc(s)}" style="width:auto;margin:0 4px 0 0;">${esc(s)}
          </label>`).join("")}</div>
        <input id="a-source-other" type="text" placeholder="その他（自由入力）" style="margin-top:6px;">
        <label style="margin-top:10px;">担当</label>
        <select id="a-recruiter">${recruiterOptions(meEmployeeId)}</select>
        <p class="muted" style="font-size:12px;margin:4px 0 0;">NEXT ACTION はこの人に届きます。あとから詳細の「担当」で変更できます。</p>
        <label style="margin-top:10px;">メール</label><input id="a-email" type="email">
        <label style="margin-top:10px;">電話</label><input id="a-phone" type="text">
        <label style="margin-top:10px;">プロフィールURL</label><input id="a-url" type="text">
        <label style="margin-top:10px;">メモ</label><textarea id="a-note" rows="3"></textarea>
        <div id="a-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitAdd(this)">追加する</button>
          <button class="btn btn-secondary" onclick="closeModal()">閉じる</button>
        </div>
      </div>`;
  }

  async function submitAdd(btn) {
    const msg = el("a-msg"); msg.textContent = "";
    const name = el("a-name").value.trim();
    const jobTitle = el("a-job").value.trim();
    const picked = document.querySelector('input[name="a-source"]:checked');
    const source = (el("a-source-other").value.trim()) || (picked ? picked.value : "");
    if (!name) { msg.textContent = "氏名を入力してください"; return; }
    if (!jobTitle) { msg.textContent = "応募職種を入力してください"; return; }
    if (!source) { msg.textContent = "応募媒体を選ぶか入力してください"; return; }

    try {
      await KPLayout.busy(btn, "追加中…", () => API.createHrApplicant({
        name, jobTitle, source,
        recruiterId: el("a-recruiter").value || null,
        email: el("a-email").value.trim() || undefined,
        phone: el("a-phone").value.trim() || undefined,
        profileUrl: el("a-url").value.trim() || undefined,
        note: el("a-note").value.trim() || undefined,
      }));
      closeModal();
      history.replaceState({}, "", "/hr/applicants.html");
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "追加できませんでした"; }
  }

  // ---- 応募者詳細（右ドロワー） --------------------------------------------------
  let detail = null;
  let detailTab = "overview";

  async function openDetail(id) {
    // 同じ応募者を開き直す場合（各操作後の再読み込み）は、いま見ているタブを保つ。
    // 呼び出し側が detailTab = "interviews" を先に指定してから呼ぶケースがあるため
    // （openIdはcloseModal()内でnullに戻るため、判定にはdetailの中身を使う）
    if (detail?.applicant?.id !== id) detailTab = "overview";
    openId = id;
    closeModal();
    const root = el("modal-root");
    root.innerHTML = `<div class="hr-drawer-bg" onclick="closeModal()"></div>
      <div class="hr-detail" id="hr-detail-box"><div class="empty" style="padding:40px;">読み込み中…</div></div>`;
    history.replaceState({}, "", `/hr/applicants.html?id=${encodeURIComponent(id)}`);
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      renderDetail();
    } catch (e) {
      el("hr-detail-box").innerHTML = `<div class="banner err" style="margin:20px;">
        <span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.detail || e.message)}</div></div>`;
    }
  }

  /**
   * 開いたままの応募者詳細を、取り直して描き直す（各操作の保存後）。
   * ドロワーは閉じない。いま見ているタブも保つ（tab を渡したときはそのタブへ）
   */
  async function refreshDetail(tab) {
    const id = detail?.applicant?.id;
    if (!id) return;
    if (tab) detailTab = tab;
    try {
      const [d] = await Promise.all([API.getHrApplicant(id), loadDocs(id)]);
      detail = d;
      if (el("hr-detail-box")) renderDetail();
    } catch (e) {
      alert(e.hint || e.detail || e.message || "再読み込みできませんでした");
    }
  }

  // ---- 書類（履歴書・職務経歴書・その他） ------------------------------------------
  let docs = null;       // { documents:[{docType,label,icon,latest,history}], limits }
  let docsError = null;
  async function loadDocs(id) {
    try { docs = await API.hrDocuments(id); docsError = null; }
    catch (e) { docs = null; docsError = e.message || e.hint || "書類を読み込めませんでした"; }
  }

  function closeModal() {
    el("modal-root").innerHTML = "";
    el("action-root").innerHTML = "";
    openId = null;
    history.replaceState({}, "", "/hr/applicants.html");
  }

  function setDetailTab(t) { detailTab = t; renderDetail(); }

  function renderDetail() {
    const a = detail.applicant;
    const box = el("hr-detail-box");
    if (!box) return;
    const TABS = [["overview", "概要"], ["interviews", "面談"], ["docs", "書類"], ["history", "履歴"]];
    if (!TABS.some(([k]) => k === detailTab)) detailTab = "overview";
    box.innerHTML = `
      <div style="padding:20px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:18px;font-weight:700;color:#1b2440;">${esc(a.name)}
            ${a.rank ? `<span class="hr-rank ${esc(a.rank)}" style="margin-left:8px;">${esc(a.rank)}</span>` : ""}</div>
          <div style="font-size:12.5px;color:#6b7080;margin-top:2px;">${esc(a.jobTitle)} ／ ${esc(a.source)}</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">閉じる</button>
      </div>
      <div class="hr-tabs">${TABS.map(([k, l]) =>
        `<button class="${detailTab === k ? "on" : ""}" data-tab="${k}" onclick="setDetailTab('${k}')">${l}</button>`).join("")}</div>
      <div class="hr-detail-body" id="hr-detail-tab"></div>`;
    renderDetailTab();
  }

  /** NEXT ACTION と、その1つの CTA（原則1つ） */
  function nextActionBox(a) {
    return `
      <div class="hr-next" style="margin:0 0 16px;">
        <div class="now">現在：${esc(a.statusLabel)}</div>
        <div class="lb"><span class="material-symbols-outlined">bolt</span>NEXT ACTION</div>
        <h3>${esc(a.nextAction)}</h3>
        <div class="meta">担当：${esc(a.recruiterName || "未定")}${a.decisionDueOn ? `　期限：${esc(a.decisionDueOn)}` : ""}</div>
        ${a.nextActionCta && (!["decide", "advance"].includes(a.nextActionKey) || canDecide)
          ? `<button class="btn btn-primary btn-sm" onclick="runNextAction()">${esc(a.nextActionCta)}</button>`
          : a.nextActionKey === "decide"
            ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">採用判断は社長・管理者が行います。</p>`
            : a.nextActionKey === "advance"
              ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">本採用へ進めるのは社長・管理者が行います。</p>`
              : a.status === "done" && a.employeeId
                ? `<a class="btn btn-secondary btn-sm" href="../admin-probation.html?employeeId=${esc(a.employeeId)}">試用期間の管理へ</a>` : ""}
      </div>`;
  }

  /** いちばん新しい、評価済みの面談 */
  function latestEvaluation() {
    return (detail.interviews || []).find((i) => i.rank) || null;
  }

  function renderDetailTab() {
    const a = detail.applicant;
    const box = el("hr-detail-tab");
    if (detailTab === "overview") {
      const ev = latestEvaluation();
      const evLine = ev ? (detail.evalItems || []).filter((e) => ev.scores?.[e.key])
        .map((e) => `${esc(e.label)} ${esc(scaleLabel(ev.scores[e.key]))}`).join("　") : "";
      const missing = docMissingLabels();
      box.innerHTML = `
        ${nextActionBox(a)}
        <dl class="hr-grid2">
          <div><dt>応募経路</dt><dd>${esc(a.source || "—")}</dd></div>
          <div><dt>応募職種</dt><dd>${esc(a.jobTitle || "—")}</dd></div>
          <div><dt>現在ステータス</dt><dd>${esc(a.statusLabel || "—")}</dd></div>
          <div><dt>担当</dt><dd id="hr-recruiter">${esc(a.recruiterName || "未定")}
            <button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="openRecruiterModal()">変更</button></dd></div>
          <div><dt>メール</dt><dd>${esc(a.email || "—")}</dd></div>
          <div><dt>電話</dt><dd>${esc(a.phone || "—")}</dd></div>
          <div><dt>ランク</dt><dd>${a.rank ? `<span class="hr-rank ${esc(a.rank)}">${esc(a.rank)}</span> ${esc((detail.rankLabel || {})[a.rank] || "")}` : "—"}</dd></div>
          <div><dt>最新評価</dt><dd>${ev ? `${esc(ev.kindLabel)}：${esc(ev.rank)}${evLine ? `<br><small class="muted">${evLine}</small>` : ""}` : "まだありません"}</dd></div>
          <div><dt>雇用形態</dt><dd>${esc(a.employmentType || "—")}</dd></div>
          <div><dt>入社予定日</dt><dd>${esc(a.joinDate || "—")}</dd></div>
          <div><dt>給与</dt><dd>${a.wageAmount ? `${esc(a.wageType || "")} ${Number(a.wageAmount).toLocaleString("ja-JP")}円` : "—"}</dd></div>
          <div><dt>勤務地</dt><dd>${esc(a.workLocation || "—")}</dd></div>
        </dl>
        ${missing.length ? `<p class="muted" style="font-size:12px;margin:12px 0 0;">
          ${esc(missing.join("・"))}が未登録です。<a href="#" onclick="setDetailTab('docs');return false;">書類タブ</a>から登録できます。</p>` : ""}
        ${(detail.offers || []).length ? `
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">合格通知</h4>
        ${detail.offers.map(offerRow).join("")}` : ""}`;
    } else if (detailTab === "interviews") {
      box.innerHTML = `
        <button class="btn btn-secondary btn-sm" onclick="openScheduleForm()" style="margin-bottom:12px;">
          <span class="material-symbols-outlined icon-inline">add</span>面談を予定する</button>
        ${(detail.interviews || []).length ? detail.interviews.map(interviewRow).join("")
          : `<p class="muted">まだ面談の記録がありません。</p>`}`;
    } else if (detailTab === "docs") {
      box.innerHTML = renderDocsTab();
    } else {
      box.innerHTML = `
        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">選考タイムライン</h4>
        <div class="hr-tl">${(detail.timeline || []).map((t, i, arr) => `
          <div class="row"><div class="d">${esc(fmtDate(t.occurredAt))}</div>
            <div class="l">${esc(t.label)}${t.detail ? `　${esc(t.detail)}` : ""}${i === arr.length - 1 ? `<span class="now">← 現在</span>` : ""}</div>
          </div>`).join("") || `<p class="muted">まだ記録がありません。</p>`}</div>`;
    }
  }

  // ---- 書類タブ ---------------------------------------------------------------------
  const fmtDay = (iso) => (iso ? new Date(iso).toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" }) : "");
  const fmtSize = (n) => (n ? (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`) : "");
  const docGroup = (type) => (docs?.documents || []).find((d) => d.docType === type) || null;

  /** 履歴書・職務経歴書のうち、まだ無いもの */
  function docMissingLabels() {
    if (!docs) return [];
    return ["resume", "work_history"].map(docGroup).filter((g) => g && !g.latest).map((g) => g.label);
  }

  function renderDocsTab() {
    if (docsError) return `<div class="banner warn"><span class="material-symbols-outlined">info</span><div>${esc(docsError)}</div></div>`;
    if (!docs) return `<p class="muted">読み込み中…</p>`;
    const main = ["resume", "work_history"].map(docGroup).filter(Boolean);
    const other = docGroup("other");
    const card = (g, d) => `
      <div class="hr-doc" data-doc="${esc(g.docType)}">
        <div class="t"><span class="material-symbols-outlined">${esc(g.icon)}</span>${esc(g.label)}</div>
        ${d ? `
          <div class="f">${esc(d.filename)}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))} アップロード${d.sizeBytes ? `・${esc(fmtSize(d.sizeBytes))}` : ""}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}${g.history.length ? `・過去の版 ${g.history.length}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
                <button onclick="openDocHistory('${esc(g.docType)}')">履歴を見る</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>` : `
          <div class="none">未登録</div>
          <div class="acts"><button class="btn btn-primary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">アップロード</button></div>`}
      </div>`;
    const others = other ? [other.latest, ...other.history].filter(Boolean) : [];
    return `
      ${main.map((g) => card(g, g.latest)).join("")}
      <div class="hr-doc" data-doc="other">
        <div class="t"><span class="material-symbols-outlined">attach_file</span>その他の書類</div>
        ${others.length ? others.map((d) => `
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
            <span class="f" style="margin:0;flex:1;min-width:160px;">${esc(d.filename)}
              <span class="m">　${esc(fmtDay(d.uploadedAt))}</span></span>
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>`).join("") : `<div class="none">未登録</div>`}
        <div class="acts"><button class="btn btn-secondary btn-sm" onclick="openUploadDoc('other')">アップロード</button></div>
      </div>
      <p class="muted" style="font-size:11.5px;margin:8px 0 0;">
        書類は採用担当・人事・管理者だけが見られます。表示用のリンクは数分で切れます。</p>`;
  }

  function toggleDocMenu(ev, id) {
    ev.stopPropagation();
    const m = el(`docmenu-${id}`);
    const open = m && m.classList.contains("hidden");
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
    if (m && open) m.classList.remove("hidden");
  }
  document.addEventListener("click", () => {
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
  });

  const findDoc = (id) => (docs?.documents || []).flatMap((g) => [g.latest, ...g.history]).find((d) => d && d.id === id);

  // プレビューは別タブの書類専用ページ（hr/document.html）で開く。
  // この画面の中には PDF を出さない（ドロワー・一覧・スクロール位置・選考の状態はそのまま）。
  // 別タブ側で、採用HRの権限を確かめてから短時間の signed URL を取り直す（公開URLにしない）
  function previewDoc(id) {
    const d = findDoc(id);
    const applicantId = d?.applicantId || detail?.applicant?.id;
    const url = `/hr/document.html?applicant=${encodeURIComponent(applicantId || "")}&doc=${encodeURIComponent(id)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }
  async function downloadDoc(id) {
    try { window.open((await API.hrDocumentUrl(id, true)).url, "_blank", "noopener"); }
    catch (e) { alert(e.hint || e.message || "保存できませんでした"); }
  }

  // 書類のアップロード（中央モーダル）。差し替えも同じ（前の版は履歴に残る）
  let docFile = null;
  function openUploadDoc(type) {
    docFile = null;
    const types = docs?.types || [{ key: "resume", label: "履歴書" }, { key: "work_history", label: "職務経歴書" }, { key: "other", label: "その他" }];
    const replacing = type !== "other" && docGroup(type)?.latest;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${replacing ? "書類を差し替え" : "書類をアップロード"}</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん</p>
      <label>書類の種類</label>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;">${types.map((t) => `
        <label style="display:flex;gap:5px;align-items:center;font-weight:500;margin:0;">
          <input type="radio" name="doc-type" value="${esc(t.key)}" ${t.key === (type || "resume") ? "checked" : ""}
                 style="width:auto;margin:0;">${esc(t.label)}</label>`).join("")}</div>
      <div class="hr-drop" id="doc-drop" onclick="el('doc-file').click()">
        <span class="material-symbols-outlined" style="font-size:28px;">upload_file</span>
        <div id="doc-drop-text">ここにファイルをドラッグ、または押して選択</div>
        <div style="font-size:11.5px;margin-top:4px;">PDF・DOC・DOCX・JPG・PNG／10MBまで</div>
      </div>
      <input id="doc-file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="hidden" onchange="pickDocFile(this.files[0])">
      ${replacing ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">いまのファイルは「履歴」に残ります。</p>` : ""}
      <div id="doc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" id="doc-save" onclick="submitUploadDoc(this)">アップロード</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`, { wide: true });
    const drop = el("doc-drop");
    ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => pickDocFile(e.dataTransfer?.files?.[0]));
  }

  const DOC_MIME = ["application/pdf", "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "image/jpeg", "image/png"];
  function pickDocFile(f) {
    const msg = el("doc-msg");
    msg.textContent = "";
    docFile = null;
    if (!f) return;
    const max = docs?.limits?.maxBytes || 10 * 1024 * 1024;
    if (!DOC_MIME.includes(f.type)) { msg.textContent = "PDF・Word（.doc / .docx）・JPEG・PNG を選んでください"; return; }
    if (f.size > max) { msg.textContent = "ファイルは10MBまでにしてください"; return; }
    docFile = f;
    el("doc-drop-text").textContent = `${f.name}（${fmtSize(f.size)}）`;
  }

  async function submitUploadDoc(btn) {
    const msg = el("doc-msg");
    msg.textContent = "";
    if (!docFile) { msg.textContent = "ファイルを選んでください"; return; }
    const type = document.querySelector('input[name="doc-type"]:checked')?.value || "other";
    try {
      await KPLayout.busy(btn, "アップロード中…", () => API.uploadHrDocument(detail.applicant.id, type, docFile));
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "アップロードできませんでした"; }
  }

  function openDocHistory(type) {
    const g = docGroup(type);
    if (!g) return;
    const list = [g.latest, ...g.history].filter(Boolean);
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${esc(g.label)}の履歴</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん・新しい順</p>
      ${list.map((d, i) => `
        <div class="hr-doc" style="margin-bottom:8px;">
          <div class="f" style="margin:0;">${esc(d.filename)} ${i === 0 ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;">いまの版</span>` : ""}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
          </div>
        </div>`).join("")}
      <div style="margin-top:14px;"><button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`, { wide: true });
  }

  // 削除は確認モーダルを挟む（一覧に赤い削除ボタンを常に置かない）
  function confirmDeleteDoc(id) {
    const d = findDoc(id);
    if (!d) return;
    el("confirm-root").innerHTML = `<div class="hr-modal-bg top" onclick="closeConfirm()"></div>
      <div class="hr-modal top" role="alertdialog" aria-modal="true">
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">書類を削除しますか？</h2>
        <p class="hr-sub" style="margin:0 0 6px;">${esc(d.docTypeLabel)}：${esc(d.filename)}</p>
        <p class="muted" style="font-size:12px;margin:0 0 14px;">ファイルは元に戻せません。過去の版があれば、1つ前の版がいまの版になります。</p>
        <div id="del-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" style="background:#b3261e;" onclick="submitDeleteDoc('${esc(id)}', this)">削除する</button>
          <button class="btn btn-secondary" onclick="closeConfirm()">やめる</button>
        </div>
      </div>`;
  }
  function closeConfirm() { el("confirm-root").innerHTML = ""; }
  async function submitDeleteDoc(id, btn) {
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteHrDocument(id));
      closeConfirm();
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { el("del-msg").textContent = e.hint || e.message || "削除できませんでした"; }
  }

  function interviewRow(i) {
    const scoreLine = (detail.evalItems || []).filter((e) => i.scores?.[e.key])
      .map((e) => `${esc(e.label)}：${esc(scaleLabel(i.scores[e.key]))}`).join("　");
    // 実施済み・キャンセル済みではない＝いま動かせる面談だけ、日時変更・キャンセルを出す
    const pending = !i.done && !i.canceled;
    // TimeRex 連携済みの面談は TimeRex を正とする。日程変更・取消は TimeRex の導線から（HR で日時を直さない）
    const tr = i.timerex;
    return `
      <div class="card" style="margin-bottom:10px;${i.canceled ? "opacity:.6;" : ""}">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">${esc(i.kindLabel)}
          ${i.rank ? `<span class="hr-rank ${esc(i.rank)}" style="margin-left:6px;">${esc(i.rank)}</span>` : ""}
          ${pending ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;margin-left:6px;">予定</span>` : ""}
          ${i.canceled ? `<span class="hr-pill" style="background:#efefeb;color:#6b7080;margin-left:6px;">キャンセル済み</span>` : ""}
          ${tr ? `<span class="hr-pill hr-timerex" style="background:#e6f4ea;color:#256b36;margin-left:6px;">TimeRex連携済み</span>` : ""}
          ${i.meetingUrl && pending ? `<span class="muted" style="font-size:11.5px;font-weight:500;margin-left:6px;">Google Meet</span>` : ""}</div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">
          ${i.done ? `実施：${esc(fmtDate(i.conductedAt))}`
            : i.canceled ? `予定していた日時：${esc(fmtDate(i.scheduledAt))}（${esc(fmtDate(i.canceledAt))}にキャンセル）`
            : `予定：${esc(fmtDate(i.scheduledAt))}`}
          ${i.interviewerName ? `　面談担当：${esc(i.interviewerName)}` : ""}</div>
        ${scoreLine ? `<div style="font-size:12px;margin-top:4px;">${scoreLine}</div>` : ""}
        ${i.recommendReason ? `<div style="font-size:12.5px;margin-top:6px;">${esc(i.recommendReason)}</div>` : ""}
        ${i.notes ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">${esc(i.notes)}</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
          ${pending && i.meetingUrl ? `<a href="${esc(i.meetingUrl)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">面談に参加</a>` : ""}
          ${pending ? `<button class="btn btn-primary btn-sm" onclick="conductInterview('${esc(i.id)}')">実施済みにする</button>` : ""}
          ${pending && !tr ? `<button class="btn btn-secondary btn-sm" onclick="openRescheduleModal('${esc(i.id)}')">日時を変更</button>` : ""}
          ${pending && !tr ? `<button class="btn btn-secondary btn-sm" onclick="openCancelInterviewModal('${esc(i.id)}')">面談をキャンセル</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="reschedule" onclick="openTimerexReschedule('${esc(i.id)}')">日程変更</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="cancel" onclick="openTimerexCancel('${esc(i.id)}')">取消</button>` : ""}
          ${i.done && !i.rank && i.kind !== "ceo"
            ? `<button class="btn btn-primary btn-sm" onclick="openEvaluateForm('${esc(i.id)}')">評価を入力</button>` : ""}
          ${i.done && i.kind === "ceo"
            ? `<span class="muted" style="font-size:12px;">採用判断はCEO REVIEWで行います。</span>` : ""}
          ${i.done ? recordingActions(i) : ""}
        </div>
      </div>`;
  }

  // ---- TimeRex 連携済みの面談：日程変更・取消は TimeRex で（HR の日時は Webhook で自動反映） -----------
  const findInterview = (id) => (detail.interviews || []).find((x) => x.id === id);
  function openTimerexReschedule(id) {
    const iv = findInterview(id);
    const url = iv?.timerex?.rescheduleUrl;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 8px;">日程変更（TimeRex）</h2>
      <p style="font-size:13px;line-height:1.8;margin:0 0 12px;">
        ${esc(detail.applicant.name)}さんの${esc(iv?.kindLabel || "面談")}（${esc(fmtDate(iv?.scheduledAt))}）は TimeRex で予約された面談です。
        日程は TimeRex で変更してください。変更すると、この画面の日時も自動で更新されます。</p>
      ${url ? "" : `<p class="muted" style="font-size:12.5px;">日程変更のリンクがまだ届いていません。TimeRex の管理画面から変更してください。</p>`}
      <div style="display:flex;gap:8px;">
        ${url ? `<a class="btn btn-primary" id="tr-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="closeAction()">TimeRexで日程変更</a>` : ""}
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }
  function openTimerexCancel(id) {
    const iv = findInterview(id);
    const url = iv?.timerex?.cancelUrl;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 8px;">面談を取り消しますか？（TimeRex）</h2>
      <p style="font-size:13px;line-height:1.8;margin:0 0 12px;">
        ${esc(detail.applicant.name)}さんの${esc(iv?.kindLabel || "面談")}（${esc(fmtDate(iv?.scheduledAt))}）は TimeRex で予約された面談です。
        取消は TimeRex で行ってください。TimeRex で取り消すと、この画面にも反映されます（面談の記録は残ります）。</p>
      ${url ? "" : `<p class="muted" style="font-size:12.5px;">取消のリンクがまだ届いていません。TimeRex の管理画面から取り消してください。</p>`}
      <div style="display:flex;gap:8px;">
        ${url ? `<a class="btn btn-danger" id="tr-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="closeAction()">TimeRexで取り消す</a>` : ""}
        <button class="btn btn-secondary" onclick="closeAction()">閉じる（取り消さない）</button>
      </div>`);
  }

  // ---- 録画URL登録・変更（モーダル） ------------------------------------------------
  // カジュアル・社長面談の両方、実施済みの面談だけに出す（録画URL手動登録UI 追加指示）
  function recordingActions(i) {
    if (i.recordingUrl) {
      return `<a href="${esc(i.recordingUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">録画を見る</a>
        <button class="btn btn-secondary btn-sm" onclick="openRecordingModal('${esc(i.id)}')">録画URLを変更</button>`;
    }
    return `<span class="muted" style="font-size:12px;">録画：未登録</span>
      <button class="btn btn-secondary btn-sm" onclick="openRecordingModal('${esc(i.id)}')">録画URLを登録</button>`;
  }

  function openRecordingModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談録画を登録</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(detail.applicant.name)}さん　${esc(iv.kindLabel)}　${esc(fmtDate(iv.conductedAt || iv.scheduledAt))}</p>
      <label>Google Drive録画URL</label>
      <input id="rec-url" type="text" value="${esc(iv.recordingUrl || "")}" placeholder="https://drive.google.com/...">
      <div id="rec-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitRecordingUrl('${esc(id)}', this)">保存</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>
      </div>
      ${iv.recordingUrl ? `<button class="btn btn-secondary btn-sm" style="margin-top:16px;"
        onclick="openRecordingDeleteModal('${esc(id)}')">録画URLを削除</button>` : ""}`);
  }

  async function submitRecordingUrl(id, btn) {
    const msg = el("rec-msg"); msg.textContent = "";
    const url = el("rec-url").value.trim();
    if (!url) { msg.textContent = "録画URLを入力してください"; return; }
    if (!/^https?:\/\//i.test(url)) { msg.textContent = "http:// または https:// で始まるURLを入力してください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrInterview({ id, recordingUrl: url }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  function openRecordingDeleteModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">録画URLを削除しますか？</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(iv.kindLabel)}の録画URLを削除します。Google Drive側の録画ファイル自体は消えません。</p>
      <div id="recd-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitDeleteRecordingUrl('${esc(id)}', this)">削除する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitDeleteRecordingUrl(id, btn) {
    const msg = el("recd-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "削除中…", () => API.updateHrInterview({ id, recordingUrl: "" }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "削除できませんでした"; }
  }

  function scaleLabel(k) { return (detail.evalScale || []).find((s) => s.key === k)?.label || k; }

  function fmtDate(s) {
    return s ? new Date(s).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  }

  // ---- 面談日時変更・キャンセル（モーダル） -----------------------------------------
  // 「日時を変更」は既存のupdateアクションを使う（README §3。日時・担当・URLだけを直す）
  function openRescheduleModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    const opts = (detail.interviewers || []).map((p) =>
      `<option value="${esc(p.id)}" ${p.id === iv.interviewerId ? "selected" : ""}>${esc(p.display_name)}</option>`).join("");
    const whenLocal = iv.scheduledAt ? new Date(iv.scheduledAt).toISOString().slice(0, 16) : "";
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談日時を変更</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(iv.kindLabel)}（${esc(detail.applicant.name)}さん）</p>
      <label>予定日時</label>
      <input id="rs-when" type="datetime-local" value="${esc(whenLocal)}">
      <label style="margin-top:10px;">面談担当</label>
      <select id="rs-who"><option value="">（未定）</option>${opts}</select>
      <label style="margin-top:10px;">面談URL</label>
      <input id="rs-url" type="text" value="${esc(iv.meetingUrl || "")}" placeholder="https://meet.google.com/...">
      <div id="rs-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitReschedule('${esc(id)}', this)">保存する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitReschedule(id, btn) {
    const msg = el("rs-msg"); msg.textContent = "";
    const when = el("rs-when").value;
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrInterview({
        id, scheduledAt: when ? new Date(when).toISOString() : undefined,
        interviewerId: el("rs-who").value || undefined,
        meetingUrl: el("rs-url").value.trim() || undefined,
      }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // 面談キャンセルは応募者を削除しない・面談履歴も物理削除しない（README §3・§6）。
  // カジュアル面談なら日程調整のやり直し（status=scheduling）、社長面談なら
  // 社長面談の設定し直し（status=ceo_interview_pending）へ戻す（サーバ側でも同じ判定）
  function openCancelInterviewModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談をキャンセルしますか？</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(detail.applicant.name)}さんの${esc(iv.kindLabel)}（${esc(fmtDate(iv.scheduledAt))}）をキャンセルします。
        ${iv.kind === "ceo" ? "社長面談を設定し直せる状態に戻します。" : "日程を調整し直せる状態に戻します。"}</p>
      <div id="ci-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitCancelInterview('${esc(id)}', this)">面談をキャンセルする</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる（キャンセルしない）</button>
      </div>`);
  }

  async function submitCancelInterview(id, btn) {
    const msg = el("ci-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "処理中…", () => API.cancelHrInterview(id));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "キャンセルできませんでした"; }
  }

  // ---- NEXT ACTIONのボタン --------------------------------------------------------
  function targetInterview(action) {
    const list = detail.interviews || [];
    if (action === "conduct") return list.find((i) => !i.done && !i.canceled) || null;
    if (action === "evaluate") return list.find((i) => i.done && !i.rank) || list[0] || null;
    return null;
  }

  function runNextAction() {
    const a = detail.applicant;
    const key = a.nextActionKey;
    if (key === "sendSchedulingLink") return openSendSchedulingForm();
    if (key === "schedule") return openScheduleForm(a.nextActionKind);
    if (key === "conduct") {
      const iv = targetInterview("conduct");
      return iv ? conductInterview(iv.id) : openScheduleForm();
    }
    if (key === "evaluate") {
      const iv = targetInterview("evaluate");
      return iv ? openEvaluateForm(iv.id) : null;
    }
    if (key === "recommend") return openRecommendForm();
    if (key === "advance") return startAdvance();
    if (key === "reject") return confirmDecisionMove("reject");
    if (key === "decide") return openDecideForm();
    if (key === "createOffer" || key === "reviewOffer") return openOfferForm();
    if (key === "sendOffer" || key === "reissueOffer") return openSendOfferForm();
  }

  /** Dランクの早期見送りだけ、ここで確定する（社長判断待ちからの見送りは openDecideForm） */
  async function confirmDecisionMove(kind) {
    const okToGo = confirm("見送りを確定します。よろしいですか？");
    if (!okToGo) return;
    try {
      await API.updateHrApplicant({ id: detail.applicant.id, decision: "rejected" });
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "できませんでした"); }
  }

  /**
   * 社長推薦する。ここで短い推薦理由を書いてもらう。
   * 社長が応募書類を最初から読まなくても、30秒で「会う理由」が分かるようにするため
   */
  function openRecommendForm() {
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">社長推薦する</h2>
        <p class="hr-sub" style="margin:0 0 14px;">
          社長が応募書類を最初から読まなくても、なぜ会う必要があるかが分かるように、短く書いてください。</p>
        <label>推薦理由</label>
        <textarea id="rc-note" rows="4"
          placeholder="営業経験が強く、事業立ち上げ経験あり。カルチャーフィットも高い。報酬条件のみ社長面談で確認したい。"></textarea>
        <div id="rc-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitRecommend(this)">社長推薦する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }

  async function submitRecommend(btn) {
    const msg = el("rc-msg"); msg.textContent = "";
    const note = el("rc-note").value.trim();
    if (!note) { msg.textContent = "推薦理由を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({
        id: detail.applicant.id, stage: "ceo_recommend", status: "ceo_interview_pending", recommendNote: note,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; }
  }

  /** 採用判断（内定・保留・見送り）。社長・管理者だけ（サーバ側でも弾く） */
  function openDecideForm() {
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 16px;">採用判断</h2>
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <button class="btn btn-primary btn-sm" onclick="setDecideKind('hired')">内定</button>
          <button class="btn btn-secondary btn-sm" onclick="setDecideKind('hold')">保留</button>
          <button class="btn btn-secondary btn-sm" onclick="setDecideKind('rejected')">見送り</button>
        </div>
        <div id="decide-body"></div>
        <div id="dc-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
    setDecideKind("hired");
  }

  let decideKind = "hired";
  function setDecideKind(kind) {
    decideKind = kind;
    const body = el("decide-body");
    if (kind === "hold") {
      body.innerHTML = `
        <label>保留理由</label><input id="dc-reason" type="text">
        <label style="margin-top:10px;">次に確認すること</label><input id="dc-next" type="text">
        <label style="margin-top:10px;">再判断期限</label><input id="dc-due" type="date">
        <button class="btn btn-primary" style="margin-top:14px;" onclick="submitDecide(this)">保留にする</button>`;
    } else {
      body.innerHTML = `
        <label>コメント（任意）</label><textarea id="dc-note" rows="3"></textarea>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="submitDecide(this)">
          ${kind === "hired" ? "内定にする" : "見送りを確定"}</button>`;
    }
  }

  async function submitDecide(btn) {
    const msg = el("dc-msg"); msg.textContent = "";
    const body = { id: detail.applicant.id, decision: decideKind };
    if (decideKind === "hired") {
      body.stage = "offer"; body.status = "offer_draft_pending";
      body.decisionNote = el("dc-note").value.trim() || undefined;
    } else if (decideKind === "hold") {
      const reason = el("dc-reason").value.trim();
      const next = el("dc-next").value.trim();
      if (!next) { msg.textContent = "次に確認することを入力してください"; return; }
      body.holdReason = reason || undefined;
      body.holdNextStep = next;
      body.decisionDueOn = el("dc-due").value || undefined;
    } else {
      body.status = "passed";
      body.decisionNote = el("dc-note").value.trim() || undefined;
    }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant(body));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; }
  }

  async function conductInterview(id) {
    if (!confirm("この面談を実施済みにします。よろしいですか？")) return;
    try {
      await API.conductHrInterview(id);
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "できませんでした"); }
  }

  // ---- 日程調整URLを送る（モーダル） ------------------------------------------------
  // 通常導線：TimeRexの日程調整URLを送る（README「TimeRex連携」指示書 §5・§6）。
  // 独自の日程調整UIは作らない。TimeRexが未設定なら、手動設定へ逃がす（§21）。
  // 応募者詳細ドロワーの上にモーダルで出す。閉じてもドロワーは閉じない（応募者一覧・
  // ドロワーUI改善指示書 §4・§5）
  function openSendSchedulingForm() {
    const url = detail.schedulingUrl;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">日程調整URLを送ります</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さんへ、カジュアル面談の日程調整URLを送ってください。</p>
      ${url ? `
      <label>TimeRex 日程調整URL</label>
      <input id="sc-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
      <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('sc-url')">URLをコピー</button>
      <label style="margin-top:14px;">メール文面</label>
      <textarea id="sc-mail" rows="8" readonly>${esc(schedulingMailTemplate(url))}</textarea>
      <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('sc-mail')">メール文面をコピー</button>
      <div id="sc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitMarkScheduling(this)">送付済みにする</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>
      <button class="btn btn-secondary btn-sm" style="margin-top:16px;"
              onclick="closeHrModal();openScheduleForm()">TimeRexを使わず、手動で面談を設定する</button>` : `
      <div class="banner warn"><span class="material-symbols-outlined">build</span>
        <div>TimeRexの日程調整URLが未設定です（環境変数 TIMEREX_CASUAL_INTERVIEW_URL）。
        手動で面談を設定してください。</div></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="closeHrModal();openScheduleForm()">手動で面談を設定</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`}`);
  }

  function schedulingMailTemplate(url) {
    const a = detail.applicant;
    return `件名：面談日程のご調整のお願い

${a.name} 様

このたびは弊社採用選考にご応募いただき、ありがとうございます。
つきましては、カジュアル面談の日程調整をお願いしたく、
下記URLより、ご都合の良い日時をお選びください。

${url}

ご不明点がございましたら、採用担当までご連絡ください。`;
  }

  async function submitMarkScheduling(btn) {
    try {
      await KPLayout.busy(btn, "記録中…", () => API.updateHrApplicant({ id: detail.applicant.id, status: "scheduling" }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "記録できませんでした"); }
  }

  // ---- 面談を予定する（右ドロワー） ------------------------------------------------
  function openScheduleForm(kind) {
    const kinds = detail.interviewKinds || [{ key: "casual", label: "カジュアル面談" }, { key: "ceo", label: "社長面談" }];
    const opts = (detail.interviewers || []).map((p) => `<option value="${esc(p.id)}">${esc(p.display_name)}</option>`).join("");
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 16px;">面談を予定する</h2>
        <label>面談種別</label>
        <select id="iv-kind">${kinds.map((k) =>
          `<option value="${esc(k.key)}" ${k.key === (kind || "casual") ? "selected" : ""}>${esc(k.label)}</option>`).join("")}</select>
        <label style="margin-top:10px;">予定日時</label>
        <input id="iv-when" type="datetime-local">
        <label style="margin-top:10px;">面談担当</label>
        <select id="iv-who"><option value="">（未定）</option>${opts}</select>
        <label style="margin-top:10px;">面談URL</label>
        <input id="iv-url" type="text" placeholder="https://meet.google.com/...">
        <div id="iv-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitSchedule(this)">予定する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }

  /**
   * 1つの操作をする中央モーダル（評価・面談の予定・推薦・判断・合格通知・書類など）。
   *
   * 応募者詳細（右ドロワー）の上に重ねる。右ドロワーの上に右ドロワーを重ねない。
   * 背景を押して閉じるのはこのモーダルだけで、後ろの応募者詳細は残る。
   * 保存したら、モーダルを閉じて refreshDetail() で開いたままのドロワーに反映する
   */
  // ---- 担当を変更（中央モーダル。保存後もドロワーは閉じない） -------------------------
  function openRecruiterModal() {
    const a = detail.applicant;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 12px;">担当を変更</h2>
      <p class="muted" style="font-size:12.5px;margin:0 0 10px;">${esc(a.name)} さんの NEXT ACTION は、担当の人に届きます。</p>
      <label>担当</label>
      <select id="rc-select">${recruiterOptions(a.recruiterId)}</select>
      <div id="rc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" onclick="saveRecruiter(this)">保存</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }
  async function saveRecruiter(btn) {
    const msg = el("rc-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({
        id: detail.applicant.id, recruiterId: el("rc-select").value || null }));
      closeAction();
      await refreshDetail("overview");
      load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  function openActionModal(html, { wide = false } = {}) {
    el("action-root").innerHTML = `<div class="hr-modal-bg" onclick="closeAction()"></div>
      <div class="hr-modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  }
  function closeAction() { el("action-root").innerHTML = ""; }

  async function submitSchedule(btn) {
    const msg = el("iv-msg"); msg.textContent = "";
    const when = el("iv-when").value;
    try {
      await KPLayout.busy(btn, "保存中…", () => API.scheduleHrInterview({
        applicantId: detail.applicant.id, kind: el("iv-kind").value,
        scheduledAt: when ? new Date(when).toISOString() : undefined,
        interviewerId: el("iv-who").value || undefined,
        meetingUrl: el("iv-url").value.trim() || undefined,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "予定できませんでした"; }
  }

  // ---- 評価を入力（右ドロワー） ----------------------------------------------------
  //
  // 短時間で入力できるように、長いフォームにしない（5項目＋自由記述は3つだけ）
  function openEvaluateForm(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    const items = detail.evalItems || [];
    const scale = detail.evalScale || [];
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">評価を入力</h2>
        <p class="hr-sub" style="margin:0 0 14px;">${esc(iv.kindLabel)}</p>
        ${items.map((it) => `
          <label style="margin-top:8px;">${esc(it.label)}</label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${scale.map((s) => `
              <label class="hr-chip" style="cursor:pointer;">
                <input type="radio" name="ev-${esc(it.key)}" value="${esc(s.key)}"
                       ${iv.scores?.[it.key] === s.key ? "checked" : ""} style="width:auto;margin:0 4px 0 0;">${esc(s.label)}
              </label>`).join("")}
          </div>`).join("")}
        <label style="margin-top:14px;">ランク <span style="color:#b3261e;">*</span></label>
        <select id="ev-rank">
          <option value="">（選ぶ）</option>
          ${(detail.ranks || []).map((r) =>
            `<option value="${esc(r)}" ${iv.rank === r ? "selected" : ""}>${esc(r)}：${esc((detail.rankLabel || {})[r] || "")}</option>`).join("")}
        </select>
        <label style="margin-top:10px;">良かった点・推薦理由</label>
        <input id="ev-reason" type="text" value="${esc(iv.recommendReason || "")}">
        <label style="margin-top:10px;">気になる点・次に確認したいこと</label>
        <textarea id="ev-notes" rows="3">${esc(iv.notes || "")}</textarea>
        <label style="margin-top:10px;">次回確認事項の期限（任意）</label>
        <input id="ev-due" type="date" value="${esc(iv.nextDueOn || "")}">
        <div id="ev-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitEvaluate('${esc(id)}', this)">保存する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  async function submitEvaluate(id, btn) {
    const msg = el("ev-msg"); msg.textContent = "";
    const rank = el("ev-rank").value;
    if (!rank) { msg.textContent = "ランクを選んでください"; return; }
    const scores = {};
    for (const it of detail.evalItems || []) {
      const picked = document.querySelector(`input[name="ev-${it.key}"]:checked`);
      if (picked) scores[it.key] = picked.value;
    }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.evaluateHrInterview({
        id, scores, rank,
        recommendReason: el("ev-reason").value.trim() || undefined,
        notes: el("ev-notes").value.trim() || undefined,
        nextDueOn: el("ev-due").value || undefined,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ---- 合格通知を作成・確認（右ドロワー） --------------------------------------------
  // Stage 5：作成→社内確認→確定（本人送付待ち）まで。本人への実際の送付はStage 6
  const OFFER_STATUS_LABEL = {
    none: "—", draft: "作成中", sent: "送付済み", viewed: "閲覧済み", accepted: "承諾", declined: "辞退",
    revoked: "無効化", expired: "期限切れ",
  };
  function offerRow(o) {
    return `
      <div class="card" style="margin-bottom:10px;">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">第${o.version}版
          <span class="hr-pill" style="background:#e7eaf3;color:#1b2440;margin-left:6px;">${esc(OFFER_STATUS_LABEL[o.status] || o.status)}</span></div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">回答期限：${esc(o.respondBy || "—")}
          ${o.sentAt ? `　送付：${esc(fmtDate(o.sentAt))}` : ""}
          ${o.viewedAt ? `　閲覧：${esc(fmtDate(o.viewedAt))}` : ""}
          ${o.acceptedAt ? `　承諾：${esc(fmtDate(o.acceptedAt))}` : ""}
          ${o.declinedAt ? `　辞退：${esc(fmtDate(o.declinedAt))}` : ""}</div>
        ${o.messageToCandidate ? `<div style="font-size:12px;margin-top:4px;">${esc(o.messageToCandidate)}</div>` : ""}
        ${o.declineReason ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">辞退理由：${esc(o.declineReason)}</div>` : ""}
      </div>`;
  }

  // いま有効な（無効化されていない）最新の合格通知。版は新しい順に並んでいる
  function currentOffer() {
    const list = detail.offers || [];
    return list.find((o) => o.status !== "revoked") || null;
  }

  function openOfferForm() {
    const a = detail.applicant;
    const reviewing = a.status === "offer_review_pending";
    const o = reviewing ? currentOffer() : null;
    const v = (k, fallback) => esc((o ? o[k] : null) ?? fallback ?? "");
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">合格通知を${reviewing ? "確認" : "作成"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">候補者本人に送る、確定した条件です。本人へ送付するまでは、いつでも直せます。</p>
        <label>雇用形態</label><input id="of-employment" type="text" value="${v("employmentType", a.employmentType)}">
        <label style="margin-top:10px;">入社予定日</label><input id="of-join" type="date" value="${v("joinDate", a.joinDate)}">
        <label style="margin-top:10px;">契約形態</label><input id="of-contract" type="text" value="${v("contractType", a.contractType)}">
        <label style="margin-top:10px;">契約期間満了日（有期のみ）</label><input id="of-contractend" type="date" value="${v("contractEndDate", a.contractEndDate)}">
        <label style="margin-top:10px;">試用期間（月）</label><input id="of-prob" type="number" value="${v("probationMonths", a.probationMonths)}">
        <label style="margin-top:10px;">給与区分</label><input id="of-wagetype" type="text" value="${v("wageType", a.wageType)}">
        <label style="margin-top:10px;">給与・報酬</label><input id="of-wage" type="number" value="${v("wageAmount", a.wageAmount)}">
        <label style="margin-top:10px;">勤務時間（週）</label><input id="of-hours" type="number" step="0.5" value="${v("weeklyHours", a.weeklyHours)}">
        <label style="margin-top:10px;">勤務地</label><input id="of-loc" type="text" value="${v("workLocation", a.workLocation)}">
        <label style="margin-top:10px;">回答期限 <span style="color:#b3261e;">*</span></label>
        <input id="of-respondby" type="date" value="${v("respondBy", "")}">
        <label style="margin-top:10px;">本人向けメッセージ</label>
        <textarea id="of-message" rows="3">${v("messageToCandidate", "")}</textarea>
        <div id="of-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn ${reviewing ? "btn-secondary" : "btn-primary"}" onclick="submitOffer(this)">${reviewing ? "内容を保存" : "作成する"}</button>
          ${reviewing ? `<button class="btn btn-primary" onclick="submitConfirmOffer(this)">確定して送付待ちにする</button>` : ""}
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  function offerFormFields() {
    return {
      employmentType: el("of-employment").value.trim() || undefined,
      joinDate: el("of-join").value || undefined,
      contractType: el("of-contract").value.trim() || undefined,
      contractEndDate: el("of-contractend").value || undefined,
      probationMonths: el("of-prob").value || undefined,
      wageType: el("of-wagetype").value.trim() || undefined,
      wageAmount: el("of-wage").value || undefined,
      weeklyHours: el("of-hours").value || undefined,
      workLocation: el("of-loc").value.trim() || undefined,
      messageToCandidate: el("of-message").value.trim() || undefined,
    };
  }

  async function submitOffer(btn) {
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    const fields = offerFormFields();
    try {
      if (detail.applicant.status === "offer_review_pending") {
        const o = currentOffer();
        await KPLayout.busy(btn, "保存中…", () => API.updateHrOffer({ id: o.id, ...fields, respondBy }));
      } else {
        await KPLayout.busy(btn, "作成中…", () => API.createHrOffer({ applicantId: detail.applicant.id, ...fields, respondBy }));
      }
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  async function submitConfirmOffer(btn) {
    const o = currentOffer();
    if (!o) return;
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "確定中…", async () => {
        await API.updateHrOffer({ id: o.id, ...offerFormFields(), respondBy });
        await API.confirmHrOffer(o.id);
      });
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "確定できませんでした"; }
  }

  // ---- 本人へ送る・URLを再発行（右ドロワー） -----------------------------------------
  // Stage 6：メール送信の仕組みは無いので、URLを発行してコピーしてもらい、
  // 実際に送り終えたら「送付済みにする」を明示的に押してもらう（README §12）
  function openSendOfferForm() {
    const reissuing = ["offer_sent", "offer_viewed", "offer_response_pending"].includes(detail.applicant.status);
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">${reissuing ? "URLを再発行" : "本人へ送る"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">
          ${reissuing ? "現在のURLは使えなくなります。新しいURLを発行しますか？" : "候補者専用のURLを発行します。メール送信の仕組みはまだ無いので、いつもお使いのメールから手動で送ってください。"}</p>
        <div id="so-body">
          <button class="btn btn-primary" onclick="submitIssueLink(this)">${reissuing ? "再発行する" : "URLを発行する"}</button>
        </div>
        <div id="so-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  async function submitIssueLink(btn) {
    const msg = el("so-msg"); msg.textContent = "";
    const o = currentOffer();
    if (!o) return;
    try {
      const r = await KPLayout.busy(btn, "発行中…", () => API.issueHrOfferLink(o.id));
      const url = `${location.origin}/hr/offer.html?token=${encodeURIComponent(r.token)}`;
      const mail = offerMailTemplate(url);
      el("so-body").innerHTML = `
        <label>候補者専用URL（この画面を閉じると、二度と表示されません）</label>
        <input id="so-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-url')">URLをコピー</button>
        <label style="margin-top:14px;">メール文面</label>
        <textarea id="so-mail" rows="9" readonly>${esc(mail)}</textarea>
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-mail')">メール文面をコピー</button>
        <p class="muted" style="font-size:12px;margin-top:12px;">
          上のURLをメールに貼って、実際に送ってください。送り終えたら、下のボタンを押して記録してください。</p>
        <button class="btn btn-primary" style="margin-top:6px;" onclick="submitMarkSent(this, '${esc(r.offer.id)}')">送付済みにする</button>`;
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "発行できませんでした"; }
  }

  function offerMailTemplate(url) {
    const a = detail.applicant;
    const o = currentOffer();
    return `件名：選考結果のご案内

${a.name} 様

このたびは弊社採用選考にご参加いただき、ありがとうございました。

選考結果および採用条件について、下記の専用ページよりご確認ください。

${url}

回答期限：${o?.respondBy || ""}

ご不明点がございましたら、採用担当までご連絡ください。`;
  }

  async function copyText(id) {
    const val = el(id).value;
    try { await navigator.clipboard.writeText(val); } catch {}
    el(id).select();
  }

  async function submitMarkSent(btn, offerId) {
    try {
      await KPLayout.busy(btn, "記録中…", () => API.markHrOfferSent(offerId));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "記録できませんでした"); }
  }

  // ---- 本採用へ進める（Stage 8） ---------------------------------------------------
  // 実際の社員登録は既存のadmin-onboard.htmlで行う（作り直さない）。
  // 二重手続きを防いでから、応募者IDだけを渡す。給与・勤務条件はURLへ載せず、
  // admin-onboard.html側がサーバから改めて取得する（README Stage 8）
  async function startAdvance() {
    try {
      await API.claimHrAdvance(detail.applicant.id);
      location.href = `../admin-onboard.html?applicantId=${encodeURIComponent(detail.applicant.id)}`;
    } catch (e) { alert(e.hint || e.detail || e.message || "本採用の手続きを始められませんでした"); }
  }
</script>

</body>
</html>
