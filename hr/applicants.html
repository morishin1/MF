  /** 採用判断（内定・保留・見送り）。社長・管理者だけ（サーバ側でも弾く） */
  // 採用判断の部品（下の共通部分）が、この画面で使う口
  const decideDefaultId = () => detail?.applicant?.id;
  const openDecisionModal = (html, opts) => openActionModal(html, opts);
  const closeDecisionModal = () => closeAction();
  async function afterDecision() { await refreshDetail(); await load(); }

  // ---- 社長面談の評価 → STEP 1 採用判断 → STEP 2 本人へ連絡 ------------------------------
  // 採用HRの詳細（hr/applicants.html）と CEO REVIEW（hr/ceo-review.html）で同じもの。直すときは両方そろえる。
  //   ・1つのモーダルの中を、3枚のカード（評価／採用判断／本人へ連絡）に分ける。保存しても閉じずに次の段へ進む
  //   ・判断はセグメント（選んだものだけ色＋チェック）。説明の帯・確定ボタンも同じ色に切り替わる
  //   ・評価は面談の scores / notes（状態は動かさない）。判断は応募者の decision。連絡は api/hr/applicants/message.js
  //   ・本人への連絡状況（未連絡／連絡済み）は API の contact（lib/hr-messages.js。タイムラインから決める）
  const DECIDE_KINDS = [
    { key: "hired", label: "合格", icon: "check_circle", submit: "合格にする",
      note: "合格にします。どの形で迎えるか（採用区分）を選ぶと、その区分のオファー（条件）を作る流れに進みます。" },
    { key: "hold", label: "保留", icon: "pause_circle", submit: "保留にする",
      note: "保留にします。社長判断待ちのまま、次に確認することと再判断期限を残します。" },
    { key: "rejected", label: "見送り", icon: "cancel", submit: "見送りを確定",
      note: "見送りにします。この応募者の選考は終わります。" },
  ];
  const DECIDE_LABEL = Object.fromEntries(DECIDE_KINDS.map((k) => [k.key, k.label]));

  /** 判断と、本人への連絡状況のバッジ（一覧・詳細・CEO REVIEW で同じ） */
  function decisionBadges(a) {
    const d = a?.decision;
    // 無限道場リードの保留・対象外は採用判断ではない（区分のバッジと次のアクションで見る）
    if (!DECIDE_LABEL[d] || a?.leadCategory === "mugendojo") return "";
    const c = a.contact?.state;
    return `<span class="hr-badges" data-decision="${esc(d)}">
      <span class="hr-badge d-${esc(d)}">${esc(DECIDE_LABEL[d])}</span>
      ${c === "pending" ? `<span class="hr-badge c-pending" data-contact="pending"><span class="material-symbols-outlined">mark_email_unread</span>本人へ未連絡</span>`
        : c === "done" ? `<span class="hr-badge c-done" data-contact="done"><span class="material-symbols-outlined">done</span>連絡済み</span>` : ""}
    </span>`;
  }

  /** 社長面談の評価（読むだけ）。モーダルと同じ見た目・同じ色のルールで出す（応募者詳細・CEO REVIEW の詳細） */
  function ceoEvalSummary(res) {
    const iv = (res?.interviews || []).find((i) => i.kind === "ceo" && i.done && !i.canceled);
    if (!iv || (!Object.keys(iv.scores || {}).length && !iv.notes)) return "";
    return `<section class="hr-flow-sec" data-ceo-eval style="margin-top:14px;">
      <div class="hr-flow-hd"><h3><span class="material-symbols-outlined">fact_check</span>社長面談の評価</h3>
        <span class="hr-flow-note">${iv.scheduledAt ? esc(JST.when(iv.scheduledAt)) : ""}</span></div>
      ${(res.evalItems || []).map((it) => `<div class="hr-score-row"><span class="k">${esc(it.label)}</span><span class="hr-score-opts">
        ${(res.evalScale || []).map((s) => `<button type="button" class="hr-score${iv.scores?.[it.key] === s.key ? " on" : ""}" data-v="${esc(s.key)}" disabled>${esc(s.label)}</button>`).join("")}
      </span></div>`).join("")}
      ${iv.notes ? `<div style="font-size:12.5px;white-space:pre-wrap;margin-top:10px;color:#1b2440;"><b style="color:#6b7080;font-size:11px;display:block;">社長の所感</b>${esc(iv.notes)}</div>` : ""}
    </section>`;
  }

  let decideKind = "hired";
  let decideOfferType = null;   // 合格のときの採用区分（「この方をどの形で迎えますか？」）
  // { applicantId, name, ceoInterview, evalItems, evalScale, scores, step: "decide"|"contact"|"done",
  //   savedKind, summary, message, sentChannel }
  let flow = null;

  const flowState = (done, doneText, todoText) => (done
    ? `<span class="hr-flow-state done"><span class="material-symbols-outlined">check</span>${esc(doneText)}</span>`
    : `<span class="hr-flow-state todo">${esc(todoText)}</span>`);

  function openDecideForm(applicantId) {
    const id = applicantId || decideDefaultId();
    flow = { applicantId: id, name: "", ceoInterview: null, evalItems: [], evalScale: [], scores: {}, step: "decide",
      savedKind: null, summary: "", message: null, sentChannel: null };
    decideKind = "hired";
    decideOfferType = null;
    for (const k of Object.keys(fieldMemo)) delete fieldMemo[k];
    openDecisionModal(flowShell(), { wide: true });
    renderStep1(); renderStep2();
    loadDecideEval(id);
  }

  /** 判断済みの人に、あとから本人へ連絡する（STEP 1 は完了のまま、STEP 2 だけを開く） */
  async function openContactForm(applicantId, kind) {
    flow = { applicantId, name: "", ceoInterview: null, evalItems: [], evalScale: [], scores: {}, step: "contact",
      savedKind: kind, summary: `${DECIDE_LABEL[kind] || ""}を決定済み`, message: null, sentChannel: null, contactOnly: true };
    openDecisionModal(flowShell(), { wide: true });
    renderStep1();
    await loadMessage();
  }

  function flowShell() {
    return `
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 2px;">${flow.contactOnly ? "本人へ連絡" : "評価・採用判断"}</h2>
        <p class="hr-sub" id="dc-name" style="margin:0 0 16px;"></p>
        ${flow.contactOnly ? "" : `<section class="hr-flow-sec" id="dc-eval"><p class="hr-flow-note">社長面談の評価を読み込み中…</p></section>`}
        <section class="hr-flow-sec" id="dc-step1"></section>
        <section class="hr-flow-sec" id="dc-step2"></section>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-secondary" onclick="closeDecisionModal()">閉じる</button>
        </div>`;
  }

  /** ① 社長面談の評価・② 社長の所感（実施済み・キャンセルでない、いちばん新しい社長面談） */
  async function loadDecideEval(id) {
    let d = null;
    try { d = await API.getHrApplicant(id); } catch { d = null; }
    if (!el("dc-eval") || flow?.applicantId !== id) return;
    // 採用区分の定義（合格のときのカード）。開いた時点でまだ無ければ、ここで描き直す
    takeOfferTypes(d);
    if (!decideOfferType && d?.applicant?.offerType) decideOfferType = d.applicant.offerType;
    if (flow.step === "decide" && decideKind === "hired") renderDecideFields();
    const iv = (d?.interviews || []).find((i) => i.kind === "ceo" && i.done && !i.canceled) || null;
    Object.assign(flow, { name: d?.applicant?.name || "", ceoInterview: iv, evalItems: d?.evalItems || [],
      evalScale: d?.evalScale || [], scores: { ...(iv?.scores || {}) } });
    el("dc-name").textContent = flow.name;
    renderEval();
  }

  function renderEval() {
    const box = el("dc-eval");
    if (!box) return;
    const iv = flow.ceoInterview;
    if (!iv || !flow.evalItems.length) {
      box.className = "hr-flow-sec is-wait";
      box.innerHTML = `<div class="hr-flow-hd"><h3>社長面談の評価</h3></div>
        <p class="hr-flow-note">実施済みの社長面談がないため、評価は入力できません。判断だけを保存できます。</p>`;
      return;
    }
    const locked = flow.step !== "decide";
    box.className = "hr-flow-sec";
    box.innerHTML = `
        <div class="hr-flow-hd"><h3><span class="material-symbols-outlined">fact_check</span>社長面談の評価</h3>
          <span class="hr-flow-note">${iv.scheduledAt ? esc(JST.when(iv.scheduledAt)) : ""}</span></div>
        ${flow.evalItems.map((it) => `
          <div class="hr-score-row" data-item="${esc(it.key)}"><span class="k">${esc(it.label)}</span>
            <span class="hr-score-opts" role="group" aria-label="${esc(it.label)}">
              ${flow.evalScale.map((s) => `<button type="button" class="hr-score${flow.scores[it.key] === s.key ? " on" : ""}"
                data-v="${esc(s.key)}" aria-pressed="${flow.scores[it.key] === s.key}" ${locked ? "disabled" : ""}
                onclick="setScore('${esc(it.key)}', '${esc(s.key)}')">${esc(s.label)}</button>`).join("")}
            </span></div>`).join("")}
        <label style="margin-top:14px;">社長の所感（任意）</label>
        <textarea id="dc-ceo-notes" rows="3" maxlength="1000" ${locked ? "disabled" : ""}
          placeholder="良かった点・気になった点・判断の理由">${esc(iv.notes || "")}</textarea>`;
  }

  function setScore(item, v) {
    // 同じものをもう一度押したら外す（付け間違いを戻せるように）
    flow.scores[item] = flow.scores[item] === v ? undefined : v;
    if (!flow.scores[item]) delete flow.scores[item];
    const row = document.querySelector(`#dc-eval .hr-score-row[data-item="${item}"]`);
    row?.querySelectorAll(".hr-score").forEach((b) => {
      const on = b.dataset.v === flow.scores[item];
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    });
  }

  /** ③ 採用判断・④ 補足・⑤ 保存（STEP 1） */
  function renderStep1() {
    const box = el("dc-step1");
    if (!box) return;
    const done = flow.step !== "decide";
    const head = `<div class="hr-flow-hd"><h3><span class="st">STEP 1</span>採用判断</h3>${flowState(done, "完了", "未完了")}</div>`;
    if (done) {
      box.innerHTML = `${head}<div class="hr-flow-sum">${decisionBadges({ decision: flow.savedKind })}
        ${flow.summary ? `<div style="margin-top:6px;">${esc(flow.summary)}</div>` : ""}</div>`;
      return;
    }
    const k = DECIDE_KINDS.find((x) => x.key === decideKind) || DECIDE_KINDS[0];
    box.innerHTML = `${head}
        <div class="hr-seg" id="dc-tabs" role="radiogroup" aria-label="採用判断">
          ${DECIDE_KINDS.map((x) => {
            const on = x.key === decideKind;
            return `<button type="button" role="radio" class="${on ? "on" : ""}" data-kind="${x.key}" aria-checked="${on}" aria-pressed="${on}"
              onclick="setDecideKind('${x.key}')">${on ? `<span class="material-symbols-outlined">check</span>` : ""}${esc(x.label)}</button>`;
          }).join("")}
        </div>
        <div class="hr-dk-banner" data-kind="${k.key}"><span class="material-symbols-outlined">${k.icon}</span><div><b>${esc(k.label)}</b>　${esc(k.note)}</div></div>
        <div id="decide-body"></div>
        <div id="dc-msg" class="err-text" style="margin:8px 0 0;"></div>
        <button class="btn hr-dk-save" data-kind="${k.key}" style="margin-top:12px;" onclick="submitDecide(this)">${esc(k.submit)}</button>`;
    renderDecideFields();
  }

  // 判断ごとの補足（④）。判断を切り替えても、入れた値はなるべく残す
  const fieldMemo = {};
  function renderDecideFields() {
    for (const id of ["dc-reason", "dc-next", "dc-due", "dc-note"]) if (el(id)) fieldMemo[id] = el(id).value;
    const v = (id) => esc(fieldMemo[id] || "");
    const note = `<label${decideKind === "hired" ? ' style="margin-top:12px;"' : ""}>コメント（任意・社内用。本人には送りません）</label><textarea id="dc-note" rows="3">${v("dc-note")}</textarea>`;
    el("decide-body").innerHTML = decideKind === "hold" ? `
        <label>保留理由</label><input id="dc-reason" type="text" value="${v("dc-reason")}">
        <label style="margin-top:10px;">次に確認すること <span style="color:#b3261e;">*</span></label><input id="dc-next" type="text" value="${v("dc-next")}">
        <label style="margin-top:10px;">再判断期限</label><input id="dc-due" type="date" value="${v("dc-due")}">`
      : decideKind === "hired" ? `
        ${offerTypeReady ? `
        <label>この方をどの形で迎えますか？ <span style="color:#b3261e;">*</span></label>
        <div id="dc-otypes">${offerTypeCards(decideOfferType, "pickDecideOfferType")}</div>` : `
        <p class="hr-flow-note">採用区分（正社員・育成枠・業務委託など）を選ぶには db/129 の適用が必要です。いまは合格だけを保存し、これまでの合格通知で進めます。</p>`}
        ${note}` : note;
  }

  function pickDecideOfferType(key) {
    decideOfferType = key;
    if (el("dc-otypes")) el("dc-otypes").innerHTML = offerTypeCards(decideOfferType, "pickDecideOfferType");
  }

  function setDecideKind(kind) {
    for (const id of ["dc-reason", "dc-next", "dc-due", "dc-note"]) if (el(id)) fieldMemo[id] = el(id).value;
    decideKind = kind;
    renderStep1();
  }

  /** 評価欄の入力（変わっていなければ null） */
  function decideEvalPatch() {
    const iv = flow?.ceoInterview;
    if (!iv || !el("dc-ceo-notes")) return null;
    const scores = { ...flow.scores };
    const notes = el("dc-ceo-notes").value.trim();
    const same = JSON.stringify(scores) === JSON.stringify(iv.scores || {}) && notes === (iv.notes || "");
    return same ? null : { id: iv.id, scores, notes };
  }

  async function submitDecide(btn) {
    const msg = el("dc-msg"); msg.textContent = "";
    const body = { id: flow.applicantId, decision: decideKind };
    let summary = "";
    if (decideKind === "hired") {
      // 採用区分を選んでから合格にする（区分ごとに、必要な条件だけでオファーを作るため）
      if (offerTypeReady && offerTypesDef.length && !decideOfferType) { msg.textContent = "どの形で迎えるか（採用区分）を選んでください"; return; }
      body.stage = "offer"; body.status = "offer_draft_pending";
      if (decideOfferType) body.offerType = decideOfferType;
      body.decisionNote = el("dc-note").value.trim() || undefined;
      const t = offerTypeDef(decideOfferType);
      if (t) summary = `採用区分：${t.label}`;
    } else if (decideKind === "hold") {
      const next = el("dc-next").value.trim();
      if (!next) { msg.textContent = "次に確認することを入力してください"; return; }
      body.holdReason = el("dc-reason").value.trim() || undefined;
      body.holdNextStep = next;
      body.decisionDueOn = el("dc-due").value || undefined;
      summary = [body.holdReason ? `保留理由：${body.holdReason}` : null, `次に確認：${next}`,
        body.decisionDueOn ? `再判断期限：${body.decisionDueOn}` : null].filter(Boolean).join("　");
    } else {
      body.status = "passed";
      body.decisionNote = el("dc-note").value.trim() || undefined;
    }
    try {
      await KPLayout.busy(btn, "保存中…", async () => {
        const ev = decideEvalPatch();
        if (ev) await API.updateHrInterview(ev);
        await API.updateHrApplicant(body);
      });
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; return; }
    Object.assign(flow, { step: "contact", savedKind: decideKind, summary });
    renderEval(); renderStep1();
    await loadMessage();
    await afterDecision();
  }

  /** ⑥ 本人へ連絡（STEP 2） */
  async function loadMessage() {
    const box = el("dc-step2");
    if (!box) return;
    box.className = "hr-flow-sec";
    box.innerHTML = `<div class="hr-flow-hd"><h3><span class="st">STEP 2</span>本人へ連絡</h3>${flowState(false, "", "未完了")}</div>
      <p class="hr-flow-note">文面を用意しています…</p>`;
    let r = null;
    try { r = await API.api(`/api/hr/applicants/message?id=${encodeURIComponent(flow.applicantId)}&kind=${encodeURIComponent(flow.savedKind)}`); }
    catch { r = null; }
    // 文面を作れない（古いサーバ等）ときは、判断の保存だけで閉じる
    if (!r?.subject) { if (flow.contactOnly) renderStep2(); else closeDecisionModal(); return; }
    flow.message = r;
    if (flow.contactOnly && el("dc-name") && !flow.name) el("dc-name").textContent = r.to ? `宛先：${r.to}` : "";
    renderStep2();
  }

  function renderStep2() {
    const box = el("dc-step2");
    if (!box) return;
    const head = (done) => `<div class="hr-flow-hd"><h3><span class="st">STEP 2</span>本人へ連絡</h3>${flowState(done, "連絡済み", "未完了")}</div>`;
    if (flow.step === "decide") {
      box.className = "hr-flow-sec is-wait";
      box.innerHTML = `${head(false)}<p class="hr-flow-note">採用判断を保存すると、本人へ伝える文面がここに出ます。判断の保存と本人への連絡は別の操作です。</p>`;
      return;
    }
    box.className = "hr-flow-sec";
    if (flow.step === "done") {
      box.innerHTML = `${head(true)}<p class="hr-flow-sum">${flow.sentChannel === "email" ? "メールで送りました。" : "送付済みとして記録しました。"}選考タイムラインに残っています。</p>`;
      return;
    }
    const r = flow.message;
    if (!r) { box.innerHTML = `${head(false)}<p class="hr-flow-note">文面を用意できませんでした。</p>`; return; }
    const canMail = Boolean(r.mail?.configured);
    // メイン操作は1つだけ：メールで送れるなら「メールで送る」、送れなければ「メールソフトで開く」（宛先が無ければ「コピー」）
    const primary = canMail ? "email" : r.to ? "mailer" : "copy";
    const cls = (k) => (k === primary ? "btn btn-primary" : "btn btn-secondary");
    box.innerHTML = `${head(false)}
        <p class="hr-flow-note" style="margin-bottom:10px;">${esc(r.label)}の文面です。直してから送れます（社内の評価・所感は入っていません）。</p>
        <label>宛先</label>
        <div style="font-size:13px;margin-bottom:8px;">${r.to ? esc(r.to) : `<span class="muted">メールアドレスが登録されていません</span>`}</div>
        <label>件名</label><input id="msg-subject" type="text" maxlength="200" value="${esc(r.subject)}">
        <label style="margin-top:10px;">本文</label><textarea id="msg-body" rows="11">${esc(r.body)}</textarea>
        ${canMail ? "" : `<div class="banner warn" style="margin-top:10px;"><span class="material-symbols-outlined">mail</span>
          <div>このシステムからはメールを送れません（${esc(r.mail?.reason || "未設定")}）。${r.to ? "メールソフトで開く" : "コピー"}で送り、送ったら「送付済みにする」を押してください。</div></div>`}
        <div id="msg-msg" class="err-text" style="margin:8px 0 0;"></div>
        <div class="hr-msg-actions">
          ${canMail ? `<button class="${cls("email")}" onclick="sendDecisionMessage('email', this)"><span class="material-symbols-outlined icon-inline">send</span>メールで送る</button>` : ""}
          ${r.to ? `<button class="${cls("mailer")}" onclick="openMailer()"><span class="material-symbols-outlined icon-inline">open_in_new</span>メールソフトで開く</button>` : ""}
          <button class="${cls("copy")}" onclick="copyDecisionMessage(this)"><span class="material-symbols-outlined icon-inline">content_copy</span>コピー</button>
          <button class="btn btn-secondary" onclick="sendDecisionMessage('manual', this)"><span class="material-symbols-outlined icon-inline">task_alt</span>送付済みにする</button>
          <button class="later" onclick="closeDecisionModal()">あとで連絡する</button>
        </div>`;
  }

  function openMailer() {
    const q = `subject=${encodeURIComponent(el("msg-subject").value)}&body=${encodeURIComponent(el("msg-body").value)}`;
    window.location.href = `mailto:${encodeURIComponent(flow.message.to)}?${q}`;
  }

  async function copyDecisionMessage(btn) {
    const text = `${el("msg-subject").value}\n\n${el("msg-body").value}`;
    try { await navigator.clipboard.writeText(text); btn.lastChild.textContent = "コピーしました"; }
    catch { el("msg-body").select(); el("msg-msg").textContent = "コピーできませんでした。本文を選んでコピーしてください"; }
  }

  async function sendDecisionMessage(channel, btn) {
    if (channel === "manual" && !confirm("本人へ送ったものとして記録します。よろしいですか？")) return;
    const msg = el("msg-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, channel === "email" ? "送信中…" : "記録中…", () => API.api("/api/hr/applicants/message", {
        method: "POST", body: { id: flow.applicantId, kind: flow.savedKind, channel,
          subject: el("msg-subject").value, body: el("msg-body").value },
      }));
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; return; }
    Object.assign(flow, { step: "done", sentChannel: channel });
    renderStep2();
    await afterDecision();
  }

  // 「面談を実施済みにする」の対象が見つからないとき。面談の予定は作らず、面談タブで確かめてもらう
  function showNoInterviewToConduct() {
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 10px;">実施する面談が見つかりません</h2>
      <p id="no-iv-msg" style="font-size:13px;color:#1b2440;margin:0 0 16px;">実施対象の面談が見つかりません。<br>面談タブで予定を確認してください。</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="closeAction();setDetailTab('interviews')">面談タブを確認</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }

  async function conductInterview(id) {
    if (!confirm("この面談を実施済みにします。よろしいですか？")) return;
    try {
      await API.conductHrInterview(id);
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "できませんでした"); }
  }

  // ---- メールを送る（ひな型から。api/hr/applicants/mail.js） ----------------------------
  // ひな型を選ぶ → 差し込み済みの件名・本文を確かめる（直せる）→［送信］。
  //   ・ここで直した内容は、このメール1通だけに使う（ひな型は変わらない）
  //   ・直したあとにひな型を変えると、直した内容は消える。黙って消さず、確かめる
  //   ・差し込めない項目（予約URLの設定が無い等）があれば、理由を出して送らせない
  //   ・送信の鍵（requestKey）は1回の「送信」ごとに1つ。通信が切れてやり直しても、同じ鍵なので2通目は送られない
  //   ・結果は3つに分ける：送信済み（メールサービスが受け付けた）／失敗／結果不明（すぐに送り直さない）
  let mailFlow = null;
  const MAIL_STATUS = {
    sent: ["送信済み", "ok", "メールサービスが受け付けました（相手に届いた・開いた、ではありません）"],
    failed: ["失敗", "ng", "送れませんでした"],
    unknown: ["結果不明", "warn", "送れたかどうか分かりません。相手に届いているか確かめてから、必要なら送り直してください"],
    sending: ["結果不明", "warn", "送信中のまま終わっています。相手に届いているか確かめてください"],
    not_sent: ["未送信", "warn", "送信の設定が無く、送っていません"],
  };
  const TAG_RE = /\{\{\s*([^{}]+?)\s*\}\}/g;
  const newMailKey = () => {
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  };

    f.data = r;

    f.phase = "edit"; f.result = null;

  function mailResultHtml() {
    const f = mailFlow;

      <span class="material-symbols-outlined">${st[1] === "ok" ? "check_circle" : st[1] === "ng" ? "error" : "help"}</span>

  function changeMailTemplate(sel) {
    const f = mailFlow;
    if (!f) return;
    if (mailDirty() && !confirm("直した内容は消えます（このメールは送っていません）。ひな型を変えますか？")) {
      sel.value = f.data.rendered?.templateId || "";

  function retryMailEdit() {
    const f = mailFlow;
    if (!f) return;
    // 失敗（送れなかったことが確か）のときだけ、直してから送り直せる。新しい送信なので鍵も新しくする
    f.phase = "edit"; f.key = newMailKey(); f.result = null;
    const typed = f.typed;
    renderMailForm();
    if (typed) { el("mail-subject").value = typed.subject; el("mail-body").value = typed.body; }

  async function sendApplicantMail(btn) {
    const f = mailFlow;
    if (!f || f.sending) return;              // 二度押し
    const msg = el("mail-msg"); msg.textContent = "";
    const subject = el("mail-subject").value, body = el("mail-body").value;
    const left = [...`${subject}\n${body}`.matchAll(TAG_RE)].map((m) => `{{${m[1]}}}`);
    if (left.length) { msg.textContent = `差し込まれていない項目が残っています：${[...new Set(left)].join("・")}`; return; }
    if (/[\r\n]/.test(subject)) { msg.textContent = "件名に改行は使えません"; return; }
    const a = f.data.applicant;
    if (!confirm(`${a.name} 様（${a.email}）へ送信します。よろしいですか？`)) return;
    f.sending = true;
    f.typed = { subject, body };
    let r = null, err = null;
    try {
      r = await KPLayout.busy(btn, "送信中…", () => API.api("/api/hr/applicants/mail", {
        method: "POST", invalidates: [],
        body: { id: f.applicantId, templateId: f.data.rendered.templateId, templateVersion: f.data.rendered.templateVersion,
          subject, body, requestKey: f.key },
      }));
    } catch (e) { err = e; }
    f.sending = false;
    if (mailFlow !== f) return;
    if (err && !err.status) {
      // 通信が切れて、送れたか分からない。鍵はそのまま（もう一度押しても、送れていれば2通目は送られない）
      msg.textContent = "通信が切れました。もう一度［送信］を押すと、送れたかどうかを確かめます（送れていれば2通目は送りません）";
      return;
    }
    if (err) {
      const b = err.body || {};
      if (b.status === "failed" || b.status === "not_sent") {
        f.result = { status: b.status, hint: err.hint };
        f.phase = "failed";
      } else {
        // 送る前に断られた（差し込み残り・ひな型が変わった等）。送っていないので、直してそのまま送れる
        msg.textContent = (b.problems || [err.hint || err.message]).join("／");
        if (["template_changed", "template_inactive"].includes(b.error)) f.key = newMailKey();
        return;
      }
    } else {
      f.result = { status: r.status, hint: r.hint, duplicate: r.duplicate };
      f.phase = r.status === "sent" ? "sent" : r.status === "failed" ? "failed" : "unknown";
    }
    // 送った記録を取り直す（ひな型の選択は今のまま）
    try {
      const again = await API.api(`/api/hr/applicants/mail?id=${encodeURIComponent(f.applicantId)}&templateId=${encodeURIComponent(f.data.rendered.templateId)}`);
      if (mailFlow === f) f.data.sends = again.sends;
    } catch { /* 記録の再読み込みに失敗しても、結果は出す */ }
    if (mailFlow !== f) return;
    renderMailForm();
    if (f.phase === "sent") refreshDetail().catch(() => {});
  }

    const msg = el("ev-msg"); msg.textContent = "";
    const rank = el("ev-rank").value;
    if (!rank) { msg.textContent = "ランクを選んでください"; return; }
    const scores = {};
    for (const it of detail.evalItems || []) {
      const picked = document.querySelector(`input[name="ev-${it.key}"]:checked`);
      if (picked) scores[it.key] = picked.value;
    }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.evaluateHrInterview({
        id, scores, rank,
        recommendReason: el("ev-reason").value.trim() || undefined,
        notes: el("ev-notes").value.trim() || undefined,
        nextDueOn: el("ev-due").value || undefined,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ---- 合格通知を作成・確認（右ドロワー） --------------------------------------------
  // Stage 5：作成→社内確認→確定（本人送付待ち）まで。本人への実際の送付はStage 6
  const OFFER_STATUS_LABEL = {
    none: "—", draft: "作成中", sent: "送付済み", viewed: "閲覧済み", accepted: "承諾", declined: "辞退",
    revoked: "無効化", expired: "期限切れ",
  };
  function offerRow(o) {
    return `
      <div class="card" style="margin-bottom:10px;">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">第${o.version}版${o.offerType ? `　${esc(o.offerName || "")}` : ""}
          <span class="hr-pill" style="background:#e7eaf3;color:#1b2440;margin-left:6px;">${esc(OFFER_STATUS_LABEL[o.status] || o.status)}</span></div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">回答期限：${esc(o.respondBy || "—")}
          ${o.sentAt ? `　送付：${esc(fmtDate(o.sentAt))}` : ""}
          ${o.viewedAt ? `　閲覧：${esc(fmtDate(o.viewedAt))}` : ""}
          ${o.acceptedAt ? `　承諾：${esc(fmtDate(o.acceptedAt))}` : ""}
          ${o.declinedAt ? `　辞退：${esc(fmtDate(o.declinedAt))}` : ""}</div>
        ${o.messageToCandidate ? `<div style="font-size:12px;margin-top:4px;">${esc(o.messageToCandidate)}</div>` : ""}
        ${o.declineReason ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">辞退理由：${esc(o.declineReason)}</div>` : ""}
      </div>`;
  }

  // いま有効な（無効化されていない）最新の合格通知。版は新しい順に並んでいる
  function currentOffer() {
    const list = detail.offers || [];
    return list.find((o) => o.status !== "revoked") || null;
  }

  // ---- 採用区分を選ぶ（合格後。区分を選ぶと、その区分のオファーの入力へ進む） ------------------
  let pickOfferType = null;
  function openOfferTypeModal() {
    const a = detail.applicant;
    pickOfferType = a.offerType || null;
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">この方をどの形で迎えますか？</h2>
        <p class="hr-sub" style="margin:0 0 12px;">${esc(a.name)}さん　選んだ区分に必要な項目だけで、オファー（候補者へ送る条件）を作ります。</p>
        <div id="ot-cards">${offerTypeCards(pickOfferType, "pickModalOfferType")}</div>
        <div id="ot-msg" class="err-text" style="margin:10px 0 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn btn-primary" id="ot-save" onclick="submitOfferType(this)">この区分で進む</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }
  function pickModalOfferType(key) {
    pickOfferType = key;
    el("ot-cards").innerHTML = offerTypeCards(pickOfferType, "pickModalOfferType");
  }
  async function submitOfferType(btn) {
    const msg = el("ot-msg"); msg.textContent = "";
    if (!pickOfferType) { msg.textContent = "採用区分を選んでください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({ id: detail.applicant.id, offerType: pickOfferType }));
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; return; }
    closeAction();
    await refreshDetail();
    load();
    openOfferForm();   // 続けて、その区分の条件を入れる
  }

  // ---- オファー（候補者へ送る条件）を作る・確認する ------------------------------------------
  // 採用区分があれば、その区分に必要な項目だけを出す（業務委託に正社員向けの項目を並べない）。
  // 区分の無い、これまでの合格通知は従来の項目のまま
  let offerFormType = null;
  function openOfferForm() {
    const a = detail.applicant;
    const reviewing = a.status === "offer_review_pending";
    const o = reviewing ? currentOffer() : null;
    const t = offerTypeDef(reviewing ? o?.offerType : a.offerType);
    if (!t) { offerFormType = null; return openLegacyOfferForm(); }
    offerFormType = t;
    const hideSalary = detail.salaryVisible === false;
    const terms = o?.offerTerms || {};
    // 既存の値：確認中はその版の値、作成時は応募者に入っている条件（区分の選択肢に無い値は入れない）
    const valueOf = (f) => {
      const raw = f.term ? terms[f.key] : (o ? o[f.key] : a[f.key]);
      if (raw == null) return "";
      if (f.kind === "select" && !(f.options || []).includes(raw)) return "";
      return raw;
    };
    const field = (f) => {
      const id = `of-f-${f.key}`;
      const v = valueOf(f);
      const unit = f.kind === "number" && f.unit ? `（${esc(f.unit)}）` : "";
      const ctl = f.kind === "textarea" ? `<textarea id="${id}" rows="3" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`
        : f.kind === "select" ? `<select id="${id}"><option value="">（選択）</option>${f.options.map((op) =>
          `<option value="${esc(op)}" ${op === v ? "selected" : ""}>${esc(op)}</option>`).join("")}</select>`
        : `<input id="${id}" type="${f.kind === "number" ? "number" : f.kind === "date" ? "date" : "text"}"
            ${f.kind === "number" ? 'step="any" min="0"' : ""} value="${esc(v)}" placeholder="${esc(f.placeholder || "")}">`;
      return `<div class="${f.kind === "textarea" ? "wide" : ""}" data-field="${esc(f.key)}">
        <label for="${id}">${esc(f.label)}${unit}${f.required ? ` <span style="color:#b3261e;">*</span>` : ""}</label>${ctl}</div>`;
    };
    const shown = t.fields.filter((f) => !(f.salary && hideSalary));
    const canChangeType = !reviewing && a.status === "offer_draft_pending";
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">${esc(t.offerName)}を${reviewing ? "確認" : "作成"}</h2>
        <p class="hr-sub" style="margin:0 0 10px;">採用区分：<b id="of-type" data-otype="${esc(t.key)}">${esc(t.label)}</b>
          ${canChangeType ? `<button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="closeAction();openOfferTypeModal()">区分を変える</button>` : ""}<br>
          候補者には「${esc(t.offerName)}」として届きます（社内の状態や評価は見えません）。本人へ送るまでは、いつでも直せます。</p>
        <div class="hr-of-docs"><b>この区分の流れ</b>　${esc((t.flow || []).join(" → "))}<br><b>必要書類</b>　${esc((t.documents || []).join("・"))}</div>
        <div class="hr-of-grid" id="of-fields" data-otype="${esc(t.key)}">${shown.map(field).join("")}</div>
        ${hideSalary && t.fields.some((f) => f.salary) ? `
        <p class="hr-sub" style="margin:10px 0 0;">給与・報酬は、権限のある方が入力・確認します（応募者に入っている条件が、そのままオファーに入ります）。</p>` : ""}
        <div class="hr-of-grid" style="margin-top:10px;">
          <div><label for="of-respondby">回答期限 <span style="color:#b3261e;">*</span></label>
            <input id="of-respondby" type="date" value="${esc(o?.respondBy || "")}"></div>
          <div class="wide"><label for="of-message">本人向けメッセージ</label>
            <textarea id="of-message" rows="3">${esc(o?.messageToCandidate || "")}</textarea></div>
        </div>
        <div id="of-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn ${reviewing ? "btn-secondary" : "btn-primary"}" onclick="submitOffer(this)">${reviewing ? "内容を保存" : "オファーを作成"}</button>
          ${reviewing ? `<button class="btn btn-primary" onclick="submitConfirmOffer(this)">確定して送付待ちにする</button>` : ""}
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  /** 区分つきの入力。既存の列の項目はそのまま、区分にしか無い項目は offerTerms にまとめる。空欄は消す（null） */
  function typedOfferFields(t) {
    const out = { offerTerms: {}, messageToCandidate: el("of-message").value.trim() || undefined };
    for (const f of t.fields) {
      const node = el(`of-f-${f.key}`);
      if (!node) continue;   // 給与を見られない人には出していない（送らない＝変えない）
      const v = String(node.value || "").trim();
      if (f.term) { if (v) out.offerTerms[f.key] = v; } else out[f.key] = v;
    }
    return out;
  }
  const offerFields = () => (offerFormType ? typedOfferFields(offerFormType) : offerFormFields());

  function openLegacyOfferForm() {
    const a = detail.applicant;
    const reviewing = a.status === "offer_review_pending";
    const o = reviewing ? currentOffer() : null;
    const v = (k, fallback) => esc((o ? o[k] : null) ?? fallback ?? "");
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">合格通知を${reviewing ? "確認" : "作成"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">候補者本人に送る、確定した条件です。本人へ送付するまでは、いつでも直せます。</p>
        <label>雇用形態</label><input id="of-employment" type="text" value="${v("employmentType", a.employmentType)}">
        <label style="margin-top:10px;">入社予定日</label><input id="of-join" type="date" value="${v("joinDate", a.joinDate)}">
        <label style="margin-top:10px;">契約形態</label><input id="of-contract" type="text" value="${v("contractType", a.contractType)}">
        <label style="margin-top:10px;">契約期間満了日（有期のみ）</label><input id="of-contractend" type="date" value="${v("contractEndDate", a.contractEndDate)}">
        <label style="margin-top:10px;">試用期間（月）</label><input id="of-prob" type="number" value="${v("probationMonths", a.probationMonths)}">
        ${detail.salaryVisible === false ? `
        <p class="hr-sub" style="margin:10px 0 0;">給与・報酬は、権限のある方が入力・確認します（応募者に入っている条件が、そのまま合格通知に入ります）。</p>` : `
        <label style="margin-top:10px;">給与区分</label><input id="of-wagetype" type="text" value="${v("wageType", a.wageType)}">
        <label style="margin-top:10px;">給与・報酬</label><input id="of-wage" type="number" value="${v("wageAmount", a.wageAmount)}">`}
        <label style="margin-top:10px;">勤務時間（週）</label><input id="of-hours" type="number" step="0.5" value="${v("weeklyHours", a.weeklyHours)}">
        <label style="margin-top:10px;">勤務地</label><input id="of-loc" type="text" value="${v("workLocation", a.workLocation)}">
        <label style="margin-top:10px;">回答期限 <span style="color:#b3261e;">*</span></label>
        <input id="of-respondby" type="date" value="${v("respondBy", "")}">
        <label style="margin-top:10px;">本人向けメッセージ</label>
        <textarea id="of-message" rows="3">${v("messageToCandidate", "")}</textarea>
        <div id="of-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
          <button class="btn ${reviewing ? "btn-secondary" : "btn-primary"}" onclick="submitOffer(this)">${reviewing ? "内容を保存" : "作成する"}</button>
          ${reviewing ? `<button class="btn btn-primary" onclick="submitConfirmOffer(this)">確定して送付待ちにする</button>` : ""}
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  function offerFormFields() {
    return {
      employmentType: el("of-employment").value.trim() || undefined,
      joinDate: el("of-join").value || undefined,
      contractType: el("of-contract").value.trim() || undefined,
      contractEndDate: el("of-contractend").value || undefined,
      probationMonths: el("of-prob").value || undefined,
      // 給与の欄が無い（給与を見られない）ときは送らない
      wageType: el("of-wagetype")?.value.trim() || undefined,
      wageAmount: el("of-wage")?.value || undefined,
      weeklyHours: el("of-hours").value || undefined,
      workLocation: el("of-loc").value.trim() || undefined,
      messageToCandidate: el("of-message").value.trim() || undefined,
    };
  }

  async function submitOffer(btn) {
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    const fields = offerFields();
    try {
      if (detail.applicant.status === "offer_review_pending") {
        const o = currentOffer();
        await KPLayout.busy(btn, "保存中…", () => API.updateHrOffer({ id: o.id, ...fields, respondBy }));
      } else {
        await KPLayout.busy(btn, "作成中…", () => API.createHrOffer({ applicantId: detail.applicant.id, ...fields, respondBy }));
      }
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  async function submitConfirmOffer(btn) {
    const o = currentOffer();
    if (!o) return;
    const msg = el("of-msg"); msg.textContent = "";
    const respondBy = el("of-respondby").value;
    if (!respondBy) { msg.textContent = "回答期限を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "確定中…", async () => {
        await API.updateHrOffer({ id: o.id, ...offerFields(), respondBy });
        await API.confirmHrOffer(o.id);
      });
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "確定できませんでした"; }
  }

  // ---- 本人へ送る・URLを再発行（右ドロワー） -----------------------------------------
  // Stage 6：メール送信の仕組みは無いので、URLを発行してコピーしてもらい、
  // 実際に送り終えたら「送付済みにする」を明示的に押してもらう（README §12）
  function openSendOfferForm() {
    const reissuing = ["offer_sent", "offer_viewed", "offer_response_pending"].includes(detail.applicant.status);
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">${reissuing ? "URLを再発行" : "本人へ送る"}</h2>
        <p class="hr-sub" style="margin:0 0 14px;">
          ${reissuing ? "現在のURLは使えなくなります。新しいURLを発行しますか？" : "候補者専用のURLを発行します。メール送信の仕組みはまだ無いので、いつもお使いのメールから手動で送ってください。"}</p>
        <div id="so-body">
          <button class="btn btn-primary" onclick="submitIssueLink(this)">${reissuing ? "再発行する" : "URLを発行する"}</button>
        </div>
        <div id="so-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`, { wide: true });
  }

  async function submitIssueLink(btn) {
    const msg = el("so-msg"); msg.textContent = "";
    const o = currentOffer();
    if (!o) return;
    try {
      const r = await KPLayout.busy(btn, "発行中…", () => API.issueHrOfferLink(o.id));
      const url = `${location.origin}/hr/offer.html?token=${encodeURIComponent(r.token)}`;
      const mail = offerMailTemplate(url);
      el("so-body").innerHTML = `
        <label>候補者専用URL（この画面を閉じると、二度と表示されません）</label>
        <input id="so-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-url')">URLをコピー</button>
        <label style="margin-top:14px;">メール文面</label>
        <textarea id="so-mail" rows="9" readonly>${esc(mail)}</textarea>
        <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('so-mail')">メール文面をコピー</button>
        <p class="muted" style="font-size:12px;margin-top:12px;">
          上のURLをメールに貼って、実際に送ってください。送り終えたら、下のボタンを押して記録してください。</p>
        <button class="btn btn-primary" style="margin-top:6px;" onclick="submitMarkSent(this, '${esc(r.offer.id)}')">送付済みにする</button>`;
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "発行できませんでした"; }
  }

  function offerMailTemplate(url) {
    const a = detail.applicant;
    const o = currentOffer();
    const t = offerTypeDef(o?.offerType);
    return `件名：${t ? `${t.offerName}のご案内` : "選考結果のご案内"}

${a.name} 様

このたびは弊社採用選考にご参加いただき、ありがとうございました。

${t ? `${t.offerName}（条件）を、下記の専用ページよりご確認ください。` : "選考結果および採用条件について、下記の専用ページよりご確認ください。"}

${url}

回答期限：${o?.respondBy || ""}

ご不明点がございましたら、採用担当までご連絡ください。`;
  }

  async function copyText(id) {
    const val = el(id).value;
    try { await navigator.clipboard.writeText(val); } catch {}
    el(id).select();
  }

  async function submitMarkSent(btn, offerId) {
    try {
      await KPLayout.busy(btn, "記録中…", () => API.markHrOfferSent(offerId));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "記録できませんでした"); }
  }

  // ---- 本採用へ進める（Stage 8） ---------------------------------------------------
  // 実際の社員登録は既存のadmin-onboard.htmlで行う（作り直さない）。
  // 二重手続きを防いでから、応募者IDだけを渡す。給与・勤務条件はURLへ載せず、
  // admin-onboard.html側がサーバから改めて取得する（README Stage 8）
  // ---- 無限道場リード：面談後の次のアクション ------------------------------------------
  // 選択肢は API（lib/hr-lead-flow.js）が返す。画面側に定義を持たない
  function openLeadNextActionForm() {
    const a = detail.applicant;
    const opts = (detail.leadNextActions || []).map((x) => `
      <label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;">
        <input type="radio" name="lead-next" value="${esc(x.key)}" ${a.leadNextAction === x.key ? "checked" : ""}> ${esc(x.label)}</label>`).join("");
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">次のアクションを選ぶ</h2>
      <p class="hr-sub" style="margin:0 0 10px;">${esc(a.name)}さんの、面談後の次のアクションです。段階と状態はこれに合わせて変わります。</p>
      <div>${opts || `<p class="muted">選択肢を読み込めませんでした。</p>`}</div>
      <label style="margin-top:10px;">メモ（任意。保留なら次に確認すること）</label>
      <textarea id="lead-next-note" rows="3" maxlength="500"></textarea>
      <div id="lead-next-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-primary" onclick="submitLeadNextAction(this)">保存する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }
  async function submitLeadNextAction(btn) {
    const picked = document.querySelector('input[name="lead-next"]:checked');
    if (!picked) { el("lead-next-msg").textContent = "次のアクションを選んでください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.api("/api/hr/applicants/detail", { method: "PATCH", body: {
        id: detail.applicant.id, action: "leadNextAction", nextAction: picked.value, note: el("lead-next-note").value,
      } }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { el("lead-next-msg").textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ---- 無限道場リードの通知先（運営担当） ------------------------------------------------
  // 新しいリードが入ったら、ここで選んだ人へ通知する。誰も選んでいなければ採用HRの担当へ届く
  async function openLeadWatchers() {
    openHrModal(`<p class="muted">読み込み中…</p>`);
    try {
      const r = await API.api("/api/hr/lead-watchers?category=mugendojo");
      const on = new Set(r.employeeIds || []);
      openHrModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">無限道場リードの通知先</h2>
        <p class="hr-sub" style="margin:0 0 10px;">新しいリードが入ったとき、選んだ人へ通知します。誰も選ばなければ、採用HRの担当（経営者・人事・採用担当）へ届きます。</p>
        ${r.notReady ? `<div class="banner warn"><span class="material-symbols-outlined">build</span><div>${esc(r.message)}</div></div>` : `
        <div class="hr-watch-list" style="max-height:320px;overflow:auto;">${(r.employees || []).map((e) => `
          <label><input type="checkbox" name="lead-watch" value="${esc(e.id)}" ${on.has(e.id) ? "checked" : ""}> ${esc(e.display_name)}</label>`).join("")}</div>
        <div id="lead-watch-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-primary" onclick="submitLeadWatchers(this)">保存する</button>
          <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
        </div>`}`);
    } catch (e) {
      openHrModal(`<div class="banner err"><span class="material-symbols-outlined">error</span><div>${esc(e.hint || e.detail || e.message)}</div></div>
        <button class="btn btn-secondary" style="margin-top:12px;" onclick="closeHrModal()">閉じる</button>`);
    }
  }
  async function submitLeadWatchers(btn) {
    const ids = [...document.querySelectorAll('input[name="lead-watch"]:checked')].map((x) => x.value);
    try {
      await KPLayout.busy(btn, "保存中…", () => API.api("/api/hr/lead-watchers", { method: "PUT", body: { category: "mugendojo", employeeIds: ids } }));
      closeHrModal();
    } catch (e) { el("lead-watch-msg").textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  async function startAdvance() {
    try {
      await API.claimHrAdvance(detail.applicant.id);
      location.href = `../admin-onboard.html?applicantId=${encodeURIComponent(detail.applicant.id)}`;
    } catch (e) { alert(e.hint || e.detail || e.message || "本採用の手続きを始められませんでした"); }
  }
</script>

</body>
</html>
