  // ---- 概要：値のある項目だけを出す（空欄は［詳細を表示］の中）。メールはその場で登録・編集 --------------------
  function basicInfo(a, ev, evLine) {
    const salary = detail.salaryVisible === false ? null
      : a.wageAmount ? `${a.wageType || ""} ${Number(a.wageAmount).toLocaleString("ja-JP")}円` : null;
    const rank = a.rank ? `<span class="hr-rank ${esc(a.rank)}">${esc(a.rank)}</span> ${esc((detail.rankLabel || {})[a.rank] || "")}` : null;
    const evText = ev ? `${esc(ev.kindLabel)}：${esc(ev.rank)}${evLine ? `<br><small class="muted">${evLine}</small>` : ""}` : null;
    // [見出し, 表示（HTML。null は未登録）, 常に通常表示に出すか]
    const items = [
      ["応募経路", a.source ? esc(a.source) : null],
      ["応募職種", a.jobTitle ? esc(a.jobTitle) : null],
      ["担当", `<span id="hr-recruiter">${esc(a.recruiterName || "未定")}
        <button class="btn btn-secondary btn-sm" style="margin-left:6px;padding:2px 10px;" onclick="openRecruiterModal()">変更</button></span>`, true],
      ["ランク", rank],
      ["最新評価", evText],
      ["電話", a.phone ? esc(a.phone) : null],
      ["雇用形態", a.employmentType ? esc(a.employmentType) : null],
      ["入社予定日", a.joinDate ? esc(a.joinDate) : null],
      ...(detail.salaryVisible === false ? [] : [["給与", salary ? esc(salary) : null]]),
      ["勤務地", a.workLocation ? esc(a.workLocation) : null],
      ["選考段階", a.stageLabel ? esc(a.stageLabel) : null, false],
    ];
    const cell = ([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v ?? "—"}</dd></div>`;
    const shown = items.filter(([k, v, always]) => always || (v != null && k !== "選考段階"));
    const rest = items.filter((x) => !shown.includes(x));
    return `
        <dl class="hr-grid2" id="hr-basic">${shown.map(cell).join("")}</dl>
        ${emailRow(a)}
        ${rest.length ? `<details class="hr-more-info" id="hr-more-info">
          <summary><span class="when-closed">詳細を表示</span><span class="when-open">詳細を閉じる</span></summary>
          <dl class="hr-grid2" style="margin-top:8px;">${rest.map(cell).join("")}</dl></details>` : ""}`;
  }

  // メール：登録済みなら［編集］、未登録なら［メールを登録］。押すとその場で入力（大きなモーダルは開かない）
  let emailEditing = false;
  const EMAIL_RE = /^[^\s@<>"',;]+@[^\s@<>"',;]+\.[^\s@<>"',;]+$/;   // lib/mail isEmail と同じ形
  function emailRow(a) {
    if (isLead(a)) return "";
    if (emailEditing) {
      return `<div class="hr-email-row" id="hr-email-row"><label class="k" for="hr-email-input">メール</label>
        <input id="hr-email-input" type="email" inputmode="email" autocomplete="off" value="${esc(a.email || "")}" placeholder="example@example.com"
          onkeydown="if(event.key==='Enter'){event.preventDefault();saveEmailInline(this)}">
        <span class="acts"><button class="btn btn-primary btn-sm" id="hr-email-save" onclick="saveEmailInline(this)">保存</button>
          <button class="btn btn-secondary btn-sm" onclick="cancelEmailEdit()">キャンセル</button></span>
        <div class="err-text" id="hr-email-msg"></div></div>`;
    }
    return `<div class="hr-email-row" id="hr-email-row"><span class="k">メール</span>
      ${a.email ? `<span class="v" id="hr-email">${esc(a.email)}</span><button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="startEmailEdit()">編集</button>`
        : `<span class="v muted" id="hr-email">未登録</span><button class="btn btn-secondary btn-sm" style="padding:2px 10px;" onclick="startEmailEdit()">メールを登録</button>`}</div>`;
  }
  function rerenderEmailRow() {
    const row = el("hr-email-row");
    if (row) row.outerHTML = emailRow(detail.applicant);
    const head = el("hr-head-mail");
    if (head) { head.textContent = detail.applicant.email || "メール未登録"; head.classList.toggle("none", !detail.applicant.email); }
  }
  function startEmailEdit() { emailEditing = true; rerenderEmailRow(); el("hr-email-input")?.focus(); }
  function cancelEmailEdit() { emailEditing = false; rerenderEmailRow(); }

  /**
   * 応募者のメールを保存する（PATCH /api/hr/applicants/detail。形は lib/hr.js normalizeApplicant が確かめる）。
   * 前後の空白は除く。空欄は「未登録」に戻す。保存してもドロワー・送信画面は閉じない
   * @returns {Promise<string|null>} 保存できなければ理由
   */
  async function saveApplicantEmail(value, btn) {
    const email = String(value || "").trim();
    if (email && !EMAIL_RE.test(email)) return "メールアドレスの形式を確認してください";
    try {
      const r = await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({ id: detail.applicant.id, email }));
      detail.applicant = { ...detail.applicant, ...(r?.applicant || {}), email: r?.applicant?.email ?? (email || null) };
      load();   // 一覧も新しいメールに
      return null;
    } catch (e) { return e.hint || e.detail || e.message || "保存できませんでした"; }
  }
  async function saveEmailInline(btn) {
    const msg = el("hr-email-msg");
    msg.textContent = "";
    const wasRegister = detail.applicant.nextActionKey === "registerEmail";
    const err = await saveApplicantEmail(el("hr-email-input").value, btn);
    if (err) { msg.textContent = err; return; }
    emailEditing = false;
    // メール未登録の NEXT ACTION だったときは、NEXT ACTION ごと描き直す（日程調整を送るへ）
    if (wasRegister) { await refreshDetail(); return; }
    rerenderEmailRow();
  }

  /** 概要の社長面談の評価は1行だけ（詳しくは面談タブ） */
  function ceoEvalBrief(res) {
    const iv = (res?.interviews || []).find((i) => i.kind === "ceo" && i.done && !i.canceled);
    if (!iv || (!Object.keys(iv.scores || {}).length && !iv.notes && !iv.rank)) return "";
    return `<div class="hr-ceo-brief" data-ceo-brief><span>社長面談の評価</span><b>${esc(iv.rank || "—")}</b>
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;padding:2px 12px;" onclick="setDetailTab('interviews')">見る</button></div>`;
  }

  function renderDetailTab() {
    const a = detail.applicant;
    const box = el("hr-detail-tab");
    if (detailTab === "overview" && isLead(a)) {
      box.innerHTML = leadOverview(a);
    } else if (detailTab === "overview") {
      const ev = latestEvaluation();
      const evLine = ev ? (detail.evalItems || []).filter((e) => ev.scores?.[e.key])
        .map((e) => `${esc(e.label)} ${esc(scaleLabel(ev.scores[e.key]))}`).join("　") : "";
      const missing = docMissingLabels();
      box.innerHTML = `
        ${instructorApplication(a)}
        ${basicInfo(a, ev, evLine)}
        ${missing.length ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">
          ${esc(missing.join("・"))}が未登録です。<a href="#" onclick="setDetailTab('docs');return false;">書類タブ</a>から登録できます。</p>` : ""}
        ${ceoEvalBrief(detail)}
        ${(detail.offers || []).length ? `
        <h4 style="font-size:13px;color:#1b2440;margin:18px 0 10px;">オファー（候補者へ送る条件）</h4>
        ${detail.offers.map(offerRow).join("")}` : ""}`;
    } else if (detailTab === "interviews" || detailTab === "eval") {
      // 旧URL/状態の eval は互換のため残し、画面上は「選考」に面談＋評価をまとめる。
      if (detailTab === "eval") detailTab = "interviews";
      const ivs = [...(detail.interviews || [])].sort((a, b) => {
        const aa = a.scheduledAt ? Date.parse(a.scheduledAt) : Date.parse(a.createdAt || 0);
        const bb = b.scheduledAt ? Date.parse(b.scheduledAt) : Date.parse(b.createdAt || 0);
        return aa - bb;
      });
      box.innerHTML = `
        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">面談</h4>
        <button class="btn btn-secondary btn-sm" onclick="openScheduleForm()" style="margin:0 0 12px;">
          <span class="material-symbols-outlined icon-inline">add</span>面談を予定する</button>
        ${ivs.length ? ivs.map(interviewRow).join("")
          : `<p class="muted">まだ面談の記録がありません。</p>`}
        <h4 style="font-size:13px;color:#1b2440;margin:20px 0 10px;">評価</h4>
        ${evalTab(a)}`;
    } else if (detailTab === "mail") {
      box.innerHTML = `<p class="muted">読み込み中…</p>`;
      loadMailTab(a.id);
    } else if (detailTab === "docs") {
      box.innerHTML = renderDocsTab();
    } else {
      box.innerHTML = `
        <h4 style="font-size:13px;color:#1b2440;margin:0 0 10px;">選考タイムライン</h4>
        <div class="hr-tl">${(detail.timeline || []).map((t, i, arr) => `
          <div class="row"><div class="d">${esc(fmtDate(t.occurredAt))}${timelineWho(t) ? `<span class="who">・${esc(timelineWho(t))}</span>` : ""}</div>
            <div class="l">${esc(t.label)}${t.detail ? `　${esc(t.detail)}` : ""}${i === arr.length - 1 ? `<span class="now">← 現在</span>` : ""}</div>
          </div>`).join("") || `<p class="muted">まだ記録がありません。</p>`}</div>`;
    }
  }

  // 選考タイムラインの「誰が」。社内の操作は社員名、本人の閲覧・承諾・辞退は「本人」
  const CANDIDATE_EVENTS = ["offer_viewed", "offer_accepted", "offer_declined"];
  const timelineWho = (t) => t.actorName || (CANDIDATE_EVENTS.includes(t.eventKey) ? "本人" : "");

  // ---- 書類タブ ---------------------------------------------------------------------
  const fmtDay = (iso) => JST.date(iso);   // 日本時間の日付（js/jst.js）
  const fmtSize = (n) => (n ? (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`) : "");
  const docGroup = (type) => (docs?.documents || []).find((d) => d.docType === type) || null;

  /** 履歴書・職務経歴書のうち、まだ無いもの */
  function docMissingLabels() {
    if (!docs) return [];
    return ["resume", "work_history"].map(docGroup).filter((g) => g && !g.latest).map((g) => g.label);
  }

  // 応募書類の状態チップ（登録済み／未登録）
  const dstChip = (st, label) => `<span class="hr-dst" data-st="${esc(st)}">${esc(label)}</span>`;

  function renderDocsTab() {
    if (docsError) return `<div class="banner warn"><span class="material-symbols-outlined">info</span><div>${esc(docsError)}</div></div>`;
    if (!docs) return `<p class="muted">読み込み中…</p>`;
    // 応募書類：履歴書・職務経歴書・スキルシートは決まった枠（差し替えると前の版は履歴）、その他は何枚でも
    const main = ["resume", "work_history", "skill_sheet"].map(docGroup).filter(Boolean);
    const other = docGroup("other");
    const card = (g, d) => `
      <div class="hr-doc" data-doc="${esc(g.docType)}" data-state="${d ? "registered" : "none"}">
        <div class="t"><span class="material-symbols-outlined">${esc(g.icon)}</span>${esc(g.label)}${d ? dstChip("registered", "登録済み") : dstChip("none", "未登録")}</div>
        ${d ? `
          <div class="f">${esc(d.filename)}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))} アップロード${d.sizeBytes ? `・${esc(fmtSize(d.sizeBytes))}` : ""}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}${g.history.length ? `・過去の版 ${g.history.length}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button onclick="openUploadDoc('${esc(g.docType)}')">差し替え</button>
                <button onclick="openDocHistory('${esc(g.docType)}')">履歴を見る</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>` : `
          <div class="none">未登録</div>
          <div class="acts"><button class="btn btn-primary btn-sm" onclick="openUploadDoc('${esc(g.docType)}')">アップロード</button></div>`}
      </div>`;
    const others = other ? [other.latest, ...other.history].filter(Boolean) : [];
    return `
      ${contractCardHtml()}
      <h3 class="hr-doc-h" id="hr-docs-app">応募書類<span class="sub">履歴書・職務経歴書・スキルシート・その他</span></h3>
      ${main.map((g) => card(g, g.latest)).join("")}
      <div class="hr-doc" data-doc="other" data-state="${others.length ? "registered" : "none"}">
        <div class="t"><span class="material-symbols-outlined">attach_file</span>その他の書類${others.length ? dstChip("registered", `登録済み ${others.length}件`) : dstChip("none", "未登録")}</div>
        ${others.length ? others.map((d) => `
          <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
            <span class="f" style="margin:0;flex:1;min-width:160px;">${esc(d.filename)}
              <span class="m">　${esc(fmtDay(d.uploadedAt))}</span></span>
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <span class="hr-more">
              <button class="btn btn-secondary btn-sm" aria-label="その他の操作" onclick="toggleDocMenu(event, '${esc(d.id)}')">…</button>
              <div class="hr-menu-pop hidden" id="docmenu-${esc(d.id)}">
                <button onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
                <button onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
                <button class="danger" onclick="confirmDeleteDoc('${esc(d.id)}')">削除</button>
              </div>
            </span>
          </div>`).join("") : `<div class="none">未登録</div>`}
        <div class="acts"><button class="btn btn-secondary btn-sm" onclick="openUploadDoc('other')">アップロード</button></div>
      </div>
      ${condDocsHtml()}
      <p class="muted" style="font-size:11.5px;margin:8px 0 0;">
        書類は採用担当・人事・管理者だけが見られます。表示用のリンクは数分で切れます。</p>`;
  }

  // 採用条件書類（内定通知書・労働条件通知書・承諾済みPDF）。オファーから自動で並ぶ（ここでは登録しない・二重に持たない）。
  // 状態：未登録 → 登録済み → 送付済み → 本人確認済み → 承諾済み。PDF は給与・報酬が入るので、見られる人だけに［PDFを開く］を出す
  function condDocsHtml() {
    const c = docs?.conditionDocs;
    if (!c) return "";
    const icon = { offer: "mark_email_read", notice: "gavel", accepted: "verified" };
    const rows = (c.rows || []).filter((r) => r.applicable !== false).map((r) => {
      const canPdf = r.file === "offer" ? c.offerPdfReady !== false : (detail.salaryVisible !== false && c.docsReady);
      return `
      <div class="hr-doc" data-cond="${esc(r.key)}" data-state="${esc(r.state)}">
        <div class="t"><span class="material-symbols-outlined">${esc(icon[r.key] || "description")}</span>${esc(r.label)}${dstChip(r.state, r.stateLabel)}</div>
        <div class="m">${r.at ? `${esc(fmtDay(r.at))}${c.version && r.state !== "none" ? `・第${esc(c.version)}版` : ""}` : "　"}</div>
        ${r.note && r.state === "none" ? `<div class="note">${esc(r.note)}</div>` : ""}
        <div class="acts">
          ${r.file && canPdf ? `<button class="btn btn-secondary btn-sm" data-cond-open="${esc(r.file)}" onclick="openOfferPdf('${esc(c.offerId)}', '${esc(r.file)}', this)">PDFを開く</button>` : ""}
          ${r.file && r.file !== "offer" && !canPdf && detail.salaryVisible === false ? `<span class="muted" style="font-size:11.5px;">給与・報酬が入るため、PDF は給与を見られる方が確認します</span>` : ""}
          ${r.key === "offer" && c.offerId ? `<button class="btn btn-secondary btn-sm" onclick="setDetailTab('overview')">オファーを見る</button>` : ""}
        </div>
      </div>`; }).join("");
    return `
      <h3 class="hr-doc-h" id="hr-docs-cond">採用条件書類<span class="sub">オファーから自動で並びます（ここでは登録しません）</span></h3>
      ${rows}`;
  }

  function toggleDocMenu(ev, id) {
    ev.stopPropagation();
    const m = el(`docmenu-${id}`);
    const open = m && m.classList.contains("hidden");
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
    if (m && open) m.classList.remove("hidden");
  }
  document.addEventListener("click", () => {
    for (const x of document.querySelectorAll(".hr-menu-pop")) x.classList.add("hidden");
  });

  const findDoc = (id) => (docs?.documents || []).flatMap((g) => [g.latest, ...g.history]).find((d) => d && d.id === id);

  // プレビューは別タブの書類専用ページ（hr/document.html）で開く。
  // この画面の中には PDF を出さない（ドロワー・一覧・スクロール位置・選考の状態はそのまま）。
  // 別タブ側で、採用HRの権限を確かめてから短時間の signed URL を取り直す（公開URLにしない）
  function previewDoc(id) {
    const d = findDoc(id);
    const applicantId = d?.applicantId || detail?.applicant?.id;
    const url = `/hr/document.html?applicant=${encodeURIComponent(applicantId || "")}&doc=${encodeURIComponent(id)}`;
    window.open(url, "_blank", "noopener,noreferrer");
  }
  async function downloadDoc(id) {
    try { window.open((await API.hrDocumentUrl(id, true)).url, "_blank", "noopener"); }
    catch (e) { alert(e.hint || e.message || "保存できませんでした"); }
  }

  // 書類のアップロード（中央モーダル）。差し替えも同じ（前の版は履歴に残る）
  let docFile = null;
  function openUploadDoc(type) {
    docFile = null;
    const types = docs?.types || [{ key: "resume", label: "履歴書" }, { key: "work_history", label: "職務経歴書" }, { key: "skill_sheet", label: "スキルシート" }, { key: "other", label: "その他" }];
    const replacing = type !== "other" && docGroup(type)?.latest;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${replacing ? "書類を差し替え" : "書類をアップロード"}</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん</p>
      <label>書類の種類</label>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;">${types.map((t) => `
        <label style="display:flex;gap:5px;align-items:center;font-weight:500;margin:0;">
          <input type="radio" name="doc-type" value="${esc(t.key)}" ${t.key === (type || "resume") ? "checked" : ""}
                 style="width:auto;margin:0;">${esc(t.label)}</label>`).join("")}</div>
      <div class="hr-drop" id="doc-drop" onclick="el('doc-file').click()">
        <span class="material-symbols-outlined" style="font-size:28px;">upload_file</span>
        <div id="doc-drop-text">ここにファイルをドラッグ、または押して選択</div>
        <div style="font-size:11.5px;margin-top:4px;">PDF・DOC・DOCX・JPG・PNG／10MBまで</div>
      </div>
      <input id="doc-file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="hidden" onchange="pickDocFile(this.files[0])">
      ${replacing ? `<p class="muted" style="font-size:12px;margin:8px 0 0;">いまのファイルは「履歴」に残ります。</p>` : ""}
      <div id="doc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" id="doc-save" onclick="submitUploadDoc(this)">アップロード</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`, { wide: true });
    const drop = el("doc-drop");
    ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => pickDocFile(e.dataTransfer?.files?.[0]));
  }

  const DOC_MIME = ["application/pdf", "application/msword",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "image/jpeg", "image/png"];
  function pickDocFile(f) {
    const msg = el("doc-msg");
    msg.textContent = "";
    docFile = null;
    if (!f) return;
    const max = docs?.limits?.maxBytes || 10 * 1024 * 1024;
    if (!DOC_MIME.includes(f.type)) { msg.textContent = "PDF・Word（.doc / .docx）・JPEG・PNG を選んでください"; return; }
    if (f.size > max) { msg.textContent = "ファイルは10MBまでにしてください"; return; }
    docFile = f;
    el("doc-drop-text").textContent = `${f.name}（${fmtSize(f.size)}）`;
  }

  async function submitUploadDoc(btn) {
    const msg = el("doc-msg");
    msg.textContent = "";
    if (!docFile) { msg.textContent = "ファイルを選んでください"; return; }
    const type = document.querySelector('input[name="doc-type"]:checked')?.value || "other";
    try {
      await KPLayout.busy(btn, "アップロード中…", () => API.uploadHrDocument(detail.applicant.id, type, docFile));
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "アップロードできませんでした"; }
  }

  function openDocHistory(type) {
    const g = docGroup(type);
    if (!g) return;
    const list = [g.latest, ...g.history].filter(Boolean);
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 4px;">${esc(g.label)}の履歴</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(detail.applicant.name)}さん・新しい順</p>
      ${list.map((d, i) => `
        <div class="hr-doc" style="margin-bottom:8px;">
          <div class="f" style="margin:0;">${esc(d.filename)} ${i === 0 ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;">いまの版</span>` : ""}</div>
          <div class="m">${esc(fmtDay(d.uploadedAt))}${d.uploadedByName ? `・${esc(d.uploadedByName)}` : ""}</div>
          <div class="acts">
            <button class="btn btn-secondary btn-sm" onclick="previewDoc('${esc(d.id)}')">プレビュー</button>
            <button class="btn btn-secondary btn-sm" onclick="downloadDoc('${esc(d.id)}')">ダウンロード</button>
          </div>
        </div>`).join("")}
      <div style="margin-top:14px;"><button class="btn btn-secondary" onclick="closeAction()">閉じる</button></div>`, { wide: true });
  }

  // 削除は確認モーダルを挟む（一覧に赤い削除ボタンを常に置かない）
  function confirmDeleteDoc(id) {
    const d = findDoc(id);
    if (!d) return;
    el("confirm-root").innerHTML = `<div class="hr-modal-bg top" onclick="closeConfirm()"></div>
      <div class="hr-modal top" role="alertdialog" aria-modal="true">
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">書類を削除しますか？</h2>
        <p class="hr-sub" style="margin:0 0 6px;">${esc(d.docTypeLabel)}：${esc(d.filename)}</p>
        <p class="muted" style="font-size:12px;margin:0 0 14px;">ファイルは元に戻せません。過去の版があれば、1つ前の版がいまの版になります。</p>
        <div id="del-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" style="background:#b3261e;" onclick="submitDeleteDoc('${esc(id)}', this)">削除する</button>
          <button class="btn btn-secondary" onclick="closeConfirm()">やめる</button>
        </div>
      </div>`;
  }
  function closeConfirm() { el("confirm-root").innerHTML = ""; }
  async function submitDeleteDoc(id, btn) {
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteHrDocument(id));
      closeConfirm();
      closeAction();
      await refreshDetail("docs");
      load();
    } catch (e) { el("del-msg").textContent = e.hint || e.message || "削除できませんでした"; }
  }

  function interviewRow(i) {
    const scoreLine = (detail.evalItems || []).filter((e) => i.scores?.[e.key])
      .map((e) => `${esc(e.label)}：${esc(scaleLabel(i.scores[e.key]))}`).join("　");
    // 実施済み・キャンセル済みではない＝いま動かせる面談だけ、面談情報の編集・キャンセルを出す
    const pending = !i.done && !i.canceled;
    // TimeRex 連携済みの面談は TimeRex を正とする。日程変更・取消は TimeRex の導線から（HR で日時を直さない）
    const tr = i.timerex;
    return `
      <div class="card" style="margin-bottom:10px;${i.canceled ? "opacity:.6;" : ""}">
        <div style="font-weight:700;color:#1b2440;font-size:13px;">${esc(i.kindLabel)}
          ${i.rank ? `<span class="hr-rank ${esc(i.rank)}" style="margin-left:6px;">${esc(i.rank)}</span>` : ""}
          ${pending ? `<span class="hr-pill" style="background:#e7eaf3;color:#1b2440;margin-left:6px;">予定</span>` : ""}
          ${i.canceled ? `<span class="hr-pill" style="background:#efefeb;color:#6b7080;margin-left:6px;">キャンセル済み</span>` : ""}
          ${tr ? `<span class="hr-pill hr-timerex" style="background:#e6f4ea;color:#256b36;margin-left:6px;">TimeRex連携済み</span>` : ""}
          ${i.meetingUrl && pending ? `<span class="muted" style="font-size:11.5px;font-weight:500;margin-left:6px;">Google Meet</span>` : ""}</div>
        <div class="muted" style="font-size:11.5px;margin:4px 0;">
          ${i.done ? `実施：${esc(fmtDate(i.conductedAt))}`
            : i.canceled ? `予定していた日時：${esc(fmtDate(i.scheduledAt))}（${esc(fmtDate(i.canceledAt))}にキャンセル）`
            : `予定：${esc(fmtDate(i.scheduledAt))}`}
          ${i.interviewerName ? `　面談担当：${esc(i.interviewerName)}` : ""}
          ${i.methodLabel ? `　面談方法：${esc(i.methodLabel)}` : ""}</div>
        ${pending && i.kind === "casual" && !i.meetingUrl ? `<div class="banner warn" style="margin:6px 0;padding:7px 9px;font-size:12px;">面談URLが未登録です。［面談情報を編集］から登録してください。</div>` : ""}
        ${scoreLine ? `<div style="font-size:12px;margin-top:4px;">${scoreLine}</div>` : ""}
        ${i.recommendReason ? `<div style="font-size:12.5px;margin-top:6px;">${esc(i.recommendReason)}</div>` : ""}
        ${i.notes ? `<div style="font-size:12px;color:#6b7080;margin-top:4px;">${esc(i.notes)}</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">
          ${pending && i.meetingUrl ? `<a href="${esc(i.meetingUrl)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">面談に参加</a>` : ""}
          ${(i.materials || []).map((m) => `<button class="btn btn-secondary btn-sm" onclick="openInterviewMaterial('${esc(m.id)}')">${esc(m.name)}</button>`).join("")}
          ${detail.materialsReady ? `<button class="btn btn-secondary btn-sm" onclick="openInterviewMaterialsEditor('${esc(i.id)}')">資料を変更</button>` : ""}
          ${pending ? `<button class="btn btn-primary btn-sm" onclick="conductInterview('${esc(i.id)}')">実施済みにする</button>` : ""}
          ${pending ? `<button class="btn btn-secondary btn-sm" onclick="openRescheduleModal('${esc(i.id)}')">面談情報を編集</button>` : ""}
          ${pending && !tr ? `<button class="btn btn-secondary btn-sm" onclick="openCancelInterviewModal('${esc(i.id)}')">面談をキャンセル</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="reschedule" onclick="openTimerexReschedule('${esc(i.id)}')">日程変更</button>` : ""}
          ${pending && tr ? `<button class="btn btn-secondary btn-sm" data-timerex="cancel" onclick="openTimerexCancel('${esc(i.id)}')">取消</button>` : ""}
          ${i.done && !i.rank && i.kind !== "ceo"
            ? `<button class="btn btn-primary btn-sm" onclick="openEvaluateForm('${esc(i.id)}')">評価を入力</button>` : ""}
          ${i.done && i.kind === "ceo"
            ? `<span class="muted" style="font-size:12px;">採用判断はCEO REVIEWで行います。</span>` : ""}
          ${i.done ? recordingActions(i) : ""}
        </div>
        ${memoBlock(i)}
      </div>`;
  }

  // ---- 面談メモ（db/109。その面談に紐づくメモ。応募者全体のメモとは別） ---------------
  // 実施前・実施後・キャンセル済み、どの面談にも書ける。TimeRex同期済みの面談でも書ける
  function memoBlock(i) {
    return `
      <div class="hr-iv-memo" data-memo-for="${esc(i.id)}" style="margin-top:10px;padding-top:8px;border-top:1px dashed #e3e5ec;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span style="font-size:12px;font-weight:700;color:#1b2440;">面談メモ</span>
          <button class="btn btn-secondary btn-sm" onclick="openMemoModal('${esc(i.id)}')">${i.memo ? "メモを編集" : "メモを書く"}</button>
        </div>
        ${i.memo
          ? `<div class="hr-iv-memo-body" style="font-size:12.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word;">${esc(i.memo)}</div>
             ${i.memoUpdatedAt ? `<div class="muted" style="font-size:11px;margin-top:2px;">${esc(fmtDate(i.memoUpdatedAt))} 保存</div>` : ""}`
          : `<div class="muted hr-iv-memo-body" style="font-size:12px;margin-top:4px;">まだメモはありません</div>`}
      </div>`;
  }

  function openMemoModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談メモ</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(detail.applicant.name)}さん　${esc(iv.kindLabel)}　${esc(fmtDate(iv.conductedAt || iv.scheduledAt))}</p>
      <textarea id="ivm-text" rows="8" maxlength="4000" placeholder="この面談で話したこと・次回確認したいことなど">${esc(iv.memo || "")}</textarea>
      <p class="muted" style="font-size:11.5px;margin:4px 0 0;">この面談だけに紐づくメモです（4000文字まで）。空にして保存すると消えます。</p>
      <div id="ivm-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitMemo('${esc(id)}', this)">保存する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitMemo(id, btn) {
    const msg = el("ivm-msg"); msg.textContent = "";
    const memo = el("ivm-text").value;
    if (memo.trim().length > 4000) { msg.textContent = "メモは4000文字以内にしてください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.hrInterviewAct({ id, action: "memo", memo }));
      closeHrModal();
      await refreshDetail("interviews");
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // ---- TimeRex 連携済みの面談：日程変更・取消は TimeRex で（HR の日時は Webhook で自動反映） -----------
  const findInterview = (id) => (detail.interviews || []).find((x) => x.id === id);
  function openTimerexReschedule(id) {
    const iv = findInterview(id);
    const url = iv?.timerex?.rescheduleUrl;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 8px;">日程変更（TimeRex）</h2>
      <p style="font-size:13px;line-height:1.8;margin:0 0 12px;">
        ${esc(detail.applicant.name)}さんの${esc(iv?.kindLabel || "面談")}（${esc(fmtDate(iv?.scheduledAt))}）は TimeRex で予約された面談です。
        日程は TimeRex で変更してください。変更すると、この画面の日時も自動で更新されます。</p>
      ${url ? "" : `<p class="muted" style="font-size:12.5px;">日程変更のリンクがまだ届いていません。TimeRex の管理画面から変更してください。</p>`}
      <div style="display:flex;gap:8px;">
        ${url ? `<a class="btn btn-primary" id="tr-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="closeAction()">TimeRexで日程変更</a>` : ""}
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }
  function openTimerexCancel(id) {
    const iv = findInterview(id);
    const url = iv?.timerex?.cancelUrl;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 8px;">面談を取り消しますか？（TimeRex）</h2>
      <p style="font-size:13px;line-height:1.8;margin:0 0 12px;">
        ${esc(detail.applicant.name)}さんの${esc(iv?.kindLabel || "面談")}（${esc(fmtDate(iv?.scheduledAt))}）は TimeRex で予約された面談です。
        取消は TimeRex で行ってください。TimeRex で取り消すと、この画面にも反映されます（面談の記録は残ります）。</p>
      ${url ? "" : `<p class="muted" style="font-size:12.5px;">取消のリンクがまだ届いていません。TimeRex の管理画面から取り消してください。</p>`}
      <div style="display:flex;gap:8px;">
        ${url ? `<a class="btn btn-danger" id="tr-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="closeAction()">TimeRexで取り消す</a>` : ""}
        <button class="btn btn-secondary" onclick="closeAction()">閉じる（取り消さない）</button>
      </div>`);
  }

  // ---- 録画URL登録・変更（モーダル） ------------------------------------------------
  // カジュアル・社長面談の両方、実施済みの面談だけに出す（録画URL手動登録UI 追加指示）
  function recordingActions(i) {
    if (i.recordingUrl) {
      return `<a href="${esc(i.recordingUrl)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">録画を見る</a>
        <button class="btn btn-secondary btn-sm" onclick="openRecordingModal('${esc(i.id)}')">録画URLを変更</button>`;
    }
    return `<span class="muted" style="font-size:12px;">録画：未登録</span>
      <button class="btn btn-secondary btn-sm" onclick="openRecordingModal('${esc(i.id)}')">録画URLを登録</button>`;
  }

  function openRecordingModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談録画を登録</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(detail.applicant.name)}さん　${esc(iv.kindLabel)}　${esc(fmtDate(iv.conductedAt || iv.scheduledAt))}</p>
      <label>Google Drive録画URL</label>
      <input id="rec-url" type="text" value="${esc(iv.recordingUrl || "")}" placeholder="https://drive.google.com/...">
      <div id="rec-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitRecordingUrl('${esc(id)}', this)">保存</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">キャンセル</button>
      </div>
      ${iv.recordingUrl ? `<button class="btn btn-secondary btn-sm" style="margin-top:16px;"
        onclick="openRecordingDeleteModal('${esc(id)}')">録画URLを削除</button>` : ""}`);
  }

  async function submitRecordingUrl(id, btn) {
    const msg = el("rec-msg"); msg.textContent = "";
    const url = el("rec-url").value.trim();
    if (!url) { msg.textContent = "録画URLを入力してください"; return; }
    if (!/^https?:\/\//i.test(url)) { msg.textContent = "http:// または https:// で始まるURLを入力してください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrInterview({ id, recordingUrl: url }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  function openRecordingDeleteModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">録画URLを削除しますか？</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(iv.kindLabel)}の録画URLを削除します。Google Drive側の録画ファイル自体は消えません。</p>
      <div id="recd-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitDeleteRecordingUrl('${esc(id)}', this)">削除する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitDeleteRecordingUrl(id, btn) {
    const msg = el("recd-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "削除中…", () => API.updateHrInterview({ id, recordingUrl: "" }));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "削除できませんでした"; }
  }

  function scaleLabel(k) { return (detail.evalScale || []).find((s) => s.key === k)?.label || k; }

  // HR の日時はすべて日本時間（js/jst.js）。「本日 16:15」/「2026/10/1 16:15」
  function fmtDate(s) { return JST.when(s); }

  // ---- 面談情報の編集・キャンセル（モーダル） -----------------------------------------
  // 「面談情報を編集」は既存のupdateアクションを使う（日時・面談担当・面談方法・面談URL）。
  // TimeRex同期済みの面談は、日時・面談URLをTimeRex側が正とする（lib/hr-timerex.js が
  // Webhookのたびに上書きし、このアプリからTimeRexへは送らない）ので、読み取り専用で見せる
  const METHODS = [["", "（未設定）"], ["online", "オンライン"], ["onsite", "対面"], ["phone", "電話"]];

  function openRescheduleModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    const opts = (detail.interviewers || []).map((p) =>
      `<option value="${esc(p.id)}" ${p.id === iv.interviewerId ? "selected" : ""}>${esc(p.display_name)}</option>`).join("");
    const lock = iv.fromTimerex ? "disabled" : "";
    // datetime-local には日本時間の年月日時分を入れる（UTC を入れると 9 時間ずれる）
    const whenLocal = JST.toInput(iv.scheduledAt);
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談情報を編集</h2>
      <p class="hr-sub" style="margin:0 0 14px;">${esc(iv.kindLabel)}（${esc(detail.applicant.name)}さん）</p>
      ${iv.fromTimerex ? `<div class="banner warn" id="rs-timerex" style="margin:0 0 12px;">
        <span class="material-symbols-outlined">info</span>
        <div>TimeRexで確定した面談です。日時・面談URLはTimeRex側で変更してください（変更はTimeRexから自動で反映されます）。
          面談担当・面談方法はここで変更できます。</div></div>` : ""}
      <label>予定日時</label>
      <input id="rs-when" type="datetime-local" value="${esc(whenLocal)}" ${lock}>
      <label style="margin-top:10px;">面談担当</label>
      <select id="rs-who"><option value="">（未定）</option>${opts}</select>
      <label style="margin-top:10px;">面談方法</label>
      <select id="rs-method">${METHODS.map(([k, l]) =>
        `<option value="${k}" ${k === (iv.method || "") ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label style="margin-top:10px;">面談URL</label>
      <input id="rs-url" type="text" value="${esc(iv.meetingUrl || "")}" placeholder="https://meet.google.com/..." ${lock}>
      <div id="rs-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="submitReschedule('${esc(id)}', this)">保存する</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>`);
  }

  async function submitReschedule(id, btn) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    const msg = el("rs-msg"); msg.textContent = "";
    const url = el("rs-url").value.trim();
    if (url && !/^https?:\/\//i.test(url)) { msg.textContent = "面談URLは http:// または https:// で始まるURLを入力してください"; return; }
    // 空欄は「未定・未設定に戻す」（null）。TimeRex同期済みなら日時・URLは送らない
    const body = { id, interviewerId: el("rs-who").value || null, method: el("rs-method").value || null };
    if (!iv?.fromTimerex) {
      const when = el("rs-when").value;
      body.scheduledAt = when ? JST.fromInput(when) : null;   // 日本時間として読む（js/jst.js）
      body.meetingUrl = url || null;
    }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrInterview(body));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "保存できませんでした"; }
  }

  // 面談キャンセルは応募者を削除しない・面談履歴も物理削除しない（README §3・§6）。
  // カジュアル面談なら日程調整のやり直し（status=scheduling）、社長面談なら
  // 社長面談の設定し直し（status=ceo_interview_pending）へ戻す（サーバ側でも同じ判定）
  function openCancelInterviewModal(id) {
    const iv = (detail.interviews || []).find((x) => x.id === id);
    if (!iv) return;
    openHrModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">面談をキャンセルしますか？</h2>
      <p class="hr-sub" style="margin:0 0 14px;">
        ${esc(detail.applicant.name)}さんの${esc(iv.kindLabel)}（${esc(fmtDate(iv.scheduledAt))}）をキャンセルします。
        ${iv.kind === "ceo" ? "社長面談を設定し直せる状態に戻します。" : "日程を調整し直せる状態に戻します。"}</p>
      <div id="ci-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-danger" onclick="submitCancelInterview('${esc(id)}', this)">面談をキャンセルする</button>
        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる（キャンセルしない）</button>
      </div>`);
  }

  async function submitCancelInterview(id, btn) {
    const msg = el("ci-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "処理中…", () => API.cancelHrInterview(id));
      closeHrModal();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "キャンセルできませんでした"; }
  }

  // ---- NEXT ACTIONのボタン --------------------------------------------------------
  function targetInterview(action) {
    const list = detail.interviews || [];
    // NEXT ACTION が指す面談は API が決める（nextInterviewId）。未完了の先頭を推測で探さない
    // （古いカジュアル面談と社長面談が両方残っていても、いまの段階の面談だけを実施済みにする）
    if (action === "conduct") return list.find((i) => i.id === detail.applicant.nextInterviewId) || null;
    if (action === "evaluate") return list.find((i) => i.done && !i.rank) || list[0] || null;
    return null;
  }

  function runNextAction() {
    // 画面に出している NEXT ACTION と同じもの（判断済み・本人へ未連絡なら「本人へ連絡」）
    const a = withContactAction(detail.applicant);
    const key = a.nextActionKey;
    if (key === "sendSchedulingLink") return openSendSchedulingForm();
    // メール未登録：概要タブのメール欄をその場で入力にする（保存すると NEXT ACTION が「日程調整を送る」へ）
    if (key === "registerEmail") { detailTab = "overview"; emailEditing = true; renderDetail(); el("hr-email-input")?.focus(); return; }
    if (key === "leadNextAction") return openLeadNextActionForm();
    if (key === "schedule") return openScheduleForm(a.nextActionKind);
    // 実施する面談が無い（NEXT ACTION は「面談タブを確認」と出している）ときは、面談タブへ
    if (key === "conduct" && !a.nextInterviewId) return setDetailTab("interviews");
    if (key === "conduct") {
      // 実施する面談は API が決めたもの（nextInterviewId）だけ。見つからなくても「面談を予定する」は開かない
      const iv = targetInterview("conduct");
      return iv ? conductInterview(iv.id) : showNoInterviewToConduct();
    }
    if (key === "checkInterviews") return setDetailTab("interviews");
    if (key === "evaluate") {
      const iv = targetInterview("evaluate");
      return iv ? openEvaluateForm(iv.id) : null;
    }
    if (key === "recommend") return openRecommendForm();
    if (key === "advance") return startAdvance();
    if (key === "handoff") return openHandoff();
    if (key === "reject") return confirmDecisionMove("reject");
    if (key === "decide") return openDecideForm();
    if (key === "contact") return openContactForm(a.id, a.decision);
    if (key === "chooseOfferType") return offerTypeReady ? openOfferTypeModal() : openOfferForm();
    if (key === "createOffer" || key === "reviewOffer") return openOfferForm();
    if (key === "formalContract") return openFormalContract();
    // 社労士の正式PDFで進める人：主導線は書類タブの「契約手続き」
    if (key === "openContract") return openContractCard();
    // 区分つきは、内容を確認してメールで送る。区分の無い、これまでの合格通知と URL の再発行は従来の画面
    if (key === "sendOffer" && currentOffer()?.offerType) return openOfferSend();
    if (key === "sendOffer" || key === "reissueOffer") return openSendOfferForm();
  }

  /** Dランクの早期見送りだけ、ここで確定する（社長判断待ちからの見送りは openDecideForm） */
  async function confirmDecisionMove(kind) {
    const okToGo = confirm("見送りを確定します。よろしいですか？");
    if (!okToGo) return;
    try {
      await API.updateHrApplicant({ id: detail.applicant.id, decision: "rejected" });
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "できませんでした"); }
  }

  /**
   * 社長推薦する。ここで短い推薦理由を書いてもらう。
   * 社長が応募書類を最初から読まなくても、30秒で「会う理由」が分かるようにするため
   */
  function openRecommendForm() {
    openActionModal(`
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 6px;">社長推薦する</h2>
        <p class="hr-sub" style="margin:0 0 14px;">
          社長が応募書類を最初から読まなくても、なぜ会う必要があるかが分かるように、短く書いてください。</p>
        <label>推薦理由</label>
        <textarea id="rc-note" rows="4"
          placeholder="営業経験が強く、事業立ち上げ経験あり。カルチャーフィットも高い。報酬条件のみ社長面談で確認したい。"></textarea>
        <div id="rc-msg" class="err-text" style="margin:10px 0;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-primary" onclick="submitRecommend(this)">社長推薦する</button>
          <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
        </div>`);
  }

  async function submitRecommend(btn) {
    const msg = el("rc-msg"); msg.textContent = "";
    const note = el("rc-note").value.trim();
    if (!note) { msg.textContent = "推薦理由を入力してください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({
        // 推薦すると、選考は社長面談・状態は社長面談設定待ち（HRフロー仕様 §4。社長・管理者へ通知）
        id: detail.applicant.id, stage: "ceo_interview", status: "ceo_interview_pending", recommendNote: note,
      }));
      closeAction();
      await refreshDetail();
      await load();
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; }
  }

  /** 採用判断（内定・保留・見送り）。社長・管理者だけ（サーバ側でも弾く） */
  // 採用判断の部品（下の共通部分）が、この画面で使う口
  const decideDefaultId = () => detail?.applicant?.id;
  const openDecisionModal = (html, opts) => openActionModal(html, opts);
  const closeDecisionModal = () => closeAction();
  async function afterDecision() { await refreshDetail(); await load(); }

  // ---- 社長面談の評価 → STEP 1 採用判断 → STEP 2 本人へ連絡 ------------------------------
  // 採用HRの詳細（hr/applicants.html）と CEO REVIEW（hr/ceo-review.html）で同じもの。直すときは両方そろえる。
  //   ・1つのモーダルの中を、3枚のカード（評価／採用判断／本人へ連絡）に分ける。保存しても閉じずに次の段へ進む
  //   ・判断はセグメント（選んだものだけ色＋チェック）。説明の帯・確定ボタンも同じ色に切り替わる
  //   ・評価は面談の scores / notes（状態は動かさない）。判断は応募者の decision。連絡は api/hr/applicants/message.js
  //   ・本人への連絡状況（未連絡／連絡済み）は API の contact（lib/hr-messages.js。タイムラインから決める）
  const DECIDE_KINDS = [
    { key: "hired", label: "合格", icon: "check_circle", submit: "合格にする",
      note: "合格にします。どの形で迎えるか（採用区分）を選ぶと、その区分のオファー（条件）を作る流れに進みます。" },
    { key: "hold", label: "保留", icon: "pause_circle", submit: "保留にする",
      note: "保留にします。社長判断待ちのまま、次に確認することと再判断期限を残します。" },
    { key: "rejected", label: "見送り", icon: "cancel", submit: "見送りを確定",
      note: "見送りにします。この応募者の選考は終わります。" },
  ];
  const DECIDE_LABEL = Object.fromEntries(DECIDE_KINDS.map((k) => [k.key, k.label]));

  /** 判断と、本人への連絡状況のバッジ（一覧・詳細・CEO REVIEW で同じ） */
  function decisionBadges(a) {
    const d = a?.decision;
    // 無限道場リードの保留・対象外は採用判断ではない（区分のバッジと次のアクションで見る）
    if (!DECIDE_LABEL[d] || a?.leadCategory === "mugendojo") return "";
    const c = a.contact?.state;
    return `<span class="hr-badges" data-decision="${esc(d)}">
      <span class="hr-badge d-${esc(d)}">${esc(DECIDE_LABEL[d])}</span>
      ${c === "pending" ? `<span class="hr-badge c-pending" data-contact="pending"><span class="material-symbols-outlined">mark_email_unread</span>本人へ未連絡</span>`
        : c === "done" ? `<span class="hr-badge c-done" data-contact="done"><span class="material-symbols-outlined">done</span>連絡済み</span>` : ""}
    </span>`;
  }

  /** 社長面談の評価（読むだけ）。モーダルと同じ見た目・同じ色のルールで出す（応募者詳細・CEO REVIEW の詳細） */
  function ceoEvalSummary(res) {
    const iv = (res?.interviews || []).find((i) => i.kind === "ceo" && i.done && !i.canceled);
    if (!iv || (!Object.keys(iv.scores || {}).length && !iv.notes)) return "";
    return `<section class="hr-flow-sec" data-ceo-eval style="margin-top:14px;">
      <div class="hr-flow-hd"><h3><span class="material-symbols-outlined">fact_check</span>社長面談の評価</h3>
        <span class="hr-flow-note">${iv.scheduledAt ? esc(JST.when(iv.scheduledAt)) : ""}</span></div>
      ${(res.evalItems || []).map((it) => `<div class="hr-score-row"><span class="k">${esc(it.label)}</span><span class="hr-score-opts">
        ${(res.evalScale || []).map((s) => `<button type="button" class="hr-score${iv.scores?.[it.key] === s.key ? " on" : ""}" data-v="${esc(s.key)}" disabled>${esc(s.label)}</button>`).join("")}
      </span></div>`).join("")}
      ${iv.notes ? `<div style="font-size:12.5px;white-space:pre-wrap;margin-top:10px;color:#1b2440;"><b style="color:#6b7080;font-size:11px;display:block;">社長の所感</b>${esc(iv.notes)}</div>` : ""}
    </section>`;
  }

  let decideKind = "hired";
  let decideOfferType = null;   // 合格のときの採用区分（「この方をどの形で迎えますか？」）
  // { applicantId, name, ceoInterview, evalItems, evalScale, scores, step: "decide"|"contact"|"done",
  //   savedKind, summary, message, sentChannel }
  let flow = null;

  const flowState = (done, doneText, todoText) => (done
    ? `<span class="hr-flow-state done"><span class="material-symbols-outlined">check</span>${esc(doneText)}</span>`
    : `<span class="hr-flow-state todo">${esc(todoText)}</span>`);

  function openDecideForm(applicantId) {
    const id = applicantId || decideDefaultId();
    flow = { applicantId: id, name: "", ceoInterview: null, evalItems: [], evalScale: [], scores: {}, step: "decide",
      savedKind: null, summary: "", message: null, sentChannel: null };
    decideKind = "hired";
    decideOfferType = null;
    for (const k of Object.keys(fieldMemo)) delete fieldMemo[k];
    openDecisionModal(flowShell(), { wide: true });
    renderStep1(); renderStep2();
    loadDecideEval(id);
  }

  /** 判断済みの人に、あとから本人へ連絡する（STEP 1 は完了のまま、STEP 2 だけを開く） */
  async function openContactForm(applicantId, kind) {
    flow = { applicantId, name: "", ceoInterview: null, evalItems: [], evalScale: [], scores: {}, step: "contact",
      savedKind: kind, summary: `${DECIDE_LABEL[kind] || ""}を決定済み`, message: null, sentChannel: null, contactOnly: true };
    openDecisionModal(flowShell(), { wide: true });
    renderStep1();
    await loadMessage();
  }

  function flowShell() {
    return `
        <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 2px;">${flow.contactOnly ? "本人へ連絡" : "評価・採用判断"}</h2>
        <p class="hr-sub" id="dc-name" style="margin:0 0 16px;"></p>
        ${flow.contactOnly ? "" : `<section class="hr-flow-sec" id="dc-eval"><p class="hr-flow-note">社長面談の評価を読み込み中…</p></section>`}
        <section class="hr-flow-sec" id="dc-step1"></section>
        <section class="hr-flow-sec" id="dc-step2"></section>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-secondary" onclick="closeDecisionModal()">閉じる</button>
        </div>`;
  }

  /** ① 社長面談の評価・② 社長の所感（実施済み・キャンセルでない、いちばん新しい社長面談） */
  async function loadDecideEval(id) {
    let d = null;
    try { d = await API.getHrApplicant(id); } catch { d = null; }
    if (!el("dc-eval") || flow?.applicantId !== id) return;
    // 採用区分の定義（合格のときのカード）。開いた時点でまだ無ければ、ここで描き直す
    takeOfferTypes(d);
    if (!decideOfferType && d?.applicant?.offerType) decideOfferType = d.applicant.offerType;
    if (flow.step === "decide" && decideKind === "hired") renderDecideFields();
    const iv = (d?.interviews || []).find((i) => i.kind === "ceo" && i.done && !i.canceled) || null;
    Object.assign(flow, { name: d?.applicant?.name || "", ceoInterview: iv, evalItems: d?.evalItems || [],
      evalScale: d?.evalScale || [], scores: { ...(iv?.scores || {}) } });
    el("dc-name").textContent = flow.name;
    renderEval();
  }

  function renderEval() {
    const box = el("dc-eval");
    if (!box) return;
    const iv = flow.ceoInterview;
    if (!iv || !flow.evalItems.length) {
      box.className = "hr-flow-sec is-wait";
      box.innerHTML = `<div class="hr-flow-hd"><h3>社長面談の評価</h3></div>
        <p class="hr-flow-note">実施済みの社長面談がないため、評価は入力できません。判断だけを保存できます。</p>`;
      return;
    }
    const locked = flow.step !== "decide";
    box.className = "hr-flow-sec";
    box.innerHTML = `
        <div class="hr-flow-hd"><h3><span class="material-symbols-outlined">fact_check</span>社長面談の評価</h3>
          <span class="hr-flow-note">${iv.scheduledAt ? esc(JST.when(iv.scheduledAt)) : ""}</span></div>
        ${flow.evalItems.map((it) => `
          <div class="hr-score-row" data-item="${esc(it.key)}"><span class="k">${esc(it.label)}</span>
            <span class="hr-score-opts" role="group" aria-label="${esc(it.label)}">
              ${flow.evalScale.map((s) => `<button type="button" class="hr-score${flow.scores[it.key] === s.key ? " on" : ""}"
                data-v="${esc(s.key)}" aria-pressed="${flow.scores[it.key] === s.key}" ${locked ? "disabled" : ""}
                onclick="setScore('${esc(it.key)}', '${esc(s.key)}')">${esc(s.label)}</button>`).join("")}
            </span></div>`).join("")}
        <label style="margin-top:14px;">社長の所感（任意）</label>
        <textarea id="dc-ceo-notes" rows="3" maxlength="1000" ${locked ? "disabled" : ""}
          placeholder="良かった点・気になった点・判断の理由">${esc(iv.notes || "")}</textarea>`;
  }

  function setScore(item, v) {
    // 同じものをもう一度押したら外す（付け間違いを戻せるように）
    flow.scores[item] = flow.scores[item] === v ? undefined : v;
    if (!flow.scores[item]) delete flow.scores[item];
    const row = document.querySelector(`#dc-eval .hr-score-row[data-item="${item}"]`);
    row?.querySelectorAll(".hr-score").forEach((b) => {
      const on = b.dataset.v === flow.scores[item];
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on));
    });
  }

  /** ③ 採用判断・④ 補足・⑤ 保存（STEP 1） */
  function renderStep1() {
    const box = el("dc-step1");
    if (!box) return;
    const done = flow.step !== "decide";
    const head = `<div class="hr-flow-hd"><h3><span class="st">STEP 1</span>採用判断</h3>${flowState(done, "完了", "未完了")}</div>`;
    if (done) {
      box.innerHTML = `${head}<div class="hr-flow-sum">${decisionBadges({ decision: flow.savedKind })}
        ${flow.summary ? `<div style="margin-top:6px;">${esc(flow.summary)}</div>` : ""}</div>`;
      return;
    }
    const k = DECIDE_KINDS.find((x) => x.key === decideKind) || DECIDE_KINDS[0];
    box.innerHTML = `${head}
        <div class="hr-seg" id="dc-tabs" role="radiogroup" aria-label="採用判断">
          ${DECIDE_KINDS.map((x) => {
            const on = x.key === decideKind;
            return `<button type="button" role="radio" class="${on ? "on" : ""}" data-kind="${x.key}" aria-checked="${on}" aria-pressed="${on}"
              onclick="setDecideKind('${x.key}')">${on ? `<span class="material-symbols-outlined">check</span>` : ""}${esc(x.label)}</button>`;
          }).join("")}
        </div>
        <div class="hr-dk-banner" data-kind="${k.key}"><span class="material-symbols-outlined">${k.icon}</span><div><b>${esc(k.label)}</b>　${esc(k.note)}</div></div>
        <div id="decide-body"></div>
        <div id="dc-msg" class="err-text" style="margin:8px 0 0;"></div>
        <button class="btn hr-dk-save" data-kind="${k.key}" style="margin-top:12px;" onclick="submitDecide(this)">${esc(k.submit)}</button>`;
    renderDecideFields();
  }

  // 判断ごとの補足（④）。判断を切り替えても、入れた値はなるべく残す
  const fieldMemo = {};
  function renderDecideFields() {
    for (const id of ["dc-reason", "dc-next", "dc-due", "dc-note"]) if (el(id)) fieldMemo[id] = el(id).value;
    const v = (id) => esc(fieldMemo[id] || "");
    const note = `<label${decideKind === "hired" ? ' style="margin-top:12px;"' : ""}>コメント（任意・社内用。本人には送りません）</label><textarea id="dc-note" rows="3">${v("dc-note")}</textarea>`;
    el("decide-body").innerHTML = decideKind === "hold" ? `
        <label>保留理由</label><input id="dc-reason" type="text" value="${v("dc-reason")}">
        <label style="margin-top:10px;">次に確認すること <span style="color:#b3261e;">*</span></label><input id="dc-next" type="text" value="${v("dc-next")}">
        <label style="margin-top:10px;">再判断期限</label><input id="dc-due" type="date" value="${v("dc-due")}">`
      : decideKind === "hired" ? `
        ${offerTypeReady ? `
        <label>この方をどの形で迎えますか？ <span style="color:#b3261e;">*</span></label>
        <div id="dc-otypes">${offerTypeCards(decideOfferType, "pickDecideOfferType")}</div>` : `
        <p class="hr-flow-note">採用区分（正社員・育成枠・業務委託など）を選ぶには db/129 の適用が必要です。いまは合格だけを保存し、これまでの合格通知で進めます。</p>`}
        ${note}` : note;
  }

  function pickDecideOfferType(key) {
    decideOfferType = key;
    if (el("dc-otypes")) el("dc-otypes").innerHTML = offerTypeCards(decideOfferType, "pickDecideOfferType");
  }

  function setDecideKind(kind) {
    for (const id of ["dc-reason", "dc-next", "dc-due", "dc-note"]) if (el(id)) fieldMemo[id] = el(id).value;
    decideKind = kind;
    renderStep1();
  }

  /** 評価欄の入力（変わっていなければ null） */
  function decideEvalPatch() {
    const iv = flow?.ceoInterview;
    if (!iv || !el("dc-ceo-notes")) return null;
    const scores = { ...flow.scores };
    const notes = el("dc-ceo-notes").value.trim();
    const same = JSON.stringify(scores) === JSON.stringify(iv.scores || {}) && notes === (iv.notes || "");
    return same ? null : { id: iv.id, scores, notes };
  }

  async function submitDecide(btn) {
    const msg = el("dc-msg"); msg.textContent = "";
    const body = { id: flow.applicantId, decision: decideKind };
    let summary = "";
    if (decideKind === "hired") {
      // 採用区分を選んでから合格にする（区分ごとに、必要な条件だけでオファーを作るため）
      if (offerTypeReady && offerTypesDef.length && !decideOfferType) { msg.textContent = "どの形で迎えるか（採用区分）を選んでください"; return; }
      body.stage = "offer"; body.status = "offer_draft_pending";
      if (decideOfferType) body.offerType = decideOfferType;
      body.decisionNote = el("dc-note").value.trim() || undefined;
      const t = offerTypeDef(decideOfferType);
      if (t) summary = `採用区分：${t.label}`;
    } else if (decideKind === "hold") {
      const next = el("dc-next").value.trim();
      // 保留は、保留理由・次に確認すること・再判断期限の3つが必須（サーバでも確かめる）
      if (!el("dc-reason").value.trim()) { msg.textContent = "保留理由を入力してください"; return; }
      if (!next) { msg.textContent = "次に確認することを入力してください"; return; }
      if (!el("dc-due").value) { msg.textContent = "再判断期限を入力してください"; return; }
      body.holdReason = el("dc-reason").value.trim();
      body.holdNextStep = next;
      body.decisionDueOn = el("dc-due").value;
      summary = [body.holdReason ? `保留理由：${body.holdReason}` : null, `次に確認：${next}`,
        body.decisionDueOn ? `再判断期限：${body.decisionDueOn}` : null].filter(Boolean).join("　");
    } else {
      body.status = "passed";
      body.decisionNote = el("dc-note").value.trim() || undefined;
    }
    try {
      await KPLayout.busy(btn, "保存中…", async () => {
        const ev = decideEvalPatch();
        if (ev) await API.updateHrInterview(ev);
        await API.updateHrApplicant(body);
      });
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; return; }
    Object.assign(flow, { step: "contact", savedKind: decideKind, summary });
    renderEval(); renderStep1();
    await loadMessage();
    await afterDecision();
  }

  /** ⑥ 本人へ連絡（STEP 2） */
  async function loadMessage() {
    const box = el("dc-step2");
    if (!box) return;
    box.className = "hr-flow-sec";
    box.innerHTML = `<div class="hr-flow-hd"><h3><span class="st">STEP 2</span>本人へ連絡</h3>${flowState(false, "", "未完了")}</div>
      <p class="hr-flow-note">文面を用意しています…</p>`;
    let r = null;
    try { r = await API.api(`/api/hr/applicants/message?id=${encodeURIComponent(flow.applicantId)}&kind=${encodeURIComponent(flow.savedKind)}`); }
    catch { r = null; }
    // 文面を作れない（古いサーバ等）ときは、判断の保存だけで閉じる
    if (!r?.subject) { if (flow.contactOnly) renderStep2(); else closeDecisionModal(); return; }
    flow.message = r;
    if (flow.contactOnly && el("dc-name") && !flow.name) el("dc-name").textContent = r.to ? `宛先：${r.to}` : "";
    renderStep2();
  }

  function renderStep2() {
    const box = el("dc-step2");
    if (!box) return;
    const head = (done) => `<div class="hr-flow-hd"><h3><span class="st">STEP 2</span>本人へ連絡</h3>${flowState(done, "連絡済み", "未完了")}</div>`;
    if (flow.step === "decide") {
      box.className = "hr-flow-sec is-wait";
      box.innerHTML = `${head(false)}<p class="hr-flow-note">採用判断を保存すると、本人へ伝える文面がここに出ます。判断の保存と本人への連絡は別の操作です。</p>`;
      return;
    }
    box.className = "hr-flow-sec";
    if (flow.step === "done") {
      box.innerHTML = `${head(true)}<p class="hr-flow-sum">${flow.sentChannel === "email" ? "メールで送りました。" : "送付済みとして記録しました。"}選考タイムラインに残っています。</p>`;
      return;
    }
    const r = flow.message;
    if (!r) { box.innerHTML = `${head(false)}<p class="hr-flow-note">文面を用意できませんでした。</p>`; return; }
    const canMail = Boolean(r.mail?.configured);
    // メイン操作は1つだけ：メールで送れるなら「メールで送る」、送れなければ「メールソフトで開く」（宛先が無ければ「コピー」）
    const primary = canMail ? "email" : r.to ? "mailer" : "copy";
    const cls = (k) => (k === primary ? "btn btn-primary" : "btn btn-secondary");
    box.innerHTML = `${head(false)}
        <p class="hr-flow-note" style="margin-bottom:10px;">${esc(r.label)}の文面です。直してから送れます（社内の評価・所感は入っていません）。</p>
        <label>宛先</label>
        <div style="font-size:13px;margin-bottom:8px;">${r.to ? esc(r.to) : `<span class="muted">メールアドレスが登録されていません</span>`}</div>
        <label>件名</label><input id="msg-subject" type="text" maxlength="200" value="${esc(r.subject)}">
        <label style="margin-top:10px;">本文</label><textarea id="msg-body" rows="11">${esc(r.body)}</textarea>
        ${canMail ? "" : `<div class="banner warn" style="margin-top:10px;"><span class="material-symbols-outlined">mail</span>
          <div>このシステムからはメールを送れません（${esc(r.mail?.reason || "未設定")}）。${r.to ? "メールソフトで開く" : "コピー"}で送り、送ったら「送付済みにする」を押してください。</div></div>`}
        <div id="msg-msg" class="err-text" style="margin:8px 0 0;"></div>
        <div class="hr-msg-actions">
          ${canMail ? `<button class="${cls("email")}" onclick="sendDecisionMessage('email', this)"><span class="material-symbols-outlined icon-inline">send</span>メールで送る</button>` : ""}
          ${r.to ? `<button class="${cls("mailer")}" onclick="openMailer()"><span class="material-symbols-outlined icon-inline">open_in_new</span>メールソフトで開く</button>` : ""}
          <button class="${cls("copy")}" onclick="copyDecisionMessage(this)"><span class="material-symbols-outlined icon-inline">content_copy</span>コピー</button>
          <button class="btn btn-secondary" onclick="sendDecisionMessage('manual', this)"><span class="material-symbols-outlined icon-inline">task_alt</span>送付済みにする</button>
          <button class="later" onclick="closeDecisionModal()">あとで連絡する</button>
        </div>`;
  }

  function openMailer() {
    const q = `subject=${encodeURIComponent(el("msg-subject").value)}&body=${encodeURIComponent(el("msg-body").value)}`;
    window.location.href = `mailto:${encodeURIComponent(flow.message.to)}?${q}`;
  }

  async function copyDecisionMessage(btn) {
    const text = `${el("msg-subject").value}\n\n${el("msg-body").value}`;
    try { await navigator.clipboard.writeText(text); btn.lastChild.textContent = "コピーしました"; }
    catch { el("msg-body").select(); el("msg-msg").textContent = "コピーできませんでした。本文を選んでコピーしてください"; }
  }

  async function sendDecisionMessage(channel, btn) {
    if (channel === "manual" && !confirm("本人へ送ったものとして記録します。よろしいですか？")) return;
    const msg = el("msg-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, channel === "email" ? "送信中…" : "記録中…", () => API.api("/api/hr/applicants/message", {
        method: "POST", body: { id: flow.applicantId, kind: flow.savedKind, channel,
          subject: el("msg-subject").value, body: el("msg-body").value },
      }));
    } catch (e) { msg.textContent = e.hint || e.detail || e.message || "できませんでした"; return; }
    Object.assign(flow, { step: "done", sentChannel: channel });
    renderStep2();
    await afterDecision();
  }

  // 「面談を実施済みにする」の対象が見つからないとき。面談の予定は作らず、面談タブで確かめてもらう
  function showNoInterviewToConduct() {
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 10px;">実施する面談が見つかりません</h2>
      <p id="no-iv-msg" style="font-size:13px;color:#1b2440;margin:0 0 16px;">実施対象の面談が見つかりません。<br>面談タブで予定を確認してください。</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="closeAction();setDetailTab('interviews')">面談タブを確認</button>
        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);
  }

  async function conductInterview(id) {
    if (!confirm("この面談を実施済みにします。よろしいですか？")) return;
    try {
      await API.conductHrInterview(id);
      await refreshDetail();
      await load();
    } catch (e) { alert(e.hint || e.detail || e.message || "できませんでした"); }
  }

  // ---- メールを送る（ひな型から。api/hr/applicants/mail.js） ----------------------------
  // ひな型を選ぶ → 差し込み済みの件名・本文を確かめる（直せる）→［送信］。
  //   ・ここで直した内容は、このメール1通だけに使う（ひな型は変わらない）
  //   ・直したあとにひな型を変えると、直した内容は消える。黙って消さず、確かめる
  //   ・差し込めない項目（予約URLの設定が無い等）があれば、理由を出して送らせない
  //   ・送信の鍵（requestKey）は1回の「送信」ごとに1つ。通信が切れてやり直しても、同じ鍵なので2通目は送られない
  //   ・結果は3つに分ける：送信済み（メールサービスが受け付けた）／失敗／結果不明（すぐに送り直さない）
  let mailFlow = null;
  const MAIL_STATUS = {
    sent: ["送信済み", "ok", "メールサービスが受け付けました（相手に届いた・開いた、ではありません）"],
    failed: ["失敗", "ng", "送れませんでした"],
    unknown: ["結果不明", "warn", "送れたかどうか分かりません。相手に届いているか確かめてから、必要なら送り直してください"],
    sending: ["結果不明", "warn", "送信中のまま終わっています。相手に届いているか確かめてください"],
    not_sent: ["未送信", "warn", "送信の設定が無く、送っていません"],
  };
  const TAG_RE = /\{\{\s*([^{}]+?)\s*\}\}/g;
  const newMailKey = () => {
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
  };

  async function openMailForm(templateId) {
    const id = detail?.applicant?.id;
    if (!id) return;
    mailFlow = { applicantId: id, data: null, original: null, key: null, phase: "edit", result: null };
    openHrModal(`<h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0;">メールを送る</h2>
      <p class="hr-sub" style="margin:10px 0 0;">読み込み中…</p>`);
    el("hr-modal-root").querySelector(".hr-modal").classList.add("wide");
    await loadMailDraft(templateId);
  }

  async function loadMailDraft(templateId) {
    const f = mailFlow;
    let r;
    try {
      r = await API.api(`/api/hr/applicants/mail?id=${encodeURIComponent(f.applicantId)}${templateId ? `&templateId=${encodeURIComponent(templateId)}` : ""}`);
    } catch (e) {
      if (mailFlow !== f) return;
      renderMailError(e.hint || e.message || "読み込めませんでした");
      return;
    }
    if (mailFlow !== f || r.applicant?.id !== f.applicantId) return;   // 別の応募者を開き直した
    f.data = r;
    f.original = r.rendered ? { subject: r.rendered.subject, body: r.rendered.body } : null;
    f.key = newMailKey();
    f.phase = "edit"; f.result = null;
    renderMailForm();
  }

  function renderMailError(text) {
    const box = el("hr-modal-root").querySelector(".hr-modal");
    if (!box) return;
    box.innerHTML = `<h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 10px;">メールを送る</h2>
      <div class="banner warn"><span class="material-symbols-outlined">error</span><div>${esc(text)}</div></div>
      <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-secondary" onclick="closeMailForm()">閉じる</button></div>`;
  }

  const mailDirty = () => {
    const f = mailFlow;
    if (!f?.original || !el("mail-subject")) return false;
    return el("mail-subject").value !== f.original.subject || el("mail-body").value !== f.original.body;
  };

  function closeMailForm() {
    if (mailFlow?.phase === "edit" && mailDirty() && !confirm("直した内容は保存されません（このメールは送っていません）。閉じますか？")) return;
    mailFlow = null;
    closeHrModal();
  }

  function mailHistoryHtml(sends) {
    if (!sends?.length) return `<p class="muted" style="font-size:12px;margin:4px 0 0;">まだ送っていません。</p>`;
    return `<ul class="hr-mail-hist">${sends.map((s) => {
      const st = MAIL_STATUS[s.status] || MAIL_STATUS.unknown;
      // 宛先・送信元・失敗の理由も残す（「送ったはず」「なぜ送れなかったか」を、あとから確かめられるように）
      return `<li data-mail-send="${esc(s.id || "")}"><span class="hr-mail-st ${st[1]}">${esc(st[0])}</span>
        <span class="t">${esc(fmtDate(s.createdAt))}</span>
        <span class="s">${esc(s.subject)}</span>
        <span class="m">${esc(s.templateName || "")}${s.templateVersion ? `（版${esc(s.templateVersion)}）` : ""}・${esc(s.sentByName || "")}</span>
        <span class="m" data-mail-to>宛先 ${esc(s.toEmail || "—")}${s.from ? `／送信元 ${esc(s.from)}` : ""}</span>
        ${s.error && s.status !== "sent" ? `<span class="m err-text" data-mail-error>理由：${esc(s.error)}</span>` : ""}</li>`;
    }).join("")}</ul>`;
  }

  function renderMailForm() {
    const f = mailFlow;
    const box = el("hr-modal-root").querySelector(".hr-modal");
    if (!f || !box) return;
    const r = f.data;
    const a = r.applicant;
    const rd = r.rendered;
    const canMail = Boolean(r.mail?.configured);
    const missing = rd?.missing || [];
    const unknown = rd?.unknown || [];
    box.innerHTML = `
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 12px;">メールを送る</h2>
      <div class="hr-mail-to">
        <div><span class="lb">宛先</span><b id="mail-to-name">${esc(a.name)} 様</b>
          <span id="mail-to-email">${a.email ? `&lt;${esc(a.email)}&gt;` : `<span class="err-text">メールアドレスが登録されていません</span>`}</span></div>
        ${r.mail?.hasEmail === false ? `<div class="hr-mail-email" data-mail-email-form style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
          <input id="mail-email-input" type="email" placeholder="name@example.com" value="${esc(a.email || "")}" style="flex:1;min-width:200px;">
          <button class="btn btn-secondary btn-sm" onclick="saveMailEmail(this)">メールアドレスを登録</button>
          <div id="mail-email-msg" class="err-text" style="width:100%;font-size:12px;"></div></div>` : ""}
        <div class="sub"><span class="lb">送信元</span>${esc(r.mail?.from || "未設定")}
          ${r.mail?.replyTo ? `　<span class="lb">返信先</span>${esc(r.mail.replyTo)}` : ""}</div>
      </div>
      ${r.templates.length ? `
      <label>ひな型</label>
      <select id="mail-tpl" onchange="changeMailTemplate(this)">
        ${r.templates.map((t) => `<option value="${esc(t.id)}" ${rd && t.id === rd.templateId ? "selected" : ""}>${esc(t.name)}（${esc(t.purposeLabel)}）${t.isDefault ? "・既定" : ""}</option>`).join("")}
      </select>` : `<div class="banner warn"><span class="material-symbols-outlined">description</span>
        <div>使えるひな型がありません。<a href="/hr/templates.html">メールひな型</a>で作るか、「使用」にしてください。</div></div>`}
      ${missing.length ? `<div class="banner warn" id="mail-missing" style="margin-top:10px;"><span class="material-symbols-outlined">warning</span>
        <div><b>差し込めない項目があります。このままでは送れません。</b>
        <ul style="margin:4px 0 0;padding-left:18px;">${missing.map((m) => `<li>{{${esc(m.key)}}}：${esc(m.reason)}</li>`).join("")}</ul>
        <span style="font-size:12px;">登録内容・設定を直すか、本文から該当の部分を直してください。</span></div></div>` : ""}
      ${unknown.length ? `<div class="banner warn" style="margin-top:10px;"><span class="material-symbols-outlined">warning</span>
        <div>使えない差し込み項目があります：${unknown.map((u) => `{{${esc(u)}}}`).join("・")}。本文から直してください。</div></div>` : ""}
      ${rd ? `
      <label style="margin-top:10px;">件名</label>
      <input id="mail-subject" type="text" maxlength="200" value="${esc(rd.subject)}" ${f.phase !== "edit" ? "readonly" : ""}>
      <label style="margin-top:10px;">本文</label>
      <textarea id="mail-body" rows="14" ${f.phase !== "edit" ? "readonly" : ""}>${esc(rd.body)}</textarea>
      <p class="muted" style="font-size:11.5px;margin:4px 0 0;">ここで直した内容は、このメール1通だけに使います（ひな型は変わりません）。</p>` : ""}
      ${canMail ? "" : `<div class="banner warn" style="margin-top:10px;" data-mail-blocked><span class="material-symbols-outlined">mail</span>
        <div><b>このままでは送れません。</b>
        <ul style="margin:4px 0 0;padding-left:18px;">${(r.mail?.reasons?.length ? r.mail.reasons.map((x) => x.text) : [r.mail?.reason || "メール送信の設定がありません"])
          .map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
        ${r.mail?.systemReason ? `<details style="margin-top:4px;font-size:12px;"><summary>管理者向けの詳細</summary>${esc(r.mail.systemReason)}</details>` : ""}</div></div>`}
      <div id="mail-result" style="margin-top:10px;">${mailResultHtml()}</div>
      <div id="mail-msg" class="err-text" style="margin:8px 0 0;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        ${f.phase === "edit" ? `<button class="btn btn-primary" id="mail-send" onclick="sendApplicantMail(this)" ${canMail && rd ? "" : "disabled"}>
          <span class="material-symbols-outlined icon-inline">send</span>送信</button>` : ""}
        ${f.phase === "failed" ? `<button class="btn btn-primary" onclick="retryMailEdit()">内容を確かめて送り直す</button>` : ""}
        <button class="btn btn-secondary" onclick="closeMailForm()">${f.phase === "edit" ? "送らずに閉じる" : "閉じる"}</button>
      </div>
      <details style="margin-top:14px;" ${f.phase !== "edit" ? "open" : ""}><summary style="font-size:12.5px;cursor:pointer;">この応募者へ送ったメール（${r.sends?.length || 0}件）</summary>
        <div id="mail-history">${mailHistoryHtml(r.sends)}</div></details>`;
    if (f.phase !== "edit" && f.typed) {
      el("mail-subject").value = f.typed.subject; el("mail-body").value = f.typed.body;
    }
  }

  function mailResultHtml() {
    const f = mailFlow;
    if (!f?.result) return "";
    const st = MAIL_STATUS[f.result.status] || MAIL_STATUS.unknown;
    const cls = st[1] === "ok" ? "ok" : "warn";
    return `<div class="banner ${cls}" id="mail-result-banner" data-status="${esc(f.result.status)}">
      <span class="material-symbols-outlined">${st[1] === "ok" ? "check_circle" : st[1] === "ng" ? "error" : "help"}</span>
      <div><b>${esc(st[0])}</b>　${esc(f.result.hint || st[2])}${f.result.duplicate ? "（同じ送信は2回目なので、送り直していません）" : ""}</div></div>`;
  }

  function changeMailTemplate(sel) {
    const f = mailFlow;
    if (!f) return;
    if (mailDirty() && !confirm("直した内容は消えます（このメールは送っていません）。ひな型を変えますか？")) {
      sel.value = f.data.rendered?.templateId || "";
      return;
    }
    loadMailDraft(sel.value);
  }

  function retryMailEdit() {
    const f = mailFlow;
    if (!f) return;
    // 失敗（送れなかったことが確か）のときだけ、直してから送り直せる。新しい送信なので鍵も新しくする
    f.phase = "edit"; f.key = newMailKey(); f.result = null;
    const typed = f.typed;
    renderMailForm();
    if (typed) { el("mail-subject").value = typed.subject; el("mail-body").value = typed.body; }
  }

  /** 送信画面から、その場でメールアドレスを登録する（概要タブへ戻らなくてよいように） */
  async function saveMailEmail(btn) {
    const f = mailFlow;
    if (!f) return;
    const m = el("mail-email-msg"); m.textContent = "";
    const v = el("mail-email-input").value.trim();
    if (!v) { m.textContent = "メールアドレスを入れてください"; return; }
    if (!EMAIL_RE.test(v)) { m.textContent = "メールアドレスの形式を確認してください"; return; }
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({ id: f.applicantId, email: v }));
    } catch (e) { m.textContent = e.hint || e.detail || e.message || "保存できませんでした"; return; }
    if (detail?.applicant?.id === f.applicantId) detail.applicant = { ...detail.applicant, email: v };
    load();   // 一覧も新しいメールに
    // 宛先・送れるかどうかを取り直す（ひな型の選択は今のまま）
    await loadMailDraft(f.data.rendered?.templateId || "");
  }

  async function sendApplicantMail(btn) {
    const f = mailFlow;
    if (!f || f.sending) return;              // 二度押し
    const msg = el("mail-msg"); msg.textContent = "";
    const subject = el("mail-subject").value, body = el("mail-body").value;
    const left = [...`${subject}\n${body}`.matchAll(TAG_RE)].map((m) => `{{${m[1]}}}`);
    if (left.length) { msg.textContent = `差し込まれていない項目が残っています：${[...new Set(left)].join("・")}`; return; }
    if (/[\r\n]/.test(subject)) { msg.textContent = "件名に改行は使えません"; return; }
    const a = f.data.applicant;
    // 同じひな型を、この人へもう送っている（押し間違い以外の二重送信）なら、その日時を見せて確かめる
    const same = (f.data.sends || []).find((x) => x.status === "sent" && x.templateId === f.data.rendered.templateId);
    const dupNote = same ? `\n\n※このひな型は ${fmtDate(same.createdAt)} にも送っています。もう一度送りますか？` : "";
    if (!confirm(`${a.name} 様（${a.email}）へ送信します。よろしいですか？${dupNote}`)) return;
    f.sending = true;
    f.typed = { subject, body };
    let r = null, err = null;
    try {
      r = await KPLayout.busy(btn, "送信中…", () => API.api("/api/hr/applicants/mail", {
        method: "POST", invalidates: [],
        body: { id: f.applicantId, templateId: f.data.rendered.templateId, templateVersion: f.data.rendered.templateVersion,
          subject, body, requestKey: f.key },
      }));
    } catch (e) { err = e; }
    f.sending = false;
    if (mailFlow !== f) return;
    if (err && !err.status) {
      // 通信が切れて、送れたか分からない。鍵はそのまま（もう一度押しても、送れていれば2通目は送られない）
      msg.textContent = "通信が切れました。もう一度［送信］を押すと、送れたかどうかを確かめます（送れていれば2通目は送りません）";
      return;
    }
    if (err) {
      const b = err.body || {};
      if (b.status === "failed" || b.status === "not_sent") {
        f.result = { status: b.status, hint: err.hint };
        f.phase = "failed";
      } else if (err.status >= 500 && !b.error) {
        // サーバー側の時間切れ等（HTMLの 502/504 など）。送れたかどうか分からないので、記録を見てもらう。鍵はそのまま
        msg.textContent = `サーバーの応答がありませんでした（${err.status}）。送れたかどうかは、下の「この応募者へ送ったメール」で確認してください。送れていなければ、もう一度［送信］を押してください（送れていれば2通目は送りません）`;
        try {
          const again = await API.api(`/api/hr/applicants/mail?id=${encodeURIComponent(f.applicantId)}&templateId=${encodeURIComponent(f.data.rendered.templateId)}`);
          if (mailFlow === f) { f.data.sends = again.sends; const h = el("mail-history"); if (h) h.innerHTML = mailHistoryHtml(again.sends); }
        } catch { /* 読めなくても案内は出す */ }
        return;
      } else {
        // 送る前に断られた（差し込み残り・ひな型が変わった等）。送っていないので、直してそのまま送れる
        msg.textContent = (b.problems || [err.hint || err.message]).join("／");
        if (["template_changed", "template_inactive"].includes(b.error)) f.key = newMailKey();
        return;
      }
    } else {
      f.result = { status: r.status, hint: r.hint, duplicate: r.duplicate };
      f.phase = r.status === "sent" ? "sent" : r.status === "failed" ? "failed" : "unknown";
    }
    // 送った記録を取り直す（ひな型の選択は今のまま）
    try {
      const again = await API.api(`/api/hr/applicants/mail?id=${encodeURIComponent(f.applicantId)}&templateId=${encodeURIComponent(f.data.rendered.templateId)}`);
      if (mailFlow === f) f.data.sends = again.sends;
    } catch { /* 記録の再読み込みに失敗しても、結果は出す */ }
    if (mailFlow !== f) return;
    renderMailForm();

      <input id="sc-url" type="text" readonly value="${esc(url)}" onclick="this.select()">
      <button class="btn btn-secondary btn-sm" style="margin-top:6px;" onclick="copyText('sc-url')">URLをコピー</button>
      <label style="margin-top:14px;">メール文面</label>

      <div id="sc-msg" class="err-text" style="margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
        ${isLead(detail.applicant) ? "" : `<button class="btn btn-primary" id="sc-send-mail" onclick="closeHrModal();openMailForm()">

        <button class="btn btn-secondary" onclick="closeHrModal()">閉じる</button>
      </div>
      ${isLead(detail.applicant) ? "" : `<p class="muted" style="font-size:12px;margin:8px 0 0;">メールひな型（応募受付／カジュアル面談案内）で送ると、自動で「カジュアル面談・日程調整中（予約待ち）」になります。</p>`}
      <button class="btn btn-secondary btn-sm" style="margin-top:16px;"

      <div class="banner warn"><span class="material-symbols-outlined">build</span>

  function schedulingMailTemplate(url) {

${a.name} 様

このたびは無限道場の無料カジュアル面談にお申し込みいただき、ありがとうございます。
下記URLより、ご都合の良い日時をお選びください。

${url}${materialText}

ご不明点がございましたら、このメールにご返信ください。`;
    }
    return `件名：面談日程のご調整のお願い

${a.name} 様

このたびは弊社採用選考にご応募いただき、ありがとうございます。
つきましては、カジュアル面談の日程調整をお願いしたく、
下記URLより、ご都合の良い日時をお選びください。

${url}${materialText}

ご不明点がございましたら、採用担当までご連絡ください。`;

  // ---- 面談を予定する（右ドロワー） ------------------------------------------------
  function materialChecks(selected = [], kind = "casual") {
    if (!detail.materialsReady) return '<p class="muted" style="font-size:12px;">資料機能は db/136 適用後に使えます。</p>';
    const sel = new Set(selected);
    const mats = detail.materialCatalog || [];
    if (!mats.length) return '<p class="muted" style="font-size:12px;">共通資料はまだありません。<a href="/hr/materials.html" target="_blank">資料タブで登録</a></p>';
    return '<div style="display:grid;gap:6px;margin-top:6px;">' + mats.map((m) => {
      const on = sel.size ? sel.has(m.id) : (kind === "casual" && m.defaultForCasual);
      return '<label style="display:flex;align-items:center;gap:7px;font-weight:500;margin:0;"><input type="checkbox" name="iv-material" value="'+esc(m.id)+'" '+(on?'checked':'')+' style="width:auto;margin:0;">'+esc(m.name)+'</label>';
    }).join('') + '</div>';
  }

    try {
      const r = await API.api('/api/hr/materials', { method:'POST', body:{ action:'open', id } });
      window.open(r.url, '_blank', 'noopener,noreferrer');
    } catch (e) { alert(e.hint || e.detail || e.message || '資料を開けませんでした'); }

  /**
   * 1つの操作をする中央モーダル（評価・面談の予定・推薦・判断・合格通知・書類など）。
   *
   * 応募者詳細（右ドロワー）の上に重ねる。右ドロワーの上に右ドロワーを重ねない。
   * 背景を押して閉じるのはこのモーダルだけで、後ろの応募者詳細は残る。
   * 保存したら、モーダルを閉じて refreshDetail() で開いたままのドロワーに反映する
   */
  // ---- 担当を変更（中央モーダル。保存後もドロワーは閉じない） -------------------------
  function openRecruiterModal() {
    const a = detail.applicant;
    openActionModal(`
      <h2 style="font-size:17px;font-weight:700;color:#1b2440;margin:0 0 12px;">担当を変更</h2>

      <select id="rc-select">${recruiterOptions(a.recruiterId)}</select>

        <button class="btn btn-secondary" onclick="closeAction()">閉じる</button>
      </div>`);

  async function saveRecruiter(btn) {
    const msg = el("rc-msg"); msg.textContent = "";
    try {
      await KPLayout.busy(btn, "保存中…", () => API.updateHrApplicant({
        id: detail.applicant.id, recruiterId: el("rc-select").value || null }));

      await refreshDetail("overview");
