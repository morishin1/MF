<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>メンバー - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911m">
  <link rel="stylesheet" href="css/layout.css?v=20260911m">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">メンバー</h1>
  <p class="kp-greet-sub">社員名簿と社内権限を管理します。</p>

  <div class="card">
    <h2><span class="material-symbols-outlined" id="e-icon">person_add</span><span id="e-title">メンバーを追加</span></h2>
    <div class="inline-controls" style="margin-bottom:12px;">
      <div><label>氏名</label><input id="e-name" type="text" placeholder="山田 太郎"></div>
      <div><label>メール</label><input id="e-email" type="email" placeholder="taro@8grp.co.jp"></div>
      <div><label>部署</label><input id="e-dept" type="text" placeholder="管理部"></div>
      <div><label>役職</label><input id="e-position" type="text" placeholder="主任"></div>
      <div><label>勤務地</label><input id="e-location" type="text" placeholder="本社"></div>
      <div>
        <label>雇用区分</label>
        <select id="e-type">
          <option>正社員</option><option>契約社員</option><option>パート</option>
          <option>アルバイト</option><option>業務委託</option><option>役員</option><option>その他</option>
        </select>
      </div>
      <div><label>入社日</label><input id="e-joined" type="date"></div>
      <div id="e-left-wrap" style="display:none;"><label>退職日</label><input id="e-left" type="date"></div>
      <div>
        <button class="btn btn-primary" id="e-save" onclick="save(this)">
          <span class="material-symbols-outlined icon-inline">add</span>追加
        </button>
      </div>
      <div id="e-cancel-wrap" style="display:none;">
        <button class="btn btn-secondary" onclick="resetForm()">
          <span class="material-symbols-outlined icon-inline">close</span>編集をやめる
        </button>
      </div>
    </div>
    <p class="muted" style="font-size:12px;margin:0;" id="e-note">
      メールを入れて追加すると、ログインアカウントもここで作られ、
      <strong>グループウェア・無限道場・タイムカード・会計</strong>にまとめて登録されます。
      初回パスワードはこの画面に1回だけ出るので、本人へ直接お渡しください。
    </p>
    <div id="e-msg" class="err-text"></div>
    <div id="e-account"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">upload_file</span>まとめて追加
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="toggleBulk()">
        <span class="material-symbols-outlined icon-inline" id="bulk-caret">expand_more</span>開く
      </button>
    </h2>
    <div id="bulk-body" class="hidden">
      <p class="muted" style="font-size:12.5px;margin:0 0 10px;">
        表計算からそのまま貼り付けられます。1行1人、順番は
        <code>氏名 / メール / 部署 / 役職 / 雇用区分 / 入社日</code>。
        タブ区切りでもカンマ区切りでも読めます。氏名だけでも足せます。
      </p>
      <textarea id="bulk-text" rows="6" placeholder="山田 太郎	taro@8grp.co.jp	管理部	主任	正社員	2026-04-01
鈴木 花子	hanako@8grp.co.jp	営業部		契約社員	2026-04-01"></textarea>
      <label style="display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;margin:8px 0 12px;">
        <input id="bulk-accounts" type="checkbox" checked style="width:auto;margin:0;">
        メールがある人はログインアカウントも作る
      </label>
      <div>
        <button class="btn btn-primary" onclick="bulkImport(this)">
          <span class="material-symbols-outlined icon-inline">playlist_add</span>取り込む
        </button>
      </div>
      <div id="bulk-result"></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">group</span>名簿
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="exportCsv()">
        <span class="material-symbols-outlined icon-inline">download</span>CSV
      </button>
    </h2>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<script src="js/api-client.js?v=20260911m"></script>
<script src="js/layout.js?v=20260911m"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const ROLE_LABEL = { owner: "経営者", hr: "人事", manager: "責任者", labor_advisor: "社労士" };
  // 段階の呼び方は lib/stages.js と合わせる。画面ごとに違う言葉にしない
  const STATUS_LABEL = { invited: "入社準備", active: "メンバー", leaving: "退職手続き中", left: "退職" };
  // 同じログインアカウントを使っている社内システム。表示の並び順もこの通り
  const SYSTEM_LABEL = { lms: "無限道場", timecard: "タイムカード", accounting: "会計" };

  let employees = [];
  let canGrantRoles = false;  // 社内権限の付け外し（管理者または人事）
  let canManage = false;      // 名簿の追加・編集・削除（管理者または人事）
  let editingId = null;      // null なら追加、id が入っていればその人の編集

  KPLayout.init({ active: "members", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const res = await API.listEmployees();
      employees = res.employees || [];
      canGrantRoles = !!res.canGrantRoles;
      canManage = !!res.canManage;
      render();
    } catch (e) {
      el("list").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>取得に失敗しました：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  // 追加と編集で同じフォームを使う。項目が同じものを2つ並べても、
  // どちらに書いたか分からなくなるだけなので、切り替えにした。
  async function save(btn) {
    const msg = el("e-msg");
    msg.textContent = "";
    const display_name = el("e-name").value.trim();
    if (!display_name) { msg.textContent = "氏名を入力してください"; return; }

    const fields = {
      display_name,
      email: el("e-email").value.trim() || null,
      department: el("e-dept").value.trim() || null,
      position: el("e-position").value.trim() || null,
      work_location: el("e-location").value.trim() || null,
      employment_type: el("e-type").value,
      joined_on: el("e-joined").value || null,
    };

    try {
      if (editingId) {
        await KPLayout.busy(btn, "保存中…", () => API.updateEmployee({
          id: editingId, ...fields, left_on: el("e-left").value || null,
        }));
      } else {
        const res = await KPLayout.busy(btn, "追加中…",
          () => API.createEmployee({ ...fields, status: "invited" }));
        showAccountResult(res?.account, display_name);
      }
      resetForm();
      await load();
    } catch (e) {
      msg.textContent = e.detail || e.hint || e.message || "保存に失敗しました";
    }
  }

  // 初回パスワードはこの応答にしか出てこない（保存すると平文で残るため）。
  // 消えると本人が入れなくなるので、閉じるまで画面に残す
  function showAccountResult(account, name) {
    const box = el("e-account");
    if (!account) { box.innerHTML = ""; return; }

    if (!account.ok) {
      box.innerHTML = `
        <div class="banner warn" style="margin-top:12px;">
          <span class="material-symbols-outlined">warning</span>
          <div>名簿には追加しましたが、ログインアカウントは作れませんでした：
            ${esc(account.hint || account.detail || account.error || "")}<br>
            一覧の「未連携」から、あとで作り直せます。</div>
        </div>`;
      return;
    }

    const sys = Object.entries(account.systems || {})
      .filter(([k]) => k !== "note")
      .map(([k, v]) => `${SYSTEM_LABEL[k] || k}：${v.ok ? v.action : "失敗（" + esc(v.detail || "") + "）"}`)
      .join("　");

    box.innerHTML = `
      <div class="banner ok" style="margin-top:12px;">
        <span class="material-symbols-outlined">check_circle</span>
        <div>
          <strong>${esc(name)} さんを追加しました。</strong>
          ${account.createdPassword ? `
            <div style="margin:8px 0;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;">
              初回パスワード：<code style="font-size:15px;font-weight:700;">${esc(account.createdPassword)}</code>
              <button class="btn btn-secondary btn-sm" style="margin-left:8px;"
                      onclick="navigator.clipboard.writeText('${esc(account.createdPassword)}')">コピー</button>
              <div class="muted" style="font-size:11.5px;margin-top:4px;">
                この画面を離れると二度と表示できません。本人へ直接お渡しください。
              </div>
            </div>` : `
            <div style="font-size:12.5px;margin-top:4px;">
              既にあったログインアカウントに紐づけました（パスワードは変えていません）。
            </div>`}
          ${sys ? `<div class="muted" style="font-size:11.5px;">${sys}</div>` : ""}
          ${account.systems?.note ? `<div class="muted" style="font-size:11.5px;">${esc(account.systems.note)}</div>` : ""}
        </div>
      </div>`;
  }

  function startEdit(id) {
    const e = employees.find((x) => x.id === id);
    if (!e) return;
    editingId = id;
    el("e-name").value = e.display_name || "";
    el("e-email").value = e.email || "";
    el("e-dept").value = e.department || "";
    el("e-position").value = e.position || "";
    el("e-location").value = e.work_location || "";
    el("e-type").value = e.employment_type || "正社員";
    el("e-joined").value = e.joined_on || "";
    el("e-left").value = e.left_on || "";

    el("e-icon").textContent = "edit";
    el("e-title").textContent = `${e.display_name} さんを編集`;
    el("e-save").innerHTML = '<span class="material-symbols-outlined icon-inline">save</span>保存';
    el("e-cancel-wrap").style.display = "";
    el("e-left-wrap").style.display = "";
    el("e-note").textContent = "在籍状態と社内権限は、下の一覧で切り替えます。";
    el("e-msg").textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    editingId = null;
    for (const id of ["e-name", "e-email", "e-dept", "e-position", "e-location", "e-joined", "e-left"]) {
      el(id).value = "";
    }
    el("e-type").value = "正社員";
    el("e-icon").textContent = "person_add";
    el("e-title").textContent = "メンバーを追加";
    el("e-save").innerHTML = '<span class="material-symbols-outlined icon-inline">add</span>追加';
    el("e-cancel-wrap").style.display = "none";
    el("e-left-wrap").style.display = "none";
    el("e-note").textContent =
      "ここで追加した人はまだログインアカウントと紐づいていません。本人のアカウントを作った後、" +
      "Supabase 側で紐づけるか、下の一覧の「未連携」表示を目印に対応してください。";
    el("e-msg").textContent = "";
  }

  async function remove(id, btn) {
    const e = employees.find((x) => x.id === id);
    if (!e) return;
    if (!confirm(
      `${e.display_name} さんを名簿から削除します。\n\n` +
      "退職した方は、削除ではなく状態を「退職」にしてください（記録が残ります）。\n" +
      "削除してよろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "削除中…", () => API.deleteEmployee(id));
      if (editingId === id) resetForm();
      await load();
    } catch (e2) {
      alert(e2.hint || e2.detail || e2.message || "削除に失敗しました");
    }
  }

  function render() {
    if (!employees.length) {
      el("list").innerHTML = `<div class="empty">まだ誰も登録されていません。</div>`;
      return;
    }
    el("list").innerHTML = `
      <div class="table-scroll">
        <table class="kp-items">
          <thead><tr>
            <th>氏名</th><th>部署・役職</th><th>雇用区分</th><th>状態</th><th>社内権限</th>
            <th>利用中のシステム</th><th>操作</th>
          </tr></thead>
          <tbody>${employees.map(row).join("")}</tbody>
        </table>
      </div>
      <p class="muted" style="font-size:12px;margin:12px 0 0;line-height:1.9;">
        <b>利用中のシステム</b>のチップを押すと、その場で開放／停止できます
        （グループウェアは名簿にいる方全員が使うので切れません。止めるときは状態を「退職」に）。<br>
        <b>ログイン</b>でメールアドレスとパスワードを変えられます。
        4つのシステムは同じログインなので、変えると全部に効きます。
        ${canGrantRoles ? "" :
          "<br>いまのアカウントには管理者権限がないため、変更できる項目がありません。"}
      </p>`;
  }

  function row(e) {
    const roles = e.roles || [];
    const roleCells = Object.keys(ROLE_LABEL).map((r) => `
      <label style="display:inline-flex;align-items:center;gap:4px;font-weight:400;font-size:11.5px;margin-right:8px;color:inherit;">
        <input type="checkbox" style="width:auto;margin:0;" ${roles.includes(r) ? "checked" : ""}
               ${canGrantRoles ? "" : "disabled"}
               onchange="setRole('${esc(e.id)}','${r}', this.checked, this)">
        ${ROLE_LABEL[r]}
      </label>`).join("");

    return `
      <tr class="${e.status === "left" ? "done" : ""}">
        <td>${esc(e.display_name)}${e.email ? `<br><span class="muted" style="font-size:11.5px;">${esc(e.email)}</span>` : ""}</td>
        <td>${esc(e.department || "—")}${e.position ? `<br><span class="muted" style="font-size:11.5px;">${esc(e.position)}</span>` : ""}</td>
        <td>${esc(e.employment_type || "—")}</td>
        <td>
          <select ${canManage ? "" : "disabled"} onchange="setStatus('${esc(e.id)}', this.value)">
            ${Object.entries(STATUS_LABEL).map(([k, v]) =>
              `<option value="${k}"${e.status === k ? " selected" : ""}>${v}</option>`).join("")}
          </select>
        </td>
        <td style="min-width:230px;">${roleCells}</td>
        <td style="min-width:190px;">${systemsCell(e)}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-secondary btn-sm" ${canManage ? "" : "disabled"}
                  onclick="startEdit('${esc(e.id)}')">編集</button>
          ${e.user_id ? `
            <button class="btn btn-secondary btn-sm" ${canManage ? "" : "disabled"}
                    title="メールアドレスとパスワードを変える"
                    onclick="openAccount('${esc(e.id)}')">ログイン</button>` : ""}
          <button class="btn btn-secondary btn-sm" ${canManage ? "" : "disabled"}
                  onclick="remove('${esc(e.id)}', this)">削除</button>
        </td>
      </tr>`;
  }

  // 「名簿にはいるが、どこにも入れない人」をここで見つけられるようにする。
  // 4システムとも同じログインアカウント（auth.users）を使っているので、
  // 未連携＝どこにも入れない、が一目で分かる
  function systemsCell(e) {
    if (!e.user_id) {
      return `<span class="kp-chip draft">未連携</span>
        <button class="btn btn-secondary btn-sm" style="margin-left:6px;"
                onclick="makeAccount('${esc(e.id)}', this)">アカウントを作る</button>`;
    }
    const a = e.accounts || {};
    // グループウェアは切れない。名簿に行があること自体が利用なので、
    // 止めたいときは在籍の状態（退職）で閉じる
    const chips = ['<span class="kp-chip event" title="名簿にいる方は必ず使えます">グループウェア</span>'];

    for (const [key, label] of Object.entries(SYSTEM_LABEL)) {
      const s = a[key];
      const on = !!s?.exists && s.active !== false;
      const cls = !s?.exists ? "archived" : (s.active ? "event" : "important");
      const title = !s?.exists ? "未登録。押すと使えるようにします"
        : s.active ? "使えます。押すと止めます" : "停止中。押すと使えるようにします";
      const text = !s?.exists ? label : s.active ? label : `${label}（停止）`;
      chips.push(canManage
        ? `<button type="button" class="kp-chip ${cls}" title="${esc(title)}"
                   style="border:none;cursor:pointer;font-family:inherit;"
                   onclick="toggleSystem('${esc(e.id)}','${key}',${!on},this)">${text}</button>`
        : `<span class="kp-chip ${cls}" title="${esc(title)}">${text}</span>`);
    }
    return `<div style="display:flex;flex-wrap:wrap;gap:4px;">${chips.join("")}</div>`;
  }

  // システムの利用を切り替える。押すたびに開放／停止。
  // 止めてもアカウントは消さない（日報・受講・経費の記録がぶら下がっている）。
  // 会計だけは本当に外す。止まっているだけの行を残すと、戻したときに気づけない
  async function toggleSystem(employeeId, system, on, btn) {
    const e = employees.find((x) => x.id === employeeId);
    const label = SYSTEM_LABEL[system] || system;
    if (!on && !confirm(`${e?.display_name} さんの「${label}」を止めますか。\n`
      + `記録は残ります。あとから開け直せます。`)) return;
    try {
      const r = await KPLayout.busy(btn, "…", () =>
        API.updateEmployeeAccount({ employeeId, systems: { [system]: on } }));
      const res = r.systems?.[system];
      if (res && !res.ok) alert(`${label}：${res.detail || "できませんでした"}`);
      await load();
    } catch (err) {
      alert(err.hint || err.detail || err.message || "変更できませんでした");
    }
  }

  // ---- ログイン情報 -----------------------------------------------------------
  //
  // 4システムは同じログイン（auth.users）を使っている。
  // ここで変えたメールとパスワードは、無限道場もタイムカードも会計も全部変わる。
  // 「グループウェアのぶんだけ」は仕組み上できないので、画面にもそう書く
  function openAccount(id) {
    const e = employees.find((x) => x.id === id);
    if (!e) return;
    const box = el("e-account");
    box.innerHTML = `
      <div class="card" style="margin-top:12px;border:1px solid var(--primary);">
        <h2><span class="material-symbols-outlined">key</span>${esc(e.display_name)} さんのログイン</h2>
        <div class="banner warn" style="margin-bottom:14px;">
          <span class="material-symbols-outlined">info</span>
          <div>グループウェア・無限道場・タイムカード・会計は<b>同じログイン</b>です。
          ここで変えると4つとも変わります。</div>
        </div>
        <div class="inline-controls" style="margin-bottom:12px;">
          <div style="min-width:240px;flex:1;">
            <label>メールアドレス（ログインID）</label>
            <input id="ac-email" type="email" value="${esc(e.email || "")}">
          </div>
          <div style="align-self:flex-end;">
            <button class="btn btn-secondary" onclick="saveAccountEmail('${esc(e.id)}', this)">
              <span class="material-symbols-outlined icon-inline">mail</span>メールを変える
            </button>
          </div>
        </div>
        <div class="inline-controls" style="margin-bottom:6px;">
          <div style="min-width:240px;flex:1;">
            <label>新しいパスワード（8文字以上）</label>
            <input id="ac-pw" type="text" placeholder="空のまま「自動で作る」も押せます" autocomplete="off">
          </div>
          <div style="align-self:flex-end;display:flex;gap:8px;">
            <button class="btn btn-secondary" onclick="saveAccountPassword('${esc(e.id)}', false, this)">
              この内容にする
            </button>
            <button class="btn btn-secondary" onclick="saveAccountPassword('${esc(e.id)}', true, this)">
              自動で作る
            </button>
          </div>
        </div>
        <p class="muted" style="font-size:11.5px;margin:0 0 12px;">
          変えたパスワードは保存されません。この画面に1回だけ出るので、控えて本人へ直接お渡しください。
        </p>
        <div id="ac-msg" class="err-text"></div>
        <div id="ac-out"></div>
        <button class="btn btn-secondary btn-sm" onclick="closeAccount()">閉じる</button>
      </div>`;
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function closeAccount() { el("e-account").innerHTML = ""; }

  // 出したパスワードは変数で持つ。onclick の文字列に直接入れると、
  // 記号の入ったパスワードでその場のJSが壊れる
  let lastPassword = "";
  function copyPassword() {
    if (!lastPassword) return;
    navigator.clipboard.writeText(lastPassword);
  }

  async function saveAccountEmail(employeeId, btn) {
    el("ac-msg").textContent = "";
    const email = el("ac-email").value.trim();
    try {
      await KPLayout.busy(btn, "変更中…", () => API.updateEmployeeAccount({ employeeId, email }));
      el("ac-out").innerHTML = `<div class="banner ok" style="margin-bottom:12px;">
        <span class="material-symbols-outlined">check_circle</span>
        <div>メールアドレスを変えました。次回から新しいアドレスでログインします。</div></div>`;
      await load();
    } catch (e) {
      el("ac-msg").textContent = e.hint || e.detail || e.message || "変更できませんでした";
    }
  }

  async function saveAccountPassword(employeeId, generate, btn) {
    el("ac-msg").textContent = "";
    const pw = el("ac-pw").value;
    if (!generate && pw.length < 8) {
      el("ac-msg").textContent = "パスワードは8文字以上にしてください";
      return;
    }
    if (!confirm("パスワードを変えると、いまのパスワードでは入れなくなります。よろしいですか。")) return;
    try {
      const r = await KPLayout.busy(btn, "変更中…", () => API.updateEmployeeAccount(
        generate ? { employeeId, generatePassword: true } : { employeeId, password: pw }));
      el("ac-pw").value = "";
      lastPassword = r.password || "";
      el("ac-out").innerHTML = `
        <div class="banner ok" style="margin-bottom:12px;">
          <span class="material-symbols-outlined">check_circle</span>
          <div>新しいパスワード：
            <code style="font-size:15px;font-weight:700;">${esc(lastPassword)}</code>
            <button class="btn btn-secondary btn-sm" style="margin-left:8px;"
                    onclick="copyPassword()">コピー</button>
            <div class="muted" style="font-size:11.5px;margin-top:4px;">
              この画面を離れると二度と表示できません。本人へ直接お渡しください。
            </div>
          </div>
        </div>`;
    } catch (e) {
      el("ac-msg").textContent = e.hint || e.detail || e.message || "変更できませんでした";
    }
  }

  // 未連携の人に、あとからアカウントを作る。メールが空なら聞く
  async function makeAccount(id, btn) {
    const e = employees.find((x) => x.id === id);
    if (!e) return;
    const email = (e.email || "").trim() ||
      (prompt(`${e.display_name} さんのメールアドレスを入れてください`) || "").trim();
    if (!email) return;
    try {
      const r = await KPLayout.busy(btn, "作成中…", () => API.linkEmployeeAccount(e.id, email, null));
      showAccountResult({ ok: true, ...r }, e.display_name);
      await load();
      el("e-account").scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (err) {
      alert(err.hint || err.detail || err.message || "作成に失敗しました");
    }
  }

  async function setRole(employeeId, role, grant, input) {
    try { await API.setEmployeeRole(employeeId, role, grant); await load(); }
    catch (e) {
      input.checked = !grant;   // 失敗したら見た目を元に戻す
      alert(e.detail || e.hint || e.message || "変更に失敗しました");
    }
  }

  // 退職にすると、無限道場・タイムカード・会計の入口もまとめて閉じる。
  // 黙って閉じると気づけないので、何が起きたかを必ず出す
  async function setStatus(id, status) {
    const e = employees.find((x) => x.id === id);
    const out = ["leaving", "left"].includes(status);
    if (out && e?.user_id &&
        !confirm(`${e.display_name} さんを「${STATUS_LABEL[status]}」にします。\n\n` +
                 "無限道場・タイムカード・会計にも入れなくなります。\n" +
                 "（ログインアカウント自体は消しません。記録が残るため）\n\nよろしいですか？")) {
      await load();
      return;
    }
    try {
      const res = await API.updateEmployee({ id, status });
      if (res?.systems) {
        const lines = Object.entries(res.systems)
          .map(([k, v]) => `${SYSTEM_LABEL[k] || k}：${v.ok ? v.action : "できませんでした（" + (v.detail || "") + "）"}`);
        alert(`${e?.display_name || ""} さんの各システム\n\n${lines.join("\n")}`);
      }
      await load();
    } catch (err) {
      alert(err.detail || err.message || "更新に失敗しました");
      await load();
    }
  }

  // --- まとめて追加 -----------------------------------------------------------
  function toggleBulk() {
    const body = el("bulk-body");
    const open = body.classList.toggle("hidden");
    el("bulk-caret").textContent = open ? "expand_more" : "expand_less";
    el("bulk-caret").nextSibling.textContent = open ? "開く" : "閉じる";
  }

  // タブ区切り（Excel からの貼り付け）とカンマ区切りの両方を読む。
  // カンマは氏名や部署に入りうるので、タブがある行はタブを優先する
  function parseBulk(text) {
    const COLS = ["display_name", "email", "department", "position", "employment_type", "joined_on"];
    return text.split(/\r?\n/)
      .map((l) => l.trim())
      .filter(Boolean)
      .filter((l) => !/^氏名/.test(l))          // 見出し行を貼っても弾く
      .map((line) => {
        const cells = (line.includes("\t") ? line.split("\t") : line.split(",")).map((c) => c.trim());
        const row = {};
        COLS.forEach((k, i) => { row[k] = cells[i] || ""; });
        return row;
      });
  }

  async function bulkImport(btn) {
    const rows = parseBulk(el("bulk-text").value);
    const box = el("bulk-result");
    if (!rows.length) { box.innerHTML = `<div class="err-text">読み取れる行がありません。</div>`; return; }
    if (!confirm(`${rows.length} 行を取り込みます。よろしいですか？`)) return;

    try {
      const r = await KPLayout.busy(btn, "取り込み中…",
        () => API.bulkCreateEmployees(rows, el("bulk-accounts").checked));

      // 初回パスワードはこの応答にしか出てこない。表にして残す
      const pw = r.added.filter((a) => a.password);
      box.innerHTML = `
        <div class="banner ${r.failed.length ? "warn" : "ok"}" style="margin-top:14px;">
          <span class="material-symbols-outlined">${r.failed.length ? "warning" : "check_circle"}</span>
          <div>追加 ${r.added.length} 件 ／ 飛ばした ${r.skipped.length} 件 ／ 失敗 ${r.failed.length} 件</div>
        </div>
        ${pw.length ? `
          <div class="card" style="margin:12px 0;">
            <h2 style="font-size:14px;"><span class="material-symbols-outlined">key</span>初回パスワード</h2>
            <p class="muted" style="font-size:12px;margin:0 0 10px;">
              この画面を離れると二度と表示できません。控えてから本人へお渡しください。
            </p>
            <div class="table-scroll"><table class="kp-items">
              <thead><tr><th>氏名</th><th>メール</th><th>初回パスワード</th></tr></thead>
              <tbody>${pw.map((a) => `<tr><td>${esc(a.name)}</td><td>${esc(a.email || "")}</td>
                <td><code style="font-weight:700;">${esc(a.password)}</code></td></tr>`).join("")}</tbody>
            </table></div>
            <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="copyPasswords()">
              <span class="material-symbols-outlined icon-inline">content_copy</span>まとめてコピー
            </button>
          </div>` : ""}
        ${[...r.skipped, ...r.failed].length ? `
          <div class="table-scroll" style="margin-top:12px;"><table class="kp-items">
            <thead><tr><th>行</th><th>氏名</th><th>理由</th></tr></thead>
            <tbody>${[...r.skipped, ...r.failed].map((x) =>
              `<tr><td>${x.line}</td><td>${esc(x.name)}</td><td>${esc(x.reason)}</td></tr>`).join("")}</tbody>
          </table></div>` : ""}
        ${r.added.filter((a) => a.accountError).length ? `
          <div class="banner warn" style="margin-top:12px;">
            <span class="material-symbols-outlined">warning</span>
            <div>名簿には入りましたが、アカウントを作れなかった人がいます：
              ${r.added.filter((a) => a.accountError)
                .map((a) => `${esc(a.name)}（${esc(a.accountError)}）`).join("、")}</div>
          </div>` : ""}`;

      bulkPasswords = pw;
      el("bulk-text").value = "";
      await load();
    } catch (e) {
      box.innerHTML = `<div class="err-text">${esc(e.hint || e.detail || e.message || "取り込みに失敗しました")}</div>`;
    }
  }

  let bulkPasswords = [];
  function copyPasswords() {
    const text = bulkPasswords.map((a) => `${a.name}\t${a.email || ""}\t${a.password}`).join("\n");
    navigator.clipboard.writeText(text);
  }

  function exportCsv() {
    const head = ["氏名", "メール", "部署", "役職", "雇用区分", "入社日", "状態", "社内権限"];
    const rows = employees.map((e) => [
      e.display_name, e.email || "", e.department || "", e.position || "",
      e.employment_type || "", e.joined_on || "",
      STATUS_LABEL[e.status] || e.status,
      (e.roles || []).map((r) => ROLE_LABEL[r] || r).join(" "),
    ]);
    const csv = [head, ...rows]
      .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
      .join("\r\n");
    // Excel が文字化けしないよう BOM を付ける
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `メンバー一覧_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
</script>
