<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>エイト 社内ポータル</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911a">
  <style>
    .portal{ max-width:420px; margin:0 auto; padding:56px 0 40px; }
    .portal .lead{
      text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9; margin:0 0 26px;
    }
    .portal h1{
      text-align:center; font-size:22px; color:var(--primary-dark);
      margin:0 0 6px; letter-spacing:.02em;
    }
    .portal .mark{
      width:52px; height:52px; margin:0 auto 16px; border-radius:14px;
      background:var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .portal .mark .material-symbols-outlined{ font-size:28px; }

    /* ログイン後の行き先の案内 */
    .roles{ display:grid; gap:8px; margin-top:6px; }
    .roles div{
      display:flex; align-items:center; gap:8px;
      font-size:12.5px; color:var(--muted); line-height:1.7;
    }
    .roles .material-symbols-outlined{ font-size:18px; color:var(--primary); }

    .foot{
      text-align:center; margin-top:26px; font-size:12.5px; color:var(--muted); line-height:1.9;
    }
    .foot a{ color:var(--primary-dark); }

    @media (max-width:600px){ .portal{ padding-top:32px; } }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand"><img src="img/logo.svg" alt="" class="kp-logo">エイト <span class="tag">社内ポータル</span></div>
  <div class="who">
    <a class="navlink" href="help.html">
      <span class="material-symbols-outlined icon-inline">help</span>使い方ガイド
    </a>
  </div>
</div>

<div class="wrap">
  <div class="portal">
    <div class="mark"><span class="material-symbols-outlined">apartment</span></div>
    <h1>エイト 社内ポータル</h1>
    <p class="lead">
      お知らせ・やること・メッセージ・入社手続き・会計書類を1か所にまとめています。<br>
      社内アカウントでログインしてください。
    </p>

    <div class="card" id="login-card">
      <div id="notice"></div>

      <div style="margin-bottom:12px;">
        <label>メールアドレス</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@8grp.co.jp">
      </div>
      <div style="margin-bottom:18px;">
        <label>パスワード</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>

      <button id="go" class="btn btn-primary" style="width:100%;justify-content:center;">
        <span class="material-symbols-outlined icon-inline">login</span>ログイン
      </button>
      <div id="err" class="err-text"></div>

      <div class="roles" style="margin-top:18px;">
        <div><span class="material-symbols-outlined">person</span>
          メンバーの方は、下タブ5つのホーム画面が開きます</div>
        <div><span class="material-symbols-outlined">admin_panel_settings</span>
          管理者・経営者の方は、管理用のダッシュボードが開きます</div>
        <div><span class="material-symbols-outlined">badge</span>
          社労士の方は、共有された手続きの画面が開きます</div>
      </div>
    </div>

    <p class="foot">
      はじめての方は <a href="help.html">使い方ガイド</a> をご覧ください。<br>
      ログインできない場合は管理部までお問い合わせください。
    </p>
  </div>
</div>

<script src="js/api-client.js?v=20260911a"></script>
<script src="js/layout.js?v=20260911a"></script>
<script>
  const el = (id) => document.getElementById(id);

  // ログイン済みならそのまま行き先へ送る。
  // 権限の判定は /api/me（appRole）に任せ、この画面では持たない。
  (async function () {
    if (!API.isLoggedIn()) return;
    el("notice").innerHTML =
      `<div class="banner info"><span class="material-symbols-outlined">hourglass_top</span>
         <div>ログイン済みです。画面を開いています…</div></div>`;
    try {
      await goToHome();
    } catch (e) {
      // トークン切れ。何もなかったようにログイン画面を出す
      API.logout();
      el("notice").innerHTML = "";
    }
  })();

  el("go").addEventListener("click", login);
  el("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  el("email").addEventListener("keydown", (e) => { if (e.key === "Enter") el("pw").focus(); });

  async function login() {
    const email = el("email").value.trim();
    const pw = el("pw").value;
    const err = el("err");
    err.textContent = "";
    if (!email || !pw) { err.textContent = "メールアドレスとパスワードを入力してください"; return; }

    const btn = el("go");
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined icon-inline">hourglass_top</span>ログイン中…';
    try {
      await API.login(email, pw);
      await goToHome();
    } catch (e) {
      err.textContent = e.message || "ログインに失敗しました";
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined icon-inline">login</span>ログイン';
    }
  }

  // 権限に応じた行き先へ移動する。
  // 次の画面がメニューを描き直さずに済むよう、権限をここで覚えておく。
  async function goToHome() {
    const me = await API.me();
    const appRole = me.appRole || (me.isAdmin ? "admin" : "member");
    const name = me.gw?.employee?.display_name || me.email || "";
    try { localStorage.setItem("kp_layout", JSON.stringify({ appRole, name })); } catch (e) { /* 任意 */ }
    location.replace(KPLayout.homeFor(appRole));
  }
</script>

</body>
</html>
