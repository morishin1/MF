<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910g">
  <link rel="stylesheet" href="css/layout.css?v=20260910g">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    .dr-card { border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
    .dr-card.confirmed { background:#fbfcfe; }
    .dr-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .dr-name { font-size:14.5px; font-weight:700; color:var(--primary-dark); }
    .dr-item { margin-bottom:9px; }
    .dr-item .k { font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:2px; }
    .dr-item .v { font-size:13px; white-space:pre-wrap; }
    .dr-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
    @media (max-width:720px){ .dr-grid { grid-template-columns:1fr; } }
    .dr-mini { width:100%; border-collapse:collapse; font-size:12.5px; }
    .dr-mini th { text-align:left; font-weight:600; color:var(--muted); padding:2px 8px 2px 0; }
    .dr-mini td { padding:2px 8px 2px 0; }
    .dr-reply { border-left:3px solid #2f855a; background:#f0f7f2; padding:9px 12px;
                border-radius:0 8px 8px 0; margin-top:8px; font-size:12.5px; white-space:pre-wrap; }
    .dr-reply.ai { border-left-color:var(--primary); background:var(--soft); }
    .dr-reply.draft { border-left-color:#c05621; background:#fffaf0; }
    .dr-reply .rh { font-size:11px; font-weight:700; margin-bottom:3px; color:var(--primary-dark); }
    .dr-bar { display:flex; align-items:flex-end; gap:3px; height:60px; }
    .dr-bar div { flex:1; background:var(--soft); border-radius:2px 2px 0 0; position:relative; }
    .dr-bar div span { position:absolute; inset:auto 0 0 0; background:var(--primary); border-radius:2px 2px 0 0; }
  </style>
</head>
<body>

<div class="wrap">
  <h1 class="kp-greet">日報</h1>
  <p class="kp-greet-sub">全員の日報を1日ぶんまとめて確認し、必要なら本人へメッセージを返します。</p>

  <div id="notice"></div>

  <div class="card">
    <div class="inline-controls" style="margin-bottom:0;">
      <div><label>日付</label><input id="f-date" type="date"></div>
      <div style="align-self:flex-end;">
        <button class="btn btn-secondary btn-sm" onclick="shift(-1)">前の日</button>
        <button class="btn btn-secondary btn-sm" onclick="shift(1)">次の日</button>
        <button class="btn btn-secondary btn-sm" onclick="jump(todayStr())">今日</button>
      </div>
      <div style="margin-left:auto;align-self:flex-end;">
        <label style="display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;">
          <input id="ai-toggle" type="checkbox" style="width:auto;margin:0;" onchange="toggleAi(this)">
          AI自動返信
        </label>
      </div>
    </div>
  </div>

  <div id="tiles" class="kp-tiles"></div>

  <div class="card">
    <h2><span class="material-symbols-outlined">trending_up</span>提出率<span class="muted" style="font-weight:400;font-size:12.5px;margin-left:6px;">直近の平日</span></h2>
    <div class="dr-bar" id="trend"></div>
    <div id="trend-labels" style="display:flex;gap:3px;margin-top:4px;font-size:10px;color:var(--muted);"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">person_off</span>未提出</h2>
    <div id="not-submitted"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">table_rows</span>一覧
      <span class="muted" style="font-weight:400;font-size:12.5px;margin-left:6px;">全員分を細かく読む前に、ここで状況をつかむ</span></h2>
    <div id="overview"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">description</span>提出された日報</h2>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">radar</span>週次評価
      <span id="wk-tag" class="kp-chip" style="margin-left:8px;"></span></h2>
    <div class="inline-controls" style="margin-bottom:12px;">
      <div><label>対象者</label><select id="w-user" onchange="loadWeekly()"></select></div>
    </div>
    <div id="w-form"></div>
  </div>
</div>

<script src="js/api-client.js?v=20260910g"></script>
<script src="js/layout.js?v=20260910g"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  // 会社評価基準10項目。日次の○△― と週次の点数で同じキーを使う
  const CRITERIA = [
    ["quantity", "量"], ["report_consult", "報連相"], ["action", "行動"],
    ["self_learning", "学習"], ["consistency", "期限"], ["results", "成果"],
    ["feedback_improvement", "改善"], ["forward_thinking", "前進"],
    ["team_attitude", "チーム"], ["customer_focus", "顧客"],
  ];
  const TAG_LABEL = {
    self_research: "自分で調べた", new_method: "新しい方法を試した",
    feedback: "FBを反映した", process: "やり方を改善した",
    ai_tool: "AI・ツールを活用", other: "その他",
  };

  const EVAL = [
    ["achieve", "達成"], ["speed", "スピード"], ["accuracy", "正確さ"],
    ["priority", "優先順位"], ["solve", "解決力"], ["share", "共有"],
  ];

  let data = null;
  let weekly = null;

  KPLayout.init({ active: "nippo", roles: ["admin", "owner"] })
    .then((ctx) => { if (ctx) start(); });

  const todayStr = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);

  function start() {
    el("f-date").value = todayStr();
    el("f-date").addEventListener("change", () => load(el("f-date").value));
    load(todayStr());
  }

  function shift(n) {
    const d = new Date(`${el("f-date").value || todayStr()}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + n);
    jump(d.toISOString().slice(0, 10));
  }
  function jump(date) { el("f-date").value = date; load(date); }

  async function load(date) {
    try {
      data = await API.nippoAdmin(date, 14);
    } catch (e) {
      el("notice").innerHTML =
        `<div class="banner err"><span class="material-symbols-outlined">error</span>
           <div>${esc(e.hint || e.detail || e.message)}</div></div>`;
      return;
    }
    el("notice").innerHTML = "";
    el("ai-toggle").checked = !!data.aiAutoReply;
    el("wk-tag").textContent = `${data.weekStart} の週`;
    renderTiles();
    renderTrend();
    renderNotSubmitted();
    renderOverview();
    renderList();
    renderUserPicker();
  }

  function renderTiles() {
    const total = (data.members || []).length;
    const done = (data.nippos || []).length;
    const confirmed = (data.nippos || []).filter((n) => n.confirmed).length;
    const struggling = (data.nippos || []).filter((n) => n.mood === "苦戦").length;
    const tile = (k, v, sub, cls) => `
      <div class="kp-tile${cls ? " " + cls : ""}">
        <div class="k">${esc(k)}</div><div class="v">${v}</div><div class="s">${esc(sub)}</div>
      </div>`;
    el("tiles").innerHTML = [
      tile("提出", `${done}<small>/${total}</small>`, total ? `${Math.round((done / total) * 100)}%` : "—"),
      tile("未確認", done - confirmed, `確認済み ${confirmed} 件`, done - confirmed ? "alert" : ""),
      tile("苦戦", struggling, "調子が「苦戦」の人", struggling ? "alert" : ""),
      tile("対象者", total, "在籍・ログインあり"),
    ].join("");
  }

  function renderTrend() {
    const rows = data.trend || [];
    if (!rows.length) { el("trend").innerHTML = ""; el("trend-labels").innerHTML = ""; return; }
    el("trend").innerHTML = rows.map((r) => {
      const pct = r.total ? Math.round((r.submitted / r.total) * 100) : 0;
      return `<div title="${esc(r.date)} ${r.submitted}/${r.total}"><span style="height:${pct}%;"></span></div>`;
    }).join("");
    el("trend-labels").innerHTML = rows.map((r) =>
      `<div style="flex:1;text-align:center;">${esc(r.date.slice(5))}</div>`).join("");
  }

  function renderNotSubmitted() {
    const yet = data.notSubmitted || [];
    el("not-submitted").innerHTML = yet.length
      ? `<div style="display:flex;flex-wrap:wrap;gap:6px;">
           ${yet.map((n) => `<span class="kp-chip draft">${esc(n)}</span>`).join("")}
         </div>`
      : `<div class="empty">全員提出済みです。</div>`;
  }

  // --- 一覧（全員を1行ずつ） ---------------------------------------------------
  // 全員の日報を頭から読むと時間がかかる。まずここで「誰を読むべきか」を決める
  function renderOverview() {
    const members = data.members || [];
    if (!members.length) { el("overview").innerHTML = `<div class="empty">対象者がいません。</div>`; return; }

    const byUser = new Map((data.nippos || []).map((n) => [n.user_id, n]));

    el("overview").innerHTML = `
      <div class="table-scroll">
        <table class="kp-items">
          <thead><tr>
            <th>氏名</th><th>今日のKGI</th>
            <th style="width:70px;text-align:right;">目標</th>
            <th style="width:70px;text-align:right;">実績</th>
            <th style="width:70px;">結果</th>
            <th style="width:70px;text-align:right;">成果</th>
            <th style="width:110px;">困りごと</th>
            <th style="width:80px;">提出</th>
            <th>要確認</th>
          </tr></thead>
          <tbody>${members.map((m) => overviewRow(m, byUser.get(m.userId))).join("")}</tbody>
        </table>
      </div>`;
  }

  function overviewRow(m, n) {
    const flags = checkFlags(m, n);
    if (!n) {
      return `<tr class="done">
        <td>${esc(m.name)}</td><td colspan="6" class="muted">—</td>
        <td><span class="kp-chip draft">未提出</span></td>
        <td>${flagChips(flags)}</td></tr>`;
    }
    const issues = n.no_issues ? 0 : (n.issues || []).length;
    const consulted = (n.issues || []).filter((i) => i.consulted).length;
    return `<tr>
      <td><a href="#dr-${esc(n.id)}" style="color:var(--primary);font-weight:600;text-decoration:none;">${esc(m.name)}</a></td>
      <td style="font-size:12.5px;">${esc(n.goal_today || "")}</td>
      <td style="text-align:right;">${n.kgi_target ?? "—"}</td>
      <td style="text-align:right;">${n.kgi_actual ?? "—"}</td>
      <td>${n.kgi_achieved === true ? '<span class="kp-chip event">達成</span>'
           : n.kgi_achieved === false ? '<span class="kp-chip important">未達</span>' : "—"}</td>
      <td style="text-align:right;">${(n.work_items || []).length}</td>
      <td>${n.no_issues ? '<span class="muted">なし</span>'
           : issues ? `${issues}件${consulted ? `<span class="muted" style="font-size:11px;">／相談${consulted}</span>`
                                              : '<span class="kp-chip draft" style="margin-left:4px;">相談なし</span>'}`
                    : '<span class="muted">—</span>'}</td>
      <td><span class="kp-chip event">提出</span>${n.confirmed ? '<span class="kp-chip">確認済</span>' : ""}</td>
      <td>${flagChips(flags)}</td></tr>`;
  }

  // 要確認フラグ。読むべき人を機械的に拾う。
  // 「連続」の判定に要る過去ぶんは trend にしか無いので、ここで見るのは当日の内容だけ
  function checkFlags(m, n) {
    const f = [];
    if (!n) { f.push("日報未提出"); return f; }
    if (n.kgi_achieved === false) f.push("KGI未達");
    if (!(n.work_items || []).length) f.push("成果が空欄");
    if (!n.no_issues && (n.issues || []).some((i) => !i.consulted)) f.push("相談相手が未入力");
    if (n.tomorrow_plan && !n.tomorrow_deadline && !n.tomorrow_target) f.push("明日の最優先が抽象的");
    if (n.mood === "苦戦") f.push("調子が苦戦");
    return f;
  }

  const flagChips = (f) => f.length
    ? f.map((x) => `<span class="kp-chip important" style="margin:1px;">${esc(x)}</span>`).join("")
    : '<span class="muted">—</span>';

  // --- 日報の一覧 -------------------------------------------------------------
  function renderList() {
    const rows = data.nippos || [];
    if (!rows.length) { el("list").innerHTML = `<div class="empty">この日の日報はありません。</div>`; return; }
    el("list").innerHTML = rows.map(card).join("");
  }

  function card(n) {
    const rs = (data.replies || []).filter((r) => r.nippo_id === n.id);
    const item = (k, v) => v ? `<div class="dr-item"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>` : "";

    return `
      <div class="dr-card${n.confirmed ? " confirmed" : ""}" id="dr-${esc(n.id)}">
        <div class="dr-head">
          <span class="dr-name">${esc(n.user_name)}</span>
          <span class="kp-chip${n.mood === "苦戦" ? " important" : ""}">${esc(n.mood || "")}</span>
          ${n.employ_type ? `<span class="muted" style="font-size:11.5px;">${esc(n.employ_type)}</span>` : ""}
          ${n.confirmed ? '<span class="kp-chip event">確認済み</span>' : ""}
          <button class="btn btn-primary btn-sm" style="margin-left:auto;"
                  onclick="aiDraft('${esc(n.id)}', this)"
                  title="この人の直近の日報もあわせてAIが読み、返信の下書きまで作ります">
            <span class="material-symbols-outlined icon-inline">auto_awesome</span>AIで読む
          </button>
          <button class="btn btn-secondary btn-sm"
                  onclick="confirmOne('${esc(n.id)}', ${!n.confirmed}, this)">
            ${n.confirmed ? "確認を外す" : "確認した"}
          </button>
        </div>
        <div id="ai-${esc(n.id)}"></div>

        <div class="dr-grid">
          <div>
            ${kgiBlock(n)}
            ${workTable(n.work_items)}
            ${item("⑤ 顧客・チームのためにしたこと", n.contribution)}
          </div>
          <div>
            ${issueBlock(n)}
            ${improveBlock(n)}
            ${tomorrowBlock(n)}
          </div>
        </div>

        ${flagsRow(n.daily_flags)}
        ${legacyBlock(n)}

        ${rs.map(replyBox).join("")}

        <div style="margin-top:10px;">
          <textarea id="rp-${esc(n.id)}" rows="2" placeholder="本人へのメッセージ（任意）"></textarea>
          <button class="btn btn-primary btn-sm" onclick="reply('${esc(n.id)}', false, this)">
            <span class="material-symbols-outlined icon-inline">send</span>本人へ送る
          </button>
          <button class="btn btn-secondary btn-sm" onclick="reply('${esc(n.id)}', true, this)">
            下書きとして保存
          </button>
        </div>
      </div>`;
  }

  function kgiBlock(n) {
    const has = n.goal_today || n.kgi_target != null || n.kgi_actual != null;
    if (!has) return "";
    const nums = [
      n.kgi_target != null ? `目標 ${n.kgi_target}` : "",
      n.kgi_actual != null ? `実績 ${n.kgi_actual}` : "",
    ].filter(Boolean).join(" / ");
    const mark = n.kgi_achieved === true ? '<span class="kp-chip event">達成</span>'
      : n.kgi_achieved === false ? '<span class="kp-chip important">未達</span>' : "";
    return `<div class="dr-item"><div class="k">① 今日のKGI</div>
      <div class="v">${esc(n.goal_today || "")}
        ${nums ? `<span class="muted" style="margin-left:8px;">${esc(nums)}</span>` : ""} ${mark}</div></div>`;
  }

  function workTable(items) {
    if (!Array.isArray(items) || !items.length) return "";
    return `<div class="dr-item"><div class="k">② やったこと・成果（${items.length}件）</div>
      <table class="dr-mini"><tr><th>やったこと</th><th>結果・成果</th></tr>
      ${items.map((r) => `<tr><td>${esc(r.task || "")}</td><td>${esc(r.result || "")}</td></tr>`).join("")}
      </table></div>`;
  }

  function issueBlock(n) {
    if (n.no_issues) {
      return `<div class="dr-item"><div class="k">③ 困ったこと・報告相談</div>
        <div class="v muted">特になし</div></div>`;
    }
    const rows = n.issues || [];
    if (!rows.length) return "";
    return `<div class="dr-item"><div class="k">③ 困ったこと・報告相談（${rows.length}件）</div>
      ${rows.map((r) => `
        <div style="border-left:2px solid var(--border);padding-left:9px;margin-bottom:7px;">
          <div style="font-size:13px;">${esc(r.issue || "")}</div>
          ${r.action_taken ? `<div class="muted" style="font-size:11.5px;">自分で：${esc(r.action_taken)}</div>` : ""}
          <div class="muted" style="font-size:11.5px;">
            相談：${r.consulted ? esc(r.consulted) : '<span style="color:#c05621;">未記入</span>'}
          </div>
          <div style="font-size:12.5px;">→ ${esc(r.next_action || "")}</div>
        </div>`).join("")}</div>`;
  }

  function improveBlock(n) {
    const tags = (n.improve_tags || []).map((k) => TAG_LABEL[k] || k);
    if (!tags.length && !n.challenge) return "";
    return `<div class="dr-item"><div class="k">④ 改善・学び</div>
      ${tags.length ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;">
        ${tags.map((t) => `<span class="kp-chip">${esc(t)}</span>`).join("")}</div>` : ""}
      ${n.challenge ? `<div class="v">${esc(n.challenge)}</div>` : ""}</div>`;
  }

  function tomorrowBlock(n) {
    if (!n.tomorrow_plan) return "";
    const extra = [n.tomorrow_deadline, n.tomorrow_target].filter(Boolean).join(" / ");
    // 期限も完了条件も無い＝「営業を頑張る」の類。目印を出す
    return `<div class="dr-item"><div class="k">⑥ 明日の最優先</div>
      <div class="v">${esc(n.tomorrow_plan)}
        ${extra ? `<span class="muted" style="margin-left:8px;">${esc(extra)}</span>`
                : '<span class="kp-chip draft" style="margin-left:8px;">期限・条件なし</span>'}</div></div>`;
  }

  // 日報から機械的に拾った「確認できた行動」。人事評価点ではない
  function flagsRow(flags) {
    if (!flags) return "";
    return `<div style="display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;">
      ${CRITERIA.map(([key, short]) => {
        const v = flags[key] || "-";
        const color = v === "o" ? "#2f855a" : v === "d" ? "#b7791f" : "#aab4c8";
        return `<span style="font-size:11px;color:${color};border:1px solid var(--border);
                  border-radius:6px;padding:3px 7px;">${esc(short)} ${v === "o" ? "○" : v === "d" ? "△" : "―"}</span>`;
      }).join("")}</div>`;
  }

  // 項目を整理する前の日報も、そのまま読めるようにしておく
  function legacyBlock(n) {
    const item = (k, v) => v ? `<div class="dr-item"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>` : "";
    const old = [
      item("今日の成果（旧）", n.today_work),
      item("困っていること（旧）", n.struggle),
      item("今日の目的（旧）", n.purpose),
      item("明日試すこと（旧）", n.work_items ? "" : n.tomorrow_plan),
    ].filter(Boolean).join("");
    if (!old) return "";
    return `<details style="margin-top:4px;">
      <summary style="font-size:11.5px;color:var(--muted);cursor:pointer;">以前の形式の項目を見る</summary>
      <div style="margin-top:8px;">${old}</div></details>`;
  }

  function replyBox(r) {
    if (r.kind === "ai") {
      const st = r.status || "sent";
      const body = st === "error" || !r.body
        ? `AI返信は生成できませんでした${r.error_detail ? `（${esc(r.error_detail)}）` : ""}`
        : esc(r.body);
      return `<div class="dr-reply ai"><div class="rh">AIによる自動返信${r.needs_human ? "・要確認" : ""}</div>${body}</div>`;
    }
    return `<div class="dr-reply${r.draft_only ? " draft" : ""}">
      <div class="rh">担当者より${r.draft_only ? "（下書き・本人には未送信）" : ""}</div>${esc(r.body)}
      ${r.draft_only ? `
        <div style="margin-top:8px;">
          <button class="btn btn-primary btn-sm" onclick="sendDraft('${esc(r.id)}', this)">本人へ送る</button>
          <button class="btn btn-secondary btn-sm" onclick="deleteDraft('${esc(r.id)}', this)">下書きを消す</button>
        </div>` : ""}
    </div>`;
  }

  // --- AIで読む ---------------------------------------------------------------
  // 1回押すと、その人の直近ぶんもあわせて読み、気づいた点と返信の下書きを出す。
  // 送信はしない。送るかどうかは人が決める（AIが勝手に本人へ声をかける形にしない）
  const LEVEL = {
    good:  { icon: "check_circle", color: "#2f855a", label: "よかった点" },
    watch: { icon: "visibility",   color: "#b7791f", label: "気にしておく点" },
    risk:  { icon: "warning",      color: "#c53030", label: "手を打つ点" },
  };

  async function aiDraft(nippoId, btn) {
    const box = el(`ai-${nippoId}`);
    box.innerHTML = "";
    try {
      const { draft } = await KPLayout.busy(btn, "読んでいます…",
        () => API.nippoAdminAct({ action: "ai_draft", nippoId }));
      renderDraft(nippoId, draft);
    } catch (e) {
      box.innerHTML = `<div class="banner err" style="margin-top:10px;">
        <span class="material-symbols-outlined">error</span>
        <div>${esc(e.hint || e.detail || e.message || "AIが応答しませんでした")}</div></div>`;
    }
  }

  function renderDraft(nippoId, d) {
    const signals = (d.signals || []).map((s) => {
      const m = LEVEL[s.level] || LEVEL.watch;
      return `<div style="display:flex;gap:7px;align-items:flex-start;margin-bottom:5px;">
        <span class="material-symbols-outlined" style="font-size:16px;color:${m.color};">${m.icon}</span>
        <span style="font-size:12.5px;">${esc(s.text)}</span>
      </div>`;
    }).join("");

    el(`ai-${nippoId}`).innerHTML = `
      <div style="border:1px solid var(--border);border-left:3px solid var(--primary);
                  background:var(--soft);border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
                    color:var(--primary-dark);margin-bottom:8px;">
          <span class="material-symbols-outlined" style="font-size:15px;">auto_awesome</span>AIの読み取り
        </div>

        ${d.needs_human ? `
          <div class="banner warn" style="margin-bottom:10px;">
            <span class="material-symbols-outlined">priority_high</span>
            <div>体調や人間関係にふれる記述があります。<strong>AIの返信案をそのまま送らず、必ずご自身で読んでください。</strong></div>
          </div>` : ""}

        <div style="font-size:13px;margin-bottom:10px;">${esc(d.summary || "")}</div>
        ${signals}
        ${(d.blockers || []).length ? `
          <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--border);">
            <div style="font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;">
              上長が動く必要があること
            </div>
            ${d.blockers.map((b) => `<div style="font-size:12.5px;">・${esc(b)}</div>`).join("")}
          </div>` : ""}
        ${d.ask ? `
          <div style="margin-top:10px;font-size:12.5px;">
            <strong>本人に確認するなら：</strong>${esc(d.ask)}
          </div>` : ""}

        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
          <div style="font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;">
            返信の下書き（本人へ送る前に直せます）
          </div>
          <textarea id="ai-rp-${esc(nippoId)}" rows="4">${esc(d.reply || "")}</textarea>
          <button class="btn ${d.needs_human ? "btn-secondary" : "btn-primary"} btn-sm"
                  onclick="sendDraftReply('${esc(nippoId)}', this)">
            <span class="material-symbols-outlined icon-inline">send</span>本人へ送る
          </button>
          <button class="btn btn-secondary btn-sm" onclick="saveDraftReply('${esc(nippoId)}', this)">
            下書きとして保存
          </button>
          <div class="muted" style="font-size:11px;margin-top:6px;">
            送ると「担当者より」として本人の日報画面に出ます。AIが書いたとは表示されません。
          </div>
        </div>
      </div>`;
  }

  // onclick から呼ぶものは function 宣言にする。
  // インラインの onclick は window を見に行くので、const の関数だと見つからない
  function sendDraftReply(id, btn) { return postDraft(id, btn, false); }
  function saveDraftReply(id, btn) { return postDraft(id, btn, true); }

  async function postDraft(nippoId, btn, draftOnly) {
    const body = el(`ai-rp-${nippoId}`).value.trim();
    if (!body) return;
    try {
      await KPLayout.busy(btn, draftOnly ? "保存中…" : "送信中…",
        () => API.nippoAdminAct({ action: "reply", nippoId, body, draftOnly }));
      await load(el("f-date").value);
    } catch (e) {
      alert(e.detail || e.message || "送信に失敗しました");
    }
  }

  // --- 操作 -------------------------------------------------------------------
  async function confirmOne(nippoId, confirmed, btn) {
    try {
      await KPLayout.busy(btn, "更新中…", () => API.nippoAdminAct({ action: "confirm", nippoId, confirmed }));
      await load(el("f-date").value);
    } catch (e) { alert(e.detail || e.message || "更新に失敗しました"); }
  }

  async function reply(nippoId, draftOnly, btn) {
    const box = el(`rp-${nippoId}`);
    const body = box.value.trim();
    if (!body) { box.focus(); return; }
    try {
      await KPLayout.busy(btn, draftOnly ? "保存中…" : "送信中…",
        () => API.nippoAdminAct({ action: "reply", nippoId, body, draftOnly }));
      await load(el("f-date").value);
    } catch (e) { alert(e.detail || e.message || "送信に失敗しました"); }
  }

  async function sendDraft(replyId, btn) {
    try {
      await KPLayout.busy(btn, "送信中…", () => API.nippoAdminAct({ action: "send_draft", replyId }));
      await load(el("f-date").value);
    } catch (e) { alert(e.detail || e.message || "送信に失敗しました"); }
  }

  async function deleteDraft(replyId, btn) {
    if (!confirm("この下書きを消します。よろしいですか？")) return;
    try {
      await KPLayout.busy(btn, "削除中…", () => API.nippoAdminAct({ action: "delete_reply", replyId }));
      await load(el("f-date").value);
    } catch (e) { alert(e.hint || e.detail || e.message || "削除に失敗しました"); }
  }

  async function toggleAi(input) {
    const enabled = input.checked;
    try { await API.nippoAdminAct({ action: "ai_toggle", enabled }); }
    catch (e) { input.checked = !enabled; alert(e.detail || e.message || "変更に失敗しました"); }
  }

  // --- 週次評価 ---------------------------------------------------------------
  function renderUserPicker() {
    const sel = el("w-user");
    const keep = sel.value;
    sel.innerHTML = `<option value="">選んでください</option>` + (data.members || []).map((m) =>
      `<option value="${esc(m.userId)}"${m.userId === keep ? " selected" : ""}>${esc(m.name)}</option>`).join("");
    if (keep) loadWeekly(); else el("w-form").innerHTML = `<div class="empty">対象者を選ぶと入力できます。</div>`;
  }

  async function loadWeekly() {
    const userId = el("w-user").value;
    if (!userId) { el("w-form").innerHTML = `<div class="empty">対象者を選ぶと入力できます。</div>`; return; }
    try {
      const res = await API.nippoAdminAct({ action: "weekly_get", userId, weekStart: data.weekStart });
      weekly = res.weekly;
    } catch { weekly = null; }
    renderWeeklyForm();
  }

  function renderWeeklyForm() {
    const s = weekly?.eval_scores || {};
    el("w-form").innerHTML = `
      ${weekly?.q1 || weekly?.q2 || weekly?.q3 || weekly?.q4 ? `
        <div class="banner info" style="margin-bottom:14px;">
          <span class="material-symbols-outlined">quiz</span>
          <div style="font-size:12.5px;">
            <strong>本人の振り返り</strong>
            ${["q1", "q2", "q3", "q4"].filter((k) => weekly[k]).map((k) =>
              `<div style="margin-top:6px;white-space:pre-wrap;">${esc(weekly[k])}</div>`).join("")}
          </div>
        </div>` : `<div class="banner warn" style="margin-bottom:14px;">
          <span class="material-symbols-outlined">info</span>
          <div>この週の本人の振り返りはまだ入っていません。</div></div>`}

      <div class="inline-controls" style="margin-bottom:12px;">
        ${EVAL.map(([k, label]) => `
          <div style="min-width:110px;">
            <label>${esc(label)}</label>
            <select id="ev-${k}">
              <option value="">—</option>
              ${[1, 2, 3, 4, 5].map((n) => `<option value="${n}"${s[k] === n ? " selected" : ""}>${n}</option>`).join("")}
            </select>
          </div>`).join("")}
      </div>
      <div style="margin-bottom:12px;">
        <label>総評</label>
        <textarea id="ev-comment" rows="3">${esc(weekly?.eval_comment || "")}</textarea>
      </div>
      ${weekly?.submitted_at
        ? `<div class="banner ok" style="margin-bottom:12px;">
             <span class="material-symbols-outlined">check_circle</span>
             <div>本人へ提出済みです（${esc(new Date(weekly.submitted_at).toLocaleString("ja-JP"))}）。上書きして再提出できます。</div>
           </div>` : ""}
      <button class="btn btn-secondary" onclick="saveEval(false, this)">下書きとして保存</button>
      <button class="btn btn-primary" onclick="saveEval(true, this)">
        <span class="material-symbols-outlined icon-inline">send</span>本人へ提出
      </button>
      <div id="ev-msg" class="err-text"></div>`;
  }

  async function saveEval(submitToUser, btn) {
    const userId = el("w-user").value;
    if (!userId) return;
    const scores = {};
    for (const [k] of EVAL) {
      const v = el(`ev-${k}`).value;
      if (v) scores[k] = Number(v);
    }
    try {
      const res = await KPLayout.busy(btn, "保存中…", () => API.nippoAdminAct({
        action: "weekly_eval", userId, weekStart: data.weekStart,
        scores, comment: el("ev-comment").value, submit: submitToUser,
      }));
      weekly = res.weekly;
      renderWeeklyForm();
    } catch (e) {
      el("ev-msg").textContent = e.hint || e.detail || e.message || "保存に失敗しました";
    }
  }
</script>

</body>
</html>
