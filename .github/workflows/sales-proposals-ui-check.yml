name: Sales提案画面だけ先に確かめる（PR専用）
on:
  push:
    branches: [feat/sales-proposals-compact-workspace]
    paths:
      - "sales/proposals.html"
      - "test/ui/salesproposalsui.mjs"
      - ".github/workflows/sales-proposals-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 用意する
        run: npm install --no-audit --no-fund
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: 静的サーバを上げる
        run: |
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/mypage.html && break
            sleep 0.5
          done
      - name: Salesの対象画面だけ確認
        run: node --experimental-test-module-mocks test/ui/salesproposalsui.mjs
