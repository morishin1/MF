name: カレンダー予定モーダルの画面検証（PR専用）
on:
  push:
    branches: [fix/calendar-event-modal-no-clipping-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/mypage.html && break
            sleep 0.5
          done
      - name: Member calendar modal desktop and mobile
        run: |
          node test/calendarteamboard.mjs
          node --experimental-test-module-mocks test/ui/calendarui.mjs
