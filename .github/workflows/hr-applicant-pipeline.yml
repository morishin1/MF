name: HR applicant pipeline checks
on:
  pull_request:
    paths:
      - 'hr/**'
      - 'js/hr-*.js'
      - 'lib/hr*.js'
      - 'api/hr/**'
      - 'db/181_hr_two_week_trial.sql'
      - 'test/hrapplicantpipeline.mjs'
      - 'test/ui/hrpipelineui.mjs'
      - '.github/workflows/hr-applicant-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node test/hrapplicantpipeline.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - name: Fixture server
        run: |
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/hr-pipeline-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/hr/applicants.html && break
            sleep 1
          done
      - name: Full-width list, one state, next actions and status news
        run: node test/ui/hrpipelineui.mjs
