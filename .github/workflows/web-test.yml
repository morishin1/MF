# サーバ側と画面を、直すたびに確かめる。
#
# ■ なぜ要るのか
#
#   api/devices/pair.js が enrollment_id を SELECT し忘れていて、
#   実機で動かすまで誰も気づかなかった。
#   テストは全部通っていた（偽の Supabase が行を丸ごと返していたため）。
#
#   そのテストも、作業用の一時領域にしか無く、セッションが終われば
#   消えていた。「壊れたら気づく」仕掛けが、いちばん消えやすい場所にあった。
#   だからリポジトリに入れて、ここで毎回まわす。
#
# ■ 2つに分ける
#
#   node … ブラウザが要らないもの。速いので、まずこちらで落とす
#   ui   … 実際の画面を開くもの。Chromium を入れるぶん時間がかかる

name: サーバ側を確かめる

on:
  push:
    paths: ["api/**", "lib/**", "db/**", "js/**", "css/**", "*.html", "hr/**", "sales/**", "keiei/**", "office/**", "onboarding/**", "test/**",
            "vercel.json", ".github/workflows/web-test.yml"]
  pull_request:
    paths: ["api/**", "lib/**", "db/**", "js/**", "css/**", "*.html", "hr/**", "sales/**", "keiei/**", "office/**", "onboarding/**", "test/**", "vercel.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: サーバ側（ブラウザなし）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 用意する
        run: npm install --no-audit --no-fund
      # テストそのものの置き方を先に見る。
      # 手元にしか無い場所を指したまま、というのが実際に起きた
      - name: テストの置き方
        run: node test/selfcheck.mjs
      - name: 確かめる
        run: node test/run.mjs node

  ui:
    # 画面テストは 140 本を超え、1本ずつ順に走らせると上限時間に当たって途中で打ち切られていた
    # （打ち切られると、どのテストが落ちたのかも残らない）。6組に分けて並べて走らせる。
    # 分け方は test/run.mjs（TEST_SHARD）。どのテストも必ずどれか1組に入り、外すテストは無い。
    # 1組が落ちても、ほかの組は最後まで走らせる（落ちたテストを全部見るため）
    name: 画面（ブラウザあり） ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 用意する
        run: npm install --no-audit --no-fund
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium
      # 画面は静的ファイル。置くだけで開ける
      - name: 静的サーバを上げる
        run: |
          set -eu
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/mypage.html && break
            sleep 0.5
          done
      - name: 確かめる
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
        run: node test/run.mjs ui
