# EIGHT Agent を組み立てる。
#
# ■ なぜ GitHub Actions でやるのか
#
#   これまでは、誰かのパソコンに Go と Git Bash を入れて ./build.sh を叩いていた。
#   それだと「その人のパソコンでしか作れないもの」になる。
#   入れているものの違いで、出てくる EXE が変わることもある。
#
#   ここで作れば、誰が押しても同じ手順で同じものが出る。
#   ローカルに Go も Git Bash も OpenSSL も要らない。
#
# ■ 使い方（管理者）
#
#   GitHub → Actions → 「EIGHT Agent を組み立てる」→ Run workflow
#     版: 0.3.0 のように入れて実行
#     → 終わったら、そのページの Artifacts から EXE を落とす
#
# ■ まだ自動になっていないこと
#
#   Supabase への上げ込み・更新署名・gw_device_releases への登録は、
#   いまは人がやる（docs/device-release.md）。
#   このファイルの最後に、続きを足す場所を用意してある。

name: EIGHT Agent を組み立てる

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版（例 0.3.0）"
        required: true
        type: string
      ext_id:
        description: "拡張のID（32文字）。空なら Variables の AGENT_EXT_ID を使う"
        required: false
        type: string
      publish:
        description: "配れる状態にする（外すと組み立てるだけ。版は使われない）"
        required: false
        default: true
        type: boolean

# 読むだけ。ここから何かを書き換えることはない
permissions:
  contents: read

jobs:
  build:
    name: 組み立て
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取り出す
        uses: actions/checkout@v4

      # 版は、あとでファイル名・Storage のパス・DBの一意キーになる。
      # 変な字が混ざったまま先へ進めない
      # 入力は env ごしに渡す。run の中に ${{ }} を直接書くと、
      # 入れた文字がそのままシェルの一部になる（Actions の定番の穴）
      - name: 版の形を確かめる
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$IN_VERSION" \
             | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::版の形が違います（例 0.3.0 / 0.3.0-rc1）"
            exit 1
          fi
          echo "VERSION=$IN_VERSION" >> "$GITHUB_ENV"

      - name: Go を用意する
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # 拡張の秘密鍵は、作業場所の外に置く。
      # Artifacts に入れるフォルダへは絶対に置かない
      - name: 拡張の鍵を用意する
        id: extkey
        env:
          EXT_KEY: ${{ secrets.AGENT_EXT_KEY }}
        run: |
          set -eu
          if [ -z "${EXT_KEY:-}" ]; then
            echo "have=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path="$RUNNER_TEMP/eight-ext.pem"
          umask 077
          printf '%s\n' "$EXT_KEY" > "$path"
          # 中身は出さない。形だけ見る
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$path"; then
            echo "::error::AGENT_EXT_KEY が秘密鍵の形になっていません"
            echo "::error::-----BEGIN PRIVATE KEY----- の行から、END の行まで丸ごと貼ってください"
            exit 1
          fi
          echo "have=$path" >> "$GITHUB_OUTPUT"

      # build.sh の中で、単体テストと GOOS=windows go vet も走る。
      # 落ちるものを配らない。
      #
      # 鍵を渡すと、拡張の ID は鍵から決まる（人が打ち直さない）。
      # AGENT_EXT_ID も入っていれば、食い違ったところで止まる
      - name: 組み立てる
        working-directory: agent
        env:
          VERSION: ${{ env.VERSION }}
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          # 拡張のID。入れずに組むと、ブラウザ連携だけ設定されない
          EXT_ID: ${{ inputs.ext_id || vars.AGENT_EXT_ID }}
          EXT_KEY: ${{ steps.extkey.outputs.have }}
          # 更新を確かめる公開鍵。空だと、エージェントは自動更新をしない
          UPDATE_KEY: ${{ vars.AGENT_UPDATE_KEY }}
        run: |
          set -eu
          chmod +x build.sh
          ./build.sh

      # 足りないまま配ると、入れたあとに気づくことになる。
      # 組んだ直後に、画面と要約の両方へ出す
      - name: 足りないものを知らせる
        if: always()
        env:
          EXT_ID: ${{ inputs.ext_id || vars.AGENT_EXT_ID }}
          EXT_KEY: ${{ steps.extkey.outputs.have }}
          UPDATE_KEY: ${{ vars.AGENT_UPDATE_KEY }}
        run: |
          set -eu
          if [ -z "${EXT_ID:-}" ] && [ -z "${EXT_KEY:-}" ]; then
            echo "::warning::拡張のIDも鍵も無いまま組みました。ブラウザ連携（WEB利用）は設定されません"
            echo "::warning::「EIGHT ブラウザ拡張を初期化」を先に1回まわしてください"
          fi
          if [ -z "${EXT_KEY:-}" ]; then
            echo "::warning::拡張の秘密鍵が無いので .crx を作れません（配るには要ります）"
          fi
          if [ -z "${UPDATE_KEY:-}" ]; then
            echo "::warning::更新用の公開鍵が空のまま組みました。エージェントは自動更新をしません"
          fi

      - name: 中身を確かめて、登録に要る値を出す
        id: facts
        working-directory: agent
        run: |
          set -eu
          exe=dist/EIGHT-Agent-Setup.exe
          test -f "$exe" || { echo "::error::$exe ができていません"; exit 1; }

          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          size=$(stat -c %s "$exe")

          # 20MB 前後になるはず。極端に小さいのは、組み立てが途中で終わった印
          if [ "$size" -lt 5000000 ]; then
            echo "::error::EXE が小さすぎます（$size バイト）。組み立てが途中で終わっています"
            exit 1
          fi

          echo "sha=$sha"   >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

          # 拡張まで作れたか。作れていれば、その ID を出しておく
          # （鍵から決まるので、Variables の書き間違いはここで露見する）
          crx=""
          crxid=""
          if [ -f dist/eight-ext.crx ]; then
            crx=$(stat -c %s dist/eight-ext.crx)
            crxid=$(sed -n "s/.*appid='\([^']*\)'.*/\1/p" dist/updates.xml)
          fi
          echo "crxid=$crxid" >> "$GITHUB_OUTPUT"

          {
            echo "## EIGHT-Agent-Setup.exe ができました"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 版 | \`${VERSION}\` |"
            echo "| 大きさ | ${size} バイト |"
            echo "| SHA-256 | \`${sha}\` |"
            if [ -n "$crxid" ]; then
              echo "| 拡張のID | \`${crxid}\`（鍵から決まったもの） |"
              echo "| 拡張の .crx | ${crx} バイト |"
            elif [ -n "${EXT_ID:-}" ]; then
              echo "| 拡張のID | \`${EXT_ID}\` |"
              echo "| 拡張の .crx | （秘密鍵が無いので作れません） |"
            else
              echo "| 拡張のID | （未設定。ブラウザ連携は入りません） |"
            fi
            if [ -n "${UPDATE_KEY:-}" ]; then
              echo "| 更新の公開鍵 | 設定済み |"
            else
              echo "| 更新の公開鍵 | （未設定。自動更新をしません） |"
            fi
            echo
            echo "### このあと"
            echo
            echo "1. 上の **Artifacts** から \`EIGHT-Agent-Setup-${VERSION}\` を落とす"
            echo "2. Supabase の Storage → \`agent\` バケットに"
            echo "   \`${VERSION}/EIGHT-Agent-Setup.exe\` として上げる"
            echo "3. 署名して \`gw_device_releases\` に登録する"
            echo "   （手順: \`docs/device-release.md\`）"
            if [ -n "$crxid" ]; then
              echo "4. \`eight-ext.crx\` と \`updates.xml\` を"
              echo "   \`${BASE_URL}/ext/\` に置く（ブラウザはここへ更新を見にきます）"
            fi
            echo
            echo "> 2 と 3 は、まだ人がやります。"
            echo "> 自動にするには Supabase の鍵と更新用の秘密鍵を Secrets に入れる必要があり、"
            echo "> そこは別で決めてから足します。"
            if [ -z "$crxid" ]; then
              echo
              echo "> **ブラウザ連携（WEB利用）は、まだ入りません。**"
              echo "> 「EIGHT ブラウザ拡張を初期化」を1回まわして、"
              echo "> \`AGENT_EXT_ID\` と \`AGENT_EXT_KEY\` を登録してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ env.VERSION }}
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          EXT_ID: ${{ inputs.ext_id || vars.AGENT_EXT_ID }}
          UPDATE_KEY: ${{ vars.AGENT_UPDATE_KEY }}

      # 落としたときに、どの版か分かる名前にしておく。
      # EXE 自体の名前は変えない（インストーラがファイル名から札を読むため、
      # 配るときにサーバ側で名前を付け替える）
      - name: 落とせるようにする
        uses: actions/upload-artifact@v4
        with:
          name: EIGHT-Agent-Setup-${{ env.VERSION }}
          path: |
            agent/dist/EIGHT-Agent-Setup.exe
            agent/dist/eight-ext.crx
            agent/dist/updates.xml
            agent/dist/extension/
          if-no-files-found: error
          # 置きっぱなしにしない。要るのは登録するまでのあいだだけ
          retention-days: 14

      # 中身の確かめに使う。EXE と一緒に置いておくと、
      # 落とした人がその場で照合できる
      - name: ハッシュも一緒に置く
        env:
          VERSION: ${{ env.VERSION }}
          SHA: ${{ steps.facts.outputs.sha }}
          SIZE: ${{ steps.facts.outputs.size }}
          CRXID: ${{ steps.facts.outputs.crxid }}
        run: |
          set -eu
          mkdir -p out
          printf '%s  EIGHT-Agent-Setup.exe\n' "$SHA" \
            > out/EIGHT-Agent-Setup.exe.sha256
          {
            echo "version=${VERSION}"
            echo "sha256=${SHA}"
            echo "size_bytes=${SIZE}"
            echo "object_path=${VERSION}/EIGHT-Agent-Setup.exe"
            echo "bucket=agent"
            echo "extension_id=${CRXID}"
          } > out/release.txt

      - name: ハッシュを落とせるようにする
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      # =======================================================================
      # ここから、配れる状態にするところ
      #
      # ■ service_role の鍵は置かない
      #
      #   Storage へ上げて表に入れるだけなら、service_role の鍵を
      #   Secrets に置けば済む。置かない。あの鍵は、持っていれば
      #   **全テーブルを読み書きできる**（給与も健康診断も契約書も）。
      #   「配布物を1つ置く」ためにそこまでの力を渡す理由がない。
      #
      #   代わりに、サーバ側に1つだけ口を開けてある
      #   （api/devices/release.js）。GitHub が持つのは、その口の
      #   合言葉だけ。できるのは「エージェントの版を1つ出す」に閉じる。
      # =======================================================================

      - name: 配る支度ができているか見る
        id: ready
        env:
          RELEASE_TOKEN: ${{ secrets.DEVICE_RELEASE_TOKEN }}
          UPDATE_KEY_PRIV: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY }}
          WANT: ${{ inputs.publish }}
        run: |
          set -eu
          if [ "$WANT" != "true" ]; then
            echo "::notice::「配れる状態にする」が外れているので、組み立てまでで止めます"
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          miss=""
          [ -z "${RELEASE_TOKEN:-}" ]  && miss="$miss DEVICE_RELEASE_TOKEN"
          [ -z "${UPDATE_KEY_PRIV:-}" ] && miss="$miss AGENT_UPDATE_PRIVATE_KEY"
          if [ -n "$miss" ]; then
            echo "::warning::Secrets が足りないので、組み立てまでで止めます:$miss"
            echo "::warning::AGENT_UPDATE_PRIVATE_KEY は「EIGHT Agent 更新鍵を初期化」で作れます"
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=1" >> "$GITHUB_OUTPUT"

      # 同じ版が Storage か表にあれば、ここで 409 が返って止まる。
      # 配った版を黙って差し替えると、入れたPCとこれから入れるPCで
      # 中身が違うことになる。しかも署名は通るので気づけない
      - name: Storage に置く場所をもらう
        if: steps.ready.outputs.go == '1'
        env:
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          TOKEN: ${{ secrets.DEVICE_RELEASE_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          code=$(curl -sS -o "$RUNNER_TEMP/begin.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/devices/release" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"action\":\"begin\",\"version\":\"$VERSION\"}")
          if [ "$code" = "409" ]; then
            echo "::error::版 $VERSION は既にあります。上書きはしません。版を上げてください"
            cat "$RUNNER_TEMP/begin.json"; exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::置き場所をもらえませんでした（HTTP $code）"
            cat "$RUNNER_TEMP/begin.json"; exit 1
          fi
          # 返ってきた URL には上げるための札が入っている。画面に出さない
          echo "もらいました: agent/$VERSION/EIGHT-Agent-Setup.exe"

      - name: Storage へ上げる
        if: steps.ready.outputs.go == '1'
        run: |
          set -eu
          url=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/begin.json"))["uploadUrl"])')
          code=$(curl -sS -o "$RUNNER_TEMP/up.txt" -w '%{http_code}' \
            -X PUT "$url" \
            -H 'Content-Type: application/octet-stream' \
            -H 'x-upsert: false' \
            --data-binary @agent/dist/EIGHT-Agent-Setup.exe)
          if [ "$code" != "200" ]; then
            echo "::error::上げられませんでした（HTTP $code）"
            cat "$RUNNER_TEMP/up.txt"; exit 1
          fi

      # 上げ切れていないものを配ると、入れた先で黙って失敗する。
      # 読み直して、送ったものと同じか確かめてから先へ進む
      - name: 上げたものを読み直して確かめる
        if: steps.ready.outputs.go == '1'
        env:
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          TOKEN: ${{ secrets.DEVICE_RELEASE_TOKEN }}
          VERSION: ${{ env.VERSION }}
          SHA: ${{ steps.facts.outputs.sha }}
          SIZE: ${{ steps.facts.outputs.size }}
        run: |
          set -eu
          code=$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/devices/release" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"action\":\"verify\",\"version\":\"$VERSION\",\"size_bytes\":$SIZE}")
          if [ "$code" != "200" ]; then
            echo "::error::確かめられませんでした（HTTP $code）"
            cat "$RUNNER_TEMP/verify.json"; exit 1
          fi
          url=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/verify.json"))["url"])')
          curl -sS -o "$RUNNER_TEMP/back.exe" "$url"

          got=$(sha256sum "$RUNNER_TEMP/back.exe" | cut -d' ' -f1)
          gotsize=$(stat -c %s "$RUNNER_TEMP/back.exe")
          if [ "$got" != "$SHA" ] || [ "$gotsize" != "$SIZE" ]; then
            echo "::error::上げたものと中身が違います"
            echo "::error::送った $SHA ($SIZE) / 戻ってきた $got ($gotsize)"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/back.exe"
          echo "上げたものと同じでした（$got）"

      # 署名の対象は「置き場所」。落とすURLは毎回変わるので、
      # 変わらないほう（バケットの中のパス）に署名する
      - name: 更新の署名を作る
        if: steps.ready.outputs.go == '1'
        working-directory: agent
        env:
          UPDATE_KEY_PRIV: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "$UPDATE_KEY_PRIV" > "$RUNNER_TEMP/update.key"
          go run ./cmd/eight-agent-keygen \
            -key "$RUNNER_TEMP/update.key" \
            -version "$VERSION" \
            -locator "$VERSION/EIGHT-Agent-Setup.exe" \
            -file dist/EIGHT-Agent-Setup.exe \
            -json > "$RUNNER_TEMP/sig.json"
          rm -f "$RUNNER_TEMP/update.key"
          # keygen は、作った署名を自分で確かめてから出す。
          # ここまで来ていれば、署名と確かめの両方が通っている
          echo "署名しました（目印 $(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/sig.json"))["key_id"])')）"

      - name: 配れる状態にする
        id: publish
        if: steps.ready.outputs.go == '1'
        env:
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          TOKEN: ${{ secrets.DEVICE_RELEASE_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          python3 - <<'PY' > "$RUNNER_TEMP/publish.json"
          import json, os
          s = json.load(open(os.environ["RUNNER_TEMP"] + "/sig.json"))
          print(json.dumps({
              "action": "publish",
              "version": os.environ["VERSION"],
              "sha256": s["sha256"],
              "size_bytes": s["size_bytes"],
              "signature": s["signature"],
              "key_id": s["key_id"],
              "notes": "GitHub Actions",
          }))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/pub.json" -w '%{http_code}' \
            -X POST "$BASE_URL/api/devices/release" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/publish.json")
          if [ "$code" != "200" ]; then
            echo "::error::登録できませんでした（HTTP $code）"
            cat "$RUNNER_TEMP/pub.json"; exit 1
          fi
          cat "$RUNNER_TEMP/pub.json"
          echo "kid=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/sig.json"))["key_id"])')" >> "$GITHUB_OUTPUT"

      # ブラウザは、ログインしていない状態でここへ取りにくる。
      # 置き場所は非公開のまま、/ext/ だけを通す（api/ext.js）
      - name: ブラウザ拡張を置く
        id: extpub
        if: steps.ready.outputs.go == '1'
        env:
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          TOKEN: ${{ secrets.DEVICE_RELEASE_TOKEN }}
        run: |
          set -eu
          if [ ! -f agent/dist/eight-ext.crx ]; then
            echo "::warning::拡張の秘密鍵が無いので、.crx は置きません"
            echo "done=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for f in eight-ext.crx updates.xml; do
            code=$(curl -sS -o "$RUNNER_TEMP/ext.json" -w '%{http_code}' \
              -X POST "$BASE_URL/api/devices/release" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"action\":\"ext\",\"file\":\"$f\"}")
            if [ "$code" != "200" ]; then
              echo "::error::$f の置き場所をもらえませんでした（HTTP $code）"
              cat "$RUNNER_TEMP/ext.json"; exit 1
            fi
            url=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/ext.json"))["uploadUrl"])')
            ct=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/ext.json"))["contentType"])')
            code=$(curl -sS -o "$RUNNER_TEMP/extup.txt" -w '%{http_code}' \
              -X PUT "$url" -H "Content-Type: $ct" -H 'x-upsert: true' \
              --data-binary @"agent/dist/$f")
            if [ "$code" != "200" ]; then
              echo "::error::$f を上げられませんでした（HTTP $code）"
              cat "$RUNNER_TEMP/extup.txt"; exit 1
            fi
            echo "置きました: $f"
          done
          echo "done=1" >> "$GITHUB_OUTPUT"

      - name: できあがりを出す
        if: always() && steps.ready.outputs.go == '1'
        env:
          VERSION: ${{ env.VERSION }}
          BASE_URL: ${{ vars.AGENT_BASE_URL || 'https://mf.8grp.co.jp' }}
          CRXID: ${{ steps.facts.outputs.crxid }}
          KID: ${{ steps.publish.outputs.kid }}
          EXTDONE: ${{ steps.extpub.outputs.done }}
          SHA: ${{ steps.facts.outputs.sha }}
          SIZE: ${{ steps.facts.outputs.size }}
          RESULT: ${{ job.status }}
        run: |
          set -eu
          mark() { if [ -n "$2" ]; then echo "- ✅ $1"; else echo "- ⬜ $1（できていません）"; fi; }
          {
            if [ "$RESULT" = "success" ] && [ -n "${KID:-}" ]; then
              echo "## ✅ 版 ${VERSION} を配れる状態にしました"
            else
              echo "## ⚠ 版 ${VERSION} は、配れる状態になっていません"
            fi
            echo
            mark "EXE を作った" "$SHA"
            mark "Chrome / Edge 拡張を作った" "${CRXID:-}"
            mark "Storage へ上げた（agent/${VERSION}/EIGHT-Agent-Setup.exe）" "${KID:-}"
            mark "更新の署名を付けた（鍵の目印 ${KID:-—}）" "${KID:-}"
            mark "gw_device_releases に登録した（published）" "${KID:-}"
            mark "拡張を ${BASE_URL}/ext/ に置いた" "${EXTDONE:-}"
            echo
            if [ "$RESULT" = "success" ] && [ -n "${KID:-}" ]; then
              echo "### 社員PCへ配れます"
              echo
              echo "- 既に入っているPCは、次の見回り（6時間ごと）で自分で入れ替わります"
              echo "- 新しく入れるPCは、マイページ →「会社PCのセキュリティ設定」から落とせます"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| 版 | \`${VERSION}\` |"
              echo "| 大きさ | ${SIZE} バイト |"
              echo "| SHA-256 | \`${SHA}\` |"
              if [ -n "${CRXID:-}" ]; then echo "| 拡張のID | \`${CRXID}\` |"; fi
              echo "| 署名の鍵 | \`${KID}\` |"
              echo
              echo "> **手でやることはもうありません。**"
              echo "> Storage への上げ込みも、署名も、表への登録も済んでいます。"
            else
              echo "上のどこで止まったかは、左の手順の一覧で赤くなっているところを見てください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
