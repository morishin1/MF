name: 営業提案の選択と一覧
on:
  pull_request:
    paths:
      - "**/*sales-outcome*"
      - "**/*salesoutcomereview*"
      - "**/*sales-proposal-flow*"
      - "db/192_sales_outcome_reviews.sql"
      - "sales/outcome-review.html"
      - "api/sales/proposals/outcome-review.js"
      - "sales/proposals.html"
      - "css/sales-proposals-simple.css"
      - "api/sales/proposals/entity.js"
      - "test/sales-proposal-entity.mjs"
      - "**/*sales-proposal-readiness*"
      - "**/*sales-proposal-interview-ai*"
      - "**/*sales-proposal-company-analysis*"
      - "api/sales/proposals/company-analysis.js"
      - "test/ui/salescompanyanalysisui.mjs"
      - "api/sales/proposals/readiness.js"
      - "db/189_sales_proposal_readiness.sql"
      - "lib/sales-proposals.js"
      - "lib/sales-proposal-period.js"
      - "api/sales/proposals/index.js"
      - "test/sales-proposal-period-stalled.mjs"
      - "lib/sales-proposal-hot.js"
      - "api/sales/proposals/hot.js"
      - "db/150_sales_proposal_hot_marks.sql"
      - "db/185_sales_proposal_integration.sql"
      - "db/repair_sales_enger_proposal_metadata.sql"
      - "scripts/test-sales-proposal-integration-sql.mjs"
      - "scripts/test-sales-hot-sql.mjs"
      - "test/saleshot*.mjs"
      - "test/ui/saleshotui.mjs"
      - "test/sales-proposals-team-bulk.mjs"
      - "test/ui/salesownerfiltersui.mjs"
      - "test/ui/salesproposalsui.mjs"
      - ".github/workflows/sales-proposals-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node --experimental-test-module-mocks --test test/sales-proposal-entity.mjs
      - run: node --test test/sales-proposal-period-stalled.mjs
      - run: node --experimental-test-module-mocks test/sales-proposals-team-bulk.mjs
      - run: node --experimental-test-module-mocks test/saleshotmarks.mjs
      - run: node test/saleshotui.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.5.13
      - run: node --test test/sales-outcome-review.mjs
      - run: node scripts/test-sales-outcome-review-sql.mjs
      - run: node scripts/test-sales-hot-sql.mjs
      - run: node scripts/test-sales-proposal-integration-sql.mjs
      - run: node --experimental-test-module-mocks --test test/sales-proposal-readiness*.mjs
      - run: node --test scripts/test-sales-proposal-readiness-sql.mjs
      - run: node --experimental-test-module-mocks test/salesproposalsapi.mjs
      - run: node --experimental-test-module-mocks --test test/sales-proposal-company-analysis*.mjs
      - run: npx playwright install --with-deps chromium
      - name: Synthetic fixture server
        run: |
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/sales-web.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/sales/proposals.html && break
            sleep 0.5
          done
      - run: node --experimental-test-module-mocks test/ui/salesownerfiltersui.mjs
      - run: node --experimental-test-module-mocks test/ui/salesproposalsui.mjs
      - run: node test/ui/salesoutcomereviewui.mjs
      - run: node test/ui/salesdashboardreportui.mjs
      - run: node --experimental-test-module-mocks test/ui/saleshotui.mjs
      - run: node --experimental-test-module-mocks test/ui/salescompanyanalysisui.mjs
      - name: Keep company analysis fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-company-analysis-ui
          path: ${{ runner.temp }}/eight-shots/sales-company-analysis-*.png
          if-no-files-found: ignore
      - name: Keep hot marker UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-hot-ui
          path: ${{ runner.temp }}/eight-shots/sales-hot-*.png
          if-no-files-found: ignore

