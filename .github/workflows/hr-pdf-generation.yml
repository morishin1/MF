name: HR PDF generation and delivery checks
on:
  pull_request:
    paths:
      - 'api/hr/**'
      - 'lib/hr-*.js'
      - 'lib/pdf-jp.js'
      - 'hr/**'
      - 'js/hr-pdf-flow-ui.js'
      - 'test/hr*.mjs'
      - 'test/ui/hrpdfflowui.mjs'
      - '.github/workflows/hr-pdf-generation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PDF generation, existing offer flow and permission regressions
        run: |
          set -e
          for test in hroffernoticegenerate hroffernoticeui hrlegacyoffernotice hrpdfflowapi hrpdfflowui hrofferapi hrofferdocsapi hroffersendapi hrpayapi hrofferflowapi; do
            node --experimental-test-module-mocks "test/$test.mjs"
          done
      - run: npx --no-install playwright install --with-deps chromium
      - name: Static fixture server
        run: |
          python3 -m http.server 8713 --bind 127.0.0.1 >/tmp/hr-pdf-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8713/hr/pdf-flow.html && break
            sleep 1
          done
      - name: Desktop and mobile generation, reload, send confirmation
        run: node --experimental-test-module-mocks test/ui/hrpdfflowui.mjs
