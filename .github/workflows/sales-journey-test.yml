name: Sales journey focused browser regression
on:
  pull_request:
    paths:
      - 'sales/proposals.html'
      - 'js/sales-proposal-journey.js'
      - 'test/ui/salesproposaljourneyui.mjs'
      - '.github/workflows/sales-journey-test.yml'
permissions:
  contents: read
jobs:
  sales-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Component fixture only: no credentials, real APIs, or production writes.
      - run: node test/ui/salesproposaljourneyui.mjs
