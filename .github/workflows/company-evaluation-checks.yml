name: Company evaluation isolated checks
on:
  pull_request:
    paths:
      - "api/sales/company-evaluations/**"
      - "api/sales/company-evaluations.js"
      - "lib/company-evaluation-*.js"
      - "lib/company-review-*.js"
      - "js/company-evaluation*.js"
      - "js/company-review-queue.js"
      - "sales/index.html"
      - "db/153_sales_company_evaluations.sql"
      - "db/154_sales_company_review_tasks.sql"
      - "test/company-evaluation-*.mjs"
      - "test/company-review-*.mjs"
      - "test/sql/company-evaluation-integration.sql"
      - "test/ui/companyevaluationui.mjs"
      - ".github/workflows/company-evaluation-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: company_evaluation_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres -d company_evaluation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No Supabase URL, credential, business data or external DB connection.
      # The fixture aborts before DDL unless the database name is the CI-only name.
      - name: Run real migrations against disposable synthetic schema
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /work/test/sql
          docker cp db "$POSTGRES_CONTAINER":/work/db
          docker cp test/sql/company-evaluation-integration.sql "$POSTGRES_CONTAINER":/work/test/sql/company-evaluation-integration.sql
          docker exec "$POSTGRES_CONTAINER" psql -X -U postgres -d company_evaluation_ci -v ON_ERROR_STOP=1 -f /work/test/sql/company-evaluation-integration.sql
  isolated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Mock responses and synthetic companies only; all external routes aborted.
      - run: node test/ui/companyevaluationui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-evaluation-synthetic-screenshots
          path: ${{ runner.temp }}/eight-shots/company-evaluation-*.png
          if-no-files-found: ignore
          retention-days: 7
