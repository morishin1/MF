<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>Office - EIGHT OFFICE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261005apps1">
  <link rel="stylesheet" href="../css/layout.css?v=20261005apps1">
  <!-- Office の字は、採用HR・Sales と同じ（hr/index.html・js/sales-layout.js の body・アイコンの指定と同じ） -->
  <style>body { font-family:'Zen Kaku Gothic New', sans-serif; } .material-symbols-outlined { font-family:'Material Symbols Rounded'; }</style>
  <script>
    // 旧URLの互換：月次業務は /office/monthly.html へ移った。案件・月・絞り込みを付けた古いリンク（/office/?month=…&id=…）は、
    // そのまま月次業務へ送る（ブックマーク・通知・メールのリンクを壊さない）
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has("month") || q.has("id") || q.has("tag")) location.replace("/office/monthly.html" + location.search + location.hash);
    })();
  </script>
  <style>
    /* Office ホーム：いま、自分（の担当）が処理すべきものだけ。中身は権限で出し分け、画面は全員同じ。
       並べ方は採用HRのダッシュボード（hr/index.html）と同じ：見出し → 件数のカード → 今日やること（1件ずつのカード） → 月次進捗。
       見た目は共通（js/office-layout.js の .of-tile＝Sales の .db-sum a／.of-row＝採用HRの .hr-today-row）。ここは並べ方だけ */
    .oh-cards { margin:0 0 22px; }
    .oh-card .val.zero { color:var(--of-faint); }
    .oh-sec { margin:0 0 22px; }
    .oh-sec-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .oh-sec-row .of-sec-h { margin:0; }
    .oh-sec-row a { font-size:12px; color:var(--of-sub); text-decoration:none; white-space:nowrap; }
    .oh-sec-row a:hover { color:var(--of-ink); }
    .oh-row .now .oh-pri { font-weight:700; }
    .oh-row.p1 .now .oh-pri { color:#b3261e; }
    .oh-row.p2 .now .oh-pri { color:#7d5a00; }
    .oh-row .oh-n { font-variant-numeric:tabular-nums; }
    .oh-row .oh-n small { font-size:inherit; font-weight:inherit; }
    #progBox .of-panel { max-width:640px; }
  </style>
</head>
<body>

<div class="wrap" id="wrap">
  <h1 class="of-title">Office</h1>
  <p class="of-sub" id="sub">会社の管理業務をまとめて確認できます</p>

  <div id="banner"></div>

  <div class="of-tiles oh-cards" id="cards" aria-label="対応が要る件数"></div>

  <section class="oh-sec" aria-labelledby="todoH">
    <h2 class="of-sec-h" id="todoH">今日やること</h2>
    <div class="of-rows oh-todo" id="todo"><div class="of-empty">読み込み中…</div></div>
  </section>

  <section class="oh-sec" id="progBox" aria-labelledby="progH" hidden>
    <div class="oh-sec-row">
      <h2 class="of-sec-h" id="progH">月次進捗 <small id="progMonth"></small></h2>
      <a href="/office/monthly.html">月次業務を開く</a>
    </div>
    <div class="of-panel">
      <div class="of-prog" id="prog"></div>
      <p class="of-muted" id="closeNote" style="margin:10px 0 0;"></p>
    </div>
  </section>
</div>

<script src="../js/api-client.js?v=20261005apps1"></script>
<script src="../js/device.js?v=20261005apps1"></script>
<script src="../js/layout.js?v=20261005apps1"></script>
<script src="../js/office-layout.js?v=20261005apps1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const O = window.OfficeLayout;
  const esc = O.esc;

  // 表示速度：月末月初業務を使える人は、枠（権限の確認）を待たずに今月のデータを取りにいき始める。
  // 月次業務（monthly.html）と同じ鍵なので、ホームで取ったぶんは月次業務を開いたときにすぐ出る
  const OFFICE_KEY = "office:";
  const fetchOffice = () => API.api("/api/office");
  API.warm(OFFICE_KEY, fetchOffice, O.allows);
  // 人事・労務の数字（入退社）と件数（ヘッダー・タブのバッジと同じ鍵）も、枠を待たずに取りにいき始める。
  // 鍵は入退社の画面（admin-hr.html）・共通の枠と同じなので、行き来しても取り直さない
  const HR_KEY = "office:hr";
  KPLayout.warm("officeHr", HR_KEY, () => API.hrList());
  API.warm("badges", () => API.badges());

  // Office に入れる人の全員（人事・労務／経理・事務／月末月初業務のどれか）が開ける。中身は担当の分だけ
  O.init({ active: "home", access: ["officeHr", "officeFinance", "office", "officeApp"] }).then((ctx) => { if (ctx) load(ctx); });

  // 1つ取れなくても、ほかは出す（表が無い環境・権限が足りない場合に画面ごと落とさない）
  const safe = (p) => p.then((v) => ({ ok: true, v }), () => ({ ok: false }));
  const ym = (d) => d.toISOString().slice(0, 7);
  function prevMonth() {
    const d = new Date(Date.now() + 9 * 3600000);
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - 1);
    return ym(d);
  }
  const monthLabel = (m) => (m ? `${m.slice(0, 4)}年${Number(m.slice(5, 7))}月` : "");

  // 優先度：要確認 → 期限超過 → 今日期限 → 今週対応。
  // 状態は、採用HR・Sales の「今やること」と同じく左端の色で示す（期限超過＝赤 overdue・今日期限＝黄 hot・ほか＝通常）。色だけにせず文字も出す
  const PRI = [
    { label: "要確認",   tone: "" },
    { label: "期限超過", tone: "overdue" },
    { label: "今日期限", tone: "hot" },
    { label: "今週対応", tone: "" },
  ];

  async function load(ctx) {
    const me = ctx.me;
    // サーバの判定（/api/me の access）そのもの。担当でない API は呼ばない（403 の行を作らない）
    const can = {
      hr: KPLayout.hasAccess(me, "officeHr"),
      fin: KPLayout.hasAccess(me, "officeFinance"),
      app: O.allows(me),
    };
    // Office の利用権限（入口）だけで、担当の内部ロール（人事・労務／経理・事務／月末月初）が無い人。
    // 入れるが、中で使えるものはまだ無い。何をすればよいかを出す
    if (!can.hr && !can.fin && !can.app) {
      el("cards").innerHTML = "";
      el("todo").innerHTML = `<div class="of-panel" data-role="no-duty">
        <b>担当の業務が、まだ設定されていません。</b>
        <div class="of-muted" style="margin-top:6px;line-height:1.8;">Office へは入れますが、人事・労務、経理・事務、月末月初のどれも、まだ使えません。
        管理者に、メンバー管理の「詳細設定」で、内部の役割（人事・経理・責任者など）を付けてもらってください。</div></div>`;
      return;
    }
    const none = Promise.resolve(null);
    const closingMonth = prevMonth();
    let officeData = null;
    const [b, hr, cl, of] = await Promise.all([
      // 件数は、共通の枠（タブのバッジ）と同じ鍵で1本にまとめる（同じ API を2回呼ばない）
      safe(API.swr("badges", () => API.badges(), () => {}, { ttl: 600, fresh: 45, quiet: true })),
      can.hr ? safe(API.swr(HR_KEY, () => API.hrList(), () => {}, { quiet: true })) : none,
      can.fin && !can.app ? safe(API.swr(`office:closing:${closingMonth}`, () => API.closing(closingMonth), () => {}, { quiet: true })) : none,
      can.app ? safe(API.swr(OFFICE_KEY, fetchOffice, (d) => { officeData = d; })) : none,
    ]);
    if (of && of.ok) officeData = officeData || of.v;
    const badges = b.ok ? (b.v?.badges || {}) : {};

    // ---- 数字（担当でないものは null＝出さない。取れなかったものは undefined＝「—」） ----
    const od = officeData && !officeData.notReady && !officeData.accessNotReady ? officeData : null;
    const rows = od?.rows || [];
    const today = od?.today || null;
    const summary = od?.summary || null;
    const officeFail = can.app && !(of && of.ok);
    const onboarding = hr ? (hr.ok ? (hr.v?.onboarding || []).length : undefined) : null;
    const offboarding = hr ? (hr.ok ? (hr.v?.offboarding || []).length : undefined) : null;
    const left = can.app ? (summary ? summary.total - (summary.byStage?.done || 0) : (officeFail ? undefined : 0)) : null;
    const closing = cl ? (cl.ok ? cl.v : undefined) : null;
    const closingOpen = closing ? (closing.closing?.status !== "closed" ? 1 : 0) : closing;
    const expiring = can.app ? (od ? rows.filter((r) => O.expiring(r, today)) : (officeFail ? undefined : [])) : null;
    const billOpen = can.app ? (od ? rows.filter(O.billingOpen).length
      : (officeFail ? undefined : 0)) : null;

    // ---- サマリーカード（押すと、その一覧へ） ----
    const cards = [
      can.hr && { icon: "schedule", label: "勤怠要確認", v: b.ok ? (badges.timecard || 0) : undefined, href: "/admin-timecard.html" },
      can.fin && { icon: "receipt", label: "経費承認待ち", v: b.ok ? (badges.expenses || 0) : undefined, href: "/admin-expenses.html" },
      can.app ? { icon: "event_available", label: "月次残件", v: left, of: summary?.total, href: "/office/monthly.html" }
        : can.fin && { icon: "event_available", label: "月次残件", v: closingOpen, hint: `${closingMonth} の月次締め`, href: "/admin-closing.html" },
      can.hr && { icon: "how_to_reg", label: "入社準備", v: onboarding, href: "/admin-hr.html" },
      can.app && { icon: "event_busy", label: "契約期限", v: expiring == null ? expiring : expiring.length, href: "/office/monthly.html?tag=expiring" },
      can.app && { icon: "request_quote", label: "請求未完了", v: billOpen, href: "/office/billing.html" },
    ].filter(Boolean);
    el("cards").innerHTML = cards.map((c) => `
      <a class="of-tile oh-card" href="${esc(c.href)}"${c.hint ? ` title="${esc(c.hint)}"` : ""}>
        <span class="lb"><span class="material-symbols-outlined" aria-hidden="true">${esc(c.icon)}</span><span class="t">${esc(c.label)}</span></span>
        <span class="val v${c.v ? "" : " zero"}">${c.v === undefined ? "—" : c.v}${c.of != null && c.v !== undefined ? `<small>/ ${c.of}</small>` : ""}</span>
      </a>`).join("");

    // ---- 今日やること（担当の分だけ。優先度順） ----
    const todo = [];
    // cta … 右のボタン（採用HRの「今やること」と同じく、押せば、その仕事の画面が開く）
    const add = (pri, area, label, hint, count, href, cta) => { if (count > 0) todo.push({ pri, area, label, hint, count, href, cta }); };
    if (can.app && od) {
      const t = Object.fromEntries((summary?.today || []).map((x) => [x.key, x]));
      const m = od.month;
      const mq = (tag) => `/office/monthly.html?month=${encodeURIComponent(m)}&tag=${tag}`;
      add(0, "月次業務", "要確認の案件", "確認の印が付いた案件", t.check?.count || 0, mq("check"), "案件を確認");
      add(0, "月次業務", "稼働確認待ち", t.work?.note || "勤務表を確認して稼働を確定する", t.work?.count || 0, mq("work"), "稼働を確認");
      add(0, "月次業務", "契約条件の確認", "精算できない契約条件", t.terms?.count || 0, mq("terms"), "契約条件を確認");
      const overdue = summary?.overdue || 0;
      add(1, "月次業務", "勤務表の提出期限超過", od.deadline ? `期限 ${O.fmtDay(od.deadline)}` : "", overdue, mq("overdue"), "勤務表を確認");
      const sheetLeft = (t.timesheet?.count || 0) - overdue;
      add(od.deadline && od.deadline === today ? 2 : 3, "月次業務", "勤務表の回収", od.deadline ? `期限 ${O.fmtDay(od.deadline)}` : "", sheetLeft, mq("timesheet"), "勤務表を回収");
      add(3, "請求・支払", "売上請求の作成・送付", "", t.invoice?.count || 0, mq("invoice"), "請求書を作成");
      add(3, "請求・支払", "BP請求書の受領・確認", "", t.vendor?.count || 0, mq("vendor"), "請求書を確認");
      add(3, "請求・支払", "支払の登録・確認", "", t.payment?.count || 0, mq("payment"), "支払を登録");
      const exp = expiring || [];
      add(1, "契約", "契約期限切れ（更新未確認）", "契約期間が終わっていて、更新の確認がまだ", exp.filter((r) => r.periodTo < today).length, "/office/monthly.html?tag=expiring", "契約を確認");
      add(2, "契約", "契約期限（今日まで）", "今日で契約期間が終わり、更新の確認がまだ", exp.filter((r) => r.periodTo === today).length, "/office/monthly.html?tag=expiring", "契約を確認");
      add(3, "契約", "契約期限の確認", "30日以内に契約期間が終わり、更新の確認がまだ", exp.filter((r) => r.periodTo > today).length, "/office/monthly.html?tag=expiring", "契約を確認");
    }
    if (can.hr) {
      add(0, "人事・労務", "勤怠の修正申請", "打刻の修正申請", badges.timecard || 0, "/admin-timecard.html", "勤怠を確認");
      add(0, "人事・労務", "休暇・稟議の承認", "承認待ち", badges.requests || 0, "/admin-requests.html", "申請を承認");
      add(3, "人事・労務", "入社準備", "進行中の入社", onboarding || 0, "/admin-hr.html", "入社準備を開く");
      add(3, "人事・労務", "退社手続き", "進行中の退社", offboarding || 0, "/admin-hr.html", "退社手続きを開く");
      add(3, "人事・労務", "契約書の署名待ち", "署名がまだ返ってきていない契約書", badges.esign || 0, "/admin-esign.html", "署名状況を確認");
    }
    if (can.fin) {
      add(0, "経理・事務", "経費精算の承認", "承認待ちの経費精算", badges.expenses || 0, "/admin-expenses.html", "経費を承認");
      if (!can.app) add(3, "経理・事務", "月次締め", `${closingMonth} の月次締めがまだです`
        + (closing?.blockers?.length ? `（止めている理由 ${closing.blockers.length}件）` : ""), closingOpen || 0, "/admin-closing.html", "月次締めを開く");
    }
    todo.sort((a, b2) => a.pri - b2.pri || b2.count - a.count);
    // 採用HRの「今やること」（.hr-today-row）と同じ形：1件ずつ独立したカード。左端の色で状態、右に操作ボタン
    el("todo").innerHTML = todo.length ? `<div class="of-rows-count" id="todoN">${todo.length}件（要確認 → 期限超過 → 今日期限 → 今週対応の順）</div>`
      + todo.map((t) => `
      <div class="of-row oh-row p${t.pri}${PRI[t.pri].tone ? ` ${PRI[t.pri].tone}` : ""}">
        <div class="info">
          <b class="oh-label"><span class="t">${esc(t.label)}</span></b>
          <div class="now"><span class="oh-pri p${t.pri}"><span class="t">${PRI[t.pri].label}</span></span>・<span class="oh-area">${esc(t.area)}</span>${t.hint ? `・${esc(t.hint)}` : ""}</div>
          <div class="n">対象：<span class="oh-n">${t.count}<small>件</small></span></div>
        </div>
        <a class="btn btn-primary btn-sm oh-go" href="${esc(t.href)}">${esc(t.cta)}</a>
      </div>`).join("")
      : `<div class="of-empty">いま対応が必要なものはありません</div>`;

    // ---- 月次進捗（月末月初業務を使える人だけ） ----
    if (can.app && od) {
      el("progBox").hidden = false;
      el("progMonth").textContent = monthLabel(od.month);
      el("prog").innerHTML = O.progressHtml(O.progressOf(od));
      el("closeNote").textContent = od.phase4?.ready
        ? (od.close?.closed ? "月次完了：完了済み" : "月次完了：未完了") : "";
    }

    const failed = [b, hr, cl, of].some((x) => x && !x.ok);
    el("banner").innerHTML = failed
      ? `<div class="of-banner"><span class="material-symbols-outlined" aria-hidden="true">info</span><div>取得できなかった項目は「—」と出しています。</div></div>`
      : (od == null && can.app && officeData?.message ? `<div class="of-banner"><span class="material-symbols-outlined" aria-hidden="true">info</span><div>${esc(officeData.message)}</div></div>` : "");
  }
</script>

</body>
</html>
