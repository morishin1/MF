<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>Office - EIGHT OFFICE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261003ux1">
  <link rel="stylesheet" href="../css/layout.css?v=20261003ux1">
  <script>
    // 旧URLの互換：月次業務は /office/monthly.html へ移った。案件・月・絞り込みを付けた古いリンク（/office/?month=…&id=…）は、
    // そのまま月次業務へ送る（ブックマーク・通知・メールのリンクを壊さない）
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.has("month") || q.has("id") || q.has("tag")) location.replace("/office/monthly.html" + location.search + location.hash);
    })();
  </script>
  <style>
    /* Office ホーム：いま、自分（の担当）が処理すべきものだけ。中身は権限で出し分け、画面は全員同じ */
    .oh-cards { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:0 0 18px; }
    .oh-card { display:block; background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:12px 14px;
               text-decoration:none; color:inherit; transition:box-shadow .15s; }
    .oh-card:hover { box-shadow:0 3px 12px rgba(27,36,64,.12); }
    .oh-card .lb { font-size:12px; color:#6b7080; font-weight:700; display:flex; align-items:center; gap:5px; }
    .oh-card .lb .material-symbols-outlined { font-size:16px; }
    .oh-card .v { display:block; font-size:26px; font-weight:900; color:#1b2440; margin-top:2px; font-variant-numeric:tabular-nums; }
    .oh-card .v small { font-size:13px; font-weight:700; color:#6b7080; margin-left:2px; }
    .oh-card.hot { border-color:#e0a100; background:#fffaf0; }
    .oh-card.hot .lb::after { content:"対応あり"; margin-left:auto; font-size:10.5px; color:#7d5a00; background:#fdf0b8; border-radius:4px; padding:1px 6px; }

    .oh-two { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:14px; }
    .oh-panel { background:#fff; border:1px solid #e2e2dc; border-radius:10px; padding:14px 16px; }
    .oh-panel h2 { font-size:15px; font-weight:700; color:#1b2440; margin:0 0 10px; display:flex; align-items:baseline; gap:10px; }
    .oh-panel h2 small { font-size:12px; font-weight:500; color:#6b7080; }
    .oh-panel h2 a { margin-left:auto; font-size:12px; font-weight:700; }

    .oh-todo { display:flex; flex-direction:column; }
    .oh-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #efefeb; text-decoration:none; color:#1b2440; }
    .oh-row:last-child { border-bottom:none; }
    .oh-row:hover .oh-label { text-decoration:underline; }
    .oh-pri { display:inline-flex; align-items:center; gap:3px; flex:none; width:84px; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
    .oh-pri .material-symbols-outlined { font-size:14px; }
    .oh-pri.p0 { background:#fdf0b8; color:#6b4e00; }   /* 要確認 */
    .oh-pri.p1 { background:#fde4e2; color:#b3261e; }   /* 期限超過 */
    .oh-pri.p2 { background:#ffe9d1; color:#a34a00; }   /* 今日期限 */
    .oh-pri.p3 { background:#e3e8f6; color:#1b2440; }   /* 今週対応 */
    .oh-main { flex:1; min-width:0; }
    .oh-label { font-size:13.5px; font-weight:700; }
    .oh-hint { font-size:11.5px; color:#6b7080; margin-top:1px; }
    .oh-area { font-size:10.5px; color:#6b7080; border:1px solid #e2e2dc; border-radius:4px; padding:0 5px; margin-left:6px; font-weight:500; vertical-align:1px; }
    .oh-n { font-size:18px; font-weight:900; font-variant-numeric:tabular-nums; min-width:30px; text-align:right; }
    .oh-row .go { color:#9aa0b4; font-size:18px; }

    @media (max-width: 1180px) { .oh-cards { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width: 900px) { .oh-two { grid-template-columns:1fr; } }
    @media (max-width: 560px) { .oh-cards { grid-template-columns:repeat(2,minmax(0,1fr)); } .oh-pri { width:auto; } }
  </style>
</head>
<body>

<div class="wrap" id="wrap">
  <h1 class="of-title">Office</h1>
  <p class="of-sub" id="sub">会社の管理業務をまとめて確認できます</p>

  <div id="banner"></div>

  <div class="oh-cards" id="cards" aria-label="対応が要る件数"></div>

  <div class="oh-two">
    <section class="oh-panel" aria-labelledby="todoH">
      <h2 id="todoH">今日やること <small>要確認 → 期限超過 → 今日期限 → 今週対応 の順</small></h2>
      <div class="oh-todo" id="todo"><div class="of-empty">読み込み中…</div></div>
    </section>
    <section class="oh-panel" id="progBox" aria-labelledby="progH" hidden>
      <h2 id="progH">月次進捗 <small id="progMonth"></small><a href="/office/monthly.html">月次業務を開く</a></h2>
      <div class="of-prog" id="prog"></div>
      <p class="of-muted" id="closeNote" style="margin:10px 0 0;"></p>
    </section>
  </div>
</div>

<script src="../js/api-client.js?v=20261003ux1"></script>
<script src="../js/device.js?v=20261003ux1"></script>
<script src="../js/layout.js?v=20261003ux1"></script>
<script src="../js/office-layout.js?v=20261003ux1"></script>
<script>
  const el = (id) => document.getElementById(id);
  const O = window.OfficeLayout;
  const esc = O.esc;

  // 表示速度：月末月初業務を使える人は、枠（権限の確認）を待たずに今月のデータを取りにいき始める。
  // 月次業務（monthly.html）と同じ鍵なので、ホームで取ったぶんは月次業務を開いたときにすぐ出る
  const OFFICE_KEY = "office:";
  const fetchOffice = () => API.api("/api/office");
  API.warm(OFFICE_KEY, fetchOffice, O.allows);

  // Office に入れる人の全員（人事・労務／経理・事務／月末月初業務のどれか）が開ける。中身は担当の分だけ
  O.init({ active: "home", access: ["officeHr", "officeFinance", "office"] }).then((ctx) => { if (ctx) load(ctx); });

  // 1つ取れなくても、ほかは出す（表が無い環境・権限が足りない場合に画面ごと落とさない）
  const safe = (p) => p.then((v) => ({ ok: true, v }), () => ({ ok: false }));
  const ym = (d) => d.toISOString().slice(0, 7);
  function prevMonth() {
    const d = new Date(Date.now() + 9 * 3600000);
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - 1);
    return ym(d);
  }
  const monthLabel = (m) => (m ? `${m.slice(0, 4)}年${Number(m.slice(5, 7))}月` : "");

  // 優先度：要確認 → 期限超過 → 今日期限 → 今週対応。色だけで分けず、文字とアイコンも付ける
  const PRI = [
    { label: "要確認",   icon: "flag" },
    { label: "期限超過", icon: "warning" },
    { label: "今日期限", icon: "today" },
    { label: "今週対応", icon: "date_range" },
  ];

  async function load(ctx) {
    const me = ctx.me;
    // サーバの判定（/api/me の access）そのもの。担当でない API は呼ばない（403 の行を作らない）
    const can = {
      hr: KPLayout.hasAccess(me, "officeHr"),
      fin: KPLayout.hasAccess(me, "officeFinance"),
      app: O.allows(me),
    };
    const none = Promise.resolve(null);
    const closingMonth = prevMonth();
    let officeData = null;
    const [b, hr, cl, of] = await Promise.all([
      safe(API.badges()),
      can.hr ? safe(API.hrList()) : none,
      can.fin && !can.app ? safe(API.closing(closingMonth)) : none,
      can.app ? safe(API.swr(OFFICE_KEY, fetchOffice, (d) => { officeData = d; })) : none,
    ]);
    if (of && of.ok) officeData = officeData || of.v;
    const badges = b.ok ? (b.v?.badges || {}) : {};

    // ---- 数字（担当でないものは null＝出さない。取れなかったものは undefined＝「—」） ----
    const od = officeData && !officeData.notReady && !officeData.accessNotReady ? officeData : null;
    const rows = od?.rows || [];
    const today = od?.today || null;
    const summary = od?.summary || null;
    const officeFail = can.app && !(of && of.ok);
    const onboarding = hr ? (hr.ok ? (hr.v?.onboarding || []).length : undefined) : null;
    const offboarding = hr ? (hr.ok ? (hr.v?.offboarding || []).length : undefined) : null;
    const left = can.app ? (summary ? summary.total - (summary.byStage?.done || 0) : (officeFail ? undefined : 0)) : null;
    const closing = cl ? (cl.ok ? cl.v : undefined) : null;
    const closingOpen = closing ? (closing.closing?.status !== "closed" ? 1 : 0) : closing;
    const expiring = can.app ? (od ? rows.filter((r) => O.expiring(r, today)) : (officeFail ? undefined : [])) : null;
    const billOpen = can.app ? (od ? rows.filter(O.billingOpen).length
      : (officeFail ? undefined : 0)) : null;

    // ---- サマリーカード（押すと、その一覧へ） ----
    const cards = [
      can.hr && { icon: "schedule", label: "勤怠要確認", v: b.ok ? (badges.timecard || 0) : undefined, href: "/admin-timecard.html" },
      can.fin && { icon: "receipt", label: "経費承認待ち", v: b.ok ? (badges.expenses || 0) : undefined, href: "/admin-expenses.html" },
      can.app ? { icon: "event_available", label: "月次残件", v: left, of: summary?.total, href: "/office/monthly.html" }
        : can.fin && { icon: "event_available", label: "月次残件", v: closingOpen, hint: `${closingMonth} の月次締め`, href: "/admin-closing.html" },
      can.hr && { icon: "how_to_reg", label: "入社準備", v: onboarding, href: "/admin-hr.html" },
      can.app && { icon: "event_busy", label: "契約期限", v: expiring == null ? expiring : expiring.length, href: "/office/monthly.html?tag=expiring" },
      can.app && { icon: "request_quote", label: "請求未完了", v: billOpen, href: "/office/billing.html" },
    ].filter(Boolean);
    el("cards").innerHTML = cards.map((c) => `
      <a class="oh-card${c.v ? " hot" : ""}" href="${esc(c.href)}"${c.hint ? ` title="${esc(c.hint)}"` : ""}>
        <span class="lb"><span class="material-symbols-outlined" aria-hidden="true">${c.icon}</span>${esc(c.label)}</span>
        <span class="v">${c.v === undefined ? "—" : c.v}${c.of != null && c.v !== undefined ? `<small>/ ${c.of}</small>` : ""}</span>
      </a>`).join("");

    // ---- 今日やること（担当の分だけ。優先度順） ----
    const todo = [];
    const add = (pri, area, label, hint, count, href) => { if (count > 0) todo.push({ pri, area, label, hint, count, href }); };
    if (can.app && od) {
      const t = Object.fromEntries((summary?.today || []).map((x) => [x.key, x]));
      const m = od.month;
      const mq = (tag) => `/office/monthly.html?month=${encodeURIComponent(m)}&tag=${tag}`;
      add(0, "月次業務", "要確認の案件", "確認の印が付いた案件", t.check?.count || 0, mq("check"));
      add(0, "月次業務", "稼働確認待ち", t.work?.note || "勤務表を確認して稼働を確定する", t.work?.count || 0, mq("work"));
      add(0, "月次業務", "契約条件の確認", "精算できない契約条件", t.terms?.count || 0, mq("terms"));
      const overdue = summary?.overdue || 0;
      add(1, "月次業務", "勤務表の提出期限超過", od.deadline ? `期限 ${O.fmtDay(od.deadline)}` : "", overdue, mq("overdue"));
      const sheetLeft = (t.timesheet?.count || 0) - overdue;
      add(od.deadline && od.deadline === today ? 2 : 3, "月次業務", "勤務表の回収", od.deadline ? `期限 ${O.fmtDay(od.deadline)}` : "", sheetLeft, mq("timesheet"));
      add(3, "請求・支払", "売上請求の作成・送付", "", t.invoice?.count || 0, mq("invoice"));
      add(3, "請求・支払", "BP請求書の受領・確認", "", t.vendor?.count || 0, mq("vendor"));
      add(3, "請求・支払", "支払の登録・確認", "", t.payment?.count || 0, mq("payment"));
      const exp = expiring || [];
      add(1, "契約", "契約期限切れ（更新未確認）", "契約期間が終わっていて、更新の確認がまだ", exp.filter((r) => r.periodTo < today).length, "/office/monthly.html?tag=expiring");
      add(3, "契約", "契約期限の確認", "30日以内に契約期間が終わり、更新の確認がまだ", exp.filter((r) => r.periodTo >= today).length, "/office/monthly.html?tag=expiring");
    }
    if (can.hr) {
      add(0, "人事・労務", "勤怠の修正申請", "打刻の修正申請", badges.timecard || 0, "/admin-timecard.html");
      add(0, "人事・労務", "休暇・稟議の承認", "承認待ち", badges.requests || 0, "/admin-requests.html");
      add(3, "人事・労務", "入社準備", "進行中の入社", onboarding || 0, "/admin-hr.html");
      add(3, "人事・労務", "退社手続き", "進行中の退社", offboarding || 0, "/admin-hr.html");
      add(3, "人事・労務", "契約書の署名待ち", "署名がまだ返ってきていない契約書", badges.esign || 0, "/admin-esign.html");
    }
    if (can.fin) {
      add(0, "経理・事務", "経費精算の承認", "承認待ちの経費精算", badges.expenses || 0, "/admin-expenses.html");
      if (!can.app) add(3, "経理・事務", "月次締め", `${closingMonth} の月次締めがまだです`
        + (closing?.blockers?.length ? `（止めている理由 ${closing.blockers.length}件）` : ""), closingOpen || 0, "/admin-closing.html");
    }
    todo.sort((a, b2) => a.pri - b2.pri || b2.count - a.count);
    el("todo").innerHTML = todo.length ? todo.map((t) => `
      <a class="oh-row" href="${esc(t.href)}">
        <span class="oh-pri p${t.pri}"><span class="material-symbols-outlined" aria-hidden="true">${PRI[t.pri].icon}</span>${PRI[t.pri].label}</span>
        <span class="oh-main"><span class="oh-label">${esc(t.label)}<span class="oh-area">${esc(t.area)}</span></span>${t.hint ? `<div class="oh-hint">${esc(t.hint)}</div>` : ""}</span>
        <span class="oh-n">${t.count}<small style="font-size:11px;font-weight:700;color:#6b7080;">件</small></span>
        <span class="material-symbols-outlined go" aria-hidden="true">chevron_right</span>
      </a>`).join("")
      : `<div class="of-empty">いま対応が必要なものはありません</div>`;

    // ---- 月次進捗（月末月初業務を使える人だけ） ----
    if (can.app && od) {
      el("progBox").hidden = false;
      el("progMonth").textContent = monthLabel(od.month);
      el("prog").innerHTML = O.progressHtml(O.progressOf(od));
      el("closeNote").textContent = od.phase4?.ready
        ? (od.close?.closed ? "月次完了：完了済み" : "月次完了：未完了") : "";
    }

    const failed = [b, hr, cl, of].some((x) => x && !x.ok);
    el("banner").innerHTML = failed
      ? `<div class="of-banner"><span class="material-symbols-outlined" aria-hidden="true">info</span><div>取得できなかった項目は「—」と出しています。</div></div>`
      : (od == null && can.app && officeData?.message ? `<div class="of-banner"><span class="material-symbols-outlined" aria-hidden="true">info</span><div>${esc(officeData.message)}</div></div>` : "");
  }
</script>

</body>
</html>
