<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910j">
  <link rel="stylesheet" href="css/layout.css?v=20260910j">
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 id="greet" class="kp-greet">読み込み中…</h1>
  <p id="greet-sub" class="kp-greet-sub"></p>

  <div id="tiles" class="kp-tiles"></div>

  <div id="hr-card" class="card hidden">
    <h2><span class="material-symbols-outlined">badge</span><span id="hr-title">入社手続き</span></h2>
    <p class="muted" style="font-size:13px;margin:0 0 6px;" id="hr-sub"></p>
    <div class="kp-progress"><span id="hr-bar" style="width:0%"></span></div>
    <div id="hr-items" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">campaign</span>お知らせ<span id="unread-badge"></span>
      <a class="btn btn-secondary btn-sm" href="notices.html" style="margin-left:auto;">すべて見る</a></h2>
    <div id="notices"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">receipt_long</span>会計書類
      <span class="kp-chip" style="margin-left:6px;">別システム</span></h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px;">
      請求書・領収書の提出はこちらです。AIが種別を判定して月ごとに整理し、自動で仕訳します。
      社内の連絡や手続きとは別の仕組みで動いています。
    </p>
    <a class="btn btn-primary" href="app.html">
      <span class="material-symbols-outlined icon-inline">upload_file</span>会計書類を提出する
    </a>
    <a class="btn btn-secondary" href="menu.html" style="margin-left:8px;">
      <span class="material-symbols-outlined icon-inline">apps</span>ほかのメニュー
    </a>
  </div>

</div>

<script src="js/api-client.js?v=20260910j"></script>
<script src="js/layout.js?v=20260910j"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const thisMonth = () => new Date().toISOString().slice(0, 7);

  KPLayout.init({ active: "home", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    const name = ctx.me?.gw?.employee?.display_name;
    el("greet").textContent = name ? `${name} さん、おつかれさまです` : "おつかれさまです";
    el("greet-sub").textContent = new Date().toLocaleDateString("ja-JP", {
      year: "numeric", month: "long", day: "numeric", weekday: "long",
    });

    // 社員名簿にまだ登録されていない場合は、その旨を出す（管理者の作業待ち）
    if (ctx.me?.gw?.available && !ctx.me?.gw?.employee) {
      el("greet-sub").insertAdjacentHTML("afterend",
        `<div class="banner warn" style="margin-bottom:18px;">
           <span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていません。管理者に登録を依頼してください（書類のアップロードは今でも使えます）。</div>
         </div>`);
    }

    renderTiles(await loadStats());
    loadNotices();
    loadProcedure();
  }

  // --- 入社・退職手続き（自分の分だけ） -------------------------------------
  let myProcedure = null;

  async function loadProcedure() {
    try {
      const res = await API.listProcedures();
      // 自分が対象の、まだ終わっていない手続き
      myProcedure = (res.procedures || []).find(
        (p) => p.employee?.id === res.me?.id && p.status !== "done" && p.status !== "cancelled"
      ) || null;
      renderProcedure();
    } catch (e) {
      // 未適用の環境やアクセス権が無い場合は、カードごと出さない
      el("hr-card").classList.add("hidden");
    }
  }

  function renderProcedure() {
    if (!myProcedure) { el("hr-card").classList.add("hidden"); return; }

    // 本人が出すものだけを見せる。会社側・社労士側の作業は本人の画面には出さない
    const mine = (myProcedure.items || []).filter((i) => i.owner === "employee");
    if (!mine.length) { el("hr-card").classList.add("hidden"); return; }

    const done = mine.filter((i) => i.status === "done" || i.status === "na").length;
    const submitted = mine.filter((i) => i.status === "submitted").length;
    const pct = Math.round(((done + submitted) / mine.length) * 100);

    el("hr-title").textContent = myProcedure.kind === "onboarding" ? "入社手続き" : "退職手続き";
    el("hr-sub").textContent = myProcedure.target_on
      ? `${new Date(myProcedure.target_on).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })}　提出 ${done + submitted} / ${mine.length} 件`
      : `提出 ${done + submitted} / ${mine.length} 件`;
    el("hr-bar").style.width = `${pct}%`;

    el("hr-items").innerHTML = mine.map((i) => {
      const finished = i.status === "done" || i.status === "na";
      const label = finished ? "確認済み" : (i.status === "submitted" ? "提出済み" : "");
      const files = (i.files || []).map((f) =>
        `<small><a href="#" onclick="openFile('${esc(f.id)}');return false;">${esc(f.filename)}</a></small>`).join("");
      return `
        <div class="kp-todo${finished ? " done" : ""}">
          <span class="material-symbols-outlined" style="font-size:20px;color:${finished || i.status === "submitted" ? "var(--primary)" : "#c3cad3"};">
            ${finished || i.status === "submitted" ? "check_circle" : "radio_button_unchecked"}</span>
          <span class="t">${esc(i.title)}
            ${i.due_on ? `<small>期限 ${esc(new Date(i.due_on).toLocaleDateString("ja-JP"))}</small>` : ""}
            ${label ? `<small>${label}</small>` : ""}
            ${files}
          </span>
          ${finished ? "" : `
            <label class="btn btn-primary btn-sm" style="cursor:pointer;">
              <span class="material-symbols-outlined icon-inline">upload_file</span>ファイルを出す
              <input type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp"
                     onchange="pickFile('${esc(i.id)}', this)">
            </label>
            ${i.status === "submitted"
              ? `<button class="btn btn-secondary btn-sm" onclick="submitItem('${esc(i.id)}', true, this)">取り消す</button>`
              : `<button class="btn btn-secondary btn-sm" onclick="submitItem('${esc(i.id)}', false, this)">提出済みにする</button>`}`}
        </div>`;
    }).join("");

    el("hr-card").classList.remove("hidden");
  }

  // ファイルを選んだらそのまま提出まで進める。
  // 会計の書類アップロードとは別の保存先に入るので、仕訳は作られない。
  async function pickFile(itemId, input) {
    const file = input.files?.[0];
    input.value = "";
    if (!file) return;
    const card = document.getElementById("hr-items");
    const before = card.innerHTML;
    card.insertAdjacentHTML("afterbegin", `<div class="empty" id="hr-uploading">送信中…</div>`);
    try {
      await API.uploadProcedureFile(itemId, file);
      await loadProcedure();
    } catch (e) {
      card.innerHTML = before;
      alert(e.hint || e.detail || e.message || "送信できませんでした");
    }
  }

  async function openFile(fileId) {
    try {
      const { url } = await API.procedureFileUrl(fileId);
      window.open(url, "_blank", "noopener");
    } catch (e) {
      alert(e.detail || e.message || "開けませんでした");
    }
  }

  async function submitItem(itemId, undo, btn) {
    try {
      await KPLayout.busy(btn, "更新中…", () => API.submitProcedureItem(itemId, { undo }));
      await loadProcedure();
    } catch (e) {
      alert(e.detail || e.message || "更新できませんでした");
    }
  }

  // --- お知らせ -------------------------------------------------------------
  const CATEGORY_LABEL = { general: "お知らせ", important: "重要", event: "イベント", system: "システム" };
  let notices = [];

  async function loadNotices() {
    try {
      const res = await API.listNotices();
      notices = res.notices || [];
      el("unread-badge").innerHTML = res.unread
        ? `<span class="kp-chip important" style="margin-left:8px;">未読 ${res.unread}</span>` : "";
      renderNotices();
    } catch (e) {
      el("notices").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">info</span>
           <div>お知らせを取得できませんでした：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function renderNotices() {
    if (!notices.length) {
      el("notices").innerHTML = `<div class="empty">現在お知らせはありません。</div>`;
      return;
    }
    el("notices").innerHTML = notices.map((n) => {
      const date = new Date(n.publish_at).toLocaleDateString("ja-JP", { month: "long", day: "numeric" });
      return `
        <div class="kp-notice${n.read ? "" : " unread"}" id="n-${esc(n.id)}">
          <div class="head">
            <span class="kp-chip ${esc(n.category)}">${esc(CATEGORY_LABEL[n.category] || n.category)}</span>
            ${n.pinned ? '<span class="kp-chip pinned">固定</span>' : ""}
            ${n.read ? "" : '<span class="kp-chip important">未読</span>'}
            <span class="meta">${esc(date)}</span>
          </div>
          <div class="title">${esc(n.title)}</div>
          <div class="body">${esc(n.body)}</div>
          ${n.read ? "" : `
          <div class="foot">
            <button class="btn btn-secondary btn-sm" onclick="markRead('${esc(n.id)}')">
              <span class="material-symbols-outlined icon-inline">check</span>読みました
            </button>
          </div>`}
        </div>`;
    }).join("");
  }

  async function markRead(id) {
    const n = notices.find((x) => x.id === id);
    if (!n || n.read) return;
    n.read = true;                       // 先に反映して、押した手応えを返す
    const remaining = notices.filter((x) => !x.read).length;
    el("unread-badge").innerHTML = remaining
      ? `<span class="kp-chip important" style="margin-left:8px;">未読 ${remaining}</span>` : "";
    renderNotices();
    try { await API.markNoticeRead(id); }
    catch (e) { n.read = false; renderNotices(); alert(e.detail || e.message || "既読にできませんでした"); }
  }

  // ホームに出すのは「今日、自分が動く必要があること」だけにする。
  // 会計書類の枚数は自分の行動を変えないので、タイルからは外して下のカードに残した。
  // 4つの取得はそれぞれ独立していて、1つ失敗しても他は出る。
  const dayStr = (d) => new Date(d.getTime() + 9 * 3600000).toISOString().slice(0, 10);

  async function loadStats() {
    const today = dayStr(new Date());
    const out = { today };

    const [nippo, sched, tasks, reqs] = await Promise.allSettled([
      API.nippo(today),
      API.schedule(new Date(`${today}T00:00:00+09:00`).toISOString(),
                   new Date(`${today}T23:59:59+09:00`).toISOString()),
      API.listTasks("mine"),
      API.listRequests("mine"),
    ]);

    if (nippo.status === "fulfilled") out.nippoDone = !!nippo.value.today;
    if (sched.status === "fulfilled") {
      out.events = (sched.value.events || []).length + (sched.value.external || []).length;
    }
    if (tasks.status === "fulfilled") {
      const list = (tasks.value.tasks || []).filter((t) => t.status !== "done");
      out.tasksOpen = list.length;
      out.tasksLate = list.filter((t) => t.due_on && t.due_on < today).length;
    }
    if (reqs.status === "fulfilled") {
      out.pending = (reqs.value.requests || [])
        .filter((r) => r.status === "pending" || r.status === "pending_owner").length;
    }
    return out;
  }

  function renderTiles(s) {
    const tile = (href, icon, k, v, unit, sub, cls) => `
      <a class="kp-tile${cls ? " " + cls : ""}" href="${href}">
        <div class="k"><span class="material-symbols-outlined" style="font-size:15px;">${icon}</span>${k}</div>
        <div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div>
        <div class="s">${sub}</div>
      </a>`;

    el("tiles").innerHTML = [
      s.nippoDone === undefined
        ? tile("nippo.html", "edit_note", "今日の日報", "—", "", "読み込めませんでした")
        : (s.nippoDone
          ? tile("nippo.html", "check_circle", "今日の日報", "提出済み", "", "見直し・書き直しができます")
          : tile("nippo.html", "edit_note", "今日の日報", "未提出", "", "帰る前に書きましょう", "alert")),
      tile("schedule.html", "calendar_month", "今日の予定", s.events ?? "—", "件", "自分のカレンダー"),
      s.tasksLate
        ? tile("tasks.html", "error", "やること", s.tasksOpen ?? "—", "件", `期限切れ ${s.tasksLate} 件`, "alert")
        : tile("tasks.html", "checklist", "やること", s.tasksOpen ?? "—", "件", "未完了のタスク"),
      tile("workflow.html", "approval", "承認待ちの申請", s.pending ?? "—", "件", "自分が出したもの"),
    ].join("");
  }
</script>

</body>
</html>
