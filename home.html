<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260910q">
  <link rel="stylesheet" href="css/layout.css?v=20260910q">
  <style>
    /* 今日の最優先。ひとつだけ、他より明らかに大きく出す。
       5つ並んでいる「今日やること」は、結局どれもやらない */
    .dash-today { border-left: 4px solid var(--primary); }
    .dash-label { font-size: 11px; font-weight: 700; letter-spacing: .14em;
                  color: var(--primary); margin-bottom: 6px; }
    .dash-title { font-size: 21px; font-weight: 700; line-height: 1.55; }
    .dash-detail { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
    .dash-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    @media (max-width: 600px) { .dash-title { font-size: 18px; } }

    /* KPI。目標に対してどこまで来たかが、数字を読まなくても分かるように */
    .kpi-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
               align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .kpi-row:last-child { border-bottom: 0; }
    .kpi-name { font-size: 13.5px; font-weight: 600; }
    .kpi-num { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .kpi-num b { font-size: 17px; color: var(--text); }
    .kpi-bar { grid-column: 1 / -1; height: 6px; border-radius: 3px;
               background: var(--border); overflow: hidden; }
    .kpi-bar span { display: block; height: 100%; background: var(--primary); }
    .kpi-bar.hit span { background: var(--green, #2f855a); }
    .kpi-row input { width: 84px; margin: 0; padding: 4px 8px; text-align: right; }

    /* 次にやることの残り。最優先の下に小さく並べる */
    .dash-item { display: flex; gap: 8px; align-items: flex-start;
                 padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .dash-item:last-child { border-bottom: 0; }
    .dash-item .grow { flex: 1; min-width: 0; }

    /* 10か条。円グラフは読みにくいので横棒にした */
    .act-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 5px; }
    .act-row .n { width: 52px; color: var(--muted); }
    .act-row .b { flex: 1; height: 7px; border-radius: 4px; background: var(--border); overflow: hidden; }
    .act-row .b span { display: block; height: 100%; background: var(--primary); }
    .act-row .v { width: 34px; text-align: right; color: var(--muted); }
  </style>
  <script>
    // 権限を覚えていれば、最初の描画からサイドメニュー分の余白を確保する。
    // これが無いと、本文が中央→左寄せへずれてから枠が出る。
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
</head>
<body>

<div class="wrap">
  <h1 id="greet" class="kp-greet">読み込み中…</h1>
  <p id="greet-sub" class="kp-greet-sub"></p>

  <!-- 3か月の行き先。一番上に置くが、大きくはしない。
       今日やることが「何のためか」が見えないと、ただの作業一覧になる。
       ただし一番大きいのは TODAY。ここは細い帯にとどめる -->
  <div id="goal-strip" class="hidden"></div>

  <!-- 朝、まだ「今日の成功した状態」を描いていないときだけ出す。
       ここを飛ばすと、夜に振り返る基準そのものが無い -->
  <div id="am-nudge" class="hidden"></div>

  <!-- ① 今日の最優先。この画面で一番大きく出す。
       会社の評価を見る画面ではなく、仕事を前に進める画面にするため -->
  <div id="today-card" class="card hidden dash-today">
    <div class="dash-label">TODAY</div>
    <div id="today-title" class="dash-title"></div>
    <div id="today-detail" class="dash-detail"></div>
    <div id="today-foot" class="dash-foot"></div>
  </div>

  <!-- ② 今日のKPI。目標は事前に決めてあり、本人は実績だけ入れる -->
  <div id="kpi-card" class="card hidden">
    <h2><span class="material-symbols-outlined">target</span>今日のKPI
      <span id="kpi-tag" class="kp-chip" style="margin-left:6px;"></span>
      <button class="btn btn-secondary btn-sm" id="kpi-target-btn"
              style="margin-left:auto;" onclick="openKpiTargets()">
        <span class="material-symbols-outlined icon-inline">tune</span>目標を決める
      </button></h2>
    <div id="kpi-body"></div>
    <div id="kpi-msg" class="muted" style="font-size:12px;margin-top:8px;"></div>
  </div>

  <!-- ③ 止まっている仕事。放っておくと翌日も同じところで止まる。
       ひとりで抱えたままにしないための欄で、責める欄ではない -->
  <div id="blk-card" class="card hidden">
    <h2><span class="material-symbols-outlined">block</span>止まっていること
      <span id="blk-tag" class="kp-chip important" style="margin-left:6px;"></span>
      <button class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="raiseBlocker()">
        <span class="material-symbols-outlined icon-inline">add</span>止まっていることを出す
      </button></h2>
    <div id="blk-body"></div>
  </div>

  <!-- ④ 昨日のAIフィードバック。短く2つだけ -->
  <div id="fb-card" class="card hidden">
    <h2><span class="material-symbols-outlined">auto_awesome</span>昨日のふりかえり
      <span id="fb-date" class="kp-chip" style="margin-left:6px;"></span></h2>
    <div id="fb-body"></div>
  </div>

  <!-- THIS MONTH。3か月計画がある人だけに出る -->
  <div id="month-card" class="card hidden">
    <h2><span class="material-symbols-outlined">flag</span>今月の目標
      <span id="month-tag" class="kp-chip" style="margin-left:6px;"></span></h2>
    <div id="month-kgi" style="font-size:14.5px;font-weight:600;line-height:1.7;margin-bottom:12px;"></div>
    <div id="month-body"></div>
  </div>

  <!-- ⑤ 今週の状況／10か条（直近7日の平均）／自走レベル -->
  <div id="week-card" class="card hidden">
    <h2><span class="material-symbols-outlined">insights</span>今週の状況</h2>
    <div id="week-tiles" class="kp-tiles" style="margin-bottom:14px;"></div>
    <div id="level-box" class="hidden" style="margin-bottom:14px;"></div>
    <details id="radar-wrap">
      <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--primary-dark);">
        10か条の内訳（直近<span id="radar-days">7</span>日の平均）
      </summary>
      <div id="radar-body" style="margin-top:12px;"></div>
    </details>
  </div>

  <div id="tiles" class="kp-tiles"></div>

  <div id="hr-card" class="card hidden">
    <h2><span class="material-symbols-outlined">badge</span><span id="hr-title">入社手続き</span></h2>
    <p class="muted" style="font-size:13px;margin:0 0 6px;" id="hr-sub"></p>
    <div class="kp-progress"><span id="hr-bar" style="width:0%"></span></div>
    <div id="hr-items" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">campaign</span>お知らせ<span id="unread-badge"></span>
      <a class="btn btn-secondary btn-sm" href="notices.html" style="margin-left:auto;">すべて見る</a></h2>
    <div id="notices"><div class="empty">読み込み中…</div></div>
  </div>

  <div class="card">
    <h2><span class="material-symbols-outlined">receipt_long</span>会計書類
      <span class="kp-chip" style="margin-left:6px;">別システム</span></h2>
    <p class="muted" style="font-size:13px;margin:0 0 14px;">
      請求書・領収書の提出はこちらです。AIが種別を判定して月ごとに整理し、自動で仕訳します。
      社内の連絡や手続きとは別の仕組みで動いています。
    </p>
    <a class="btn btn-primary" href="app.html">
      <span class="material-symbols-outlined icon-inline">upload_file</span>会計書類を提出する
    </a>
    <a class="btn btn-secondary" href="menu.html" style="margin-left:8px;">
      <span class="material-symbols-outlined icon-inline">apps</span>ほかのメニュー
    </a>
  </div>

</div>

<script src="js/api-client.js?v=20260910q"></script>
<script src="js/layout.js?v=20260910q"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;
  const thisMonth = () => new Date().toISOString().slice(0, 7);

  KPLayout.init({ active: "home", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) start(ctx); });

  async function start(ctx) {
    const name = ctx.me?.gw?.employee?.display_name;
    el("greet").textContent = name ? `${name} さん、おつかれさまです` : "おつかれさまです";
    el("greet-sub").textContent = new Date().toLocaleDateString("ja-JP", {
      year: "numeric", month: "long", day: "numeric", weekday: "long",
    });

    // 社員名簿にまだ登録されていない場合は、その旨を出す（管理者の作業待ち）
    if (ctx.me?.gw?.available && !ctx.me?.gw?.employee) {
      el("greet-sub").insertAdjacentHTML("afterend",
        `<div class="banner warn" style="margin-bottom:18px;">
           <span class="material-symbols-outlined">person_alert</span>
           <div>社員名簿にまだ登録されていません。管理者に登録を依頼してください（書類のアップロードは今でも使えます）。</div>
         </div>`);
    }

    loadDashboard();
    renderTiles(await loadStats());
    loadNotices();
    loadProcedure();
  }

  // --- ① 今日の最優先 ／ ② KPI ／ ③ 昨日のふりかえり ／ ④ 今週 ---------------
  //
  // 上から この順番で並べる。この画面で一番見せたいのは
  // 「何点だったか」ではなく「次に何をするか」なので、
  // 点数（10か条）は一番下に、しかも開かないと出ない形にしてある。
  let dash = null;

  const CATEGORIES = [
    { key: "results", label: "成果",   weight: 40 },
    { key: "action",  label: "行動",   weight: 30 },
    { key: "growth",  label: "成長",   weight: 20 },
    { key: "team",    label: "チーム", weight: 10 },
  ];

  async function loadDashboard() {
    try {
      dash = await API.dashboard({ date: dayStr(new Date()) });
    } catch (e) {
      // 日報を使っていない人や、DBがまだ入っていない環境ではカードごと出さない
      return;
    }
    renderGoal();
    renderMorningNudge();
    renderToday();
    renderKpi();
    renderBlockers();
    renderFeedback();
    renderMonth();
    renderWeek();
    renderLevel();
  }

  // 朝の入力をまだ出していないときだけ、TODAY の上に出す。
  // 責める書き方にしない。「先に決めておくと、夜に振り返れる」という案内
  function renderMorningNudge() {
    const m = dash.morning;
    if (!m || m.done || m.reported) return;
    el("am-nudge").classList.remove("hidden");
    el("am-nudge").innerHTML = `
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;
                  padding:14px 16px;margin-bottom:14px;border-radius:10px;
                  background:var(--soft);border:1px solid var(--border);
                  border-left:4px solid var(--primary);">
        <span class="material-symbols-outlined" style="color:var(--primary);">wb_twilight</span>
        <div style="flex:1;min-width:220px;">
          <div style="font-size:14px;font-weight:700;">今日の終わりに「今日は良かった」と言える状態は？</div>
          <div class="muted" style="font-size:12.5px;margin-top:2px;">
            先に決めておくと、終業時に何を振り返ればよいかが決まります。3分で終わります。
          </div>
        </div>
        <a class="btn btn-primary btn-sm" href="nippo.html">決めておく</a>
      </div>`;
  }

  // 3か月の行き先。細い帯にとどめる。
  // ここを大きくすると評価を見る画面になり、TODAY が埋もれる
  function renderGoal() {
    const g = dash.growth;
    if (!g?.plan?.threeMonthKgi) return;
    el("goal-strip").classList.remove("hidden");
    el("goal-strip").innerHTML = `
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
                  padding:10px 14px;margin-bottom:14px;border-radius:10px;
                  background:var(--soft);border:1px solid var(--border);">
        <span class="muted" style="font-size:10.5px;font-weight:700;letter-spacing:.14em;">3 MONTH GOAL</span>
        <span style="flex:1;min-width:220px;font-size:13px;font-weight:600;line-height:1.65;">
          ${esc(g.plan.threeMonthKgi)}
        </span>
        <span class="muted" style="font-size:12px;white-space:nowrap;">
          ${g.days.over ? "期間終了" : `残り ${g.days.left} 日`}
        </span>
      </div>`;
  }

  // THIS MONTH。今月のKGIと、月間KPIがどこまで来ているか
  function renderMonth() {
    const m = dash.growth?.month;
    if (!m) return;
    el("month-card").classList.remove("hidden");
    el("month-tag").textContent =
      m.progress != null ? `KGI進捗 ${m.progress}%` : "集計中";
    el("month-tag").className = `kp-chip${m.progress >= 80 ? " event" : ""}`;
    el("month-kgi").textContent = m.kgi || "（今月の目標はまだ決まっていません）";

    if (!m.kpis.length) {
      el("month-body").innerHTML = `<div class="empty">今月のKPIはまだ決まっていません。</div>`;
      return;
    }

    el("month-body").innerHTML = m.kpis.map((k) => {
      const pct = k.rate == null ? 0 : Math.min(100, k.rate);
      const val = k.kind === "onoff"
        ? (k.actual ? "実施済み" : "未実施")
        : `${k.actual ?? "—"} / ${k.target ?? "—"}${esc(k.unit || "")}`;
      return `
        <div class="kpi-row">
          <div class="kpi-name">${esc(k.name)}
            ${k.fromDaily ? "" : '<span class="muted" style="font-weight:400;font-size:11px;margin-left:6px;">月末に記録</span>'}
          </div>
          <div class="kpi-num"><b>${esc(val)}</b>${k.rate != null ? ` <span>${k.rate}%</span>` : ""}</div>
          <div class="kpi-bar${k.hit ? " hit" : ""}"><span style="width:${pct}%"></span></div>
        </div>`;
    }).join("");
  }

  // 止まっていることを出す欄。責める欄ではないので、書きぶりも柔らかくする。
  // ひとりで抱えたままにしないことが目的
  function renderBlockers() {
    const list = dash.blockers || [];
    el("blk-card").classList.remove("hidden");
    el("blk-tag").textContent = list.length ? `${list.length} 件` : "なし";
    el("blk-tag").className = list.length ? "kp-chip important" : "kp-chip";

    if (!list.length) {
      el("blk-body").innerHTML = `<div class="empty">
        いま止まっていることはありません。<br>
        自分では動かせないこと（返事待ち・判断待ち・権限が要ること）が出てきたら、
        ここに出しておくと誰かが外しに来ます。</div>`;
      return;
    }

    el("blk-body").innerHTML = list.map((b) => `
      <div class="dash-item">
        <div class="grow">
          <div style="font-weight:600;">${esc(b.title)}</div>
          ${b.description ? `<div class="muted" style="font-size:12px;margin-top:2px;white-space:pre-wrap;">${esc(b.description)}</div>` : ""}
          <div class="muted" style="font-size:11.5px;margin-top:3px;">
            ${b.days}日目 ・ ${esc(b.escalationLabel)}
            ${b.long ? '<span class="kp-chip important" style="margin-left:6px;">長くなっています</span>' : ""}
          </div>
        </div>
        ${b.escalationLevel < 2 ? `
          <button class="btn btn-secondary btn-sm" onclick="escalateBlocker('${esc(b.id)}', this)"
                  title="上に相談する">相談する</button>` : ""}
        <button class="btn btn-primary btn-sm" onclick="resolveBlocker('${esc(b.id)}', this)">外れた</button>
      </div>`).join("");
  }

  // 自走レベル。「低い」ではなく「次まであと何項目」として出す。
  // 裁量の広さの話で、人の評価ではない
  function renderLevel() {
    const a = dash.autonomy;
    if (!a) return;
    el("level-box").classList.remove("hidden");
    el("level-box").innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
                  border:1px solid var(--border);border-radius:10px;padding:12px 14px;">
        <span class="muted" style="font-size:11px;font-weight:700;letter-spacing:.12em;">AUTONOMY</span>
        <span style="font-size:15px;font-weight:700;">LEVEL ${a.level}</span>
        <span style="font-size:13px;">${esc(a.info.label)}</span>
        <span class="muted" style="flex:1;min-width:200px;font-size:12px;">${esc(a.info.detail)}</span>
      </div>`;
  }

  function renderToday() {
    const t = dash.top;
    const rest = dash.actions || [];
    if (!t && !rest.length) {
      // 何も無い日は、日報を出していないことのほうが多い
      if (!dash.submittedToday) {
        el("today-card").classList.remove("hidden");
        el("today-title").textContent = "今日の最優先はまだ決まっていません";
        el("today-detail").textContent =
          "日報の「明日の最優先」に書いたことが、翌朝ここに出ます。";
        el("today-foot").innerHTML =
          `<a class="btn btn-primary btn-sm" href="nippo.html">
             <span class="material-symbols-outlined icon-inline">edit_note</span>日報を書く</a>
           <button class="btn btn-secondary btn-sm" onclick="addItem()">
             <span class="material-symbols-outlined icon-inline">add</span>自分で足す</button>`;
      }
      return;
    }

    el("today-card").classList.remove("hidden");

    if (t) {
      const late = t.dueDate < dash.date;
      el("today-title").textContent = t.title;
      el("today-detail").textContent = t.detail || "";
      el("today-foot").innerHTML = `
        <button class="btn btn-primary btn-sm" onclick="doneItem('${esc(t.id)}', this)">
          <span class="material-symbols-outlined icon-inline">check</span>できた
        </button>
        <button class="btn btn-secondary btn-sm" onclick="dropItem('${esc(t.id)}', this)">今日はやらない</button>
        <span class="kp-chip">${esc(t.sourceLabel)}</span>
        ${late ? `<span class="kp-chip important">${esc(t.dueDate)} の予定</span>` : ""}`;
    } else {
      el("today-title").textContent = "今日の最優先を選んでください";
      el("today-detail").textContent = "下のどれかを「これを最優先にする」で上に上げられます。";
      el("today-foot").innerHTML = "";
    }

    if (rest.length) {
      el("today-foot").insertAdjacentHTML("afterend", `
        <div style="margin-top:16px;">
          <div class="muted" style="font-size:11.5px;font-weight:700;margin-bottom:2px;">
            そのほか（${rest.length}件）
          </div>
          ${rest.map((a) => `
            <div class="dash-item">
              <div class="grow">
                <div>${esc(a.title)}</div>
                <div class="muted" style="font-size:11.5px;margin-top:2px;">
                  ${esc(a.sourceLabel)}${a.dueDate < dash.date ? ` ・ ${esc(a.dueDate)} の予定` : ""}
                </div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="topItem('${esc(a.id)}', this)"
                      title="今日の最優先にする">↑</button>
              <button class="btn btn-secondary btn-sm" onclick="doneItem('${esc(a.id)}', this)">できた</button>
            </div>`).join("")}
          <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="addItem()">
            <span class="material-symbols-outlined icon-inline">add</span>自分で足す
          </button>
        </div>`);
    }
  }

  function renderKpi() {
    const list = dash.kpis || [];
    el("kpi-card").classList.remove("hidden");

    const s = dash.kpiSummary;
    el("kpi-tag").textContent = s ? `${s.hit} / ${s.of} 達成` : "目標なし";
    el("kpi-tag").className = `kp-chip${s && s.rate === 100 ? " event" : ""}`;

    // 3か月計画から降りてきたKPIは、ここでは目標を変えられない。
    // 変えるのは月間KPIのほうで、日ごとに動かせると月の達成率が意味を失う
    const fromPlan = list.some((k) => k.kpiId);
    el("kpi-target-btn").classList.toggle("hidden", fromPlan);

    if (!list.length) {
      el("kpi-body").innerHTML = `<div class="empty">
        今日のKPIがまだありません。「目標を決める」から3〜5個まで設定してください。<br>
        一度決めれば、次の日からは同じ目標が引き継がれます。</div>`;
      return;
    }

    el("kpi-body").innerHTML = list.map((k) => {
      const pct = k.target > 0 ? Math.min(100, ((k.actual || 0) / k.target) * 100) : 0;
      const hit = k.target > 0 && (k.actual || 0) >= k.target;
      return `
        <div class="kpi-row">
          <div class="kpi-name">${esc(k.label)}</div>
          <div class="kpi-num">
            <input type="number" min="0" step="1" id="kpi-${esc(k.id)}"
                   value="${k.actual == null ? "" : k.actual}" placeholder="実績">
            <span style="margin-left:4px;">/ ${k.target ?? "—"}${esc(k.unit || "")}</span>
          </div>
          <div class="kpi-bar${hit ? " hit" : ""}"><span style="width:${pct}%"></span></div>
        </div>`;
    }).join("") + `
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="saveActuals(this)">
        <span class="material-symbols-outlined icon-inline">save</span>実績を記録
      </button>`;
  }

  function renderFeedback() {
    const y = dash.yesterday;
    if (!y) return;
    el("fb-card").classList.remove("hidden");
    el("fb-date").textContent = y.date;

    el("fb-body").innerHTML = `
      ${y.good.length ? `
        <div style="margin-bottom:12px;">
          <div class="muted" style="font-size:11.5px;font-weight:700;color:#2f855a;">GOOD</div>
          ${y.good.map((g) => `<div style="font-size:13.5px;line-height:1.8;">${esc(g)}</div>`).join("")}
        </div>` : ""}
      ${y.next ? `
        <div>
          <div class="muted" style="font-size:11.5px;font-weight:700;color:var(--primary);">NEXT</div>
          <div style="font-size:13.5px;line-height:1.8;">${esc(y.next)}</div>
        </div>` : ""}
      ${!y.good.length && !y.next ? `<div class="empty">まだ材料がありません。</div>` : ""}`;
  }

  function renderWeek() {
    const w = dash.week;
    if (!w) return;
    el("week-card").classList.remove("hidden");

    const tile = (k, v, unit, sub, cls) => `
      <div class="kp-tile${cls ? " " + cls : ""}">
        <div class="k">${k}</div>
        <div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div>
        <div class="s">${sub}</div>
      </div>`;

    el("week-tiles").innerHTML = [
      tile("KPI達成率", w.kgiRate ?? "—", w.kgiRate != null ? "%" : "",
           w.kgiOf ? `${w.kgiHit} / ${w.kgiOf} 日` : "記録なし"),
      tile("成果", w.resultCount, "件", "結果まで書けたもの"),
      tile("改善", w.improveCount, "回", "やり方を変えた日"),
      // 週次評価は、担当者が本人へ出してから見せる。下書きのまま見えると誤解になる
      w.weeklyTotal != null
        ? tile("今週の評価", w.weeklyTotal, "/100", "担当者が確定したもの")
        : tile("10か条の平均", w.avgTotal ?? "—", w.avgTotal != null ? "/100" : "",
               "AIの参考値（確定前）"),
    ].join("");

    const r = dash.radar;
    if (!r || !r.days) { el("radar-wrap").classList.add("hidden"); return; }
    el("radar-days").textContent = r.days;

    el("radar-body").innerHTML = `
      <div style="margin-bottom:12px;">
        ${CATEGORIES.map((d) => {
          const c = (r.categories || []).find((x) => x.key === d.key);
          const pts = c && c.points != null ? c.points : null;
          return `<div class="act-row">
            <span class="n" style="font-weight:700;color:var(--text);">${d.label}</span>
            <span class="b"><span style="width:${pts == null ? 0 : (pts / d.weight) * 100}%"></span></span>
            <span class="v">${pts == null ? "—" : pts}</span>
          </div>`;
        }).join("")}
      </div>
      <div class="muted" style="font-size:11.5px;margin-bottom:8px;">
        総合点は 成果40 / 行動30 / 成長20 / チーム10 で出しています。
        下の10か条は、なぜその点になったかの内訳です。
      </div>
      ${(r.actions || []).map((a) => `
        <div class="act-row">
          <span class="n">${esc(a.short)}</span>
          <span class="b"><span style="width:${a.avg == null ? 0 : a.avg * 10}%"></span></span>
          <span class="v">${a.avg == null ? "—" : a.avg}</span>
        </div>`).join("")}`;
  }

  // --- 操作 -------------------------------------------------------------------
  // inline の onclick から呼ぶので function 宣言にする
  async function doneItem(id, btn) {
    try {
      await KPLayout.busy(btn, "…", () => API.actionItem("done", { id }));
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "記録できませんでした"); }
  }

  async function dropItem(id, btn) {
    const note = prompt("やらない理由（あとで見返せます。空欄でも構いません）");
    if (note === null) return;   // キャンセル
    try {
      await KPLayout.busy(btn, "…", () => API.actionItem("drop", { id, note }));
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "記録できませんでした"); }
  }

  async function topItem(id, btn) {
    try {
      await KPLayout.busy(btn, "…", () => API.actionItem("top", { id }));
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "変更できませんでした"); }
  }

  async function addItem() {
    const title = prompt("今日やること");
    if (!title || !title.trim()) return;
    try {
      await API.actionItem("add", {
        title: title.trim(), dueDate: dash.date,
        priority: dash.top ? 5 : 1,
      });
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "追加できませんでした"); }
  }

  async function saveActuals(btn) {
    const actuals = {};
    for (const k of dash.kpis) actuals[k.id] = el(`kpi-${k.id}`).value;
    try {
      await KPLayout.busy(btn, "記録中…", () => API.saveKpiActuals(dash.date, actuals));
      el("kpi-msg").className = "muted";
      el("kpi-msg").textContent = "記録しました。";
      await reloadDash();
    } catch (e) {
      el("kpi-msg").className = "err-text";
      el("kpi-msg").textContent = e.hint || e.detail || e.message || "記録できませんでした";
    }
  }

  // 目標は事前に決めるもの。毎朝ここで決める運用にはしない
  async function openKpiTargets() {
    const now = (dash.kpis || []).map((k) =>
      `${k.label}${k.target != null ? ` ${k.target}` : ""}${k.unit ? k.unit : ""}`).join("\n");
    const text = prompt(
      "1行に1つ、「名前 目標 単位」の形で書いてください（3〜5個まで）。\n" +
      "例：\n営業連絡 20 件\n商談 2 件\nENGER登録 3 件",
      now);
    if (text === null) return;

    const kpis = text.split("\n").map((line) => {
      const m = line.trim().match(/^(.*?)[\s　]+([0-9]+(?:\.[0-9]+)?)[\s　]*(\S*)$/);
      if (m) return { label: m[1].trim(), target: Number(m[2]), unit: m[3] || null };
      return line.trim() ? { label: line.trim(), target: null, unit: null } : null;
    }).filter(Boolean);

    try {
      await API.saveKpiTargets({ date: dash.date, kpis, saveTemplate: true });
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "保存できませんでした"); }
  }

  async function raiseBlocker() {
    const title = prompt("何が止まっていますか（自分では動かせないこと）");
    if (!title || !title.trim()) return;
    const description = prompt("補足があれば（空欄でも構いません）") || "";
    try {
      const r = await API.raiseBlocker({ title: title.trim(), description });
      if (r.duplicate) alert("同じ内容がすでに出ています。");
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "登録できませんでした"); }
  }

  async function resolveBlocker(id, btn) {
    const resolution = prompt("どうやって外れましたか（次に同じところで止まらないために残します）");
    if (resolution === null) return;
    try {
      await KPLayout.busy(btn, "…", () => API.blockerAct("resolve", { id, resolution }));
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "更新できませんでした"); }
  }

  async function escalateBlocker(id, btn) {
    try {
      await KPLayout.busy(btn, "…", () => API.blockerAct("escalate", { id }));
      await reloadDash();
    } catch (e) { alert(e.hint || e.detail || e.message || "更新できませんでした"); }
  }

  async function reloadDash() {
    // 追記した「そのほか」の枠が二重にならないよう、いったん消してから描き直す
    for (const id of ["goal-strip", "am-nudge", "today-card", "kpi-card", "blk-card",
                      "fb-card", "month-card", "week-card"]) {
      el(id).classList.add("hidden");
    }
    el("today-card").innerHTML = `
      <div class="dash-label">TODAY</div>
      <div id="today-title" class="dash-title"></div>
      <div id="today-detail" class="dash-detail"></div>
      <div id="today-foot" class="dash-foot"></div>`;
    await loadDashboard();
  }

  // --- 入社・退職手続き（自分の分だけ） -------------------------------------
  let myProcedure = null;

  async function loadProcedure() {
    try {
      const res = await API.listProcedures();
      // 自分が対象の、まだ終わっていない手続き
      myProcedure = (res.procedures || []).find(
        (p) => p.employee?.id === res.me?.id && p.status !== "done" && p.status !== "cancelled"
      ) || null;
      renderProcedure();
    } catch (e) {
      // 未適用の環境やアクセス権が無い場合は、カードごと出さない
      el("hr-card").classList.add("hidden");
    }
  }

  function renderProcedure() {
    if (!myProcedure) { el("hr-card").classList.add("hidden"); return; }

    // 本人が出すものだけを見せる。会社側・社労士側の作業は本人の画面には出さない
    const mine = (myProcedure.items || []).filter((i) => i.owner === "employee");
    if (!mine.length) { el("hr-card").classList.add("hidden"); return; }

    const done = mine.filter((i) => i.status === "done" || i.status === "na").length;
    const submitted = mine.filter((i) => i.status === "submitted").length;
    const pct = Math.round(((done + submitted) / mine.length) * 100);

    el("hr-title").textContent = myProcedure.kind === "onboarding" ? "入社手続き" : "退職手続き";
    el("hr-sub").textContent = myProcedure.target_on
      ? `${new Date(myProcedure.target_on).toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" })}　提出 ${done + submitted} / ${mine.length} 件`
      : `提出 ${done + submitted} / ${mine.length} 件`;
    el("hr-bar").style.width = `${pct}%`;

    el("hr-items").innerHTML = mine.map((i) => {
      const finished = i.status === "done" || i.status === "na";
      const label = finished ? "確認済み" : (i.status === "submitted" ? "提出済み" : "");
      const files = (i.files || []).map((f) =>
        `<small><a href="#" onclick="openFile('${esc(f.id)}');return false;">${esc(f.filename)}</a></small>`).join("");
      return `
        <div class="kp-todo${finished ? " done" : ""}">
          <span class="material-symbols-outlined" style="font-size:20px;color:${finished || i.status === "submitted" ? "var(--primary)" : "#c3cad3"};">
            ${finished || i.status === "submitted" ? "check_circle" : "radio_button_unchecked"}</span>
          <span class="t">${esc(i.title)}
            ${i.due_on ? `<small>期限 ${esc(new Date(i.due_on).toLocaleDateString("ja-JP"))}</small>` : ""}
            ${label ? `<small>${label}</small>` : ""}
            ${files}
          </span>
          ${finished ? "" : `
            <label class="btn btn-primary btn-sm" style="cursor:pointer;">
              <span class="material-symbols-outlined icon-inline">upload_file</span>ファイルを出す
              <input type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp"
                     onchange="pickFile('${esc(i.id)}', this)">
            </label>
            ${i.status === "submitted"
              ? `<button class="btn btn-secondary btn-sm" onclick="submitItem('${esc(i.id)}', true, this)">取り消す</button>`
              : `<button class="btn btn-secondary btn-sm" onclick="submitItem('${esc(i.id)}', false, this)">提出済みにする</button>`}`}
        </div>`;
    }).join("");

    el("hr-card").classList.remove("hidden");
  }

  // ファイルを選んだらそのまま提出まで進める。
  // 会計の書類アップロードとは別の保存先に入るので、仕訳は作られない。
  async function pickFile(itemId, input) {
    const file = input.files?.[0];
    input.value = "";
    if (!file) return;
    const card = document.getElementById("hr-items");
    const before = card.innerHTML;
    card.insertAdjacentHTML("afterbegin", `<div class="empty" id="hr-uploading">送信中…</div>`);
    try {
      await API.uploadProcedureFile(itemId, file);
      await loadProcedure();
    } catch (e) {
      card.innerHTML = before;
      alert(e.hint || e.detail || e.message || "送信できませんでした");
    }
  }

  async function openFile(fileId) {
    try {
      const { url } = await API.procedureFileUrl(fileId);
      window.open(url, "_blank", "noopener");
    } catch (e) {
      alert(e.detail || e.message || "開けませんでした");
    }
  }

  async function submitItem(itemId, undo, btn) {
    try {
      await KPLayout.busy(btn, "更新中…", () => API.submitProcedureItem(itemId, { undo }));
      await loadProcedure();
    } catch (e) {
      alert(e.detail || e.message || "更新できませんでした");
    }
  }

  // --- お知らせ -------------------------------------------------------------
  const CATEGORY_LABEL = { general: "お知らせ", important: "重要", event: "イベント", system: "システム" };
  let notices = [];

  async function loadNotices() {
    try {
      const res = await API.listNotices();
      notices = res.notices || [];
      el("unread-badge").innerHTML = res.unread
        ? `<span class="kp-chip important" style="margin-left:8px;">未読 ${res.unread}</span>` : "";
      renderNotices();
    } catch (e) {
      el("notices").innerHTML =
        `<div class="banner warn"><span class="material-symbols-outlined">info</span>
           <div>お知らせを取得できませんでした：${esc(e.detail || e.message)}</div></div>`;
    }
  }

  function renderNotices() {
    if (!notices.length) {
      el("notices").innerHTML = `<div class="empty">現在お知らせはありません。</div>`;
      return;
    }
    el("notices").innerHTML = notices.map((n) => {
      const date = new Date(n.publish_at).toLocaleDateString("ja-JP", { month: "long", day: "numeric" });
      return `
        <div class="kp-notice${n.read ? "" : " unread"}" id="n-${esc(n.id)}">
          <div class="head">
            <span class="kp-chip ${esc(n.category)}">${esc(CATEGORY_LABEL[n.category] || n.category)}</span>
            ${n.pinned ? '<span class="kp-chip pinned">固定</span>' : ""}
            ${n.read ? "" : '<span class="kp-chip important">未読</span>'}
            <span class="meta">${esc(date)}</span>
          </div>
          <div class="title">${esc(n.title)}</div>
          <div class="body">${esc(n.body)}</div>
          ${n.read ? "" : `
          <div class="foot">
            <button class="btn btn-secondary btn-sm" onclick="markRead('${esc(n.id)}')">
              <span class="material-symbols-outlined icon-inline">check</span>読みました
            </button>
          </div>`}
        </div>`;
    }).join("");
  }

  async function markRead(id) {
    const n = notices.find((x) => x.id === id);
    if (!n || n.read) return;
    n.read = true;                       // 先に反映して、押した手応えを返す
    const remaining = notices.filter((x) => !x.read).length;
    el("unread-badge").innerHTML = remaining
      ? `<span class="kp-chip important" style="margin-left:8px;">未読 ${remaining}</span>` : "";
    renderNotices();
    try { await API.markNoticeRead(id); }
    catch (e) { n.read = false; renderNotices(); alert(e.detail || e.message || "既読にできませんでした"); }
  }

  // ホームに出すのは「今日、自分が動く必要があること」だけにする。
  // 会計書類の枚数は自分の行動を変えないので、タイルからは外して下のカードに残した。
  // 4つの取得はそれぞれ独立していて、1つ失敗しても他は出る。
  const dayStr = (d) => new Date(d.getTime() + 9 * 3600000).toISOString().slice(0, 10);

  async function loadStats() {
    const today = dayStr(new Date());
    const out = { today };

    const [nippo, sched, tasks, reqs] = await Promise.allSettled([
      API.nippo(today),
      API.schedule(new Date(`${today}T00:00:00+09:00`).toISOString(),
                   new Date(`${today}T23:59:59+09:00`).toISOString()),
      API.listTasks("mine"),
      API.listRequests("mine"),
    ]);

    if (nippo.status === "fulfilled") out.nippoDone = !!nippo.value.today;
    if (sched.status === "fulfilled") {
      out.events = (sched.value.events || []).length + (sched.value.external || []).length;
    }
    if (tasks.status === "fulfilled") {
      const list = (tasks.value.tasks || []).filter((t) => t.status !== "done");
      out.tasksOpen = list.length;
      out.tasksLate = list.filter((t) => t.due_on && t.due_on < today).length;
    }
    if (reqs.status === "fulfilled") {
      out.pending = (reqs.value.requests || [])
        .filter((r) => r.status === "pending" || r.status === "pending_owner").length;
    }
    return out;
  }

  function renderTiles(s) {
    const tile = (href, icon, k, v, unit, sub, cls) => `
      <a class="kp-tile${cls ? " " + cls : ""}" href="${href}">
        <div class="k"><span class="material-symbols-outlined" style="font-size:15px;">${icon}</span>${k}</div>
        <div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div>
        <div class="s">${sub}</div>
      </a>`;

    el("tiles").innerHTML = [
      s.nippoDone === undefined
        ? tile("nippo.html", "edit_note", "今日の日報", "—", "", "読み込めませんでした")
        : (s.nippoDone
          ? tile("nippo.html", "check_circle", "今日の日報", "提出済み", "", "見直し・書き直しができます")
          : tile("nippo.html", "edit_note", "今日の日報", "未提出", "", "帰る前に書きましょう", "alert")),
      tile("schedule.html", "calendar_month", "今日の予定", s.events ?? "—", "件", "自分のカレンダー"),
      s.tasksLate
        ? tile("tasks.html", "error", "やること", s.tasksOpen ?? "—", "件", `期限切れ ${s.tasksLate} 件`, "alert")
        : tile("tasks.html", "checklist", "やること", s.tasksOpen ?? "—", "件", "未完了のタスク"),
      tile("workflow.html", "approval", "承認待ちの申請", s.pending ?? "—", "件", "自分が出したもの"),
    ].join("");
  }
</script>
