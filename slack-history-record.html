<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>送信済み投稿を記録 | EIGHT</title><link rel="icon" href="img/logo.svg"><link rel="stylesheet" href="css/app.css?v=20261030hrslack3"><link rel="stylesheet" href="css/layout.css?v=20261030hrslack3"><link rel="stylesheet" href="css/slack-history.css?v=20261030hrslack3"><style>.receipt-fields{border:0;padding:0;margin:0;display:grid;gap:15px}.receipt-fields label{display:grid;gap:6px;font-size:14px}.receipt-fields input,.receipt-fields select,.receipt-fields textarea{font:inherit;padding:9px;border:1px solid #cbd0d7;border-radius:6px;width:100%;box-sizing:border-box}.receipt-fields input[type=checkbox]{width:auto}.receipt-fields .receipt-check{display:flex;align-items:flex-start}.receipt-fields textarea{min-height:95px}.receipt-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.receipt-row{grid-template-columns:1fr}}</style></head><body><main class="slack-history-wrap"><h1>送信済み投稿を記録</h1><p class="slack-history-warning">この画面はSlackへ送信しません。Slack投稿の実在を自動照会するものではなく、代表本人が確認した送信記録を保存します。既に送信済みの部門チャンネル投稿だけを記録します。代表個人宛DMや機密情報は登録禁止です。</p><p id="receipt-state" role="status" aria-live="polite">権限を確認しています…</p><p><a id="receipt-history" hidden>Slack通知履歴へ戻る</a></p><form id="receipt-form" hidden><fieldset id="receipt-fields" class="receipt-fields"><p id="receipt-destination"></p>
<label>実際のSlack投稿リンク<input id="receipt-link" type="url" required placeholder="https://8grp.slack.com/archives/…/p…" autocomplete="off"></label><div class="receipt-row"><label>Slack投稿ID（リンクから取得）<input id="receipt-ts" readonly required></label><label>実際の送信日時（UTC、リンクから取得）<input id="receipt-sent" readonly required></label></div>
<label>送信済みの非機密要約（2000文字以内）<textarea id="receipt-summary" maxlength="2000" required></textarea></label>
<div class="receipt-row"><label>対象日（JST）<input id="receipt-date" type="date" required></label><label>通知枠（JST）<select id="receipt-slot"><option value="08">08:00</option><option value="12">12:00</option><option value="17">17:00</option></select></label></div><label>版（同じ内容の再試行では変更しない）<input id="receipt-revision" type="number" min="1" step="1" value="1" required></label>
<div class="receipt-row"><label>確認対象の開始日時（ISO、時差必須）<input id="receipt-start" required placeholder="2026-10-30T08:00:00+09:00"></label><label>確認対象の終了日時（ISO、時差必須）<input id="receipt-end" required placeholder="2026-10-30T12:00:00+09:00"></label></div>
<label>対象情報の取得状態<select id="receipt-coverage"><option value="complete">確認完了</option><option value="partial">取得不足</option><option value="unavailable">取得不可・未確認</option></select></label><label>取得不足・未確認の説明（該当時必須、500文字以内）<textarea id="receipt-note" maxlength="500"></textarea></label>
<label>参照元の識別子（1行1件、本文や個人情報は禁止）<textarea id="receipt-sources" placeholder="メールmessage ID または GWレコードID"></textarea></label>
<label class="receipt-check"><input id="receipt-confirm-sent" type="checkbox" required>指定チャンネルの実投稿を開き、送信日時・内容が一致することを確認しました</label><label class="receipt-check"><input id="receipt-confirm-safe" type="checkbox" required>個人DM、給与・契約・候補者詳細・全文等を含まず、この部門に共有できる要約であることを確認しました</label>
<button id="receipt-submit" class="slack-history-button" type="submit">送信済み投稿を記録する</button></fieldset></form><button id="receipt-verify" class="slack-history-button" type="button" hidden>保存結果を履歴で確認する</button></main><script src="js/api-client.js?v=20261030hrslack3"></script><script src="js/device.js?v=20261030hrslack3"></script><script src="js/layout.js?v=20261030hrslack3"></script><script src="js/slack-history-record.js?v=20261030hrslack3"></script></body></html>
