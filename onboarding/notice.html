<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 署名付きURLを、外部へ渡さない -->
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="../img/logo.svg">
  <title>労働条件通知書 - EIGHT</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css?v=20261002of1">
  <style>
    /* 労働条件通知書をじっくり読むための別タブ。本人（/onboarding/）と、会社（入社管理のプレビュー）が同じページを使う */
    body { font-family:'Zen Kaku Gothic New', sans-serif; margin:0; background:#f6f6f2; color:#1b2440; }
    .material-symbols-outlined { font-family:'Material Symbols Rounded'; }
    .nv-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid #e2e2dc; background:#fff; }
    .nv-head .t { font-size:17px; font-weight:700; }
    .nv-head .s { font-size:12.5px; color:#4a5068; }
    .nv-head .s b { display:inline-block; background:#1b2440; color:#fff; border-radius:999px; padding:2px 10px; font-size:12px; margin-right:8px; }
    .nv-body { height:calc(100vh - var(--nv-top, 120px)); background:#525659; }
    .nv-body iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
    .nv-msg { max-width:640px; margin:40px auto; padding:0 16px; }
    .nv-ban { background:#fff; border:1px solid #e2e2dc; border-left:3px solid #e0a030; border-radius:8px; padding:12px 14px; font-size:13px; line-height:1.8; }
    .nv-ban.err { border-left-color:#b3261e; background:#fff5f4; }
    .nv-note { font-size:12px; color:#6b7080; padding:6px 16px; background:#fff; border-top:1px solid #e2e2dc; line-height:1.8; }
    .nv-note a { color:#1b2440; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div id="nv-head" class="nv-head hidden">
  <div>
    <div class="t" id="nv-title">労働条件通知書</div>
    <div class="s" id="nv-sub"></div>
  </div>
</div>
<div id="nv-body"><div class="nv-msg"><div class="nv-ban">読み込み中…</div></div></div>
<div class="nv-note hidden" id="nv-note">
  労働条件通知書には、給与などの個人情報が含まれます。表示用のリンクは数分で切れます。
  表示されないときは、<a id="nv-open" href="#" target="_blank" rel="noopener noreferrer">こちらから開いてください</a>。
</div>

<script src="../js/api-client.js?v=20261002of1"></script>
<script>
  // /onboarding/notice.html?v=<版>          … 本人。自分の「公開済みの最新版」だけ（POST /api/onboarding/start view_notice）
  // /onboarding/notice.html?file=<版のID>   … 会社（経営者・人事）のプレビュー（GET /api/onboarding/notice?file=）
  // 署名付きURLは、この画面の iframe にだけ入れる。保存・記録・console への出力はしない
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const q = new URLSearchParams(location.search);
  const fileId = q.get("file");
  const ver = q.get("v");

  function fail(text, login) {
    el("nv-body").innerHTML = `<div class="nv-msg"><div class="nv-ban err">${esc(text)}</div>${
      login ? `<p><a href="/index.html?next=${encodeURIComponent(location.pathname + location.search)}">ログインする</a></p>` : ""}</div>`;
  }

  async function load() {
    if (!API.isLoggedIn()) return fail("ログインしてから開いてください。", true);
    let r;
    try {
      r = fileId
        ? await API.api(`/api/onboarding/notice?file=${encodeURIComponent(fileId)}`)
        : await API.api("/api/onboarding/start", { method: "POST", body: { action: "view_notice", ...(ver ? { version: Number(ver) } : {}) } });
    } catch (e) {
      if (e.status === 401) return fail("ログインしてから開いてください。", true);
      return fail(e.status === 403 ? "この書類を見る権限がありません。"
        : e.code === "version_changed" ? "労働条件通知書が更新されました。入社準備の画面に戻って、もう一度ご確認ください。"
          : e.code === "esign_in_progress" ? "この方は、電子署名で進めます。契約の画面からご確認ください。"
            : e.status === 404 ? "書類が見つかりません。" : (e.hint || e.message || "開けませんでした"));
    }
    document.title = "労働条件通知書 - EIGHT";
    el("nv-sub").innerHTML = `<b>第${esc(r.version)}版</b>${esc(r.filename || "")}`;
    el("nv-head").classList.remove("hidden");
    el("nv-note").classList.remove("hidden");
    el("nv-open").href = r.url;
    const top = el("nv-head").getBoundingClientRect().bottom + el("nv-note").offsetHeight;
    document.documentElement.style.setProperty("--nv-top", `${Math.ceil(top)}px`);
    // ブラウザ標準のPDFビューアで、画面いっぱいに
    el("nv-body").className = "nv-body";
    el("nv-body").innerHTML = `<iframe title="労働条件通知書" referrerpolicy="no-referrer"></iframe>`;
    el("nv-body").querySelector("iframe").src = r.url;
  }
  load();
</script>
</body>
</html>
