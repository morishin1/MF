<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="エイト">
  <!--
    エイトのロゴマーク。

    ■ 差し替えかた
      これは、いただいた画像を見て起こした再現です。
      正式なデータがあれば、このファイルをそのまま置き換えてください。
      参照しているのはパス（img/logo.svg）だけなので、
      置き換えれば全画面に反映されます。画面側の変更は要りません。

    ■ 色
      currentColor にしていないのは、ブランドの色を画面のテーマで
      勝手に変えないため。ロゴの色は1か所（この fill）で決める。
  -->
  <g fill="none" stroke="#2E0505" stroke-width="9" stroke-linejoin="miter" stroke-miterlimit="10">
    <!-- 外側の砂時計。上の横棒 → 右上の斜め → 中心 → 右下の斜め →
         下の横棒 → 左下の斜め → 中心 → 左上の斜め、と一筆で閉じる -->
    <path d="M11 12 H89 L50 50 L89 88 H11 L50 50 Z" />
  </g>
  <g fill="#2E0505">
    <!-- 内側の山形。上は下向き、下は上向き -->
    <path d="M50 26 L61 46 L55 52 L50 43 L45 52 L39 46 Z" />
    <path d="M50 74 L61 54 L55 48 L50 57 L45 48 L39 54 Z" />
  </g>
</svg>
