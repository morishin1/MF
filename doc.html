<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>社内文書 - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911x">
  <link rel="stylesheet" href="css/layout.css?v=20260911x">
  <script>
    try {
      // メンバーもPCではサイドメニューを持つ。狭い画面ではCSSが余白を戻す
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) {
        document.documentElement.classList.add("kp-has-sidebar");
      }
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 読むための画面なので、枠より中身を広く取る */
    .vw { border:1px solid var(--line, #e4e8ee); border-radius:12px; overflow:hidden;
          background:#f7f8fa; }
    .vw iframe { display:block; width:100%; height:78vh; min-height:420px; border:0; background:#fff; }
    .vw img { display:block; width:100%; height:auto; background:#fff; }
    @media (max-width: 720px) { .vw iframe { height:62vh; } }
  </style>
</head>
<body>

<div class="wrap">
  <p style="margin:0 0 10px;">
    <a href="library.html" style="font-size:13px;">
      <span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;">arrow_back</span>社内文書にもどる
    </a>
  </p>

  <h1 class="kp-greet" id="title">　</h1>
  <p class="kp-greet-sub" id="sub"></p>

  <div id="msg"></div>

  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <a id="open-new" class="btn btn-primary btn-sm hidden" target="_blank" rel="noopener">
        <span class="material-symbols-outlined icon-inline">open_in_new</span>新しいタブで開く
      </a>
      <button id="reopen" class="btn btn-secondary btn-sm hidden" onclick="load()">
        <span class="material-symbols-outlined icon-inline">refresh</span>読み込み直す
      </button>
    </div>
    <div id="view"><div class="empty">読み込み中…</div></div>
    <p class="muted" style="font-size:11.5px;margin:12px 0 0;">
      表示用のリンクは10分で切れます。時間が経って白いままのときは「読み込み直す」を押してください。
    </p>
  </div>
</div>

<script src="js/api-client.js?v=20260911x"></script>
<script src="js/layout.js?v=20260911x"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  const CATEGORY_LABEL = { rule: "社内規定", manual: "マニュアル", form: "様式・テンプレート", other: "その他" };
  const docId = new URLSearchParams(location.search).get("id");

  let doc = null;

  KPLayout.init({ active: "library", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  // 1件だけを引く口は用意していない。社内文書は多くても数十件で、
  // 一覧を取って絞るほうが、API を1本増やすより見通しがよい
  async function load() {
    if (!docId) return fail("どの文書を開くのかが分かりませんでした。");
    el("view").innerHTML = `<div class="empty">読み込み中…</div>`;
    try {
      const res = await API.listLibrary();
      doc = (res.documents || []).find((d) => d.id === docId) || null;
      if (!doc) {
        return fail("この文書は見つかりませんでした。取り下げられたか、公開されていない可能性があります。");
      }
      render();
    } catch (e) {
      fail(`取得に失敗しました：${e.detail || e.message}`);
    }
  }

  function fail(text) {
    el("title").textContent = "社内文書";
    el("view").innerHTML = "";
    el("msg").innerHTML =
      `<div class="banner err" style="margin-bottom:16px;">
         <span class="material-symbols-outlined">error</span><div>${esc(text)}</div></div>`;
  }

  async function render() {
    el("msg").innerHTML = "";
    document.title = `${doc.title} - エイト`;
    el("title").textContent = doc.title;

    const size = doc.size_bytes
      ? (doc.size_bytes >= 1024 * 1024
        ? `${(doc.size_bytes / 1024 / 1024).toFixed(1)} MB`
        : `${Math.max(1, Math.round(doc.size_bytes / 1024))} KB`)
      : "";
    el("sub").textContent =
      [CATEGORY_LABEL[doc.category] || doc.category, doc.description, doc.file_name, size]
        .filter(Boolean).join("　／　");

    // 外部リンクの文書は、こちらで中身を持っていない。開くだけ
    if (doc.link_url) {
      el("open-new").href = doc.link_url;
      el("open-new").classList.remove("hidden");
      el("view").innerHTML =
        `<div class="empty">この文書は外部（Googleドライブなど）に置いてあります。
           上のボタンから開いてください。</div>`;
      return;
    }

    let url;
    try {
      ({ url } = await API.libraryFileUrl(doc.file_path));
    } catch (e) {
      return fail(`ファイルを開けませんでした：${e.hint || e.detail || e.message}`);
    }

    el("open-new").href = url;
    el("open-new").classList.remove("hidden");
    el("reopen").classList.remove("hidden");

    const name = `${doc.file_name || ""} ${doc.mime_type || ""}`.toLowerCase();

    if (/(\.png|\.jpe?g|\.webp|image\/)/.test(name)) {
      el("view").innerHTML = `<div class="vw"><img src="${esc(url)}" alt="${esc(doc.title)}"></div>`;
      return;
    }

    if (/pdf/.test(name)) {
      // スマホのブラウザは、埋め込みのPDFを描かないことがある。
      // そのときのために「新しいタブで開く」を上に出してある
      el("view").innerHTML =
        `<div class="vw"><iframe src="${esc(url)}#view=FitH" title="${esc(doc.title)}"></iframe></div>`;
      return;
    }

    // Word・Excel はブラウザでは開けない。落として見てもらう
    el("view").innerHTML = `
      <div class="empty">
        この形式はこの画面では表示できません。「新しいタブで開く」から保存してご覧ください。
      </div>`;
  }
</script>

</body>
</html>
