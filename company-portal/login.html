<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>企業ログイン | EIGHT 商談ポータル</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/company-portal.css?v=20261108-1">
<script defer src="/js/company-portal.js?v=20261108-1"></script>
</head>
<body data-page="login">
<main class="cp-login">
<section class="cp-login-info" aria-label="サービスのご案内">
<a class="cp-brand" href="/company-portal/login.html">EIGHT <span>BUSINESS MEETING</span></a>
<div>
<div class="cp-eyebrow" style="color:#73d9ca">FOR BUSINESS</div>
<h1>ご提案から商談まで、<br>ひとつの場所で。</h1>
<p>エイトがご案内した人材・案件を確認し、気になる提案にはそのままお問い合わせいただけます。</p>
<div class="cp-status">ご案内を受けた企業様専用のページです</div>
</div>
<div class="cp-foot">EIGHT, Inc. · お客様の情報はログイン後にのみ表示されます。</div>
</section>
<section class="cp-login-panel" aria-label="企業ログイン">
<div class="cp-login-card">
<div class="cp-eyebrow">SECURE LOGIN</div>
<h2>企業様ログイン</h2>
<p>エイト担当者からご案内したメールアドレスとパスワードでログインしてください。新規登録は不要です。</p>
<form id="loginForm">
<div class="cp-field"><label for="email">メールアドレス</label><input class="cp-input" id="email" type="email" autocomplete="username" required placeholder="name@company.co.jp"></div>
<div class="cp-field"><label for="password">パスワード</label><input class="cp-input" id="password" type="password" autocomplete="current-password" required></div>
<button type="submit" class="cp-btn primary" id="loginButton">ログインして商談ページを開く</button>
</form>
<div id="loginMessage" role="alert" aria-live="polite"></div>
<div class="cp-back">ログインできない場合は、エイトの担当者にご連絡ください。</div>
</div>
</section>
</main></body></html>
