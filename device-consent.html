<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>会社のパソコンについて - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260912e">
  <link rel="stylesheet" href="css/layout.css?v=20260912e">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) { /* 読めなくても動く */ }
  </script>
  <style>
    /* 読ませるための画面。字を詰めない */
    .dc-list { font-size:14px; line-height:2.1; margin:0; padding-left:1.3em; }
    .dc-box { border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
    .dc-box.take { border-color:#cfe0f5; background:#f7fbff; }
    .dc-box.never { border-color:#d4e9dc; background:#f6fbf8; }
    .dc-box h3 { margin:0 0 8px; font-size:15px; display:flex; align-items:center; gap:7px; }
    .dc-box.take h3 { color:#2b5f9e; }
    .dc-box.never h3 { color:#1f7a4c; }
    .dc-why { font-size:14px; line-height:2; }
    .dc-dev { display:flex; align-items:center; gap:10px; border:1px solid var(--border);
              border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:13.5px; }
    .dc-dev b { color:var(--primary-dark); }
    .dc-dev .ok { margin-left:auto; color:#1f7a4c; font-weight:700; font-size:12.5px; }
  </style>
</head>
<body>

<div class="wrap" style="max-width:760px;">
  <h1 class="kp-greet">会社のパソコンで記録していること</h1>
  <p class="kp-greet-sub">
    会社が貸したパソコンには、業務の状況を記録するソフトが入っています。
    <b>あなたが下で「読みました」を押すまで、記録は取っていません。</b>
  </p>

  <div class="card">
    <div class="dc-box take">
      <h3><span class="material-symbols-outlined">visibility</span>取っているもの</h3>
      <ul class="dc-list" id="c-takes"></ul>
    </div>

    <div class="dc-box never">
      <h3><span class="material-symbols-outlined">visibility_off</span>取っていないもの</h3>
      <ul class="dc-list" id="c-never"></ul>
    </div>

    <div class="dc-why">
      <p id="c-why"></p>
      <p id="c-yours"></p>
      <p class="muted" style="font-size:13px;">
        くわしくは就業規則の該当条項をご確認ください。
        疑問があれば、押す前に人事に聞いてください。押さないままでも、記録は始まりません。
      </p>
    </div>
  </div>

  <div class="card" id="c-devcard">
    <h2><span class="material-symbols-outlined">laptop_windows</span>あなたのパソコン</h2>
    <div id="c-devs">読み込み中…</div>
    <div id="c-msg" class="err-text"></div>
    <p class="muted" style="font-size:12.5px;margin-top:14px;">
      自分の記録と、誰がそれを見たかは、いつでも
      <a href="mypage.html">マイページ</a>で読めます。
    </p>
  </div>
</div>

<script src="js/api-client.js?v=20260912e"></script>
<script src="js/layout.js?v=20260912e"></script>
<script>
  const el = (id) => document.getElementById(id);
  const esc = KPLayout.esc;

  KPLayout.init({ active: "mypage", roles: ["member", "admin", "owner", "sr"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const d = await API.myDevices();
      const n = d.notice || {};
      el("c-takes").innerHTML = (n.takes || []).map((s) => `<li>${esc(s)}</li>`).join("");
      el("c-never").innerHTML = (n.never || []).map((s) => `<li>${esc(s)}</li>`).join("");
      el("c-why").textContent = n.why || "";
      el("c-yours").textContent = n.yours || "";

      const devs = d.devices || [];
      el("c-devs").innerHTML = devs.length
        ? devs.map((x) => `
            <div class="dc-dev">
              <span class="material-symbols-outlined" style="color:var(--muted);">computer</span>
              <span><b>${esc(x.hostname)}</b>
                <span class="muted" style="font-size:12px;">　${esc(x.os || "")}</span></span>
              ${x.acknowledged
                ? `<span class="ok">確認済み</span>`
                : `<button class="btn btn-primary btn-sm" style="margin-left:auto;"
                      onclick="acknowledge('${esc(x.id)}', this)">読みました</button>`}
            </div>`).join("")
        : `<p class="muted">あなたに割り当てられたパソコンはありません。</p>`;
    } catch (e) {
      el("c-devs").innerHTML = `<div class="banner err">
        <span class="material-symbols-outlined">error</span>
        <div>${esc(e.hint || e.message || "読み込めませんでした")}</div></div>`;
    }
  }

  async function acknowledge(id, btn) {
    el("c-msg").textContent = "";
    try {
      await KPLayout.busy(btn, "記録中…", () => API.acknowledgeDevice(id));
      await load();
    } catch (e) {
      el("c-msg").textContent = e.hint || e.message || "記録できませんでした";
    }
  }
</script>

</body>
</html>
