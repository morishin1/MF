<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>社内情報・お知らせ - エイト</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261024mkt2">
  <link rel="stylesheet" href="css/layout.css?v=20261024mkt2">
  <link rel="stylesheet" href="css/member-design.css">
  <link rel="stylesheet" href="css/notice-ui.css?v=20261024mkt2">
  <script>
    try {
      var kpc = JSON.parse(localStorage.getItem("kp_layout") || "null");
      if (kpc && kpc.appRole) document.documentElement.classList.add("kp-has-sidebar");
    } catch (e) {}
  </script>
</head>
<body class="gw-member-ui">
<div class="wrap notice-page">
  <h1 class="kp-greet">社内情報</h1>
  <p class="kp-greet-sub notice-page-lead">会社からの連絡を確認できます。内容を確認したら「確認して既読にする」を押してください。</p>

  <div id="info-tabs"></div>
  <div class="notice-summary" aria-live="polite">
    <div><span class="number" id="notice-total">—</span> <span class="unit">件のお知らせ</span></div>
    <div class="unread-count" id="notice-unread">読み込み中…</div>
  </div>

  <section class="card notice-panel" aria-label="お知らせ一覧">
    <div class="notice-toolbar">
      <div class="notice-filters" role="group" aria-label="表示を切り替え">
        <button type="button" data-filter="all" aria-pressed="true">すべて <span class="notice-filter-count" id="count-all"></span></button>
        <button type="button" data-filter="unread" aria-pressed="false">未読 <span class="notice-filter-count" id="count-unread"></span></button>
        <button type="button" data-filter="important" aria-pressed="false">重要 <span class="notice-filter-count" id="count-important"></span></button>
        <button type="button" data-filter="read" aria-pressed="false">確認済み <span class="notice-filter-count" id="count-read"></span></button>
      </div>
      <input class="notice-search" id="notice-search" type="search" placeholder="お知らせを検索" aria-label="タイトル・本文で検索">
    </div>
    <div class="notice-found" id="notice-found" role="status"></div>
    <div id="list" class="notice-list"><div class="notice-empty">お知らせを読み込み中…</div></div>
  </section>
</div>

<dialog id="notice-dialog" class="notice-dialog" aria-labelledby="notice-dialog-title"></dialog>

<script src="js/api-client.js?v=20261024mkt2"></script>
<script src="js/device.js?v=20261024mkt2"></script>
<script src="js/layout.js?v=20261024mkt2"></script>
<script src="js/notice-ui.js?v=20261024mkt2"></script>
<script>
  const el = (id) => document.getElementById(id);
  let notices = [];
  let filter = new URLSearchParams(location.search).get("filter") === "unread" ? "unread" : "all";
  let query = "";
  let current = null;
  let deepLinkOpened = false;
  const dialog = el("notice-dialog");
  el("info-tabs").innerHTML = KPLayout.infoTabs("notices");

  KPLayout.init({ active: "notices", roles: ["member", "admin", "owner"] })
    .then((ctx) => { if (ctx) load(); });

  async function load() {
    try {
      const res = await API.listNotices();
      notices = res.notices || [];
      render();
      const id = new URLSearchParams(location.search).get("id");
      if (id && !deepLinkOpened) {
        deepLinkOpened = true;
        openNotice(id);
      }
    } catch (e) {
      el("notice-found").textContent = "";
      el("list").innerHTML = '<div class="notice-empty" role="alert">お知らせを取得できませんでした。<button type="button" id="notice-retry" class="btn btn-secondary btn-sm">再読み込み</button></div>';
      el("notice-retry").addEventListener("click", load, { once:true });
    }
  }

  function render() {
    const counts = {
      all: notices.length,
      unread: notices.filter((n) => !n.read).length,
      important: notices.filter((n) => n.category === "important").length,
      read: notices.filter((n) => n.read).length,
    };
    el("notice-total").textContent = counts.all;
    el("notice-unread").textContent = counts.unread ? "未読 " + counts.unread + " 件" : "未読はありません";
    for (const type of Object.keys(counts)) {
      el("count-" + type).textContent = counts[type];
    }
    for (const button of document.querySelectorAll("[data-filter]")) {
      button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
    }
    const needle = query.trim().toLocaleLowerCase("ja-JP");
    const matches = NoticeUI.sort(notices).filter((n) => {
      if (filter === "unread" && n.read) return false;
      if (filter === "read" && !n.read) return false;
      if (filter === "important" && n.category !== "important") return false;
      return !needle || (String(n.title || "") + " " + String(n.body || "")).toLocaleLowerCase("ja-JP").includes(needle);
    });
    el("notice-found").textContent = "表示 " + matches.length + " 件";
    el("list").innerHTML = matches.length
      ? matches.map((n) => NoticeUI.item(n, false)).join("")
      : '<div class="notice-empty"><span class="material-symbols-outlined" aria-hidden="true">mark_email_read</span>'
          + (counts.all === 0 ? "現在、お知らせはありません。" : (query ? "検索に一致するお知らせはありません。" : "この条件のお知らせはありません。"))
          + '</div>';
  }

  for (const btn of document.querySelectorAll("[data-filter]")) {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      render();
    });
  }
  el("notice-search").addEventListener("input", (ev) => {
    query = ev.target.value;
    render();
  });
  el("list").addEventListener("click", (ev) => {
    const row = ev.target.closest("[data-notice-id]");
    if (row) openNotice(row.dataset.noticeId);
  });

  function openNotice(id) {
    const n = notices.find((notice) => String(notice.id) === String(id));
    if (!n) return;
    current = n;
    dialog.innerHTML = NoticeUI.detail(n);
    if (!dialog.open) dialog.showModal();
  }

  dialog.addEventListener("click", async (ev) => {
    if (ev.target.closest("[data-close]")) {
      dialog.close();
      return;
    }
    const button = ev.target.closest("[data-ack]");
    if (!button || !current || current.read) return;
    button.disabled = true;
    button.textContent = "記録中…";
    try {
      await API.markNoticeRead(current.id);
      current.read = true;
      dialog.close();
      render();
    } catch (e) {
      button.disabled = false;
      button.textContent = "確認して既読にする";
      el("notice-feedback").textContent = e.message || "既読を記録できませんでした。もう一度お試しください。";
    }
  });
  dialog.addEventListener("close", () => {
    current = null;
    const url = new URL(location.href);
    if (url.searchParams.has("id")) {
      url.searchParams.delete("id");
      history.replaceState(null, "", url.pathname + url.search + url.hash);
    }
  });
</script>
</body>
</html>
